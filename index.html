<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:#080808;

color:white;

font-family:Arial,sans-serif;

}

header{

background:#000;

color:#d4af37;

text-align:center;

padding:22px;

font-size:30px;

font-weight:bold;

border-bottom:2px solid #d4af37;

}

.container{

max-width:760px;

margin:auto;

padding:15px;

}

.card{

background:#151515;

border:1px solid #d4af37;

border-radius:14px;

padding:16px;

margin-bottom:16px;

}

.title{

color:#d4af37;

font-size:20px;

font-weight:bold;

margin-bottom:15px;

}

label{

display:block;

color:#aaa;

font-size:13px;

margin-top:10px;

}

select,input{

width:100%;

padding:12px;

margin-top:5px;

border-radius:7px;

border:1px solid #555;

font-size:16px;

}

button{

width:100%;

padding:15px;

margin-top:12px;

border:0;

border-radius:10px;

background:#d4af37;

color:#000;

font-size:17px;

font-weight:bold;

}

.secondary{

background:#222;

color:#d4af37;

border:1px solid #d4af37;

}

.boat{

background:#101010;

border:1px solid #333;

border-radius:10px;

padding:13px;

margin-bottom:12px;

}

.boat h3{

color:#d4af37;

margin-top:0;

}

.status{

margin-top:12px;

padding:12px;

background:#0b0b0b;

border-radius:8px;

font-size:13px;

line-height:1.7;

}

.success{color:#70ff8a}

.error{color:#ff7777}

.warning{color:#ffd166}

.result{

display:flex;

justify-content:space-between;

padding:13px;

margin:7px 0;

background:#222;

border-radius:8px;

}

.score{

color:#d4af37;

font-weight:bold;

}

.big{

font-size:22px;

color:#d4af37;

font-weight:bold;

}

.bet{

padding:13px;

margin:7px 0;

background:#222;

border-radius:8px;

font-size:18px;

}

.hidden{

display:none;

}

</style>

</head>

<body>

<header>🚤 BOAT HUNTER</header>

<div style="text-align:center;color:#aaa;padding:8px;">

人気ではなく期待値で勝つ

</div>

<div class="container">

<!-- HOME -->

<div id="home">

<div class="card">

<div class="title">🏟 レース選択</div>

<label>競艇場</label>

<select id="venue">

<option>桐生</option>

<option>戸田</option>

<option>江戸川</option>

<option>平和島</option>

<option>多摩川</option>

<option>浜名湖</option>

<option>蒲郡</option>

<option>常滑</option>

<option>津</option>

<option>三国</option>

<option>びわこ</option>

<option>住之江</option>

<option>尼崎</option>

<option>鳴門</option>

<option>丸亀</option>

<option>児島</option>

<option>宮島</option>

<option>徳山</option>

<option>下関</option>

<option>若松</option>

<option>芦屋</option>

<option>福岡</option>

<option>唐津</option>

<option>大村</option>

</select>

<label>レース番号</label>

<select id="race">

<option>1R</option>

<option>2R</option>

<option>3R</option>

<option>4R</option>

<option>5R</option>

<option>6R</option>

<option>7R</option>

<option>8R</option>

<option>9R</option>

<option>10R</option>

<option>11R</option>

<option>12R</option>

</select>

<label>予算</label>

<input id="budget"

type="number"

placeholder="例：5000">

<button onclick="openInput()">

🔥 AI解析を開始

</button>

</div>

</div>

<!-- INPUT -->

<div id="inputPage" class="hidden">

<div class="card">

<div class="title">

🌐 無料出走表

</div>

<button

class="secondary"

onclick="getProgram()">

🚤 無料出走表を取得

</button>

<div id="status" class="status">

まだ取得していません

</div>

</div>

<div class="card">

<div class="title">

📊 6艇データ

</div>

<div id="boats"></div>

</div>

<div class="card">

<div class="title">

🌊 水面情報

</div>

<label>風速</label>

<input id="wind" type="number" step="0.1">

<label>風向</label>

<select id="windDir">

<option>無風</option>

<option>追い風</option>

<option>向かい風</option>

<option>左横風</option>

<option>右横風</option>

</select>

<label>波高</label>

<input id="wave" type="number">

<label>進入予想</label>

<input id="entry" placeholder="123456">

</div>

<div class="card">

<div class="title">

💰 オッズ

</div>

<label>本命オッズ</label>

<input id="odds1" type="number" step="0.1">

<label>対抗オッズ</label>

<input id="odds2" type="number" step="0.1">

<label>穴オッズ</label>

<input id="odds3" type="number" step="0.1">

</div>

<button onclick="analyze()">

🔥 BOAT HUNTER解析

</button>

</div>

<!-- RESULT -->

<div id="resultPage" class="hidden">

<div class="card">

<div class="title">

🏆 AI判定

</div>

<div id="judgement"></div>

</div>

<div class="card">

<div class="title">

📊 AIランキング

</div>

<div id="ranking"></div>

</div>

<div class="card">

<div class="title">

🌊 展開予想

</div>

<div id="development"></div>

</div>

<div class="card">

<div class="title">

🎯 的中率重視

</div>

<div id="safe"></div>

</div>

<div class="card">

<div class="title">

💎 回収率重視

</div>

<div id="value"></div>

</div>

<div class="card">

<div class="title">

🔥 穴狙い

</div>

<div id="dark"></div>

</div>

<button onclick="location.reload()">

↩ 最初に戻る

</button>

</div>

</div>

<script>

/* =========================

画面切り替え

========================= */

function openInput(){

document.getElementById("home")

.classList.add("hidden");

document.getElementById("inputPage")

.classList.remove("hidden");

createBoats();

}

/* =========================

6艇入力欄

========================= */

function createBoats(){

let html="";

for(let i=1;i<=6;i++){

html+=`

<div class="boat">

<h3>🚤 ${i}号艇</h3>

<label>選手名</label>

<input id="name${i}" placeholder="選手名">

<label>級別</label>

<select id="class${i}">

<option>A1</option>

<option>A2</option>

<option>B1</option>

<option>B2</option>

</select>

<label>全国勝率</label>

<input id="win${i}" type="number" step="0.01">

<label>当地勝率</label>

<input id="local${i}" type="number" step="0.01">

<label>モーター2連率</label>

<input id="motor${i}" type="number" step="0.1">

<label>平均ST</label>

<input id="st${i}" type="number" step="0.01">

<label>展示タイム</label>

<input id="exhibit${i}" type="number" step="0.01">

</div>

`;

}

document.getElementById("boats").innerHTML=html;

}

/* =========================

無料API

========================= */

async function getProgram(){

const venue=

document.getElementById("venue").value;

const race=

document.getElementById("race").value;

const status=

document.getElementById("status");

status.innerHTML=

"⏳ 無料出走表を取得中...";

try{

const response=await fetch(

"https://boatraceopenapi.github.io/programs/v3/today.json"

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

const data=await response.json();

/*

まずAPIそのものが正常に

読めたことを表示する

*/

window.boatData=data;

status.innerHTML=

"<span class='success'>"+

"✅ 無料API接続成功"+

"</span>"+

"<br>"+

venue+" "+race+

" のデータを解析準備中。"+

"<br><br>"+

"※この無料APIは全国24場を"+

"1日分まとめて提供します。";

}catch(error){

console.error(error);

status.innerHTML=

"<span class='error'>"+

"❌ API取得失敗"+

"</span>"+

"<br>"+

error.message;

}

}

/* =========================

数値

========================= */

function val(id,def){

const e=

document.getElementById(id);

if(!e)return def;

const n=

parseFloat(e.value);

return isNaN(n)?def:n;

}

/* =========================

AI解析

========================= */

function analyze(){

let arr=[];

for(let i=1;i<=6;i++){

let win=val(

"win"+i,

6

);

let local=val(

"local"+i,

6

);

let motor=val(

"motor"+i,

35

);

let st=val(

"st"+i,

0.18

);

let exhibit=val(

"exhibit"+i,

6.85

);

let cls=

document.getElementById(

"class"+i

).value;

let name=

document.getElementById(

"name"+i

).value ||

i+"号艇";

let score=0;

score+=(win-4)*4;

score+=(local-4)*3;

score+=(motor-20)*0.5;

score+=(0.25-st)*30;

score+=(6.95-exhibit)*20;

if(cls==="A1")score+=5;

if(cls==="A2")score+=4;

if(cls==="B1")score+=2;

const course=[

18,13,11,9,6,4

];

score+=course[i-1];

arr.push({

boat:i,

name:name,

score:score

});

}

/* 順位 */

arr.sort(

(a,b)=>b.score-a.score

);

/* 確率 */

let total=0;

arr.forEach(

x=>total+=Math.max(x.score,1)

);

arr.forEach(

x=>x.prob=

Math.max(x.score,1)/total

);

/* 表示 */

document.getElementById(

"inputPage"

).classList.add("hidden");

document.getElementById(

"resultPage"

).classList.remove("hidden");

const a=arr[0];

const b=arr[1];

const c=arr[2];

const d=arr[3];

document.getElementById(

"judgement"

).innerHTML=`

<p>

<span class="big">

◎ 本命 ${a.boat}号艇

</span>

<br>

${a.name}

</p>

<p>

<span class="big">

○ 対抗 ${b.boat}号艇

</span>

<br>

${b.name}

</p>

<p>

<span class="big">

▲ 穴 ${c.boat}号艇

</span>

<br>

${c.name}

</p>

`;

let ranking="";

arr.forEach(

(x,i)=>{

ranking+=`

<div class="result">

<span>

${i+1}位　

${x.boat}号艇　

${x.name}

</span>

<span class="score">

${x.score.toFixed(1)}

</span>

</div>

`;

});

document.getElementById(

"ranking"

).innerHTML=ranking;

document.getElementById(

"development"

).innerHTML=

"1号艇を基本軸として、"+

"選手力・モーター・ST・展示タイムを"+

"総合評価。"+

"<br><br>"+

"中心："+a.boat+"号艇"+

"<br>"+

"相手："+b.boat+"号艇・"+c.boat+"号艇"+

"<br>"+

"穴："+d.boat+"号艇";

document.getElementById(

"safe"

).innerHTML=`

<div class="bet">

${a.boat}-${b.boat}-${c.boat}

</div>

<div class="bet">

${a.boat}-${c.boat}-${b.boat}

</div>

<div class="bet">

${b.boat}-${a.boat}-${c.boat}

</div>

`;

document.getElementById(

"value"

).innerHTML=`

<div class="bet">

${a.boat}-${c.boat}-${d.boat}

</div>

<div class="bet">

${c.boat}-${a.boat}-${b.boat}

</div>

<div class="bet">

${d.boat}-${a.boat}-${c.boat}

</div>

`;

document.getElementById(

"dark"

).innerHTML=`

<div class="bet">

🔥 ${d.boat}-${a.boat}-${b.boat}

</div>

<div class="bet">

🔥 ${d.boat}-${c.boat}-${a.boat}

</div>

<div class="bet">

🔥 ${a.boat}-${d.boat}-${c.boat}

</div>

`;

}

</script>

</body>

</html>
