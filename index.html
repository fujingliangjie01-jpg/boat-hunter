<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  background:#080808;

  color:#fff;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

header{

  background:linear-gradient(135deg,#080808,#211a07);

  border-bottom:1px solid #b8952e;

  padding:18px;

}

}

.card{

.info{

  border-radius:9px;

.racerTop{

  align-items:center;

  gap:8px;

}

.number{

  width:30px;

  height:30px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:6px;

  font-weight:bold;

  color:#000;

}

.n1{background:#fff}

.n2{background:#222;color:#fff;border:1px solid #777}

.n3{background:#e22;color:#fff}

.n4{background:#248cff;color:#fff}

.n5{background:#e5d000}

.n6{background:#20a747;color:#fff}

.racerName{

  font-weight:bold;

}

.small{

  font-size:10px;

  color:#aaa;

  line-height:1.6;

  margin-top:6px;

}

.tech{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:5px;

}

.tech div{

  background:#101010;

  border:1px solid #292929;

  border-radius:6px;

  padding:6px;

  font-size:10px;

  text-align:center;

}

.tech span{

  display:block;

  color:#888;

  margin-bottom:2px;

}

table{

  width:100%;

  border-collapse:collapse;

  font-size:11px;

}

th,

td{

  padding:7px 3px;

  border-bottom:1px solid #292929;

  text-align:center;

}

th{

  color:#d4af37;

}

.strategy{

  background:#171717;

  border-left:3px solid #d4af37;

  padding:9px;

  font-size:11px;

  line-height:1.7;

  margin-top:8px;

}

.exclusion{

  background:#241414;

  border-left:3px solid #e55;

  padding:8px;

  font-size:11px;

  margin-top:6px;

  line-height:1.6;

}

.pickBox{

  background:#151515;

  border:1px solid #333;

  border-radius:9px;

  padding:10px;

  margin-top:9px;

}

.pickTitle{

  color:#d4af37;

  font-weight:bold;

  font-size:14px;

  margin-bottom:6px;

}

.pick{

  display:flex;

  justify-content:space-between;

  gap:8px;

  padding:7px 0;

  border-bottom:1px solid #292929;

  font-size:12px;

}

.pick:last-child{

  border-bottom:0;

}

.prob{

  color:#ffd84d;

  font-weight:bold;

}

.total{

  background:#1c1709;

  border:1px solid #8a6d1c;

  border-radius:8px;

  padding:10px;

  text-align:center;

  color:#d4af37;

  font-weight:bold;

  margin-bottom:8px;

}

.noPick{

  font-size:11px;

  color:#777;

  padding:8px 0;

  line-height:1.6;

}

.footer{

  text-align:center;

  color:#555;

  font-size:10px;

  padding:20px;

}

.loading{

  color:#d4af37;

}

.success{

  color:#4cd964;

}

.error{

  color:#ff5555;

}

@media(max-width:600px){

  .grid2{

    grid-template-columns:1fr;

  }

  .courseGrid{

    grid-template-columns:repeat(2,1fr);

  }

  .racers{

    grid-template-columns:1fr;

  }

}

<script>

/* =====================================================

   BOAT HUNTER

   API v1 完全対応版

===================================================== */

const API_BASE =

"https://boatraceopenapi.github.io/api/v1";

let raceData=null;

let racers=[];

let previewRacers={};

let manualCourses={};

/* =====================================================

   共通

===================================================== */

function n(v){

if(

v===null ||

v===undefined ||

v===""

){

return 0;

}

const x=parseFloat(

String(v)

.replace("%","")

.replace("秒","")

.replace(",","")

);

return Number.isFinite(x) ? x : 0;

}

function esc(v){

return String(v ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

/* =====================================================

   今日の日付 JST

===================================================== */

function todayParts(){

const parts=

new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(new Date());

const year=

parts.find(x=>x.type==="year").value;

const month=

parts.find(x=>x.type==="month").value;

const day=

parts.find(x=>x.type==="day").value;

return{

year,

yyyymmdd:

year+month+day

};

}

/* =====================================================

   過去日付

===================================================== */

function previousDate(base,days){

const y=

Number(base.substring(0,4));

const m=

Number(base.substring(4,6))-1;

const d=

Number(base.substring(6,8));

const date=

new Date(

Date.UTC(y,m,d)

);

date.setUTCDate(

date.getUTCDate()-days

);

return{

year:

String(date.getUTCFullYear()),

date:

String(date.getUTCFullYear())+

String(date.getUTCMonth()+1)

.padStart(2,"0")+

String(date.getUTCDate())

.padStart(2,"0")

};

}

/* =====================================================

   コース初期化

===================================================== */

function initCourses(){

for(let boat=1;boat<=6;boat++){

const el=

document.getElementById(

"course"+boat

);

el.innerHTML="";

for(let course=1;course<=6;course++){

const option=

document.createElement("option");

option.value=course;

option.textContent=

course+"コース";

el.appendChild(option);

}

el.value=boat;

manualCourses[boat]=boat;

el.addEventListener(

"change",

function(){

manualCourses[boat]=

Number(this.value);

}

);

}

}

/* =====================================================

   今回のコース

===================================================== */

function getCourse(boat){

return Number(

manualCourses[boat] || boat

);

}

/* =====================================================

   API JSON

===================================================== */

async function getJSON(url){

const response=

await fetch(

url,

{

cache:"no-store"

}

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

return await response.json();

}

/* =====================================================

   API取得

===================================================== */

async function loadDailyData(){

const parts=

todayParts();

const urls=[

`${API_BASE}/${parts.year}/${parts.yyyymmdd}.json`,

`${API_BASE}/today.json`

];

let lastError=null;

for(const url of urls){

try{

const data=

await getJSON(url);

return{

data,

url

};

}catch(error){

lastError=error;

}

}

throw lastError ||

new Error(

"APIデータ取得失敗"

);

}

/* =====================================================

   v1構造からレース取得

===================================================== */

function getRaceFromV1(

data,

venue,

race

){

const stadiums=

data?.programs?.stadiums;

if(!stadiums){

return null;

}

const stadium=

stadiums[String(venue)];

if(!stadium){

return null;

}

const races=

stadium.races;

if(!races){

return null;

}

return races[String(race)] || null;

}

/* =====================================================

   選手配列

===================================================== */

function extractRacers(

race

){

const source=

race?.racers;

if(!source){

return[];

}

const list=

Object.values(source);

return list

.map((r,index)=>({

...r,

entry_number:

n(

r.entry_number ||

index+1

)

}))

.filter(r=>

r.entry_number>=1 &&

r.entry_number<=6

)

.sort(

(a,b)=>

a.entry_number-b.entry_number

);

}

/* =====================================================

   直前情報

===================================================== */

function getPreview(

race

){

return race?.preview?.racers || {};

}

/* =====================================================

   出走表取得

===================================================== */

async function loadRaceData(){

const venue=

Number(

document.getElementById(

"venue"

).value

);

const race=

Number(

document.getElementById(

"race"

).value

);

const message=

document.getElementById(

"message"

);

message.innerHTML=

`<span class="loading">

⏳ ${venue}場 ${race}R の出走表を取得中...

</span>`;

document.getElementById(

"raceCard"

).style.display="none";

document.getElementById(

"analysisCard"

).style.display="none";

document.getElementById(

"predictionCard"

).style.display="none";

try{

const result=

await loadDailyData();

const data=result.data;

const selected=

getRaceFromV1(

data,

venue,

race

);

if(!selected){

throw new Error(

"指定した場・レースのデータが見つかりません"

);

}

const list=

extractRacers(selected);

if(list.length!==6){

throw new Error(

"出走表が6艇取得できませんでした"

);

}

raceData=selected;

racers=list;

previewRacers=

getPreview(selected);

/* APIの実際の進入を初期値にする */

for(let boat=1;boat<=6;boat++){

const p=

previewRacers[String(boat)] ||

previewRacers[boat] ||

{};

const course=

n(p.course_number);

const el=

document.getElementById(

"course"+boat

);

if(course>=1 && course<=6){

el.value=course;

manualCourses[boat]=course;

}else{

el.value=boat;

manualCourses[boat]=boat;

}

}

renderRace();

document.getElementById(

"raceCard"

).style.display="block";

message.innerHTML=

`<span class="success">

✅ 出走表取得成功

</span>`;

}catch(error){

console.error(error);

message.innerHTML=

`<span class="error">

❌ 出走表取得失敗

<br>

${esc(error.message)}

</span>`;

}

}

/* =====================================================

   選手取得

===================================================== */

function getRacer(boat){

return racers.find(

r=>

n(r.entry_number)===boat

);

}

/* =====================================================

   直前情報取得

===================================================== */

function getPreview(boat){

return(

previewRacers[String(boat)] ||

previewRacers[boat] ||

{}

);

}

/* =====================================================

   級別

===================================================== */

function rankName(number){

const map={

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

return map[n(number)] || "-";

}

/* =====================================================

   出走表表示

===================================================== */

function renderRace(){

const box=

document.getElementById(

"racers"

);

box.innerHTML="";

/* レース情報 */

const info=

document.getElementById(

"raceInfo"

);

info.innerHTML=`

<div class="info">

<strong>

${esc(

raceData.title ||

"レース"

)}

</strong>

<br>

開催日：

${esc(raceData.date || "-")}

<br>

${esc(

raceData.day_number || "-"

)}日目

<br>

距離：

${n(raceData.distance)}m

<br>

締切：

${esc(raceData.closed_at || "-")}

<br>

API：

boatraceopenapi / api v1

</div>

`;

racers.forEach(r=>{

const b=

n(r.entry_number);

const p=

getPreview(b);

const rank=

rankName(r.rank_number);

const actualCourse=

n(p.course_number);

box.innerHTML+=`

<div class="racer">

<div class="racerTop">

<div class="number n${b}">

${b}

</div>

<div class="racerName">

${esc(r.name || "-")}

</div>

</div>

<div class="small">

級別：

${rank}

<br>

登録番号：

${n(r.number) || "-"}

<br>

年齢：

${n(r.age) || "-"}歳

<br>

全国勝率：

${n(

r.national_win_rate

).toFixed(2)}

<br>

全国2連率：

${n(

r.national_top_2_percent

).toFixed(1)}%

<br>

当地勝率：

${n(

r.local_win_rate

).toFixed(2)}

<br>

当地2連率：

${n(

r.local_top_2_percent

).toFixed(1)}%

</div>

<div class="tech">

<div>

<span>今回進入</span>

${getCourse(b)}

</div>

<div>

<span>実進入</span>

${actualCourse || "-"}

</div>

<div>

<span>モーター</span>

${n(r.motor_number) || "-"}

</div>

<div>

<span>モーター2連</span>

${n(

r.motor_top_2_percent

).toFixed(1)}%

</div>

<div>

<span>平均ST</span>

${n(

r.average_start_timing

).toFixed(2)}

</div>

<div>

<span>直前ST</span>

${n(

p.start_timing

).toFixed(2)}

</div>

<div>

<span>展示</span>

${n(

p.exhibition_time

).toFixed(2)}

</div>

<div>

<span>モーター3連</span>

${n(

r.motor_top_3_percent

).toFixed(1)}%

</div>

<div>

<span>ボート2連</span>

${n(

r.boat_top_2_percent

).toFixed(1)}%

</div>

</div>

</div>

`;

});

/* 水面情報 */

const preview=

raceData.preview || {};

info.innerHTML+=`

<div class="info">

🌤️ 天候

<br>

風速：

${n(preview.wind_speed)}m

<br>

波高：

${n(preview.wave_height)}cm

<br>

気温：

${n(preview.air_temperature).toFixed(1)}℃

<br>

水温：

${n(preview.water_temperature).toFixed(1)}℃

</div>

`;

}

/* =====================================================

   スコア

===================================================== */

function scoreBoat(boat){

const r=

getRacer(boat);

if(!r)return 0;

const p=

getPreview(boat);

const course=

getCourse(boat);

let score=0;

/* 全国勝率 */

score+=

n(r.national_win_rate)*7;

/* 当地勝率 */

score+=

n(r.local_win_rate)*4;

/* 全国2連 */

score+=

n(r.national_top_2_percent)*0.12;

/* モーター */

score+=

n(r.motor_top_2_percent)*0.15;

/* 平均ST */

const avgST=

n(r.average_start_timing);

if(avgST>0){

score+=

Math.max(

0,

0.30-avgST

)*20;

}

/* 直前ST */

const st=

n(p.start_timing);

if(st>0){

score+=

Math.max(

0,

0.25-st

)*15;

}

/* 展示タイム */

const exhibition=

n(p.exhibition_time);

if(exhibition>0){

score+=

Math.max(

0,

6.80-exhibition

)*5;

}

/* コース */

const courseBonus={

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

};

score+=

courseBonus[course] || 0;

/* 級別 */

const rank=

rankName(r.rank_number);

if(rank==="A1")score+=5;

if(rank==="A2")score+=2;

if(rank==="B2")score-=2;

return Math.max(

0,

score

);

}

/* =====================================================

   候補生成

===================================================== */

function makeCandidate(

a,

b,

rankings,

type

){

if(a===b)return null;

const A=

rankings.find(

x=>x.boat===a

);

const B=

rankings.find(

x=>x.boat===b

);

if(!A || !B)return null;

/* 1着能力を重視 */

let raw=

A.score*1.35+

B.score*0.75;

/* 逃げ */

if(type==="escape"){

if(getCourse(a)!==1){

return null;

}

raw+=25;

}

/* 差し */

if(type==="sashi"){

if(getCourse(a)===1){

return null;

}

raw+=

10;

}

/* まくり */

if(type==="maki"){

if(getCourse(a)===1){

return null;

}

raw+=

8;

}

/* まくり差し */

if(type==="makiSashi"){

if(getCourse(a)===1){

return null;

}

raw+=

10;

}

/* 人気だけに寄りすぎないよう微調整 */

if(

getCourse(a)===1

){

raw+=8;

}

return{

key:

`${a}-${b}`,

a,

b,

raw:

Math.max(0.01,raw)

};

}

/* =====================================================

   買い目

===================================================== */

function makePool(

rankings,

type

){

const pool=[];

for(let a=1;a<=6;a++){

for(let b=1;b<=6;b++){

const x=

makeCandidate(

a,

b,

rankings,

type

);

if(x){

pool.push(x);

}

}

}

return pool.sort(

(a,b)=>

b.raw-a.raw

);

}

/* =====================================================

   買い目作成

===================================================== */

function buildBets(

rankings

){

const result={

hit:[],

escape:[],

sashi:[],

maki:[],

makiSashi:[],

under:[]

};

const used=

new Set();

/* 的中率 */

const allHit=[];

[

"escape",

"sashi",

"maki",

"makiSashi"

].forEach(type=>{

allHit.push(

...makePool(

rankings,

type

)

);

});

allHit.sort(

(a,b)=>

b.raw-a.raw

);

for(const x of allHit){

if(result.hit.length>=4)break;

if(used.has(x.key))continue;

result.hit.push(x);

used.add(x.key);

}

/* 回収率 */

const types=[

"escape",

"sashi",

"maki",

"makiSashi"

];

types.forEach(type=>{

const pool=

makePool(

rankings,

type

);

for(const x of pool){

if(result[type].length>=4)break;

if(used.has(x.key))continue;

result[type].push(x);

used.add(x.key);

}

});

/* 穴 */

const first=

rankings.find(

x=>x.boat===1

);

for(let boat=2;boat<=6;boat++){

if(

rankings.find(

x=>x.boat===boat

).score <

(first?.score||0)-10

){

const x={

key:`${boat}-1`,

a:boat,

b:1,

raw:

scoreBoat(boat)+

20

};

if(!used.has(x.key)){

result.under.push(x);

}

}

}

result.under=

result.under

.sort(

(a,b)=>

b.raw-a.raw

)

.slice(0,2);

/* 全買い目 */

const all=[

...result.hit,

...result.escape,

...result.sashi,

...result.maki,

...result.makiSashi,

...result.under

];

const totalRaw=

all.reduce(

(sum,x)=>

sum+x.raw,

0

);

if(totalRaw>0){

all.forEach(x=>{

x.probability=

x.raw/totalRaw*100;

});

}

result.total=

all.reduce(

(sum,x)=>

sum+(x.probability||0),

0

);

return result;

}
