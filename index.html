<script>

const API_URL =

"https://boatraceopenapi.github.io/programs/v3/today.json";

const VENUES = {

1:"桐生",

2:"戸田",

3:"江戸川",

4:"平和島",

5:"多摩川",

6:"浜名湖",

7:"蒲郡",

8:"常滑",

9:"津",

10:"三国",

11:"びわこ",

12:"住之江",

13:"尼崎",

14:"鳴門",

15:"丸亀",

16:"児島",

17:"宮島",

18:"徳山",

19:"下関",

20:"若松",

21:"芦屋",

22:"福岡",

23:"唐津",

24:"大村"

};

const CLASS_NAMES = {

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

/* =========================

出走表取得

========================= */

async function getProgram(){

const venue =

Number(

document.getElementById("venue").value

);

const race =

Number(

document.getElementById("race").value

);

const status =

document.getElementById("status");

const programBox =

document.getElementById("program");

status.innerHTML =

"⏳ "+

VENUES[venue]+

" "+

race+

"R の出走表を取得中...";

programBox.innerHTML = "";

try{

const response =

await fetch(API_URL);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

const data =

await response.json();

/*

APIのprogramsから

選択された場・レースを探す

*/

const raceData =

data.programs.find(function(p){

return Number(p.stadium_number) === venue

&&

Number(p.number) === race;

});

if(!raceData){

throw new Error(

VENUES[venue]+

" "+

race+

"R のデータが見つかりません"

);

}

/*

6艇を枠番順に並べる

*/

const boats =

Array.isArray(raceData.boats)

?

raceData.boats.slice().sort(

function(a,b){

return Number(a.racer_boat_number)

-

Number(b.racer_boat_number);

}

)

:

[];

if(boats.length === 0){

throw new Error(

"出走艇データがありません"

);

}

/*

出走表表示

*/

let html = "";

boats.forEach(function(b){

const no =

Number(b.racer_boat_number);

const name =

b.racer_name || "選手名不明";

const grade =

CLASS_NAMES[

Number(b.racer_class_number)

] || "不明";

html += `

<div class="boat">

<div class="boatTop">

<div class="number">

${no}

</div>

<div>

<div class="player">

${name}

</div>

<div class="grade">

${grade}

</div>

</div>

</div>

<div class="info">

全国勝率：

${num(b.racer_national_top_1_percent,2)}

<br>

全国2連率：

${num(b.racer_national_top_2_percent,2)}%

<br>

全国3連率：

${num(b.racer_national_top_3_percent,2)}%

<br>

当地勝率：

${num(b.racer_local_top_1_percent,2)}

<br>

当地2連率：

${num(b.racer_local_top_2_percent,2)}%

<br>

当地3連率：

${num(b.racer_local_top_3_percent,2)}%

<br>

モーター：

${b.racer_assigned_motor_number ?? "-"}

<br>

モーター2連率：

${num(b.racer_assigned_motor_top_2_percent,2)}%

<br>

モーター3連率：

${num(b.racer_assigned_motor_top_3_percent,2)}%

<br>

平均ST：

${num(b.racer_average_start_timing,2)}

</div>

</div>

`;

});

programBox.innerHTML = html;

status.innerHTML =

"<span class='success'>"+

"✅ 出走表取得成功"+

"</span>"+

"<br>"+

VENUES[venue]+" "+race+"R"+

"<br>"+

boats.length+"艇の選手データを取得";

/*

AI解析

*/

runAI(boats);

}

catch(error){

console.error(error);

status.innerHTML =

"<span class='error'>"+

"❌ 取得失敗"+

"</span>"+

"<br>"+

error.message;

}

}

/* =========================

数値処理

========================= */

function num(value,digits){

const n =

Number(value);

if(!Number.isFinite(n)){

return "-";

}

return n.toFixed(digits);

}

/* =========================

AIスコア

========================= */

function scoreBoat(b,index){

const national =

Number(

b.racer_national_top_1_percent

) || 0;

const local =

Number(

b.racer_local_top_1_percent

) || 0;

const motor =

Number(

b.racer_assigned_motor_top_2_percent

) || 0;

const motor3 =

Number(

b.racer_assigned_motor_top_3_percent

) || 0;

const st =

Number(

b.racer_average_start_timing

) || 0.20;

/*

選手力

*/

let score =

national * 8;

/*

当地適性

*/

score +=

local * 5;

/*

モーター

*/

score +=

motor * 0.35;

score +=

motor3 * 0.15;

/*

スタート

*/

score +=

(0.20 - st) * 100;

/*

コース補正

*/

const courseBonus = [

18,

10,

7,

4,

2,

0

];

score +=

courseBonus[index] || 0;

return score;

}

/* =========================

AI解析

========================= */

function runAI(boats){

const ranking =

boats.map(function(b,index){

return {

boat:

Number(b.racer_boat_number),

name:

b.racer_name || "不明",

score:

scoreBoat(b,index)

};

});

ranking.sort(function(a,b){

return b.score-a.score;

});

const first =

ranking[0];

const second =

ranking[1];

const third =

ranking[2];

const fourth =

ranking[3];

document.getElementById(

"analysis"

).classList.remove(

"hidden"

);

/*

本命・対抗・穴

*/

document.getElementById(

"judgement"

).innerHTML = `

<p>

<span class="big">

◎ 本命 ${first.boat}号艇

</span>

<br>

${first.name}

</p>

<p>

<span class="big">

○ 対抗 ${second.boat}号艇

</span>

<br>

${second.name}

</p>

<p>

<span class="big">

▲ 穴 ${third.boat}号艇

</span>

<br>

${third.name}

</p>

`;

/*

ランキング

*/

let rankingHTML = "";

ranking.forEach(function(x,i){

rankingHTML += `

<div class="result">

<span>

${i+1}位　

${x.boat}号艇　

${x.name}

</span>

<span class="score">

${x.score.toFixed(1)}

</span>

</div>

`;

});

document.getElementById(

"ranking"

).innerHTML =

rankingHTML;

/*

展開

*/

document.getElementById(

"development"

).innerHTML =

"基本展開：1号艇のイン逃げを軸に評価。"+

"<br><br>"+

"本命："+first.boat+"号艇"+

"<br>"+

"対抗："+second.boat+"号艇"+

"<br>"+

"穴："+third.boat+"号艇"+

"<br><br>"+

"全国勝率・当地勝率・モーター・ST・枠番を総合評価。";

/*

的中率重視

*/

document.getElementById(

"safe"

).innerHTML = `

<div class="bet">

${first.boat}-${second.boat}-${third.boat}

</div>

<div class="bet">

${first.boat}-${third.boat}-${second.boat}

</div>

<div class="bet">

${first.boat}-${second.boat}-${fourth.boat}

</div>

`;

/*

回収率重視

*/

document.getElementById(

"value"

).innerHTML = `

<div class="bet">

${first.boat}-${third.boat}-${fourth.boat}

</div>

<div class="bet">

${third.boat}-${first.boat}-${second.boat}

</div>

<div class="bet">

${second.boat}-${third.boat}-${first.boat}

</div>

`;

/*

穴狙い

*/

document.getElementById(

"dark"

).innerHTML = `

<div class="bet">

🔥 ${third.boat}-${first.boat}-${fourth.boat}

</div>

<div class="bet">

🔥 ${fourth.boat}-${third.boat}-${first.boat}

</div>

<div class="bet">

🔥 ${third.boat}-${fourth.boat}-${first.boat}

</div>

`;

}
/* =================================================

   BOAT HUNTER AI 強化エンジン

================================================= */

function enhancedAI(){

    if(!selectedProgram ||

       !selectedProgram.boats ||

       selectedProgram.boats.length < 6){

        alert("先に出走表を取得してください。");

        return;

    }

    const boats =

        selectedProgram.boats

        .slice()

        .sort(function(a,b){

            return Number(a.racer_boat_number)

                 - Number(b.racer_boat_number);

        });

    const wind =

        Number(

            document.getElementById("wind").value

        ) || 0;

    const wave =

        Number(

            document.getElementById("wave").value

        ) || 0;

    const entryText =

        document.getElementById("entry").value

        .replace(/[^1-6]/g,"");

    const entry =

        entryText.length === 6

        ? entryText

        : "123456";

    /*

    ================================================

    各艇を評価

    ================================================

    */

    let ranking = boats.map(function(b,index){

        const boat =

            Number(b.racer_boat_number);

        const national1 =

            Number(

                b.racer_national_top_1_percent

            ) || 0;

        const national2 =

            Number(

                b.racer_national_top_2_percent

            ) || 0;

        const national3 =

            Number(

                b.racer_national_top_3_percent

            ) || 0;

        const local1 =

            Number(

                b.racer_local_top_1_percent

            ) || 0;

        const local2 =

            Number(

                b.racer_local_top_2_percent

            ) || 0;

        const local3 =

            Number(

                b.racer_local_top_3_percent

            ) || 0;

        const motor2 =

            Number(

                b.racer_assigned_motor_top_2_percent

            ) || 0;

        const motor3 =

            Number(

                b.racer_assigned_motor_top_3_percent

            ) || 0;

        const st =

            Number(

                b.racer_average_start_timing

            ) || 0.20;

        const cls =

            Number(

                b.racer_class_number

            ) || 3;

        let score = 0;

        /*

        --------------------------------------------

        選手能力

        --------------------------------------------

        */

        score += national1 * 4.0;

        score += national2 * 0.35;

        score += national3 * 0.15;

        /*

        --------------------------------------------

        当地適性

        --------------------------------------------

        */

        score += local1 * 3.0;

        score += local2 * 0.25;

        score += local3 * 0.10;

        /*

        --------------------------------------------

        モーター

        --------------------------------------------

        */

        score += motor2 * 0.45;

        score += motor3 * 0.20;

        /*

        --------------------------------------------

        ST

        --------------------------------------------

        */

        score +=

            Math.max(

                0,

                (0.23 - st) * 100

            );

        /*

        --------------------------------------------

        級別

        --------------------------------------------

        */

        if(cls === 1){

            score += 6;

        }else if(cls === 2){

            score += 4;

        }else if(cls === 3){

            score += 2;

        }

        /*

        --------------------------------------------

        コース補正

        --------------------------------------------

        */

        const courseBonus = [

            22,

            13,

            10,

            7,

            4,

            2

        ];

        score +=

            courseBonus[index] || 0;

        /*

        --------------------------------------------

        風・波補正

        --------------------------------------------

        */

        if(wind >= 5){

            /*

            強風時は外枠の攻めを少し評価

            */

            if(boat >= 4){

                score += 2;

            }

        }

        if(wave >= 4){

            /*

            荒水面ではST・機力を重視

            */

            score +=

                Math.max(

                    0,

                    (motor2 - 30) * 0.10

                );

        }

        return {

            boat:boat,

            name:

                b.racer_name || "不明",

            score:score,

            st:st,

            motor2:motor2,

            motor3:motor3,

            national1:national1,

            national3:national3,

            local1:local1,

            local3:local3

        };

    });

    /*

    ================================================

    ランキング

    ================================================

    */

    ranking.sort(function(a,b){

        return b.score-a.score;

    });

    /*

    ================================================

    AI確率

    ================================================

    */

    let total = 0;

    ranking.forEach(function(x){

        total += Math.max(

            x.score,

            1

        );

    });

    ranking.forEach(function(x){

        x.probability =

            Math.max(

                x.score,

                1

            )

            /

            total

            *

            100;

    });

    const first =

        ranking[0];

    const second =

        ranking[1];

    const third =

        ranking[2];

    const fourth =

        ranking[3];

    /*

    ================================================

    結果表示

    ================================================

    */

    document.getElementById(

        "inputPage"

    ).classList.add("hidden");

    document.getElementById(

        "resultPage"

    ).classList.remove("hidden");

    /*

    ================================================

    本命・対抗・穴

    ================================================

    */

    document.getElementById(

        "judgement"

    ).innerHTML = `

        <div class="aiBox">

        <p>

        <span class="big">

        ◎ 本命 ${first.boat}号艇

        </span>

        <br>

        ${first.name}

        <br>

        AI確率：

        ${first.probability.toFixed(1)}%

        </p>

        <p>

        <span class="big">

        ○ 対抗 ${second.boat}号艇

        </span>

        <br>

        ${second.name}

        <br>

        AI確率：

        ${second.probability.toFixed(1)}%

        </p>

        <p>

        <span class="big">

        ▲ 穴 ${third.boat}号艇

        </span>

        <br>

        ${third.name}

        <br>

        AI確率：

        ${third.probability.toFixed(1)}%

        </p>

        </div>

    `;

    /*

    ================================================

    ランキング

    ================================================

    */

    let rankingHTML = "";

    ranking.forEach(function(x,i){

        rankingHTML += `

        <div class="result">

        <div>

        <b>

        ${i+1}位　

        ${x.boat}号艇　

        ${x.name}

        </b>

        <br>

        <span class="small">

        全国1着率：

        ${x.national1.toFixed(2)}%

        <br>

        全国3連対率：

        ${x.national3.toFixed(2)}%

        <br>

        当地1着率：

        ${x.local1.toFixed(2)}%

        <br>

        当地3連対率：

        ${x.local3.toFixed(2)}%

        <br>

        モーター2連率：

        ${x.motor2.toFixed(2)}%

        <br>

        平均ST：

        ${x.st.toFixed(2)}

        </span>

        </div>

        <div class="score">

        ${x.score.toFixed(1)}

        <br>

        ${x.probability.toFixed(1)}%

        </div>

        </div>

        `;

    });

    document.getElementById(

        "ranking"

    ).innerHTML =

        rankingHTML;

    /*

    ================================================

    展開予想

    ================================================

    */

    let development = "";

    if(entry.startsWith("123")){

        development =

        "枠なり進入を想定。"+

        "<br><br>"+

        "1号艇のイン逃げを基本線。"+

        "<br>"+

        "2号艇の差し、3号艇のまくり差しを警戒。";

    }else{

        development =

        "進入変化を考慮。"+

        "<br><br>"+

        "スタート力の高い艇による攻めを警戒。";

    }

    if(wind >= 5){

        development +=

        "<br><br>"+

        "⚠️ 強風のためスタート・外枠の攻めを通常より重視。";

    }

    if(wave >= 4){

        development +=

        "<br><br>"+

        "⚠️ 波高が高いため、モーター機力を重視。";

    }

    document.getElementById(

        "development"

    ).innerHTML = `

        <div class="aiBox">

        <b>進入予想：</b>

        ${entry}

        <br><br>

        ${development}

        <br><br>

        <b>本命：</b>

        ${first.boat}号艇 ${first.name}

        <br>

        <b>対抗：</b>

        ${second.boat}号艇 ${second.name}

        <br>

        <b>穴：</b>

        ${third.boat}号艇 ${third.name}

        </div>

    `;

    /*

    ================================================

    的中率重視

    ================================================

    */

    document.getElementById(

        "safe"

/* =========================================

   BOAT HUNTER 期待値エンジン

========================================= */

function calculateExpectedValue(){

    const odds = prompt(

        "3連単オッズを入力してください\n例：12.5"

    );

    if(!odds) return;

    const odd = Number(odds);

    if(!Number.isFinite(odd) || odd <= 0){

        alert("正しいオッズを入力してください");

        return;

    }

    const probability = prompt(

        "AI推定的中率を入力してください（％）\n例：12"

    );

    if(!probability) return;

    const prob = Number(probability);

    if(!Number.isFinite(prob) || prob <= 0){

        alert("正しい確率を入力してください");

        return;

    }

    const expectedValue =

        (prob / 100) * odd;

    let judgement = "";

    if(expectedValue >= 1.20){

        judgement =

            "🔥 強く買い候補";

    }else if(expectedValue >= 1.00){

        judgement =

            "🟡 買い候補";

    }else{

        judgement =

            "🔴 見送り";

    }

    alert(

        "BOAT HUNTER 期待値分析\n\n" +

        "AI確率：" +

        prob.toFixed(1) +

        "%\n" +

        "オッズ：" +

        odd.toFixed(1) +

        "倍\n\n" +

        "期待値：" +

        expectedValue.toFixed(2) +

        "\n\n" +

        judgement

    );

}
/* =========================================

   BOAT HUNTER 3連単自動買い目生成

========================================= */

function generateBettingLines(){

    if(!selectedProgram ||

       !selectedProgram.boats ||

       selectedProgram.boats.length < 6){

        alert("先に出走表を取得してください。");

        return;

    }

    const boats =

        selectedProgram.boats

        .slice()

        .sort(function(a,b){

            return Number(a.racer_boat_number)

                 - Number(b.racer_boat_number);

        });

    /*

    AIスコアを再計算

    */

    let ranking = boats.map(function(b,index){

        const national3 =

            Number(b.racer_national_top_3_percent) || 0;

        const local3 =

            Number(b.racer_local_top_3_percent) || 0;

        const motor2 =

            Number(b.racer_assigned_motor_top_2_percent) || 0;

        const motor3 =

            Number(b.racer_assigned_motor_top_3_percent) || 0;

        const st =

            Number(b.racer_average_start_timing) || 0.20;

        const cls =

            Number(b.racer_class_number) || 3;

        let score = 0;

        score += national3 * 0.55;

        score += local3 * 0.35;

        score += motor2 * 0.40;

        score += motor3 * 0.20;

        score +=

            Math.max(0,(0.23-st)*100);

        if(cls === 1) score += 6;

        if(cls === 2) score += 4;

        if(cls === 3) score += 2;

        const courseBonus =

            [22,13,10,7,4,2];

        score += courseBonus[index];

        return {

            boat:Number(b.racer_boat_number),

            name:b.racer_name || "不明",

            score:score

        };

    });

    ranking.sort(function(a,b){

        return b.score-a.score;

    });

    /*

    上位4艇を中心に買い目生成

    */

    const top =

        ranking.slice(0,4);

    let combinations = [];

    /*

    1着候補

    */

    top.forEach(function(a){

        top.forEach(function(b){

            top.forEach(function(c){

                if(

                    a.boat === b.boat ||

                    a.boat === c.boat ||

                    b.boat === c.boat

                ){

                    return;

                }

                /*

                3艇のスコアから

                仮想的な組み合わせ確率を作る

                */

                const raw =

                    Math.max(a.score,1) *

                    Math.max(b.score,1) *

                    Math.max(c.score,1);

                combinations.push({

                    bet:

                        a.boat+"-"+b.boat+"-"+c.boat,

                    score:raw,

                    first:a.boat,

                    second:b.boat,

                    third:c.boat

                });

            });

        });

    });

    /*

    スコア順

    */

    combinations.sort(function(a,b){

        return b.score-a.score;

    });

    /*

    上位10点

    */

    combinations =

        combinations.slice(0,10);

    /*

    正規化

    */

    let total = 0;

    combinations.forEach(function(x){

        total += x.score;

    });

    combinations.forEach(function(x){

        x.probability =

            x.score / total * 100;

    });

    /*

    結果表示

    */

    let html = "";

    combinations.forEach(function(x,i){

        html += `

        <div class="bet">

            <b>

            ${i+1}位　${x.bet}

            </b>

            <br>

            AI推定確率：

            ${x.probability.toFixed(2)}%

            <br>

            AIスコア：

            ${x.score.toFixed(1)}

        </div>

        `;

    });

    /*

    期待値入力欄

    */

    html += `

        <div style="

            margin-top:15px;

            padding:15px;

            background:#111;

            border:1px solid #d4af37;

            border-radius:10px;

        ">

        <b style="color:#d4af37;">

        💎 オッズを入力して期待値判定
<button onclick="generateBettingLines()">

🚤 AI自動買い目を生成

</button>
        </b>

        <br><br>

        <input

            id="betOdds"

            type="number"

            step="0.1"

            placeholder="例：12.5"

        >

        <button

            onclick="evaluateTopBet()"

        >

            💎 1位買い目の期待値を計算

        </button>

        <div

            id="evResult"

            class="status"

        >

        </div>

        </div>

    `;

    /*

    期待値カードを追加

    */

    let resultPage =

        document.getElementById("resultPage");

    let old =

        document.getElementById(

            "autoBetCard"

        );

    if(old){

        old.remove();

    }

    const card =

        document.createElement("div");

    card.id =

        "autoBetCard";

    card.className =

        "card";

    card.innerHTML = `

        <div class="title">

        🚤 AI自動買い目

        </div>

        <div class="status">

        上位4艇を中心に

        3連単を自動生成しています。

        </div>

        ${html}

    `;

    resultPage.appendChild(card);

}

   1位買い目の期待値

========================================= */

function evaluateTopBet(){

    const odds =

        Number(

            document.getElementById(

                "betOdds"

            ).value

        );

    if(!odds || odds <= 0){

        alert(

            "オッズを入力してください。"

        );

        return;

    }

    const probability =

        getTopBetProbability();

    const expectedValue =

        (probability / 100) * odds;

    let judgement;

    if(expectedValue >= 1.30){

        judgement =

            "🔥 強く買いたい";

    }else if(expectedValue >= 1.10){

        judgement =

            "🟢 買い候補";

    }else if(expectedValue >= 1.00){

        judgement =

            "🟡 条件付き";

    }else{

        judgement =

            "🔴 見送り";

    }

    document.getElementById(

        "evResult"

    ).innerHTML =

        "<b>買い目：</b> AIランキング1位"+

        "<br>"+

        "<b>AI確率：</b>"+

        probability.toFixed(2)+"%"+

        "<br>"+

        "<b>オッズ：</b>"+

        odds.toFixed(1)+"倍"+

        "<br><br>"+

        "<span class='big'>"+

        "期待値 "+

        expectedValue.toFixed(2)+

        "</span>"+

        "<br><br>"+

        judgement;

}

/* =========================================

   生成した買い目の1位確率

========================================= */

function getTopBetProbability(){

    /*

    現在表示されている

    AI自動買い目の1位を取得

    */

    const cards =

        document.querySelectorAll(

            "#autoBetCard .bet"

        );

    if(!cards.length){

        return 5;

    }

    const text =

        cards[0].innerText;

    const match =

        text.match(

            /AI推定確率：\s*([0-9.]+)%/

        );

    if(match){

        return Number(match[1]);

    }

    return 5;

}
