<script>

"use strict";

/* =========================================

   API

========================================= */

const API_URL =

"https://boatraceopenapi.github.io/api/v1/today.json";

let raceData=null;

/* =========================================

   進入

========================================= */

let selectedEntry=[1,2,3,4,5,6];

/* =========================================

   共通

========================================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function format(v){

 if(

  v===null||

  v===undefined||

  v===""

 )return "-";

 const n=Number(v);

 return Number.isFinite(n)

  ?n.toFixed(2)

  :String(v);

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined&&

   o[k]!==null&&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

/* =========================================

   選手

========================================= */

function getRank(v){

 return{

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

function getRacers(race){

 if(!race)return[];

 if(

  race.racers&&

  typeof race.racers==="object"

 ){

  return Array.isArray(race.racers)

   ?race.racers

   :Object.values(race.racers);

 }

 if(Array.isArray(race.players))

  return race.players;

 if(

  race.players&&

  typeof race.players==="object"

 )

  return Object.values(race.players);

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)return[];

 if(

  preview.racers&&

  typeof preview.racers==="object"

 ){

  return Array.isArray(preview.racers)

   ?preview.racers

   :Object.values(preview.racers);

 }

 if(Array.isArray(preview.players))

  return preview.players;

 return[];

}

function getBoatNumber(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number ??

  r?.boat

 );

}

function getName(r){

 return r?.name||

 r?.racer_name||

 r?.player_name||

 "選手名不明";

}

function getST(r){

 return num(firstValue(r,[

  "start_timing",

  "st",

  "average_start_timing",

  "start"

 ]));

}

function getExhibition(r){

 return num(firstValue(r,[

  "exhibition_time",

  "display_time",

  "exhibition"

 ]));

}

function getPreviewCourse(r){

 return num(firstValue(r,[

  "course_number",

  "course",

  "entry_course"

 ]));

}

function getLap(r){

 return num(firstValue(r,[

  "one_lap_time",

  "one_lap",

  "lap_time",

  "first_lap_time",

  "first_lap",

  "turn_time",

  "one_round_time",

  "one_round"

 ]));

}

/* =========================================

   API取得

========================================= */

async function fetchJson(url){

 const response=await fetch(

  url+"?t="+Date.now(),

  {

   cache:"no-store",

   headers:{

    Accept:"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

/* =========================================

   レース検索

========================================= */

function findRace(data,stadium,race){

 if(!data)return null;

 /*

  正式構造

  programs.stadiums[番号].races[番号]

 */

 if(

  data.programs &&

  data.programs.stadiums

 ){

  const stadiums=

   data.programs.stadiums;

  const s=

   stadiums[String(stadium)] ??

   stadiums[stadium];

  if(s){

   const races=s.races;

   if(races){

    const r=

     races[String(race)] ??

     races[race];

    if(r)return r;

   }

  }

 }

 /*

  配列・別構造にも対応

 */

 if(Array.isArray(data)){

  for(const item of data){

   const found=

    findRace(

     item,

     stadium,

     race

    );

   if(found)return found;

  }

 }

 /*

  再帰検索

 */

 let found=null;

 function walk(o){

  if(

   found||

   !o||

   typeof o!=="object"

  )return;

  if(

   o.stadium_number!==undefined &&

   num(o.stadium_number)===stadium &&

   o.race_number!==undefined &&

   num(o.race_number)===race &&

   (

    o.racers||

    o.players||

    o.preview

   )

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   if(found)break;

   walk(o[key]);

  }

 }

 walk(data);

 return found;

}

/* =========================================

   出走表表示

========================================= */

function displayRace(race){

 const box=

  document.getElementById("boats");

 box.innerHTML="";

 const racers=

  getRacers(race)

  .sort(

   (a,b)=>

    getBoatNumber(a)-

    getBoatNumber(b)

  );

 if(racers.length<6){

  box.innerHTML=

  `<div class="warning">

   ⚠️ 6艇の選手データを取得できませんでした。

   <br><br>

   APIデータ構造を確認してください。

  </div>`;

  return false;

 }

 const preview=

  getPreviewRacers(race);

 racers.forEach(r=>{

  const boat=

   getBoatNumber(r);

  const p=

   preview.find(

    x=>getBoatNumber(x)===boat

   );

  const exhibition=

   p?getExhibition(p):0;

  const st=

   p?getST(p):getST(r);

  const lap=

   getLap(p||r);

  const d=

   document.createElement("div");

  d.className="boat";

  d.innerHTML=`

   <div class="boat-number">

    ${boat}

   </div>

   <div class="boat-name">

    ${esc(getName(r))}

   </div>

   <div class="boat-class">

    ${getRank(

     r.rank_number ??

     r.rank

    )}

   </div>

   <div class="metric">

    全国 ${format(

     firstValue(r,[

      "national_win_rate",

      "national_rate"

     ])

    )}

   </div>

   <div class="metric">

    当地 ${format(

     firstValue(r,[

      "local_win_rate",

      "local_rate"

     ])

    )}

   </div>

   <div class="metric">

    M${firstValue(r,[

     "motor_number",

     "motor"

    ])??"-"}

   </div>

   <div class="metric">

    M2連 ${format(

     firstValue(r,[

      "motor_top_2_percent",

      "motor_2_rate",

      "motor_second_rate"

     ])

    )}%

   </div>

   <div class="metric">

    M3連 ${format(

     firstValue(r,[

      "motor_top_3_percent",

      "motor_3_rate",

      "motor_third_rate"

     ])

    )}%

   </div>

   <div class="metric">

    ST ${st>0?format(st):"-"}

   </div>

   <div class="metric exhibition">

    展示 ${

     exhibition>0

      ?format(exhibition)+"秒"

      :"－"

    }

   </div>

   <div class="metric lap">

    一周 ${

     lap>0

      ?format(lap)+"秒"

      :"－"

    }

   </div>

  `;

  box.appendChild(d);

 });

 return true;

}

/* =========================================

   直前情報

========================================= */

function displayPreview(race){

 const box=

  document.getElementById(

   "previewInfo"

  );

 const p=race?.preview;

 if(!p){

  box.innerHTML=

  `<div class="warning">

   ⚠️ 直前情報はまだ取得できません。

  </div>`;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">風向</div>

   <div class="info-value">

    ${

     p.wind_direction_name||

     p.wind_direction||

     p.wind_name||

     "-"

    }

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* =========================================

   展示・ST

========================================= */

function displayPreviewRacers(race){

 const box=

  document.getElementById(

   "previewRacers"

  );

 const racers=

  getPreviewRacers(race)

  .sort(

   (a,b)=>

    getBoatNumber(a)-

    getBoatNumber(b)

  );

 if(!racers.length){

  box.innerHTML=

  `<div class="warning">

   ⚠️ 展示・ST・直前進入データなし

  </div>`;

  return;

 }

 let html=`

 <table class="lap-table">

 <thead>

  <tr>

   <th>艇</th>

   <th>直前進入</th>

   <th>ST</th>

   <th>展示</th>

   <th>一周</th>

  </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  const course=

   getPreviewCourse(r);

  const st=

   getST(r);

  const exhibition=

   getExhibition(r);

  const lap=

   getLap(r);

  html+=`

  <tr>

   <td>

    ${getBoatNumber(r)}号艇

   </td>

   <td class="gold">

    ${

     course>0

      ?course+"コース"

      :"－"

    }

   </td>

   <td>

    ${st>0?format(st):"－"}

   </td>

   <td class="yellow">

    ${

     exhibition>0

      ?format(exhibition)+"秒"

      :"－"

    }

   </td>

   <td class="green">

    ${

     lap>0

      ?format(lap)+"秒"

      :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 `;

 box.innerHTML=html;

}

/* =========================================

   一周タイム

========================================= */

function displayLap(race){

 const box=

  document.getElementById(

   "lapInfo"

  );

 const preview=

  getPreviewRacers(race);

  );

function windInfo(){

 const p=

  raceData?.preview;

 if(!p){

  return{

   speed:0,

   head:false,

   tail:false

  };

 }

 const speed=

  num(p.wind_speed);

 const d=

  String(

   p.wind_direction_name||

   p.wind_direction||

   p.wind_name||

   p.wind_dir||

   ""

  );

 return{

  speed,

  head:

   d.includes("向") &&

   !d.includes("追"),

  tail:

 };

/* =========================================

   基本能力

========================================= */

function abilityScore(r,course){

 const national=

  num(firstValue(r,[

   "national_win_rate",

   "national_rate"

  ]));

 const local=

  num(firstValue(r,[

   "local_win_rate",

   "local_rate"

  ]));

 const m2=

  num(firstValue(r,[

   "motor_top_2_percent",

   "motor_2_rate",

   "motor_second_rate"

  ]));

 const m3=

  num(firstValue(r,[

   "motor_top_3_percent",

   "motor_3_rate",

   "motor_third_rate"

  ]));

 const p=

  previewFor(r);

 const st=

  getST(p);

 const exhibition=

  getExhibition(p);

 const lap=

  getLap(p);

 const rank=

  num(

   r.rank_number ??

   r.rank

  );

 let score=0;

 score+=national*6;

 score+=local*3;

 score+=m2*.22;

 score+=m3*.08;

 if(st>0){

  score+=

   Math.max(

    0,

    .30-st

   )*20;

 }

 if(exhibition>0){

  score+=

   Math.max(

    0,

    6.80-exhibition

   )*4;

 }

 if(lap>0){

  score+=

   Math.max(

    0,

    6.00-lap

   )*2;

 }

 score+=({

  1:10,

  2:5,

  3:4,

  4:3,

  5:1,

  6:0

 }[course]||0);

 if(rank===1)

  score+=4;

 if(rank===2)

  score+=2;

 if(rank===4)

  score-=2;

 return score;

}

/* =========================================

   攻め手

========================================= */

function attackCandidates(){

 const entry=

  [...selectedEntry];

 return getRacers(raceData)

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   entry.indexOf(boat)+1;

  const p=

   previewFor(r);

  const st=

   getST(p);

  const exhibition=

   getExhibition(p);

  const m2=

   num(firstValue(r,[

    "motor_top_2_percent",

    "motor_2_rate"

   ]));

  const m3=

   num(firstValue(r,[

    "motor_top_3_percent",

    "motor_3_rate"

   ]));

  let score=0;

  if(st>0){

   score+=

    Math.max(

     0,

     .20-st

    )*45;

  }

  score+=

   Math.max(

    0,

    m2-30

   )*.12;

  score+=

   Math.max(

    0,

    m3-50

   )*.04;

  if(exhibition>0){

   score+=

    Math.max(

     0,

     6.8-exhibition

    )*3;

  }

  if(course===2)

   score+=3;

  if(course===3)

   score+=3;

  if(course>=4)

   score+=5;

  return{

   boat,

   course,

   racer:r,

   score,

   st,

   exhibition,

   m2,

   m3

  };

 })

 .sort(

  (a,b)=>

   b.score-a.score

 );

}

/* =========================================

   イン逃げ評価

========================================= */

function raceTrend(){

 const entry=

  [...selectedEntry];

 const first=

  entry[0];

 const r=

  getRacers(raceData)

  .find(

   x=>

    getBoatNumber(x)===first

  );

 if(!r){

  return{

   inside:50,

   outside:50

  };

 }

 let inside=55;

 const n=

  num(firstValue(r,[

   "national_win_rate",

   "national_rate"

  ]));

 const l=

  num(firstValue(r,[

   "local_win_rate",

   "local_rate"

  ]));

 const m2=

  num(firstValue(r,[

   "motor_top_2_percent",

   "motor_2_rate"

  ]));

 const m3=

  num(firstValue(r,[

   "motor_top_3_percent",

   "motor_3_rate"

  ]));

 const p=

  previewFor(r);

 const st=

  getST(p);

 const exhibition=

  getExhibition(p);

 if(n>=6.5)

  inside+=5;

 if(n<5.5)

  inside-=5;

 if(l>=6.5)

  inside+=4;

 if(l<5.5)

  inside-=4;

 if(m2>=40)

  inside+=5;

 if(m2<30)

  inside-=5;

 if(m3>=60)

  inside+=3;

 if(m3<45)

  inside-=3;

 if(st>0&&st<=.15)

  inside+=6;

 if(st>=.20)

  inside-=7;

 if(

  exhibition>0 &&

  exhibition<=6.75

 )

  inside+=3;

 if(exhibition>=6.95)

  inside-=3;

 const attacks=

  attackCandidates();

 const out=

  attacks.find(

   x=>x.course>=2

  );

 if(

  out &&

  out.score>=16

 )

  inside-=12;

 const w=

  windInfo();

 if(w.speed>=4)

  inside-=4;

 inside=

  Math.max(

   5,

   Math.min(

    95,

    Math.round(inside)

   )

  );

 return{

  inside,

  outside:100-inside

 };

}

function ranking(dev){

  [...selectedEntry];

 return getRacers(raceData)

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   entry.indexOf(boat)+1;

  let score=

   abilityScore(

    r,

    course

   );

  if(dev.type==="イン逃げ"){

   if(boat===entry[0])

    score+=8;

   if(course===2)

    score+=4;

   if(course===3)

    score+=3;

  }else{

   if(boat===dev.attacker)

    score+=10;

   if(course===2)

    score+=2;

  }

  return{

   number:boat,

   name:getName(r),

   racer:r,

   course,

   score

  };

 })

 .sort(

  (a,b)=>

   b.score-a.score

 );

}

/* =========================================

   コース適性

========================================= */

function courseStrength(r,course){

 const n=

  num(firstValue(r,[

   "national_win_rate",

   "national_rate"

  ]));

 const local=

  num(firstValue(r,[

   "local_win_rate",

   "local_rate"

  ]));

 let score=0;

 if(course===1)

  score=n*1.2+local*.5;

 if(course===2)

  score=n*.8+local*.4;

 if(course===3)

  score=n*.9+local*.5;

 if(course===4)

  score=n*1.0+local*.5;

 if(course===5)

  score=n*.75+local*.4;

 if(course===6)

  score=n*.65+local*.3;

 return score;

}

/* =========================================

   攻めの後ろ

========================================= */

function attackFollower(

 attacker,

 boat,

 entry

){

 const ai=

  entry.indexOf(attacker);

 const bi=

  entry.indexOf(boat);

 if(ai<0||bi<0)

  return false;

 return bi>ai;

}

/* =========================================

   買い目理由

========================================= */

function reasonForCombo(

 combo,

 mode,

 ranking,

 dev

){

 const nums=

  combo.split("-").map(Number);

 const tags=[];

 const reasons=[];

 const entry=

  [...selectedEntry];

 nums.forEach(

  (boat,index)=>{

   const r=

    ranking.find(

     x=>x.number===boat

    );

   if(!r)return;

   const p=

    previewFor(r.racer);

   const st=

    getST(p);

   const exhibition=

    getExhibition(p);

   const m2=

    num(firstValue(

     r.racer,

     [

      "motor_top_2_percent",

      "motor_2_rate"

     ]

    ));

   const m3=

    num(firstValue(

     r.racer,

     [

      "motor_top_3_percent",

      "motor_3_rate"

     ]

    ));

   if(index===0){

    if(

     dev.type!=="イン逃げ" &&

     boat===dev.attacker

    ){

     tags.push("🔥攻め手");

     reasons.push(

      `${boat}号艇が攻め手`

     );

    }else if(

     dev.type==="イン逃げ" &&

     boat===entry[0]

    ){

     tags.push("🏠イン逃げ");

     reasons.push(

      `${boat}号艇のイン逃げ`

     );

    }

    if(

     st>0 &&

     st<=.15

    ){

     tags.push("⚡ST");

     reasons.push(

      `${boat}号艇ST${format(st)}`

     );

    }

   }else{

    if(

     dev.type!=="イン逃げ" &&

     attackFollower(

      dev.attacker,

      boat,

      entry

     )

    ){

     tags.push("🎯攻めの後ろ");

     reasons.push(

      `${dev.attacker}号艇の攻めによる展開利`

     );

    }

    if(m2>=40){

     tags.push("⚙️モーター");

     reasons.push(

      `M2連率${format(m2)}%`

     );

    }

    if(m3>=60){

     tags.push("💪機力");

     reasons.push(

      `M3連率${format(m3)}%`

     );

    }

    if(

     exhibition>0 &&

     exhibition<=6.80

    ){

     tags.push("🏁展示");

     reasons.push(

      `展示${format(exhibition)}秒`

     );

    }

   }

  }

 );

 if(!reasons.length){

  if(mode==="hit"){

   reasons.push(

    "AI評価上位と展開を優先"

   );

  }else{

   reasons.push(

    "機力・展開・コース適性から期待値を評価"

   );

  }

 }

 return{

  tags:[

   ...new Set(tags)

  ],

  text:[

   ...new Set(reasons)

  ].join("。")+"。"

 };

}

/* =========================================

   買い目追加

========================================= */

function addPick(

 arr,

 combo,

 ranking,

 dev,

 mode

){

 const n=

  combo.split("-").map(Number);

 if(n.length!==3)

  return;

 if(

  new Set(n).size!==3

 )

  return;

 if(

  arr.some(

   x=>x.combo===combo

  )

 )

  return;

 const reason=

  reasonForCombo(

   combo,

   mode,

   ranking,

   dev

  );

 arr.push({

  combo,

  tags:reason.tags,

  text:reason.text

 });

}

  add(

  );

  add(

  );

  add(

   `${first}-${top[0]}-${top[3]}`

  );

  );

   `${dev.attacker}-${top[1]}-${top[0]}`

  );

/* =========================================

   回収率スコア

========================================= */

function roiScore(

 r,

 course,

 dev

){

 const p=

  previewFor(r);

 const st=

  getST(p);

 const exhibition=

  getExhibition(p);

 const lap=

  getLap(p);

 const m2=

  num(firstValue(r,[

   "motor_top_2_percent",

   "motor_2_rate"

  ]));

 const m3=

  num(firstValue(r,[

   "motor_top_3_percent",

   "motor_3_rate"

  ]));

 let score=0;

 /* モーター */

 if(m2>=45)

  score+=18;

 else if(m2>=40)

  score+=13;

 else if(m2>=35)

  score+=8;

 else if(m2>=30)

  score+=3;

 if(m3>=65)

  score+=12;

 else if(m3>=60)

  score+=8;

 else if(m3>=55)

  score+=4;

 /* ST */

 if(st>0){

  if(st<=.12)

   score+=15;

  else if(st<=.15)

   score+=10;

  else if(st<=.18)

   score+=5;

 }

 /* 展示 */

 if(exhibition>0){

  if(exhibition<=6.70)

   score+=12;

  else if(exhibition<=6.80)

   score+=8;

  else if(exhibition<=6.90)

   score+=3;

 }

 /* 一周 */

 if(lap>0){

  if(lap<=5.90)

   score+=10;

  else if(lap<=6.00)

   score+=6;

  else if(lap<=6.10)

   score+=3;

 }

 /* コース */

 score+=

  courseStrength(

   r,

   course

  )*.25;

 /* 攻め手 */

 if(

  dev.type!=="イン逃げ" &&

  getBoatNumber(r)===

  dev.attacker

 )

  score+=20;

 return score;

}

/* =========================================

   回収率重視 7点

========================================= */

function buildROI(

 ranking,

 dev,

 hit

){

 const arr=[];

 const hitCombos=

  hit.map(

   x=>x.combo

  );

 const entry=

  [...selectedEntry];

 const racers=

  getRacers(raceData);

 const list=

  racers.map(r=>{

   const boat=

    getBoatNumber(r);

   const course=

    entry.indexOf(boat)+1;

   return{

    boat,

    racer:r,

    course,

    score:

     roiScore(

      r,

      course,

      dev

     )

   };

  }).sort(

   (a,b)=>

    b.score-a.score

  );

 const candidates=[];

 /* 攻め手の後ろ */

 if(dev.type!=="イン逃げ"){

  const attacker=

   dev.attacker;

  entry.forEach(

   f=>{

    if(f===attacker)

     return;

    if(

     attackFollower(

      attacker,

      f,

      entry

     )

    ){

     candidates.push({

      combo:

       `${attacker}-${f}-${list[0].boat}`,

      score:100+

       (

        list.find(

         x=>x.boat===f

        )?.score||0

       )

     });

    }

   }

  );

 }

 /* 全組み合わせ */

 for(const a of list){

  for(const b of list){

   if(

    a.boat===b.boat

   )

    continue;

   for(const c of list){

    if(

     c.boat===a.boat||

     c.boat===b.boat

    )

     continue;

    const combo=

     `${a.boat}-${b.boat}-${c.boat}`;

    if(

     hitCombos.includes(combo)

    )

     continue;

    let score=

     a.score+

     b.score+

     c.score;

    if(

     dev.type!=="イン逃げ" &&

     a.boat===dev.attacker

    )

     score+=25;

    if(

     dev.type!=="イン逃げ" &&

     attackFollower(

      dev.attacker,

      b.boat,

      entry

     )

    )

     score+=18;

    if(

     dev.type!=="イン逃げ" &&

     attackFollower(

      dev.attacker,

      c.boat,

      entry

     )

    )

     score+=12;

    candidates.push({

     combo,

     score

    });

   }

  }

 }

 candidates.sort(

  (a,b)=>

   b.score-a.score

 );

 for(const c of candidates){

  if(arr.length>=7)

   break;

  if(

   arr.some(

    x=>x.combo===c.combo

   )

  )

   continue;

  addPick(

   arr,

   c.combo,

   ranking,

   dev,

   "roi"

  );

 }

 return arr.slice(0,7);

}

 /* 展開 */

 const cls=

  trend.inside>=70

   ?"green"

   :

  trend.inside>=50

   ?"yellow"

   :"red";

 document.getElementById(

  "development"

 ).innerHTML=`

 <div class="direction">

  <div class="attack">

   ${

    dev.type==="イン逃げ"

     ?"1号艇イン逃げ"

     :

    `${dev.attacker}号艇 ${dev.type}`

   }

  </div>

  <div class="note">

   ${esc(dev.reason)}

  </div>

 </div>

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">

    イン逃げ期待度

   </div>

   <div class="big-percent ${cls}">

    ${trend.inside}%

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">

    イン以外期待度

   </div>

   <div class="big-percent">

    ${trend.outside}%

   </div>

  </div>

 </div>

 `;

 /* ランキング */

 let html="";

 rank.forEach(

  (r,i)=>{

   html+=`

   <div class="rank">

    <div class="rank-number">

     ${i+1}位

    </div>

    <strong>

     ${r.number}号艇

     ${esc(r.name)}

    </strong>

    <div class="gold">

     ${r.score.toFixed(1)} pt

    </div>

    <div class="score-bar">

     <div

      class="score-fill"

      style="width:${Math.min(

       100,

       Math.max(

        5,

        r.score

       )

      )}%"

     ></div>

    </div>

    <div class="note">

     ${r.course}コース想定

     ／

     1位との差：

     ${

      i===0

       ?"0.0"

       :

      (

       rank[0].score-r.score

      ).toFixed(1)

     }pt

    </div>

   </div>

   `;

  }

 );

 document.getElementById(

  "ranking"

 ).innerHTML=html;

 /* 最終評価 */

 const main=

  rank[0];

 const second=

  rank[1];

 const hole=

  rank[2];

 document.getElementById(

  "final"

 ).innerHTML=`

 <div class="row">

  <span class="left">

   本命

  </span>

  <span class="right gold">

   ${main.number}号艇

   ${esc(main.name)}

  </span>

 </div>

 <div class="row">

  <span class="left">

   対抗

  </span>

  <span class="right">

   ${second.number}号艇

   ${esc(second.name)}

  </span>

 </div>

 <div class="row">

  <span class="left">

   穴

  </span>

  <span class="right orange">

   ${hole.number}号艇

   ${esc(hole.name)}

  </span>

 </div>

 <div class="row">

  <span class="left">

   展開

  </span>

  <span class="right yellow">

   ${

    dev.type==="イン逃げ"

     ?"1号艇イン逃げ"

     :

    `${dev.attacker}号艇 ${dev.type}`

   }

  </span>

 </div>

 <div class="row">

  <span class="left">

   イン逃げ期待度

  </span>

  <span class="right green">

   ${trend.inside}%

  </span>

 </div>

 `;

 /* 買い目 */

 const budget=

  Math.max(

   100,

   num(

    document.getElementById(

     "budget"

    ).value

   )

  );

 const totalBet=14;

 const unit=

  Math.max(

   100,

   Math.floor(

    budget/

    totalBet/

    100

   )*100

  );

 document.getElementById(

  "pickArea"

 ).innerHTML=

  renderPicks(

   "🎯 的中率重視",

   hit,

   unit,

   "pick-main"

  )

  +

  renderPicks(

   "💰 回収率重視",

   roi,

   unit,

   "pick-roi"

  )

  +

  `

  <div class="note">

   ※買い目は各7点。

   <br>

   ※予算${budget.toLocaleString()}円を

   14点に配分した参考金額です。

   <br>

   ※実際の購入ではオッズを確認し、

   期待値が低い組み合わせは削る判断も推奨します。

  </div>

  `;

}

/* =========================================

   出走表取得

========================================= */

async function loadRace(){

 const venue=

  num(

   document.getElementById(

    "venue"

   ).value

  );

 const race=

  num(

   document.getElementById(

    "race"

   ).value

  );

 const status=

  document.getElementById(

   "status"

  );

 const result=

  document.getElementById(

   "result"

  );

 const button=

  document.getElementById(

   "loadButton"

  );

 status.innerHTML=

  `⏳ ${race}Rの出走表を取得中...`;

 button.disabled=true;

 result.classList.add("hidden");

 try{

  const data=

   await fetchJson(

    API_URL

   );

  const raceObject=

   findRace(

    data,

    venue,

    race

   );

  if(!raceObject){

   throw new Error(

    "指定レースがAPIデータ内に見つかりません"

   );

  }

  const ok=

   displayRace(

    raceObject

   );

  if(!ok){

   throw new Error(

    "6艇の選手データを取得できません"

   );

  }

  raceData=

   raceObject;

  selectedEntry=[

   1,2,3,4,5,6

  ];

  createEntryButtons();

  displayPreview(

   raceObject

  );

  displayPreviewRacers(

   raceObject

  );

  displayLap(

   raceObject

  );

  document.getElementById(

   "apiInfo"

  ).innerHTML=

   `API：${API_URL}<br>

    競艇場番号：${venue}<br>

    レース：${race}R<br>

    選手：6艇<br>

    取得時刻：${new Date().toLocaleTimeString("ja-JP")}`;

  result.classList.remove(

   "hidden"

  );

  status.innerHTML=

   `✅ ${race}Rの出走表を取得しました。<br>

    進入を確認して「AI解析開始」を押してください。`;

 }catch(error){

  console.error(error);

  status.innerHTML=

   `❌ 出走表取得失敗<br>

    ${esc(error.message)}`;

  result.classList.add(

   "hidden"

  );

 }finally{

  button.disabled=false;

 }

}

/* =========================================

   ボタン

========================================= */

document.getElementById(

 "loadButton"

).addEventListener(

 "click",

 loadRace

);

document.getElementById(

 "clearButton"

).addEventListener(

 "click",

 clearEntry

);

document.getElementById(

 "analyzeButton"

).addEventListener(

 "click",

 ()=>{

  if(!raceData){

   alert(

    "先に「出走表を取得」してください。"

   );

   return;

  }

  showAnalysis();

  document.getElementById(

   "final"

  ).scrollIntoView({

   behavior:"smooth"

  });

 }

);

/* =========================================

   初期化

========================================= */

createEntryButtons();

</script>
