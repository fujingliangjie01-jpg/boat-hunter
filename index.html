<script>

/* ==================================================

   BOAT HUNTER

   過去決まり手実績対応版

================================================== */

const API =

"https://boatraceopenapi.github.io/api/v1";

const HISTORY_DAYS = 60;

let raceData = null;

let racers = [];

let previewRacers = {};

let resultData = null;

let historyData = {};

let historyLoading = false;

/* ==================================================

   基本

================================================== */

function num(v){

  if(

    v === null ||

    v === undefined ||

    v === ""

  ){

    return 0;

  }

  const n = parseFloat(

    String(v)

    .replace("%","")

    .replace("秒","")

    .replace(",","")

  );

  return Number.isFinite(n) ? n : 0;

}

function esc(v){

  return String(v ?? "")

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;");

}

/* ==================================================

   JSON取得

================================================== */

async function fetchJSON(url){

  const response = await fetch(

    url,

    {

      cache:"no-store"

    }

  );

  if(!response.ok){

    throw new Error(

      "HTTP " + response.status

    );

  }

  return await response.json();

}

/* ==================================================

   今日

================================================== */

function getTodayJST(){

  const now = new Date();

  const parts =

    new Intl.DateTimeFormat(

      "ja-JP",

      {

        timeZone:"Asia/Tokyo",

        year:"numeric",

        month:"2-digit",

        day:"2-digit"

      }

    ).formatToParts(now);

  const y =

    parts.find(x=>x.type==="year").value;

  const m =

    parts.find(x=>x.type==="month").value;

  const d =

    parts.find(x=>x.type==="day").value;

  return `${y}${m}${d}`;

}

/* ==================================================

   日付計算

================================================== */

function dateStringFromDate(date){

  const y =

    date.getFullYear();

  const m =

    String(

      date.getMonth()+1

    ).padStart(2,"0");

  const d =

    String(

      date.getDate()

    ).padStart(2,"0");

  return `${y}${m}${d}`;

}

function previousDate(dateString){

  const y =

    Number(dateString.slice(0,4));

  const m =

    Number(dateString.slice(4,6));

  const d =

    Number(dateString.slice(6,8));

  const date =

    new Date(

      y,

      m-1,

      d

    );

  date.setDate(

    date.getDate()-1

  );

  return dateStringFromDate(date);

}

/* ==================================================

   レース検索

================================================== */

function findSelectedRace(

  data,

  venue,

  race

){

  if(!data) return null;

  const s =

    String(venue)

    .replace(/^0/,"");

  const r =

    String(race);

  try{

    return data

      ?.programs

      ?.stadiums

      ?.[s]

      ?.races

      ?.[r]

      || null;

  }catch(e){

    return null;

  }

}

/* ==================================================

   出走表

================================================== */

async function loadRaceData(){

  const venue =

    document.getElementById(

      "venue"

    ).value;

  const race =

    document.getElementById(

      "race"

    ).value;

  const message =

    document.getElementById(

      "message"

    );

  message.innerHTML =

    "⏳ 最新APIから出走表を取得中...";

  document.getElementById(

    "raceCard"

  ).style.display = "none";

  document.getElementById(

    "analysisCard"

  ).style.display = "none";

  document.getElementById(

    "predictionCard"

  ).style.display = "none";

  historyData = {};

  try{

    const date =

      getTodayJST();

    const url =

      `${API}/${date.slice(0,4)}/${date}.json`;

    const data =

      await fetchJSON(url);

    const selected =

      findSelectedRace(

        data,

        venue,

        race

      );

    if(!selected){

      throw new Error(

        "選択したレースのデータがありません。"

      );

    }

    raceData =

      selected;

    const racerObject =

      selected.racers || {};

    racers =

      Object.values(

        racerObject

      )

      .sort(

        (a,b)=>

          num(a.entry_number) -

          num(b.entry_number)

      );

    if(!racers.length){

      throw new Error(

        "選手データがありません。"

      );

    }

    previewRacers =

      selected.preview?.racers || {};

    resultData =

      selected.result || null;

    renderRace();

    document.getElementById(

      "raceCard"

    ).style.display = "block";

    message.innerHTML =

      "✅ 出走表取得成功<br>" +

      "API：v1<br>" +

      "日付："+date+"<br>" +

      "選手数："+racers.length +

      "<br><br>" +

      "⏳ 過去決まり手実績を取得しています...";

    await loadHistory();

    message.innerHTML =

      "✅ 出走表・過去決まり手実績取得完了<br>" +

      "過去"+HISTORY_DAYS+"日を分析";

  }catch(error){

    console.error(error);

    message.innerHTML =

      "❌ 出走表取得失敗<br>" +

      esc(error.message);

  }

}

/* ==================================================

   選手基本

================================================== */

function boatNumber(r,index){

  return num(

    r.entry_number

  ) || index+1;

}

function racerName(r,index){

  return r.name ||

    ("選手"+boatNumber(r,index));

}

function rankName(r){

  const n =

    num(r.rank_number);

  const map = {

    1:"A1",

    2:"A2",

    3:"B1",

    4:"B2"

  };

  return map[n] || "-";

}

/* ==================================================

   直前情報

================================================== */

function previewForBoat(boat){

  return previewRacers?.[

    String(boat)

  ]

  ||

  previewRacers?.[boat]

  ||

  {};

}

function getCourse(r,boat){

  const p =

    previewForBoat(boat);

  return num(

    p.course_number

  ) || boat;

}

function getST(r,boat){

  const p =

    previewForBoat(boat);

  return num(

    p.start_timing

  );

}

function getExhibition(r,boat){

  const p =

    previewForBoat(boat);

  return num(

    p.exhibition_time

  );

}

/* ==================================================

   モーター

================================================== */

function motorGrade(rate){

  rate = num(rate);

  if(rate >= 70)

    return {

      text:"🔥 エース",

      class:"ace",

      score:18

    };

  if(rate >= 60)

    return {

      text:"⭐ すごく良い",

      class:"good",

      score:14

    };

  if(rate >= 50)

    return {

      text:"◎ 良い",

      class:"good",

      score:10

    };

  if(rate >= 40)

    return {

      text:"○ 普通",

      class:"normal",

      score:6

    };

  if(rate >= 35)

    return {

      text:"△ 悪くない",

      class:"normal",

      score:3

    };

  if(rate > 30)

    return {

      text:"△ やや弱い",

      class:"bad",

      score:-2

    };

  return {

    text:"❌ だめ",

    class:"bad",

    score:-7

  };

}

/* ==================================================

   決まり手

================================================== */

const techniqueNames = {

  1:"逃げ",

  2:"差し",

  3:"まくり",

  4:"まくり差し",

  5:"抜き",

  6:"恵まれ"

};

function techniqueName(n){

  return techniqueNames[

    String(n)

  ] || "不明";

}

const techniqueKeys = [

  "逃げ",

  "差し",

  "まくり",

  "まくり差し",

  "抜き",

  "恵まれ"

];

/* ==================================================

   履歴データ初期化

================================================== */

function emptyHistory(){

  return {

    total:0,

    wins:0,

    techniques:{

      "逃げ":0,

      "差し":0,

      "まくり":0,

      "まくり差し":0,

      "抜き":0,

      "恵まれ":0

    },

    defeats:{

      "差し":0,

      "まくり":0,

      "まくり差し":0,

      "抜き":0,

      "恵まれ":0

    }

  };

}

/* ==================================================

   コース別履歴

================================================== */

function emptyCourseHistory(){

  const result = {};

  for(let c=1;c<=6;c++){

    result[c] =

      emptyHistory();

  }

  return result;

}

/* ==================================================

   履歴集計

================================================== */

function addHistory(

  history,

  result

){

  if(!result) return;

  const resultRacers =

    result.racers || {};

  Object.values(

    resultRacers

  ).forEach(r=>{

    const number =

      num(r.number);

    const course =

      num(r.course_number);

    if(!number || !course)

      return;

    if(!history[number])

      history[number] =

        emptyCourseHistory();

    const h =

      history[number][course];

    h.total++;

    const place =

      num(r.place_number);

    const technique =

      num(result.technique_number);

    if(place===1){

      h.wins++;

      const name =

        techniqueName(

          technique

        );

      if(h.techniques[name] !== undefined){

        h.techniques[name]++;

      }

    }else{

      /*

        1着選手の決まり手を

        「自分が敗れた原因」として集計。

        例：

        1コース選手が2着

        1着が「まくり」

        → その1コース選手の

           まくられ率に加算

      */

      const name =

        techniqueName(

          technique

        );

      if(

        h.defeats[name] !== undefined

      ){

        h.defeats[name]++;

      }

    }

  });

}

/* ==================================================

================================================== */

async function loadHistory(){

  historyLoading = true;

  historyData = {};

  racers.forEach(r=>{

    const number =

      num(r.number);

    if(number){

      historyData[number] =

        emptyCourseHistory();

    }

  });

  const venue =

    document.getElementById(

      "venue"

    ).value;

  const venueNumber =

    String(venue)

    .replace(/^0/,"");

  let date =

    getTodayJST();

  let success = 0;

  const status =

    document.getElementById(

      "historyStatus"

    );

  status.innerHTML =

    `<div class="historyBox">

      <div class="historyTitle">

      ⏳ 過去決まり手データ取得中...

      </div>

      <div class="small">

      過去${HISTORY_DAYS}日を調査しています

      </div>

    </div>`;

  /*

    1日ずつでは遅くなるため

    最大6件ずつ並列取得。

  */

  const dates = [];

  for(

    let i=1;

    i<=HISTORY_DAYS;

    i++

  ){

    date =

      previousDate(date);

    dates.push(date);

  }

  const batchSize = 6;

  for(

    let start=0;

    start<dates.length;

    start+=batchSize

  ){

    const batch =

      dates.slice(

        start,

        start+batchSize

      );

    const promises =

      batch.map(async d=>{

        try{

          const url =

            `${API}/${d.slice(0,4)}/${d}.json`;

          const data =

            await fetchJSON(url);

          const stadium =

            data

            ?.programs

            ?.stadiums

            ?.[venueNumber];

          if(!stadium)

            return false;

          const races =

            stadium.races || {};

          Object.values(

            races

          ).forEach(race=>{

            if(race?.result){

              addHistory(

                historyData,

                race.result

              );

              success++;

            }

          });

          return true;

        }catch(e){

          return false;

        }

      });

    await Promise.all(

      promises

    );

    status.innerHTML =

      `<div class="historyBox">

        <div class="historyTitle">

        ⏳ 過去決まり手データ取得中...

        </div>

        <div class="small">

        ${Math.min(

          start+batchSize,

          dates.length

        )} / ${dates.length}日を確認

        </div>

      </div>`;

  }

  historyLoading = false;

  renderRace();

  status.innerHTML =

    `<div class="historyBox">

      <div class="historyTitle">

      📚 過去決まり手実績

      </div>

      <div class="small">

      過去${HISTORY_DAYS}日間・

      当該競艇場の結果から集計

      </div>

    </div>`;

}

/* ==================================================

   決まり手AI評価

================================================== */

function techniqueScore(

  racer,

  boat

){

  const course =

    getCourse(

      racer,

      boat

    );

  const h =

    getPlayerCourseHistory(

      racer,

      course

    );

  if(!h.total)

    return 0;

  /*

    勝ち方だけを見るのではなく

    そのコースでの得意決まり手を

    AI評価へ反映。

  */

  const wins =

    h.wins;

  if(!wins)

    return 0;

  let score = 0;

  if(

    course===1

  ){

    const escape =

      rate(

        h.techniques["逃げ"],

        wins

      );

    if(

      escape !== null

    ){

      score +=

        Math.max(

          -4,

          Math.min(

            10,

            (escape-50)/5

          )

        );

    }

    const makura =

      rate(

        h.defeats["まくり"],

        h.total

      );

    if(

      makura !== null &&

      makura>=15

    ){

      score -=

        Math.min(

          7,

          (makura-15)/2

        );

    }

  }else{

    const sashi =

      rate(

        h.techniques["差し"],

        wins

      );

    const makuri =

      rate(

        h.techniques["まくり"],

        wins

      );

    const makurisashi =

      rate(

        h.techniques["まくり差し"],

        wins

      );

    if(

      sashi !== null

    )

      score +=

        Math.min(

          4,

          sashi/10

        );

    if(

      makuri !== null

    )

      score +=

        Math.min(

          4,

          makuri/10

        );

    if(

      makurisashi !== null

    )

      score +=

        Math.min(

          4,

          makurisashi/10

        );

  }

  return score;

}

/* ==================================================

   AIスコア

================================================== */

function calcScore(

  r,

  index

){

  const boat =

    boatNumber(

      r,

      index

    );

  const course =

    getCourse(

      r,

      boat

    );

  const national =

    num(

      r.national_win_rate

    );

  const local =

    num(

      r.local_win_rate

    );

  const motor =

    num(

      r.motor_top_2_percent

    );

  const avgST =

    num(

      r.average_start_timing

    );

  const st =

    getST(

      r,

      boat

    );

  const exhibition =

    getExhibition(

      r,

      boat

    );

  let score = 0;

  score +=

    national * 6;

  score +=

    local * 3;

  score +=

    motorGrade(

      motor

    ).score;

  if(avgST>0){

    if(avgST<=0.12)

      score+=10;

    else if(avgST<=0.15)

      score+=7;

    else if(avgST<=0.18)

      score+=4;

    else if(avgST<=0.22)

      score+=1;

    else

      score-=3;

  }

  if(st>0){

    if(st<=0.10)

      score+=7;

    else if(st<=0.13)

      score+=5;

    else if(st<=0.16)

      score+=3;

    else if(st>=0.22)

      score-=3;

  }

  if(exhibition>0){

    if(exhibition<=6.70)

      score+=8;

    else if(exhibition<=6.80)

      score+=5;

    else if(exhibition<=6.90)

      score+=2;

    else if(exhibition>=7.10)

      score-=3;

  }

  const courseBonus = {

    1:12,

    2:7,

    3:6,

    4:5,

    5:2,

    6:0

  };

  score +=

    courseBonus[

      course

    ] || 0;

  const rank =

    rankName(r);

  if(rank==="A1")

    score+=6;

  else if(rank==="A2")

    score+=3;

  else if(rank==="B2")

    score-=2;

  /*

    ★過去決まり手実績

  */

  score +=

    techniqueScore(

      r,

      boat

    );

  return Math.round(

    score*100

  )/100;

}

function insideRate(){

  const first =

    racers.find(

      (r,i)=>

        boatNumber(

          r,

          i

        )===1

    );

  if(!first)

    return 50;

  let rateValue =

    num(

      first.national_top_2_percent

    );

  const local =

    num(

      first.local_top_2_percent

    );

  if(local>0){

    rateValue =

      (rateValue+local)/2;

  }

  if(rateValue<=0)

    rateValue=50;

  /*

    過去1コース逃げ率を

    追加補正

  */

  const h =

    getPlayerCourseHistory(

      first,

      getCourse(first,1)

    );

  if(

    h.total>0 &&

    h.wins>0

  ){

    const escape =

      rate(

        h.techniques["逃げ"],

        h.total

      );

    if(

      escape !== null

    ){

      rateValue =

        rateValue*0.65 +

        escape*0.35;

    }

  }

  return Math.min(

    90,

    Math.max(

      25,

      rateValue

    )

  );

}

/* ==================================================

   組み合わせ

================================================== */

function combinationScore(

  a,

  b,

  c,

  ranking,

  inside

){

  const ra =

    ranking.find(

      x=>x.boat===a

    );

  const rb =

    ranking.find(

      x=>x.boat===b

    );

  const rc =

    ranking.find(

      x=>x.boat===c

    );

  if(

    !ra ||

    !rb ||

    !rc

  )

    return 0;

  let score =

    ra.score*1.35 +

    rb.score +

    rc.score*.75;

  if(a===1){

    if(inside>=55)

      score+=12;

    else if(inside>=50)

      score+=5;

    else

      score-=10;

  }

  if(

    b===1 ||

    c===1

  ){

    score +=

      inside<50

      ?2

      :5;

  }

  const st =

    getST(

      ra.racer,

      a

    );

  if(st>0){

    score +=

      Math.max(

        0,

        (0.25-st)*10

      );

  }

  return Math.max(

    .1,

    score

  );

}

/* ==================================================

   プール

================================================== */

function makePool(

  ranking,

  inside

){

  const candidates =

    ranking

    .slice(0,6)

    .map(

      x=>x.boat

    );

  const pool=[];

  for(

    const a of candidates

  )

  for(

    const b of candidates

  ){

    if(a===b)

      continue;

    for(

      const c of candidates

    ){

      if(

        a===c ||

        b===c

      )

        continue;

      pool.push({

        key:

          `${a}-${b}-${c}`,

        a,b,c,

        raw:

          combinationScore(

            a,

            b,

            c,

            ranking,

            inside

          )

      });

    }

  }

  return pool.sort(

    (a,b)=>

      b.raw-a.raw

  );

}

/* ==================================================

   確率

================================================== */

function probabilities(

  picks

){

  if(!picks.length)

    return [];

  const total =

    picks.reduce(

      (s,x)=>

        s+x.raw,

      0

    );

  return picks.map(

    x=>({

      ...x,

      probability:

        x.raw /

        total *

        100

    })

  );

}

/* ==================================================

   重複排除

================================================== */

function removeDuplicates(

  picks,

  used

){

  return picks.filter(

    x=>!used.has(x.key)

  );

}

/* ==================================================

   的中重視

================================================== */

function hitPicks(

  ranking,

  inside

){

  const pool =

    makePool(

      ranking,

      inside

    );

  let result=[];

  if(inside>=55){

    result =

      pool

      .filter(

        x=>x.a===1

      )

      .slice(0,6);

  }else if(inside>=50){

    result = [

      ...pool

      .filter(

        x=>x.a===1

      )

      .slice(0,3),

      ...pool

      .filter(

        x=>x.a!==1

      )

      .slice(0,3)

    ];

  }else{

    result =

      pool

      .filter(

        x=>x.a!==1

      )

      .slice(0,6);

  }

  return probabilities(

    result

  );

}

/* ==================================================

   回収重視

   的中重視との重複を避ける

================================================== */

function recoveryPicks(

  ranking,

  inside,

  used

){

  const pool =

    makePool(

      ranking,

      inside

    );

  const heads =

    ranking

    .slice(0,5)

    .map(

      x=>x.boat

    );

  let result=[];

  for(

    const head of heads

  ){

    result.push(

      ...pool

      .filter(

        x=>

          x.a===head &&

          !used.has(x.key)

      )

      .slice(0,5)

    );

  }

  const map =

    new Map();

  result.forEach(

    x=>{

      if(

        !used.has(x.key) &&

        !map.has(x.key)

      ){

        map.set(

          x.key,

          x

        );

      }

    }

  );

  result =

    [...map.values()]

    .sort(

      (a,b)=>

        b.raw-a.raw

    )

    .slice(0,8);

  return probabilities(

    result

  );

}

    .sort(

      (a,b)=>

        b.raw-a.raw

    )

    .slice(0,6);

  return probabilities(

    result

  );

}

/* ==================================================

   ランキング表示

================================================== */

function renderRanking(

  ranking

){

  let html = `

  <table class="rankTable">

  <tr>

  <th>順位</th>

  <th>艇</th>

  <th>選手</th>

  <th>AI評価</th>

  <th>モーター</th>

  </tr>

  `;

  ranking.forEach(

    (x,i)=>{

      const motor =

        num(

          x.racer.motor_top_2_percent

        );

      const grade =

        motorGrade(

          motor

        );

      html += `

      <tr>

      <td>

      ${i+1}

      </td>

      <td>

      ${x.boat}号艇

      </td>

      <td>

      ${esc(

        x.racer.name

      )}

      </td>

      <td>

      <strong>

      ${x.score.toFixed(1)}

      </strong>

      </td>

      <td>

      <span

      class="badge ${grade.class}"

      >

      ${

        motor

        ? motor.toFixed(1)+"%"

        : "-"

      }

      </span>

      </td>

      </tr>

      `;

    }

  );

  html += `

  </table>

  `;

  document.getElementById(

    "ranking"

  ).innerHTML = html;

}

/* ==================================================

   買い目表示

================================================== */

function renderPicks(

  id,

  picks,

  className

){

  const el =

    document.getElementById(

      id

    );

  if(!picks.length){

    el.innerHTML =

      `

      <div class="warning">

      該当買い目なし

      </div>

      `;

    return;

  }

  el.innerHTML =

    picks

    .map(

      x=>`

      <div

      class="pick ${className}"

      >

      <span>

      ${x.key}

      </span>

      <span class="prob">

      ${x.probability.toFixed(1)}%

      </span>

      </div>

      `

    )

    .join("");

}

/* ==================================================

   AI解析

================================================== */

function runAnalysis(){

  if(!racers.length){

    alert(

      "先に出走表を取得してください"

    );

    return;

  }

  if(historyLoading){

    alert(

      "過去データの取得が終わるまで待ってください"

    );

    return;

  }

  const ranking =

    createRanking();

  const inside =

    insideRate();

  renderRanking(

    ranking

  );

  /*

    まず的中重視

  */

  const hit =

    hitPicks(

      ranking,

      inside

    );

  const used =

    new Set(

      hit.map(

        x=>x.key

      )

    );

  /*

    次に回収重視

    的中重視と被らない

  */

  const recovery =

    recoveryPicks(

      ranking,

      inside,

      used

    );

  recovery.forEach(

    x=>used.add(x.key)

  );

  /*

    最後に穴

    2種類とも被らない

  */

  const under =

    underPicks(

      ranking,

      inside,

      used

    );

  const top =

    ranking[0];

  const second =

    ranking[1];

  const fourth =

    ranking[3];

  let judgement;

  if(inside>=55)

    judgement =

      "イン逃げを厚く評価";

  else if(inside>=50)

    judgement =

      "イン逃げと他の決着を半々で評価";

  else

    judgement =

      "イン逃げを軽視";

  /*

    1号艇の過去実績

  */

  const first =

    racers.find(

      (r,i)=>

        boatNumber(r,i)===1

    );

  let firstHistoryText =

    "データ不足";

  if(first){

    const firstCourse =

      getCourse(

        first,

        1

      );

    const h =

      getPlayerCourseHistory(

        first,

        firstCourse

      );

    if(h.total){

      const escape =

        rate(

          h.techniques["逃げ"],

          h.total

        );

      const sashi =

        rate(

          h.defeats["差し"],

          h.total

        );

      const makuri =

        rate(

          h.defeats["まくり"],

          h.total

        );

      const makurisashi =

        rate(

          h.defeats["まくり差し"],

          h.total

        );

      firstHistoryText =

        `過去${h.total}走 ` +

        `逃げ${escape===null

          ?"—"

          :escape.toFixed(1)+"%"}` +

        `／差され${sashi===null

          ?"—"

          :sashi.toFixed(1)+"%"}` +

        `／まくられ${makuri===null

          ?"—"

          :makuri.toFixed(1)+"%"}` +

        `／まくり差し${makurisashi===null

          ?"—"

          :makurisashi.toFixed(1)+"%"}`;

    }

  }

  document.getElementById(

    "forecast"

  ).innerHTML = `

  <p>

  <span class="highlight">

  1号艇評価：

  </span>

  ${inside.toFixed(1)}%

  → ${judgement}

  </p>

  <p>

  <span class="highlight">

  1号艇過去決まり手：

  </span>

  ${firstHistoryText}

  </p>

  <p>

  <span class="highlight">

  本命：

  </span>

  ${

    top

    ?

    `${top.boat}号艇

    ${esc(top.racer.name)}`

    :

    "-"

  }

  </p>

  <p>

  <span class="highlight">

  対抗：

  </span>

  ${

    second

    ?

    `${second.boat}号艇

    ${esc(second.racer.name)}`

    :

    "-"

  }

  </p>

  <p>

  <span class="highlight">

  穴：

  </span>

  ${

    fourth

    ?

    `${fourth.boat}号艇

    ${esc(fourth.racer.name)}`

    :

    "-"

  }

  </p>

  <p>

  <span class="highlight">

  AI評価差：

  </span>

  ${

    ranking.length>=2

    ?

    (

      ranking[0].score -

      ranking[1].score

    ).toFixed(1)

    :

    "-"

  }

  </p>

  <div class="strategy">

  <strong>

  🧠 AI判断

  </strong>

  <br>

  選手能力・全国勝率・当地勝率・

  モーター・平均ST・直前ST・

  展示タイム・進入コースに加えて、

  <strong>

  過去の進入コース別決まり手実績

  </strong>

  を評価。

  <br><br>

  的中重視・回収重視・大穴は

  同じ買い目を重複させません。

  <br><br>

  <strong>

  ※表示％はAI内部スコアを相対化した値であり、

  実オッズから算出した払戻期待値ではありません。

  </strong>

  </div>

  `;

  renderPicks(

    "hitPicks",

    hit,

    "hit"

  );

  renderPicks(

    "recoveryPicks",

    recovery,

    "recovery"

  );

  renderPicks(

    "underPicks",

    under,

    "under"

  );

  document.getElementById(

    "analysisCard"

  ).style.display =

    "block";

  document.getElementById(

    "predictionCard"

  ).style.display =

    "block";

}

</script>
