<script>

/* =========================

   基本設定

========================= */

const API_V3 =

"https://boatraceopenapi.github.io/programs/v3";

const API_V2 =

"https://boatraceopenapi.github.io/programs/v2";

let raceData=null;

let racers=[];

let preview={};

let history={};

let manualCourses={};

/* =========================

   共通

========================= */

function n(v){

if(v===null||v===undefined||v==="")

return 0;

const x=parseFloat(

String(v)

.replace("%","")

.replace("秒","")

.replace(",","")

);

return Number.isFinite(x)?x:0;

}

function esc(v){

return String(v??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;");

}

function today(){

const d=new Date();

const parts=

new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(d);

return(

parts.find(x=>x.type==="year").value+

parts.find(x=>x.type==="month").value+

parts.find(x=>x.type==="day").value

);

}

function previousDate(base,days){

const y=n(base.slice(0,4));

const m=n(base.slice(4,6))-1;

const d=n(base.slice(6,8));

const date=new Date(

Date.UTC(y,m,d)

);

date.setUTCDate(

date.getUTCDate()-days

);

return(

date.getUTCFullYear()+

String(date.getUTCMonth()+1).padStart(2,"0")+

String(date.getUTCDate()).padStart(2,"0")

);

}

/* =========================

   コース入力

========================= */

function initCourses(){

for(let b=1;b<=6;b++){

const el=

document.getElementById(

"course"+b

);

for(let c=1;c<=6;c++){

const op=

document.createElement("option");

op.value=c;

op.textContent=

c+"コース";

el.appendChild(op);

}

el.value=b;

manualCourses[b]=b;

el.onchange=()=>{

manualCourses[b]=

Number(el.value);

};

}

}

function getCourse(boat){

return Number(

manualCourses[boat]||

boat

);

}

/* =========================

   API

========================= */

async function getJSON(url){

const r=

await fetch(

url,

{cache:"no-store"}

);

if(!r.ok)

throw new Error(

"HTTP "+r.status

);

return await r.json();

}

/* =========================

   レース検索

========================= */

function findRace(data,venue,race){

if(!data)

return null;

/*

 API構造が多少変わっても

再帰的に探す

*/

function search(obj){

if(!obj||typeof obj!=="object")

return null;

if(

obj.race_number &&

Number(obj.race_number)===Number(race)

){

if(

obj.racers||

obj.entries||

obj.program

){

return obj;

}

}

for(

const key of Object.keys(obj)

){

const value=obj[key];

if(

typeof value==="object"

){

const found=

search(value);

if(found)

return found;

}

}

return null;

}

return search(data);

}

/* =========================

   出走表取得

========================= */

async function loadRaceData(){

const venue=

document.getElementById("venue").value;

const race=

document.getElementById("race").value;

const msg=

document.getElementById("message");

msg.innerHTML=

"⏳ 出走表を取得中...";

try{

const date=today();

let data=null;

let used="";

try{

data=

await getJSON(

`${API_V3}/${date}/${venue}/${race}.json`

);

used="v3";

}catch(e){

data=

await getJSON(

`${API_V2}/${date}/${venue}/${race}.json`

);

used="v2";

}

const selected=

findRace(

data,

venue,

race

)||data;

raceData=selected;

let list=

selected.racers||

selected.entries||

selected.program?.racers||

[];

if(!Array.isArray(list))

list=Object.values(list);

racers=

list

.map((r,i)=>{

const copy={

...r

};

copy.entry_number=

n(

r.entry_number||

r.boat_number||

r.boat||

i+1

);

return copy;

})

.filter(r=>

r.entry_number>=1&&

r.entry_number<=6

)

.sort(

(a,b)=>

a.entry_number-

b.entry_number

);

if(racers.length!==6){

throw new Error(

"6艇の出走表を取得できませんでした"

);

}

preview=

selected.preview?.racers||

selected.preview||

{};

for(let b=1;b<=6;b++){

const el=

document.getElementById(

"course"+b

);

el.value=b;

manualCourses[b]=b;

}

renderRace();

document.getElementById(

"raceCard"

).style.display="block";

msg.innerHTML=

`✅ 出走表取得成功（API ${used}）`;

}catch(e){

console.error(e);

msg.innerHTML=

"❌ 出走表取得失敗<br>"+

esc(e.message);

}

}

/* =========================

   選手表示

========================= */

function getRacer(boat){

return racers.find(

r=>n(r.entry_number)===boat

);

}

function getPreview(boat){

return(

preview[boat]||

preview[String(boat)]||

{}

);

}

function rank(r){

const v=

r.rank||

r.class||

r.grade||

"";

return String(v);

}

function renderRace(){

const box=

document.getElementById("racers");

box.innerHTML="";

racers.forEach(r=>{

const b=

n(r.entry_number);

const p=

getPreview(b);

box.innerHTML+=`

<div class="racer">

<div class="racerTop">

<div class="number n${b}">

${b}

</div>

<div class="racerName">

${esc(

r.name||

r.racer_name||

"-"

)}

</div>

</div>

<div class="small">

級別：

${esc(rank(r)||"-")}

<br>

登録番号：

${esc(

r.number||

r.racer_number||

"-"

)}

<br>

全国勝率：

${n(

r.national_win_rate||

r.win_rate||

r.national_win

).toFixed(2)}

<br>

当地勝率：

${n(

r.local_win_rate||

r.local_win

).toFixed(2)}

<br>

モーター2連率：

${n(

r.motor_top_2_percent||

r.motor_2rentai||

r.motor_2_rate

).toFixed(1)}%

</div>

<div class="tech">

<div>

<span>今回進入</span>

${getCourse(b)}

</div>

<div>

<span>モーター</span>

${esc(

r.motor_number||

r.motor||

"-"

)}

</div>

<div>

<span>平均ST</span>

${n(

r.average_start_timing||

r.average_st

).toFixed(2)}

</div>

<div>

<span>直前ST</span>

${n(

p.start_timing||

p.st

).toFixed(2)}

</div>

<div>

<span>展示</span>

${n(

p.exhibition_time||

p.exhibition

).toFixed(2)}

</div>

<div>

<span>当地2連</span>

${n(

r.local_top_2_percent||

r.local_2_rate

).toFixed(1)}%

</div>

</div>

</div>

`;

});

}

/* =========================

   過去データ

========================= */

async function loadHistory(){

history={};

const base=today();

for(let b=1;b<=6;b++){

history[b]=[];

const racer=

getRacer(b);

if(!racer)

continue;

const targetNumber=

String(

racer.number||

racer.racer_number||

""

);

const targetCourse=

getCourse(b);

for(let d=1;d<=90;d++){

if(history[b].length>=10)

break;

const date=

previousDate(base,d);

let data;

try{

data=

await getJSON(

`${API_V3}/${date}.json`

);

}catch(e){

try{

data=

await getJSON(

`${API_V2}/${date}.json`

);

}catch(e2){

continue;

}

}

const found=

findPastRaces(

data,

targetNumber,

targetCourse

);

for(const x of found){

if(history[b].length>=10)

break;

history[b].push(x);

}

}

}

renderHistory();

}

function findPastRaces(

data,

number,

course

){

const result=[];

function walk(obj){

if(

!obj||

typeof obj!=="object"

)

return;

const racersObj=

obj.racers||

obj.entries||

obj.program?.racers;

const resultObj=

obj.result||

obj.results;

if(

racersObj&&

resultObj

){

let rs=

Array.isArray(racersObj)

?racersObj

:Object.values(racersObj);

let results=

Array.isArray(resultObj)

?resultObj

:Object.values(resultObj);

const r=

rs.find(

x=>String(

x.number||

x.racer_number||

x.register_number

)===number

);

if(r){

const boat=

n(

r.entry_number||

r.boat_number||

r.boat

);

let rr=

results.find(

x=>

n(

x.entry_number||

x.boat_number||

x.boat

)===boat

);

if(!rr)

rr=results.find(

x=>

String(

x.number||

x.racer_number||

""

)===number

);

const c=

n(

rr?.course_number||

rr?.course||

r.course_number

);

if(c===course){

const technique=

n(

rr?.technique_number||

rr?.winning_technique||

rr?.decision_number

);

result.push({

date:

obj.date||

obj.race_date||

"",

course:c,

place:

n(

rr?.place_number||

rr?.rank||

rr?.arrival

),

technique:technique

});

}

}

}

for(

const k of Object.keys(obj)

){

if(

typeof obj[k]==="object"

){

walk(obj[k]);

}

}

}

walk(data);

return result;

}

/* =========================

   決まり手

========================= */

function methodStats(boat){

const rows=

history[boat]||[];

const total=rows.length;

let escape=0;

let sashi=0;

let maki=0;

let makiSashi=0;

rows.forEach(x=>{

/*

 逃げは1コースのみ

*/

if(

x.technique===1 &&

x.course===1

)

escape++;

/*

 差し・まくり・まくり差しは

 2〜6コースのみ

*/

if(

x.course>=2 &&

x.technique===2

)

sashi++;

if(

x.course>=2 &&

x.technique===3

)

maki++;

if(

x.course>=2 &&

x.technique===4

)

makiSashi++;

});

const pct=

v=>

total?

v/total*100:

0;

return{

total,

escape:pct(escape),

sashi:pct(sashi),

maki:pct(maki),

makiSashi:pct(makiSashi)

};

}

/* =========================

   1号艇まくられ率

========================= */

function firstBoatInfo(){

const s=

methodStats(1);

const first=

getRacer(1);

let escape=s.escape;

if(!s.total){

escape=

n(

first?.national_top_1_percent

||

first?.win_rate

);

}

escape=

Math.max(

0,

Math.min(100,escape)

);

return{

escape,

maru:

100-escape

};

}

/* =========================

function scoreBoat(b){

const r=

getRacer(b);

if(!r)

return 0;

const course=

getCourse(b);

const s=

methodStats(b);

let score=0;

score+=

n(

r.national_win_rate||

r.win_rate

)*7;

score+=

n(

r.local_win_rate

)*4;

score+=

n(

r.motor_top_2_percent||

r.motor_2_rate

)*.15;

const st=

n(

r.average_start_timing||

r.average_st

);

if(st>0){

score+=

Math.max(

0,

.30-st

)*20;

}

const courseBonus={

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

};

score+=

courseBonus[course]||0;

score+=

s.escape*.15;

score+=

s.sashi*.08;

score+=

s.maki*.08;

score+=

s.makiSashi*.10;

if(

String(rank(r))

.toUpperCase()

.includes("A1")

)

score+=5;

if(

String(rank(r))

.toUpperCase()

.includes("B2")

)

score-=2;

return Math.max(

0,

score

);

}

/* =========================

   2連単候補

========================= */

function candidate(

a,

b,

method,

rankings

){

if(a===b)

return null;

const A=

rankings.find(

x=>x.boat===a

);

const B=

rankings.find(

x=>x.boat===b

);

if(!A||!B)

return null;

const s=

methodStats(a);

let raw=

A.score*1.3+

B.score*.8;

if(method==="escape"){

if(getCourse(a)!==1)

return null;

raw+=

s.escape*.5;

}

if(method==="sashi"){

if(a===1)

return null;

raw+=

s.sashi*.45;

}

if(method==="maki"){

if(a===1)

return null;

raw+=

s.maki*.45;

}

if(method==="makiSashi"){

if(a===1)

return null;

raw+=

s.makiSashi*.55;

}

return{

key:`${a}-${b}`,

a,b,

raw:Math.max(

.01,

raw

)

};

}

function makePool(

method,

rankings

){

const arr=[];

for(let a=1;a<=6;a++){

for(let b=1;b<=6;b++){

const x=

candidate(

a,

b,

method,

rankings

);

if(x)

arr.push(x);

}

}

const map=new Map();

arr

.sort((a,b)=>b.raw-a.raw)

.forEach(x=>{

if(!map.has(x.key))

map.set(x.key,x);

});

return[

...map.values()

];

}

/* =========================

   買い目生成

========================= */

function buildBets(rankings){

const used=

new Set();

const result={};

const all=[];

/*

 的中重視

*/

let hit=[];

[

"escape",

"sashi",

"maki",

"makiSashi"

]

.forEach(method=>{

hit.push(

...makePool(

method,

rankings

)

);

});

const hitMap=

new Map();

hit

.sort((a,b)=>b.raw-a.raw)

.forEach(x=>{

if(!hitMap.has(x.key))

hitMap.set(x.key,x);

});

hit=

[

...hitMap.values()

];

for(const x of hit){

if(result.hit?.length>=4)

break;

if(used.has(x.key))

continue;

if(!result.hit)

result.hit=[];

result.hit.push(x);

used.add(x.key);

all.push(x);

}

/*

 回収重視

*/

const methods=[

["escape","escape"],

["sashi","sashi"],

["maki","maki"],

["makiSashi","makiSashi"]

];

methods.forEach(

([name,method])=>{

result[name]=[];

const pool=

makePool(

method,

rankings

);

for(const x of pool){

if(

result[name].length>=4

)

break;

if(used.has(x.key))

continue;

result[name].push(x);

used.add(x.key);

all.push(x);

}

});

/*

 穴目

*/

result.under=[];

const first=

firstBoatInfo();

for(let b=2;b<=6;b++){

const s=

methodStats(b);

if(

first.maru>=30 &&

(

s.maki>=8||

s.makiSashi>=8||

s.sashi>=10

)

){

const key=

`${b}-1`;

if(!used.has(key)){

let raw=

scoreBoat(b);

raw+=

first.maru*.4;

raw+=

s.maki*.5;

raw+=

s.makiSashi*.6;

raw+=

s.sashi*.3;

result.under.push({

key,

a:b,

b:1,

raw,

reason:

`${b}号艇の同コース決まり手実績＋1号艇まくられ率`

});

}

}

}

result.under.sort(

(a,b)=>b.raw-a.raw

);

result.under=

result.under.slice(0,4);

result.under.forEach(x=>{

used.add(x.key);

all.push(x);

});

/*

 ★全買い目を100%にする★

 カテゴリーごとではなく、

 全買い目を母集団にする

*/

const totalRaw=

all.reduce(

(sum,x)=>sum+x.raw,

0

);

if(totalRaw>0){

all.forEach(x=>{

x.probability=

x.raw/totalRaw*100;

});

}

/*

 丸め誤差補正

*/

if(all.length){

let total=

all.reduce(

(sum,x)=>

sum+x.probability,

0

);

all[all.length-1]

.probability+=

100-total;

}

result.all=all;

result.total=

all.reduce(

(sum,x)=>

sum+x.probability,

0

);

return result;

}
