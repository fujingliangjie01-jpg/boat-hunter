<script>

/* =========================

会場番号

========================= */

const venueMap={

"桐生":1,

"戸田":2,

"江戸川":3,

"平和島":4,

"多摩川":5,

"浜名湖":6,

"蒲郡":7,

"常滑":8,

"津":9,

"三国":10,

"びわこ":11,

"住之江":12,

"尼崎":13,

"鳴門":14,

"丸亀":15,

"児島":16,

"宮島":17,

"徳山":18,

"下関":19,

"若松":20,

"芦屋":21,

"福岡":22,

"唐津":23,

"大村":24

};

let boatData=null;

let currentProgram=null;

/* =========================

開始

========================= */

function startApp(){

document

.getElementById("home")

.classList.add("hidden");

document

.getElementById("inputPage")

.classList.remove("hidden");

}

/* =========================

出走表取得

========================= */

async function getProgram(){

const venue=

document.getElementById("venue").value;

const race=

parseInt(

document.getElementById("race")

.value.replace("R",""),

10

);

const status=

document.getElementById("status");

status.innerHTML=

"⏳ 出走表を取得中...";

try{

const response=

await fetch(

"https://boatraceopenapi.github.io/programs/v3/today.json"

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

boatData=

await response.json();

const stadium=

venueMap[venue];

currentProgram=

boatData.programs.find(

function(p){

return Number(p.stadium_number)

===stadium

&&

Number(p.number)

===race;

});

if(!currentProgram){

throw new Error(

venue+" "+race+"Rが見つかりません"

);

}

if(

!currentProgram.boats ||

currentProgram.boats.length<6

){

throw new Error(

"6艇のデータがありません"

);

}

displayBoats(

currentProgram.boats

);

status.innerHTML=

"<span class='success'>"+

"✅ 出走表取得成功"+

"</span>"+

"<br><br>"+

venue+" "+race+"R"+

"<br>"+

currentProgram.title;

}

catch(error){

console.error(error);

status.innerHTML=

"<span class='error'>"+

"❌ 取得失敗"+

"</span>"+

"<br>"+

error.message;

}

}

/* =========================

選手表示

========================= */

function displayBoats(boats){

let html="";

boats

.slice()

.sort(function(a,b){

return Number(a.racer_boat_number)

-

Number(b.racer_boat_number);

})

.forEach(function(b){

html+=`

<div class="racer">

<b style="color:#d4af37;font-size:18px">

${b.racer_boat_number}号艇

</b>

<br><br>

<strong>

${b.racer_name||"不明"}

</strong>

<br><br>

登録番号：

${b.racer_number}

<br>

級別：

${className(

b.racer_class_number

)}

<br>

全国3連対率：

${num(

b.racer_national_top_3_percent

)}%

<br>

当地3連対率：

${num(

b.racer_local_top_3_percent

)}%

<br>

モーター2連率：

${num(

b.racer_assigned_motor_top_2_percent

)}%

<br>

平均ST：

${num(

b.racer_average_start_timing

)}

</div>

`;

});

document

.getElementById("boats")

.innerHTML=html;

}

/* =========================

級別

========================= */

function className(n){

if(Number(n)===1)return"A1";

if(Number(n)===2)return"A2";

if(Number(n)===3)return"B1";

return"B2";

}

/* =========================

数値

========================= */

function num(n){

const x=Number(n);

if(isNaN(x))return"-";

return x.toFixed(2);

}

/* =========================

AI解析

========================= */

function analyze(){

if(!currentProgram){

alert(

"先に出走表を取得してください。"

);

return;

}

const boats=

currentProgram.boats

.slice()

.sort(function(a,b){

return Number(a.racer_boat_number)

-

Number(b.racer_boat_number);

});

let ranking=

boats.map(function(b,index){

const national=

Number(

b.racer_national_top_3_percent

)||0;

const local=

Number(

b.racer_local_top_3_percent

)||0;

const motor2=

Number(

b.racer_assigned_motor_top_2_percent

)||0;

const motor3=

Number(

b.racer_assigned_motor_top_3_percent

)||0;

const st=

Number(

b.racer_average_start_timing

)||0.20;

let score=0;

score+=national*0.40;

score+=local*0.30;

score+=motor2*0.25;

score+=motor3*0.10;

score+=Math.max(

0,

(0.23-st)*100

);

score+=

[22,13,10,7,4,2][index];

if(

Number(b.racer_class_number)===1

){

score+=6;

}

else if(

Number(b.racer_class_number)===2

){

score+=4;

}

else if(

Number(b.racer_class_number)===3

){

score+=2;

}

return{

boat:Number(

b.racer_boat_number

),

name:

b.racer_name||"不明",

score:score

};

});

ranking.sort(function(a,b){

return b.score-a.score;

});

const first=ranking[0];

const second=ranking[1];

const third=ranking[2];

const fourth=ranking[3];

/* 結果画面 */

document

.getElementById("inputPage")

.classList.add("hidden");

document

.getElementById("resultPage")

.classList.remove("hidden");

/* 判定 */

document

.getElementById("judgement")

.innerHTML=`

<p>

<span class="big">

◎ 本命

${first.boat}号艇

</span>

<br>

${first.name}

</p>

<p>

<span class="big">

○ 対抗

${second.boat}号艇

</span>

<br>

${second.name}

</p>

<p>

<span class="big">

▲ 穴

${third.boat}号艇

</span>

<br>

${third.name}

</p>

`;

/* ランキング */

let rankingHTML="";

ranking.forEach(function(x,i){

rankingHTML+=`

<div class="result">

<span>

${i+1}位

${x.boat}号艇

${x.name}

</span>

<span class="score">

${x.score.toFixed(1)}

</span>

</div>

`;

});

document

.getElementById("ranking")

.innerHTML=

rankingHTML;

/* 展開 */

document

.getElementById("development")

.innerHTML=

"基本展開：1号艇のイン逃げを軸に評価。"+

"<br><br>"+

"◎ "+first.boat+"号艇 "+first.name+

"<br>"+

"○ "+second.boat+"号艇 "+second.name+

"<br>"+

"▲ "+third.boat+"号艇 "+third.name+

"<br><br>"+

"全国成績・当地成績・モーター・ST・枠番を総合評価。";

/* 的中率 */

document

.getElementById("safe")

.innerHTML=`

<div class="bet">

${first.boat}-${second.boat}-${third.boat}

</div>

<div class="bet">

${first.boat}-${third.boat}-${second.boat}

</div>

<div class="bet">

${first.boat}-${second.boat}-${fourth.boat}

</div>

`;

/* 回収率 */

document

.getElementById("value")

.innerHTML=`

<div class="bet">

${first.boat}-${third.boat}-${fourth.boat}

</div>

<div class="bet">

${third.boat}-${first.boat}-${second.boat}

</div>

<div class="bet">

${second.boat}-${third.boat}-${first.boat}

</div>

`;

/* 穴 */

document

.getElementById("dark")

.innerHTML=`

<div class="bet">

🔥 ${third.boat}-${first.boat}-${fourth.boat}

</div>

<div class="bet">

🔥 ${fourth.boat}-${third.boat}-${first.boat}

</div>

<div class="bet">

🔥 ${third.boat}-${fourth.boat}-${first.boat}

</div>

`;

/* AI自動買い目 */

generateAutoBets(ranking);

/* 期待値 */

generateExpectedValue(ranking);

}

/* =========================

AI自動買い目

========================= */

function generateAutoBets(ranking){

const top=

ranking.slice(0,4);

let combinations=[];

top.forEach(function(a){

top.forEach(function(b){

top.forEach(function(c){

if(

a.boat===b.boat||

a.boat===c.boat||

b.boat===c.boat

)return;

combinations.push({

bet:

a.boat+"-"+b.boat+"-"+c.boat,

score:

a.score*b.score*c.score

});

});

});

});

combinations.sort(function(a,b){

return b.score-a.score;

});

const best=

combinations.slice(0,10);

let total=0;

best.forEach(function(x){

total+=x.score;

});

let html="";

best.forEach(function(x,i){

const probability=

x.score/total*100;

html+=`

<div class="bet">

<b>

${i+1}位

${x.bet}

</b>

<br>

AI推定値：

${probability.toFixed(2)}%

<br>

AIスコア：

${x.score.toFixed(1)}

</div>

`;

});

document

.getElementById("autoBet")

.innerHTML=

html;

}

/* =========================

期待値分析

========================= */

function generateExpectedValue(ranking){

const top=

ranking.slice(0,4);

let combinations=[];

top.forEach(function(a){

top.forEach(function(b){

top.forEach(function(c){

if(

a.boat===b.boat||

a.boat===c.boat||

b.boat===c.boat

)return;

combinations.push({

bet:

a.boat+"-"+b.boat+"-"+c.boat,

score:

a.score+b.score+c.score

});

});

});

});

combinations.sort(function(a,b){

return b.score-a.score;

});

const best=

combinations.slice(0,10);

let total=0;

best.forEach(function(x){

total+=x.score;

});

let html=`

<div class="status">

3連単オッズを入力すると、

AI期待値を計算できます。

</div>

`;

best.forEach(function(x,i){

const probability=

x.score/total*100;

html+=`

<div class="bet">

<b>

${i+1}位　

${x.bet}

</b>

<br><br>

AI推定確率：

${probability.toFixed(2)}%

<br>

<label>

3連単オッズ

</label>

<input

id="odds_${i}"

type="number"

step="0.1"

min="1"

placeholder="例：12.5">

<button onclick="evaluateEV(

${probability},

${i}

)">

💎 期待値を計算

</button>

<div id="ev_${i}"></div>

</div>

`;

});

document

.getElementById("expectedValue")

.innerHTML=

html;

}

/* =========================

期待値計算

========================= */

function evaluateEV(probability,index){

const odds=

Number(

document.getElementById(

"odds_"+index

).value

);

const result=

document.getElementById(

"ev_"+index

);

if(!odds||odds<=0){

result.innerHTML=

"<span class='error'>"+

"オッズを入力してください。"+

"</span>";

return;

}

const expectedValue=

(probability/100)

*odds

*100;

let judgement="";

if(expectedValue>=150){

judgement="🔥 強く買い";

}

else if(expectedValue>=120){

judgement="◎ 買い";

}

else if(expectedValue>=100){

judgement="△ 少額";

}

else{

judgement="× 見送り";

}

result.innerHTML=`

<div class="status">

オッズ：

<b>${odds.toFixed(1)}倍</b>

<br>

期待値：

<b>${expectedValue.toFixed(1)}%</b>

<br><br>

判定：

<b>${judgement}</b>

</div>

`;

}
/* =====================================

   期待値分析

===================================== */

function calculateExpectedValue(){

    const ranking = makeRanking();

    if(!ranking || ranking.length < 4){

        alert("先に出走表を取得してください。");

        return;

    }

    const top = ranking.slice(0,4);

    let combinations = [];

    top.forEach(function(a){

        top.forEach(function(b){

            top.forEach(function(c){

                if(

                    a.boat === b.boat ||

                    a.boat === c.boat ||

                    b.boat === c.boat

                ){

                    return;

                }

                combinations.push({

                    bet:

                        a.boat + "-" +

                        b.boat + "-" +

                        c.boat,

                    score:

                        a.score *

                        b.score *

                        c.score

                });

            });

        });

    });

    combinations.sort(function(a,b){

        return b.score-a.score;

    });

    const best =

        combinations.slice(0,10);

    /* オッズ入力欄を作る */

    let inputHTML = "";

    best.forEach(function(x,i){

        inputHTML += `

        <div class="bet">

            <b>

            ${i+1}位　

            ${x.bet}

            </b>

            <br><br>

            <label>

            オッズ

            </label>

            <input

                id="odds_${i}"

                type="number"

                step="0.1"

                min="0"

                placeholder="例：15.2"

            >

        </div>

        `;

    });

    document.getElementById(

        "oddsInputs"

    ).innerHTML = inputHTML;

    /* 計算結果 */

    let resultHTML = "";

    best.forEach(function(x,i){

        const odds =

            Number(

                document.getElementById(

                    "odds_"+i

                ).value

            );

        if(!odds || odds <= 0){

            return;

        }

        const totalScore =

            best.reduce(function(sum,item){

                return sum + item.score;

            },0);

        const probability =

            x.score /

            totalScore *

            100;

        const expectedValue =

            odds *

            probability /

            100;

        let judgement = "🔴 見送り";

        if(expectedValue >= 1.20){

            judgement =

                "🔥 強く買い";

        }

        else if(expectedValue >= 1.00){

            judgement =

                "🟢 買い";

        }

        else if(expectedValue >= 0.80){

            judgement =

                "🟡 抑え";

        }

        resultHTML += `

        <div class="bet">

            <b>

            ${x.bet}

            </b>

            <br><br>

            オッズ：

            <span class="gold">

            ${odds.toFixed(1)}倍

            </span>

            <br>

            AI推定確率：

            ${probability.toFixed(2)}%

            <br>

            期待値：

            <span class="gold">

            ${expectedValue.toFixed(2)}

            </span>

            <br><br>

            <b>

            ${judgement}

            </b>

        </div>

        `;

    });

    document.getElementById(

        "expectedValue"

    ).innerHTML =

        resultHTML ||

        "<div class='status'>オッズを入力してください。</div>";

}

    const combinations = [

        [ranking[0],ranking[1],ranking[2]],

        [ranking[0],ranking[2],ranking[1]],

        [ranking[0],ranking[1],ranking[3]],

        [ranking[1],ranking[0],ranking[2]],

        [ranking[1],ranking[2],ranking[0]],

        [ranking[2],ranking[0],ranking[1]]

    ];

    let html = "";

    html += `

        <div class="status">

        <span class="gold">

        💎 AI期待値分析

        </span>

        <br><br>

        各買い目のAIスコアを確率化して評価します。

        <br>

        ※実オッズ未入力の場合はAI相対期待値です。

        </div>

    `;

    combinations.forEach(function(c){

        const totalScore =

            c[0].score +

            c[1].score +

            c[2].score;

        const probability =

            totalScore /

            (

                ranking[0].score +

                ranking[1].score +

                ranking[2].score +

                ranking[3].score

            ) * 100;

        const expected =

            probability / 100;

        let judgement = "見送り";

        if(expected >= 1.20){

            judgement = "🔥 強く買い";

        }

        else if(expected >= 1.00){

            judgement = "💰 買い";

        }

        else if(expected >= 0.80){

            judgement = "△ 抑え";

        }

        html += `

        <div class="bet">

            <b>

            ${c[0].boat}-${c[1].boat}-${c[2].boat}

            </b>

            <br><br>

            AI推定確率：

            ${probability.toFixed(2)}%

            <br>

            相対期待値：

            ${expected.toFixed(2)}

            <br><br>

            <span class="gold">

            判定：${judgement}

            </span>

        </div>

        `;

    });

    const box =

        document.getElementById("expectedValue");

    if(box){

        box.innerHTML = html;

    }

}
</script>

</body>

</html>
