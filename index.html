<style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,#080808,#211a07);border-bottom:1px solid #b8952e;padding:18px;text-align:center}header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:3px}header p{margin:5px 0 0;font-size:12px;color:#999}.container{max-width:1000px;margin:auto;padding:14px}.card{background:#111;border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:14px}h2{margin:0 0 12px;font-size:17px;color:#d4af37}h3{font-size:14px;color:#d4af37;margin:14px 0 8px}label{font-size:11px;color:#aaa;display:block;margin-bottom:5px}select,input{width:100%;background:#181818;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;padding:13px;border:0;border-radius:9px;font-size:14px;font-weight:bold}.mainBtn{margin-top:12px;background:linear-gradient(135deg,#d4af37,#8b6914);color:#000}.subBtn{margin-top:8px;background:#222;border:1px solid #555;color:#fff}.resetBtn{margin-top:8px;background:#171717;border:1px solid #777;color:#fff}.topBtn{margin-top:14px;background:#171717;border:1px solid #b8952e;color:#d4af37}.message{margin-top:10px;font-size:12px;line-height:1.6;color:#aaa}.info{background:#151515;border:1px solid #333;border-radius:8px;padding:10px;font-size:11px;line-height:1.7;margin-bottom:10px}.courseGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.courseBox{background:#171717;padding:8px;border-radius:8px;border:1px solid #333}.racers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.racer{background:#171717;border:1px solid #333;border-radius:9px;padding:9px}.racerTop{display:flex;align-items:center;gap:8px}.number{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#000}.n1{background:#fff}.n2{background:#222;color:# x;padding:10px;font-size:11px;line-height:1.8;margin-top:8px}.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}.attackSub{color:#aaa;margin-top:4px}.exclusion{background:#241414;border-left:3px solid #e55;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}.exclusionKeep{background:#171707;border-left:3px solid #d4af37;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}.revivalBox{background:#211a07;border-left:3px solid #ffd84d;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}.pickBox{background:#151515;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}.betHeader{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;background:#0d0d0d;border:1px solid #292929;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px;color:#888;text-align:center}.betRow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #292929}.betRow:last-child{border-bottom:0}.bet2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:bold}.bet2Number{background:#211a07;border:1px solid #8a6d1c;border-radius:6px;padding:5px 8px;color:#ffd84d}.betPercent{font-size:11px;color:#ffd84d;font-weight:bold}.thirdCandidates{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}.thirdCandidate{background:#101010;border:1px solid #333;border-radius:6px;padding:5px 6px;font-size:10px;color:#fff}.thirdCandidate.normal{border-color:#555}.thirdCandidate.revival{border-color:#d4af37;color:#ffd84d;background:#211a07}.thirdCandidate.warning{border-color:#8a4b4b;color:#ff9b9b}.revivalLabel{display:block;font-size:8px;color:#ffd84d;margin-top:2px}.betNote{font-size:9px;color:#777;margin-top:5px;line-height:1.5}.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px}.pick:last-child{border-bottom:0}.pickLeft{display:flex;align-items:center;gap:5px}.star{width:18px;min-width:18px;color:#ffd84d;font-size:15px;font-weight:bold}.prob{color:#ffd84d;font-weight:bold}.pick.veryStrong .prob,.pick.veryStrong strong{color:#ff3b30}.pick.veryStrong .prob{font-size:15px;font-weight:900}.pick.strong .prob,.pick.strong strong{color:#ffd84d}.pick.strong .prob{font-size:14px;font-weight:900}.pick.weak{opacity:.38}.total{background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;padding:10px;text-align:center;color:#d4af37;font-weight:bold;margin-bottom:8px}.budgetInfo{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:11px;line-height:1.6;color:#aaa}.budgetStrong{color:#d4af37;font-weight:bold}.noPick{font-size:11px;color:#777;padding:8px 0;line-height:1.6}.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.overviewBox{background:#101010;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}.overviewBox .label{font-size:10px;color:#888}.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}.overviewBox.main{border-color:#8a6d1c;background:#1c1709}.overviewReason{font-size:11px;color:#aaa;line-height:1.7;margin-top:8px}.venueBox{background:#101010;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}.venueBox strong{color:#d4af37}.formBox{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}.footer{text-align:center;color:#555;font-size:10px;padding:20px}.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}.betEscape{color:#ff9500}.betSashi{color:#4cd964}.betMaki{color:#ff5555}.betMakiSashi{color:#58a6ff}.recommendPick{opacity:.52}.recommendTitle{color:#888!important}.outlookBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}.outlookTitle{font-size:13px;font-weight:bold;color:#d4af37;margin-bottom:8px}.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}.outlookEscape{border-color:#7b2d2d;background:#241414}.outlookNonEscape{border-color:#285b8c;background:#0e1722}.outlookInactive{border-color:#333!important;background:#151515!important}.outlookLabel{font-size:10px;color:#aaa}.outlookValue{font-size:22px;font-weight:900;margin-top:3px}.outlookEscape .outlookValue{color:#ff5555}.outlookNonEscape .outlookValue{color:#58a6ff}.outlookInactive .outlookValue{color:#777}.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}.decisionPositive{color:#4cd964}.decisionWarning{color:#ffd84d}.decisionDanger{color:#ff5555}.decisionMuted{color:#777!important}.outlookBand-balanced{border-color:#2e8b57!important;background:#102014!important}.outlookBand-balanced .outlookValue{color:#4cd964!important}.outlookCaution{margin-top:8px;padding:11px;border:2px solid #ffd84d;border-radius:8px;background:#211a07;color:#ffd84d;text-align:center;font-weight:900;font-size:15px;letter-spacing:.7px;box-shadow:0 0 0 1px #8a6d1c inset}.outlookLow{border-color:#444!important;background:#151515!important}.outlookLow .outlookLabel,.outlookLow .outlookStatus{color:#777!important}.outlookLow .outlookValue{color:#777!important}.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}.aiDetail strong{color:#d4af37}.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}.patternExcluded{color:#777;text-decoration:line-through}@media(max-width:600px){.grid2{grid-template-columns:1fr}.courseGrid{grid-template-columns:repeat(2,1fr)}.racers{grid-template-columns:1fr}.overviewGrid{grid-template-columns:repeat(2,1fr)}.betHeader,.betRow{grid-template-columns:1fr 1.3fr}.decisionStats{grid-template-columns:repeat(2,1fr)}}</style>

<script>

"use strict";

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const HISTORY_RACES=15;

const HISTORY_DAYS=180;

const $=id=>document.getElementById(id);

function num(v){

const n=parseFloat(v);

return Number.isFinite(n)?n:0

}

function esc(v){

return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))

}

function today(){

let d=new Date();

return{

year:String(d.getFullYear()),

ymd:String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")

}

}

async function json(url){

let r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

return r.json()

}

let raceData=null;

let racers=[];

let previewRacers={};

let manualCourses={};

let historyData={};

let currentBets=null;

function course(b){

return Number.isInteger(manualCourses[b])&&manualCourses[b]>=1&&manualCourses[b]<=6

?manualCourses[b]

:b

}

function racer(b){

return racers.find(x=>num(x.entry_number)===num(b))

}

function preview(b){

let r=previewRacers;

if(Array.isArray(r))return r.find(x=>num(x.entry_number||x.boat_number||x.number)===b)||{};

return r?.[String(b)]||r?.[b]||{}

}

function initCourses(){

for(let b=1;b<=6;b++){

let e=$("course"+b);

e.innerHTML="";

for(let c=1;c<=6;c++)

e.add(new Option(c+"コース",c));

e.value=String(b);

manualCourses[b]=b;

e.onchange=()=>manualCourses[b]=Number(e.value)

}

}

function resetCourses(){

for(let b=1;b<=6;b++){

$("course"+b).value=String(b);

manualCourses[b]=b

}

$("message").innerHTML='<span class="success">🔄 進入入力をリセットしました</span>'

}

function normalizeEntry(x,i){

if(x==null||typeof x!=="object")return null;

let entry=num(

x.entry_number??x.entryNumber??x.boat_number??x.boatNumber??x.boat_no??

x.number_boat??x.boat??x.lane??x.lane_number??x.laneNumber??

x.course_number??x.course??x.entry??x.number

);

if(!entry&&i<6)entry=i+1;

let name=

x.name??x.racer_name??x.racerName??x.player_name??x.playerName??

x.racer??x.player??x.racers_name??"";

if(typeof name==="object")

name=name.name||name.racer_name||name.player_name||"";

return{...x,entry_number:entry,name:name}

}

function extractRaceEntries(race){

if(!race)return[];

const directCandidates=[

race.racers,race.entries,race.participants,race.program,race.race_entries,

race.racer,race.players,race.boats,race.starting_list,race.startingList,

race.entry_list,race.entryList,race.raceRacers,race.race_entries_list

];

for(const source of directCandidates){

if(!source)continue;

let arr=Array.isArray(source)?source:Object.values(source);

let list=arr.map((x,i)=>normalizeEntry(x,i))

.filter(x=>x&&x.entry_number>=1&&x.entry_number<=6);

let unique=new Map();

list.forEach(x=>{

if(!unique.has(x.entry_number))

unique.set(x.entry_number,x)

});

list=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

if(list.length===6)return list

}

return extractEntriesDeep(race)

}

function extractEntriesDeep(root){

let found=[];

function walk(obj,depth=0){

if(!obj||depth>12)return;

if(Array.isArray(obj)){

for(const x of obj)

walk(x,depth+1);

return

}

if(typeof obj!=="object")return;

const looksLikeRacer=

obj.name!=null||

obj.racer_name!=null||

obj.racerName!=null||

obj.player_name!=null||

obj.registration_number!=null||

obj.racer_number!=null||

obj.player_number!=null;

const e=num(

obj.entry_number??obj.entryNumber??obj.boat_number??obj.boatNumber??

obj.boat_no??obj.lane??obj.course_number??obj.course??obj.entry

);

if(looksLikeRacer&&e>=1&&e<=6){

let z=normalizeEntry(obj,0);

if(z)found.push(z)

}

for(const k of Object.keys(obj)){

if(k==="result"||k==="results"||k==="history")continue;

walk(obj[k],depth+1)

}

}

walk(root);

let unique=new Map();

found.forEach(x=>{

if(!unique.has(x.entry_number))

unique.set(x.entry_number,x)

});

let list=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

return list.length===6?list:[]

}

function findRace(data,venue,raceNo){

let found=null;

function walk(obj){

if(found||obj==null)return;

if(Array.isArray(obj)){

for(const item of obj){

walk(item);

if(found)break

}

return

}

if(typeof obj!=="object")return;

const rn=

obj.race_number??obj.raceNumber??obj.race_no??obj.raceNo??obj.raceno??obj.number;

const vn=

obj.stadium_number??obj.stadiumNumber??obj.venue_number??obj.venueNumber??obj.stadiumNo??obj.venueNo;

if(

rn!=null&&

String(rn)===String(raceNo)&&

(vn==null||String(vn)===String(venue))

){

let list=extractRaceEntries(obj);

if(list.length===6){

found=obj;

return

}

}

for(const key of Object.keys(obj)){

walk(obj[key]);

if(found)break

}

}

walk(data);

return found

}

function directRace(data,v,r){

const paths=[

data?.programs?.stadiums?.[String(v)]?.races?.[String(r)],

data?.programs?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.stadiums?.[String(v)]?.races?.[String(r)],

data?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.races?.[String(r)],

data?.races?.[Number(r)]

];

for(const x of paths){

if(x&&extractRaceEntries(x).length===6)

return x

}

const raceArrays=[

data?.programs?.stadiums?.[String(v)]?.races,

data?.stadiums?.[String(v)]?.races,

data?.races,

data?.programs?.races

];

for(const arr of raceArrays){

if(!arr)continue;

const list=Array.isArray(arr)?arr:Object.values(arr);

const x=list.find(z=>{

const rn=z?.race_number??z?.raceNumber??z?.race_no??z?.raceNo;

return String(rn)===String(r)&&extractRaceEntries(z).length===6

});

if(x)return x

}

return findRace(data,v,r)

}

async function loadDaily(){

let t=today(),v=$("venue").value,r=$("race").value;

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let errors=[];

for(const url of urls){

try{

let data=await json(url);

let race=directRace(data,v,r);

if(race){

let list=extractRaceEntries(race);

if(list.length===6)

return{data,race,base:url};

errors.push(url+" : race found but entries="+list.length)

}else{

errors.push(url+" : race not found")

}

}catch(e){

errors.push(url+" : "+e.message)

}

}

throw Error(

"APIから6艇の出走表を取得できませんでした.\n"+

errors.slice(-3).join("\n")

)

}

async function loadRaceData(){

$("message").innerHTML=

'<span class="loading">⏳ 出走表を取得中...</span>';

$("raceCard").style.display="none";

$("analysisCard").style.display="none";

historyData={};

currentBets=null;

try{

let api=await loadDaily();

raceData=api.race;

let list=extractRaceEntries(raceData);

if(list.length!==6)

throw Error("6艇の選手データを取得できませんでした");

racers=list;

previewRacers=

raceData.preview?.racers||

raceData.preview?.entries||

raceData.preview||

{};

for(let b=1;b<=6;b++){

let p=preview(b);

let c=num(

p.course_number||

p.course||

p.entry_course||

p.entry||

p.lane

);

if(c>=1&&c<=6){

$("course"+b).value=String(c);

manualCourses[b]=c

}

}

renderRace();

$("raceCard").style.display="block";

$("message").innerHTML=

'<span class="success">✅ 出走表取得成功<br>AI解析時に同コース過去15走を取得します</span>';

}catch(e){

console.error(e);

$("message").innerHTML=

'<span class="error">❌ 出走表取得失敗<br>'+

esc(e.message).replace(/\n/g,"<br>")+

'</span>'

function thirdProbabilityList(excluded,rankings,type){

let list=[];

for(let b=2;b<=6;b++){

if(excluded.includes(b))continue;

let v=patternThirdScore(

rankings,

type

);

if(v<=-900)continue;

list.push({

})

}

list.sort((a,b)=>b.value-a.value);

let min=

list.length

?Math.min(...list.map(x=>x.value))

:0;

let weights=

list.map(x=>Math.max(.1,x.value-min+5));

let total=

weights.reduce((s,x)=>s+x,0)||1;

list.forEach((x,i)=>{

x.prob=weights[i]/total*100

});

return list

}

weakMotor=motorRate(x.boat)<30;

if(!picked.includes(x.boat))

picked.push(x.boat)

if(!picked.length&&eligible.length)

picked.push(eligible[0].boat);

if(picked.length>2)

picked=picked.slice(0,2);

return{

eligible,

avg

}

async function initTodayVenues(){

let v=$("venue");

v.innerHTML=

'<option value="">開催場を取得中...</option>';

const venueNames={

1:"桐生",

2:"戸田",

3:"江戸川",

4:"平和島",

5:"多摩川",

6:"浜名湖",

7:"蒲郡",

8:"常滑",

9:"津",

10:"三国",

11:"びわこ",

12:"住之江",

13:"尼崎",

14:"鳴門",

15:"丸亀",

16:"児島",

17:"宮島",

18:"徳山",

19:"下関",

20:"若松",

21:"芦屋",

22:"福岡",

23:"唐津",

24:"大村"

};

try{

let t=today();

let urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let found=new Map();

for(let url of urls){

try{

let data=await json(url);

let stadiums=

data?.programs?.stadiums||

data?.stadiums||

data?.programs?.venues||

data?.venues;

if(stadiums){

let list=

Array.isArray(stadiums)

?stadiums

:Object.entries(stadiums)

.map(([k,x])=>({...x,_venueNo:k}));

list.forEach(x=>{

let no=num(

x._venueNo??

x.stadium_number??

x.stadiumNumber??

x.venue_number??

x.venueNumber??

x.stadiumNo??

x.venueNo??

x.number??

x.id

);

let name=

x.name??

x.stadium_name??

x.stadiumName??

x.venue_name??

x.venueName??

venueNames[no];

if(no>=1&&no<=24)

found.set(no,String(name||venueNames[no]));

});

}

if(found.size)break;

}catch(e){}

}

if(!found.size)

throw Error("本日の開催場を取得できませんでした");

v.innerHTML="";

Array.from(found.entries())

.sort((a,b)=>a[0]-b[0])

.forEach(([no,name])=>

v.add(

new Option(name,String(no))

)

);

}catch(e){

v.innerHTML=

'<option value="">本日の開催場を取得できません</option>';

v.value="";

}

}

initCourses();

</script>
