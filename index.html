<style>

*{box-sizing:border-box}

body{

 margin:0;background:#080808;color:#fff;

 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

header{

 background:linear-gradient(135deg,#080808,#211a07);

.attackBox{

.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}

.exclusion{

 background:#171707;border-left:3px solid #d4af37;

.pickBox{

 background:#151515;border:1px solid #333;border-radius:9px;

 padding:10px;margin-top:9px

}

.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}

.pick{

}

.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}

.overviewBox{

 background:#101010;border:1px solid #333;border-radius:8px;

}

.overviewBox .label{font-size:10px;color:#888}

.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}

.overviewBox.main{border-color:#8a6d1c;background:#1c1709}

.footer{text-align:center;color:#555;font-size:10px;padding:20px}

.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}

@media(max-width:600px){

 .grid2{grid-template-columns:1fr}

 .courseGrid{grid-template-columns:repeat(2,1fr)}

 .racers{grid-template-columns:1fr}

 .overviewGrid{grid-template-columns:repeat(2,1fr)}

<script>

/* =====================================================

   BOAT HUNTER

   現行 API v1 優先

===================================================== */

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

let raceData=null;

let racers=[];

let previewRacers={};

let manualCourses={};

let historyData={};

let currentBets=null;

let currentApi="";

function n(v){

 if(v===null||v===undefined||v==="")return 0;

 const x=parseFloat(String(v).replace("%","").replace("秒","").replace(",",""));

 return Number.isFinite(x)?x:0;

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function getBudget(){

 let v=Number(document.getElementById("budget").value);

 if(!Number.isFinite(v)||v<100)v=100;

 v=Math.floor(v/100)*100;

 document.getElementById("budget").value=v;

 return v;

}

function formatYen(v){

 return Number(v||0).toLocaleString("ja-JP")+"円";

}

function todayParts(){

 const p=new Intl.DateTimeFormat("ja-JP",{

  timeZone:"Asia/Tokyo",

  year:"numeric",

  month:"2-digit",

  day:"2-digit"

 }).formatToParts(new Date());

 const y=p.find(x=>x.type==="year").value;

 const m=p.find(x=>x.type==="month").value;

 const d=p.find(x=>x.type==="day").value;

 return{

  year:y,

  yyyymmdd:y+m+d

 };

}

async function getJSON(url){

 const r=await fetch(

  url,

  {

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!r.ok)throw new Error("HTTP "+r.status);

 return await r.json();

}

/* =====================================================

   API

   現在の推奨API v1を最優先

===================================================== */

async function loadDailyData(){

 const p=todayParts();

 const urls=[

  {

   name:"V1",

   url:`${API_V1}/${p.year}/${p.yyyymmdd}.json`

  },

  {

   name:"V1-TODAY",

   url:`${API_V1}/today.json`

  },

  {

   name:"V3",

   url:`${API_V3}/${p.year}/${p.yyyymmdd}.json`

  },

  {

   name:"V2",

   url:`${API_V2}/${p.year}/${p.yyyymmdd}.json`

  }

 ];

 const errors=[];

 for(const api of urls){

  try{

   const data=await getJSON(api.url);

   if(data){

    return{

     data,

     url:api.url,

     version:api.name

    };

   }

  }catch(e){

   errors.push(api.name+"="+e.message);

  }

 }

 throw new Error(

  "API取得失敗："+errors.join(" / ")

 );

}

/* =====================================================

   レース探索

===================================================== */

function findRace(data,venue,race){

 const v=String(venue);

 const r=String(race);

 /* 現行APIの正式構造 */

 const direct=

  data?.programs?.stadiums?.[v]?.races?.[r];

 if(direct)return direct;

 /* 念のため汎用探索 */

 let found=null;

 function walk(obj){

  if(!obj||typeof obj!=="object"||found)return;

  if(Array.isArray(obj)){

   for(const x of obj){

    walk(x);

    if(found)return;

   }

   return;

  }

  const rn=

   obj.race_number ??

   obj.raceNo ??

   obj.race_no;

  const vn=

   obj.stadium_number ??

   obj.venue_number ??

   obj.stadium ??

   obj.venue;

  if(

   rn!==undefined &&

   String(rn)===r &&

   (

    vn===undefined ||

    String(vn)===v

   ) &&

   (

    obj.racers||

    obj.entries||

    obj.participants

   )

  ){

   found=obj;

   return;

  }

  Object.values(obj).forEach(walk);

 }

 walk(data);

 return found;

}

/* =====================================================

   選手

===================================================== */

function extractRacers(race){

 const source=

  race?.racers||

  race?.entries||

  race?.participants;

 if(!source)return[];

 const arr=Array.isArray(source)

  ?source

  :Object.values(source);

 return arr

 .map((r,i)=>({

  ...r,

  entry_number:n(

   r.entry_number||

   r.boat_number||

   r.number_boat||

   i+1

  )

 }))

 .filter(r=>r.entry_number>=1&&r.entry_number<=6)

 .sort((a,b)=>a.entry_number-b.entry_number);

}

function getPreviewData(race){

 return race?.preview?.racers||

 race?.preview||

 {};

}

function getPreview(boat){

 return previewRacers[String(boat)]||

 previewRacers[boat]||

 {};

}

/* =====================================================

   進入

===================================================== */

function initCourses(){

 for(let boat=1;boat<=6;boat++){

  const el=document.getElementById("course"+boat);

  el.innerHTML="";

  for(let c=1;c<=6;c++){

   const o=document.createElement("option");

   o.value=c;

   o.textContent=c+"コース";

   el.appendChild(o);

  }

  el.value=boat;

  manualCourses[boat]=boat;

  el.addEventListener("change",function(){

   manualCourses[boat]=Number(this.value);

  });

 }

}

function resetCourses(){

 for(let boat=1;boat<=6;boat++){

  document.getElementById("course"+boat).value=boat;

  manualCourses[boat]=boat;

 }

 document.getElementById("message").innerHTML=

 `<span class="success">🔄 進入入力をリセットしました</span>`;

}

function getCourse(boat){

 return Number(manualCourses[boat]||boat);

}

/* =====================================================

   過去データ

===================================================== */

function getDateBefore(days){

 const d=new Date();

 d.setHours(12,0,0,0);

 d.setDate(d.getDate()-days);

 return d;

}

function dateString(date){

 const y=date.getFullYear();

 const m=String(date.getMonth()+1).padStart(2,"0");

 const d=String(date.getDate()).padStart(2,"0");

 return{

  year:String(y),

  ymd:String(y)+m+d

 };

}

function decisionName(num){

 return{

  1:"逃げ",

  2:"差し",

  3:"まくり",

  4:"まくり差し",

  5:"抜き",

  6:"恵まれ"

 }[n(num)]||"-";

}

function collectResultRaces(data,callback){

 function walk(obj){

  if(!obj||typeof obj!=="object")return;

  if(Array.isArray(obj)){

   obj.forEach(walk);

   return;

  }

  if(obj.result&&obj.result.racers){

   callback(obj,obj.result);

  }

  Object.values(obj).forEach(v=>{

   if(v&&typeof v==="object")walk(v);

  });

 }

 walk(data);

}

async function loadHistory(){

 historyData={};

 const targets={};

 racers.forEach(r=>{

  const number=n(

   r.number||

   r.registration_number||

   r.racer_number

  );

  if(number){

   targets[number]={

    name:r.name,

    boats:{

     1:[],2:[],3:[],

     4:[],5:[],6:[]

    }

   };

  }

 });

 const targetNumbers=

  new Set(Object.keys(targets).map(Number));

 for(let start=1;start<=30;start+=5){

  const jobs=[];

  for(let offset=0;offset<5;offset++){

   const parts=dateString(

    getDateBefore(start+offset)

   );

   jobs.push(

    getJSON(

     `${API_V1}/${parts.year}/${parts.ymd}.json`

    ).catch(()=>null)

   );

  }

  const results=await Promise.all(jobs);

  for(const data of results){

   if(!data)continue;

   collectResultRaces(data,(race,result)=>{

    const rr=result?.racers;

    if(!rr)return;

    Object.values(rr).forEach(x=>{

     const number=n(

      x.number||

      x.registration_number||

      x.racer_number

     );

     if(!targetNumbers.has(number))return;

     const course=n(

      x.course_number||

      x.course||

      x.entry_course

     );

     const place=n(

      x.place_number||

      x.place||

      x.rank||

      x.result

     );

     if(

      course<1||

      course>6||

      place<1||

      place>6

     )return;

     const target=targets[number];

     if(

      target&&

      target.boats[course].length<10

     ){

      target.boats[course].push({

       date:

        result.date||

        race.date||

        "",

       place,

       course,

       decision:

        decisionName(

         result.technique_number||

         x.technique_number||

         result.technique

        )

      });

     }

    });

   });

  }

 }

 historyData=targets;

}

function getRacer(boat){

 return racers.find(

  r=>n(r.entry_number)===boat

 );

}

function getHistory(boat){

 const r=getRacer(boat);

 if(!r)return[];

 const number=n(

  r.number||

  r.registration_number||

  r.racer_number

 );

 return(

  historyData[number]?.boats?.[getCourse(boat)]||[]

 ).slice(0,10);

}

function getHistoryStats(boat){

 const list=getHistory(boat);

 let first=0;

 let second=0;

 let third=0;

 list.forEach(x=>{

  if(x.place===1)first++;

  if(x.place===2)second++;

  if(x.place===3)third++;

 });

 return{

  count:list.length,

  first,

  second,

  third,

  rate:list.length

   ?(first+second+third)/list.length*100

   :0

 };

}

function historyScore(boat){

 const s=getHistoryStats(boat);

 if(!s.count)return 0;

 return(

  s.first*3.8+

  s.second*2.6+

  s.third*1.6+

  s.rate*.20

 );

}

function renderHistory(boat){

 const list=getHistory(boat);

 const s=getHistoryStats(boat);

 const course=getCourse(boat);

 if(!list.length){

  return`

  <div class="history">

   <div class="historyTitle">

    📈 ${course}コース過去10走

   </div>

   <div class="historyList">

    データなし

   </div>

  </div>`;

 }

 return`

 <div class="history">

  <div class="historyTitle">

   📈 ${course}コース過去${list.length}走

  </div>

  <div class="historyStats">

   <div class="historyStat">

    1着<strong>${s.first}</strong>

   </div>

   <div class="historyStat">

    2着<strong>${s.second}</strong>

   </div>

   <div class="historyStat">

===================================================== */

function decisionSuitability(boat,type){

 const r=getRacer(boat);

 if(!r)return 0;

 const d=getDecisionData(r);

 const course=getCourse(boat);

 let v=0;

 if(type==="escape"){

  if(course===1)v+=35;

  v+=d.escape*1.25;

 }

 if(type==="sashi"){

  if(course===2)v+=22;

  else if(course===3)v+=10;

  else if(course===4)v+=5;

  v+=d.sashi*1.55;

 }

 if(type==="maki"){

  if(course===3)v+=17;

  else if(course===4)v+=19;

  else if(course===5)v+=9;

  v+=d.maki*1.55;

 }

 if(type==="makiSashi"){

  if(course===3)v+=17;

  else if(course===4)v+=16;

  else if(course===5)v+=9;

  v+=d.makiSashi*1.55;

 }

 return v;

}

/* =====================================================

   イン逃げ確率

   40 / 45 / 50 の基準をここで明確化

===================================================== */

function calculateInsideRate(){

 if(getCourse(1)!==1)return 0;

 const r1=getRacer(1);

 if(!r1)return 0;

 const p=getPreview(1);

 let rate=35;

 /* 1号艇の能力 */

 rate+=

  Math.max(

   0,

   n(r1.national_win_rate)-6

  )*5;

 rate+=

  Math.max(

   0,

   n(r1.local_win_rate)-5.5

  )*3;

 rate+=

  Math.max(

   0,

   n(

    r1.national_top_2_percent||

    r1.national_2ren_rate

   )-55

  )*.08;

 /* ST */

 const avgST=n(

  r1.average_start_timing

 );

 if(avgST>0){

  if(avgST<=.14)rate+=6;

  else if(avgST<=.17)rate+=4;

  else if(avgST<=.20)rate+=2;

  else if(avgST>=.25)rate-=3;

 }

 const st=n(

  p.start_timing||p.st

 );

 if(st>0){

  if(st<=.12)rate+=5;

  else if(st<=.16)rate+=3;

  else if(st>=.22)rate-=3;

 }

 /* モーター */

 const motor=n(

  r1.motor_top_2_percent||

  r1.motor_2ren_rate

 );

 if(motor>=40)rate+=4;

 else if(motor>=35)rate+=2;

 else if(motor<25)rate-=3;

 /* 同コース過去 */

 const hs=getHistoryStats(1);

 if(hs.count>=5){

  if(hs.rate>=70)rate+=5;

  else if(hs.rate>=60)rate+=3;

  else if(hs.rate>=50)rate+=1;

  else if(hs.rate<35)rate-=4;

 }

 /* 他艇の攻撃力 */

 for(let boat=2;boat<=6;boat++){

  const rb=getRacer(boat);

  const course=getCourse(boat);

  if(!rb)continue;

  const st=n(

   rb.average_start_timing

  );

  const motorB=n(

   rb.motor_top_2_percent||

   rb.motor_2ren_rate

  );

  if(

   (course===3||course===4)&&

   st>0&&st<=.15&&

   motorB>=35

  ){

   rate-=4;

  }

 }

 return Math.max(

  20,

  Math.min(65,rate)

 );

}

   全体見通し

===================================================== */

function calculateOverview(){

 const inside=calculateInsideRate();

 const values={

  escape:inside,

  sashi:0,

  maki:0,

  makiSashi:0

 };

 for(let boat=1;boat<=6;boat++){

  values.sashi+=

   decisionSuitability(

    boat,"sashi"

   );

  values.maki+=

   decisionSuitability(

    boat,"maki"

   );

  values.makiSashi+=

   decisionSuitability(

    boat,"makiSashi"

   );

 }

 /*

  イン逃げの残り以外を展開評価へ

 */

 const attackTotal=

  values.sashi+

  values.maki+

  values.makiSashi;

 const remain=100-inside;

 if(attackTotal>0){

  values.sashi=

   values.sashi/attackTotal*remain;

  values.maki=

   values.maki/attackTotal*remain;

  values.makiSashi=

   values.makiSashi/attackTotal*remain;

 }else{

  values.sashi=remain;

  values.maki=0;

  values.makiSashi=0;

 }

 return values;

}

  };

   AIスコア

===================================================== */

function scoreBoat(boat){

 const r=getRacer(boat);

 if(!r)return 0;

 const p=getPreview(boat);

 const course=getCourse(boat);

 let score=0;

 score+=

  n(r.national_win_rate)*7;

 score+=

  n(r.local_win_rate)*4;

 score+=

  n(

   r.national_top_2_percent||

   r.national_2ren_rate

  )*.12;

 const motor=n(

  r.motor_top_2_percent||

  r.motor_2ren_rate

 );

 score+=motor*.15;

 if(motor>=40)score+=5;

 else if(motor>=35)score+=3;

 else if(motor>=30)score+=1;

 else if(motor<20)score-=2;

 const avgST=n(

  r.average_start_timing

 );

 if(avgST>0){

  score+=

   Math.max(

    0,

    .30-avgST

   )*20;

 }

 const st=n(

  p.start_timing||p.st

 );

 if(st>0){

  score+=

   Math.max(

    0,

    .25-st

   )*15;

 }

 const exhibition=n(

  p.exhibition_time||

  p.exhibition

 );

 if(exhibition>0){

  score+=

   Math.max(

    0,

    6.80-exhibition

   )*5;

 }

 score+={

  1:10,

  2:6,

  3:5,

  4:3,

  5:1,

  6:0

 }[course]||0;

 const hs=getHistoryStats(boat);

 if(hs.count){

  score+=historyScore(boat);

  if(hs.rate>=60)score+=5;

  else if(hs.rate>=40)score+=3;

  else if(hs.rate<20)score-=2;

 }

 const rank=rankName(

  r.rank_number

 );

 if(rank==="A1")score+=5;

 if(rank==="A2")score+=2;

 if(rank==="B2")score-=2;

 const overview=

  calculateOverview();

 /*

  50%以上：

  イン逃げを最優先

 */

 if(

  overview.escape>=50&&

  boat===1&&

  course===1

 ){

  score+=35;

 }

 /*

  45%以上：

  イン逃げ強化

 */

 else if(

  overview.escape>=45&&

  boat===1&&

  course===1

 ){

  score+=25;

 }

 /*

  40%以上：

  イン平均期待

 */

 else if(

  overview.escape>=40&&

  boat===1&&

  course===1

 ){

  score+=15;

 }

 /*

  35〜40：

  1号艇だけで決めない

 */

 else if(

  overview.escape>=35&&

  boat===1&&

  course===1

 ){

  score+=5;

 }

 /*

  35未満：

  他艇の攻めを優先

 */

 if(

  overview.escape<35&&

  boat!==1

 ){

  score+=

   decisionSuitability(

    boat,

    dominantType({

     escape:0,

     sashi:overview.sashi,

     maki:overview.maki,

     makiSashi:overview.makiSashi

    })

   )*.6;

 }

 return Math.max(0,score);

}

function getExcludedBoats(rankings){

 const excluded=new Set();

 if(!rankings.length)return excluded;

 rankings.slice(3).forEach(x=>{

   x.boat===1&&

  const gap=

   top.score-x.score;

  const motor=

   boatHasStrongMotor(x.boat);

  const history=

   boatHasGoodHistory(x.boat);

  const attack=

   boatHasAttack(

    x.boat,

    calculateOverview()

   );

  if(

   gap>=18&&

   !motor&&

   !history&&

   !attack

  ){

   excluded.add(x.boat);

 });

 return excluded;

}

    今回は明確な除外候補なし。

   </div>`;

 }

 el.innerHTML=html;

}

/* =====================================================

   買い目候補

===================================================== */

function getRank(rankings,boat){

 return(

  rankings.findIndex(

   x=>x.boat===boat

  )+1

 );

}

function getFirstCandidates(rankings){

 const excluded=

  getExcludedBoats(rankings);

 const overview=

  calculateOverview();

 return rankings.filter(x=>{

  const rank=

   getRank(rankings,x.boat);

  if(rank>4)return false;

  if(excluded.has(x.boat))

   return false;

  const course=

   getCourse(x.boat);

  /*

   50%以上：

   1号艇を最優先

  */

  if(

   overview.escape>=50&&

   x.boat===1&&

   course===1

  )return true;

  /*

   45%以上：

   1号艇を強く残す

  */

  if(

   overview.escape>=45&&

   x.boat===1&&

   course===1

  )return true;

  /*

   40%以上：

   1号艇を基本残す

  */

  if(

   overview.escape>=40&&

   x.boat===1&&

   course===1

  )return true;

  /*

   35〜40：

   総合評価

  */

  const attack=

   boatHasAttack(

    x.boat,

    overview

   );

  const motor=

   boatHasStrongMotor(x.boat);

  const history=

   boatHasGoodHistory(x.boat);

  return(

   attack||

   motor||

   history

  );

 });

}

function getSecondCandidates(rankings){

 const excluded=

  getExcludedBoats(rankings);

 const overview=

  calculateOverview();

 return rankings.filter(x=>{

  if(excluded.has(x.boat))

   return false;

  const rank=

   getRank(rankings,x.boat);

  if(rank<=4)return true;

  const reasons=[

   boatHasStrongMotor(x.boat),

   boatHasGoodHistory(x.boat),

   boatHasAttack(

    x.boat,

    overview

   )

  ].filter(Boolean).length;

  return reasons>=2;

 });

}

/* =====================================================

   1点生成

===================================================== */

function makeCandidate(

 a,b,rankings,type

){

 if(a===b)return null;

 const A=

  rankings.find(x=>x.boat===a);

 const B=

  rankings.find(x=>x.boat===b);

 if(!A||!B)return null;

 const overview=

  calculateOverview();

 const excluded=

  getExcludedBoats(rankings);

 if(

  excluded.has(a)||

  excluded.has(b)

 )return null;

 const rankA=

  getRank(rankings,a);

 const rankB=

  getRank(rankings,b);

 if(rankA>4)return null;

 if(rankB>4){

  const reasons=[

   boatHasStrongMotor(b),

   boatHasGoodHistory(b),

   boatHasAttack(

    b,

    overview

   )

  ].filter(Boolean).length;

  if(reasons<2)return null;

 }

 let raw=

  A.score*1.45+

  B.score*.80;

 raw+=

  rankA===1?14:

  rankA===2?9:

  rankA===3?5:2;

 raw+=

  rankB===1?8:

  rankB===2?6:

  rankB===3?4:2;

 /* =================================

    イン逃げ

    40 / 45 / 50連動

 ================================= */

 if(type==="escape"){

  if(

   getCourse(1)!==1||

   a!==1

  )return null;

  if(overview.escape<40)

   return null;

  if(overview.escape>=50){

   raw+=

    80+

    overview.escape*2;

  }else if(overview.escape>=45){

   raw+=

    55+

    overview.escape*1.5;

  }else{

   raw+=

    30+

    overview.escape;

  }

  raw+=

   decisionSuitability(

    1,

    "escape"

   );

 }

 /* 差し */

 if(type==="sashi"){

  if(a===1)return null;

  raw+=

   decisionSuitability(

    a,

    "sashi"

   )*.9+

   overview.sashi*.75;

 }

 /* まくり */

 if(type==="maki"){

  if(a===1)return null;

  raw+=

   decisionSuitability(

    a,

    "maki"

   )*.9+

   overview.maki*.75;

 }

 /* まくり差し */

 if(type==="makiSashi"){

  if(a===1)return null;

  raw+=

   decisionSuitability(

    a,

    "makiSashi"

   )*.9+

   overview.makiSashi*.75;

 }

 raw+=

  historyScore(a)*1.3;

 const r=getRacer(a);

 raw+=

  n(

   r?.motor_top_2_percent||

   r?.motor_2ren_rate

  )*.08;

 if(rankA===1)raw+=10;

 if(rankA===2)raw+=6;

 if(rankA===3)raw+=3;

 if(rankB===1)raw+=5;

 if(rankB===2)raw+=4;

 if(rankB===3)raw+=2;

 return{

  key:`${a}-${b}`,

  a,

  b,

  raw:Math.max(.01,raw),

  rankA,

  rankB

 };

}

/* =====================================================

   プール

===================================================== */

function makePool(rankings,type){

 const pool=[];

 const firsts=

  getFirstCandidates(rankings);

 const seconds=

  getSecondCandidates(rankings);

 for(const A of firsts){

  for(const B of seconds){

   const x=

    makeCandidate(

     A.boat,

     B.boat,

     rankings,

     type

    );

   if(x)pool.push(x);

  }

 }

 return pool.sort(

  (a,b)=>b.raw-a.raw

 );

}

/* =====================================================

   買い目構築

===================================================== */

function buildBets(rankings){

 const result={

  hit:[],

  escape:[],

  sashi:[],

  maki:[],

  makiSashi:[],

  under:[]

 };

 const used=new Set();

 const overview=

  calculateOverview();

 /*

  的中率重視

 */

 let hitPool=[];

 [

  "escape",

  "sashi",

  "maki",

  "makiSashi"

 ].forEach(type=>{

  hitPool.push(

   ...makePool(

    rankings,

    type

   )

  );

 });

 hitPool.sort(

  (a,b)=>b.raw-a.raw

 );

 /*

  50%以上なら

  1号艇1着を必ず優先

 */

 if(

  overview.escape>=50&&

  getCourse(1)===1

 ){

  const escape=

   hitPool.filter(

    x=>x.a===1

   );

  for(const x of escape){

   if(result.hit.length>=4)

    break;

   if(!used.has(x.key)){

    result.hit.push(x);

    used.add(x.key);

   }

  }

 }

 /*

  40%以上でも

  1号艇1着を最低1点残す

 */

 if(

  overview.escape>=40&&

  getCourse(1)===1&&

  !result.hit.some(

   x=>x.a===1

  )

 ){

  const one=

   hitPool.find(

    x=>x.a===1

   );

  if(one){

   result.hit.push(one);

   used.add(one.key);

  }

 }

 for(const x of hitPool){

  if(result.hit.length>=4)

   break;

  if(used.has(x.key))

   continue;

  result.hit.push(x);

  used.add(x.key);

 }

 /*

  回収率・イン逃げ

 */

 if(

  overview.escape>=40&&

  getCourse(1)===1

 ){

  const pool=

   makePool(

    rankings,

    "escape"

   );

  for(const x of pool){

   if(result.escape.length>=4)

    break;

   if(used.has(x.key))

    continue;

   result.escape.push(x);

   used.add(x.key);

  }

 }

 /*

  差し

 */

 for(

  const x of makePool(

   rankings,

   "sashi"

  )

 ){

  if(result.sashi.length>=4)

   break;

  if(used.has(x.key))

   continue;

  result.sashi.push(x);

  used.add(x.key);

 }

 /*

  まくり

 */

 for(

  const x of makePool(

   rankings,

   "maki"

  )

 ){

  if(result.maki.length>=4)

   break;

  if(used.has(x.key))

   continue;

  result.maki.push(x);

  used.add(x.key);

 }

 /*

  まくり差し

 */

 for(

  const x of makePool(

   rankings,

   "makiSashi"

  )

 ){

  if(result.makiSashi.length>=4)

   break;

  if(used.has(x.key))

   continue;

  result.makiSashi.push(x);

  used.add(x.key);

 }

 /*

  穴

 */

 const under=[];

 rankings.slice(1).forEach(target=>{

  const boat=target.boat;

  const reasons=[

   boatHasStrongMotor(boat),

   boatHasGoodHistory(boat),

   boatHasAttack(

    boat,

    overview

   )

  ].filter(Boolean).length;

  if(!reasons)return;

  if(

   getRank(rankings,boat)>=5&&

   reasons<2

  )return;

  for(const second of rankings){

   if(second.boat===boat)

    continue;

   const x=

    makeCandidate(

     boat,

     second.boat,

     rankings,

     dominantType(overview)

    );

   if(x){

    x.raw+=15;

    under.push(x);

   }

  }

 });

 under.sort(

  (a,b)=>b.raw-a.raw

 );

 for(const x of under){

  if(result.under.length>=3)

   break;

  if(used.has(x.key))

   continue;

  result.under.push(x);

  used.add(x.key);

 }

 /*

  確率

 */

 const all=[

  ...result.hit,

  ...result.escape,

  ...result.sashi,

  ...result.maki,

  ...result.makiSashi,

  ...result.under

 ];

 const totalRaw=

  all.reduce(

   (s,x)=>s+x.raw,

   0

  );

 if(totalRaw>0){

  all.forEach(x=>{

   x.probability=

    x.raw/totalRaw*100;

  });

 }

 result.total=

  all.reduce(

   (s,x)=>

    s+(x.probability||0),

   0

  );

 return result;

}

/* =====================================================

   星

===================================================== */

function getStarCount(){

 const budget=getBudget();

 if(budget<=500)return 1;

 if(budget<=1000)return 2;

 if(budget<=2000)return 3;

 if(budget<=3000)return 4;

 if(budget<=5000)return 6;

 if(budget<=10000)return 8;

 if(budget<=20000)return 10;

 return 12;

}

function getStarKeys(bets){

 const all=[];

 Object.values(bets).forEach(list=>{

  if(!Array.isArray(list))

   return;

  list.forEach(item=>{

   if(item.key)

    all.push(item);

  });

 });

 all.sort(

  (a,b)=>

   (b.probability||0)-

   (a.probability||0)

 );

 return new Set(

  all

  .slice(0,getStarCount())

  .map(x=>x.key)

 );

}

function renderPicks(

 id,

 list,

 bets

){

 const el=

  document.getElementById(id);

 if(!list||!list.length){

  el.innerHTML=

   `<div class="noPick">

    該当買い目なし

   </div>`;

  return;

 }

 const stars=

  getStarKeys(bets);

 el.innerHTML=

  list.map(x=>{

   const p=

    x.probability||0;

   let cls="";

   if(p>=7)

    cls="veryStrong";

   else if(p>=6)

    cls="strong";

   else if(p<=5.2)

    cls="weak";

   return`

   <div class="pick ${cls}">

    <div class="pickLeft">

     <span class="star">

      ${stars.has(x.key)?"⭐":""}

     </span>

     <strong>

      ${x.a} → ${x.b}

     </strong>

    </div>

    <span class="prob">

     ${p.toFixed(1)}%

    </span>

   </div>`;

  }).join("");

}

function renderBets(bets){

 document.getElementById(

  "displayBudget"

 ).textContent=

  formatYen(getBudget());

 renderPicks(

  "hitPicks",

  bets.hit,

  bets

 );

 renderPicks(

  "escapePicks",

  bets.escape,

  bets

 );

 renderPicks(

  "sashiPicks",

  bets.sashi,

  bets

 );

 renderPicks(

  "makiPicks",

  bets.maki,

  bets

 );

 renderPicks(

  "makiSashiPicks",

  bets.makiSashi,

  bets

 );

 renderPicks(

  "underPicks",

  bets.under,

  bets

 );

 document.getElementById(

  "totalProbability"

 ).textContent=

  (bets.total||0).toFixed(1)+"%";

}
