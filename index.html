<style>

*{

}

body{

@media(max-width:600px){

<script>

"use strict";

/* =====================================

 API

===================================== */

const API_URL=

"https://boatraceopenapi.github.io/api/v1/today.json";

let raceData=null;

let selectedEntry=[];

/* =====================================

 共通

===================================== */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function format(v){

 if(

  v===null||

  v===undefined||

  v===""

 )

  return "-";

 const n=Number(v);

 return Number.isFinite(n)

  ?n.toFixed(2)

  :String(v);

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)

  return null;

 for(const k of keys){

  if(

   o[k]!==undefined&&

   o[k]!==null&&

   o[k]!==""

  )

   return o[k];

 }

 return null;

}

function getRank(v){

 return{

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

/* =====================================

 racers

===================================== */

function getRacers(race){

 if(!race)

  return[];

 if(

  race.racers&&

  typeof race.racers==="object"

 ){

  return Array.isArray(race.racers)

   ?race.racers

   :Object.values(race.racers);

 }

 if(Array.isArray(race.players))

  return race.players;

 if(

  race.players&&

  typeof race.players==="object"

 )

  return Object.values(race.players);

 return[];

}

/* =====================================

 preview

===================================== */

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)

  return[];

 if(

  preview.racers&&

  typeof preview.racers==="object"

 ){

  return Array.isArray(preview.racers)

   ?preview.racers

   :Object.values(preview.racers);

 }

 return[];

}

/* =====================================

 選手情報

===================================== */

function getBoatNumber(r){

 return num(

  r.entry_number??

  r.boat_number??

  r.number

 );

}

function getName(r){

 return r.name||

 r.racer_name||

 r.player_name||

 "選手名不明";

}

function getST(r){

 return num(firstValue(r,[

  "start_timing",

  "st",

  "average_start_timing",

  "start"

 ]));

}

function getExhibition(r){

 return num(firstValue(r,[

  "exhibition_time",

  "display_time",

  "exhibition"

 ]));

}

function getPreviewCourse(r){

 return num(firstValue(r,[

  "course_number",

  "course",

  "entry_course"

 ]));

}

function getLap(r){

 return num(firstValue(r,[

  "one_lap_time",

  "one_lap",

  "lap_time",

  "first_lap_time",

  "first_lap",

  "turn_time",

  "one_round_time",

  "one_round"

 ]));

}

/* =====================================

 進入

===================================== */

function getAnalysisEntry(){

 if(selectedEntry.length===0)

  return[1,2,3,4,5,6];

 return[...selectedEntry];

}

/* =====================================

 API取得

===================================== */

async function fetchJson(url){

 const r=await fetch(

  url+"?t="+Date.now(),

  {

   cache:"no-store",

   headers:{

    Accept:"application/json"

   }

  }

 );

 if(!r.ok)

  throw new Error("HTTP "+r.status);

 return await r.json();

}

function findRace(data,stadium,race){

 if(!data)

  return null;

 if(

  data.programs&&

  data.programs.stadiums

 ){

  const s=

   data.programs.stadiums[String(stadium)];

  if(s&&s.races){

   const r=

    s.races[String(race)];

   if(r)

    return r;

  }

 }

 let found=null;

 function walk(o){

  if(

   found||

   !o||

   typeof o!=="object"

  )

   return;

  if(

   o.stadium_number!==undefined&&

   num(o.stadium_number)===stadium&&

   o.race_number!==undefined&&

   num(o.race_number)===race&&

   (o.racers||o.preview)

  ){

   found=o;

   return;

  }

  Object.keys(o).forEach(k=>{

   if(!found)

    walk(o[k]);

  });

 }

 walk(data);

 return found;

}

/* =====================================

 出走表

===================================== */

function displayRace(race){

 const box=

  document.getElementById("boats");

 box.innerHTML="";

 const racers=

  getRacers(race)

  .sort(

   (a,b)=>

   getBoatNumber(a)-

   getBoatNumber(b)

  );

 if(racers.length<6){

  box.innerHTML=

  '<div class="warning">⚠️ 6艇の選手データを取得できませんでした。</div>';

  return false;

 }

 const preview=

  getPreviewRacers(race);

 racers.forEach(r=>{

  const p=

   preview.find(

    x=>

    getBoatNumber(x)===

    getBoatNumber(r)

   );

  const exhibition=

   p?getExhibition(p):0;

  const st=

   p?getST(p):getST(r);

  const lap=

   getLap(r);

  const d=

   document.createElement("div");

  d.className="boat";

  d.innerHTML=`

   <div class="boat-number">

    ${getBoatNumber(r)}

   </div>

   <div class="boat-name">

    ${esc(getName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${format(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${format(r.local_win_rate)}

   </div>

   <div class="metric">

    M${r.motor_number||"-"}

   </div>

   <div class="metric">

    M2連 ${format(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${format(r.motor_top_3_percent)}%

   </div>

   <div class="metric">

    ST ${st>0?format(st):"-"}

   </div>

   <div class="metric exhibition">

    展示 ${

     exhibition>0

      ?format(exhibition)+"秒"

      :"－"

    }

   </div>

   <div class="metric lap">

    一周 ${

     lap>0

      ?format(lap)+"秒"

      :"－"

    }

   </div>

  `;

  box.appendChild(d);

 });

 return true;

}

/* =====================================

 直前情報

===================================== */

function displayPreview(race){

 const box=

  document.getElementById("previewInfo");

 const p=race.preview;

 if(!p){

  box.innerHTML=

  '<div class="warning">⚠️ 直前情報は取得できませんでした。</div>';

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">風向</div>

   <div class="info-value">

    ${

     p.wind_direction||

     p.wind_direction_number||

     "-"

    }

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* =====================================

 展示 ST 進入

===================================== */

function displayPreviewRacers(race){

 const box=

  document.getElementById("previewRacers");

 const racers=

  getPreviewRacers(race)

  .sort(

   (a,b)=>

   getBoatNumber(a)-

   getBoatNumber(b)

  );

 if(!racers.length){

  box.innerHTML=

  '<div class="warning">⚠️ 展示・ST・直前進入データなし</div>';

  return;

 }

 let html=`

 <table class="lap-table">

 <thead>

 <tr>

  <th>艇</th>

  <th>直前進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  const course=

   getPreviewCourse(r);

  const st=

   getST(r);

  const exhibition=

   getExhibition(r);

  html+=`

  <tr>

   <td>

    ${getBoatNumber(r)}号艇

   </td>

   <td class="gold">

    ${

     course>0

      ?course+"コース"

      :"－"

    }

   </td>

   <td>

    ${

     st>0

      ?format(st)

      :"－"

    }

   </td>

   <td class="yellow">

    ${

     exhibition>0

      ?format(exhibition)+"秒"

      :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 <div class="note">

 ※直前情報として取得できたデータのみ評価します。

 </div>

 `;

 box.innerHTML=html;

}

/* =====================================

 一周タイム

===================================== */

function displayLap(race){

 const box=

  document.getElementById("lapInfo");

 const racers=

  getRacers(race);

 const valid=

  racers.filter(

   r=>getLap(r)>0

  );

 if(!valid.length){

  box.innerHTML=`

   <div class="warning">

    ⚠️ 一周タイムデータなし

    <br><br>

    現在のAPIデータに一周タイムが含まれていない場合は、

    無理に数値を作らず、

    <strong>展示タイム・ST・モーター・展開</strong>

    を中心に評価します。

   </div>

  `;

  return;

 }

 const best=

  Math.min(

   ...valid.map(

    r=>getLap(r)

   )

  );

 let html=`

 <table class="lap-table">

 <thead>

function windInfo(){

  raceData?.preview;

 if(!p)

  return{

   speed:0,

   head:false,

   tail:false

  };

  num(p.wind_speed);

  String(

   p.wind_direction||

   p.wind_dir||

   p.wind_name||

   ""

  ).toLowerCase();

 return{

  head:

   d.includes("向")&&

   !d.includes("追"),

  tail:

   d.includes("追")

 };

/* =====================================

 コース適性

===================================== */

function courseAbility(r,course){

 if(!r)

  return 0;

 const keys=[

  "course_win_rate_"+course,

  "course_"+course+"_win_rate",

  "course"+course+"_win_rate",

  "win_rate_course_"+course,

  "course_"+course

 ];

 const value=

  firstValue(r,keys);

 if(value!==null)

  return num(value);

 return 0;

}

/* =====================================

 基本能力

===================================== */

function baseAbility(r,course){

 if(!r)

  return 0;

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=

  previewByBoat(

   getBoatNumber(r)

  );

 const st=

  p?getST(p):getST(r);

 const exhibition=

  p?getExhibition(p):getExhibition(r);

 let score=0;

 score+=national*6;

 score+=local*3;

 score+=m2*.22;

 score+=m3*.08;

 if(st>0){

  score+=

   Math.max(

    0,

    .25-st

   )*25;

 }

 if(exhibition>0){

  score+=

   Math.max(

    0,

    6.90-exhibition

   )*4;

 }

 score+=

  ({

   1:10,

   2:6,

   3:5,

   4:4,

   5:2,

   6:0

  }[course]||0);

 const rank=

  num(r.rank_number);

 if(rank===1)

  score+=4;

 if(rank===2)

  score+=2;

 if(rank===4)

  score-=2;

 const ca=

  courseAbility(

   r,

   course

  );

 if(ca>0)

  score+=ca*.8;

 return score;

}

/* =====================================

 攻め手評価

===================================== */

function attackScore(boat,course){

 const r=

  racerByBoat(boat);

 const p=

  previewByBoat(boat);

 if(!r)

  return 0;

 const st=

  p?getST(p):getST(r);

 const exhibition=

  p

   ?getExhibition(p)

   :getExhibition(r);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 let score=0;

 /*

  2〜4コースを攻め候補として評価

 */

 if(course===2)

  score+=8;

 if(course===3)

  score+=9;

 if(course===4)

  score+=12;

 if(course===5)

  score+=5;

 if(st>0){

  score+=

   Math.max(

    0,

    .20-st

   )*45;

 }

 if(m2>30)

  score+=(m2-30)*.18;

 if(m3>50)

  score+=(m3-50)*.06;

 if(exhibition>0){

  score+=

   Math.max(

    0,

    6.90-exhibition

   )*6;

 }

 return score;

}

/* =====================================

===================================== */

function development(){

 const entry=

  getAnalysisEntry();

 const first=

  entry[0];

 const firstR=

  racerByBoat(first);

 const firstP=

  previewByBoat(first);

 const firstST=

  firstP

   ?getST(firstP)

   :getST(firstR);

 const attacks=

  attackCandidates();

 const attacker=

  attacks.find(

   x=>

   x.course>=2

  );

 const wind=

  windInfo();

 let escape=58;

 if(firstR){

  const national=

   num(firstR.national_win_rate);

  const local=

   num(firstR.local_win_rate);

  const m2=

   num(firstR.motor_top_2_percent);

  const m3=

   num(firstR.motor_top_3_percent);

  if(national>=6.5)

   escape+=5;

  if(national<5.5)

   escape-=5;

  if(local>=6.5)

   escape+=4;

  if(local<5.5)

   escape-=4;

  if(m2>=40)

   escape+=5;

  if(m2<30)

   escape-=5;

  if(m3>=60)

   escape+=3;

  if(m3<45)

   escape-=3;

 }

 if(firstST>0&&firstST<=.15)

  escape+=7;

 if(firstST>=.20)

  escape-=8;

 if(attacker&&attacker.score>=15)

  escape-=10;

 if(wind.speed>=4)

  escape-=4;

 escape=

  Math.max(

   5,

   Math.min(

    95,

    Math.round(escape)

   )

  );

 if(

  attacker&&

  attacker.score>=22&&

  escape<70

 ){

  const type=

   attacker.course>=4

    ?"まくり"

    :"まくり差し";

  return{

   type,

   attacker:

    attacker.boat,

   course:

    attacker.course,

   escape,

   outside:

    100-escape,

   reason:

    `${attacker.boat}号艇が攻め手候補。ST・モーター・展示を総合評価。`

  };

 }

 if(

  attacker&&

  attacker.score>=16&&

  escape<65

 ){

  return{

   type:"差し",

   attacker:

    attacker.boat,

   course:

    attacker.course,

   escape,

   outside:

    100-escape,

   reason:

    `${attacker.boat}号艇の差し展開を警戒。`

  };

 }

 return{

  type:"イン逃げ",

  attacker:first,

  course:1,

  escape,

  outside:

   100-escape,

  reason:

   `1号艇の先マイを中心に評価。`

 };

}

function ranking(dev){

  getAnalysisEntry();

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   entry.indexOf(boat)+1;

  let score=

   baseAbility(

    r,

    course

   );

  /*

   展開加点

  */

  if(dev.type==="イン逃げ"){

   if(boat===entry[0])

    score+=10;

   if(course===2)

    score+=4;

   if(course===3)

    score+=3;

  }else{

   if(boat===dev.attacker)

    score+=10;

   /*

    攻め手の後ろ

   */

   if(

    course===

    dev.course+1

   )

    score+=6;

  }

  return{

   number:boat,

   name:getName(r),

   racer:r,

   course,

   score

  };

 })

 .sort(

  (a,b)=>

  b.score-a.score

 );

}

/* =====================================

 回収期待値

===================================== */

function roiScore(

 combo,

 ranking,

 dev

){

 const n=

  combo.split("-")

  .map(Number);

 let score=0;

 const first=

  n[0];

 const second=

  n[1];

 const third=

  n[2];

 const firstRank=

  ranking.find(

   x=>x.number===first

  );

 const secondRank=

  ranking.find(

   x=>x.number===second

  );

 const thirdRank=

  ranking.find(

   x=>x.number===third

  );

 if(!firstRank||

   !secondRank||

   !thirdRank)

  return 0;

 /*

  能力だけではなく

  展開・機力・穴度を加える

 */

 score+=

  Math.max(

   0,

   60-firstRank.score

  )*.15;

 if(

  dev.type!=="イン逃げ"&&

  first===dev.attacker

 )

  score+=18;

 /*

  攻め手の後ろ

 */

 if(

  dev.type!=="イン逃げ"&&

  second===dev.attacker+1

 )

  score+=15;

 if(

  dev.type!=="イン逃げ"&&

  third===dev.attacker+1

 )

  score+=8;

 const r1=

  racerByBoat(first);

 const r2=

  racerByBoat(second);

 const r3=

  racerByBoat(third);

 [r1,r2,r3].forEach(r=>{

  if(!r)

   return;

  const m2=

   num(r.motor_top_2_percent);

  const m3=

   num(r.motor_top_3_percent);

  score+=

   Math.max(

    0,

    m2-35

   )*.20;

  score+=

   Math.max(

    0,

    m3-55

   )*.08;

 });

 /*

  AI上位だけで固まる買い目は

  回収側では少し減点

 */

 const positions=

  n.map(

   x=>

   ranking.findIndex(

    r=>r.number===x

   )

  );

 const topCount=

  positions.filter(

   x=>x>=0&&x<=2

  ).length;

 if(topCount===3)

  score-=12;

 if(topCount===2)

  score-=4;

 /*

  穴の頭

 */

 if(

  firstRank&&

  ranking.indexOf(firstRank)>=3

 )

  score+=12;

 return score;

}

/* =====================================

 買い目理由

===================================== */

function pickReason(

 combo,

 ranking,

 dev

){

 const n=

  combo.split("-")

  .map(Number);

 const tags=[];

 const reasons=[];

 const first=n[0];

 const second=n[1];

 const third=n[2];

 const r1=

  racerByBoat(first);

 const r2=

  racerByBoat(second);

 const r3=

  racerByBoat(third);

 /*

  攻め手

 */

 if(

  dev.type!=="イン逃げ"&&

  first===dev.attacker

 ){

  tags.push("🔥攻め手");

  reasons.push(

   `${first}号艇が${dev.type}で主導権を取る展開`

  );

 }

 /*

  攻め手の後ろ

 */

 if(

  dev.type!=="イン逃げ"&&

  second===dev.attacker+1

 ){

  tags.push("🧩攻め手の後ろ");

  reasons.push(

   `${dev.attacker}号艇が攻めた後の展開を${second}号艇が拾う`

  );

 }

 if(

  dev.type!=="イン逃げ"&&

  third===dev.attacker+1

 ){

  tags.push("🧩展開拾い");

  reasons.push(

   `${dev.attacker}号艇の攻めで${third}号艇が展開を拾う`

  );

 }

 /*

  モーター

 */

 [r1,r2,r3].forEach(r=>{

  if(!r)

   return;

  const boat=

   getBoatNumber(r);

  const m2=

   num(r.motor_top_2_percent);

  const m3=

   num(r.motor_top_3_percent);

  if(m2>=40){

   tags.push("💪強モーター");

   reasons.push(

    `${boat}号艇はモーター2連率${format(m2)}%`

   );

  }

  if(m3>=60){

   tags.push("⚙️機力上位");

   reasons.push(

    `${boat}号艇はモーター3連率${format(m3)}%`

   );

  }

 });

 /*

  ST

 */

 [r1,r2,r3].forEach(r=>{

  if(!r)

   return;

  const p=

   previewByBoat(

    getBoatNumber(r)

   );

  const st=

   p?getST(p):getST(r);

  if(

   st>0&&

   st<=.15

  ){

   tags.push("⚡ST");

   reasons.push(

    `${getBoatNumber(r)}号艇ST${format(st)}`

   );

  }

 });

 /*

  展示

 */

 [r1,r2,r3].forEach(r=>{

  if(!r)

   return;

  const p=

   previewByBoat(

    getBoatNumber(r)

   );

  const ex=

   p?getExhibition(p):getExhibition(r);

  if(

   ex>0&&

   ex<=6.85

  ){

   tags.push("⏱展示好タイム");

   reasons.push(

    `${getBoatNumber(r)}号艇展示${format(ex)}秒`

   );

  }

 });

 /*

  イン逃げ

 */

 if(

  dev.type==="イン逃げ"&&

  first===getAnalysisEntry()[0]

 ){

  tags.push("🏠イン逃げ");

  reasons.push(

   `1号艇の逃げを中心に評価`

  );

 }

 /*

  穴

 */

 const rr=

  ranking.find(

   x=>x.number===first

  );

 if(

  rr&&

  ranking.indexOf(rr)>=3

 ){

  tags.push("🎯穴頭");

  reasons.push(

   `AI能力順位だけではなく展開・機力を評価`

  );

 }

 return{

  tags:[

   ...new Set(tags)

  ],

  text:

   [...new Set(reasons)].join("。")||

   "展開・機力・STを総合評価。"

 };

}

/* =====================================

 的中率重視

===================================== */

function buildHit(

 ranking,

 dev

){

 const arr=[];

 const inside=

  getAnalysisEntry()[0];

 const top=

  ranking

  .slice(0,4)

  .map(x=>x.number);

 function add(combo){

  if(

   arr.some(

    x=>x.combo===combo

   )

  )

   return;

  const n=

   combo.split("-")

   .map(Number);

  if(

   n.length!==3||

   new Set(n).size!==3

  )

   return;

  const reason=

   pickReason(

    combo,

    ranking,

    dev

   );

  arr.push({

   combo,

   tags:reason.tags,

   text:reason.text,

   mode:"hit"

  });

 }

 if(dev.type==="イン逃げ"){

  add(`${inside}-${top[1]}-${top[2]}`);

  add(`${inside}-${top[2]}-${top[1]}`);

  add(`${inside}-${top[1]}-${top[3]}`);

  add(`${inside}-${top[3]}-${top[1]}`);

  add(`${inside}-${top[2]}-${top[3]}`);

  add(`${inside}-${top[3]}-${top[2]}`);

 }else{

  add(`${top[0]}-${top[1]}-${top[2]}`);

  add(`${top[0]}-${top[2]}-${top[1]}`);

  add(`${top[1]}-${top[0]}-${top[2]}`);

  add(`${top[0]}-${top[1]}-${inside}`);

  add(`${dev.attacker}-${top[0]}-${top[1]}`);

 }

 return arr.slice(0,7);

}

/* =====================================

 回収率重視

===================================== */

function buildROI(

 ranking,

 dev

){

 const candidates=[];

 const all=

  ranking.map(

   x=>x.number

  );

 for(const a of all){

  for(const b of all){

   if(a===b)

    continue;

   for(const c of all){

    if(

     c===a||

     c===b

    )

     continue;

    const combo=

     `${a}-${b}-${c}`;

    const score=

     roiScore(

      combo,

      ranking,

      dev

     );

    const reason=

     pickReason(

      combo,

      ranking,

      dev

     );

    candidates.push({

     combo,

     score,

     tags:reason.tags,

     text:reason.text,

     mode:"roi"

    });

   }

  }

 }

 /*

  回収率側は

  「的中率上位」と被らないように

  穴・展開を優先

 */

 return candidates

 .sort(

  (a,b)=>

  b.score-a.score

 )

 .slice(0,7);

}

/* =====================================

 レース取得

===================================== */

async function loadRace(){

 const stadium=

  num(

   document.getElementById(

    "venue"

   ).value

  );

 const raceNumber=

  num(

   document.getElementById(

    "race"

   ).value

  );

 const status=

  document.getElementById(

   "status"

  );

 const btn=

  document.getElementById(

   "loadButton"

  );

 btn.disabled=true;

 btn.innerText=

  "⏳ 取得中...";

 document.getElementById(

  "result"

 ).classList.add("hidden");

 try{

  status.innerHTML=

   "⏳ 最新データを取得中...";

  const data=

   await fetchJson(

    API_URL

   );

  const race=

   findRace(

    data,

    stadium,

    raceNumber

   );

  if(!race)

   throw new Error(

    "指定レースがありません"

   );

  const racers=

   getRacers(race);

  if(racers.length<6)

   throw new Error(

    "6艇の選手データがありません"

   );

  raceData=race;

  selectedEntry=[];

  displayRace(race);

  displayPreview(race);

  displayPreviewRacers(race);

  displayLap(race);

  createEntryButtons();

  document.getElementById(

   "result"

  ).classList.remove("hidden");

  document.getElementById(

   "apiInfo"

  ).innerHTML=`

   取得元：

   <strong>

    Boatrace Open API v1

   </strong>

   <br>

   会場番号：

   ${stadium}

   <br>

   レース：

   ${raceNumber}R

   <br>

   出走表：

   ${racers.length}名

   <br>

   直前情報：

   ${getPreviewRacers(race).length}艇

  `;

  status.innerHTML=

   "✅ 出走表・直前情報取得成功";

 }catch(e){

  status.innerHTML=`

   <span class="red">

    ❌ 出走表取得失敗

   </span>

   <br>

   ${esc(e.message)}

  `;

 }finally{

  btn.disabled=false;

  btn.innerText=

   "🔥 出走表を取得";

 }

}

/* =====================================

 起動

===================================== */

document.addEventListener(

 "DOMContentLoaded",

 ()=>{

  document.getElementById(

   "loadButton"

  ).onclick=

   loadRace;

  document.getElementById(

   "clearButton"

  ).onclick=

   clearEntry;

  document.getElementById(

   "analyzeButton"

  ).onclick=

   ()=>{

    if(!raceData){

     alert(

      "先に出走表を取得してください。"

     );

     return;

    }

    if(

     selectedEntry.length!==0&&

     selectedEntry.length!==6

    ){

     alert(

      "進入を入力する場合は6艇すべて入力してください。"

     );

     return;

    }

    showAnalysis();

   };

  selectedEntry=[];

  createEntryButtons();

  clearEntry();

 }

);

</script>

</body>

</html>
