<script>

"use strict";

const API_URL =

"https://boatraceopenapi.github.io/api/v1/today.json";

let raceData=null;

let selectedEntry=[];

/* =========================

   基本

========================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(d):"-";

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

function getRank(v){

 return {

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

/* =========================

   API

========================= */

async function fetchJson(url){

 const response=await fetch(

  url+"?t="+Date.now(),

  {

   method:"GET",

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

function findRace(data,stadium,race){

 if(!data)return null;

 try{

  const direct=

   data?.programs

    ?.stadiums

    ?.[String(stadium)]

    ?.races

    ?.[String(race)];

  if(direct)return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)return;

  if(typeof o!=="object")return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* =========================

   レーサー

========================= */

function getRacers(race){

 if(!race)return[];

 const racers=race.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)return[];

 const racers=preview.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function boatNo(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number

 );

}

function racerName(r){

 return(

  r?.name ||

  r?.racer_name ||

  "選手名不明"

 );

}

function previewFor(r){

 return getPreviewRacers(raceData)

 .find(

  x=>boatNo(x)===boatNo(r)

 )||{};

}

function getST(r){

 return num(

  firstValue(r,[

   "start_timing",

   "st"

  ])

 );

}

function getExhibition(r){

 return num(

  firstValue(r,[

   "exhibition_time",

   "display_time"

  ])

 );

}

function getCourse(r){

 return num(

  firstValue(r,[

   "course_number",

   "course"

  ])

 );

}

/* =========================

   出走表

========================= */

function displayRace(){

 const box=document.getElementById("boats");

 box.innerHTML="";

 const racers=

  getRacers(raceData)

  .sort(

   (a,b)=>boatNo(a)-boatNo(b)

  );

 if(racers.length<6){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 6艇の出走表を取得できませんでした。

   </div>

  `;

  return false;

 }

 const preview=getPreviewRacers(raceData);

 racers.forEach(r=>{

  const p=

   preview.find(

    x=>boatNo(x)===boatNo(r)

   )||{};

  const st=getST(p);

  const ex=getExhibition(p);

  const div=document.createElement("div");

  div.className="boat";

  div.innerHTML=`

   <div class="boat-number">

    ${boatNo(r)}

   </div>

   <div class="boat-name">

    ${esc(racerName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${fmt(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${fmt(r.local_win_rate)}

   </div>

   <div class="metric">

    M${r.motor_number||"-"}

   </div>

   <div class="metric">

    M2連 ${fmt(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${fmt(r.motor_top_3_percent)}%

   </div>

   <div class="metric st">

    ST ${st>0?fmt(st):"-"}

   </div>

   <div class="metric exhibition">

    展示 ${ex>0?fmt(ex):"-"}

   </div>

  `;

  box.appendChild(div);

 });

 return true;

}

/* =========================

   直前

========================= */

function displayPreview(){

 const box=document.getElementById("previewInfo");

 const p=raceData?.preview;

 if(!p){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 直前情報なし

   </div>

  `;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">風向番号</div>

   <div class="info-value">

    ${p.wind_direction_number??"-"}

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* =========================

   展示

========================= */

function displayPreviewRacers(){

 const box=

  document.getElementById(

   "previewRacers"

  );

 const racers=

  getPreviewRacers(raceData)

  .sort(

   (a,b)=>boatNo(a)-boatNo(b)

  );

 if(!racers.length){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 展示・ST・直前進入データなし

   </div>

  `;

  return;

 }

 let html=`

 <table class="table">

 <thead>

 <tr>

  <th>艇</th>

  <th>進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  html+=`

  <tr>

   <td>

    ${boatNo(r)}号艇

   </td>

   <td class="gold">

    ${

     getCourse(r)>0

     ?getCourse(r)+"コース"

     :"－"

    }

   </td>

   <td class="orange">

    ${

     getST(r)>0

     ?fmt(getST(r))

     :"－"

    }

   </td>

   <td class="yellow">

    ${

     getExhibition(r)>0

     ?fmt(getExhibition(r))

     :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 `;

 box.innerHTML=html;

}

/* =========================

   進入

========================= */

function createEntryButtons(){

 const box=

  document.getElementById(

   "entryButtons"

  );

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.onclick=()=>{

   selectEntry(i);

  };

  box.appendChild(b);

 }

}

function selectEntry(n){

 if(selectedEntry.includes(n))

  return;

 if(selectedEntry.length>=6)

  return;

 selectedEntry.push(n);

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  selectedEntry.join("-");

}

function updateEntryButtons(){

 document.querySelectorAll(

  ".entry-btn"

 ).forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  "進入を入力してください";

}

function getEntry(){

 if(selectedEntry.length===6)

  return [...selectedEntry];

 return[1,2,3,4,5,6];

}

/* =========================

   基本スコア

========================= */

function baseScore(r,course){

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const n2=

  num(r.national_top_2_percent);

 const n3=

  num(r.national_top_3_percent);

 const l2=

  num(r.local_top_2_percent);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 let s=0;

 s+=national*6;

 s+=local*3;

 s+=n2*.08;

 s+=n3*.04;

 s+=l2*.04;

 s+=m2*.18;

 s+=m3*.07;

 if(st>0)

  s+=Math.max(0,.25-st)*25;

 if(ex>0)

  s+=Math.max(0,6.90-ex)*8;

 s+=({

  1:10,

  2:6,

  3:5,

  4:4,

  5:2,

  6:0

 }[course]||0);

 const rank=num(r.rank_number);

 if(rank===1)s+=5;

 if(rank===2)s+=3;

 if(rank===4)s-=2;

 return s;

}

/* =========================

   攻め

========================= */

function attackScore(r,course){

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 let s=0;

 if(st>0){

  if(st<=.12)s+=20;

  else if(st<=.15)s+=16;

  else if(st<=.18)s+=10;

  else if(st<=.20)s+=4;

 }

 if(ex>0){

  if(ex<=6.70)s+=15;

  else if(ex<=6.80)s+=10;

  else if(ex<=6.90)s+=4;

 }

 if(m2>=45)s+=15;

 else if(m2>=40)s+=11;

 else if(m2>=35)s+=7;

 else if(m2>=30)s+=3;

 if(m3>=65)s+=10;

 else if(m3>=60)s+=7;

 else if(m3>=55)s+=4;

 if(course>=4)s+=7;

 if(course===3)s+=5;

function roiScore(r,course,dev){

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 let s=0;

 if(m2>=45)s+=22;

 else if(m2>=40)s+=17;

 else if(m2>=35)s+=11;

 else if(m2>=30)s+=5;

 if(m3>=65)s+=16;

 else if(m3>=60)s+=11;

 else if(m3>=55)s+=6;

 if(st>0){

  if(st<=.12)s+=18;

  else if(st<=.15)s+=13;

  else if(st<=.18)s+=8;

  else if(st<=.20)s+=3;

 }

 if(ex>0){

  if(ex<=6.70)s+=15;

  else if(ex<=6.80)s+=11;

  else if(ex<=6.90)s+=5;

 }

 s+=national*2;

 s+=local;

 s+=({

  1:8,

  2:7,

  3:8,

  4:10,

  5:8,

  6:6

 }[course]||0);

 if(

  dev.type!=="イン逃げ" &&

  boatNo(r)===dev.attacker

 ){

  s+=25;

 }

 return s;

}

 /*

  大穴は「能力上位」だけを

  狙わないようにする

 */

 if(course>=4)s+=18;

 if(course>=5)s+=10;

 if(course===6)s+=5;

 if(m2>=40)s+=12;

 else if(m2>=35)s+=8;

 else if(m2>=30)s+=4;

 if(m3>=60)s+=10;

 else if(m3>=55)s+=6;

 if(st>0&&st<=.15)s+=16;

 else if(st>0&&st<=.18)s+=8;

 if(ex>0&&ex<=6.80)s+=10;

 /*

  能力が高すぎる馬は

  大穴候補から少し下げる

 */

 if(national>=7.0)

  s-=12;

 else if(national>=6.5)

  s-=6;

 */

 if(

 ){

/* =========================

   コンボ

========================= */

function validCombo(a,b,c){

 return(

  Number.isInteger(a)&&

  Number.isInteger(b)&&

  Number.isInteger(c)&&

  a>=1&&a<=6&&

  b>=1&&b<=6&&

  c>=1&&c<=6&&

  a!==b&&

  a!==c&&

  b!==c

 );

}

function pushPick(arr,combo,reason){

 if(

  !arr.some(

   x=>x.combo===combo

  )

 ){

  arr.push({

   combo,

   reason

  });

 }

}

 function add(a,b,c,text){

  if(!validCombo(a,b,c))

   return;

  if(arr.length>=7)

   return;

  pushPick(

   arr,

   `${a}-${b}-${c}`,

   text

  );

 }

 /*

 */

 add(

 );

  r1,r3,r2,

 );

 /*

  2位頭を最低2点確保

 */

 add(

  r2,r1,r3,

  "AI評価2位頭＋評価1・3位"

 );

 add(

  r2,r3,r1,

  "AI評価2位頭＋評価1・3位入替"

 );

  );

  add(

   first,r2,r1,

 }else{

  */

   dev.attacker,r1,r2,

  );

  add(

   dev.attacker,r2,r1,

   "攻め手頭＋相手入替"

  );

 }

 /*

  足りない場合

 */

 const candidates=[

  [r1,r2,r4],

  [r1,r4,r2],

  [r2,r1,r4],

  [r2,r4,r1],

  [r3,r1,r2],

  [r3,r2,r1]

 ];

 for(const c of candidates){

  if(arr.length>=7)

   break;

  add(

   c[0],

  );

========================= */

function buildROI(rank,dev){

 const entry=getEntry();

 const list=

  getRacers(raceData)

  .map(r=>{

   const boat=boatNo(r);

   const course=

    entry.indexOf(boat)+1;

   return{

    boat,

    course,

    score:

     roiScore(

      r,

      course,

      dev

     )

   };

  })

  .sort(

   (a,b)=>b.score-a.score

  );

 const candidates=[];

 for(const a of list){

  for(const b of list){

   for(const c of list){

    if(

     !validCombo(

      a.boat,

      b.boat,

      c.boat

     )

    )continue;

    let score=

     a.score+

     b.score+

     c.score;

    /*

     展開の攻め手

    */

    if(

     dev.type!=="イン逃げ" &&

     a.boat===dev.attacker

    ){

     score+=30;

    }

    /*

     外枠の2・3着

    */

    if(b.course>=4)

     score+=12;

    if(c.course>=4)

     score+=8;

    candidates.push({

     combo:

      `${a.boat}-${b.boat}-${c.boat}`,

     score

    });

   }

  }

 }

 candidates.sort(

  (a,b)=>b.score-a.score

 );

 const arr=[];

 for(const c of candidates){

  if(arr.length>=7)

   break;

  pushPick(

   arr,

   c.combo,

   "機力・ST・展示・展開から回収期待値を評価"

  );

 }

 /*

  回収重視でも

  AI評価1・2位が完全に消える場合を防ぐ

 */

 const top1=rank[0]?.boat;

 const top2=rank[1]?.boat;

 const hasTop1=

  arr.some(

   p=>p.combo.split("-")[0]===String(top1)

  );

 const hasTop2=

  arr.some(

   p=>p.combo.split("-")[0]===String(top2)

  );

 if(!hasTop1){

  const combo=

   `${top1}-${top2}-${rank[2]?.boat}`;

  if(

   validCombo(

    top1,

    top2,

    rank[2]?.boat

   )

  ){

   arr[arr.length-1]={

    combo,

    reason:"AI評価1位の頭を最低1点確保"

   };

  }

 }

 if(!hasTop2){

  const combo=

   `${top2}-${top1}-${rank[2]?.boat}`;

  if(

   validCombo(

    top2,

    top1,

    rank[2]?.boat

   )

  ){

   arr[arr.length-1]={

    combo,

    reason:"AI評価2位の頭を最低1点確保"

   };

  }

 }

 /*

  重複削除

 */

 const unique=[];

 for(const p of arr){

  if(

   !unique.some(

    x=>x.combo===p.combo

   )

  ){

   unique.push(p);

  }

 }

 return unique.slice(0,7);

}

/* =========================

   大穴

========================= */

function buildHole(rank,dev,usedCombos){

 const entry=getEntry();

 /*

  AIランキング上位1〜2位を

  大穴候補から原則除外

 */

 const top1=rank[0]?.boat;

 const top2=rank[1]?.boat;

 const list=

  getRacers(raceData)

  .map(r=>{

   const boat=boatNo(r);

   const course=

    entry.indexOf(boat)+1;

   return{

    boat,

    course,

    score:

     holeScore(

      r,

      course,

      dev

     )

   };

  })

  .filter(

   x=>

    x.boat!==top1 &&

    x.boat!==top2

  )

  .sort(

   (a,b)=>b.score-a.score

  );

 const arr=[];

 /*

  大穴候補は外枠を優先

 */

 const outsiders=

  list.filter(

   x=>x.course>=4

  );

 const candidates=

  outsiders.length>=2

  ?outsiders

  :list;

 /*

  低評価馬を中心に

  1着・2着・3着を分散

 */

 for(let i=0;i<candidates.length;i++){

  const x=candidates[i];

  for(let j=0;j<rank.length;j++){

   const y=rank[j];

   if(

    y.boat===x.boat ||

    y.boat===top1 ||

    y.boat===top2

   )continue;

   const z=

    candidates.find(

     q=>

      q.boat!==x.boat &&

      q.boat!==y.boat

    );

   if(!z)continue;

   const patterns=[

    [

     x.boat,

     y.boat,

     z.boat

    ],

    [

     y.boat,

     x.boat,

     z.boat

    ],

    [

     y.boat,

     z.boat,

     x.boat

    ]

   ];

   for(const p of patterns){

    if(arr.length>=3)

     break;

    if(

     !validCombo(

      p[0],

      p[1],

      p[2]

     )

    )continue;

    const combo=

     `${p[0]}-${p[1]}-${p[2]}`;

    /*

     的中重視・回収重視との

     重複を完全に禁止

    */

    if(

     usedCombos.includes(combo)

    )continue;

    if(

     arr.some(

      q=>q.combo===combo

     )

    )continue;

    arr.push({

     combo,

     reason:

      `${x.boat}号艇の外枠・機力・STを狙う大穴`

    });

   }

   if(arr.length>=3)

    break;

  }

  if(arr.length>=3)

   break;

 }

 /*

  最終補完

 */

 const fallback=[

  "5-4-6",

  "6-5-4",

  "4-6-5",

  "6-4-5",

  "5-6-4",

  "4-5-6",

  "5-3-6",

  "6-3-5"

 ];

 for(const combo of fallback){

  if(arr.length>=3)

   break;

  if(

   usedCombos.includes(combo)

  )continue;

  if(

   arr.some(

    x=>x.combo===combo

   )

  )continue;

  const p=

   combo.split("-").map(Number);

  if(

   validCombo(

    p[0],

    p[1],

    p[2]

   )

  ){

   arr.push({

    combo,

    reason:

     "外枠の一撃・人気薄の展開変化を想定"

   });

  }

 }

 return arr.slice(0,3);

}

   掛け金

========================= */

/*

  予算を100円単位で

  できるだけ使い切る

  重要度：

  1位 > 2位 > 3位

*/

function makeMoney(picks,budget,type){

 const count=picks.length;

 if(count===0)

  return[];

 let total=

  Math.floor(

   num(budget)/100

  )*100;

 if(total<100)

  total=100;

 /*

  基本ウェイト

 */

 let weights=[];

 if(type==="hit"){

  weights=

   picks.map(

    (_,i)=>

     i===0?3:

     i===1?3:

     i===2?2:

     1

   );

 }else if(type==="roi"){

  weights=

   picks.map(

    (_,i)=>

     i<3?3:2

   );

 }else{

  weights=

   picks.map(

    (_,i)=>

     i===0?4:

     i===1?3:

     2

   );

 }

 const weightTotal=

  weights.reduce(

   (a,b)=>a+b,

   0

  );

 let money=

  weights.map(

   w=>

    Math.floor(

     total*w/

     weightTotal/

     100

    )*100

  );

 /*

  最低100円

 */

 money=

  money.map(

   x=>x<100?100:x

  );

 let current=

  money.reduce(

   (a,b)=>a+b,

   0

  );

 /*

  予算を超えたら100円ずつ減額

 */

 while(current>total){

  let index=-1;

  for(let i=money.length-1;i>=0;i--){

   if(money[i]>100){

    index=i;

    break;

   }

  }

  if(index===-1)

   break;

  money[index]-=100;

  current-=100;

 }

 /*

  予算に余りがあれば

  上位から100円ずつ追加

 */

 let i=0;

 while(current+100<=total){

  money[i%money.length]+=100;

  current+=100;

  i++;

 }

 return money;

}

/* =========================

========================= */

async function loadRace(){

 const venue=

  num(

   document.getElementById(

    "venue"

   ).value

  );

 const race=

  num(

   document.getElementById(

    "race"

   ).value

  );

 const status=

  document.getElementById(

   "status"

  );

 const result=

  document.getElementById(

   "result"

  );

 const button=

  document.getElementById(

   "loadButton"

  );

 button.disabled=true;

 status.innerHTML=

  "⏳ 出走表を取得中...";

 result.classList.add(

  "hidden"

 );

 raceData=null;

 selectedEntry=[];

 try{

  const data=

   await fetchJson(

    API_URL

   );

  const raceObject=

   findRace(

    data,

    venue,

    race

   );

  if(!raceObject){

   throw new Error(

    "指定レースがデータ内にありません"

   );

  }

  const racers=

   getRacers(raceObject);

  if(racers.length<6){

   throw new Error(

    "6艇データを取得できませんでした"

   );

  }

  raceData=raceObject;

  const venueName=

   document

   .getElementById("venue")

   .selectedOptions[0]

   .textContent;

  document.getElementById(

   "apiInfo"

  ).innerHTML=`

   API：v1<br>

   競艇場：${venueName}<br>

   レース：${race}R<br>

   日付：${raceObject.date||"-"}<br>

   出走艇：${racers.length}艇

  `;

  displayRace();

  displayPreview();

  displayPreviewRacers();

  createEntryButtons();

  clearEntry();

  result.classList.remove(

   "hidden"

  );

  status.innerHTML=

   "✅ 出走表を取得しました";

 }catch(error){

  console.error(error);

  status.innerHTML=`

   ❌ 出走表取得失敗

   <br>

   ${esc(error.message)}

   <br><br>

   APIのデータ更新待ち、または

   指定レースのデータ未掲載の可能性があります。

  `;

 }finally{

  button.disabled=false;

 }

}

   イベント

========================= */

document.getElementById(

 "loadButton"

).addEventListener(

 "click",

 loadRace

);

document.getElementById(

 "clearButton"

).addEventListener(

 "click",

 clearEntry

);

document.getElementById(

 "analyzeButton"

).addEventListener(

 "click",

 showAnalysis

);

</script>
