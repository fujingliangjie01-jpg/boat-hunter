<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

header{background:linear-gradient(135deg,#080808,#211a07);border-bottom:1px solid #b8952e;padding:18px;text-align:center}

header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:3px}

header p{margin:5px 0 0;font-size:12px;color:#999}

.container{max-width:1000px;margin:auto;padding:14px}

.card{background:#111;border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:14px}

h2{margin:0 0 12px;font-size:17px;color:#d4af37}

h3{font-size:14px;color:#d4af37;margin:14px 0 8px}

label{font-size:11px;color:#aaa;display:block;margin-bottom:5px}

select,input{width:100%;background:#181818;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{width:100%;padding:13px;border:0;border-radius:9px;font-size:14px;font-weight:bold}

.mainBtn{margin-top:12px;background:linear-gradient(135deg,#d4af37,#8b6914);color:#000}

.subBtn{margin-top:8px;background:#222;border:1px solid #555;color:#fff}

.resetBtn{margin-top:8px;background:#171717;border:1px solid #777;color:#fff}

.topBtn{margin-top:14px;background:#171717;border:1px solid #b8952e;color:#d4af37}

.message{margin-top:10px;font-size:12px;line-height:1.6;color:#aaa}

.info{background:#151515;border:1px solid #333;border-radius:8px;padding:10px;font-size:11px;line-height:1.7;margin-bottom:10px}

.courseGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.courseBox{background:#171717;padding:8px;border-radius:8px;border:1px solid #333}

.racers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.racer{background:#171717;border:1px solid #333;border-radius:9px;padding:9px}

.racerTop{display:flex;align-items:center;gap:8px}

.number{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#000}

.n1{background:#fff}.n2{background:#222;color:#fff;border:1px solid #777}.n3{background:#e22;color:#fff}.n4{background:#248cff;color:#fff}.n5{background:#e5d000}.n6{background:#20a747;color:#fff}

.racerName{font-weight:bold}

.small{font-size:10px;color:#aaa;line-height:1.6;margin-top:6px}

.tech{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.tech div{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px;font-size:10px;text-align:center}

.tech span{display:block;color:#888;margin-bottom:2px}

.decisionStats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.decisionStat{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px 4px;font-size:10px;text-align:center}

.decisionStat span{display:block;color:#888;margin-bottom:2px}

.decisionStat strong{display:block;color:#d4af37;font-size:12px}

.history{margin-top:8px;background:#0d0d0d;border:1px solid #292929;border-radius:8px;padding:8px}

.historyTitle{color:#d4af37;font-weight:bold;font-size:11px;margin-bottom:6px}

.historyStats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}

.historyStat{background:#151515;border-radius:5px;padding:5px 2px;text-align:center;font-size:9px;color:#aaa}

.historyStat strong{display:block;font-size:12px;color:#d4af37;margin-top:2px}

.historyList{font-size:9px;color:#aaa;line-height:1.6;max-height:180px;overflow-y:auto}

.historyItem{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:3px 0}

.historyItem:last-child{border-bottom:0}

.historyGood{color:#4cd964;font-weight:bold}.historyBad{color:#777}.historyMiddle{color:#ffd84d;font-weight:bold}.historyDecision{color:#d4af37;font-weight:bold}

table{width:100%;border-collapse:collapse;font-size:11px}

th,td{padding:7px 3px;border-bottom:1px solid #292929;text-align:center}

th{color:#d4af37}

.strategy{background:#171717;border-left:3px solid #d4af37;padding:9px;font-size:11px;line-height:1.7;margin-top:8px}

.attackBox{background:#211a07;border:1px solid #8a6d1c;border-radius:9px;padding:10px;font-size:11px;line-height:1.8;margin-top:8px}

.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}.attackSub{color:#aaa;margin-top:4px}

.exclusion{background:#241414;border-left:3px solid #e55;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.exclusionKeep{background:#171707;border-left:3px solid #d4af37;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.revivalBox{background:#211a07;border-left:3px solid #ffd84d;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.pickBox{background:#151515;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}

.betHeader{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;background:#0d0d0d;border:1px solid #292929;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px;color:#888;text-align:center}

.betRow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #292929}

.betRow:last-child{border-bottom:0}

.bet2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:bold}

.bet2Number{background:#211a07;border:1px solid #8a6d1c;border-radius:6px;padding:5px 8px;color:#ffd84d}

.betPercent{font-size:11px;color:#ffd84d;font-weight:bold}

.thirdCandidates{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}

.thirdCandidate{background:#101010;border:1px solid #333;border-radius:6px;padding:5px 6px;font-size:10px;color:#fff}

.thirdCandidate.normal{border-color:#555}

.thirdCandidate.revival{border-color:#d4af37;color:#ffd84d;background:#211a07}

.thirdCandidate.warning{border-color:#8a4b4b;color:#ff9b9b}

.revivalLabel{display:block;font-size:8px;color:#ffd84d;margin-top:2px}

.betNote{font-size:9px;color:#777;margin-top:5px;line-height:1.5}

.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px}

.pick:last-child{border-bottom:0}.pickLeft{display:flex;align-items:center;gap:5px}

.star{width:18px;min-width:18px;color:#ffd84d;font-size:15px;font-weight:bold}

.prob{color:#ffd84d;font-weight:bold}

.pick.veryStrong .prob,.pick.veryStrong strong{color:#ff3b30}.pick.veryStrong .prob{font-size:15px;font-weight:900}

.pick.strong .prob,.pick.strong strong{color:#ffd84d}.pick.strong .prob{font-size:14px;font-weight:900}

.pick.weak{opacity:.38}

.total{background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;padding:10px;text-align:center;color:#d4af37;font-weight:bold;margin-bottom:8px}

.budgetInfo{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:11px;line-height:1.6;color:#aaa}

.budgetStrong{color:#d4af37;font-weight:bold}.noPick{font-size:11px;color:#777;padding:8px 0;line-height:1.6}

.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}

.overviewBox{background:#101010;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}

.overviewBox .label{font-size:10px;color:#888}.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}

.overviewBox.main{border-color:#8a6d1c;background:#1c1709}

.overviewReason{font-size:11px;color:#aaa;line-height:1.7;margin-top:8px}

.venueBox{background:#101010;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.venueBox strong{color:#d4af37}.formBox{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.footer{text-align:center;color:#555;font-size:10px;padding:20px}

.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}

.betEscape{color:#ff9500}.betSashi{color:#4cd964}.betMaki{color:#ff5555}.betMakiSashi{color:#58a6ff}

.recommendPick{opacity:.52}.recommendTitle{color:#888!important}

.outlookBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.outlookTitle{font-size:13px;font-weight:bold;color:#d4af37;margin-bottom:8px}

.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}

.outlookEscape{border-color:#7b2d2d;background:#241414}

.outlookNonEscape{border-color:#285b8c;background:#0e1722}

.outlookInactive{border-color:#333!important;background:#151515!important}

.outlookLabel{font-size:10px;color:#aaa}

.outlookValue{font-size:22px;font-weight:900;margin-top:3px}

.outlookEscape .outlookValue{color:#ff5555}

.outlookNonEscape .outlookValue{color:#58a6ff}

.outlookInactive .outlookValue{color:#777}

.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}

.decisionPositive{color:#4cd964}

.decisionWarning{color:#ffd84d}

.decisionDanger{color:#ff5555}

.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}

.aiDetail strong{color:#d4af37}

.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}

.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}

.patternExcluded{color:#777;text-decoration:line-through}

@media(max-width:600px){

.grid2{grid-template-columns:1fr}

.courseGrid{grid-template-columns:repeat(2,1fr)}

.racers{grid-template-columns:1fr}

.overviewGrid{grid-template-columns:repeat(2,1fr)}

.betHeader,.betRow{grid-template-columns:1fr 1.3fr}

.decisionStats{grid-template-columns:repeat(2,1fr)}

}

</style>

</head>

<body>

<header>

<h1>BOAT HUNTER</h1>

<p>人気ではなく期待値で勝つ</p>

</header>

<div class="container">

<div class="card">

<h2>🎯 レース選択</h2>

<div class="grid2">

<div>

<label>競艇場</label>

<select id="venue">

<option value="1">桐生</option><option value="2">戸田</option><option value="3">江戸川</option><option value="4">平和島</option><option value="5">多摩川</option><option value="6">浜名湖</option><option value="7">蒲郡</option><option value="8">常滑</option><option value="9">津</option><option value="10">三国</option><option value="11">びわこ</option><option value="12">住之江</option><option value="13">尼崎</option><option value="14">鳴門</option><option value="15">丸亀</option><option value="16">児島</option><option value="17">宮島</option><option value="18">徳山</option><option value="19">下関</option><option value="20">若松</option><option value="21">芦屋</option><option value="22">福岡</option><option value="23">唐津</option><option value="24">大村</option>

</select>

</div>

<div>

<label>レース</label>

<select id="race">

<option value="1">1R</option><option value="2">2R</option><option value="3">3R</option><option value="4">4R</option><option value="5">5R</option><option value="6">6R</option><option value="7">7R</option><option value="8">8R</option><option value="9">9R</option><option value="10">10R</option><option value="11">11R</option><option value="12">12R</option>

</select>

</div>

</div>

<h3>🛥️ 今回の進入コース</h3>

<div class="courseGrid">

<div class="courseBox"><label>1号艇</label><select id="course1"></select></div>

<div class="courseBox"><label>2号艇</label><select id="course2"></select></div>

<div class="courseBox"><label>3号艇</label><select id="course3"></select></div>

<div class="courseBox"><label>4号艇</label><select id="course4"></select></div>

<div class="courseBox"><label>5号艇</label><select id="course5"></select></div>

<div class="courseBox"><label>6号艇</label><select id="course6"></select></div>

</div>

<button class="resetBtn" onclick="resetCourses()">🔄 進入入力をリセット</button>

<button class="mainBtn" onclick="loadRaceData()">出走表を取得</button>

<button class="subBtn" onclick="runAnalysis()">🤖 AI解析開始</button>

</div>

<div id="raceInfo"></div>

<div id="racers" class="racers"></div>

</div>

<div id="analysisCard" class="card" style="display:none">

<h2>🤖 AI期待値ランキング</h2>

<div id="ranking"></div>

<h3>🔥 このレースの攻め手</h3>

<div id="attack"></div>

<h3>✂️ 3着から切り候補</h3>

<div id="exclusions"></div>

<div id="bettingPatterns"></div>

</div>

<div class="footer">BOAT HUNTER © 2026</div>

</div>

<script>

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

let raceData=null,racers=[],previewRacers={},manualCourses={},historyData={},currentBets=null;

const HISTORY_RACES=15;

const HISTORY_DAYS=180;

const $=id=>document.getElementById(id);

const num=v=>{

if(v==null||v==="")return 0;

let x=parseFloat(String(v).replace(/[%,秒,]/g,""));

return Number.isFinite(x)?x:0

};

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function course(b){return Number(manualCourses[b]||b)}

function racer(b){return racers.find(x=>num(x.entry_number)===b)}

function preview(b){return previewRacers[b]||previewRacers[String(b)]||{}}

function today(){

let p=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());

return{

year:p.find(x=>x.type==="year").value,

ymd:p.find(x=>x.type==="year").value+p.find(x=>x.type==="month").value+p.find(x=>x.type==="day").value

}

}

function dateInfo(d){

return{

year:String(d.getFullYear()),

ymd:String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")

}

}

async function json(url){

let r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

return r.json()

}

function normalizeEntry(x,i){

if(x==null||typeof x!=="object")return null;

let entry=num(

x.entry_number??x.entryNumber??x.boat_number??x.boatNumber??x.boat_no??

x.number_boat??x.boat??x.lane??x.lane_number??x.laneNumber??

x.course_number??x.course??x.entry??x.number

);

if(!entry&&i<6)entry=i+1;

let name=x.name??x.racer_name??x.racerName??x.player_name??x.playerName??

x.racer??x.player??x.racers_name??"";

if(typeof name==="object")name=name.name||name.racer_name||name.player_name||"";

return{...x,entry_number:entry,name:name}

}

function extractRaceEntries(race){

if(!race)return[];

const directCandidates=[

race.racers,race.entries,race.participants,race.program,race.race_entries,

race.racer,race.players,race.boats,race.starting_list,race.startingList,

race.entry_list,race.entryList,race.raceRacers,race.race_entries_list

];

for(const source of directCandidates){

if(!source)continue;

let arr=Array.isArray(source)?source:Object.values(source);

let list=arr.map((x,i)=>normalizeEntry(x,i)).filter(x=>x&&x.entry_number>=1&&x.entry_number<=6);

let unique=new Map();

list.forEach(x=>{if(!unique.has(x.entry_number))unique.set(x.entry_number,x)});

list=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

if(list.length===6)return list

}

return extractEntriesDeep(race)

}

function extractEntriesDeep(root){

let found=[];

function walk(obj,depth=0){

if(!obj||depth>12)return;

if(Array.isArray(obj)){

for(const x of obj)walk(x,depth+1);

return

}

if(typeof obj!=="object")return;

const looksLikeRacer=obj.name!=null||obj.racer_name!=null||obj.racerName!=null||

obj.player_name!=null||obj.registration_number!=null||obj.racer_number!=null||obj.player_number!=null;

const e=num(obj.entry_number??obj.entryNumber??obj.boat_number??obj.boatNumber??

obj.boat_no??obj.lane??obj.course_number??obj.course??obj.entry);

if(looksLikeRacer&&e>=1&&e<=6){

let z=normalizeEntry(obj,0);

if(z)found.push(z)

}

for(const k of Object.keys(obj)){

if(k==="result"||k==="results"||k==="history")continue;

walk(obj[k],depth+1)

}

}

walk(root);

let unique=new Map();

found.forEach(x=>{if(!unique.has(x.entry_number))unique.set(x.entry_number,x)});

let list=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

return list.length===6?list:[]

}

function findRace(data,venue,raceNo){

let found=null;

function walk(obj){

if(found||obj==null)return;

if(Array.isArray(obj)){

for(const item of obj){walk(item);if(found)break}

return

}

if(typeof obj!=="object")return;

const rn=obj.race_number??obj.raceNumber??obj.race_no??obj.raceNo??obj.raceno??obj.number;

const vn=obj.stadium_number??obj.stadiumNumber??obj.venue_number??obj.venueNumber??obj.stadiumNo??obj.venueNo;

if(rn!=null&&String(rn)===String(raceNo)&&(vn==null||String(vn)===String(venue))){

let list=extractRaceEntries(obj);

if(list.length===6){found=obj;return}

}

for(const key of Object.keys(obj)){walk(obj[key]);if(found)break}

}

walk(data);

return found

}

function directRace(data,v,r){

const paths=[

data?.programs?.stadiums?.[String(v)]?.races?.[String(r)],

data?.programs?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.stadiums?.[String(v)]?.races?.[String(r)],

data?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.races?.[String(r)],data?.races?.[Number(r)]

];

for(const x of paths){

if(x&&extractRaceEntries(x).length===6)return x

}

const raceArrays=[

data?.programs?.stadiums?.[String(v)]?.races,

data?.stadiums?.[String(v)]?.races,

data?.races,

data?.programs?.races

];

for(const arr of raceArrays){

if(!arr)continue;

const list=Array.isArray(arr)?arr:Object.values(arr);

const x=list.find(z=>{

const rn=z?.race_number??z?.raceNumber??z?.race_no??z?.raceNo;

return String(rn)===String(r)&&extractRaceEntries(z).length===6

});

if(x)return x

}

return findRace(data,v,r)

}

async function loadDaily(){

let t=today(),v=$("venue").value,r=$("race").value;

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let errors=[];

for(const url of urls){

try{

let data=await json(url);

let race=directRace(data,v,r);

if(race){

let list=extractRaceEntries(race);

if(list.length===6)return{data,race,base:url};

errors.push(url+" : race found but entries="+list.length)

}else errors.push(url+" : race not found")

}catch(e){errors.push(url+" : "+e.message)}

}

throw Error("APIから6艇の出走表を取得できませんでした.\n"+errors.slice(-3).join("\n"))

}

function initCourses(){

for(let b=1;b<=6;b++){

let e=$("course"+b);

e.innerHTML="";

for(let c=1;c<=6;c++)e.add(new Option(c+"コース",c));

e.value=String(b);

manualCourses[b]=b;

e.onchange=()=>manualCourses[b]=Number(e.value)

}

}

function resetCourses(){

for(let b=1;b<=6;b++){

$("course"+b).value=String(b);

manualCourses[b]=b

}

$("message").innerHTML='<span class="success">🔄 進入入力をリセットしました</span>'

}

async function loadRaceData(){

$("message").innerHTML='<span class="loading">⏳ 出走表を取得中...</span>';

$("raceCard").style.display="none";

$("analysisCard").style.display="none";

historyData={};

currentBets=null;

try{

let api=await loadDaily();

raceData=api.race;

let list=extractRaceEntries(raceData);

if(list.length!==6)throw Error("6艇の選手データを取得できませんでした");

racers=list;

previewRacers=raceData.preview?.racers||raceData.preview?.entries||raceData.preview||{};

for(let b=1;b<=6;b++){

let p=preview(b);

let c=num(p.course_number||p.course||p.entry_course||p.entry||p.lane);

if(c>=1&&c<=6){

$("course"+b).value=String(c);

manualCourses[b]=c

}

}

renderRace();

$("raceCard").style.display="block";

$("message").innerHTML='<span class="success">✅ 出走表取得成功<br>AI解析時に同コース過去15走を取得します</span>';

}catch(e){

console.error(e);

let mapped=

value?.[String(no)]??value?.[no]??value?.name??value?.label??

value?.value??value?.code??value?.number??value?.id;

if(mapped!=null&&mapped!==""){

let d=decisionFromValue(mapped);

}

}else{

}

];

function addResultRace(race,targets,wanted){

result.players||race?.racers||race?.entries||race?.participants||race?.boats;

if(!resultRacers)return;

let list=Array.isArray(resultRacers)?resultRacers:Object.values(resultRacers);

let date=result.date||race.date||race.race_date||race.date_time||race.dateTime||"";

list.forEach(x=>{

let no=getResultRacerNumber(x);

if(!wanted.has(no))return;

let c=getCourse(x),place=getPlace(x);

if(!targets[no]||c!==targets[no].course)return;

targets[no].boats[c].push({

date,place,course:c,

decision:technique&&technique!=="-"?technique:null

})

})

}

if(s.includes("向かい")||s.includes("向い")||s.includes("head")||s.includes("迎え"))

return"head";

if(s.includes("追い")||s.includes("追い風")||s.includes("following")||s.includes("tail"))

return"tail";

return"unknown"

}

function windInfo(){

let w=weatherSource(),mode=windMode(),direction=windText();

return{

mode,

direction,

speed:num(w.wind_speed||w.windSpeed||w.wind),

label:

mode==="head"?"向かい風":

mode==="tail"?"追い風":

direction||"風向データなし"

}

}

function windSuitability(b,type){

let wi=windInfo();

if(wi.mode==="unknown")return 0;

let c=course(b),v=0;

if(wi.speed>=3){

if(wi.mode==="head"){

if(c>=3&&c<=6)v+=type==="maki"?12:type==="makiSashi"?9:4;

if(type==="maki"&&c>=3)v+=10;

if(type==="makiSashi"&&c>=3)v+=8;

if(c===1)v-=7;

}

if(wi.mode==="tail"){

if(c===1)v+=12;

if(type==="escape"&&c===1)v+=10;

if(type==="sashi"&&c===2)v+=9;

if(c>=3&&type==="maki")v-=4;

}

}else{

if(wi.mode==="head"){

if(c>=3&&c<=6)v+=type==="maki"?6:type==="makiSashi"?4:2;

if(c===1)v-=2;

}

if(wi.mode==="tail"){

if(c===1)v+=6;

if(type==="sashi"&&c===2)v+=4;

}

}

return v

}

function windOverviewBonus(type){

let wi=windInfo();

if(wi.speed<3)return 0;

if(wi.mode==="head")

return{maki:15,makiSashi:10,sashi:3,escape:-10}[type]||0;

if(wi.mode==="tail")

return{escape:15,sashi:10,maki:-4,makiSashi:-3}[type]||0;

return 0

}

function renderRace(){

$("raceInfo").innerHTML=`

<div class="info">

<strong>${esc(raceData.title||raceData.race_name||raceData.name||"レース")}</strong><br>

開催日：${esc(raceData.date||raceData.race_date||raceData.date_string||"-")}<br>

距離：${num(raceData.distance||raceData.distance_m||1800)}m<br>

API：boatraceopenapi

</div>`;

$("racers").innerHTML=racers.map(r=>{

let b=num(r.entry_number),

p=preview(b),

m=num(r.motor_top_2_percent||r.motor_2ren_rate||r.motor_2ren),

d=decisions(r);

return`<div class="racer">

<div class="racerTop">

<div class="number n${b}">${b}</div>

<div class="racerName">${esc(r.name||r.racer_name||r.player_name||"-")}</div>

</div>

<div class="small">

級別：${rank(r.rank_number||r.class_number||r.rank||r.class)}<br>

登録番号：${getRacerNumber(r)||"-"}<br>

年齢：${num(r.age)||"-"}歳<br>

全国勝率：${num(r.national_win_rate||r.win_rate_national).toFixed(2)}<br>

全国2連率：${num(r.national_top_2_percent||r.national_2ren_rate||r.national_top2_percent).toFixed(1)}%<br>

当地勝率：${num(r.local_win_rate||r.win_rate_local).toFixed(2)}<br>

当地2連率：${num(r.local_top_2_percent||r.local_2ren_rate||r.local_top2_percent).toFixed(1)}%

</div>

<div class="tech">

<div><span>今回進入</span>${course(b)}</div>

<div><span>実進入</span>${num(p.course_number||p.course||p.entry_course||p.entry||p.lane)||"-"}</div>

<div><span>モーター</span>${num(r.motor_number||r.motor_no)||"-"}</div>

<div><span>モーター2連</span>${m.toFixed(1)}%</div>

<div><span>平均ST</span>${num(r.average_start_timing||r.average_st).toFixed(2)}</div>

<div><span>直前ST</span>${num(p.start_timing||p.st).toFixed(2)}</div>

<div><span>展示</span>${num(p.exhibition_time||p.exhibition).toFixed(2)}</div>

</div>

<h3 style="font-size:11px;margin:8px 0 4px">📊 決まり手傾向</h3>

${decisionTrendHTML(b,d)}

${renderHistory(b)}

</div>`

}).join("");

let w=weatherSource();

$("raceInfo").innerHTML+=`

<div class="info">

🌤️ 場情報・風情報<br>

風向：${esc(windText()||"-")}<br>

風速：${num(w.wind_speed||w.wind||w.windSpeed)}m<br>

風評価：${

windInfo().mode==="head"?"向かい風→アウトコース・まくりを上方補正":

windInfo().mode==="tail"?"追い風→インコース・差しを上方補正":

"風向不明→風補正なし"

}

</div>`;

}

function rank(v){

let s=String(v??"").trim();

if(!s)return"-";

if(/^[0-9]+$/.test(s)){

let n=Number(s);

return n===1?"A1":n===2?"A2":n===3?"B1":n===4?"B2":s

}

return s

}

function racerScore(b){

let r=racer(b),c=course(b),v=venueTrait(),d=decisions(r),h=hstats(b);

if(!r)return 0;

let score=0;

score+=num(r.national_win_rate||r.win_rate_national)*10;

score+=num(r.national_top_2_percent||r.national_2ren_rate||r.national_top2_percent)*.35;

score+=num(r.local_win_rate||r.win_rate_local)*8;

score+=num(r.local_top_2_percent||r.local_2ren_rate||r.local_top2_percent)*.2;

score+=num(r.motor_top_2_percent||r.motor_2ren_rate||r.motor_2ren)*.25;

score+=(num(r.average_start_timing||r.average_st)?Math.max(0,0.20-num(r.average_start_timing||r.average_st))*35:0);

score+=hscore(b)*.7;

if(c===1)score*=v.escape;

else if(c===2)score*=v.sashi;

else if(c===3||c===4)score*=v.maki;

else score*=v.makiSashi;

score+=windSuitability(b,c===1?"escape":c===2?"sashi":c===3||c===4?"maki":"makiSashi");

if(b===1&&d.escape>=65)score+=8;

if(c>=3&&d.maki>=18)score+=5;

if(c>=3&&d.makiSashi>=18)score+=4;

return score

}

function buildRanking(){

return racers.map(r=>{

let b=num(r.entry_number);

return{b,score:racerScore(b),r,course:course(b),hist:hstats(b),d:decisions(r)}

}).sort((a,b)=>b.score-a.score)

}

function renderRanking(list){

if(!list.length){

$("ranking").innerHTML='<div class="noPick">AI評価データがありません。</div>';

return

}

let max=list[0]?.score||1;

$("ranking").innerHTML=list.map((x,i)=>{

let p=Math.max(0,Math.min(99.9,x.score/max*100));

let cls=p>=85?"veryStrong":p>=70?"strong":p<45?"weak":"";

return`<div class="pick ${cls}">

<div class="pickLeft"><span class="star">${i===0?"★":i+1}</span><strong>${x.b}号艇 ${esc(x.r.name||"-")}</strong></div>

<span class="prob">${p.toFixed(1)}%</span>

</div>`

}).join("")

}

function attackType(){

let vals=racers.map(r=>{

let b=num(r.entry_number),c=course(b),d=decisions(r),score=-Infinity;

if(b===1){

score=d.escape+windOverviewBonus("escape")+(c===1?20:0)

}else if(c===2){

score=d.sashi+windOverviewBonus("sashi")

}else{

score=Math.max(d.maki+windOverviewBonus("maki"),d.makiSashi+windOverviewBonus("makiSashi"))

}

return{b,c,d,score,type:b===1?"escape":c===2?"sashi":d.maki>=d.makiSashi?"maki":"makiSashi"}

}).sort((a,b)=>b.score-a.score);

return vals[0]||null

}

function renderAttack(a){

if(!a){

$("attack").innerHTML='<div class="noPick">攻め手を判定できません。</div>';

return

}

let label=a.type==="escape"?"1号艇イン逃げ":a.type==="sashi"?`${a.b}号艇の差し`:

a.type==="maki"?`${a.b}号艇のまくり`:`${a.b}号艇のまくり差し`;

let wi=windInfo();

let reason=

a.type==="escape"?"イン逃げを基本線に評価。":

a.type==="sashi"?"2コース差しの決まり手傾向と風を評価。":

a.type==="maki"?"センターのまくりと風補正を評価。":

"まくり差しの決まり手傾向と展開を評価。";

$("attack").innerHTML=`<div class="attackBox">

<div class="attackMain">🔥 ${label}</div>

<div class="attackSub">${reason}</div>

<div class="attackSub">風：${esc(wi.label)} ${wi.speed.toFixed(1)}m　攻め評価：${a.score.toFixed(1)}</div>

</div>`

}

function exclusionCandidates(list){

let sorted=[...list].sort((a,b)=>a.score-b.score);

let candidates=sorted.filter(x=>x.b!==1);

return candidates.slice(0,1)

}

function renderExclusions(list){

let ex=exclusionCandidates(list);

if(!ex.length){

$("exclusions").innerHTML='<div class="exclusionKeep">完全除外候補なし。1号艇を軸に全艇を展開候補として保持。</div>';

return

}

let x=ex[0];

$("exclusions").innerHTML=`

<div class="exclusion">

<strong>${x.b}号艇 ${esc(x.r.name||"-")}</strong>を3着から切る候補。

<br>AI評価：${x.score.toFixed(1)}　今回進入：${x.course}コース

</div>

<div class="revivalBox">

🟡 展開復活：${x.b}号艇は完全除外ではなく、明確な展開根拠がある場合のみ3着候補まで復活。

</div>`

}

function thirdCandidates(first,second,ranking,excluded){

let ex=new Set(excluded.map(x=>x.b));

let candidates=ranking

.filter(x=>x.b!==first&&x.b!==second&&!ex.has(x.b))

.sort((a,b)=>b.score-a.score)

.slice(0,3);

excluded.forEach(x=>{

if(!candidates.some(y=>y.b===x.b)&&candidates.length<3){

candidates.push({...x,revival:true})

}

});

return candidates

}

function betProbability(a,b,ranking){

let ra=ranking.find(x=>x.b===a)?.score||0;

let rb=ranking.find(x=>x.b===b)?.score||0;

let total=ranking.reduce((s,x)=>s+x.score,0)||1;

return Math.max(1,Math.min(95,(ra*.65+rb*.35)/total*100))

}

function makePattern(title,cls,firsts,seconds,ranking,excluded){

let rows=[];

for(const a of firsts)for(const b of seconds){

if(a===b)continue;

let p=betProbability(a,b,ranking);

let thirds=thirdCandidates(a,b,ranking,excluded);

rows.push({a,b,p,thirds})

}

rows.sort((a,b)=>b.p-a.p);

return`<div class="pickBox">

<div class="pickTitle ${cls}">${title}</div>

<div class="betHeader"><div>2連単</div><div>3着候補</div></div>

${rows.slice(0,5).map(x=>`

<div class="betRow">

<div class="bet2">

<span class="bet2Number">${x.a}-${x.b}</span>

<span class="betPercent">${x.p.toFixed(1)}%</span>

</div>

<div class="thirdCandidates">

${x.thirds.map(t=>`<span class="thirdCandidate ${t.revival?"revival":"normal"}">${t.b}${t.revival?'<span class="revivalLabel">🟡展開復活</span>':""}</span>`).join("")}

</div>

</div>`).join("")}

</div>`

}

function renderBets(ranking,a){

let excluded=exclusionCandidates(ranking);

let firstBase=ranking.find(x=>x.b===1)?.b||ranking[0]?.b||1;

let secondBest=ranking.find(x=>x.b!==firstBase)?.b||2;

let attackBoat=a?.b||secondBest;

let patterns="";

patterns+=`<div class="total">AI買い目：1号艇を基本軸に、展開・AI評価を統合</div>`;

patterns+=makePattern("的中率重視","",[firstBase],[secondBest,...ranking.filter(x=>x.b!==firstBase).slice(0,2).map(x=>x.b)],ranking,excluded);

patterns+=makePattern("回収率重視・イン逃げ","betEscape",[firstBase],ranking.filter(x=>x.b!==firstBase).slice(0,3).map(x=>x.b),ranking,excluded);

if(attackBoat!==1){

patterns+=makePattern("回収率重視・差し","betSashi",[attackBoat],[firstBase,...ranking.filter(x=>x.b!==attackBoat).slice(0,2).map(x=>x.b)],ranking,excluded);

patterns+=makePattern("回収率重視・まくり","betMaki",[attackBoat],[firstBase,...ranking.filter(x=>x.b!==attackBoat).slice(0,2).map(x=>x.b)],ranking,excluded);

patterns+=makePattern("回収率重視・まくり差し","betMakiSashi",[attackBoat],[firstBase,...ranking.filter(x=>x.b!==attackBoat).slice(0,2).map(x=>x.b)],ranking,excluded);

}

patterns+=`<div class="pickBox">

<div class="pickTitle recommendTitle">穴目</div>

<div class="patternNote">オッズが美味しい場合のみ検討。2号艇のまくり差しは使用しない。</div>

${ranking.filter(x=>x.b!==1).slice(0,4).map(x=>`

<div class="pick recommendPick">

<div class="pickLeft"><span class="star">◇</span><strong>1-${x.b}</strong></div>

<span class="prob">${betProbability(1,x.b,ranking).toFixed(1)}%</span>

</div>`).join("")}

</div>`;

$("bettingPatterns").innerHTML=patterns

}

async function runAnalysis(){

if(!racers.length){

$("message").innerHTML='<span class="error">❌ 先に出走表を取得してください</span>';

return

}

$("message").innerHTML='<span class="loading">🤖 AI解析中...</span>';

$("analysisCard").style.display="none";

try{

await loadHistory();

let ranking=buildRanking();

let attack=attackType();

renderRanking(ranking);

renderAttack(attack);

renderExclusions(ranking);

renderBets(ranking,attack);

$("analysisCard").style.display="block";

$("message").innerHTML='<span class="success">✅ AI解析完了</span>';

}catch(e){

console.error(e);

$("message").innerHTML='<span class="error">❌ AI解析失敗<br>'+esc(e.message)+'</span>'

}

}

initCourses();

</script>
