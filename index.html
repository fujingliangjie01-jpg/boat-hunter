/* =========================

 基本

========================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(d):"-";

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

function getRank(v){

 return {

 1:"A1",

 2:"A2",

 3:"B1",

 4:"B2"

 }[num(v)]||"-";

}

/* =========================

 API

========================= */

async function fetchJson(url){

 const response=await fetch(

  url+"?t="+Date.now(),

  {

   method:"GET",

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

function findRace(data,stadium,race){

 if(!data)return null;

 try{

  const direct=

   data?.programs

    ?.stadiums

    ?.[String(stadium)]

    ?.races

    ?.[String(race)];

  if(direct)return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)return;

  if(typeof o!=="object")return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* =========================

 レーサー

========================= */

function getRacers(race){

 if(!race)return[];

 const racers=race.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)return[];

 const racers=preview.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

/* =========================

 選手特性取得

========================= */

function getCharacteristic(r,type,course){

 const source=[

  r?.characteristics,

  r?.statistics,

  r?.style,

  r?.performance,

  r

 ];

 const maps={

  makuri:[

   `course_${course}_makuri_percent`,

   `course${course}_makuri_percent`,

   `makuri_percent`,

   `win_by_makuri_percent`,

   "makuri_rate"

  ],

  sashi:[

   `course_${course}_sashi_percent`,

   `course${course}_sashi_percent`,

   `sashi_percent`,

   `win_by_sashi_percent`,

   "sashi_rate"

  ],

  makurizashi:[

   `course_${course}_makuri_sashi_percent`,

   `course${course}_makurizashi_percent`,

   `makuri_sashi_percent`,

   `makurizashi_percent",

   "makuri_sashi_rate"

  ],

  nige:[

   `course_${course}_nige_percent`,

   `course${course}_nige_percent`,

   "nige_percent",

   "escape_percent",

   "nige_rate"

  ],

  insideLoss:[

   "inside_loss_percent",

   "one_loss_percent",

   "course_1_loss_percent",

   "first_boat_loss_percent"

  ]

 };

 const keys=maps[type]||[];

 for(const obj of source){

  if(!obj)continue;

  for(const key of keys){

   if(

    obj[key]!==undefined &&

    obj[key]!==null &&

    obj[key]!==""

   ){

    const n=num(obj[key]);

    if(n>0)

     return n;

   }

  }

 }

 return 0;

}

function exhibitionDelta(r,entry){

 const course=entry.indexOf(boatNo(r));

 if(course<=0)

  return 0;

 const prevBoat=entry[course-1];

 const racers=getRacers(raceData);

 const prev=racers.find(

  x=>boatNo(x)===prevBoat

 );

 if(!prev)

  return 0;

 const current=getExhibition(

  previewFor(r)

 );

 const before=getExhibition(

  previewFor(prev)

 );

 if(current<=0||before<=0)

  return 0;

 return before-current;

}

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const n2=

  num(r.national_top_2_percent);

 const n3=

  num(r.national_top_3_percent);

 const l2=

  num(r.local_top_2_percent);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 let s=0;

 s+=national*6;

 s+=local*3;

 s+=n2*.08;

 s+=n3*.04;

 s+=l2*.04;

 s+=m2*.18;

 s+=m3*.07;

 if(st>0){

  if(st<=.12)s+=8;

  else if(st<=.15)s+=6;

  else if(st<=.18)s+=4;

  else if(st<=.20)s+=2;

 }

 if(ex>0){

  if(ex<=6.70)s+=8;

  else if(ex<=6.80)s+=5;

  else if(ex<=6.90)s+=2;

 }

 s+=({

 1:10,

 2:6,

 3:5,

 4:4,

 5:2,

 6:0

 }[course]||0);

 const rank=num(r.rank_number);

 if(rank===1)s+=5;

 if(rank===2)s+=3;

 if(rank===4)s-=2;

 /* 展示タイム差 */

 s+=exhibitionBonus(

  exhibitionDelta(r,entry)

 );

 return s;

 掛け金

========================= */

function makeMoney(

 picks,

 budget,

 type

){

 const count=picks.length;

 if(count===0)

  return[];

 let total=

  Math.floor(

   num(budget)/100

  )*100;

 if(total<100)

  total=100;

 let weights=[];

 if(type==="hit"){

  weights=

   picks.map(

    (_,i)=>

     i<2?4:

     i<4?2:

     1

   );

 }else if(type==="roi"){

  weights=

   picks.map(

    (_,i)=>

     i<2?3:

     2

   );

 }else{

  weights=

   picks.map(

    (_,i)=>2

   );

 }

 const weightTotal=

  weights.reduce(

   (a,b)=>a+b,

   0

  );

 let money=

  weights.map(

   w=>

    Math.floor(

     total*w/

     weightTotal/

     100

    )*100

  );

 money=

  money.map(

   x=>x<100?100:x

  );

 let current=

  money.reduce(

   (a,b)=>a+b,

   0

  );

 while(current>total){

  let index=-1;

  for(

   let i=money.length-1;

   i>=0;

   i--

  ){

   if(money[i]>100){

    index=i;

    break;

   }

  }

  if(index===-1)

   break;

  money[index]-=100;

  current-=100;

 }

 let i=0;

 while(

  current+100<=total

 ){

  money[i%money.length]+=100;

  current+=100;

  i++;

 }

 return money;

}

function createEntryButtons(){

 const box=

  document.getElementById(

   "entryButtons"

  );

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=

   document.createElement(

    "button"

   );

  b.type="button";

  b.className=

   "entry-btn";

  b.innerText=

   i+"号艇";

  b.onclick=()=>{

   selectEntry(i);

  };

  box.appendChild(b);

 }

}

function selectEntry(n){

 if(selectedEntry.includes(n))

  return;

 if(selectedEntry.length>=6)

  return;

 selectedEntry.push(n);

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  selectedEntry.join("-");

}

function updateEntryButtons(){

 document.querySelectorAll(

  ".entry-btn"

 ).forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  "進入を入力してください";

}

function getEntry(){

 if(selectedEntry.length===6)

  return [...selectedEntry];

 return[

  1,2,3,4,5,6

 ];

}

async function loadRace(){

 const venue=

  num(

   document.getElementById(

    "venue"

   ).value

  );

 const race=

  num(

   document.getElementById(

    "race"

   ).value

  );

 const status=

  document.getElementById(

   "status"

  );

 const result=

  document.getElementById(

   "result"

  );

 const button=

  document.getElementById(

   "loadButton"

  );

 button.disabled=true;

 status.innerHTML=

  "⏳ 出走表を取得中...";

 result.classList.add(

  "hidden"

 );

 raceData=null;

 selectedEntry=[];

 try{

  const data=

   await fetchJson(

    API_URL

   );

  const raceObject=

   findRace(

    data,

    venue,

    race

   );

  if(!raceObject){

   throw new Error(

    "指定レースがデータ内にありません"

   );

  }

  const racers=

   getRacers(

    raceObject

   );

  if(racers.length<6){

   throw new Error(

    "6艇データを取得できませんでした"

   );

  }

  raceData=

   raceObject;

  const venueName=

   document

    .getElementById("venue")

    .selectedOptions[0]

    .textContent;

  document.getElementById(

   "apiInfo"

  ).innerHTML=`

   API：v1<br>

   競艇場：${venueName}<br>

   レース：${race}R<br>

   日付：${raceObject.date||"-"}<br>

   出走艇：${racers.length}艇

  `;

  displayRace();

  displayPreview();

  displayPreviewRacers();

  createEntryButtons();

  clearEntry();

  result.classList.remove(

   "hidden"

  );

  status.innerHTML=

   "✅ 出走表を取得しました";

 }catch(error){

  console.error(error);

  status.innerHTML=`

   ❌ 出走表取得失敗

   <br>

   ${esc(error.message)}

   <br><br>

   APIのデータ更新待ち、または

   指定レースのデータ未掲載の可能性があります。

  `;

 }finally{

  button.disabled=false;

 }

}

</script>
