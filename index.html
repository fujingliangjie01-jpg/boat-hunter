<script>

/* =====================================================

   BOAT HUNTER

   817-18時 基準版

   現行API対応・出走表取得修正版

===================================================== */

/* =====================================================

   API

===================================================== */

const API_V1 =

"https://boatraceopenapi.github.io/api/v1/today.json";

const API_V1_DATE =

"https://boatraceopenapi.github.io/api/v1";

const API_V3 =

"https://boatraceopenapi.github.io/programs/v3";

const API_V2 =

"https://boatraceopenapi.github.io/programs/v2";

/* =====================================================

   24競艇場

===================================================== */

const STADIUMS = [

["桐生",1],

["戸田",2],

["江戸川",3],

["平和島",4],

["多摩川",5],

["浜名湖",6],

["蒲郡",7],

["常滑",8],

["津",9],

["三国",10],

["びわこ",11],

["住之江",12],

["尼崎",13],

["鳴門",14],

["丸亀",15],

["児島",16],

["宮島",17],

["徳山",18],

["下関",19],

["若松",20],

["芦屋",21],

["福岡",22],

["唐津",23],

["大村",24]

];

let raceData = null;

let racers = [];

let entryOrder = [1,2,3,4,5,6];

let usedApi = "";

/* =====================================================

   DOM

===================================================== */

const stadium =

document.getElementById("stadium");

STADIUMS.forEach(x=>{

const op =

document.createElement("option");

op.value = x[1];

op.textContent = x[0];

stadium.appendChild(op);

});

/* =====================================================

   日付

===================================================== */

function todayJP(){

const d = new Date();

const y =

d.getFullYear();

const m =

String(d.getMonth()+1).padStart(2,"0");

const day =

String(d.getDate()).padStart(2,"0");

return `${y}-${m}-${day}`;

}

function todayCompact(){

return todayJP().replaceAll("-","");

}

/* =====================================================

   ステータス

===================================================== */

function setStatus(text){

document.getElementById("status").textContent = text;

}

/* =====================================================

   数値

===================================================== */

function num(v){

if(

v === null ||

v === undefined ||

v === ""

){

return 0;

}

const n =

parseFloat(

String(v)

.replace("%","")

.replace(",","")

);

return isNaN(n) ? 0 : n;

}

/* =====================================================

   最初に見つかった値

===================================================== */

function first(obj,keys,def=0){

if(!obj) return def;

for(const key of keys){

if(

obj[key] !== undefined &&

obj[key] !== null &&

obj[key] !== ""

){

return obj[key];

}

}

return def;

}

/* =====================================================

   級別変換

===================================================== */

function rankName(v){

if(typeof v === "string"){

const s = v.toUpperCase();

if(

s.includes("A1") ||

s.includes("A2") ||

s.includes("B1") ||

s.includes("B2")

){

return s;

}

}

const n = Number(v);

if(n === 1) return "A1";

if(n === 2) return "A2";

if(n === 3) return "B1";

if(n === 4) return "B2";

return String(v || "B1");

}

/* =====================================================

   選手データ正規化

===================================================== */

function normalizeRacer(r,i){

const course =

Number(

first(

r,

[

"entry_number",

"entryNumber",

"course",

"courseNumber",

"boatNumber",

"waku",

"boat",

"number",

"lane"

],

i+1

)

);

const name =

first(

r,

[

"name",

"racerName",

"playerName",

"fullName",

"player",

"racer",

"選手名"

],

`選手${i+1}`

);

const rank =

rankName(

first(

r,

[

"rank",

"class",

"racerClass",

"grade",

"kyu",

"rank_number"

],

"B1"

)

);

const national =

num(

first(

r,

[

"national_win_rate",

"nationalWinRate",

"national_win_rate",

"winRate",

"nationWinRate",

"nationalRate",

"win_rate"

],

0

)

);

const local =

num(

first(

r,

[

"local_win_rate",

"localWinRate",

"localRate",

"localWin",

"local_rate"

],

0

)

);

const motor2 =

num(

first(

r,

[

"motor_top_2_percent",

"motor2Rate",

"motorSecondRate",

"motor2",

"motorWinRate2",

"motorSecond",

"motor_2ren"

],

0

)

);

const motor3 =

num(

first(

r,

[

"motor_top_3_percent",

"motor3Rate",

"motorThirdRate",

"motor3",

"motorWinRate3",

"motorThird",

"motor_3ren"

],

0

)

);

const st =

num(

first(

r,

[

"average_start_timing",

"start_timing",

"ST",

"st",

"startTime",

"averageST",

"avgST",

"start"

],

0

)

);

const exhibition =

num(

first(

r,

[

"exhibition_time",

"exhibitionTime",

"exhibition",

"tenjiTime",

"exhibition_time",

"tenji"

],

0

)

);

const motorNo =

first(

r,

[

"motor_number",

"motorNumber",

"motorNo",

"motor",

"motor_number"

],

"-"

);

return {

raw:r,

course:

course >= 1 && course <= 6

? course

: i+1,

name:name,

rank:rank,

national:national,

local:local,

motor2:motor2,

motor3:motor3,

st:st,

exhibition:exhibition,

motorNo:motorNo,

score:0

};

}

/* =====================================================

   V1のレースを直接取得

   現行V1構造:

   programs.stadiums["1"].races["1"]

===================================================== */

function getRaceFromV1Data(data){

const stadiumNo =

String(stadium.value);

const raceNo =

String(

document.getElementById("raceNo").value

);

if(

data &&

data.programs &&

data.programs.stadiums &&

data.programs.stadiums[stadiumNo] &&

data.programs.stadiums[stadiumNo].races &&

data.programs.stadiums[stadiumNo].races[raceNo]

){

return data.programs

.stadiums[stadiumNo]

.races[raceNo];

}

return null;

}

/* =====================================================

   V1取得

===================================================== */

async function getRaceV1(){

const date =

todayCompact();

const stadiumNo =

String(stadium.value);

const raceNo =

String(

document.getElementById("raceNo").value

);

/* まず当日API */

try{

const data =

await fetchJSON(

API_V1 + "?t=" + Date.now()

);

const race =

getRaceFromV1Data(data);

if(race){

return race;

}

}catch(e){

console.log(

"V1 today失敗:",

e.message

);

}

/* 日付指定API */

const url =

`${API_V1_DATE}/${date.slice(0,4)}/${date}.json?t=${Date.now()}`;

const data =

await fetchJSON(url);

const race =

getRaceFromV1Data(data);

if(race){

return race;

}

throw new Error(

`V1に${stadiumNo}場 ${raceNo}Rがありません。`

);

}

/* =====================================================

   V1 racers抽出

   racersはオブジェクトなのでObject.values()を使用

===================================================== */

function extractV1Racers(race){

if(!race) return [];

/* 出走表racers */

if(

race.racers &&

typeof race.racers === "object"

){

const values =

Object.values(race.racers);

if(values.length >= 6){

return values

.sort(

(a,b)=>

Number(

first(a,["entry_number","entryNumber"],999)

)

-

Number(

first(b,["entry_number","entryNumber"],999)

)

)

.slice(0,6)

.map(

(r,i)=>

normalizeRacer(r,i)

);

}

}

/* 念のため配列 */

if(

Array.isArray(race.racers) &&

race.racers.length >= 6

){

return race.racers

.slice(0,6)

.map(

(r,i)=>

normalizeRacer(r,i)

);

}

return [];

}

/* =====================================================

   旧V3/V2レース検索

===================================================== */

function findRace(data,stadiumNo,raceNo){

if(!data) return null;

/* 配列 */

if(Array.isArray(data)){

for(const item of data){

const found =

findRace(

item,

stadiumNo,

raceNo

);

if(found) return found;

}

return null;

}

/* オブジェクト以外 */

if(typeof data !== "object"){

return null;

}

/* 直接判定 */

const s =

Number(

first(

data,

[

"stadium_number",

"stadiumNumber",

"stadiumNo",

"venueNumber",

"venueNo",

"jyo",

"stadium",

"stadium_id",

"stadiumId"

],

-1

)

);

const r =

Number(

first(

data,

[

"race_number",

"raceNumber",

"raceNo",

"race",

"race_id",

"raceId"

],

-1

)

);

if(

s === Number(stadiumNo) &&

r === Number(raceNo)

){

return data;

}

/* races */

if(data.races){

if(Array.isArray(data.races)){

for(const race of data.races){

const rr =

Number(

first(

race,

[

"race_number",

"raceNumber",

"raceNo",

"race"

],

-1

)

);

if(rr === Number(raceNo)){

return race;

}

}

}

if(

typeof data.races === "object"

){

const direct =

data.races[String(raceNo)];

if(direct){

return direct;

}

}

}

/* 再帰 */

for(const key of Object.keys(data)){

const value = data[key];

if(

value &&

typeof value === "object"

){

const found =

findRace(

value,

stadiumNo,

raceNo

);

if(found) return found;

}

}

return null;

}

/* =====================================================

   旧API取得

===================================================== */

async function getRaceVersion(base){

const stadiumNo =

Number(stadium.value);

const raceNo =

Number(

document.getElementById("raceNo").value

);

const compact =

todayCompact();

const year =

compact.slice(0,4);

/* 正式な旧API日付形式 */

const urls = [

`${base}/${year}/${compact}.json`,

`${base}/today.json`

];

for(const url of urls){

try{

const data =

await fetchJSON(

url + "?t=" + Date.now()

);

const race =

findRace(

data,

stadiumNo,

raceNo

);

if(race){

return race;

}

}catch(e){

console.log(

"旧API失敗:",

url,

e.message

);

}

}

return null;

}

/* =====================================================

   JSON取得

===================================================== */

async function fetchJSON(url){

const response =

await fetch(

url,

{

method:"GET",

cache:"no-store",

headers:{

"Accept":"application/json"

}

}

);

if(!response.ok){

throw new Error(

"HTTP " + response.status

);

}

return await response.json();

}

/* =====================================================

   レース取得

   V1 → V3 → V2

===================================================== */

async function getRace(){

/* V1 */

try{

const race =

await getRaceV1();

if(race){

usedApi = "V1";

return race;

}

}catch(e){

console.log(

"V1失敗:",

e.message

);

}

/* V3 */

try{

const race =

await getRaceVersion(API_V3);

if(race){

usedApi = "V3";

return race;

}

}catch(e){

console.log(

"V3失敗:",

e.message

);

}

/* V2 */

try{

const race =

await getRaceVersion(API_V2);

if(race){

usedApi = "V2";

return race;

}

}catch(e){

console.log(

"V2失敗:",

e.message

);

}

throw new Error(

"V1・V3・V2のすべてで対象レースを取得できませんでした。"

);

}

/* =====================================================

   旧APIから選手抽出

===================================================== */

function extractRacers(race){

if(!race) return [];

/* racers */

if(

race.racers &&

typeof race.racers === "object" &&

!Array.isArray(race.racers)

){

const arr =

Object.values(race.racers);

if(arr.length >= 6){

return arr

.slice(0,6)

.map(

(r,i)=>

normalizeRacer(r,i)

);

}

}

/* 配列 */

const directKeys = [

"racers",

"entries",

"program",

"players",

"boats",

"racerList",

"racer",

"members",

"competitors"

];

for(const key of directKeys){

const arr = race[key];

if(

Array.isArray(arr) &&

arr.length >= 6

){

return arr

.slice(0,6)

.map(

(r,i)=>

normalizeRacer(r,i)

);

}

}

return [];

}

/* =====================================================

   出走表取得

===================================================== */

async function loadRace(){

const btn =

document.querySelector(".mainBtn");

btn.disabled = true;

setStatus(

"出走表を取得中...\n"+

"現行V1 → V3 → V2 の順で確認しています。"

);

document

.getElementById("resultArea")

.classList.add("hidden");

try{

raceData =

await getRace();

/* V1専用抽出 */

if(usedApi === "V1"){

racers =

extractV1Racers(raceData);

}else{

racers =

extractRacers(raceData);

}

/* 6艇確認 */

if(racers.length < 6){

console.error(

"取得レース:",

raceData

);

throw new Error(

"レースは取得できましたが、6艇の選手データを抽出できませんでした。"

);

}

/* 枠番を1〜6に固定 */

racers =

racers.slice(0,6);

racers.forEach(

(r,i)=>{

r.course = i+1;

}

);

entryOrder =

[1,2,3,4,5,6];

renderEntryButtons();

renderRace();

/* =====================================================

   AI評価

===================================================== */

function courseBonus(course){

return{

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

}[course] || 0;

}

function rankBonus(rank){

const r =

String(rank).toUpperCase();

if(r==="A1") return 5;

if(r==="A2") return 2;

if(r==="B1") return 0;

if(r==="B2") return -2;

return 0;

}

function calcScore(r){

let score = 0;

score += r.national * 7;

score += r.local * 4;

score += r.motor2 * 0.15;

if(r.st > 0){

score +=

Math.max(

0,

0.30-r.st

) * 20;

}

score +=

courseBonus(r.course);

score +=

rankBonus(r.rank);

/* 展示 */

if(r.exhibition > 0){

if(r.exhibition <= 6.70){

score += 3;

}else if(r.exhibition <= 6.80){

score += 1;

}else if(r.exhibition >= 7.00){

score -= 2;

}

}

/* 前付け */

if(entryOrder[0] !== 1){

if(r.course === entryOrder[0]){

score += 3;

}

if(r.course === 1){

score -= 2;

}

}

return Math.round(score*10)/10;

}

function analyzeRace(){

racers.forEach(

r=>{

r.score =

calcScore(r);

}

);

}

function getOrdered(){

return [...racers]

.sort(

(a,b)=>

b.score-a.score

);

}

function getBoat(n){

return racers.find(

r=>r.course===n

);

}

/* =====================================================

   展開

===================================================== */

function makeForecast(){

const one =

getBoat(1);

const ranking =

getOrdered();

const second =

ranking.find(

r=>r.course!==1

);

const third =

ranking.find(

r=>

r.course!==1 &&

second &&

r.course!==second.course

);

const maezuke =

entryOrder[0] !== 1;

let text = "";

if(maezuke){

text +=

"前付けが入る想定。インのスタートが乱れると、";

if(second){

text +=

`${second.course}号艇の差し・まくり差しが有力。`;

}

}else{

text +=

`1号艇${one ? one.name : ""}のイン逃げを基本線。`;

if(second){

text +=

` 相手筆頭は${second.course}号艇。`;

}

if(third){

text +=

` 展開次第で${third.course}号艇まで。`;

}

}

text +=

"<br>ST・展示・モーター機力・全国勝率・当地勝率を総合評価。";

document

.getElementById("forecast")

.innerHTML =

text;

}

/* =====================================================

   買い目

===================================================== */

function makeCombinations(){

const sorted =

getOrdered();

const hit = [];

const honmei =

sorted[0];

const topOthers =

sorted

.filter(

r=>r.course !== honmei.course

)

.slice(0,3);

topOthers.forEach(

r=>{

const third =

topOthers.find(

x=>x.course!==r.course

);

if(third){

hit.push(

`${honmei.course}-${r.course}-${third.course}`

);

}

});

/* 回収率 */

const roi = [];

const candidates =

sorted

.slice(0,5)

.map(r=>r.course);

for(let i=0;i<candidates.length;i++){

for(let j=0;j<candidates.length;j++){

for(let k=0;k<candidates.length;k++){

if(

i===j ||

j===k ||

i===k

){

continue;

}

const combo =

`${candidates[i]}-${candidates[j]}-${candidates[k]}`;

if(!roi.includes(combo)){

roi.push(combo);

}

if(roi.length>=6){

break;

}

}

if(roi.length>=6){

break;

}

}

if(roi.length>=6){

break;

}

}

/* 穴 */

const hole = [];

sorted

.slice(3,6)

.forEach(

r=>{

hole.push(r.course);

}

);

return{

hit,

roi,

hole

};

}

/* =====================================================

function makeBudget(picks){

let budget =

Number(

document

.getElementById("budget")

.value

);

if(!budget || budget<100){

budget=3000;

}

const hitBudget =

Math.floor(budget*.50/100)*100;

const roiBudget =

Math.floor(budget*.35/100)*100;

const holeBudget =

Math.floor(budget*.15/100)*100;

const hitEach =

Math.max(

100,

Math.floor(

hitBudget/

Math.max(1,picks.hit.length)/

100

)*100

);

const roiEach =

Math.max(

100,

Math.floor(

roiBudget/

Math.max(1,picks.roi.length)/

100

)*100

);

const holeEach =

Math.max(

100,

Math.floor(

holeBudget/

Math.max(1,picks.hole.length)/

100

)*100

);

document

.getElementById("budgetResult")

.innerHTML =

`

<div class="pickBox">

<div>

的中率重視

<span class="gold">

${hitBudget.toLocaleString()}円

</span>

</div>

<div class="reason">

1点 ${hitEach.toLocaleString()}円

</div>

</div>

<div class="pickBox">

<div>

回収率重視

<span class="gold">

${roiBudget.toLocaleString()}円

</span>

</div>

<div class="reason">

1点 ${roiEach.toLocaleString()}円

</div>

</div>

<div class="pickBox">

<div>

穴狙い

<span class="gold">

${holeBudget.toLocaleString()}円

</span>

</div>

<div class="reason">

1点 ${holeEach.toLocaleString()}円

</div>

</div>

<div style="

text-align:center;

margin-top:12px;

">

合計予算

${budget.toLocaleString()}円

</div>

</div>

`;

}

/* =====================================================

   HTML安全化

===================================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
