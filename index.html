.boat-name{

.row:last-child{

}

.left{

}

.right{

}

.gold{

color:#d4af37;

}

.green{

color:#65df8b;

}

.red{

color:#ff6f61;

}

.yellow{

color:#ffd34d;

}

.entry-box{

font-size:27px;

font-weight:900;

color:#d4af37;

text-align:center;

padding:18px;

background:#0b0b0b;

border:1px solid #333;

border-radius:10px;

}

.note{

font-size:11px;

color:#777;

margin-top:7px;

line-height:1.6;

}

.warning{

background:#211b08;

border:1px solid #8d6c16;

padding:15px;

border-radius:10px;

}

.rank{

}

.pick{

padding:25px;

}

@media(max-width:600px){

.boats{

grid-template-columns:repeat(3,1fr);

}

.logo{

}

}

</style>

BOAT HUNTER © 2026

<script>

/*

========================================

BOAT HUNTER

実データ取得

========================================

*/

async function loadRaceData(){

const venue =

document.getElementById("venue").value;

const race =

Number(document.getElementById("race").value);

const budget =

Number(document.getElementById("budget").value);

const status =

document.getElementById("status");

status.innerText =

"⏳ 実際の出走表を取得中...";

document

.getElementById("result")

.classList.add("hidden");

try{

/*

今日の日付をJSTで作成

*/

const now = new Date();

const year =

now.getFullYear();

const month =

String(now.getMonth()+1)

.padStart(2,"0");

const day =

String(now.getDate())

.padStart(2,"0");

const date =

year + month + day;

/*

Boatrace Open API v1

*/

const url =

"https://boatraceopenapi.github.io/api/v1/"

+

year +

"/"

+

date +

".json";

const response =

await fetch(url);

if(!response.ok){

throw new Error(

"API HTTP " +

response.status

);

}

const data =

await response.json();

console.log(

"BOATRACE API DATA",

data

);

/*

データから対象レースを探す

*/

const target =

findRace(

data,

Number(venue),

race

);

if(!target){

throw new Error(

"対象レースが見つかりません"

);

}

/*

出走表表示

*/

displayRace(

target

);

/*

現時点の進入表示

※まだ前付け判定ではない

*/

displayEntry(

target

);

/*

AI表示

*/

displayAnalysis(

target,

budget

);

document

.getElementById("result")

.classList.remove("hidden");

status.innerText =

"✅ 実データ取得完了";

}

catch(error){

console.error(error);

status.innerText =

"❌ データ取得エラー："

+

error.message;

}

}

/*

========================================

対象レース検索

========================================

*/

function findRace(

data,

venue,

race

){

/*

APIの構造差に対応するため、

再帰的にレース候補を探す。

*/

let found = null;

function walk(obj){

if(found){

return;

}

if(!obj || typeof obj !== "object"){

return;

}

if(

obj.race_stadium_number != null &&

obj.race_number != null

){

const stadium =

Number(

obj.race_stadium_number

);

const number =

Number(

obj.race_number

);

if(

stadium === venue &&

number === race

){

found = obj;

return;

}

}

if(Array.isArray(obj)){

for(

const item of obj

){

walk(item);

if(found){

return;

}

}

}else{

for(

const key in obj

){

walk(obj[key]);

if(found){

return;

}

}

}

}

walk(data);

return found;

}

/*

========================================

出走表表示

========================================

*/

function displayRace(

race

){

const boats =

getBoats(race);

const element =

document.getElementById(

"boats"

);

element.innerHTML =

"";

boats.forEach(

function(boat){

const div =

document.createElement(

"div"

);

div.className =

"boat";

div.innerHTML = `

<div class="boat-number">

${boat.number}

</div>

<div class="boat-name">

${escapeHtml(

boat.name || "選手不明"

)}

</div>

<div class="boat-class">

${escapeHtml(

boat.class || "-"

)}

</div>

`;

element.appendChild(

div

);

});

}

/*

========================================

boats抽出

========================================

*/

function getBoats(

race

){

if(

Array.isArray(race.boats)

){

return race.boats

.map(

normalizeBoat

)

.sort(

(a,b)=>

a.number-b.number

);

}

/*

別名対応

*/

if(

Array.isArray(race.entries)

){

return race.entries

.map(

normalizeBoat

)

.sort(

(a,b)=>

a.number-b.number

);

}

return [];

}

/*

========================================

選手データ正規化

========================================

*/

function normalizeBoat(

boat

){

const number =

Number(

boat.racer_boat_number ??

boat.boat_number ??

boat.number ??

boat.racer_course_number ??

0

);

const name =

boat.racer_name ??

boat.name ??

boat.racer?.name ??

"選手不明";

const racerClass =

boat.racer_class ??

boat.class ??

boat.racer_grade ??

"";

return {

number:number,

name:name,

class:racerClass

};

}

/*

========================================

進入表示

========================================

*/

function displayEntry(

race

){

const boats =

getBoats(race);

const courses =

boats

.map(

boat =>

boat.number

)

.filter(

x =>

x>=1 &&

x<=6

);

const entry =

courses.length === 6

?

courses.join("-")

:

"1-2-3-4-5-6";

document.getElementById(

"entry"

).innerText =

entry;

document.getElementById(

"entryReason"

).innerText =

"出走表データから基本進入を表示。前付け判定は追加データ接続後に実装。";

document.getElementById(

"maezuke"

).innerHTML = `

<div class="row">

<span class="left">

前付け判定

</span>

<span class="right yellow">

データ分析準備中

</span>

</div>

`;

}

/*

========================================

AI分析表示

========================================

*/

function displayAnalysis(

race,

budget

){

const boats =

getBoats(race);

const ranking =

boats.map(

(boat,index)=>({

...boat,

score:

100-index*7

})

);

const rankingElement =

document.getElementById(

"ranking"

);

rankingElement.innerHTML =

"";

ranking.forEach(

function(

boat,

index

){

const div =

document.createElement(

"div"

);

div.className =

"rank";

div.innerHTML = `

<div class="gold">

${index+1}位

</div>

<strong>

${boat.number}号艇

${escapeHtml(boat.name)}

</strong>

<div class="pick">

${boat.score}pt

</div>

<div class="note">

現段階では出走表のみを使用。

選手・モーター・展示・STを追加後、

期待値計算を強化します。

</div>

`;

rankingElement.appendChild(

div

);

});

const first =

boats[0]

?

boats[0].number

:

1;

const second =

boats[1]

?

boats[1].number

:

2;

const third =

boats[2]

?

boats[2].number

:

3;

document.getElementById(

"development"

).innerHTML = `

<div class="row">

<span class="left">

本命候補

</span>

<span class="right gold">

${first}号艇

</span>

</div>

<div class="row">

<span class="left">

対抗候補

</span>

<span class="right">

${second}号艇

</span>

</div>

<div class="row">

<span class="left">

穴候補

</span>

<span class="right yellow">

${third}号艇

</span>

</div>

`;

document.getElementById(

"final"

).innerHTML = `

<div class="row">

<span class="left">

本命

</span>

<span class="right gold">

${first}号艇

</span>

</div>

<div class="row">

<span class="left">

対抗

</span>

<span class="right">

${second}号艇

</span>

</div>

<div class="row">

<span class="left">

穴

</span>

<span class="right yellow">

${third}号艇

</span>

</div>

`;

const hitMoney =

Math.floor(

budget*0.6

);

const roiMoney =

budget-hitMoney;

document.getElementById(

"hitPick"

).innerText =

`${first}-${second}-${third}`;

document.getElementById(

"hitMoney"

).innerText =

"予算：" +

hitMoney +

"円";

document.getElementById(

"roiPick"

).innerText =

`${second}-${third}-${first}`;

document.getElementById(

"roiMoney"

).innerText =

"予算：" +

roiMoney +

"円";

}

/*

========================================

HTMLエスケープ

========================================

*/

function escapeHtml(

text

){

return String(text)

.replace(

/&/g,

"&amp;"

)

.replace(

/</g,

"&lt;"

)

.replace(

/>/g,

"&gt;"

)

.replace(

/"/g,

"&quot;"

)

.replace(

/'/g,

"&#039;"

);

}

</script>

</body>
