<script>

/* =========================================

API

========================================= */

const API_TODAY =

"https://boatraceopenapi.github.io/programs/v3/today.json";

const API_V3 =

"https://boatraceopenapi.github.io/programs/v3";

const API_V2 =

"https://boatraceopenapi.github.io/programs/v2";

let raceData = null;

let selectedEntry = [];

/* =========================================

HTML ESCAPE

========================================= */

function escapeHtml(text){

return String(text ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

/* =========================================

数値変換

========================================= */

function num(value){

if(

value === null ||

value === undefined ||

value === ""

){

return 0;

}

const n = Number(value);

return Number.isFinite(n) ? n : 0;

}

/* =========================================

表示用数値

========================================= */

function format(value){

if(

value === null ||

value === undefined ||

value === ""

){

return "-";

}

const n = Number(value);

if(!Number.isFinite(n)){

return String(value);

}

return n.toFixed(2);

}

/* =========================================

級別

========================================= */

function getRank(value){

const map = {

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

return map[value] || value || "-";

}

/* =========================================

今日の日付

========================================= */

function getJstDate(){

const now = new Date();

const parts =

new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(now);

const y =

parts.find(x=>x.type==="year").value;

const m =

parts.find(x=>x.type==="month").value;

const d =

parts.find(x=>x.type==="day").value;

return {

year:y,

date:y+m+d

};

}

/* =========================================

JSON取得

========================================= */

async function fetchJson(url){

const response =

await fetch(

url,

{

cache:"no-store"

}

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

return await response.json();

}

/* =========================================

レース配列を取得

========================================= */

function getRaceArray(data){

if(Array.isArray(data)){

return data;

}

if(!data || typeof data !== "object"){

return [];

}

/*

APIによって

data.races

data.programs

data.data

などになる場合に対応

*/

const candidates = [

data.races,

data.programs,

data.data,

data.items,

data.results

];

for(const value of candidates){

if(Array.isArray(value)){

return value;

}

}

/*

入れ子になっている場合

*/

for(const key of Object.keys(data)){

const value = data[key];

if(Array.isArray(value)){

if(

value.length &&

typeof value[0] === "object"

){

return value;

}

}

}

return [];

}

/* =========================================

対象レース検索

========================================= */

function findRace(data,stadium,raceNumber){

const races =

getRaceArray(data);

console.log(

"API race count:",

races.length

);

const race =

races.find(function(r){

return (

num(r.race_stadium_number) === stadium &&

num(r.race_number) === raceNumber

);

});

if(race){

return race;

}

/*

念のためキー名違いにも対応

*/

return races.find(function(r){

const stadiumValue =

r.race_stadium_number ??

r.stadium_number ??

r.stadiumNumber ??

r.stadium ??

r.jcd;

const raceValue =

r.race_number ??

r.raceNumber ??

r.rno ??

r.race_no;

return (

num(stadiumValue) === stadium &&

num(raceValue) === raceNumber

);

}) || null;

}

/* =========================================

選手配列

========================================= */

function getRacers(race){

if(!race){

return [];

}

const candidates = [

race.racers,

race.boats,

race.entries,

race.racer,

race.players

];

for(const value of candidates){

if(Array.isArray(value)){

return value;

}

if(

value &&

typeof value === "object"

){

return Object.values(value);

}

}

return [];

}

/* =========================================

艇番

========================================= */

function getBoatNumber(r){

return num(

r.racer_boat_number ??

r.entry_number ??

r.boat_number ??

r.number ??

r.boat

);

}

/* =========================================

選手名

========================================= */

function getName(r){

return (

r.racer_name ??

r.name ??

r.racerName ??

r.player_name ??

"選手名不明"

);

}

/* =========================================

級別

========================================= */

function getRacerRank(r){

return (

r.racer_rank_number ??

r.rank_number ??

r.rank ??

r.class ??

"-"

);

}

/* =========================================

出走表表示

========================================= */

function displayRace(race){

const boats =

document.getElementById("boats");

boats.innerHTML = "";

let racers =

getRacers(race);

racers = racers

.filter(function(r){

return getBoatNumber(r) >= 1 &&

getBoatNumber(r) <= 6;

})

.sort(function(a,b){

return getBoatNumber(a) -

getBoatNumber(b);

});

if(racers.length === 0){

boats.innerHTML = `

<div class="note">

レースは取得できましたが、

選手データが取得できませんでした。

</div>

`;

return;

}

racers.forEach(function(r){

const number =

getBoatNumber(r);

const name =

getName(r);

const rank =

getRacerRank(r);

const national =

r.racer_national_win_rate ??

r.national_win_rate ??

r.national_win ??

r.national_rate;

const local =

r.racer_local_win_rate ??

r.local_win_rate ??

r.local_win ??

r.local_rate;

const motor =

r.motor_number ??

r.motor_no ??

r.racer_motor_number;

const st =

r.racer_average_start_timing ??

r.average_start_timing ??

r.average_st;

const div =

document.createElement("div");

div.className = "boat";

div.innerHTML = `

<div class="boat-number">

${number}

</div>

<div class="boat-name">

${escapeHtml(name)}

</div>

<div class="boat-class">

${escapeHtml(getRank(rank))}

</div>

<div class="metric">

全国 ${format(national)}

</div>

<div class="metric">

当地 ${format(local)}

</div>

<div class="metric">

M${motor || "-"}

</div>

<div class="metric">

ST ${st ? format(st) : "-"}

</div>

`;

boats.appendChild(div);

});

}

/* =========================================

出走表取得

========================================= */

async function loadRace(){

const stadium =

num(

document.getElementById("venue").value

);

const raceNumber =

num(

document.getElementById("race").value

);

const status =

document.getElementById("status");

const apiInfo =

document.getElementById("apiInfo");

status.innerText =

"⏳ 出走表データを取得中...";

apiInfo.innerText =

"API接続中...";

document

.getElementById("result")

.classList.add("hidden");

try{

let data = null;

let usedApi = "";

/*

① 今日の専用API

*/

try{

data =

await fetchJson(API_TODAY);

usedApi = "v3 today.json";

}catch(error){

console.log(

"today API failed",

error

);

/*

② 日付指定v3

*/

const date =

getJstDate();

try{

const url =

API_V3 +

"/" +

date.year +

"/" +

date.date +

".json";

data =

await fetchJson(url);

usedApi = "v3 date";

}catch(error2){

console.log(

"v3 date failed",

error2

);

/*

③ v2

*/

const url =

API_V2 +

"/" +

date.year +

"/" +

date.date +

".json";

data =

await fetchJson(url);

usedApi = "v2 date";

}

}

/*

対象レース検索

*/

const race =

findRace(

data,

stadium,

raceNumber

);

if(!race){

const races =

getRaceArray(data);

throw new Error(

"指定したレースが見つかりません。"+

"\nAPI取得件数："+races.length+

"\n会場番号："+stadium+

"\nレース："+raceNumber+"R"

);

}

raceData = race;

selectedEntry = [];

displayRace(race);

createEntryButtons();

document

.getElementById("result")

.classList.remove("hidden");

status.innerText =

"✅ 出走表取得成功";

const racers =

getRacers(race);

apiInfo.innerHTML = `

取得日：${getJstDate().date}

<br>

会場番号：${stadium}

<br>

レース：${raceNumber}R

<br>

使用API：${usedApi}

<br>

選手：${racers.length}名

`;

}catch(error){

console.error(error);

status.innerHTML = `

❌ 出走表取得失敗

<br>

${escapeHtml(error.message)}

<br><br>

APIは接続できていますが、

指定レースのデータ構造を確認できませんでした。

`;

document

.getElementById("result")

.classList.add("hidden");

}

}

/* =========================================

進入ボタン

========================================= */

function createEntryButtons(){

const container =

document.getElementById(

"entryButtons"

);

container.innerHTML = "";

for(let i=1;i<=6;i++){

const button =

document.createElement("button");

button.className =

"entry-btn";

button.innerText =

i+"号艇";

button.onclick = function(){

selectEntry(i);

};

container.appendChild(button);

}

}

/* =========================================

進入選択

========================================= */

function selectEntry(boat){

if(selectedEntry.includes(boat)){

return;

}

if(selectedEntry.length >= 6){

return;

}

selectedEntry.push(boat);

updateEntryButtons();

document

.getElementById("entryResult")

.innerText =

selectedEntry.join("-");

}

/* =========================================

進入ボタン更新

========================================= */

function updateEntryButtons(){

const buttons =

document.querySelectorAll(

".entry-btn"

);

buttons.forEach(function(button,index){

const boat = index + 1;

button.classList.toggle(

"selected",

selectedEntry.includes(boat)

);

});

}

/* =========================================

進入リセット

========================================= */

function clearEntry(){

selectedEntry = [];

updateEntryButtons();

document

.getElementById("entryResult")

.innerText =

"進入を入力してください";

}

/* =========================================

AI解析

========================================= */

function analyzeRace(){

if(!raceData){

alert(

"先に出走表を取得してください。"

);

return;

}

if(selectedEntry.length !== 6){

alert(

"6艇すべての進入を入力してください。"

);

return;

}

/*

重複チェック

*/

if(new Set(selectedEntry).size !== 6){

alert(

"同じ艇番が重複しています。"

);

return;

}

const racers =

getRacers(raceData);

const ranking =

racers

.map(function(r){

const number =

getBoatNumber(r);

return {

number:number,

name:getName(r),

score:calcScore(

r,

selectedEntry

)

};

})

.filter(function(r){

return r.number >= 1 &&

r.number <= 6;

})

.sort(function(a,b){

return b.score - a.score;

});

if(ranking.length < 3){

alert(

"6艇の選手データを正しく取得できていません。"

);

return;

}

showAnalysis(

ranking,

selectedEntry

);

}

/* =========================================

AIスコア

========================================= */

function calcScore(r,entry){

let score = 0;

const national =

num(

r.racer_national_win_rate ??

r.national_win_rate ??

r.national_win ??

r.national_rate

);

const local =

num(

r.racer_local_win_rate ??

r.local_win_rate ??

r.local_win ??

r.local_rate

);

const motor2 =

num(

r.motor_top_2_percent ??

r.motor_2_rate ??

r.motor_2rentai

);

const st =

num(

r.racer_average_start_timing ??

r.average_start_timing ??

r.average_st

);

const rank =

num(

r.racer_rank_number ??

r.rank_number ??

r.rank

);

const boat =

getBoatNumber(r);

const course =

entry.indexOf(boat) + 1;

/*

全国勝率

*/

score +=

national * 7;

/*

当地勝率

*/

score +=

local * 4;

/*

モーター2連率

*/

score +=

motor2 * 0.15;

/*

ST

*/

if(st > 0){

score +=

Math.max(

0,

0.30 - st

) * 20;

}

/*

進入コース

*/

const courseBonus = {

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

};

score +=

courseBonus[course] || 0;

/*

級別

*/

if(rank === 1){

score += 5;

}

if(rank === 4){

score -= 2;

}

return Math.round(score);

}

function createPicks(ranking){

const budget =

num(

document.getElementById("budget").value

) || 3000;

const a =

ranking[0].number;

const b =

ranking[1].number;

const c =

ranking[2].number;

const d =

ranking[3]

?

ranking[3].number

:

ranking[2].number;

/*

的中率重視

*/

const hitPicks = [

`${a}-${b}-${c}`,

`${a}-${c}-${b}`,

`${a}-${b}-${d}`,

`${a}-${d}-${b}`,

`${b}-${a}-${c}`

];

/*

回収率重視

*/

const roiPicks = [

`${a}-${b}-${c}`,

`${a}-${c}-${b}`,

`${a}-${b}-${d}`,

`${b}-${a}-${c}`,

`${b}-${c}-${a}`,

`${c}-${a}-${b}`,

`${c}-${b}-${a}`,

`${d}-${a}-${b}`

];

const hitBudget =

Math.floor(

budget * 0.5 / 100

) * 100;

const roiBudget =

budget - hitBudget;

const hitUnit =

Math.max(

100,

Math.floor(

hitBudget /

hitPicks.length /

100

) * 100

);

const roiUnit =

Math.max(

100,

Math.floor(

roiBudget /

roiPicks.length /

100

) * 100

);

function html(picks,unit){

return picks.map(function(p,i){

return `

<div class="pick-line">

${i+1}. ${p}

<span class="pick-money">

${unit}円

</span>

</div>

`;

}).join("");

}

document.getElementById(

"pickArea"

).innerHTML = `

)}

}
