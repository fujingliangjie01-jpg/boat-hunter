<style>

*{box-sizing:border-box}

body{

 margin:0;background:#080808;color:#fff;

 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

header{

 background:linear-gradient(135deg,#080808,#211a07);

}

 background:#171707;border-left:3px solid #d4af37;

.pickBox{

}

 gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px

.pick.strong .prob{color:#ffd84d;font-size:14px;font-weight:900}

.pick.strong strong{color:#ffd84d}

.pick.veryStrong strong{color:#ff3b30}

.total{

 background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;

.budgetInfo{

}

.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}

.overviewBox{

 background:#101010;border:1px solid #333;border-radius:8px;

}

.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}

.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}

@media(max-width:600px){

 .grid2{grid-template-columns:1fr}

 .courseGrid{grid-template-columns:repeat(2,1fr)}

 .racers{grid-template-columns:1fr}

 .overviewGrid{grid-template-columns:repeat(2,1fr)}

<script>

/* =====================================================

   BOAT HUNTER

   API V3 → V2 → V1 フォールバック

===================================================== */

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

const API_V1="https://boatraceopenapi.github.io/api/v1";

let raceData=null;

let racers=[];

let previewRacers={};

let manualCourses={};

let historyData={};

let currentBets=null;

let currentApi="";

function n(v){

 if(v===null||v===undefined||v==="")return 0;

 const x=parseFloat(String(v).replace("%","").replace("秒","").replace(",",""));

 return Number.isFinite(x)?x:0;

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function getBudget(){

 let v=Number(document.getElementById("budget").value);

 if(!Number.isFinite(v)||v<100)v=100;

 v=Math.floor(v/100)*100;

 document.getElementById("budget").value=v;

 return v;

}

function formatYen(v){

 return Number(v||0).toLocaleString("ja-JP")+"円";

}

function todayParts(){

 const p=new Intl.DateTimeFormat("ja-JP",{

  timeZone:"Asia/Tokyo",

  year:"numeric",month:"2-digit",day:"2-digit"

 }).formatToParts(new Date());

 return{

  year:p.find(x=>x.type==="year").value,

  yyyymmdd:

   p.find(x=>x.type==="year").value+

   p.find(x=>x.type==="month").value+

   p.find(x=>x.type==="day").value

 };

}

async function getJSON(url){

 const r=await fetch(url,{cache:"no-store"});

 if(!r.ok)throw new Error("HTTP "+r.status);

 return await r.json();

}

/* =====================================================

   API探索

===================================================== */

function findRace(data,venue,race){

 const v=String(venue);

 const r=String(race);

 let found=null;

 function check(obj){

  if(!obj||typeof obj!=="object"||found)return;

  const rn=

   obj.race_number ??

   obj.raceNo ??

   obj.race_no ??

   obj.number;

  const vn=

   obj.stadium_number ??

   obj.venue_number ??

   obj.stadium ??

   obj.venue;

  if(

   rn!==undefined &&

   String(rn)===r &&

   (

    vn===undefined ||

    String(vn)===v

   )

  ){

   if(

    obj.racers||

    obj.entries||

    obj.program||

    obj.participants

   ){

    found=obj;

    return;

   }

  }

  if(Array.isArray(obj)){

   for(const x of obj){

    check(x);

    if(found)return;

   }

  }else{

   for(const k of Object.keys(obj)){

    check(obj[k]);

    if(found)return;

   }

  }

 }

 /* よくある構造を先に確認 */

 const directPaths=[

  data?.programs?.stadiums?.[v]?.races?.[r],

  data?.stadiums?.[v]?.races?.[r],

  data?.races?.[r]

 ];

 for(const x of directPaths){

  if(x){

   found=x;

   break;

  }

 }

 if(!found)check(data);

 return found;

}

async function loadDailyData(){

 const p=todayParts();

 const urls=[

  {

   name:"V3",

   url:`${API_V3}/${p.year}/${p.yyyymmdd}.json`

  },

  {

   name:"V2",

   url:`${API_V2}/${p.year}/${p.yyyymmdd}.json`

  },

  {

   name:"V1",

   url:`${API_V1}/${p.year}/${p.yyyymmdd}.json`

  }

 ];

 let errors=[];

 for(const api of urls){

  try{

   const data=await getJSON(api.url);

   if(data){

    return{

     data,

     url:api.url,

     version:api.name

    };

   }

  }catch(e){

   errors.push(api.name+"="+e.message);

  }

 }

 throw new Error(

  "V3・V2・V1すべてのAPI取得に失敗しました。 "+

  errors.join(" / ")

 );

}

/* =====================================================

   出走選手

===================================================== */

function extractRacers(race){

 const source=

  race?.racers||

  race?.entries||

  race?.program||

  race?.participants;

 if(!source)return[];

 const arr=Array.isArray(source)

  ?source

  :Object.values(source);

 return arr.map((r,i)=>({

  ...r,

  entry_number:n(

   r.entry_number||

   r.boat_number||

   r.number_boat||

   r.boat||

   i+1

  )

 }))

 .filter(r=>r.entry_number>=1&&r.entry_number<=6)

 .sort((a,b)=>a.entry_number-b.entry_number);

}

function getPreviewData(race){

 return race?.preview?.racers||

 race?.preview||

 {};

}

function getPreview(boat){

 return previewRacers[String(boat)]||

 previewRacers[boat]||

 {};

}

/* =====================================================

   進入

===================================================== */

function initCourses(){

 for(let boat=1;boat<=6;boat++){

  const el=document.getElementById("course"+boat);

  el.innerHTML="";

  for(let c=1;c<=6;c++){

   const o=document.createElement("option");

   o.value=c;

   o.textContent=c+"コース";

   el.appendChild(o);

  }

  el.value=boat;

  manualCourses[boat]=boat;

  el.addEventListener("change",function(){

   manualCourses[boat]=Number(this.value);

  });

 }

}

function resetCourses(){

 for(let boat=1;boat<=6;boat++){

  document.getElementById("course"+boat).value=boat;

  manualCourses[boat]=boat;

 }

 document.getElementById("message").innerHTML=

 `<span class="success">🔄 進入入力をリセットしました</span>`;

}

function getCourse(boat){

 return Number(manualCourses[boat]||boat);

}

/* =====================================================

   過去データ

===================================================== */

function getDateBefore(days){

 const d=new Date();

 d.setHours(12,0,0,0);

 d.setDate(d.getDate()-days);

 return d;

}

function dateString(date){

 const y=date.getFullYear();

 const m=String(date.getMonth()+1).padStart(2,"0");

 const d=String(date.getDate()).padStart(2,"0");

 return{

  year:String(y),

  ymd:String(y)+m+d

 };

}

function decisionName(num){

 return{

  1:"逃げ",

  2:"差し",

  3:"まくり",

  4:"まくり差し",

  5:"抜き",

  6:"恵まれ"

 }[n(num)]||"-";

}

function collectResultRaces(data,callback){

 function walk(obj){

  if(!obj||typeof obj!=="object")return;

  if(Array.isArray(obj)){

   obj.forEach(walk);

   return;

  }

  if(obj.result&&obj.result.racers){

   callback(obj,obj.result);

  }

  Object.values(obj).forEach(v=>{

   if(v&&typeof v==="object")walk(v);

  });

 }

 walk(data);

}

async function loadHistory(){

 historyData={};

 const targets={};

 racers.forEach(r=>{

  const number=n(

   r.number||

   r.registration_number||

   r.racer_number

  );

  if(number){

   targets[number]={

    name:r.name,

    boats:{1:[],2:[],3:[],4:[],5:[],6:[]}

   };

  }

 });

 const targetNumbers=new Set(Object.keys(targets).map(Number));

 for(let start=1;start<=60;start+=5){

  const jobs=[];

  for(let offset=0;offset<5;offset++){

   const parts=dateString(

    getDateBefore(start+offset)

   );

   jobs.push(

    getJSON(

     `${API_V1}/${parts.year}/${parts.ymd}.json`

    ).catch(()=>null)

   );

  }

  const results=await Promise.all(jobs);

  for(const data of results){

   if(!data)continue;

   collectResultRaces(data,(race,result)=>{

    const rr=result?.racers;

    if(!rr)return;

    Object.values(rr).forEach(x=>{

     const number=n(

      x.number||

      x.registration_number||

      x.racer_number

     );

     if(!targetNumbers.has(number))return;

     const course=n(

      x.course_number||

      x.course||

      x.entry_course

     );

     const place=n(

      x.place_number||

      x.place||

      x.rank||

      x.result

     );

     if(course<1||course>6||place<1||place>6)return;

     const target=targets[number];

     if(

      target &&

      target.boats[course].length<10

     ){

      target.boats[course].push({

       date:result.date||race.date||"",

       place,

       course,

       decision:decisionName(

        result.technique_number||

        x.technique_number||

        result.technique

       )

      });

     }

    });

   });

  }

 }

 historyData=targets;

}

function getRacer(boat){

 return racers.find(r=>n(r.entry_number)===boat);

}

function getHistory(boat){

 const r=getRacer(boat);

 if(!r)return[];

 const number=n(

  r.number||

  r.registration_number||

  r.racer_number

 );

 return(

  historyData[number]?.boats?.[getCourse(boat)]||[]

 ).slice(0,10);

}

function getHistoryStats(boat){

 const list=getHistory(boat);

 let first=0,second=0,third=0;

 list.forEach(x=>{

  if(x.place===1)first++;

  if(x.place===2)second++;

  if(x.place===3)third++;

 });

 return{

  count:list.length,

  first,

  second,

  third,

  rate:list.length?

   (first+second+third)/list.length*100:0

 };

}

function historyScore(boat){

 const s=getHistoryStats(boat);

 if(!s.count)return 0;

 return(

  s.first*3.8+

  s.second*2.6+

  s.third*1.6+

  s.rate*.20

 );

}

function renderHistory(boat){

 const list=getHistory(boat);

 const s=getHistoryStats(boat);

 const course=getCourse(boat);

 if(!list.length){

  return`

  <div class="history">

   <div class="historyTitle">

    📈 ${course}コース過去10走

   </div>

   <div class="historyList">

    データなし

   </div>

  </div>`;

 }

 return`

 <div class="history">

  <div class="historyTitle">

   📈 ${course}コース過去${list.length}走

  </div>

  <div class="historyStats">

   <div class="historyStat">1着<strong>${s.first}</strong></div>

   <div class="historyStat">2着<strong>${s.second}</strong></div>

   <div class="historyStat">3着<strong>${s.third}</strong></div>

   <div class="historyStat">

    3連対率<strong>${s.rate.toFixed(1)}%</strong>

   </div>

  </div>

  <div class="historyList">

function getDecisionData(r){

 return{

  escape:n(

   r.escape_rate||

   r.nige_rate||

   r.win_by_escape_rate||

   r.by_escape_rate

  ),

  sashi:n(

   r.sashi_rate||

   r.win_by_sashi_rate||

   r.by_sashi_rate

  ),

  maki:n(

   r.maki_rate||

   r.makuri_rate||

   r.win_by_maki_rate||

   r.by_maki_rate

  ),

  makiSashi:n(

   r.maki_sashi_rate||

   r.makurisashi_rate||

   r.win_by_maki_sashi_rate||

   r.by_maki_sashi_rate

  )

 };

}

function decisionSuitability(boat,type){

 const r=getRacer(boat);

 if(!r)return 0;

 const d=getDecisionData(r);

 const course=getCourse(boat);

 let v=0;

 if(type==="escape"){

  if(course===1)v+=35;

  v+=d.escape*1.25;

 }

 if(type==="sashi"){

  if(course===2)v+=22;

  else if(course===3)v+=10;

  else if(course===4)v+=5;

  v+=d.sashi*1.55;

 }

 if(type==="maki"){

  if(course===3)v+=17;

  else if(course===4)v+=19;

  else if(course===5)v+=9;

  v+=d.maki*1.55;

 }

 if(type==="makiSashi"){

  if(course===3)v+=17;

  else if(course===4)v+=16;

  else if(course===5)v+=9;

  v+=d.makiSashi*1.55;

 }

 return v;

}

function calculateOverview(){

 const values={

  escape:0,

  sashi:0,

  maki:0,

  makiSashi:0

 };

 for(let boat=1;boat<=6;boat++){

  Object.keys(values).forEach(type=>{

   values[type]+=decisionSuitability(boat,type);

  });

 }

 /* インが1コースなら強制的に適正評価 */

 if(getCourse(1)===1){

  const r1=getRacer(1);

  values.escape+=

   70+

   n(r1?.national_win_rate)*4+

   n(r1?.local_win_rate)*2+

   n(

    r1?.national_top_2_percent||

    r1?.national_2ren_rate

   )*.15;

 }else{

  values.escape+=5;

 }

 const total=

  Object.values(values).reduce((a,b)=>a+b,0)||1;

 const result={};

 Object.keys(values).forEach(k=>{

  result[k]=values[k]/total*100;

 });

 return result;

}

function typeName(type){

 return{

  escape:"イン逃げ",

  sashi:"差し",

  maki:"まくり",

  makiSashi:"まくり差し"

 }[type]||type;

}

function dominantType(o){

 return Object.entries(o)

 .sort((a,b)=>b[1]-a[1])[0][0];

}

function scoreBoat(boat){

 const r=getRacer(boat);

 if(!r)return 0;

 const p=getPreview(boat);

 const course=getCourse(boat);

 let score=0;

 score+=n(r.national_win_rate)*7;

 score+=n(r.local_win_rate)*4;

 score+=n(

  r.national_top_2_percent||

  r.national_2ren_rate

 )*.12;

 const motor=n(

  r.motor_top_2_percent||

  r.motor_2ren_rate

 );

 score+=motor*.15;

 if(motor>=40)score+=5;

 else if(motor>=35)score+=3;

 else if(motor>=30)score+=1;

 else if(motor<20)score-=2;

 const avgST=n(r.average_start_timing);

 if(avgST>0){

  score+=Math.max(0,.30-avgST)*20;

 }

 const st=n(p.start_timing||p.st);

 if(st>0){

  score+=Math.max(0,.25-st)*15;

 }

 const exhibition=n(

  p.exhibition_time||

  p.exhibition

 );

 if(exhibition>0){

  score+=Math.max(0,6.80-exhibition)*5;

 }

 score+={

  1:10,

  2:6,

  3:5,

  4:3,

  5:1,

  6:0

 }[course]||0;

 const hs=getHistoryStats(boat);

 if(hs.count){

  score+=historyScore(boat);

  if(hs.rate>=60)score+=5;

  else if(hs.rate>=40)score+=3;

  else if(hs.rate<20)score-=2;

 }

 const rank=rankName(r.rank_number);

 if(rank==="A1")score+=5;

 if(rank==="A2")score+=2;

 if(rank==="B2")score-=2;

 const overview=calculateOverview();

 score+=

  decisionSuitability(

   boat,

   dominantType(overview)

  )*.35;

 /* イン逃げ中心なら1号艇を明確に加点 */

 if(

  dominantType(overview)==="escape" &&

  course===1

 ){

  score+=25;

 }

 return Math.max(0,score);

}

function makeRanking(){

 const arr=[];

 for(let boat=1;boat<=6;boat++){

  arr.push({

   boat,

   racer:getRacer(boat),

   score:scoreBoat(boat)

  });

 }

 return arr.sort((a,b)=>b.score-a.score);

}

function boatHasStrongMotor(boat){

  r?.motor_top_2_percent||

 )>=35;

}

function boatHasGoodHistory(boat){

 return s.count>=5&&s.rate>=40;

}

function boatHasAttack(boat,o){

 return Object.entries(o).some(

  ([type,value])=>

   type!=="escape" &&

   value>=20 &&

   decisionSuitability(boat,type)>=15

 );

}

function getExcludedBoats(rankings){

 const excluded=new Set();

 if(!rankings.length)return excluded;

 const top=rankings[0];

 rankings.slice(3).forEach(x=>{

  if(

   x.boat===1 &&

   getCourse(1)===1

  )return;

  const gap=top.score-x.score;

  const motor=boatHasStrongMotor(x.boat);

  const history=boatHasGoodHistory(x.boat);

  const attack=boatHasAttack(

   x.boat,

   calculateOverview()

  );

  if(

   gap>=18 &&

   !motor &&

   !history &&

   !attack

  ){

   excluded.add(x.boat);

  }

 });

 return excluded;

}

/* =====================================================

   買い目

===================================================== */

function getRank(rankings,boat){

 return rankings.findIndex(x=>x.boat===boat)+1;

}

function getFirstCandidates(rankings){

 const excluded=getExcludedBoats(rankings);

 const overview=calculateOverview();

 return rankings.filter(x=>{

  const rank=getRank(rankings,x.boat);

  if(rank>4)return false;

  if(excluded.has(x.boat))return false;

  const course=getCourse(x.boat);

  /* イン1号艇は最優先 */

  if(x.boat===1&&course===1)return true;

  const attack=boatHasAttack(x.boat,overview);

  const motor=boatHasStrongMotor(x.boat);

  const history=boatHasGoodHistory(x.boat);

  return attack||motor||history;

 });

}

function getSecondCandidates(rankings){

 const excluded=getExcludedBoats(rankings);

 const overview=calculateOverview();

 return rankings.filter(x=>{

  if(excluded.has(x.boat))return false;

  const rank=getRank(rankings,x.boat);

  if(rank<=4)return true;

  const reasons=[

   boatHasStrongMotor(x.boat),

   boatHasGoodHistory(x.boat),

   boatHasAttack(x.boat,overview)

  ].filter(Boolean).length;

  return reasons>=2;

 });

}

/* =====================================================

   1点生成

===================================================== */

function makeCandidate(a,b,rankings,type){

 if(a===b)return null;

 const A=rankings.find(x=>x.boat===a);

 const B=rankings.find(x=>x.boat===b);

 if(!A||!B)return null;

 const overview=calculateOverview();

 const excluded=getExcludedBoats(rankings);

 if(excluded.has(a)||excluded.has(b))return null;

 const rankA=getRank(rankings,a);

 const rankB=getRank(rankings,b);

 if(rankA>4)return null;

 if(rankB>4){

  const reasons=[

   boatHasStrongMotor(b),

   boatHasGoodHistory(b),

   boatHasAttack(b,overview)

  ].filter(Boolean).length;

  if(reasons<2)return null;

 }

 let raw=A.score*1.45+B.score*.80;

 raw+=

  rankA===1?14:

  rankA===2?9:

  rankA===3?5:2;

 raw+=

  rankB===1?8:

  rankB===2?6:

  rankB===3?4:2;

 /* =================================================

    ★イン逃げ

 ================================================= */

 if(type==="escape"){

  if(getCourse(1)!==1)return null;

  if(a!==1)return null;

  /*

   全体見通しがイン逃げ中心なら

   1号艇1着を強制的に大幅加点

  */

  raw+=

   50+

   overview.escape*1.5+

   decisionSuitability(1,"escape");

 }

 /* 差し */

 if(type==="sashi"){

  if(a===1)return null;

  raw+=

   decisionSuitability(a,"sashi")*.9+

   overview.sashi*.75;

 }

 /* まくり */

 if(type==="maki"){

  if(a===1)return null;

  raw+=

   decisionSuitability(a,"maki")*.9+

   overview.maki*.75;

 }

 /* まくり差し */

 if(type==="makiSashi"){

  if(a===1)return null;

  raw+=

   decisionSuitability(a,"makiSashi")*.9+

   overview.makiSashi*.75;

 }

 raw+=historyScore(a)*1.3;

 const r=getRacer(a);

 raw+=n(

  r?.motor_top_2_percent||

  r?.motor_2ren_rate

 )*.08;

 if(rankA===1)raw+=10;

 if(rankA===2)raw+=6;

 if(rankA===3)raw+=3;

 if(rankB===1)raw+=5;

 if(rankB===2)raw+=4;

 if(rankB===3)raw+=2;

 return{

  key:`${a}-${b}`,

  a,b,

  raw:Math.max(.01,raw),

  rankA,

  rankB

 };

}

/* =====================================================

   プール

===================================================== */

function makePool(rankings,type){

 const pool=[];

 const firsts=getFirstCandidates(rankings);

 const seconds=getSecondCandidates(rankings);

 for(const A of firsts){

  for(const B of seconds){

   const x=makeCandidate(

    A.boat,

    B.boat,

    rankings,

    type

   );

   if(x)pool.push(x);

  }

 }

 return pool.sort((a,b)=>b.raw-a.raw);

}

/* =====================================================

   買い目構築

===================================================== */

function buildBets(rankings){

 const result={

  hit:[],

  escape:[],

  sashi:[],

  maki:[],

  makiSashi:[],

  under:[]

 };

 const used=new Set();

 const overview=calculateOverview();

 /* -----------------------------

    的中率

 ----------------------------- */

 let hitPool=[];

 [

  "escape",

  "sashi",

  "maki",

  "makiSashi"

 ].forEach(type=>{

  hitPool.push(...makePool(rankings,type));

 });

 hitPool.sort((a,b)=>b.raw-a.raw);

 /*

  イン逃げ中心なら

  的中率重視にも必ず1-2系を入れる

 */

 if(

  overview.escape>=50 &&

  getCourse(1)===1

 ){

  const escape=

   hitPool.filter(

    x=>x.a===1

   );

  for(const x of escape){

   if(result.hit.length>=4)break;

   if(!used.has(x.key)){

    result.hit.push(x);

    used.add(x.key);

   }

  }

 }

 for(const x of hitPool){

  if(result.hit.length>=4)break;

  if(used.has(x.key))continue;

  result.hit.push(x);

  used.add(x.key);

 }

 /* -----------------------------

    回収率・イン逃げ

 ----------------------------- */

 if(

  overview.escape>=45 &&

  getCourse(1)===1

 ){

  const pool=makePool(rankings,"escape");

  for(const x of pool){

   if(result.escape.length>=4)break;

   if(used.has(x.key))continue;

   result.escape.push(x);

   used.add(x.key);

  }

 }

 /* -----------------------------

    差し

 ----------------------------- */

 for(const x of makePool(rankings,"sashi")){

  if(result.sashi.length>=4)break;

  if(used.has(x.key))continue;

  result.sashi.push(x);

  used.add(x.key);

 }

 /* -----------------------------

    まくり

 ----------------------------- */

 for(const x of makePool(rankings,"maki")){

  if(result.maki.length>=4)break;

  if(used.has(x.key))continue;

  result.maki.push(x);

  used.add(x.key);

 }

 /* -----------------------------

    まくり差し

 ----------------------------- */

 for(const x of makePool(rankings,"makiSashi")){

  if(result.makiSashi.length>=4)break;

  if(used.has(x.key))continue;

  result.makiSashi.push(x);

  used.add(x.key);

 }

 /* -----------------------------

    穴

 ----------------------------- */

 const under=[];

 rankings.slice(1).forEach(target=>{

  const boat=target.boat;

  const reasons=[

   boatHasStrongMotor(boat),

   boatHasGoodHistory(boat),

   boatHasAttack(boat,overview)

  ].filter(Boolean).length;

  if(!reasons)return;

  if(

   getRank(rankings,boat)>=5 &&

   reasons<2

  )return;

  for(const second of rankings){

   if(second.boat===boat)continue;

   const x=makeCandidate(

    boat,

    second.boat,

    rankings,

    dominantType(overview)

   );

   if(x){

    x.raw+=15;

    under.push(x);

   }

  }

 });

 under.sort((a,b)=>b.raw-a.raw);

 for(const x of under){

  if(result.under.length>=3)break;

  if(used.has(x.key))continue;

  result.under.push(x);

  used.add(x.key);

 }

 /* -----------------------------

    確率

 ----------------------------- */

 const all=[

  ...result.hit,

  ...result.escape,

  ...result.sashi,

  ...result.maki,

  ...result.makiSashi,

  ...result.under

 ];

 const totalRaw=

  all.reduce((s,x)=>s+x.raw,0);

 if(totalRaw>0){

  all.forEach(x=>{

   x.probability=

    x.raw/totalRaw*100;

  });

 }

 result.total=

  all.reduce(

   (s,x)=>s+(x.probability||0),

   0

  );

 return result;

}

/* =====================================================

   星

===================================================== */

function getStarCount(){

 const budget=getBudget();

 if(budget<=500)return 1;

 if(budget<=1000)return 2;

 if(budget<=2000)return 3;

 if(budget<=3000)return 4;

 if(budget<=5000)return 6;

 if(budget<=10000)return 8;

 if(budget<=20000)return 10;

 return 12;

}

function getStarKeys(bets){

 const all=[];

 Object.values(bets).forEach(list=>{

  if(!Array.isArray(list))return;

  list.forEach(item=>{

   if(item.key){

    all.push(item);

   }

  });

 });

 all.sort(

  (a,b)=>

   (b.probability||0)-

   (a.probability||0)

 );

 return new Set(

  all

  .slice(0,getStarCount())

  .map(x=>x.key)

 );

}

function renderPicks(id,list,bets){

 const el=document.getElementById(id);

 if(!list||!list.length){

  el.innerHTML=

   `<div class="noPick">該当買い目なし</div>`;

  return;

 }

 const stars=getStarKeys(bets);

 el.innerHTML=list.map(x=>{

  const p=x.probability||0;

  let cls="";

  if(p>=7)cls="veryStrong";

  else if(p>=6)cls="strong";

  else if(p<=5.2)cls="weak";

  return`

  <div class="pick ${cls}">

   <div class="pickLeft">

    <span class="star">

     ${stars.has(x.key)?"⭐":""}

    </span>

    <strong>

     ${x.a} → ${x.b}

    </strong>

   </div>

   <span class="prob">

    ${p.toFixed(1)}%

   </span>

  </div>`;

 }).join("");

}

function renderBets(bets){

 document.getElementById("displayBudget").textContent=

  formatYen(getBudget());

 renderPicks("hitPicks",bets.hit,bets);

 renderPicks("escapePicks",bets.escape,bets);

 renderPicks("sashiPicks",bets.sashi,bets);

 renderPicks("makiPicks",bets.maki,bets);

 renderPicks("makiSashiPicks",bets.makiSashi,bets);

 renderPicks("underPicks",bets.under,bets);

 document.getElementById("totalProbability").textContent=

  (bets.total||0).toFixed(1)+"%";

}

function createForecast(rankings,overview){

 const top=rankings[0];

 const second=rankings[1];

 const third=rankings[2];

 const dominant=dominantType(overview);

 let escapeText="";

 if(

  dominant==="escape" &&

  getCourse(1)===1

 ){

  escapeText=

   "イン逃げ中心。買い目から1号艇を外しません。";

 }else if(overview.escape>=50){

  escapeText=

   "イン逃げ警戒。1号艇を買い目に残します。";

 }else{

  escapeText=

   "イン逃げだけに依存せず、展開を広げます。";

 }

 return`

 <div class="strategy">

  <strong>🔥 本命</strong><br>

  ${top.boat}号艇 ${esc(top.racer?.name||"-")}

  <br><br>

  <strong>🥈 対抗</strong><br>

  ${second.boat}号艇 ${esc(second.racer?.name||"-")}

  <br><br>

  <strong>🎯 単穴</strong><br>

  ${third.boat}号艇 ${esc(third.racer?.name||"-")}

  <br><br>

  <strong>🔥 このレースの攻め手</strong><br>

  ${typeName(dominant)}<br>

  ${escapeText}

  <br><br>

  <strong>📊 全体見通し</strong><br>

  イン逃げ ${overview.escape.toFixed(1)}%<br>

  差し ${overview.sashi.toFixed(1)}%<br>

  まくり ${overview.maki.toFixed(1)}%<br>

  まくり差し ${overview.makiSashi.toFixed(1)}%

  <br><br>

  <strong>今回の進入</strong><br>

  ${[1,2,3,4,5,6].map(

   b=>`${b}号艇=${getCourse(b)}コース`

  ).join(" / ")}

  <br><br>

  <strong style="color:#d4af37">

   ★ 全体見通しと買い目を連動

  </strong><br>

  「イン逃げ中心」と判定した場合は、

  1号艇1着のイン逃げ買い目を優先生成します。

 </div>`;

}

async function runAnalysis(){

 if(racers.length!==6){

  alert("先に出走表を取得してください");

  return;

 }

 const message=document.getElementById("message");

 message.innerHTML=

 `<span class="loading">🤖 AI解析中...</span>`;

 try{

  for(let boat=1;boat<=6;boat++){

   manualCourses[boat]=Number(

    document.getElementById("course"+boat).value

   );

  }

  if(!Object.keys(historyData).length){

   await loadHistory();

  }

  renderRace();

  const overview=calculateOverview();

  const rankings=makeRanking();

  renderRanking(rankings);

  renderOverview(overview);

  renderAttack(overview);

  renderExclusions(rankings);

  document.getElementById("forecast").innerHTML=

   createForecast(rankings,overview);

  const bets=buildBets(rankings);

  currentBets=bets;

  renderBets(bets);

  document.getElementById("analysisCard").style.display="block";

  document.getElementById("predictionCard").style.display="block";

  message.innerHTML=

  `<span class="success">

   ✅ AI解析完了<br>

   🔥 中心展開：

   ${typeName(dominantType(overview))}<br>

   📊 イン逃げ：

   ${overview.escape.toFixed(1)}%<br>

   🎯 買い目と全体見通しを連動<br>

   🛥️ 進入反映済み<br>

   ⚙️ モーター・ST・展示反映済み

  </span>`;

 }catch(error){

  console.error(error);

  message.innerHTML=

  `<span class="error">

   ❌ AI解析失敗<br>

   ${esc(error.message)}

  </span>`;

 }

}
