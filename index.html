<style>

*{box-sizing:border-box}

body{

.ace{

.pickBox{

.highlight{

.tech{

}

}

.method{

}

.method strong{

.resultBox{

}

.rateRow{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px

}

.rate{

  background:#181818;

  border:1px solid #292929;

@media(max-width:600px){

<script>

const API="https://boatraceopenapi.github.io/api/v1";

let raceData=null;

let racers=[];

let previewRacers={};

let resultData=null;

/* =========================

基本

========================= */

function num(v){

if(v===null||v===undefined||v==="")return 0;

const n=parseFloat(

String(v)

.replace("%","")

.replace("秒","")

.replace(",","")

);

return Number.isFinite(n)?n:0;

}

function esc(v){

return String(v??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;");

}

/* =========================

JSON

========================= */

async function fetchJSON(url){

const response=await fetch(

url,

{cache:"no-store"}

);

if(!response.ok)

throw new Error("HTTP "+response.status);

return await response.json();

}

/* =========================

日付

========================= */

function getTodayJST(){

const now=new Date();

const parts=new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(now);

const y=parts.find(x=>x.type==="year").value;

const m=parts.find(x=>x.type==="month").value;

const d=parts.find(x=>x.type==="day").value;

return `${y}${m}${d}`;

}

/* =========================

レース検索

========================= */

function findSelectedRace(data,venue,race){

if(!data)return null;

const s=String(venue).replace(/^0/,"");

const r=String(race);

return data

?.programs

?.stadiums

?.[s]

?.races

?.[r] || null;

}

/* =========================

出走表

========================= */

async function loadRaceData(){

const venue=document.getElementById("venue").value;

const race=document.getElementById("race").value;

const message=document.getElementById("message");

message.innerHTML="⏳ 最新APIから出走表を取得中...";

try{

const date=getTodayJST();

const url=

`${API}/${date.slice(0,4)}/${date}.json`;

const data=await fetchJSON(url);

const selected=

findSelectedRace(

data,

venue,

race

);

if(!selected)

throw new Error("選択したレースのデータがありません。");

raceData=selected;

racers=Object.values(

selected.racers||{}

)

.sort(

(a,b)=>

num(a.entry_number)-num(b.entry_number)

);

if(!racers.length)

throw new Error("選手データがありません。");

previewRacers=

selected.preview?.racers||{};

resultData=

selected.result||null;

renderRace();

document.getElementById("raceCard").style.display="block";

message.innerHTML=

"✅ 出走表取得成功<br>"+

"API：最新 v1<br>"+

"日付："+date+"<br>"+

"選手数："+racers.length;

}catch(error){

console.error(error);

message.innerHTML=

"❌ 出走表取得失敗<br>"+

esc(error.message);

}

}

/* =========================

選手

========================= */

function boatNumber(r,index){

return num(r.entry_number)||index+1;

}

function rankName(r){

const map={

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

return map[num(r.rank_number)]||"-";

}

function previewForBoat(boat){

return previewRacers?.[String(boat)]||

previewRacers?.[boat]||

{};

}

function getCourse(r,boat){

const p=previewForBoat(boat);

return num(

p.course_number

);

}

function getST(r,boat){

return num(

previewForBoat(boat).start_timing

);

}

function getExhibition(r,boat){

return num(

previewForBoat(boat).exhibition_time

);

}

/* =========================

モーター

========================= */

function motorGrade(rate){

rate=num(rate);

if(rate>=70)

return{text:"🔥 エース",class:"ace",score:18};

if(rate>=60)

return{text:"⭐ すごく良い",class:"good",score:14};

if(rate>=50)

return{text:"◎ 良い",class:"good",score:10};

if(rate>=40)

return{text:"○ 普通",class:"normal",score:6};

if(rate>=35)

return{text:"△ 悪くない",class:"normal",score:3};

if(rate>30)

return{text:"△ やや弱い",class:"bad",score:-2};

return{text:"❌ だめ",class:"bad",score:-7};

}

/* =========================

決まり手

========================= */

const techniqueNames={

1:"逃げ",

2:"差し",

3:"まくり",

4:"まくり差し",

5:"抜き",

6:"恵まれ"

};

function techniqueName(n){

return techniqueNames[String(n)]||"不明";

}

/* =========================

結果表示

========================= */

function renderResult(){

const area=document.getElementById("resultArea");

if(!resultData){

area.innerHTML=`

<div class="resultBox">

<div class="resultTitle">📊 決まり手情報</div>

<div class="small">

このレースの結果データは取得できません。

</div>

</div>`;

return;

}

const resultRacers=

resultData.racers||{};

const order=

Object.values(resultRacers)

.sort(

(a,b)=>

num(a.place_number)-num(b.place_number)

);

const first=order[0];

const technique=

num(resultData.technique_number);

area.innerHTML=`

<div class="resultBox">

<div class="resultTitle">

📊 結果・決まり手

</div>

<div class="small">

1着：

<strong>

${first?.entry_number||"-"}号艇

${esc(first?.name||"")}

</strong>

<br>

決まり手：

<strong style="color:#d4af37">

${technique?techniqueName(technique):"データなし"}

</strong>

<br><br>

着順：

${order.map(

x=>

`${x.place_number}着 ${x.entry_number}号艇`

).join(" ／ ")}

</div>

</div>

`;

}

/* =========================

コース別決まり手集計

========================= */

/*

重要：

ここでは

「艇番」

ではなく

「実際の進入コース」

をキーにする。

今回のレース結果だけではなく、

APIから取得できる履歴データが存在する場合に

同じ形式で集計できるようにしている。

*/

function createEmptyCourseStats(){

const stats={};

for(let c=1;c<=6;c++){

stats[c]={

starts:0,

wins:0,

escape:0,

sashi:0,

makuri:0,

makurisashi:0,

nuki:0,

megumare:0

};

}

return stats;

}

/* =========================

履歴データを解析

========================= */

function analyzeHistory(history){

const stats=createEmptyCourseStats();

if(!Array.isArray(history))

return stats;

history.forEach(race=>{

const result=race?.result;

if(!result)return;

const rr=result.racers||{};

Object.values(rr).forEach(x=>{

/*

実際の進入コースを探す。

*/

const course=

num(

x.course_number ??

x.entry_course ??

x.start_course ??

x.actual_course

);

if(course<1||course>6)

return;

stats[course].starts++;

if(num(x.place_number)===1){

stats[course].wins++;

const technique=

num(

result.technique_number ??

result.technique

);

if(technique===1)

stats[course].escape++;

else if(technique===2)

stats[course].sashi++;

else if(technique===3)

stats[course].makuri++;

else if(technique===4)

stats[course].makurisashi++;

else if(technique===5)

stats[course].nuki++;

else if(technique===6)

stats[course].megumare++;

}

});

});

return stats;

}

/* =========================

率

========================= */

function rate(a,b){

if(!b)return 0;

return a/b*100;

}

/* =========================

選手カード

========================= */

function renderRace(){

const box=document.getElementById("racers");

box.innerHTML="";

racers.forEach((r,i)=>{

const boat=boatNumber(r,i);

const p=previewForBoat(boat);

const motor=num(r.motor_top_2_percent);

const grade=motorGrade(motor);

const course=getCourse(r,boat);

const st=getST(r,boat);

const exhibition=getExhibition(r,boat);

box.innerHTML+=`

<div class="racer">

<div class="racerTop">

<div class="number n${boat}">

${boat}

</div>

<div class="racerName">

${esc(r.name)}

</div>

</div>

<div class="small">

級別：${rankName(r)}<br>

登録番号：${r.number||"-"}<br>

年齢：${r.age||"-"}歳<br>

全国勝率：${num(r.national_win_rate).toFixed(2)}<br>

全国2連対率：${num(r.national_top_2_percent).toFixed(1)}%<br>

当地勝率：${num(r.local_win_rate).toFixed(2)}<br>

当地2連対率：${num(r.local_top_2_percent).toFixed(1)}%

</div>

<div style="margin-top:7px">

<span class="badge ${grade.class}">

${motor

?motor.toFixed(1)+"% "+grade.text

:"モーター情報なし"}

</span>

</div>

<div class="techGrid">

<div class="tech">

<span>モーター</span>

${r.motor_number||"-"}

</div>

<div class="tech">

<span>進入</span>

${course?course+"コース":"-"}

</div>

<div class="tech">

<span>平均ST</span>

${num(r.average_start_timing)

?num(r.average_start_timing).toFixed(2)

:"-"}

</div>

<div class="tech">

<span>直前ST</span>

${st?st.toFixed(2):"-"}

</div>

<div class="tech">

<span>展示</span>

${exhibition?exhibition.toFixed(2):"-"}

</div>

<div class="tech">

<span>ボート2連</span>

${num(r.boat_top_2_percent)

?num(r.boat_top_2_percent).toFixed(1)+"%"

:"-"}

</div>

</div>

</div>

`;

});

renderRaceInfo();

renderResult();

renderCourseStats();

}

/* =========================

レース情報

========================= */

function renderRaceInfo(){

const el=document.getElementById("raceInfo");

const p=raceData?.preview||{};

el.innerHTML=`

<div class="infoGrid">

<div class="infoBox">

<span>開催日</span>

${raceData.date||"-"}

</div>

<div class="infoBox">

<span>レース</span>

${raceData.race_number||"-"}R

</div>

<div class="infoBox">

<span>距離</span>

${raceData.distance||"-"}m

</div>

<div class="infoBox">

<span>風速</span>

${p.wind_speed??"-"}m

</div>

<div class="infoBox">

<span>波高</span>

${p.wave_height??"-"}cm

</div>

<div class="infoBox">

<span>気温</span>

${p.air_temperature??"-"}℃ 

</div>

</div>

`;

}

/* =========================

現在レースの進入実績表示

========================= */

function renderCourseStats(){

const area=document.getElementById("resultArea");

if(!resultData)return;

const rr=resultData.racers||{};

let html=`

<div class="resultBox">

<div class="resultTitle">

📈 今回の進入コース・決まり手

</div>

<div class="small">

※艇番ではなく、取得できた実際の進入コースを基準に表示します。

</div>

`;

racers.forEach((r,i)=>{

const boat=boatNumber(r,i);

const result=

Object.values(rr).find(

/* =========================

AIスコア

========================= */

function calcScore(r,index){

const boat=boatNumber(r,index);

const course=getCourse(r,boat);

const national=num(r.national_win_rate);

const local=num(r.local_win_rate);

const motor=num(r.motor_top_2_percent);

const avgST=num(r.average_start_timing);

const st=getST(r,boat);

const exhibition=getExhibition(r,boat);

let score=0;

score+=national*6;

score+=local*3;

score+=motorGrade(motor).score;

if(avgST>0){

if(avgST<=0.12)score+=10;

else if(avgST<=0.15)score+=7;

else if(avgST<=0.18)score+=4;

else if(avgST<=0.22)score+=1;

else score-=3;

}

if(st>0){

if(st<=0.10)score+=7;

else if(st<=0.13)score+=5;

else if(st<=0.16)score+=3;

else if(st>=0.22)score-=3;

}

if(exhibition>0){

if(exhibition<=6.70)score+=8;

else if(exhibition<=6.80)score+=5;

else if(exhibition<=6.90)score+=2;

else if(exhibition>=7.10)score-=3;

}

const courseBonus={

1:12,

2:7,

3:6,

4:5,

5:2,

6:0

};

score+=courseBonus[course]||0;

const rank=rankName(r);

if(rank==="A1")score+=6;

else if(rank==="A2")score+=3;

else if(rank==="B2")score-=2;

return Math.round(score*100)/100;

}

/* =========================

ランキング

========================= */

function createRanking(){

return racers

.map((r,i)=>({

boat:boatNumber(r,i),

racer:r,

score:calcScore(r,i)

}))

.sort((a,b)=>b.score-a.score);

}

function insideRate(){

const first=

racers.find(

(r,i)=>boatNumber(r,i)===1

);

if(!first)return 50;

let rate=

num(first.national_top_2_percent);

const local=

num(first.local_top_2_percent);

if(local>0)

rate=(rate+local)/2;

return Math.min(90,Math.max(25,rate||50));

}

/* =========================

買い目

========================= */

function combinationScore(a,b,c,ranking,inside){

const ra=ranking.find(x=>x.boat===a);

const rb=ranking.find(x=>x.boat===b);

const rc=ranking.find(x=>x.boat===c);

if(!ra||!rb||!rc)return 0;

let score=

ra.score*1.35+

rb.score+

rc.score*.75;

if(a===1){

if(inside>=55)score+=12;

else if(inside>=50)score+=5;

else score-=10;

}

if(b===1||c===1)

score+=inside<50?2:5;

const st=getST(ra.racer,a);

if(st>0)

score+=Math.max(0,(0.25-st)*10);

return Math.max(.1,score);

}

function makePool(ranking,inside){

const candidates=

ranking.slice(0,6).map(x=>x.boat);

const pool=[];

for(const a of candidates)

for(const b of candidates){

if(a===b)continue;

for(const c of candidates){

if(a===c||b===c)continue;

pool.push({

key:`${a}-${b}-${c}`,

a,b,c,

raw:combinationScore(

a,b,c,

ranking,

inside

)

});

}

}

return pool.sort((a,b)=>b.raw-a.raw);

}

function probabilities(picks){

if(!picks.length)return[];

const total=

picks.reduce((s,x)=>s+x.raw,0);

return picks.map(x=>({

...x,

probability:x.raw/total*100

}));

}

/* =========================

重複防止

========================= */

function uniqueByKey(picks,used){

return picks.filter(

x=>!used.has(x.key)

);

}

/* =========================

的中重視

========================= */

function hitPicks(ranking,inside,used){

const pool=makePool(ranking,inside);

let result;

if(inside>=55){

result=

pool

.filter(x=>x.a===1)

.slice(0,6);

}else if(inside>=50){

result=[

...pool.filter(x=>x.a===1).slice(0,3),

...pool.filter(x=>x.a!==1).slice(0,3)

];

}else{

result=

pool

.filter(x=>x.a!==1)

.slice(0,6);

}

result=uniqueByKey(result,used);

result.forEach(x=>used.add(x.key));

return probabilities(result);

}

/* =========================

回収重視

========================= */

function recoveryPicks(ranking,inside,used){

const pool=makePool(ranking,inside);

const heads=

ranking

.slice(0,4)

.map(x=>x.boat);

let result=[];

for(const head of heads){

result.push(

...pool

.filter(x=>x.a===head)

.slice(0,6)

);

}

const map=new Map();

result.forEach(x=>{

if(!map.has(x.key))

map.set(x.key,x);

});

result=[...map.values()]

.sort((a,b)=>b.raw-a.raw);

result=uniqueByKey(result,used).slice(0,8);

result.forEach(x=>used.add(x.key));

return probabilities(result);

}

/* =========================

大穴

========================= */

function underPicks(ranking,inside,used){

const pool=makePool(ranking,inside);

const outsiders=

ranking.slice(3,6).map(x=>x.boat);

let result=

pool

.filter(

x=>

outsiders.includes(x.a)||

outsiders.includes(x.b)||

outsiders.includes(x.c)

)

.sort((a,b)=>b.raw-a.raw);

result=uniqueByKey(result,used).slice(0,6);

result.forEach(x=>used.add(x.key));

return probabilities(result);

}
