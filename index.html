<script>

"use strict";

/* =====================================================

   API

===================================================== */

const API_URLS=[

 "https://boatraceopenapi.github.io/api/v1/today.json",

 "https://boatraceopenapi.github.io/programs/v3/today.json",

 "https://boatraceopenapi.github.io/programs/v2/today.json"

];

let raceData=null;

let selectedEntry=[];

/* =====================================================

   共通

===================================================== */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function format(v){

 if(v===null||v===undefined||v==="")return "-";

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(2):String(v);

}

function escapeHtml(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(obj,keys){

 if(!obj)return null;

 for(const key of keys){

  if(

   obj[key]!==undefined&&

   obj[key]!==null&&

   obj[key]!==""

  ){

   return obj[key];

  }

 }

 return null;

}

function getRank(v){

 return {

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

/* =====================================================

   API取得

===================================================== */

async function fetchJson(url){

 const response=await fetch(

  url+"?t="+Date.now(),

  {

   method:"GET",

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

/* =====================================================

   レース検索

===================================================== */

function findRace(

 data,

 stadiumNumber,

 raceNumber

){

 if(!data)return null;

 /*

   現行 v1

   programs

    └ stadiums

       └ 1

          └ races

             └ 1

 */

 if(

  data.programs&&

  data.programs.stadiums

 ){

  const stadium=

   data.programs.stadiums[

    String(stadiumNumber)

   ];

  if(

   stadium&&

   stadium.races

  ){

   const race=

    stadium.races[

     String(raceNumber)

    ];

   if(race)return race;

  }

 }

 /*

   念のため再帰検索

 */

 let found=null;

 function walk(obj){

  if(found)return;

  if(

   !obj||

   typeof obj!=="object"

  ){

   return;

  }

  if(

   num(obj.stadium_number)===stadiumNumber&&

   num(obj.race_number)===raceNumber&&

   (

    obj.racers||

    obj.players

   )

  ){

   found=obj;

   return;

  }

  for(const key of Object.keys(obj)){

   walk(obj[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* =====================================================

   選手取得

===================================================== */

function getRacers(race){

 if(!race)return[];

 const source=

  race.racers||

  race.players||

  race.entries||

  null;

 if(!source)return[];

 let racers=[];

 if(Array.isArray(source)){

  racers=source;

 }else if(

  typeof source==="object"

 ){

  racers=Object.values(source);

 }

 return racers

 .filter(Boolean)

 .sort(

  (a,b)=>

   getBoatNumber(a)-

   getBoatNumber(b)

 );

}

function getPreviewRacer(

 race,

 boat

){

 const source=

  race?.preview?.racers;

 if(!source)return null;

 if(Array.isArray(source)){

  return source.find(

   x=>getBoatNumber(x)===boat

  )||null;

 }

 if(typeof source==="object"){

  return source[String(boat)]||

   Object.values(source).find(

    x=>getBoatNumber(x)===boat

   )||

   null;

 }

 return null;

}

/* =====================================================

   選手データ

===================================================== */

function getBoatNumber(r){

 return num(

  r.entry_number??

  r.boat_number??

  r.number

 );

}

function getName(r){

 return r.name||

  r.racer_name||

  r.player_name||

  "選手名不明";

}

function getOneLapTime(r){

 return num(

  firstValue(

   r,

   [

    "one_lap_time",

    "one_lap",

    "lap_time",

    "first_lap_time",

    "first_lap",

    "turn_time",

    "one_round_time",

    "one_round",

    "one_lap_time_sec",

    "one_round_time_sec"

   ]

  )

 );

}

function getStartTiming(r){

 return num(

  firstValue(

   r,

   [

    "start_timing",

    "st",

    "average_start_timing",

    "start"

   ]

  )

 );

}

function getCourseST(

 r,

 course

){

 const keys=[

  `course${course}_start_timing`,

  `course_${course}_start_timing`,

  `course${course}_st`,

  `course_${course}_st`,

  `st_course${course}`,

  `st_course_${course}`

 ];

 for(const key of keys){

  if(

   r[key]!==undefined&&

   r[key]!==null&&

   r[key]!==""

  ){

   return num(r[key]);

  }

 }

 return 0;

}

function getCourse(r){

 return num(

  firstValue(

   r,

   [

    "course_number",

    "course",

    "entry_course"

   ]

  )

 );

}

/* =====================================================

   決まり手・攻め傾向

===================================================== */

function getStyle(r){

 return String(

  firstValue(

   r,

   [

    "winning_technique",

    "decision_technique",

    "technique",

    "kimarite"

   ]

  )||""

 ).toLowerCase();

}

function attackStyleScore(

 r,

 type

){

 const t=getStyle(r);

 if(type==="まくり"){

  return(

   t.includes("まくり")||

   t.includes("捲り")

  )?10:0;

 }

 if(type==="差し"){

  return(

   t.includes("差し")||

   t==="差"

  )?9:0;

 }

 if(type==="まくり差し"){

  return(

   t.includes("まくり差し")||

   t.includes("捲り差し")

  )?10:0;

 }

 return 0;

}

/* =====================================================

   出走表表示

===================================================== */

function displayRace(race){

 const box=

  document.getElementById("boats");

 const racers=

  getRacers(race);

 if(racers.length<6){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 6艇の選手データを取得できませんでした。

  <br><br>

  取得数：

  <strong>${racers.length}艇</strong>

  </div>`;

  return false;

 }

 box.innerHTML="";

 racers.forEach(r=>{

  const boat=

   getBoatNumber(r);

  const preview=

   getPreviewRacer(

    race,

    boat

   );

  const d=

   document.createElement("div");

  d.className="boat";

  d.innerHTML=`

  <div class="boat-number">

   ${boat}

  </div>

  <div class="boat-name">

   ${escapeHtml(

    getName(r)

   )}

  </div>

  <div class="boat-class">

   ${getRank(

    r.rank_number

   )}

  </div>

  <div class="metric">

   全国 ${format(

    r.national_win_rate

   )}

  </div>

  <div class="metric">

   当地 ${format(

    r.local_win_rate

   )}

  </div>

  <div class="metric">

   M${r.motor_number||"-"}

  </div>

  <div class="metric">

   M2連 ${format(

    r.motor_top_2_percent

   )}%

  </div>

  <div class="metric">

   M3連 ${format(

    r.motor_top_3_percent

   )}%

  </div>

  <div class="metric">

   ST ${

    preview

    ?

    format(

     preview.start_timing

    )

    :

    format(

     r.average_start_timing

    )

   }

  </div>

  <div class="metric gold">

   展示 ${

    preview&&

    num(preview.exhibition_time)>0

    ?

    format(

     preview.exhibition_time

    )+"秒"

    :

    "-"

   }

  </div>

  `;

  box.appendChild(d);

 });

 return true;

}

/* =====================================================

   直前情報

===================================================== */

function displayPreview(race){

 const box=

  document.getElementById(

   "previewInfo"

  );

 const p=race.preview;

 if(!p){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 現在、直前情報は取得できません。

  </div>`;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

 <div class="info-item">

  <div class="info-label">

   風速

  </div>

  <div class="info-value">

   ${p.wind_speed??"-"}m

  </div>

 </div>

 <div class="info-item">

  <div class="info-label">

   風向

  </div>

  <div class="info-value">

   ${getWindDirectionName(p)}

  </div>

 </div>

 <div class="info-item">

  <div class="info-label">

   波高

  </div>

  <div class="info-value">

   ${p.wave_height??"-"}cm

  </div>

 </div>

 <div class="info-item">

  <div class="info-label">

   気温

  </div>

  <div class="info-value">

   ${p.air_temperature??"-"}℃

  </div>

 </div>

 <div class="info-item">

  <div class="info-label">

   水温

  </div>

  <div class="info-value">

   ${p.water_temperature??"-"}℃

  </div>

 </div>

 </div>

 <div class="note">

  直前選手データ：

  ${

   p.racers

   ?"取得済み"

   :"未取得"

  }

 </div>

 `;

}

/* =====================================================

   風向

===================================================== */

function getWindDirectionName(p){

 const value=

  firstValue(

   p,

   [

    "wind_direction",

    "wind_dir",

    "wind_name"

   ]

  );

 if(value){

  return String(value);

 }

 const n=

  num(

   p.wind_direction_number

  );

 const map={

  1:"北",

  2:"北東",

  3:"東",

  4:"南東",

  5:"南",

  6:"南西",

  7:"西",

  8:"北西"

 };

 return map[n]||"-";

}

/*

  風向番号だけの場合、

  会場ごとの水面方向を厳密に断定しない。

  文字情報がある場合はそれを優先。

*/

function getWindInfo(){

 const p=raceData?.preview;

 if(!p){

  return{

   speed:0,

   direction:"",

   head:false,

   tail:false

  };

 }

 const speed=

  num(p.wind_speed);

 const direction=

  String(

   firstValue(

    p,

    [

     "wind_direction",

     "wind_dir",

     "wind_name"

    ]

   )||""

  );

 const d=

  direction.toLowerCase();

 const head=

  d.includes("向かい")||

  d.includes("向い")||

  d.includes("向");

 const tail=

  d.includes("追い")||

  d.includes("追");

 return{

  speed,

  direction,

  head,

  tail

 };

}

/* =====================================================

   一周・展示情報

===================================================== */

function displayLapTable(race){

 const box=

  document.getElementById(

   "lapInfo"

  );

 const racers=

  getRacers(race);

 let rows=[];

 racers.forEach(r=>{

  const p=

   getPreviewRacer(

  });

 });

 const exhibition=

/* =====================================================

   能力評価

===================================================== */

function abilityScore(

 r,

 course

){

 let score=0;

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const motor2=

  num(r.motor_top_2_percent);

 const motor3=

  num(r.motor_top_3_percent);

 const st=

  getStartTiming(r);

 const rank=

  num(r.rank_number);

 score+=national*6;

 score+=local*3;

 score+=motor2*.22;

 score+=motor3*.08;

 if(st>0){

  score+=

   Math.max(

    0,

    .30-st

   )*20;

 }

 const preview=

  getPreviewRacer(

   raceData,

   getBoatNumber(r)

  );

 if(preview){

  const ex=

   num(

    preview.exhibition_time

   );

  const all=

   getRacers(raceData)

   .map(x=>{

    const p=

     getPreviewRacer(

      raceData,

      getBoatNumber(x)

     );

    return p?

     num(p.exhibition_time):0;

   })

   .filter(x=>x>0);

  if(

   ex>0&&

   all.length

  ){

   const best=

    Math.min(...all);

   score+=

    Math.max(

     0,

     5-(ex-best)*20

    );

  }

 }

 const courseBonus={

  1:10,

  2:5,

  3:4,

  4:3,

  5:1,

  6:0

 };

 score+=

  courseBonus[course]||0;

 if(rank===1)

  score+=4;

 if(rank===2)

  score+=2;

 if(rank===4)

  score-=2;

 return score;

}

/* =====================================================

   攻め手

===================================================== */

function getAttackCandidates(){

 const racers=

  getRacers(raceData);

 return racers

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   selectedEntry.indexOf(

    boat

   )+1;

  const preview=

   getPreviewRacer(

    raceData,

    boat

   );

  const st=

   preview?

   num(preview.start_timing):

   getStartTiming(r);

  const motor2=

   num(r.motor_top_2_percent);

  const motor3=

   num(r.motor_top_3_percent);

  let attack=0;

  let style="";

  if(st>0){

   attack+=

    Math.max(

     0,

     .20-st

    )*45;

  }

  attack+=

   Math.max(

    0,

    motor2-30

   )*.12;

  attack+=

   Math.max(

    0,

    motor3-50

   )*.04;

  attack+=

   attackStyleScore(

    r,

    "まくり"

   );

  attack+=

   attackStyleScore(

    r,

    "差し"

   );

  attack+=

   attackStyleScore(

    r,

    "まくり差し"

   );

  if(course===2)

   attack+=2;

  if(course>=4)

   attack+=3;

  if(

   attackStyleScore(

    r,

    "まくり差し"

   )>0

  ){

   style="まくり差し";

  }else if(

   attackStyleScore(

    r,

    "まくり"

   )>0

  ){

   style="まくり";

  }else if(

   attackStyleScore(

    r,

    "差し"

   )>0

  ){

   style="差し";

  }else if(course>=4){

   style="まくり";

  }else{

   style="差し";

  }

  return{

   boat,

   course,

   racer:r,

   attack,

   style,

   st

  };

 })

 .sort(

  (a,b)=>

   b.attack-a.attack

 );

}

/* =====================================================

   イン逃げ期待度

===================================================== */

function calculateRaceTrend(){

 const first=

  selectedEntry[0];

 const one=

  getRacers(raceData)

  .find(

   r=>

    getBoatNumber(r)===first

  );

 if(!one){

  return{

   inside:50,

   outside:50

  };

 }

 const course=

  selectedEntry.indexOf(

   first

  )+1;

 let inside=

  course===1

  ?55

  :35;

 const national=

  num(

   one.national_win_rate

  );

 const local=

  num(

   one.local_win_rate

  );

 const motor2=

  num(

   one.motor_top_2_percent

  );

 const st=

  getStartTiming(one);

 if(national>=6.5)

  inside+=5;

 if(national<5.5)

  inside-=5;

 if(local>=6.5)

  inside+=4;

 if(local<5.5)

  inside-=4;

 if(motor2>=40)

  inside+=5;

 if(motor2<30)

  inside-=5;

 if(st>0){

  if(st<=.15)

   inside+=6;

  if(st>=.20)

   inside-=7;

 }

 const attacks=

  getAttackCandidates();

 const strongest=

  attacks.find(

   x=>x.course>=2

  );

 if(

  strongest&&

  strongest.attack>=16

 ){

  inside-=10;

 }

 const wind=

  getWindInfo();

 /*

   風速4m以上

   イン逃げを少し下げる

 */

 if(wind.speed>=4)

  inside-=4;

 /*

   明確に「向かい風」と取得できた場合

 */

 if(wind.head){

  inside-=4;

 }

 /*

   明確に「追い風」と取得できた場合

 */

 if(wind.tail){

  inside+=4;

 }

 inside=

  Math.max(

   5,

   Math.min(

    95,

    Math.round(

     inside

    )

   )

  );

 return{

  inside,

  outside:100-inside

 };

}

/* =====================================================

   展開

===================================================== */

function determineDevelopment(){

 const trend=

  calculateRaceTrend();

 const attacks=

  getAttackCandidates();

 const strongest=

  attacks.find(

   x=>x.course>=2

  );

 const inside=

  selectedEntry[0];

 if(

  inside===1&&

  trend.inside>=70

 ){

  return{

   type:"イン逃げ",

   attacker:1,

   attackerCourse:1,

   score:trend.inside,

   reason:

    "1号艇のイン逃げを中心に評価"

  };

 }

 if(!strongest){

  return{

   type:"イン逃げ",

   attacker:inside,

   attackerCourse:

    selectedEntry.indexOf(

     inside

    )+1,

   score:trend.inside,

   reason:

    "明確な攻め手が見つからないためイン中心"

  };

 }

 let type=

  strongest.style;

 if(

  strongest.course<=3&&

  strongest.attack<14

 ){

  type="差し";

 }

 return{

  type,

  attacker:strongest.boat,

  attackerCourse:strongest.course,

  score:Math.max(

   55,

   trend.outside

  ),

  reason:

   `${strongest.boat}号艇の${type}を攻め手として評価`

 };

}

function buildRanking(dev){

 const wind=

  getWindInfo();

 return getRacers(raceData)

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   selectedEntry.indexOf(

    boat

   )+1;

  let score=

   abilityScore(

    r,

    course

   );

  /*

    強い向かい風

    456プラス

    123マイナス

  */

  if(

   wind.speed>=4&&

   wind.head

  ){

   if(course>=4)

    score+=3;

   if(course<=3)

    score-=2;

  }

  /*

    強い追い風

    123プラス

  */

  if(

   wind.speed>=4&&

   wind.tail

  ){

   if(course<=3)

    score+=3;

   if(course>=4)

    score-=1;

  }

  /*

    展開補正

  */

  if(

   dev.type==="イン逃げ"

  ){

   if(

    boat===selectedEntry[0]

   )

    score+=8;

   if(course===2)

    score+=4;

   if(course===3)

    score+=3;

  }else{

   if(

    boat===dev.attacker

   )

    score+=10;

   if(

    course>=4

   )

    score+=1;

  }

  return{

   number:boat,

   name:getName(r),

   racer:r,

   course,

   score

  };

 })

 .sort(

  (a,b)=>

   b.score-a.score

 );

}

/* =====================================================

   攻め後の展開

===================================================== */

function getAfterAttackCandidates(

 dev,

 ranking

){

 if(

  dev.type==="イン逃げ"

 )

  return[];

 return ranking

 .filter(

  x=>

   x.number!==dev.attacker

 )

 .map(x=>{

  const c=

   selectedEntry.indexOf(

    x.number

   )+1;

  let score=

   x.score;

  if(

   dev.type==="まくり"

  ){

   if(c>dev.attackerCourse)

    score+=10;

   if(

    c===dev.attackerCourse+1

   )

    score+=5;

  }

  if(

   dev.type==="差し"

  ){

   if(c===1)

    score+=9;

   if(c===3)

    score+=5;

  }

  if(

   dev.type==="まくり差し"

  ){

   if(c===1)

    score+=7;

   if(c>=4)

    score+=5;

  }

  return{

   ...x,

   afterScore:score

  };

 })

 .sort(

  (a,b)=>

   b.afterScore-a.afterScore

 )

 .slice(0,4);

}

/* =====================================================

   根拠

===================================================== */

function getReasons(

 combo,

 ranking,

 dev,

 trend

){

 const n=

  combo

  .split("-")

  .map(Number);

 const first=n[0];

 const second=n[1];

 const third=n[2];

 const reasons=[];

 const tags=[];

 const r1=

  ranking.find(

   x=>x.number===first

  );

 const r2=

  ranking.find(

   x=>x.number===second

  );

 const r3=

  ranking.find(

   x=>x.number===third

  );

 if(

  first===dev.attacker&&

  dev.type!=="イン逃げ"

 ){

  tags.push("🔥攻め手");

  reasons.push(

   `${first}号艇の${dev.type}を頭評価`

  );

 }

 if(

  dev.type==="イン逃げ"&&

  first===selectedEntry[0]

 ){

  tags.push("🏠イン逃げ");

  reasons.push(

   `イン逃げ期待度${trend.inside}%`

  );

 }

 if(

  r1&&

  r1.number===ranking[0]?.number

 ){

  tags.push("⭐AI評価1位");

  reasons.push(

   `${first}号艇はAI評価1位`

  );

 }

 if(

  r2&&

  r2.score>=ranking[1]?.score

 ){

  tags.push("⭐AI上位");

  reasons.push(

   `${second}号艇はAI評価上位`

  );

 }

 if(

  r3&&

  r3.score>=ranking[2]?.score

 ){

  tags.push("⭐AI上位");

  reasons.push(

   `${third}号艇はAI評価上位`

  );

 }

 if(

  dev.type!=="イン逃げ"&&

  second===dev.attacker

 ){

  tags.push("↪攻め後");

  reasons.push(

   `${dev.attacker}号艇が攻めた後の展開`

  );

 }

 const after=

  getAfterAttackCandidates(

   dev,

   ranking

  );

 if(

  after.some(

   x=>x.number===third

  )

 ){

  tags.push("🌊展開拾い");

  reasons.push(

   `${third}号艇が攻め後の展開を拾う`

  );

 }

 const racer3=

  r3?.racer;

 if(racer3){

  const m2=

   num(

    racer3.motor_top_2_percent

   );

  const st=

   getStartTiming(

    racer3

   );

  if(m2>=40){

   tags.push("⚙モーター");

   reasons.push(

    `${third}号艇はモーター2連率${format(m2)}%`

   );

  }

  if(

   st>0&&

   st<=.15

  ){

   tags.push("💨ST");

   reasons.push(

    `${third}号艇のST${format(st)}`

   );

  }

 }

 const wind=

  getWindInfo();

 if(

  wind.speed>=4&&

  wind.head

 ){

  const hasOutside=

   n.some(

    boat=>

     selectedEntry.indexOf(

      boat

     )+1>=4

   );

  if(hasOutside){

   tags.push("🌬️向かい風");

   reasons.push(

    "強い向かい風による外枠展開を評価"

   );

  }

 }

 if(

  wind.speed>=4&&

  wind.tail

 ){

  const hasInside=

   n.some(

    boat=>

     selectedEntry.indexOf(

      boat

     )+1<=3

   );

  if(hasInside){

   tags.push("🌬️追い風");

   reasons.push(

    "強い追い風による内枠有利を評価"

   );

  }

 }

 if(!reasons.length){

  reasons.push(

   "AI評価・コース・展開を総合評価"

  );

 }

 return{

  tags:[

   ...new Set(tags)

  ],

  text:[

   ...new Set(reasons)

  ].join("。")+"。"

 };

}

/* =====================================================

===================================================== */

function addPick(

 arr,

 combo,

 ranking,

 dev,

 trend

){

 if(

  !combo||

  combo.split("-").length!==3

 )

  return;

 const nums=

  combo

  .split("-")

  .map(Number);

 if(

  new Set(nums).size!==3

 )

  return;

 if(

  nums.some(

   x=>x<1||x>6

  )

 )

  return;

 if(

  arr.some(

   x=>x.combo===combo

  )

 )

  return;

 arr.push({

  combo,

  ...getReasons(

   combo,

   ranking,

   dev,

   trend

  )

 });

}

  addPick(

   arr,

   `${top[0]}-${attacker}-${inside}`,

   ranking,dev,trend

  );

  addPick(

   arr,

   `${top[0]}-${attacker}-${top[1]}`,

   ranking,dev,trend

  );

  addPick(

   arr,

   `${top[1]}-${attacker}-${top[0]}`,

   ranking,dev,trend

  );

  addPick(

   arr,

   `${top[1]}-${attacker}-${inside}`,

   ranking,dev,trend

  );

  /*

    攻め手頭も1〜2点残す

  */

  addPick(

   arr,

   `${attacker}-${top[0]}-${top[1]}`,

   ranking,dev,trend

  );

  addPick(

   arr,

   `${attacker}-${top[1]}-${top[0]}`,

   ranking,dev,trend

  );

  const after=

   getAfterAttackCandidates(

    dev,

    ranking

   );

  if(after[0]){

   addPick(

    arr,

    `${after[0].number}-${attacker}-${top[0]}`,

    ranking,dev,trend

   );

  }

 }

 const hitSet=

  new Set(

   hitPicks.map(

    x=>x.combo

   )

  );

 return arr

 .filter(

  x=>!hitSet.has(x.combo)

 )

 .slice(0,7);

}

/* =====================================================

   大穴

===================================================== */

function buildHoleCandidate(

 ranking,

 dev,

 trend

){

 /*

   AI評価1位・2位は

   大穴候補から除外

 */

 const candidates=

  ranking

  .slice(2)

  .map(x=>{

   const r=x.racer;

   const motor2=

    num(

     r.motor_top_2_percent

    );

   const motor3=

    num(

     r.motor_top_3_percent

    );

   const st=

    getStartTiming(r);

   const attack=

    getAttackCandidates()

    .find(

     a=>a.boat===x.number

    );

   const after=

    getAfterAttackCandidates(

     dev,

     ranking

    );

   let score=0;

   const reasons=[];

   if(motor2>=40){

    score+=3;

    reasons.push(

     "モーター2連率が高い"

    );

   }

   if(motor3>=60){

    score+=2;

    reasons.push(

     "モーター3連率が高い"

    );

   }

   if(

    st>0&&

    st<=.16

   ){

    score+=2;

    reasons.push(

     "STが良好"

    );

   }

   if(

    attack&&

    attack.attack>=14

   ){

    score+=3;

    reasons.push(

     "攻め手候補"

    );

   }

   if(

    after.some(

     y=>y.number===x.number

    )

   ){

    score+=3;

    reasons.push(

     "展開を拾える"

    );

   }

   return{

    ...x,

    holeScore:score,

    holeReasons:reasons

   };

  })

  .sort(

   (a,b)=>

    b.holeScore-a.holeScore

  );

 const best=

  candidates[0];

 /*

   根拠5点未満なら

   大穴は無理に出さない

 */

 if(

  !best||

  best.holeScore<5

 )

  return null;

 /*

   大穴頭

   → 攻め手

 */

 const headCandidates=

  getAttackCandidates()

  .filter(

   x=>x.boat!==best.number

  );

 const head=

  headCandidates[0]?.boat;

 if(!head)

  return null;

 /*

   2着

   → AI評価＋展開＋モーター＋ST

 */

 const secondCandidates=

  ranking

  .filter(

   x=>

    x.number!==head&&

    x.number!==best.number

  )

  .map(x=>{

   let score=

    x.score;

   const r=x.racer;

   const m2=

    num(

     r.motor_top_2_percent

    );

   const st=

    getStartTiming(r);

   if(m2>=40)

    score+=5;

   if(

    st>0&&

    st<=.16

   )

    score+=4;

   const after=

    getAfterAttackCandidates(

     dev,

     ranking

    );

   if(

    after.some(

     y=>y.number===x.number

    )

   )

    score+=7;

   return{

    ...x,

    secondScore:score

   };

  })

  .sort(

   (a,b)=>

    b.secondScore-

    a.secondScore

  );

 const second=

  secondCandidates[0];

 if(!second)

  return null;

 /*

   3着① AI評価から1艇

 */

 const aiThird=

  ranking.find(

   x=>

    x.number!==head&&

    x.number!==second.number

  );

 /*

   3着② 展開から1艇

 */

 const after=

  getAfterAttackCandidates(

   dev,

   ranking

  );

 const afterThird=

  after.find(

   x=>

    x.number!==head&&

    x.number!==second.number&&

    x.number!==aiThird?.number

  );

 if(

  !aiThird||

  !afterThird

 )

  return null;

 return{

  head,

  second:second.number,

  thirds:[

   aiThird.number,

   afterThird.number

  ],

  target:best.number,

  reasons:[

   ...best.holeReasons,

   `2着は${second.number}号艇をAI評価・展開から選択`,

   `3着AI候補は${aiThird.number}号艇`,

   `3着展開候補は${afterThird.number}号艇`

  ]

 };

}

function renderPickList(

 title,

 picks,

 unit,

 className

){

 let html=`

 <div class="pick-box">

 <div class="pick-title">

  ${title}

 </div>

 `;

 if(!picks.length){

  return html+

  `

  <div class="note">

   今回は該当買い目なし

  </div>

  </div>

  `;

 }

 picks.forEach(

  (p,i)=>{

   html+=`

   <div class="pick-item">

   <div class="pick-line ${className}">

    ${i+1}. ${p.combo}

    <span class="pick-money">

     ${unit}円

    </span>

   </div>

   <div class="pick-reason">

   ${p.tags.map(

    tag=>

     `<span class="reason-tag">

      ${escapeHtml(tag)}

     </span>`

   ).join("")}

   <br>

   ${escapeHtml(p.text)}

   </div>

   </div>

   `;

  }

 );

 html+=`

 </div>

 `;

 return html;

}
