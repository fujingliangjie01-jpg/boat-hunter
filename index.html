<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

header{background:linear-gradient(135deg,#080808,#211a07);border-bottom:1px solid #b8952e;padding:18px;text-align:center}

header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:3px}

header p{margin:5px 0 0;font-size:12px;color:#999}

.container{max-width:1000px;margin:auto;padding:14px}

.card{background:#111;border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:14px}

h2{margin:0 0 12px;font-size:17px;color:#d4af37}

h3{font-size:14px;color:#d4af37;margin:14px 0 8px}

label{font-size:11px;color:#aaa;display:block;margin-bottom:5px}

select,input{width:100%;background:#181818;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{width:100%;padding:13px;border:0;border-radius:9px;font-size:14px;font-weight:bold}

.mainBtn{margin-top:12px;background:linear-gradient(135deg,#d4af37,#8b6914);color:#000}

.subBtn{margin-top:8px;background:#222;border:1px solid #555;color:#fff}

.resetBtn{margin-top:8px;background:#171717;border:1px solid #777;color:#fff}

.topBtn{margin-top:14px;background:#171717;border:1px solid #b8952e;color:#d4af37}

.message{margin-top:10px;font-size:12px;line-height:1.6;color:#aaa}

.info{background:#151515;border:1px solid #333;border-radius:8px;padding:10px;font-size:11px;line-height:1.7;margin-bottom:10px}

.courseGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.courseBox{background:#171717;padding:8px;border-radius:8px;border:1px solid #333}

.racers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.racer{background:#171717;border:1px solid #333;border-radius:9px;padding:9px}

.racerTop{display:flex;align-items:center;gap:8px}

.number{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#000}

.n1{background:#fff}.n2{background:#222;color:#fff;border:1px solid #777}.n3{background:#e22;color:#fff}.n4{background:#248cff;color:#fff}.n5{background:#e5d000}.n6{background:#20a747;color:#fff}

.racerName{font-weight:bold}

.small{font-size:10px;color:#aaa;line-height:1.6;margin-top:6px}

.tech{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.tech div{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px;font-size:10px;text-align:center}

.tech span{display:block;color:#888;margin-bottom:2px}

.decisionStats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.decisionStat{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px 4px;font-size:10px;text-align:center}

.decisionStat span{display:block;color:#888;margin-bottom:2px}

.decisionStat strong{display:block;color:#d4af37;font-size:12px}

.history{margin-top:8px;background:#0d0d0d;border:1px solid #292929;border-radius:8px;padding:8px}

.historyTitle{color:#d4af37;font-weight:bold;font-size:11px;margin-bottom:6px}

.historyStats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}

.historyStat{background:#151515;border-radius:5px;padding:5px 2px;text-align:center;font-size:9px;color:#aaa}

.historyStat strong{display:block;font-size:12px;color:#d4af37;margin-top:2px}

.historyList{font-size:9px;color:#aaa;line-height:1.6;max-height:180px;overflow-y:auto}

.historyItem{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:3px 0}

.historyItem:last-child{border-bottom:0}

.historyGood{color:#4cd964;font-weight:bold}.historyBad{color:#777}.historyMiddle{color:#ffd84d;font-weight:bold}.historyDecision{color:#d4af37;font-weight:bold}

table{width:100%;border-collapse:collapse;font-size:11px}

th,td{padding:7px 3px;border-bottom:1px solid #292929;text-align:center}

th{color:#d4af37}

.strategy{background:#171717;border-left:3px solid #d4af37;padding:9px;font-size:11px;line-height:1.7;margin-top:8px}

.attackBox{background:#211a07;border:1px solid #8a6d1c;border-radius:9px;padding:10px;font-size:11px;line-height:1.8;margin-top:8px}

.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}

.attackSub{color:#aaa;margin-top:4px}

.exclusion{background:#241414;border-left:3px solid #e55;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.exclusionKeep{background:#171707;border-left:3px solid #d4af37;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.revivalBox{background:#211a07;border-left:3px solid #ffd84d;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.pickBox{background:#151515;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}

.betHeader{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;background:#0d0d0d;border:1px solid #292929;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px;color:#888;text-align:center}

.betRow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #292929}

.betRow:last-child{border-bottom:0}

.bet2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:bold}

.bet2Number{background:#211a07;border:1px solid #8a6d1c;border-radius:6px;padding:5px 8px;color:#ffd84d}

.betPercent{font-size:11px;color:#ffd84d;font-weight:bold}

.thirdCandidates{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}

.thirdCandidate{background:#101010;border:1px solid #333;border-radius:6px;padding:5px 6px;font-size:10px;color:#fff}

.thirdCandidate.normal{border-color:#555}

.thirdCandidate.revival{border-color:#d4af37;color:#ffd84d;background:#211a07}

.thirdCandidate.warning{border-color:#8a4b4b;color:#ff9b9b}

.revivalLabel{display:block;font-size:8px;color:#ffd84d;margin-top:2px}

.betNote{font-size:9px;color:#777;margin-top:5px;line-height:1.5}

.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px}

.pick:last-child{border-bottom:0}

.pickLeft{display:flex;align-items:center;gap:5px}

.star{width:18px;min-width:18px;color:#ffd84d;font-size:15px;font-weight:bold}

.prob{color:#ffd84d;font-weight:bold}

.pick.veryStrong .prob,.pick.veryStrong strong{color:#ff3b30}

.pick.veryStrong .prob{font-size:15px;font-weight:900}

.pick.strong .prob,.pick.strong strong{color:#ffd84d}

.pick.strong .prob{font-size:14px;font-weight:900}

.pick.weak{opacity:.38}

.total{background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;padding:10px;text-align:center;color:#d4af37;font-weight:bold;margin-bottom:8px}

.budgetInfo{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:11px;line-height:1.6;color:#aaa}

.budgetStrong{color:#d4af37;font-weight:bold}

.noPick{font-size:11px;color:#777;padding:8px 0;line-height:1.6}

.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}

.overviewBox{background:#101010;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}

.overviewBox .label{font-size:10px;color:#888}.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}

.overviewBox.main{border-color:#8a6d1c;background:#1c1709}

.overviewReason{font-size:11px;color:#aaa;line-height:1.7;margin-top:8px}

.venueBox{background:#101010;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.venueBox strong{color:#d4af37}

.formBox{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.footer{text-align:center;color:#555;font-size:10px;padding:20px}

.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}

.betEscape{color:#ff9500}.betSashi{color:#4cd964}.betMaki{color:#ff5555}.betMakiSashi{color:#58a6ff}

.recommendPick{opacity:.52}.recommendTitle{color:#888!important}

.outlookBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.outlookTitle{font-size:13px;font-weight:bold;color:#d4af37;margin-bottom:8px}

.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}

.outlookEscape{border-color:#7b2d2d;background:#241414}.outlookNonEscape{border-color:#285b8c;background:#0e1722}

.outlookInactive{border-color:#333!important;background:#151515!important}

.outlookLabel{font-size:10px;color:#aaa}.outlookValue{font-size:22px;font-weight:900;margin-top:3px}

.outlookEscape .outlookValue{color:#ff5555}.outlookNonEscape .outlookValue{color:#58a6ff}.outlookInactive .outlookValue{color:#777}

.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}

.decisionPositive{color:#4cd964}.decisionWarning{color:#ffd84d}.decisionDanger{color:#ff5555}.decisionMuted{color:#777!important}

.outlookBand-balanced{border-color:#2e8b57!important;background:#102014!important}.outlookBand-balanced .outlookValue{color:#4cd964!important}

.outlookCaution{margin-top:8px;padding:11px;border:2px solid #ffd84d;border-radius:8px;background:#211a07;color:#ffd84d;text-align:center;font-weight:900;font-size:15px;letter-spacing:.7px;box-shadow:0 0 0 1px #8a6d1c inset}

.outlookLow{border-color:#444!important;background:#151515!important}

.outlookLow .outlookLabel,.outlookLow .outlookStatus{color:#777!important}.outlookLow .outlookValue{color:#777!important}

.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}

.aiDetail strong{color:#d4af37}

.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}

.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}

.patternExcluded{color:#777;text-decoration:line-through}

@media(max-width:600px){

.grid2{grid-template-columns:1fr}.courseGrid{grid-template-columns:repeat(2,1fr)}

.racers{grid-template-columns:1fr}.overviewGrid{grid-template-columns:repeat(2,1fr)}

.betHeader,.betRow{grid-template-columns:1fr 1.3fr}.decisionStats{grid-template-columns:repeat(2,1fr)}

}

</style>

</head>

<body>

<header>

<h1>BOAT HUNTER</h1>

<p>人気ではなく期待値で勝つ</p>

</header>

<div class="container">

<div class="card">

<h2>🎯 レース選択</h2>

<div class="grid2">

<div>

<label>本日の開催場</label>

<select id="venue"></select>

</div>

<div>

<label>レース</label>

<select id="race">

<option value="1">1R</option><option value="2">2R</option>

<option value="3">3R</option><option value="4">4R</option>

<option value="5">5R</option><option value="6">6R</option>

<option value="7">7R</option><option value="8">8R</option>

<option value="9">9R</option><option value="10">10R</option>

<option value="11">11R</option><option value="12">12R</option>

</select>

</div>

</div>

<h3>🛥️ 今回の進入コース</h3>

<div class="courseGrid">

<div class="courseBox"><label>1号艇</label><select id="course1"></select></div>

<div class="courseBox"><label>2号艇</label><select id="course2"></select></div>

<div class="courseBox"><label>3号艇</label><select id="course3"></select></div>

<div class="courseBox"><label>4号艇</label><select id="course4"></select></div>

<div class="courseBox"><label>5号艇</label><select id="course5"></select></div>

<div class="courseBox"><label>6号艇</label><select id="course6"></select></div>

</div>

<button class="resetBtn" id="resetCoursesBtn">🔄 進入入力をリセット</button>

<button class="mainBtn" id="loadRaceBtn">出走表を取得</button>

<button class="subBtn" id="analysisBtn">🤖 AI解析開始</button>

<div id="message" class="message"></div>

</div>

<div id="raceCard" class="card" style="display:none">

<h2>🏁 出走表</h2>

<div id="raceInfo"></div>

<div id="racers" class="racers"></div>

</div>

<div id="analysisCard" class="card" style="display:none">

<h2>🤖 AI期待値ランキング</h2>

<div id="ranking"></div>

<h3>🔥 このレースの攻め手</h3>

<div id="attack"></div>

<h3>✂️ 3着から切候補</h3>

<div id="exclusions"></div>

<div id="bettingPatterns"></div>

</div>

<div class="footer">BOAT HUNTER © 2026</div>

<button class="topBtn" id="topBtn" type="button">⬆️ 1番上へ</button>

</div>

<script>

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

let raceData=null,racers=[],previewRacers={},manualCourses={},historyData={},currentBets=null;

const HISTORY_RACES=15;

const HISTORY_DAYS=180;

const $=id=>document.getElementById(id);

const num=v=>{

if(v==null||v==="")return 0;

let x=parseFloat(String(v).replace(/[%,秒,]/g,""));

return Number.isFinite(x)?x:0

};

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({

"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"

}[m]));

function course(b){return Number(manualCourses[b]||b)}

function racer(b){return racers.find(x=>num(x.entry_number)===b)}

function preview(b){return previewRacers[b]||previewRacers[String(b)]||{}}

function today(){

let p=new Intl.DateTimeFormat("ja-JP",{

timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"

}).formatToParts(new Date());

return{

year:p.find(x=>x.type==="year").value,

ymd:p.find(x=>x.type==="year").value+

p.find(x=>x.type==="month").value+

p.find(x=>x.type==="day").value

}

}

function dateInfo(d){

return{

year:String(d.getFullYear()),

ymd:String(d.getFullYear())+

String(d.getMonth()+1).padStart(2,"0")+

String(d.getDate()).padStart(2,"0")

}

}

async function json(url){

let r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

return r.json()

}

function normalizeEntry(x,i){

if(x==null||typeof x!=="object")return null;

let entry=num(

x.entry_number??x.entryNumber??x.boat_number??x.boatNumber??

x.boat_no??x.number_boat??x.boat??x.lane??x.lane_number??

x.laneNumber??x.course_number??x.course??x.entry??x.number

);

if(!entry&&i<6)entry=i+1;

let name=x.name??x.racer_name??x.racerName??x.player_name??

x.playerName??x.racer??x.player??x.racers_name??"";

if(typeof name==="object")

name=name.name||name.racer_name||name.player_name||"";

return{...x,entry_number:entry,name:name}

}

function extractRaceEntries(race){

if(!race)return[];

const directCandidates=[

race.racers,race.entries,race.participants,race.program,

race.race_entries,race.racer,race.players,race.boats,

race.starting_list,race.startingList,race.entry_list,

race.entryList,race.raceRacers,race.race_entries_list

];

for(const source of directCandidates){

if(!source)continue;

let arr=Array.isArray(source)?source:Object.values(source);

let list=arr.map((x,i)=>normalizeEntry(x,i))

.filter(x=>x&&x.entry_number>=1&&x.entry_number<=6);

let unique=new Map();

list.forEach(x=>{

if(!unique.has(x.entry_number))unique.set(x.entry_number,x)

});

list=Array.from(unique.values())

.sort((a,b)=>a.entry_number-b.entry_number);

if(list.length===6)return list

}

return extractEntriesDeep(race)

}

function extractEntriesDeep(root){

let found=[];

function walk(obj,depth=0){

if(!obj||depth>12)return;

if(Array.isArray(obj)){

for(const x of obj)walk(x,depth+1);

return

}

if(typeof obj!=="object")return;

const looksLikeRacer=

obj.name!=null||obj.racer_name!=null||

obj.racerName!=null||obj.player_name!=null||

obj.registration_number!=null||obj.racer_number!=null||

obj.player_number!=null;

const e=num(

obj.entry_number??obj.entryNumber??obj.boat_number??

obj.boatNumber??obj.boat_no??obj.lane??

obj.course_number??obj.course??obj.entry

);

if(looksLikeRacer&&e>=1&&e<=6){

let z=normalizeEntry(obj,0);

if(z)found.push(z)

}

for(const k of Object.keys(obj)){

if(k==="result"||k==="results"||k==="history")continue;

walk(obj[k],depth+1)

}

}

walk(root);

let unique=new Map();

found.forEach(x=>{

if(!unique.has(x.entry_number))unique.set(x.entry_number,x)

});

let list=Array.from(unique.values())

.sort((a,b)=>a.entry_number-b.entry_number);

return list.length===6?list:[]

}

function findRace(data,venue,raceNo){

let found=null;

function walk(obj){

if(found||obj==null)return;

if(Array.isArray(obj)){

for(const item of obj){

walk(item);

if(found)break

}

return

}

if(typeof obj!=="object")return;

const rn=obj.race_number??obj.raceNumber??obj.race_no??

obj.raceNo??obj.raceno??obj.number;

const vn=obj.stadium_number??obj.stadiumNumber??

obj.venue_number??obj.venueNumber??obj.stadiumNo??obj.venueNo;

if(

rn!=null&&String(rn)===String(raceNo)&&

(vn==null||String(vn)===String(venue))

){

let list=extractRaceEntries(obj);

if(list.length===6){

found=obj;

return

}

}

for(const key of Object.keys(obj)){

walk(obj[key]);

if(found)break

}

}

walk(data);

return found

}

function directRace(data,v,r){

const paths=[

data?.programs?.stadiums?.[String(v)]?.races?.[String(r)],

data?.programs?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.stadiums?.[String(v)]?.races?.[String(r)],

data?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.races?.[String(r)],

data?.races?.[Number(r)]

];

for(const x of paths){

if(x&&extractRaceEntries(x).length===6)return x

}

const raceArrays=[

data?.programs?.stadiums?.[String(v)]?.races,

data?.stadiums?.[String(v)]?.races,

data?.races,

data?.programs?.races

];

for(const arr of raceArrays){

if(!arr)continue;

const list=Array.isArray(arr)?arr:Object.values(arr);

const x=list.find(z=>{

const rn=z?.race_number??z?.raceNumber??z?.race_no??z?.raceNo;

return String(rn)===String(r)&&extractRaceEntries(z).length===6

});

if(x)return x

}

return findRace(data,v,r)

}

async function loadDaily(){

let t=today(),v=$("venue").value,r=$("race").value;

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let errors=[];

for(const url of urls){

try{

let data=await json(url);

let race=directRace(data,v,r);

if(race){

let list=extractRaceEntries(race);

if(list.length===6)return{data,race,base:url};

errors.push(url+" : race found but entries="+list.length)

}else{

errors.push(url+" : race not found")

}

}catch(e){

errors.push(url+" : "+e.message)

}

}

throw Error(

"APIから6艇の出走表を取得できませんでした.\n"+

errors.slice(-3).join("\n")

)

}

function initCourses(){

for(let b=1;b<=6;b++){

let e=$("course"+b);

e.innerHTML="";

for(let c=1;c<=6;c++)

e.add(new Option(c+"コース",c));

e.value=String(b);

manualCourses[b]=b;

e.onchange=()=>manualCourses[b]=Number(e.value)

}

}

function resetCourses(){

for(let b=1;b<=6;b++){

$("course"+b).value=String(b);

manualCourses[b]=b

}

$("message").innerHTML=

'<span class="success">🔄 進入入力をリセットしました</span>'

}

async function loadRaceData(){

$("message").innerHTML=

'<span class="loading">⏳ 出走表を取得中...</span>';

$("raceCard").style.display="none";

$("analysisCard").style.display="none";

historyData={};

currentBets=null;

try{

let api=await loadDaily();

raceData=api.race;

let list=extractRaceEntries(raceData);

if(list.length!==6)

throw Error("6艇の選手データを取得できませんでした");

racers=list;

previewRacers=

raceData.preview?.racers||

raceData.preview?.entries||

raceData.preview||{};

for(let b=1;b<=6;b++){

let p=preview(b);

let c=num(

p.course_number||

p.course||

p.entry_course||

p.entry||

p.lane

);

if(c>=1&&c<=6){

$("course"+b).value=String(c);

manualCourses[b]=c

}

}

renderRace();

function decision(n){

if(n==null||n==="")return"-";

if(typeof n==="object")

n=n.number??n.id??n.code??n.value??n.name??

n.label??n.technique??n.technique_name??"";

let s=String(n).trim();

if(!s)return"-";

const normalized=s

.replace(/\s/g,"")

.replace(/　/g,"")

.toLowerCase();

if(normalized==="1"||normalized==="逃げ"||normalized==="nige"||normalized==="escape")return"逃げ";

if(normalized==="2"||normalized==="差し"||normalized==="差し切り"||normalized==="sashi")return"差し";

if(normalized==="3"||normalized==="まくり"||normalized==="捲り"||normalized==="maki"||normalized==="makuri")return"まくり";

if(normalized==="4"||normalized==="まくり差し"||normalized==="捲り差し"||normalized==="まくりさし"||normalized==="makisashi"||normalized==="makuri-sashi")return"まくり差し";

if(normalized==="5"||normalized==="抜き"||normalized==="nuki")return"抜き";

if(normalized==="6"||normalized==="恵まれ"||normalized==="megumare")return"恵まれ";

return s

}

function cleanRate(v){

if(v==null||v==="")return null;

if(typeof v==="string"){

let s=v.trim();

if(!s)return null;

let n=parseFloat(s.replace("%",""));

if(!Number.isFinite(n))return null;

return n

}

let n=Number(v);

return Number.isFinite(n)?n:null

}

function rateValue(r,keys){

let objects=[

r,r?.decision_rates,r?.decisionRate,r?.decisions,

r?.win_by,r?.winning_methods,r?.stats,

r?.statistics,r?.statistics?.decision,

r?.decision,r?.winning_method

];

for(const key of keys)

for(const obj of objects){

if(!obj)continue;

let v;

if(typeof key==="function"){

try{v=key(r)}catch(e){v=null}

}else{

v=obj?.[key]

}

let n=cleanRate(v);

if(n!==null)return n

}

return 0

}

function historicalDecisionRates(b){

let a=history(b);

if(!a.length)return null;

const total=HISTORY_RACES;

let counts={

escape:0,

sashi:0,

maki:0,

makiSashi:0

};

a.slice(0,HISTORY_RACES).forEach(x=>{

if(x.place===1&&x.decision==="逃げ")counts.escape++;

if(x.place===1&&x.decision==="差し")counts.sashi++;

if(x.place===1&&x.decision==="まくり")counts.maki++;

if(x.place===1&&x.decision==="まくり差し")counts.makiSashi++

});

return{

escape:counts.escape/total*100,

sashi:counts.sashi/total*100,

maki:counts.maki/total*100,

makiSashi:counts.makiSashi/total*100

}

}

function historicalInsideDefenseRates(){

let a=history(1);

if(!a.length)return null;

const total=HISTORY_RACES;

let counts={

makare:0,

sasare:0,

makiSashi:0

};

a.slice(0,HISTORY_RACES).forEach(x=>{

if(x.place!==1){

if(x.againstDecision==="まくり")counts.makare++;

if(x.againstDecision==="差し")counts.sasare++;

if(x.againstDecision==="まくり差し")counts.makiSashi++

}

});

return{

makare:counts.makare/total*100,

sasare:counts.sasare/total*100,

makiSashi:counts.makiSashi/total*100

}

}

function decisionFromValue(value){

if(value==null||value==="")return null;

if(typeof value==="object")

value=value.number??value.id??value.code??value.value??

value.name??value.label??value.technique??

value.technique_name??value.decision??value.decision_name??"";

if(value==null||value==="")return null;

let d=decision(value);

return d&&d!=="-"?d:null

}

function getDecisionValue(x,result,race){

const directKeys=[

"technique_number","techniqueNumber","technique_no","techniqueNo",

"decision_number","decisionNumber","decision_no","decisionNo",

"decision","decision_name","decisionName",

"winning_method_number","winningMethodNumber",

"winning_method","winningMethod",

"winning_technique","winningTechnique",

"finish_technique","finishTechnique",

"finish_method","finishMethod",

"result_decision","resultDecision"

];

for(const key of directKeys){

let value=x?.[key];

let d=decisionFromValue(value);

if(d)return d

}

const no=getResultRacerNumber(x);

const keyedSources=[

result?.decision,result?.decisions,result?.technique,

result?.techniques,result?.winning_methods,result?.winningMethods,

result?.decision_rates,race?.decision,race?.decisions,

race?.technique,race?.techniques,race?.winning_methods,

race?.winningMethods

];

for(const source of keyedSources){

if(!source)continue;

if(Array.isArray(source)){

for(const item of source){

if(!item||typeof item!=="object")continue;

let itemNo=getResultRacerNumber(item);

if(itemNo!==no)continue;

let d=decisionFromValue(

item.decision??item.decision_name??

item.technique??item.technique_name??

item.winning_method??item.winningMethod??

item.value??item.name??item.number??item.code

);

if(d)return d

}

continue

}

if(typeof source==="object"){

const values=[

source?.[String(no)],source?.[no],

source?.racers?.[String(no)],source?.racers?.[no],

source?.entries?.[String(no)],source?.entries?.[no],

source?.players?.[String(no)],source?.players?.[no],

source?.boats?.[String(no)],source?.boats?.[no]

];

for(const value of values){

let d=decisionFromValue(value);

if(d)return d

}

}

}

const raceLevelKeys=[

"technique_number","techniqueNumber","technique_no","techniqueNo",

"decision_number","decisionNumber","decision_no","decisionNo",

"decision","decision_name","decisionName",

"winning_method_number","winningMethodNumber",

"winning_method","winningMethod",

"winning_technique","winningTechnique",

"finish_technique","finishTechnique",

"finish_method","finishMethod",

"result_decision","resultDecision"

];

const raceLevelSources=[result,race,result?.result,race?.result];

for(const source of raceLevelSources){

if(!source||typeof source!=="object")continue;

for(const key of raceLevelKeys){

let value=source?.[key];

if(value&&typeof value==="object"&&!Array.isArray(value)){

let mapped=

value?.[String(no)]??value?.[no]??

value?.name??value?.label??value?.value??

value?.code??value?.number??value?.id;

if(mapped!=null&&mapped!==""){

let d=decisionFromValue(mapped);

if(d)return d

}

}else{

let d=decisionFromValue(value);

if(d)return d

}

}

}

const alternativeSources=[

result?.winning,result?.winner,result?.finish,

result?.result_data,result?.resultData,

race?.winning,race?.winner,race?.finish,

race?.result_data,race?.resultData

];

for(const source of alternativeSources){

if(!source)continue;

if(Array.isArray(source)){

for(const item of source){

if(!item||typeof item!=="object")continue;

let itemNo=getResultRacerNumber(item);

if(itemNo!==no)continue;

let d=decisionFromValue(

item.decision??item.decision_name??

item.technique??item.technique_name??

item.winning_method??item.winningMethod??

item.value??item.name??item.number??item.code

);

if(d)return d

}

}else if(typeof source==="object"){

for(const key of raceLevelKeys){

let value=source?.[key];

let d=decisionFromValue(value);

if(d)return d

}

}

}

return null

}

function addResultRace(race,targets,wanted){

let result=race?.result||race?.results||race?.race_result;

if(!result)return;

let resultRacers=

result.racers||result.entries||result.participants||

result.boats||result.players||

race?.racers||race?.entries||race?.participants||race?.boats;

if(!resultRacers)return;

let list=Array.isArray(resultRacers)?resultRacers:Object.values(resultRacers);

let date=

result.date||race.date||race.race_date||

race.date_time||race.dateTime||"";

let normalized=list.map(x=>{

let no=getResultRacerNumber(x);

let c=getCourse(x);

let place=getPlace(x);

let technique=getDecisionValue(x,result,race);

return{raw:x,no,c,place,technique}

}).filter(x=>x.no>0&&x.c>=1&&x.c<=6&&x.place>=1&&x.place<=6);

let winner=normalized.find(x=>x.place===1);

let winningDecision=winner?.technique||null;

normalized.forEach(x=>{

let no=x.no;

if(!wanted.has(no))return;

let c=x.c,place=x.place;

if(!targets[no]||c!==targets[no].course)return;

if(targets[no].boats[c].length>=HISTORY_RACES)return;

if(place===1){

targets[no].boats[c].push({

date,

place,

course:c,

decision:x.technique&&x.technique!=="-"?x.technique:null,

againstDecision:null

});

return

}

targets[no].boats[c].push({

date,

place,

course:c,

decision:null,

againstDecision:

winningDecision&&winningDecision!=="-"?

winningDecision:null

})

})

}

function collectHistoryFromDay(data,targets,wanted){

let stadiums=

data?.programs?.stadiums||

data?.stadiums||

data?.programs?.venues||

data?.venues;

if(!stadiums)return;

let stadiumList=

Array.isArray(stadiums)?

stadiums:

Object.values(stadiums);

stadiumList.forEach(stadium=>{

let races=stadium?.races||stadium?.race||stadium?.programs;

if(!races)return;

let list=Array.isArray(races)?races:Object.values(races);

list.forEach(race=>{

if(race?.result||race?.results||race?.race_result)

addResultRace(race,targets,wanted)

})

})

}

function historyComplete(targets){

return racers.every(r=>{

let no=getRacerNumber(r),c=course(num(r.entry_number));

return(targets[no]?.boats?.[c]?.length||0)>=HISTORY_RACES

})

}

function sortHistory(targets){

Object.values(targets).forEach(player=>

Object.values(player.boats).forEach(arr=>{

arr.sort((a,b)=>String(b.date).localeCompare(String(a.date)));

if(arr.length>HISTORY_RACES)arr.splice(HISTORY_RACES)

})

)

}

function history(b){

let r=racer(b);

if(!r)return[];

let no=getRacerNumber(r),c=course(b);

return(historyData[no]?.boats?.[c]||[])

.slice(0,HISTORY_RACES)

}

function hstats(b){

let a=history(b),

f=a.filter(x=>x.place===1).length,

s=a.filter(x=>x.place===2).length,

t=a.filter(x=>x.place===3).length;

const total=HISTORY_RACES;

return{

count:a.length,

first:f,

second:s,

third:t,

rate:(f+s+t)/total*100

}

}

function hscore(b){

let s=hstats(b);

return s.first*3.8+

s.second*2.6+

s.third*1.6+

s.rate*.2

}

)return"head";

continue

}

if(c.type==="third"){

candidates.push({

two:promotionByMaki(b,rankings,type),

`${promotionByMaki(b,rankings,type)?" / まくり後ろ展開で2着まで昇格":""}`

});

continue

}

candidates.push({

boat:b,

raw,

revival:false,

thirdOnly:false,

two:promotionByMaki(b,rankings,type),

reason:`${reasons.join("・")}の根拠あり`

})

}

return candidates

.sort((a,b)=>b.raw-a.raw)

.slice(0,3)

function candidate(a,b,rankings,type,mode="recovery"){

if(a===b)return null;

let A=rankings.find(x=>x.boat===a),

B=rankings.find(x=>x.boat===b);

if(!A||!B)return null;

let o=overview(),

raw=A.score*1.35+B.score*.75;

if(type==="escape"){

if(course(a)!==1)return null;

raw+=30+o.escape*.9+suitability(a,type)*.7

}

if(type==="sashi"){

if(course(a)===1||course(b)!==2)return null;

raw+=10+suitability(a,type)*.9+o.sashi*.75+18;

if(o.escape<42)raw+=10

}

if(type==="maki"){

if(course(a)===1)return null;

raw+=8+suitability(a,type)*.9+o.maki*.75;

if(o.escape<42)raw+=10

}

if(type==="makiSashi"){

if(course(a)===1||course(a)===2)return null;

raw+=10+suitability(a,type)*.9+o.makiSashi*.75;

if(o.escape<42)raw+=10

}

if(type==="maki"&&course(a)===2){

let rr=decisions(racer(a));

if(rr.maki<10||o.maki<20)return null;

raw+=rr.maki*.5

}

if(b===1){

raw+=18;

if(o.escape>=50)raw+=10

}

raw+=

hscore(a)*1.3+

recentForm(a).score*1.5+

num(

racer(a)?.motor_top_2_percent||

racer(a)?.motor_2ren_rate||

racer(a)?.motor_2ren

)*.08;

let ra=rankings.findIndex(x=>x.boat===a)+1,

rb=rankings.findIndex(x=>x.boat===b)+1;

raw+=ra===1?8:ra===2?5:ra===3?3:0;

if(rb<=3)raw+=2;

let dev=developmentBonus(b,rankings,type);

raw+=dev.bonus;

if(

(type==="maki"||type==="makiSashi")&&

promotionByMaki(b,rankings,type)

)

raw+=10;

let vt=venueTrait();

raw*=

type==="escape"?vt.escape:

type==="sashi"?vt.sashi:

type==="maki"?vt.maki:

vt.makiSashi;

raw+=windSuitability(a,type)*1.2;

raw+=windSuitability(b,type)*.35;

if(windMode()==="head"&&windInfo().speed>=3){

if(type==="maki"&&course(a)>=3)raw+=10;

if(type==="makiSashi"&&course(a)>=3)raw+=7;

if(course(a)===1)raw-=5

}

if(windMode()==="tail"&&windInfo().speed>=3){

if(type==="escape"&&course(a)===1)raw+=10;

if(type==="sashi"&&course(a)===2)raw+=8

}

return{

key:`${a}-${b}`,

a,b,

raw:Math.max(.01,raw),

type

}

}

function thirdProbabilityList(excluded,rankings,type){

let weights=list.map(x=>

1:"桐生",2:"戸田",3:"江戸川",4:"平和島",

5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",

13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",

17:"宮島",18:"徳山",19:"下関",20:"若松",

21:"芦屋",22:"福岡",23:"唐津",24:"大村"

};

try{

let t=today();

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let found=new Map();

for(const url of urls){

try{

let data=await json(url);

let stadiums=

data?.programs?.stadiums||

data?.stadiums||

data?.programs?.venues||

data?.venues;

if(!stadiums)continue;

let list=

Array.isArray(stadiums)?

stadiums:

Object.entries(stadiums).map(([k,x])=>({

...x,

_venueNo:k

}));

list.forEach(x=>{

let no=num(

x._venueNo??

x.stadium_number??

x.stadiumNumber??

x.venue_number??

x.venueNumber??

x.stadiumNo??

x.venueNo??

x.number??

x.id

);

let name=

x.name||

x.stadium_name||

x.stadiumName||

x.venue_name||

x.venueName||

venueNames[no];

if(no>=1&&no<=24)

found.set(no,String(name||venueNames[no]))

});

if(found.size)break;

}catch(e){}

}

if(!found.size)

throw Error("本日の開催場を取得できませんでした");

let oldValue=v.value;

v.innerHTML="";

Array.from(found.entries())

.sort((a,b)=>a[0]-b[0])

.forEach(([no,name])=>{

v.add(new Option(name,String(no)))

});

if(found.has(Number(oldValue))){

v.value=String(oldValue)

}else if(v.options.length){

v.selectedIndex=0

}

}catch(e){

v.innerHTML=

'<option value="">本日の開催場を取得できません</option>';

v.value="";

}

}
