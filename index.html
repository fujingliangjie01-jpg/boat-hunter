<script>

/* =====================================================

   BOAT HUNTER

   817-18時 基準版

   現行V1 API完全対応版

===================================================== */

/* =====================================================

   API

===================================================== */

const API_V1 =

"https://boatraceopenapi.github.io/api/v1";

const API_V3 =

"https://boatraceopenapi.github.io/programs/v3";

const API_V2 =

"https://boatraceopenapi.github.io/programs/v2";

/* =====================================================

   24競艇場

===================================================== */

const STADIUMS = [

["桐生",1],

["戸田",2],

["江戸川",3],

["平和島",4],

["多摩川",5],

["浜名湖",6],

["蒲郡",7],

["常滑",8],

["津",9],

["三国",10],

["びわこ",11],

["住之江",12],

["尼崎",13],

["鳴門",14],

["丸亀",15],

["児島",16],

["宮島",17],

["徳山",18],

["下関",19],

["若松",20],

["芦屋",21],

["福岡",22],

["唐津",23],

["大村",24]

];

/* =====================================================

   状態

===================================================== */

let raceData = null;

let racers = [];

let entryOrder = [1,2,3,4,5,6];

let usedApi = "";

/* =====================================================

   競艇場セット

===================================================== */

const stadium =

document.getElementById("stadium");

STADIUMS.forEach(x=>{

const op =

document.createElement("option");

op.value = x[1];

op.textContent = x[0];

stadium.appendChild(op);

});

/* =====================================================

   日付

===================================================== */

function todayJP(){

const d = new Date();

const y =

d.getFullYear();

const m =

String(d.getMonth()+1)

.padStart(2,"0");

const day =

String(d.getDate())

.padStart(2,"0");

return `${y}-${m}-${day}`;

}

function todayCompact(){

return todayJP()

.replace(/-/g,"");

}

/* =====================================================

   数値化

===================================================== */

function num(v){

if(

v === null ||

v === undefined ||

v === ""

){

return 0;

}

const n =

parseFloat(

String(v)

.replace("%","")

.replace(",","")

);

return isNaN(n) ? 0 : n;

}

/* =====================================================

   値取得

===================================================== */

function first(obj,keys,def=0){

if(!obj){

return def;

}

for(const key of keys){

if(

obj[key] !== undefined &&

obj[key] !== null &&

obj[key] !== ""

){

return obj[key];

}

}

return def;

}

/* =====================================================

   級別

===================================================== */

function rankName(v){

const n =

Number(v);

if(n===1) return "A1";

if(n===2) return "A2";

if(n===3) return "B1";

if(n===4) return "B2";

const s =

String(v || "")

.toUpperCase();

if(

["A1","A2","B1","B2"].includes(s)

){

return s;

}

return s || "B1";

}

/* =====================================================

   選手データ正規化

===================================================== */

function normalizeRacer(

base,

preview,

i

){

base =

base || {};

preview =

preview || {};

const course =

Number(

first(

base,

[

"entry_number",

"entryNumber"

],

i+1

)

);

const name =

first(

base,

[

"name",

"racerName",

"playerName",

"fullName"

],

`選手${i+1}`

);

const rank =

rankName(

first(

base,

[

"rank_number",

"rank",

"class",

"racerClass"

],

"B1"

)

);

const national =

num(

first(

base,

[

"national_win_rate",

"nationalWinRate",

"winRate"

],

0

)

);

const local =

num(

first(

base,

[

"local_win_rate",

"localWinRate",

"localRate"

],

0

)

);

const motor2 =

num(

first(

base,

[

"motor_top_2_percent",

"motor2Rate",

"motorSecondRate"

],

0

)

);

const motor3 =

num(

first(

base,

[

"motor_top_3_percent",

"motor3Rate",

"motorThirdRate"

],

0

)

);

const st =

num(

first(

preview,

[

"start_timing",

"ST",

"st"

],

0

)

);

const exhibition =

num(

first(

preview,

[

"exhibition_time",

"exhibitionTime",

"exhibition"

],

0

)

);

const motorNo =

first(

base,

[

"motor_number",

"motorNumber",

"motorNo"

],

"-"

);

const previewCourse =

Number(

first(

preview,

[

"course_number",

"courseNumber"

],

course

)

);

return{

raw:base,

preview:preview,

course:

course>=1 &&

course<=6

? course

: i+1,

actualCourse:

previewCourse>=1 &&

previewCourse<=6

? previewCourse

: course,

name:name,

rank:rank,

national:national,

local:local,

motor2:motor2,

motor3:motor3,

st:st,

exhibition:exhibition,

motorNo:motorNo,

score:0

};

}

/* =====================================================

   JSON取得

===================================================== */

async function fetchJSON(url){

const response =

await fetch(

url,

{

method:"GET",

cache:"no-store",

headers:{

"Accept":"application/json"

}

}

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

return await response.json();

}

/* =====================================================

   V1 レース取得

===================================================== */

async function getRaceV1(){

const date =

todayCompact();

const year =

date.substring(0,4);

const stadiumNo =

String(stadium.value);

const raceNo =

String(

document

.getElementById("raceNo")

.value

);

/* まず today */

const todayURL =

`${API_V1}/today.json?t=${Date.now()}`;

try{

const data =

await fetchJSON(todayURL);

const race =

data?.programs

?.stadiums

?.[stadiumNo]

?.races

?.[raceNo];

if(race){

return race;

}

}catch(e){

console.log(

"V1 today:",

e.message

);

}

/* 日付指定 */

const dateURL =

`${API_V1}/${year}/${date}.json?t=${Date.now()}`;

const data =

await fetchJSON(dateURL);

const race =

data?.programs

?.stadiums

?.[stadiumNo]

?.races

?.[raceNo];

if(race){

return race;

}

throw new Error(

`V1に${stadiumNo}場${raceNo}Rがありません`

);

}

/* =====================================================

   V1 6艇抽出

===================================================== */

function extractV1Racers(race){

if(!race){

return [];

}

const programRacers =

race.racers || {};

const previewRacers =

race.preview?.racers || {};

const result = [];

for(let i=1;i<=6;i++){

const base =

programRacers[String(i)] ||

programRacers[i] ||

null;

const preview =

previewRacers[String(i)] ||

previewRacers[i] ||

null;

if(base){

result.push(

normalizeRacer(

base,

preview,

i-1

)

);

}

}

return result;

}

/* =====================================================

   V3/V2 レース検索

===================================================== */

function findRace(

data,

stadiumNo,

raceNo

){

if(!data){

return null;

}

/* 配列 */

if(Array.isArray(data)){

for(

const item of data

){

const found =

findRace(

item,

stadiumNo,

raceNo

);

if(found){

return found;

}

}

return null;

}

/* オブジェクト */

if(typeof data !== "object"){

return null;

}

/* 直接 */

const s =

Number(

first(

data,

[

"stadium_number",

"stadiumNumber",

"stadiumNo",

"venueNumber",

"venueNo",

"stadium_id",

"stadiumId"

],

-1

)

);

const r =

Number(

first(

data,

[

"race_number",

"raceNumber",

"raceNo",

"race",

"race_id",

"raceId"

],

-1

)

);

if(

s===Number(stadiumNo) &&

r===Number(raceNo)

){

return data;

}

/* 再帰 */

for(

const key of Object.keys(data)

){

const value =

data[key];

if(

value &&

typeof value==="object"

){

const found =

findRace(

value,

stadiumNo,

raceNo

);

if(found){

return found;

}

}

}

return null;

}

/* =====================================================

   V3/V2取得

===================================================== */

async function getRaceVersion(base){

const date =

todayCompact();

const year =

date.substring(0,4);

const stadiumNo =

Number(stadium.value);

const raceNo =

Number(

document

.getElementById("raceNo")

.value

);

/* 正式URL */

const urls = [

`${base}/${year}/${date}.json`,

`${base}/today.json`

];

for(

const url of urls

){

try{

const data =

await fetchJSON(

url+"?t="+Date.now()

);

const race =

findRace(

data,

stadiumNo,

raceNo

);

if(race){

return race;

}

}catch(e){

console.log(

"旧API:",

url,

e.message

);

}

}

return null;

}

/* =====================================================

   旧APIの選手抽出

===================================================== */

function extractOldRacers(race){

if(!race){

return [];

}

const racersObject =

race.racers ||

race.entries ||

race.players ||

null;

if(

racersObject &&

typeof racersObject==="object" &&

!Array.isArray(racersObject)

){

const arr =

Object.values(racersObject);

if(arr.length>=6){

return arr

.slice(0,6)

.map(

(r,i)=>

normalizeRacer(

r,

{},

i

)

);

}

}

if(

Array.isArray(racersObject)

){

return racersObject

.slice(0,6)

.map(

(r,i)=>

normalizeRacer(

r,

{},

i

)

);

}

return [];

}

/* =====================================================

   レース取得

===================================================== */

async function getRace(){

/* V1 */

try{

const race =

await getRaceV1();

if(race){

usedApi="V1";

return race;

}

}catch(e){

console.log(

"V1失敗:",

e.message

);

}

/* V3 */

try{

const race =

await getRaceVersion(

API_V3

);

if(race){

usedApi="V3";

return race;

}

}catch(e){

console.log(

"V3失敗:",

e.message

);

}

/* V2 */

try{

const race =

await getRaceVersion(

API_V2

);

if(race){

usedApi="V2";

return race;

}

}catch(e){

console.log(

"V2失敗:",

e.message

);

}

throw new Error(

"V1・V3・V2のすべてで対象レースを取得できませんでした。"

);

}

/* =====================================================

   出走表取得

===================================================== */

async function loadRace(){

const btn =

document.querySelector(".mainBtn");

btn.disabled=true;

setStatus(

"出走表を取得中...\n"+

"現行V1 → V3 → V2 を確認しています。"

);

document

.getElementById("resultArea")

.classList

.add("hidden");

try{

raceData =

await getRace();

if(

usedApi==="V1"

){

racers =

extractV1Racers(

raceData

);

}else{

racers =

extractOldRacers(

raceData

);

}

if(

racers.length<6

){

console.error(

"RACE DATA:",

raceData

);

throw new Error(

"APIからレースは取得できましたが、6艇の選手データを抽出できませんでした。"

);

}

/* 1〜6号艇固定 */

racers =

racers.slice(0,6);

racers.forEach(

(r,i)=>{

r.course=i+1;

}

);

entryOrder =

[1,2,3,4,5,6];

renderEntryButtons();

renderRace();

document

.getElementById("raceArea")

.classList

.remove("hidden");

setStatus(

"出走表取得成功！\n"+

`${usedApi}から6艇取得しました。\n`+

"AI解析開始ボタンを押してください。"

);

}catch(e){

console.error(e);

setStatus(

"❌ 出走表取得失敗\n\n"+

e.message

);

}finally{

btn.disabled=false;

}

}

/* =====================================================

   レース表示

===================================================== */

function renderRace(){

const sName =

stadium

.options[

stadium.selectedIndex

]

.textContent;

const raceNo =

document

.getElementById("raceNo")

.value;

document

.getElementById("raceTitle")

.textContent =

`${sName} ${raceNo}R`;

document

.getElementById("raceMeta")

.innerHTML =

`

<span class="badge">

API ${usedApi}

</span>

<span class="badge">

${todayJP()}

</span>

`;

renderRacers();

document

.getElementById("apiInfo")

.innerHTML =

`

使用API：${usedApi}<br>

日付：${todayJP()}<br>

場番号：${stadium.value}<br>

レース：${raceNo}R<br>

選手数：${racers.length}艇

`;

}

/* =====================================================

   選手表示

===================================================== */

function renderRacers(){

const area =

document.getElementById("racers");

area.innerHTML="";

racers.forEach(

(r,i)=>{

const div =

document.createElement("div");

div.className="racer";

div.innerHTML =

`

<div class="racerTop">

/* =====================================================

   AIスコア

===================================================== */

function courseBonus(course){

return{

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

}[course] || 0;

}

function rankBonus(rank){

const r =

String(rank)

.toUpperCase();

if(r==="A1") return 5;

if(r==="A2") return 2;

if(r==="B1") return 0;

if(r==="B2") return -2;

return 0;

}

function calcScore(r){

let score=0;

/* 全国勝率 */

score +=

r.national*7;

/* 当地勝率 */

score +=

r.local*4;

/* モーター */

score +=

r.motor2*0.15;

/* ST */

if(r.st>0){

score +=

Math.max(

0,

0.30-r.st

)*20;

}

/* コース */

score +=

courseBonus(

r.course

);

/* 級別 */

score +=

rankBonus(

r.rank

);

/* 展示 */

if(r.exhibition>0){

if(r.exhibition<=6.70){

score+=3;

}else if(

r.exhibition<=6.80

){

score+=1;

}else if(

r.exhibition>=7.00

){

score-=2;

}

}

/* 前付け */

if(entryOrder[0]!==1){

if(

r.course===

entryOrder[0]

){

score+=3;

}

if(

r.course===1

){

score-=2;

}

}

return Math.round(

score*10

)/10;

}

function analyzeRace(){

racers.forEach(

r=>{

r.score=

calcScore(r);

}

);

}

function getOrdered(){

return [...racers]

.sort(

(a,b)=>

b.score-a.score

);

}

function getBoat(n){

return racers.find(

r=>r.course===n

);

}

function makeForecast(){

const one =

getBoat(1);

const ranking =

getOrdered();

const second =

ranking.find(

r=>r.course!==1

);

const third =

ranking.find(

r=>

r.course!==1 &&

second &&

r.course!==second.course

);

let text="";

if(

entryOrder[0]!==1

){

text +=

"前付けが入る想定。インのスタートが乱れると、";

if(second){

text +=

`${second.course}号艇の差し・まくり差しが有力。`;

}

}else{

text +=

`1号艇${one ? one.name : ""}のイン逃げを基本線。`;

if(second){

text +=

` 相手筆頭は${second.course}号艇。`;

}

if(third){

text +=

` 展開次第で${third.course}号艇まで。`;

}

}

text +=

"<br>ST・展示・モーター機力・全国勝率・当地勝率を総合評価。";

document

.getElementById("forecast")

.innerHTML=

text;

}

/* =====================================================

   買い目

===================================================== */

function makeCombinations(){

const sorted =

getOrdered();

/* 的中率 */

const hit=[];

const honmei =

sorted[0];

const topOthers =

sorted

.filter(

r=>

r.course!==honmei.course

)

.slice(0,3);

topOthers.forEach(

r=>{

const third =

topOthers.find(

x=>

x.course!==r.course

);

if(third){

hit.push(

`${honmei.course}-${r.course}-${third.course}`

);

}

});

/* 回収率 */

const roi=[];

const candidates =

sorted

.slice(0,5)

.map(

r=>r.course

);

for(

let i=0;

i<candidates.length;

i++

){

for(

let j=0;

j<candidates.length;

j++

){

for(

let k=0;

k<candidates.length;

k++

){

if(

i===j ||

j===k ||

i===k

){

continue;

}

const combo =

`${candidates[i]}-${candidates[j]}-${candidates[k]}`;

if(

!roi.includes(combo)

){

roi.push(combo);

}

if(roi.length>=6){

break;

}

}

if(roi.length>=6){

break;

}

}

if(roi.length>=6){

break;

}

}

/* 穴 */

const hole=[];

sorted

.slice(3,6)

.forEach(

r=>{

hole.push(r.course);

}

);

return{

hit,

roi,

hole

};

}

/* =====================================================

   HTML安全化

===================================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
