<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:#080808;

color:#fff;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

header{

background:#000;

border-bottom:1px solid #d4af37;

padding:22px 15px;

text-align:center;

}

.logo{

font-size:30px;

font-weight:900;

letter-spacing:4px;

color:#d4af37;

}

.tagline{

font-size:12px;

color:#888;

margin-top:6px;

}

.container{

max-width:900px;

margin:auto;

padding:18px;

}

.card{

background:#151515;

border:1px solid #292929;

border-radius:14px;

padding:18px;

margin-bottom:18px;

}

.title{

font-size:18px;

font-weight:900;

color:#d4af37;

margin-bottom:16px;

}

label{

display:block;

font-size:13px;

color:#999;

margin-bottom:6px;

}

select,input{

width:100%;

padding:13px;

margin-bottom:15px;

border-radius:8px;

border:1px solid #444;

background:#0b0b0b;

color:#fff;

font-size:15px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:10px;

background:linear-gradient(135deg,#d4af37,#9b7418);

color:#000;

font-size:16px;

font-weight:900;

}

.status{

text-align:center;

color:#d4af37;

margin-top:12px;

font-size:13px;

}

.hidden{

display:none;

}

.boats{

display:grid;

grid-template-columns:repeat(6,1fr);

gap:8px;

}

.boat{

background:#0d0d0d;

border:1px solid #333;

border-radius:10px;

padding:12px 5px;

text-align:center;

}

.boat-number{

font-size:23px;

font-weight:900;

}

.boat-name{

font-size:13px;

margin-top:7px;

}

.boat-class{

font-size:11px;

color:#d4af37;

margin-top:5px;

}

.entry-grid{

display:grid;

grid-template-columns:repeat(6,1fr);

gap:8px;

}

.entry-btn{

padding:15px 5px;

background:#0d0d0d;

color:#fff;

border:1px solid #444;

border-radius:9px;

font-size:18px;

font-weight:900;

}

.entry-btn.selected{

background:#d4af37;

color:#000;

border-color:#d4af37;

}

.entry-result{

margin-top:15px;

padding:18px;

text-align:center;

background:#0b0b0b;

border:1px solid #333;

border-radius:10px;

font-size:27px;

font-weight:900;

color:#d4af37;

}

.row{

display:flex;

justify-content:space-between;

gap:10px;

padding:12px 0;

border-bottom:1px solid #292929;

}

.left{

color:#999;

}

.right{

font-weight:900;

text-align:right;

}

.gold{

color:#d4af37;

}

.green{

color:#65df8b;

}

.red{

color:#ff6f61;

}

.yellow{

color:#ffd34d;

}

.rank{

background:#0c0c0c;

border:1px solid #292929;

border-radius:10px;

padding:14px;

margin-bottom:9px;

}

.pick{

font-size:24px;

font-weight:900;

color:#d4af37;

margin-top:8px;

}

.note{

font-size:11px;

color:#777;

margin-top:7px;

line-height:1.6;

}

.warning{

background:#211b08;

border:1px solid #8d6c16;

padding:15px;

border-radius:10px;

line-height:1.7;

}

.error{

background:#260d0d;

border:1px solid #8d3030;

padding:15px;

border-radius:10px;

color:#ff8c8c;

line-height:1.6;

}

@media(max-width:600px){

.boats{

grid-template-columns:repeat(3,1fr);

}

.entry-grid{

grid-template-columns:repeat(3,1fr);

}

.logo{

font-size:25px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

BOAT HUNTER

</div>

<div class="tagline">

人気ではなく期待値で勝つ

</div>

</header>

<main class="container">

<section class="card">

<div class="title">

🎯 レース選択

</div>

<label>競艇場</label>

<select id="venue">

<option value="桐生">桐生</option>

<option value="戸田">戸田</option>

<option value="江戸川">江戸川</option>

<option value="平和島">平和島</option>

<option value="多摩川">多摩川</option>

<option value="浜名湖">浜名湖</option>

<option value="蒲郡">蒲郡</option>

<option value="常滑">常滑</option>

<option value="津">津</option>

<option value="三国">三国</option>

<option value="びわこ">びわこ</option>

<option value="住之江">住之江</option>

<option value="尼崎">尼崎</option>

<option value="鳴門">鳴門</option>

<option value="丸亀">丸亀</option>

<option value="児島">児島</option>

<option value="宮島">宮島</option>

<option value="徳山">徳山</option>

<option value="下関">下関</option>

<option value="若松">若松</option>

<option value="芦屋">芦屋</option>

<option value="福岡">福岡</option>

<option value="唐津">唐津</option>

<option value="大村">大村</option>

</select>

<label>レース</label>

<select id="race">

<option value="1">1R</option>

<option value="2">2R</option>

<option value="3">3R</option>

<option value="4">4R</option>

<option value="5">5R</option>

<option value="6">6R</option>

<option value="7">7R</option>

<option value="8">8R</option>

<option value="9">9R</option>

<option value="10">10R</option>

<option value="11">11R</option>

<option value="12">12R</option>

</select>

<label>予算</label>

<input id="budget"

type="number"

value="3000"

min="100"

step="100">

<button onclick="loadRace()">

🔥 出走表を取得

</button>

<div id="status" class="status"></div>

</section>

<div id="result" class="hidden">

<section class="card">

<div class="title">

🚤 出走表

</div>

<div id="boats" class="boats"></div>

</section>

<section class="card">

<div class="title">

🚦 本番進入を手動入力

</div>

<div class="warning">

展示・ピット離れを見て、

<strong>本番での進入を自分で入力</strong>してください。

<br><br>

外枠の前付けも、

ここで自由に設定できます。

</div>

<br>

<div id="entryButtons"

class="entry-grid">

</div>

<div id="entryResult"

class="entry-result">

進入を選択してください

</div>

</section>

<section class="card">

<div class="title">

⚠️ 前付け解析

</div>

<div id="maezuke">

<div class="note">

本番進入を入力すると、

その進入を前提に解析します。

</div>

</div>

</section>

<section class="card">

<div class="title">

🧠 展開予想

</div>

<div id="development">

<div class="note">

進入を入力してください。

</div>

</div>

</section>

<section class="card">

<div class="title">

🏆 AI期待値ランキング

</div>

<div id="ranking"></div>

</section>

<section class="card">

<div class="title">

🎯 最終評価

</div>

<div id="final"></div>

</section>

<section class="card">

<div class="title">

💰 買い目

</div>

<div class="rank">

<strong>

的中率重視

</strong>

<div id="hitPick" class="pick">

-

</div>

<div id="hitMoney" class="note">

-

</div>

</div>

<div class="rank">

<strong>

回収率重視

</strong>

<div id="roiPick" class="pick">

-

</div>

<div id="roiMoney" class="note">

-

</div>

</div>

</section>

</div>

</main>

<footer>

BOAT HUNTER © 2026

</footer>

<script>

/*

========================================

BOAT HUNTER

========================================

*/

let raceData = null;

let selectedEntry = [];

/*

========================================

出走表取得

========================================

*/

async function loadRace(){

const venue =

document.getElementById("venue").value;

const race =

Number(document.getElementById("race").value);

const status =

document.getElementById("status");

status.innerText =

"⏳ 実際の出走表を取得中...";

document

.getElementById("result")

.classList.add("hidden");

try{

/*

ここは後で実際のAPIに接続する部分。

今は存在しないURLを使用しない。

*/

const API_URL = "";

if(!API_URL){

throw new Error(

"API接続設定が必要です"

);

}

const response =

await fetch(API_URL);

if(!response.ok){

throw new Error(

"API取得エラー"

);

}

raceData =

await response.json();

renderRace(

venue,

race

);

status.innerText =

"✅ 出走表取得完了";

document

.getElementById("result")

.classList.remove("hidden");

}catch(error){

console.error(error);

status.innerHTML = `

<div class="error">

❌ 実データを取得できませんでした。

<br><br>

原因：

${error.message}

<br><br>

現在、API接続部分を確認中です。

</div>

`;

}

}

/*

========================================

出走表表示

========================================

*/

function renderRace(

venue,

race

){

/*

APIのデータ形式が確定したら

ここで選手を抽出する。

*/

}

/*

========================================

手動進入ボタン

========================================

*/

function createEntryButtons(){

const container =

document.getElementById(

"entryButtons"

);

container.innerHTML = "";

for(

let i=1;

i<=6;

i++

){

const button =

document.createElement(

"button"

);

button.className =

"entry-btn";

button.innerText =

i + "号艇";

button.onclick =

function(){

selectEntry(i);

};

container.appendChild(

button

);

}

}

/*

========================================

進入選択

========================================

*/

function selectEntry(

boat

){

if(

selectedEntry.includes(boat)

){

return;

}

if(

selectedEntry.length >= 6

){

return;

}

selectedEntry.push(

boat

);

const buttons =

document.querySelectorAll(

".entry-btn"

);

buttons.forEach(

function(button,index){

if(

selectedEntry.includes(

index+1

)

){

button.classList.add(

"selected"

);

}

});

document.getElementById(

"entryResult"

).innerText =

selectedEntry.join("-");

if(

selectedEntry.length === 6

){

runAI();

}

}

/*

========================================

AI解析

========================================

*/

function runAI(){

const budget =

Number(

document.getElementById(

"budget"

).value

);

const first =

selectedEntry[0];

const second =

selectedEntry[1];

const third =

selectedEntry[2];

document.getElementById(

"maezuke"

).innerHTML = `

<div class="row">

<span class="left">

進入

</span>

<span class="right gold">

${selectedEntry.join("-")}

</span>

</div>

<div class="row">

<span class="left">

前付け

</span>

<span class="right yellow">

手動入力を採用

</span>

</div>

`;

document.getElementById(

"development"

).innerHTML = `

<div class="row">

<span class="left">

先頭想定

</span>

<span class="right gold">

${first}号艇

</span>

</div>

<div class="row">

<span class="left">

相手筆頭

</span>

<span class="right">

${second}号艇

</span>

</div>

<div class="row">

<span class="left">

展開穴

</span>

<span class="right yellow">

${third}号艇

</span>

</div>

`;

document.getElementById(

"ranking"

).innerHTML = `

<div class="rank">

<strong>

1位

</strong>

<div class="pick">

${first}号艇

</div>

</div>

<div class="rank">

<strong>

2位

</strong>

<div class="pick">

${second}号艇

</div>

</div>

<div class="rank">

<strong>

3位

</strong>

<div class="pick">

${third}号艇

</div>

</div>

`;

document.getElementById(

"final"

).innerHTML = `

<div class="row">

<span class="left">

本命

</span>

<span class="right gold">

${first}号艇

</span>

</div>

<div class="row">

<span class="left">

対抗

</span>

<span class="right">

${second}号艇

</span>

</div>

<div class="row">

<span class="left">

穴

</span>

<span class="right yellow">

${third}号艇

</span>

</div>

`;

const hitMoney =

Math.floor(

budget*0.6

);

const roiMoney =

budget-hitMoney;

document.getElementById(

"hitPick"

).innerText =

`${first}-${second}-${third}`;

document.getElementById(

"hitMoney"

).innerText =

"予算 " +

hitMoney +

"円";

document.getElementById(

"roiPick"

).innerText =

`${second}-${third}-${first}`;

document.getElementById(

"roiMoney"

).innerText =

"予算 " +

roiMoney +

"円";

}

createEntryButtons();

</script>

</body>

</html>
