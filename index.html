<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

body{

margin:0;

background:#050505;

color:white;

font-family:Arial,sans-serif;

}

header{

background:#000;

color:#d4af37;

text-align:center;

padding:25px;

font-size:32px;

font-weight:bold;

border-bottom:2px solid #d4af37;

}

.container{

padding:20px;

}

.card{

background:#151515;

border:1px solid #d4af37;

border-radius:15px;

padding:20px;

margin-bottom:20px;

}

.title{

color:#d4af37;

font-size:20px;

margin-bottom:15px;

}

select,input{

width:100%;

padding:14px;

margin-bottom:15px;

border-radius:8px;

}

button{

width:100%;

padding:16px;

background:#d4af37;

border:none;

border-radius:10px;

font-size:18px;

font-weight:bold;

}

.rank{

background:#222;

padding:12px;

margin-top:10px;

border-radius:8px;

display:flex;

justify-content:space-between;

}

.gold{

color:#d4af37;

}

</style>

</head>

<body>

<header>

🚤 BOAT HUNTER

</header>

<div class="container">

<div id="home">

<div class="card">

<div class="title">

🏟 競艇場

</div>

<select>

<option>戸田</option>

<option>平和島</option>

<option>桐生</option>

<option>住之江</option>

<option>大村</option>

</select>

<div class="title">

🏁 レース番号

</div>

<select>

<option>1R</option>

<option>6R</option>

<option>12R</option>

</select>

<div class="title">

💰 予算

</div>

<input placeholder="5000円">

<button onclick="analysis()">

AI解析開始

</button>

</div>

</div>

<div id="result" style="display:none;">

<div class="card">

<div class="title">

🔥 AI期待値ランキング

</div>

<div class="rank">

🥇 1号艇

<span>86点</span>

</div>

<div class="rank">

🥈 3号艇

<span>78点</span>

</div>

<div class="rank">

🥉 5号艇

<span>72点</span>

</div>

</div>

<div class="card">

<div class="title">

🏆 AI判定

</div>

<p>

◎ 本命：1号艇

</p>

<p>

○ 対抗：3号艇

</p>

<p>

▲ 穴馬：5号艇

</p>

</div>

<div class="card">

<div class="title">

🌊 展開予想

</div>

<p>

1号艇逃げ中心</p>

<p>

3号艇差し警戒</p>

<p>

5号艇まくり差し期待</p>

</div>

<div class="card">

<div class="title">

💰 買い目

</div>

<h3 class="gold">

的中率重視

</h3>

<p>

1-3-5<br>

1-5-3

</p>

<h3 class="gold">

回収率重視

</h3>

<p>

5-1-3<br>

3-5-1

</p>

</div>

</div>

</div>

<script>

function analysis(){

document.getElementById("home").style.display="none";

document.getElementById("result").style.display="block";

}

</script>

</body>

</html>
