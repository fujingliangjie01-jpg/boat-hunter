<script>

/* =====================================================

BOAT HUNTER

2026/08/17

===================================================== */

const API_BASE =

"https://boatraceopenapi.github.io/api/v1";

let raceData=null;

let racers=[];

let previewRacers={};

let manualCourses={};

let currentBets=null;

const BET_STORAGE_KEY=

"BOAT_HUNTER_CURRENT_BETS";

/* =====================================================

共通

===================================================== */

function n(v){

if(

v===null ||

v===undefined ||

v===""

){

return 0;

}

const x=parseFloat(

String(v)

.replace("%","")

.replace("秒","")

.replace(",","")

);

return Number.isFinite(x)

?x

:0;

}

function esc(v){

return String(v ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

/* =====================================================

資金

===================================================== */

function getBudget(){

let value=

Number(

document.getElementById("budget").value

);

if(

!Number.isFinite(value) ||

value<100

){

value=100;

}

value=

Math.floor(value/100)*100;

if(value<100){

value=100;

}

document.getElementById("budget").value=

value;

return value;

}

function formatYen(value){

return Number(value||0)

.toLocaleString("ja-JP")+"円";

}

/* =====================================================

⭐の数

===================================================== */

function getStarCount(){

const budget=

getBudget();

if(budget<=500){

return 1;

}

if(budget<=1000){

return 2;

}

if(budget<=2000){

return 3;

}

if(budget<=3000){

return 4;

}

if(budget<=5000){

return 6;

}

if(budget<=10000){

return 8;

}

if(budget<=20000){

return 10;

}

return 12;

}

/* =====================================================

カテゴリー

===================================================== */

function getBetGroups(bets){

return [

{

name:"hit",

list:bets.hit||[]

},

{

name:"escape",

list:bets.escape||[]

},

{

name:"sashi",

list:bets.sashi||[]

},

{

name:"maki",

list:bets.maki||[]

},

{

name:"makiSashi",

list:bets.makiSashi||[]

},

{

name:"under",

list:bets.under||[]

}

];

}

/* =====================================================

⭐判定

カテゴリー横断で評価。

的中率だけではなく、

逃げ

差し

まくり

まくり差し

穴目

からも候補を選ぶ。

===================================================== */

function getStarKeys(bets){

const groups=

getBetGroups(bets);

const count=

getStarCount();

const selected=[];

const selectedKeys=

new Set();

/* 各カテゴリーの代表 */

const representatives=

groups

.filter(

group=>

group.list.length>0

)

.map(

group=>{

const best=

[...group.list]

.sort(

(a,b)=>

(b.probability||0)-

(a.probability||0)

)[0];

return{

...best,

group:group.name

};

})

.sort(

(a,b)=>

(b.probability||0)-

(a.probability||0)

);

/* 最上位 */

if(representatives.length>0){

const first=

representatives[0];

selected.push(first);

selectedKeys.add(first.key);

}

/* 各カテゴリーから追加 */

for(

const item of representatives

){

if(

selected.length>=count

){

break;

}

if(

selectedKeys.has(item.key)

){

continue;

}

selected.push(item);

selectedKeys.add(item.key);

}

/* 全買い目から追加 */

if(

selected.length<count

){

const all=[];

groups.forEach(

group=>{

group.list.forEach(

item=>{

all.push({

...item,

group:group.name

});

});

});

all.sort(

(a,b)=>

(b.probability||0)-

(a.probability||0)

);

for(

const item of all

){

if(

selected.length>=count

){

break;

}

if(

selectedKeys.has(item.key)

){

continue;

}

selected.push(item);

selectedKeys.add(item.key);

}

}

return new Set(

selected.map(x=>x.key)

);

}

/* =====================================================

⭐更新

===================================================== */

function updateStars(){

if(!currentBets){

return;

}

renderBets(

currentBets

);

}

/* =====================================================

日付

===================================================== */

function todayParts(){

const parts=

new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(

new Date()

);

const year=

parts.find(

x=>x.type==="year"

).value;

const month=

parts.find(

x=>x.type==="month"

).value;

const day=

parts.find(

x=>x.type==="day"

).value;

return{

year,

yyyymmdd:

year+month+day

};

}

/* =====================================================

コース

===================================================== */

function initCourses(){

for(

let boat=1;

boat<=6;

boat++

){

const el=

document.getElementById(

"course"+boat

);

el.innerHTML="";

for(

let course=1;

course<=6;

course++

){

const option=

document.createElement(

"option"

);

option.value=course;

option.textContent=

course+"コース";

el.appendChild(option);

}

el.value=boat;

manualCourses[boat]=boat;

el.addEventListener(

"change",

function(){

manualCourses[boat]=

Number(this.value);

}

);

}

}

function resetCourses(){

for(

let boat=1;

boat<=6;

boat++

){

const el=

document.getElementById(

"course"+boat

);

el.value=boat;

manualCourses[boat]=boat;

}

document.getElementById(

"message"

).innerHTML=

`<span class="success">

🔄 進入入力をリセットしました

</span>`;

}

function getCourse(boat){

return Number(

manualCourses[boat]||boat

);

}

/* =====================================================

API

===================================================== */

async function getJSON(url){

const response=

await fetch(

url,

{

cache:"no-store"

}

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

return await response.json();

}

async function loadDailyData(){

const parts=

todayParts();

const urls=[

`${API_BASE}/${parts.year}/${parts.yyyymmdd}.json`,

`${API_BASE}/today.json`

];

let lastError=null;

for(

const url of urls

){

try{

const data=

await getJSON(url);

return{

data,

url

};

}catch(error){

lastError=error;

}

}

throw lastError||

new Error(

"APIデータ取得失敗"

);

}

/* =====================================================

レース取得

===================================================== */

function getRaceFromV1(

data,

venue,

race

){

const stadiums=

data?.programs?.stadiums;

if(!stadiums){

return null;

}

const stadium=

stadiums[String(venue)];

if(!stadium){

return null;

}

const races=

stadium.races;

if(!races){

return null;

}

return races[String(race)]||null;

}

/* =====================================================

選手

===================================================== */

function extractRacers(

race

){

const source=

race?.racers;

if(!source){

return[];

}

return Object.values(source)

.map(

(r,index)=>({

...r,

entry_number:

n(

r.entry_number||

index+1

)

})

)

.filter(

r=>

r.entry_number>=1&&

r.entry_number<=6

)

.sort(

(a,b)=>

a.entry_number-

b.entry_number

);

}

/* =====================================================

直前

===================================================== */

function getPreviewData(

race

){

return race?.preview?.racers||{};

}

function getPreview(boat){

return(

previewRacers[String(boat)]||

previewRacers[boat]||

{}

);

}

/* =====================================================

出走表

===================================================== */

async function loadRaceData(){

const venue=

Number(

document.getElementById(

"venue"

).value

);

const race=

Number(

document.getElementById(

"race"

).value

);

const message=

document.getElementById(

"message"

);

message.innerHTML=

`<span class="loading">

⏳ ${venue}場 ${race}R の出走表を取得中...

</span>`;

document.getElementById(

"raceCard"

).style.display=

"none";

document.getElementById(

"analysisCard"

).style.display=

"none";

document.getElementById(

"predictionCard"

).style.display=

"none";

try{

const result=

await loadDailyData();

const selected=

getRaceFromV1(

result.data,

venue,

race

);

if(!selected){

throw new Error(

"指定した場・レースのデータが見つかりません"

);

}

const list=

extractRacers(

selected

);

if(list.length!==6){

throw new Error(

"出走表が6艇取得できませんでした"

);

}

raceData=

selected;

racers=

list;

previewRacers=

getPreviewData(

selected

);

for(

let boat=1;

boat<=6;

boat++

){

const p=

previewRacers[String(boat)]||

previewRacers[boat]||

{};

const course=

n(p.course_number);

const el=

document.getElementById(

"course"+boat

);

if(

course>=1&&

course<=6

){

el.value=course;

manualCourses[boat]=course;

}else{

el.value=boat;

manualCourses[boat]=boat;

}

}

renderRace();

document.getElementById(

"raceCard"

).style.display=

"block";

message.innerHTML=

`<span class="success">

✅ 出走表取得成功

</span>`;

}catch(error){

console.error(error);

message.innerHTML=

`<span class="error">

❌ 出走表取得失敗

<br>

${esc(error.message)}

</span>`;

}

}

/* =====================================================

選手取得

===================================================== */

function getRacer(boat){

return racers.find(

r=>

n(r.entry_number)===boat

);

}

/* =====================================================

級別

===================================================== */

function rankName(number){

const map={

1:"A1",

2:"A2",

/* =====================================================

===================================================== */

function scoreBoat(boat){

const r=

getRacer(boat);

if(!r)

return 0;

const p=

getPreview(boat);

const course=

getCourse(boat);

let score=0;

score+=

n(r.national_win_rate)*7;

score+=

n(r.local_win_rate)*4;

score+=

n(r.national_top_2_percent)*0.12;

score+=

n(r.motor_top_2_percent)*0.15;

const avgST=

n(

r.average_start_timing

);

if(avgST>0){

score+=

Math.max(

0,

0.30-avgST

)*20;

}

const st=

n(

p.start_timing

);

if(st>0){

score+=

Math.max(

0,

0.25-st

)*15;

}

const exhibition=

n(

p.exhibition_time

);

if(exhibition>0){

score+=

Math.max(

0,

6.80-exhibition

)*5;

}

const courseBonus={

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

};

score+=

courseBonus[course]||0;

const rank=

rankName(

r.rank_number

);

if(rank==="A1")

score+=5;

if(rank==="A2")

score+=2;

if(rank==="B2")

score-=2;

return Math.max(

0,

score

);

}

/* =====================================================

候補生成

===================================================== */

function makeCandidate(

a,

b,

rankings,

type

){

if(a===b)

return null;

const A=

rankings.find(

x=>x.boat===a

);

const B=

rankings.find(

x=>x.boat===b

);

if(!A||!B)

return null;

let raw=

A.score*1.35+

B.score*0.75;

if(type==="escape"){

if(getCourse(a)!==1)

return null;

raw+=25;

}

if(type==="sashi"){

if(getCourse(a)===1)

return null;

raw+=10;

}

if(type==="maki"){

if(getCourse(a)===1)

return null;

raw+=8;

}

if(type==="makiSashi"){

if(getCourse(a)===1)

return null;

raw+=10;

}

if(

getCourse(a)===1

){

raw+=8;

}

return{

key:

`${a}-${b}`,

a,

b,

raw:

Math.max(

0.01,

raw

)

};

}

/* =====================================================

POOL

===================================================== */

function makePool(

rankings,

type

){

const pool=[];

for(

let a=1;

a<=6;

a++

){

for(

let b=1;

b<=6;

b++

){

const x=

makeCandidate(

a,

b,

rankings,

type

);

if(x){

pool.push(x);

}

}

}

return pool.sort(

(a,b)=>

b.raw-a.raw

);

}

/* =====================================================

買い目作成

===================================================== */

function buildBets(

rankings

){

const result={

hit:[],

escape:[],

sashi:[],

maki:[],

makiSashi:[],

under:[]

};

const used=

new Set();

const allHit=[];

[

"escape",

"sashi",

"maki",

"makiSashi"

].forEach(

type=>{

allHit.push(

...makePool(

rankings,

type

)

);

});

allHit.sort(

(a,b)=>

b.raw-a.raw

);

for(

const x of allHit

){

if(

result.hit.length>=4

)

break;

if(

used.has(x.key)

)

continue;

result.hit.push(x);

used.add(x.key);

}

/* =====================================================

回収率重視は3点

===================================================== */

const types=[

"escape",

"sashi",

"maki",

"makiSashi"

];

types.forEach(

type=>{

const pool=

makePool(

rankings,

type

);

for(

const x of pool

){

if(

result[type].length>=3

)

break;

if(

used.has(x.key)

)

continue;

result[type].push(x);

used.add(x.key);

}

});

/* =====================================================

穴目

===================================================== */

const first=

rankings.find(

x=>x.boat===1

);

for(

let boat=2;

boat<=6;

boat++

){

const target=

rankings.find(

x=>x.boat===boat

);

if(!target)

continue;

if(

target.score<

(first?.score||0)-10

){

const x={

key:

`${boat}-1`,

a:boat,

b:1,

raw:

scoreBoat(boat)+20

};

if(

!used.has(x.key)

){

result.under.push(x);

}

}

}

result.under=

result.under

.sort(

(a,b)=>

b.raw-a.raw

)

.slice(0,2);

/* =====================================================

確率

===================================================== */

const all=[

...result.hit,

...result.escape,

...result.sashi,

...result.maki,

...result.makiSashi,

...result.under

];

const totalRaw=

all.reduce(

(sum,x)=>

sum+x.raw,

0

);

if(totalRaw>0){

all.forEach(

x=>{

x.probability=

x.raw/

totalRaw*

100;

});

}

result.total=

all.reduce(

(sum,x)=>

sum+

(x.probability||0),

0

);

return result;

}

function renderPicks(

group=>{

group.list.forEach(

x=>{

all.push(x);

});

});

/* 最高確率 */

const maxProbability=

all.length

?

Math.max(

...all.map(

x=>x.probability||0

)

)

:0;

/*

最高確率の80%以上

→ 高期待度として赤表示

*/

el.innerHTML=

list.map(

x=>{

const probability=

x.probability||0;

const isLow=

probability<5;

const isHigh=

maxProbability>0&&

probability>=

maxProbability*0.80;

const rowClass=

isLow

?

"pick lowProbRow"

:

"pick";

let probClass=

"prob";

if(isLow){

probClass+=

" lowProb";

}else if(isHigh){

probClass+=

" highProb";

}

return`

<div class="${rowClass}">

starKeys.has(x.key)

?

"⭐"

:

""

}

</strong>

${probability.toFixed(1)}%

</span>

}

).join("");

}
