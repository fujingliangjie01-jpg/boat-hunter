<script>

/* =========================================================

   基本設定

========================================================= */

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

let raceData=null;

let racers=[];

let preview={};

let history={};

let manualCourses={};

/* =========================================================

   共通

========================================================= */

function n(v){

if(v===null||v===undefined||v==="")return 0;

const x=parseFloat(

String(v)

.replace("%","")

.replace("秒","")

.replace(",","")

);

return Number.isFinite(x)?x:0;

}

function esc(v){

return String(v??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;");

}

function today(){

const d=new Date();

const parts=new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(d);

return(

parts.find(x=>x.type==="year").value+

parts.find(x=>x.type==="month").value+

parts.find(x=>x.type==="day").value

);

}

function previousDate(base,days){

const y=n(base.slice(0,4));

const m=n(base.slice(4,6))-1;

const d=n(base.slice(6,8));

const date=new Date(Date.UTC(y,m,d));

date.setUTCDate(date.getUTCDate()-days);

return(

date.getUTCFullYear()+

String(date.getUTCMonth()+1).padStart(2,"0")+

String(date.getUTCDate()).padStart(2,"0")

);

}

/* =========================================================

   進入

========================================================= */

function initCourses(){

for(let b=1;b<=6;b++){

const el=document.getElementById("course"+b);

el.innerHTML="";

for(let c=1;c<=6;c++){

const op=document.createElement("option");

op.value=c;

op.textContent=c+"コース";

el.appendChild(op);

}

el.value=b;

manualCourses[b]=b;

el.onchange=()=>{

manualCourses[b]=Number(el.value);

};

}

}

function getCourse(boat){

return Number(manualCourses[boat]||boat);

}

/* =========================================================

   API取得

   URL形式を複数試して出走表取得を壊さない

========================================================= */

async function getJSON(url){

const r=await fetch(

url,

{

cache:"no-store"

}

);

if(!r.ok){

throw new Error("HTTP "+r.status);

}

return await r.json();

}

async function tryJSON(urls){

let lastError=null;

for(const url of urls){

try{

const data=await getJSON(url);

return{

data,

url

};

}catch(e){

lastError=e;

}

}

throw lastError||new Error("API取得失敗");

}

/* =========================================================

   再帰検索

========================================================= */

function findRace(data,venue,race){

if(!data)return null;

function search(obj){

if(!obj||typeof obj!=="object")return null;

const raceNo=

obj.race_number||

obj.raceNo||

obj.race_no||

obj.race;

if(

raceNo!==undefined &&

Number(raceNo)===Number(race)

){

if(

obj.racers||

obj.entries||

obj.program||

obj.players

){

return obj;

}

}

if(

obj.racers||

obj.entries||

obj.players

){

let list=

obj.racers||

obj.entries||

obj.players;

if(!Array.isArray(list)){

list=Object.values(list);

}

if(list.length>=6){

return obj;

}

}

for(const key of Object.keys(obj)){

if(

obj[key] &&

typeof obj[key]==="object"

){

const found=search(obj[key]);

if(found)return found;

}

}

return null;

}

return search(data);

}

/* =========================================================

   選手配列抽出

========================================================= */

function extractRacers(data){

if(!data)return[];

let list=

data.racers||

data.entries||

data.players||

data.program?.racers||

data.program?.entries||

data.program?.players||

data.data?.racers||

data.data?.entries||

data.data?.players||

[];

if(!Array.isArray(list)){

list=Object.values(list);

}

return list.map((r,i)=>{

const copy={...r};

copy.entry_number=n(

r.entry_number||

r.boat_number||

r.boat||

r.number_boat||

i+1

);

return copy;

})

.filter(r=>

r.entry_number>=1 &&

r.entry_number<=6

)

.sort(

(a,b)=>a.entry_number-b.entry_number

);

}

/* =========================================================

   出走表取得

========================================================= */

async function loadRaceData(){

const venue=

document.getElementById("venue").value;

const race=

document.getElementById("race").value;

const msg=

document.getElementById("message");

msg.innerHTML="⏳ 出走表を取得中...";

try{

const date=today();

const urls=[

`${API_V3}/${date}/${venue}/${race}.json`,

`${API_V3}/${date}/${venue}/${race}`,

`${API_V2}/${date}/${venue}/${race}.json`,

`${API_V2}/${date}/${venue}/${race}`

];

const result=await tryJSON(urls);

let data=result.data;

let selected=findRace(data,venue,race)||data;

let list=extractRacers(selected);

if(list.length!==6){

const nested=findRace(data,venue,race);

if(nested){

list=extractRacers(nested);

selected=nested;

}

}

if(list.length!==6){

throw new Error(

"6艇の出走表データを確認できませんでした"

);

}

raceData=selected;

racers=list;

preview=

selected.preview?.racers||

selected.preview||

selected.before_race||

{};

for(let b=1;b<=6;b++){

const el=document.getElementById("course"+b);

el.value=b;

manualCourses[b]=b;

}

renderRace();

document.getElementById("raceCard").style.display="block";

msg.innerHTML=

"✅ 出走表取得成功";

}catch(e){

console.error(e);

document.getElementById("raceCard").style.display="none";

msg.innerHTML=

"❌ 出走表取得失敗<br>"+

esc(e.message);

}

}

/* =========================================================

   選手情報

========================================================= */

function getRacer(boat){

return racers.find(

r=>n(r.entry_number)===boat

);

}

function getPreview(boat){

return(

preview[boat]||

preview[String(boat)]||

{}

);

}

function rank(r){

return String(

r.rank||

r.class||

r.grade||

""

);

}

/* =========================================================

   出走表表示

========================================================= */

function renderRace(){

const box=document.getElementById("racers");

box.innerHTML="";

racers.forEach(r=>{

const b=n(r.entry_number);

const p=getPreview(b);

box.innerHTML+=`

<div class="racer">

<div class="racerTop">

<div class="number n${b}">

${b}

</div>

<div class="racerName">

${esc(

r.name||

r.racer_name||

r.player_name||

"-"

)}

</div>

</div>

<div class="small">

級別：

${esc(rank(r)||"-")}

<br>

登録番号：

${esc(

r.number||

r.racer_number||

r.register_number||

"-"

)}

<br>

全国勝率：

${n(

r.national_win_rate||

r.win_rate||

r.national_win

).toFixed(2)}

<br>

当地勝率：

${n(

r.local_win_rate||

r.local_win

).toFixed(2)}

<br>

モーター2連率：

${n(

r.motor_top_2_percent||

r.motor_2rentai||

r.motor_2_rate

).toFixed(1)}%

</div>

<div class="tech">

<div>

<span>今回進入</span>

${getCourse(b)}

</div>

<div>

<span>モーター</span>

${esc(

r.motor_number||

r.motor||

"-"

)}

</div>

<div>

<span>平均ST</span>

${n(

r.average_start_timing||

r.average_st

).toFixed(2)}

</div>

<div>

<span>直前ST</span>

${n(

p.start_timing||

p.st

).toFixed(2)}

</div>

<div>

<span>展示</span>

${n(

p.exhibition_time||

p.exhibition

).toFixed(2)}

</div>

<div>

<span>当地2連</span>

${n(

r.local_top_2_percent||

r.local_2_rate

).toFixed(1)}%

</div>

</div>

</div>

`;

});

}

/* =========================================================

   過去データ

========================================================= */

async function loadHistory(){

history={};

const base=today();

for(let b=1;b<=6;b++){

history[b]=[];

const racer=getRacer(b);

if(!racer)continue;

const targetNumber=String(

racer.number||

racer.racer_number||

racer.register_number||

""

);

const targetCourse=getCourse(b);

for(let d=1;d<=120;d++){

if(history[b].length>=10)break;

const date=previousDate(base,d);

const urls=[

`${API_V3}/${date}.json`,

`${API_V3}/${date}`,

`${API_V2}/${date}.json`,

`${API_V2}/${date}`

];

let data=null;

try{

const result=await tryJSON(urls);

data=result.data;

}catch(e){

continue;

}

const found=findPastRaces(

data,

targetNumber,

targetCourse

);

for(const x of found){

if(history[b].length>=10)break;

const duplicate=history[b].some(

y=>

y.date===x.date &&

y.race===x.race

);

if(!duplicate){

history[b].push(x);

}

}

}

}

renderHistory();

}

/* =========================================================

   過去レース検索

========================================================= */

function findPastRaces(data,number,course){

const result=[];

function walk(obj){

if(

!obj ||

typeof obj!=="object"

)return;

const racersObj=

obj.racers||

obj.entries||

obj.players||

obj.program?.racers||

obj.program?.entries;

const resultObj=

obj.result||

obj.results||

obj.race_result||

obj.program?.result||

obj.program?.results;

if(racersObj){

let rs=Array.isArray(racersObj)

?racersObj

:Object.values(racersObj);

const r=rs.find(x=>

String(

x.number||

x.racer_number||

x.register_number||

x.player_number||

""

)===number

);

if(r){

const boat=n(

r.entry_number||

r.boat_number||

r.boat

);

let resultList=[];

if(resultObj){

resultList=Array.isArray(resultObj)

?resultObj

:Object.values(resultObj);

}

let rr=resultList.find(x=>

n(

x.entry_number||

x.boat_number||

x.boat

)===boat

);

if(!rr){

rr=resultList.find(x=>

String(

x.number||

x.racer_number||

x.register_number||

""

)===number

);

}

const c=n(

rr?.course_number||

rr?.course||

rr?.entry_course||

r.course_number||

r.course

);

if(c===course){

const technique=n(

rr?.technique_number||

rr?.winning_technique||

rr?.decision_number||

rr?.winning_method||

rr?.technique||

r.technique_number||

r.winning_technique

);

const place=n(

rr?.place_number||

rr?.rank||

rr?.arrival||

rr?.result

);

result.push({

date:

obj.date||

obj.race_date||

obj.racedate||

"",

race:

obj.race_number||

obj.raceNo||

obj.race_no||

"",

course:c,

place:place,

technique:technique

});

}

}

}

for(const k of Object.keys(obj)){

if(

obj[k] &&

typeof obj[k]==="object"

){

walk(obj[k]);

}

}

}

walk(data);

return result;

}

/* =========================================================

   決まり手

========================================================= */

function techniqueName(t){

if(t===1)return"逃げ";

if(t===2)return"差し";

if(t===3)return"まくり";

if(t===4)return"まくり差し";

if(t===5)return"抜き";

if(t===6)return"恵まれ";

return"不明";

}

function methodStats(boat){

const rows=history[boat]||[];

const total=rows.length;

let escape=0;

let sashi=0;

let maki=0;

let makiSashi=0;

rows.forEach(x=>{

/*

 逃げは1コース限定

*/

if(

x.course===1 &&

x.technique===1

){

escape++;

}

/*

 2〜6コース

*/

if(

x.course>=2 &&

x.technique===2

){

sashi++;

}

if(

x.course>=2 &&

x.technique===3

){

maki++;

}

if(

x.course>=2 &&

x.technique===4

){

makiSashi++;

}

});

const pct=v=>

total?v/total*100:0;

return{

total,

escape:pct(escape),

sashi:pct(sashi),

maki:pct(maki),

makiSashi:pct(makiSashi)

};

}

/* =========================================================

   1号艇まくられ率

========================================================= */

function firstBoatInfo(){

const rows=history[1]||[];

let escape=0;

let maru=0;

rows.forEach(x=>{

if(x.course!==1)return;

if(x.technique===1){

escape++;

}else if(

x.technique===2 ||

x.technique===3 ||

x.technique===4

){

maru++;

}

});

const total=rows.length;

if(total){

return{

escape:escape/total*100,

maru:maru/total*100

};

}

return{

escape:0,

maru:0

};

}

/* =========================================================

   AI評価

========================================================= */

function scoreBoat(b){

const r=getRacer(b);

if(!r)return 0;

const course=getCourse(b);

const s=methodStats(b);

let score=0;

score+=n(

r.national_win_rate||

r.win_rate||

r.national_win

)*7;

score+=n(

r.local_win_rate||

r.local_win

)*4;

score+=n(

r.motor_top_2_percent||

r.motor_2_rate

)*.15;

const st=n(

r.average_start_timing||

r.average_st

);

if(st>0){

score+=Math.max(

0,

.30-st

)*20;

}

const courseBonus={

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

};

score+=courseBonus[course]||0;

/*

 決まり手は「今回の進入コース」

 の実績を評価

*/

score+=s.escape*.15;

score+=s.sashi*.12;

score+=s.maki*.12;

score+=s.makiSashi*.15;

if(

String(rank(r))

.toUpperCase()

.includes("A1")

){

score+=5;

}

if(

String(rank(r))

.toUpperCase()

.includes("B2")

){

score-=2;

}

return Math.max(0,score);

}

/* =========================================================

   2連単候補

========================================================= */

function candidate(a,b,method,rankings){

if(a===b)return null;

const A=rankings.find(

x=>x.boat===a

);

const B=rankings.find(

x=>x.boat===b

);

if(!A||!B)return null;

const sa=methodStats(a);

const sb=methodStats(b);

let raw=

A.score*1.25+

B.score*.75;

/*

 逃げ

 1コースからのみ

*/

if(method==="escape"){

if(getCourse(a)!==1)return null;

raw+=sa.escape*1.2;

}

/*

 差し

 2〜6コース

*/

if(method==="sashi"){

if(getCourse(a)===1)return null;

raw+=sa.sashi*1.1;

}

/*

 まくり

 2〜6コース

*/

if(method==="maki"){

if(getCourse(a)===1)return null;

raw+=sa.maki*1.1;

}

/*

 まくり差し

 単独1着のような扱いを避けるため、

 実績が一定以上あるものだけ

*/

if(method==="makiSashi"){

if(getCourse(a)===1)return null;

if(sa.makiSashi<5)return null;

raw+=sa.makiSashi*1.3;

}

/*

 2着艇にも決まり手実績を少し反映

*/

raw+=

(

sb.sashi+

sb.maki+

sb.makiSashi

)*.05;

return{

key:`${a}-${b}`,

a,

b,

raw:Math.max(.01,raw)

};

}

/* =========================================================

   プール

========================================================= */

function makePool(method,rankings){

const arr=[];

for(let a=1;a<=6;a++){

for(let b=1;b<=6;b++){

const x=

candidate(

a,

b,

method,

rankings

);

if(x)arr.push(x);

}

}

return arr.sort(

(a,b)=>b.raw-a.raw

);

}

/* =========================================================

   買い目生成

========================================================= */

function buildBets(rankings){

const used=new Set();

const result={};

const all=[];

/*

 除外候補

*/

const topScore=rankings[0]?.score||0;

const excluded=new Set(

rankings

.filter(

(x,i)=>

i>=3 &&

topScore-x.score>=15

)

.map(x=>x.boat)

);

/*

 的中重視

*/

result.hit=[];

const hitCandidates=[];

[

"escape",

"sashi",

"maki",

"makiSashi"

].forEach(method=>{

hitCandidates.push(

...makePool(method,rankings)

);

});

hitCandidates.sort(

(a,b)=>b.raw-a.raw

);

for(const x of hitCandidates){

if(result.hit.length>=4)break;

if(used.has(x.key))continue;

if(

excluded.has(x.a) ||

excluded.has(x.b)

)continue;

result.hit.push(x);

used.add(x.key);

all.push(x);

}

/*

 回収重視

 各4点

*/

const methods=[

["escape","escape"],

["sashi","sashi"],

["maki","maki"],

["makiSashi","makiSashi"]

];

methods.forEach(

([name,method])=>{

result[name]=[];

const pool=

makePool(method,rankings);

for(const x of pool){

if(result[name].length>=4)break;

if(used.has(x.key))continue;

if(

excluded.has(x.a) ||

excluded.has(x.b)

)continue;

result[name].push(x);

used.add(x.key);

all.push(x);

}

});

/*

 穴目

*/

result.under=[];

const first=firstBoatInfo();

for(let b=2;b<=6;b++){

if(excluded.has(b))continue;

const s=methodStats(b);

/*

 1号艇のまくられ率が高く、

 後ろ艇の決まり手実績がある場合

*/

if(

first.maru>=30 &&

(

s.maki>=10 ||

s.makiSashi>=10 ||

s.sashi>=15

)

){

const key=`${b}-1`;

if(!used.has(key)){

let raw=scoreBoat(b);

raw+=first.maru*.5;

raw+=s.maki*.7;

raw+=s.makiSashi*.9;

raw+=s.sashi*.5;

let reason="";

if(s.makiSashi>=10){

reason=

`${b}号艇のまくり差し実績＋1号艇まくられ率`;

}else if(s.maki>=10){

reason=

`${b}号艇のまくり実績＋1号艇まくられ率`;

}else{

reason=

`${b}号艇の差し実績＋1号艇まくられ率`;

}

result.under.push({

key,

a:b,

b:1,

raw,

reason

});

}

}

}

result.under.sort(

(a,b)=>b.raw-a.raw

);

result.under=result.under.slice(0,2);

result.under.forEach(x=>{

used.add(x.key);

all.push(x);

});

/*

 全買い目を100%

*/

const totalRaw=

all.reduce(

(sum,x)=>sum+x.raw,

0

);

if(totalRaw>0){

all.forEach(x=>{

x.probability=

x.raw/totalRaw*100;

});

}

/*

 丸め誤差を最後の買い目で補正

*/

if(all.length){

let total=

all.reduce(

(sum,x)=>

sum+x.probability,

0

);

all[all.length-1].probability+=

100-total;

}

result.all=all;

result.total=

all.reduce(

(sum,x)=>

sum+x.probability,

0

);

return result;

}
