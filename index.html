<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  background:#080808;

  color:#fff;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

header{

  background:linear-gradient(135deg,#080808,#181818);

  border-bottom:1px solid #b08d32;

  padding:18px 14px;

  text-align:center;

}

.logo{

  color:#d4af37;

  font-size:28px;

  font-weight:900;

  letter-spacing:2px;

}

.sub{

  color:#aaa;

  font-size:11px;

  margin-top:4px;

}

.container{

  max-width:900px;

  margin:auto;

  padding:14px;

}

.card{

  background:#111;

  border:1px solid #333;

  border-radius:12px;

  padding:15px;

  margin-bottom:14px;

  box-shadow:0 4px 18px rgba(0,0,0,.35);

}

.title{

  color:#d4af37;

  font-size:17px;

  font-weight:800;

  margin-bottom:12px;

}

label{

  display:block;

  color:#bbb;

  font-size:12px;

  margin-bottom:5px;

}

select,

input{

  width:100%;

  background:#191919;

  color:#fff;

  border:1px solid #444;

  border-radius:8px;

  padding:11px;

  font-size:15px;

  outline:none;

}

select:focus,

input:focus{

  border-color:#d4af37;

}

.grid2{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

button{

  width:100%;

  border:0;

  border-radius:9px;

  padding:13px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

}

.mainBtn{

  background:linear-gradient(135deg,#d4af37,#8d6b18);

  color:#080808;

}

.subBtn{

  background:#242424;

  color:#fff;

  border:1px solid #555;

}

button:disabled{

  opacity:.45;

}

.status{

  padding:10px;

  background:#171717;

  border-radius:8px;

  font-size:12px;

  color:#bbb;

  margin-top:10px;

  white-space:pre-line;

}

.api{

  font-size:11px;

  color:#888;

  line-height:1.7;

}

.raceHeader{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

}

.raceTitle{

  color:#d4af37;

  font-size:20px;

  font-weight:900;

}

.badge{

  display:inline-block;

  padding:4px 7px;

  border-radius:5px;

  background:#222;

  color:#bbb;

  font-size:10px;

  margin:2px;

}

.racers{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:9px;

}

.racer{

  background:#181818;

  border:1px solid #333;

  border-radius:10px;

  padding:10px;

}

.racerTop{

  display:flex;

  align-items:center;

  gap:8px;

}

.number{

  width:28px;

  height:28px;

  border-radius:5px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-weight:900;

  color:#111;

}

.n1{background:#fff;}

.n2{background:#222;color:#fff;border:1px solid #777;}

.n3{background:#e33;color:#fff;}

.n4{background:#1680d8;color:#fff;}

.n5{background:#f1d72d;color:#111;}

.n6{background:#42a85f;color:#fff;}

.name{

  font-weight:800;

  font-size:14px;

}

.rank{

  color:#d4af37;

  font-size:11px;

}

.stats{

  margin-top:8px;

  font-size:11px;

  line-height:1.7;

  color:#bbb;

}

.score{

  margin-top:7px;

  color:#d4af37;

  font-size:17px;

  font-weight:900;

}

.entryBox{

  display:grid;

  grid-template-columns:repeat(6,1fr);

  gap:5px;

}

.entryBtn{

  background:#222;

  border:1px solid #444;

  color:#fff;

  padding:9px 3px;

  font-size:12px;

}

.entryBtn.active{

  background:#d4af37;

  color:#111;

  border-color:#d4af37;

}

.forecast{

  background:#151515;

  border-left:4px solid #d4af37;

  padding:12px;

  border-radius:7px;

  line-height:1.8;

  font-size:13px;

}

.pickBox{

  background:linear-gradient(135deg,#151515,#0d0d0d);

  border:1px solid #4c3c14;

  border-radius:10px;

  padding:13px;

  margin-top:10px;

}

.pickTitle{

  color:#d4af37;

  font-weight:900;

  margin-bottom:8px;

}

.pick{

  font-size:18px;

  font-weight:900;

  letter-spacing:1px;

  margin:7px 0;

}

.reason{

  color:#aaa;

  font-size:11px;

  line-height:1.7;

}

.big{

  color:#fff;

  font-size:24px;

  font-weight:900;

}

.hidden{

  display:none;

}

.warning{

  color:#ff7777;

}

.good{

  color:#70d070;

}

.gold{

  color:#d4af37;

}

@media(max-width:600px){

  .racers{

    grid-template-columns:1fr;

  }

  .grid2{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<header>

  <div class="logo">BOAT HUNTER</div>

  <div class="sub">AI BOAT RACE PREDICTION SYSTEM © 2026</div>

</header>

<div class="container">

  <div class="card">

    <div class="title">レース選択</div>

    <div class="grid2">

      <div>

        <label>競艇場</label>

        <select id="stadium"></select>

      </div>

      <div>

        <label>レース</label>

        <select id="raceNo">

          <option value="1">1R</option>

          <option value="2">2R</option>

          <option value="3">3R</option>

          <option value="4">4R</option>

          <option value="5">5R</option>

          <option value="6">6R</option>

          <option value="7">7R</option>

          <option value="8">8R</option>

          <option value="9">9R</option>

          <option value="10">10R</option>

          <option value="11">11R</option>

          <option value="12">12R</option>

        </select>

      </div>

    </div>

    <div style="margin-top:10px;">

      <label>予算</label>

      <input id="budget" type="number" value="3000" min="100">

    </div>

    <div style="margin-top:10px;" class="grid2">

      <button class="mainBtn" onclick="loadRace()">

        出走表を取得

      </button>

      <button class="subBtn" onclick="runAnalysis()">

        AI解析開始

      </button>

    </div>

    <div id="status" class="status">

      レースを選択して「出走表を取得」を押してください。

    </div>

  </div>

  <div id="raceArea" class="hidden">

    <div class="card">

      <div class="raceHeader">

        <div>

          <div class="raceTitle" id="raceTitle">---</div>

          <div id="raceMeta"></div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="title">進入予想</div>

      <div class="entryBox" id="entryButtons"></div>

      <div style="margin-top:10px;" class="forecast" id="entryText">

        進入を設定してください。

      </div>

    </div>

    <div class="card">

      <div class="title">出走表・AI評価</div>

      <div class="racers" id="racers"></div>

    </div>

    <div class="card">

      <div class="title">展開予想</div>

      <div class="forecast" id="forecast">

        AI解析待機中

      </div>

    </div>

    <div id="resultArea" class="hidden">

      <div class="card">

        <div class="title">AI期待値ランキング</div>

        <div id="ranking"></div>

      </div>

      <div class="card">

        <div class="title">🎯 的中率重視</div>

        <div class="pickBox">

          <div class="pickTitle">本線</div>

          <div id="hitPicks"></div>

          <div class="reason" id="hitReason"></div>

        </div>

      </div>

      <div class="card">

        <div class="title">💰 回収率重視</div>

        <div class="pickBox">

          <div class="pickTitle">期待値狙い</div>

          <div id="roiPicks"></div>

          <div class="reason" id="roiReason"></div>

        </div>

      </div>

      <div class="card">

        <div class="title">🔥 穴狙い</div>

        <div class="pickBox">

          <div class="pickTitle">高配当候補</div>

          <div id="holePicks"></div>

          <div class="reason" id="holeReason"></div>

        </div>

      </div>

      <div class="card">

        <div class="title">買い目配分</div>

        <div id="budgetResult"></div>

      </div>

    </div>

    <div class="card">

      <div class="title">API情報</div>

      <div id="apiInfo" class="api">---</div>

    </div>

  </div>

</div>

<script>

const API_V3 =

  "https://boatraceopenapi.github.io/programs/v3";

const API_V2 =

  "https://boatraceopenapi.github.io/programs/v2";

const STADIUMS = [

  ["桐生",1],

  ["戸田",2],

  ["江戸川",3],

  ["平和島",4],

  ["多摩川",5],

  ["浜名湖",6],

  ["蒲郡",7],

  ["常滑",8],

  ["津",9],

  ["三国",10],

  ["びわこ",11],

  ["住之江",12],

  ["尼崎",13],

  ["鳴門",14],

  ["丸亀",15],

  ["児島",16],

  ["宮島",17],

  ["徳山",18],

  ["下関",19],

  ["若松",20],

  ["芦屋",21],

  ["福岡",22],

  ["唐津",23],

  ["大村",24]

];

let raceData = null;

let racers = [];

let entryOrder = [1,2,3,4,5,6];

let usedApi = "";

const stadium = document.getElementById("stadium");

STADIUMS.forEach(x=>{

  const op = document.createElement("option");

  op.value = x[1];

  op.textContent = x[0];

  stadium.appendChild(op);

});

function todayJP(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function setStatus(text){

  document.getElementById("status").textContent = text;

}

function num(v){

  if(v === null || v === undefined || v === "") return 0;

  const n = parseFloat(

    String(v)

      .replace("%","")

      .replace(",","")

  );

  return isNaN(n) ? 0 : n;

}

function first(obj, keys, def=0){

  if(!obj) return def;

  for(const key of keys){

    if(

      obj[key] !== undefined &&

      obj[key] !== null &&

      obj[key] !== ""

    ){

      return obj[key];

    }

  }

  return def;

}

function normalizeRacer(r, i){

  const course = Number(first(r,[

    "course",

    "courseNumber",

    "entry",

    "boatNumber",

    "waku"

  ],i+1));

  const name = first(r,[

    "name",

    "racerName",

    "playerName",

    "fullName"

  ],`選手${i+1}`);

  const rank = first(r,[

    "rank",

    "class",

    "racerClass"

  ],"B1");

  const national =

    num(first(r,[

      "nationalWinRate",

      "national_win_rate",

      "winRate",

      "nationWinRate"

    ],0));

  const local =

    num(first(r,[

      "localWinRate",

      "local_win_rate",

      "localRate"

    ],0));

  const motor2 =

    num(first(r,[

      "motor2Rate",

      "motorSecondRate",

      "motor2",

      "motorWinRate2"

    ],0));

  const motor3 =

    num(first(r,[

      "motor3Rate",

      "motorThirdRate",

      "motor3",

      "motorWinRate3"

    ],0));

  const st =

    num(first(r,[

      "ST",

      "st",

      "startTime",

      "averageST"

    ],0));

  const exhibition =

    num(first(r,[

      "exhibitionTime",

      "exhibition",

      "tenjiTime"

    ],0));

  const motorNo =

    first(r,[

      "motorNumber",

      "motorNo",

      "motor"

    ],"-");

  return {

    raw:r,

    course,

    name,

    rank,

    national,

    local,

    motor2,

    motor3,

    st,

    exhibition,

    motorNo,

    score:0

  };

}

function findRace(data, stadiumNo, raceNo){

  if(!data) return null;

  if(Array.isArray(data)){

    for(const item of data){

      const found = findRace(

        item,

        stadiumNo,

        raceNo

      );

      if(found) return found;

    }

    return null;

  }

  if(typeof data !== "object") return null;

  const s = Number(

    first(data,[

      "stadiumNumber",

      "stadiumNo",

      "venueNumber",

      "jyo",

      "stadium"

    ],-1)

  );

  const r = Number(

    first(data,[

      "raceNumber",

      "raceNo",

      "race"

    ],-1)

  );

  if(s === Number(stadiumNo) &&

     r === Number(raceNo)){

    return data;

  }

  for(const key of Object.keys(data)){

    const value = data[key];

    if(

      value &&

      typeof value === "object"

    ){

      const found =

        findRace(

          value,

          stadiumNo,

          raceNo

        );

      if(found) return found;

    }

  }

  return null;

}

function extractRacers(race){

  if(!race) return [];

  let arr =

    race.racers ||

    race.entries ||

    race.program ||

    race.players ||

    race.boats ||

    race.racerList;

  if(!Array.isArray(arr)){

    for(const key of Object.keys(race)){

      if(Array.isArray(race[key])){

        const a = race[key];

        if(

          a.length >= 6 &&

          a.some(x =>

            typeof x === "object"

          )

        ){

          arr = a;

          break;

        }

      }

    }

  }

  if(!Array.isArray(arr)) return [];

  return arr

    .slice(0,6)

    .map((r,i)=>normalizeRacer(r,i));

}

async function fetchJSON(url){

  const response =

    await fetch(url,{

      method:"GET",

      cache:"no-store"

    });

  if(!response.ok){

    throw new Error(

      "HTTP "+response.status

    );

  }

  return await response.json();

}

async function getRace(){

  const stadiumNo =

    Number(stadium.value);

  const raceNo =

    Number(document.getElementById("raceNo").value);

  const date =

    todayJP();

  const urls = [

    `${API_V3}/${date}/${stadiumNo}`,

    `${API_V3}/${date}`,

    `${API_V3}`,

  ];

  for(const url of urls){

    try{

      const data =

        await fetchJSON(url);

      const race =

        findRace(

          data,

          stadiumNo,

          raceNo

        );

      if(race){

        usedApi = "V3";

        return race;

      }

    }catch(e){}

  }

  const urls2 = [

    `${API_V2}/${date}/${stadiumNo}`,

    `${API_V2}/${date}`,

    `${API_V2}`,

  ];

  for(const url of urls2){

    try{

      const data =

        await fetchJSON(url);

      const race =

        findRace(

          data,

          stadiumNo,

          raceNo

        );

      if(race){

        usedApi = "V2";

        return race;

      }

    }catch(e){}

  }

  throw new Error(

    "V3/V2の両APIから該当レースを取得できませんでした。"

  );

}

async function loadRace(){

  const btn =

    document.querySelector(".mainBtn");

  btn.disabled = true;

  setStatus(

    "出走表を取得中...\n"+

    "V3 → V2 の順で確認しています。"

  );

  document

    .getElementById("resultArea")

    .classList.add("hidden");

  try{

    raceData =

      await getRace();

    racers =

      extractRacers(raceData);

    if(racers.length < 6){

      throw new Error(

        "選手データを6艇取得できませんでした。"

      );

    }

    racers.forEach((r,i)=>{

      r.course = i+1;

    });

    entryOrder =

      [1,2,3,4,5,6];

    renderEntryButtons();

    renderRace();

    document

      .getElementById("raceArea")

      .classList.remove("hidden");

    setStatus(

      "出走表取得成功！\n"+

      "AI解析開始ボタンを押してください。"

    );

  }catch(e){

    console.error(e);

    setStatus(

      "❌ 出走表取得失敗\n\n"+

      e.message

    );

  }finally{

    btn.disabled = false;

  }

}

function renderRace(){

  const sName =

    stadium.options[stadium.selectedIndex]

      .textContent;

  const raceNo =

    document.getElementById("raceNo").value;

  document.getElementById("raceTitle")

    .textContent =

    `${sName} ${raceNo}R`;

  document.getElementById("raceMeta")

    .innerHTML =

    `<span class="badge">API ${usedApi}</span>

     <span class="badge">${todayJP()}</span>`;

  renderRacers();

  document.getElementById("apiInfo")

    .innerHTML =

    `使用API：${usedApi}<br>

     日付：${todayJP()}<br>

     場番号：${stadium.value}<br>

     レース：${raceNo}R<br>

     選手数：${racers.length}艇`;

}

function renderRacers(){

  const area =

    document.getElementById("racers");

  area.innerHTML = "";

  racers.forEach((r,i)=>{

    const div =

      document.createElement("div");

    div.className = "racer";

    div.innerHTML = `

      <div class="racerTop">

        <div class="number n${i+1}">

          ${i+1}

        </div>

        <div>

          <div class="name">

            ${escapeHTML(r.name)}

          </div>

          <div class="rank">

            ${escapeHTML(String(r.rank))}

          </div>

        </div>

      </div>

      <div class="stats">

        全国勝率：

        <b>${r.national.toFixed(2)}</b><br>

        当地勝率：

        <b>${r.local.toFixed(2)}</b><br>

        モーター2連率：

        <b>${r.motor2.toFixed(1)}%</b><br>

        モーター3連率：

        <b>${r.motor3.toFixed(1)}%</b><br>

        ST：

        <b>${r.st ? r.st.toFixed(2) : "-"}</b><br>

        展示：

        <b>${r.exhibition ? r.exhibition.toFixed(2) : "-"}</b><br>

        モーター：

        <b>${escapeHTML(String(r.motorNo))}</b>

      </div>

      <div class="score">

        AI評価 ${r.score.toFixed(1)}

      </div>

    `;

    area.appendChild(div);

  });

}

function renderEntryButtons(){

  const area =

    document.getElementById("entryButtons");

  area.innerHTML = "";

  entryOrder.forEach((boat,i)=>{

    const b =

      document.createElement("button");

    b.className =

      "entryBtn active";

    b.textContent =

      boat+"コース";

    b.onclick = ()=>{

      const index =

        entryOrder.indexOf(boat);

      if(index === -1) return;

      if(i === 0) return;

      const temp =

        entryOrder[0];

      entryOrder[0] =

        entryOrder[i];

      entryOrder[i] =

        temp;

      renderEntryButtons();

      updateEntryText();

    };

    area.appendChild(b);

  });

  updateEntryText();

}

function updateEntryText(){

  const text =

    entryOrder.join("-");

  const maezuke =

    entryOrder[0] !== 1;

  document.getElementById("entryText")

    .innerHTML =

    `<b>進入：</b>${text}

     <br>

     <b>判定：</b>

     ${

       maezuke

       ? '<span class="warning">前付けあり</span>'

       : '<span class="good">枠なり想定</span>'

     }`;

}

function courseBonus(course){

  return {

    1:10,

    2:6,

    3:5,

    4:3,

    5:1,

    6:0

  }[course] || 0;

}

function rankBonus(rank){

  const r =

    String(rank).toUpperCase();

  if(r === "A1") return 5;

  if(r === "A2") return 2;

  if(r === "B1") return 0;

  if(r === "B2") return -2;

  return 0;

}

function calcScore(r){

  let score = 0;

  score += r.national * 7;

  score += r.local * 4;

  score += r.motor2 * 0.15;

  if(r.st > 0){

    score +=

      Math.max(

        0,

        0.30-r.st

      ) * 20;

  }

  score +=

    courseBonus(r.course);

  score +=

    rankBonus(r.rank);

  if(r.exhibition > 0){

    if(r.exhibition <= 6.70){

      score += 3;

    }else if(r.exhibition <= 6.80){

      score += 1;

    }else if(r.exhibition >= 7.00){

      score -= 2;

    }

  }

  return Math.round(

    score * 10

  ) / 10;

}

function analyzeRace(){

  racers.forEach(r=>{

    r.score =

      calcScore(r);

  });

  racers.sort(

    (a,b)=>b.score-a.score

  );

}

function getOrdered(){

  return [...racers]

    .sort((a,b)=>b.score-a.score);

}

function getBoat(n){

  return racers.find(

    r=>r.course===n

  );

}

function makeForecast(){

  const one =

    getBoat(1);

  const ranking =

    getOrdered();

  const second =

    ranking.find(r=>r.course!==1);

  const third =

    ranking.find(

      r =>

        r.course!==1 &&

        r.course!==second.course

    );

  const maezuke =

    entryOrder[0] !== 1;

  let text = "";

  if(maezuke){

    text +=

      "前付けが入る想定。インのスタートが遅れると、";

    text +=

      `${second.course}号艇の差し・まくり差しが有力。`;

  }else{

    text +=

      `1号艇${one ? one.name : ""}のイン逃げを基本線。`;

    if(second){

      text +=

        ` 相手筆頭は${second.course}号艇。`;

    }

    if(third){

      text +=

        ` 展開次第で${third.course}号艇まで。`;

    }

  }

  text +=

    "<br>ST・展示・モーター機力を加味してAI評価を算出。";

  document.getElementById("forecast")

    .innerHTML = text;

}

function renderRanking(){

  const area =

    document.getElementById("ranking");

  const list =

    getOrdered();

  area.innerHTML =

    list.map((r,i)=>{

      const percent =

        Math.max(

          1,

          Math.min(

            99,

            Math.round(

              100 *

              r.score /

              list.reduce(

                (s,x)=>s+x.score,0

              )

            )

          )

        );

      return `

        <div style="

          padding:9px;

          border-bottom:1px solid #292929;

          display:flex;

          justify-content:space-between;

          align-items:center;

        ">

          <div>

            <span class="gold">

              ${i+1}位

            </span>

           　

            <b>${r.course}号艇</b>

             ${escapeHTML(r.name)}

          </div>

          <div>

            <b>${r.score.toFixed(1)}</b>

          </div>

        </div>

      `;

    }).join("");

}

function makeCombinations(){

  const sorted =

    getOrdered();

  const top =

    sorted.slice(0,4)

      .map(r=>r.course);

  const one =

    top.includes(1)

    ? 1

    : top[0];

  const others =

    top.filter(x=>x!==one);

  const hit = [];

  others.slice(0,3)

    .forEach(x=>{

      hit.push(

        `${one}-${x}-${others.find(y=>y!==x) || x}`

      );

    });

  const roi = [];

  const candidates =

    sorted

      .slice(0,5)

      .map(r=>r.course);

  for(let i=0;i<candidates.length;i++){

    for(let j=0;j<candidates.length;j++){

      for(let k=0;k<candidates.length;k++){

        if(

          i===j ||

          j===k ||

          i===k

        ) continue;

        const combo =

          `${candidates[i]}-${candidates[j]}-${candidates[k]}`;

        if(

          !roi.includes(combo) &&

          combo.split("-")[0] !==

          combo.split("-")[1]

        ){

          roi.push(combo);

        }

        if(roi.length >= 5) break;

      }

      if(roi.length >= 5) break;

    }

    if(roi.length >= 5) break;

  }

  const hole =

    sorted

      .slice(0,6)

      .map(r=>r.course)

      .filter(x=>x!==one)

      .slice(0,2);

  return {

    hit,

    roi,

    hole

  };

}

function runAnalysis(){

  if(!racers.length){

    alert(

      "先に出走表を取得してください。"

    );

    return;

  }

  analyzeRace();

  renderRacers();

  renderRanking();

  makeForecast();

  const picks =

    makeCombinations();

  document.getElementById("hitPicks")

    .innerHTML =

    picks.hit

      .map(x=>`<div class="pick">${x}</div>`)

      .join("");

  document.getElementById("roiPicks")

    .innerHTML =

    picks.roi

      .map(x=>`<div class="pick">${x}</div>`)

      .join("");

  document.getElementById("holePicks")

    .innerHTML =

    picks.hole

      .map(x=>`<div class="pick">穴：${x}</div>`)

      .join("");

  const order =

    getOrdered();

  const honmei =

    order[0];

  const taikou =

    order[1];

  const ana =

    order.find(

      r=>r.course!==honmei.course &&

         r.course!==taikou.course

    );

  document.getElementById("hitReason")

    .innerHTML =

    `本命：${honmei.course}号艇

     ${escapeHTML(honmei.name)}

     ／AI評価 ${honmei.score.toFixed(1)}。

     ${

       taikou

       ? `対抗：${taikou.course}号艇。`

       : ""

     }`;

  document.getElementById("roiReason")

    .innerHTML =

    `AI評価上位を軸にしつつ、

     2〜5番手までを組み合わせて

     回収率を狙う構成。`;

  document.getElementById("holeReason")

    .innerHTML =

    ana

    ? `穴候補：${ana.course}号艇

       ${escapeHTML(ana.name)}。

       展示・ST・モーター次第で

       3着食い込みを警戒。`

    : "穴候補データ不足。";

  makeBudget(picks);

  document

    .getElementById("resultArea")

    .classList.remove("hidden");

  setStatus(

    "AI解析完了！\n"+

    "本命・対抗・穴馬・買い目を表示しました。"

  );

  window.scrollTo({

    top:document.body.scrollHeight,

    behavior:"smooth"

  });

}

function makeBudget(picks){

  let budget =

    Number(

      document.getElementById("budget").value

    );

  if(!budget || budget < 100){

    budget = 3000;

  }

  const hitBudget =

    Math.floor(

      budget * 0.50 / 100

    ) * 100;

  const roiBudget =

    Math.floor(

      budget * 0.35 / 100

    ) * 100;

  const holeBudget =

    Math.floor(

      budget * 0.15 / 100

    ) * 100;

  const hitEach =

    Math.max(

      100,

      Math.floor(

        hitBudget /

        Math.max(1,picks.hit.length) /

        100

      ) * 100

    );

  const roiEach =

    Math.max(

      100,

      Math.floor(

        roiBudget /

        Math.max(1,picks.roi.length) /

        100

      ) * 100

    );

  const holeEach =

    Math.max(

      100,

      Math.floor(

        holeBudget /

        Math.max(1,picks.hole.length) /

        100

      ) * 100

    );

  document.getElementById("budgetResult")

    .innerHTML = `

      <div class="pickBox">

        <div>

          的中率重視

          <span class="gold">

            ${hitBudget.toLocaleString()}円

          </span>

        </div>

        <div class="reason">

          1点 ${hitEach.toLocaleString()}円

        </div>

      </div>

      <div class="pickBox">

        <div>

          回収率重視

          <span class="gold">

            ${roiBudget.toLocaleString()}円

          </span>

        </div>

        <div class="reason">

          1点 ${roiEach.toLocaleString()}円

        </div>

      </div>

      <div class="pickBox">

        <div>

          穴狙い

          <span class="gold">

            ${holeBudget.toLocaleString()}円

          </span>

        </div>

        <div class="reason">

          1点 ${holeEach.toLocaleString()}円

        </div>

      </div>

      <div style="

        text-align:center;

        margin-top:12px;

      ">

        合計予算

        <div class="big">

          ${budget.toLocaleString()}円

        </div>

      </div>

    `;

}

function escapeHTML(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}
