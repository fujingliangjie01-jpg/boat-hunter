<script>

"use strict";

/* =========================================================

   API

========================================================= */

const API_URL =

"https://boatraceopenapi.github.io/api/v1/today.json";

const HISTORY_BASE =

"https://boatraceopenapi.github.io/api/v1/";

const HISTORY_DAYS = 30;

let raceData=null;

let selectedEntry=[];

let historyStats=null;

/* =========================================================

   基本関数

========================================================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(d):"-";

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function getRank(v){

 return {

 1:"A1",

 2:"A2",

 3:"B1",

 4:"B2"

 }[num(v)]||"-";

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

/* =========================================================

   JSON取得

========================================================= */

async function fetchJson(url){

 const response=

  await fetch(

   url+

   (url.includes("?")?"&":"?")+

   "t="+Date.now(),

   {

    method:"GET",

    cache:"no-store",

    headers:{

     "Accept":"application/json"

    }

   }

  );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

/* =========================================================

   レース検索

========================================================= */

function findRace(data,stadium,race){

 if(!data)return null;

 try{

  const direct=

   data?.programs

    ?.stadiums

    ?.[String(stadium)]

    ?.races

    ?.[String(race)];

  if(direct)return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)return;

  if(typeof o!=="object")return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* =========================================================

   レーサー

========================================================= */

function getRacers(race){

 if(!race)return[];

 const racers=race.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)return[];

 const racers=preview.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getResultRacers(race){

 const racers=

  race?.result?.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function boatNo(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number

 );

}

function racerName(r){

 return(

  r?.name ||

  r?.racer_name ||

  "選手名不明"

 );

}

function racerNumber(r){

 return num(

  r?.number ??

  r?.racer_number ??

  r?.registration_number

 );

}

function previewFor(r){

 return getPreviewRacers(raceData)

 .find(

  x=>boatNo(x)===boatNo(r)

 )||{};

}

function getST(r){

 return num(

  firstValue(r,[

   "start_timing",

   "st"

  ])

 );

}

function getExhibition(r){

 return num(

  firstValue(r,[

   "exhibition_time",

   "display_time"

  ])

 );

}

function getCourse(r){

 return num(

  firstValue(r,[

   "course_number",

   "course"

  ])

 );

}

/* =========================================================

   出走表

========================================================= */

function displayRace(){

 const box=

  document.getElementById("boats");

 box.innerHTML="";

 const racers=

  getRacers(raceData)

  .sort(

   (a,b)=>

    boatNo(a)-boatNo(b)

  );

 if(racers.length<6){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 6艇の出走表を取得できませんでした。

   </div>

  `;

  return false;

 }

 racers.forEach(r=>{

  const p=

   previewFor(r);

  const st=getST(p);

  const ex=getExhibition(p);

  const div=

   document.createElement("div");

  div.className="boat";

  div.innerHTML=`

   <div class="boat-number">

    ${boatNo(r)}

   </div>

   <div class="boat-name">

    ${esc(racerName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${fmt(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${fmt(r.local_win_rate)}

   </div>

   <div class="metric">

    M${r.motor_number||"-"}

   </div>

   <div class="metric">

    M2連 ${fmt(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${fmt(r.motor_top_3_percent)}%

   </div>

   <div class="metric st">

    ST ${st>0?fmt(st):"-"}

   </div>

   <div class="metric exhibition">

    展示 ${ex>0?fmt(ex):"-"}

   </div>

  `;

  box.appendChild(div);

 });

 return true;

}

/* =========================================================

   直前情報

========================================================= */

function displayPreview(){

 const box=

  document.getElementById(

   "previewInfo"

  );

 const p=raceData?.preview;

 if(!p){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 直前情報なし

   </div>

  `;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* =========================================================

   展示

========================================================= */

function displayPreviewRacers(){

 const box=

  document.getElementById(

   "previewRacers"

  );

 const racers=

  getPreviewRacers(raceData)

  .sort(

   (a,b)=>

    boatNo(a)-boatNo(b)

  );

 if(!racers.length){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 展示・ST・直前進入データなし

   </div>

  `;

  return;

 }

 let html=`

 <table class="table">

 <thead>

 <tr>

  <th>艇</th>

  <th>進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  html+=`

  <tr>

   <td>${boatNo(r)}号艇</td>

   <td class="gold">

    ${

     getCourse(r)>0

     ?getCourse(r)+"コース"

     :"－"

    }

   </td>

   <td class="orange">

    ${

     getST(r)>0

     ?fmt(getST(r))

     :"－"

    }

   </td>

   <td class="yellow">

    ${

     getExhibition(r)>0

     ?fmt(getExhibition(r))

     :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 `;

 box.innerHTML=html;

}

/* =========================================================

   進入

========================================================= */

function createEntryButtons(){

 const box=

  document.getElementById(

   "entryButtons"

  );

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=

   document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.onclick=()=>{

   selectEntry(i);

  };

  box.appendChild(b);

 }

}

function selectEntry(n){

 if(selectedEntry.includes(n))

  return;

 if(selectedEntry.length>=6)

  return;

 selectedEntry.push(n);

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  selectedEntry.join("-");

}

function updateEntryButtons(){

  ".entry-btn"

/*

 決まり手番号はAPI側の表記揺れに対応。

 _source文字列が取れる場合はそちらを優先する。

*/

function techniqueName(result){

 const raw=

  firstValue(

   result,

   [

    "technique_name",

    "technique",

    "technique_number_source"

   ]

  );

 if(typeof raw==="string" && raw){

  const s=raw.trim();

  if(

   s.includes("まくり差し") ||

   s.includes("捲り差し")

  )

   return"まくり差し";

  if(

   s.includes("まくり") ||

   s.includes("捲り")

  )

   return"まくり";

  if(

   s.includes("差し") ||

   s.includes("差")

  )

   return"差し";

  if(

   s.includes("逃げ")

  )

   return"逃げ";

  if(

   s.includes("抜き")

  )

   return"抜き";

  if(

   s.includes("恵まれ")

  )

   return"恵まれ";

 }

 /*

  数値はAPIの将来変更に備えて

  複数候補を吸収する。

 */

 const n=num(

  result?.technique_number

 );

 const map={

  1:"逃げ",

  2:"差し",

  3:"まくり",

  4:"まくり差し",

  5:"抜き",

  6:"恵まれ"

 };

 return map[n]||"その他";

}

/* =========================================================

   過去1レースを統計化

========================================================= */

function processHistoricalRace(

 race,

 statsMap

){

 if(!race?.result)

  return;

 const resultRacers=

  getResultRacers(race);

 if(resultRacers.length<6)

  return;

 const resultByNumber={};

 resultRacers.forEach(r=>{

  const number=

   racerNumber(r);

  if(number>0){

   resultByNumber[number]=r;

  }

 });

 /*

  このレースの出走表側の選手と

  結果側の登録番号を結び付ける

 */

 const programRacers=

  getRacers(race);

 programRacers.forEach(pr=>{

  const number=

   racerNumber(pr);

  if(number<=0)

   return;

  const rr=

   resultByNumber[number];

  if(!rr)

   return;

  const course=

   num(rr.course_number);

  const place=

   num(rr.place_number);

  if(course<1||course>6)

   return;

  if(!statsMap[number]){

   statsMap[number]={

    number,

    name:racerName(pr),

    stat:emptyStat()

   };

  }

  const s=

   statsMap[number].stat;

  s.total++;

  const cs=

   s.course[course];

  cs.total=(cs.total||0)+1;

  if(place===1){

   s.winsByCourse[course]++;

   cs.win=(cs.win||0)+1;

  }

  /*

   決まり手は1着選手のもの

  */

  if(place===1){

   const technique=

    techniqueName(

     race.result

    );

   addCount(

    cs,

    technique

   );

   cs[technique]=

    cs[technique]||0;

   cs[technique]++;

  }

  /*

   1号艇の負け方

  */

  if(course===1 && place!==1){

   s.insideLoss.total++;

   /*

    このレースの1着選手

   */

   const winner=

    resultRacers.find(

     x=>num(x.place_number)===1

    );

   if(winner){

    const winnerCourse=

     num(winner.course_number);

    const technique=

     techniqueName(

      race.result

     );

    addCount(

     s.insideLoss.byTechnique,

     technique

    );

    addCount(

     s.insideLoss.byWinnerCourse,

     String(winnerCourse)

    );

   }

  }

 });

}

function dateStringDaysAgo(days){

 const d=new Date();

 d.setDate(

  d.getDate()-days

 );

 const y=d.getFullYear();

 const m=

  String(d.getMonth()+1)

  .padStart(2,"0");

 const day=

  String(d.getDate())

  .padStart(2,"0");

 return{

  y,

  date:

   `${y}${m}${day}`

 };

}

async function loadHistory(){

 const status=

  document.getElementById(

   "historyStatus"

  );

 status.innerHTML=

  "📚 過去30日間のレース結果を分析中...";

 const statsMap={};

 let success=0;

 /*

  一度に5日ずつ取得

  ブラウザへの負荷を抑える

 */

 for(

  let start=0;

  start<HISTORY_DAYS;

  start+=5

 ){

  const tasks=[];

  for(

   let i=start;

   i<Math.min(

    start+5,

    HISTORY_DAYS

   );

   i++

  ){

   const d=

    dateStringDaysAgo(i);

   const url=

    HISTORY_BASE+

    `${d.y}/${d.date}.json`;

   tasks.push(

    fetchJson(url)

    .then(data=>{

     success++;

     return data;

    })

    .catch(()=>null)

   );

  }

  const results=

   await Promise.all(tasks);

  results.forEach(data=>{

   if(!data?.programs?.stadiums)

    return;

   const stadiums=

    data.programs.stadiums;

   Object.values(

    stadiums

   ).forEach(stadium=>{

    if(!stadium?.races)

     return;

    Object.values(

     stadium.races

    ).forEach(race=>{

     processHistoricalRace(

      race,

      statsMap

     );

    });

   });

  });

  status.innerHTML=

   `📚 過去データ分析中... ${Math.min(start+5,HISTORY_DAYS)}/${HISTORY_DAYS}日`;

 }

 historyStats=statsMap;

 status.innerHTML=

  `✅ 過去${HISTORY_DAYS}日間を分析完了<br>`+

  `取得成功 ${success}日`;

 return statsMap;

}

/* =========================================================

========================================================= */

function techniqueRates(

 history,

 course

){

 if(!history)

  return[];

 const cs=

  history.stat.course[course];

 if(!cs||!cs.total)

  return[];

 const techniques=[

  "逃げ",

  "差し",

  "まくり",

  "まくり差し",

  "抜き",

  "恵まれ"

 ];

 return techniques

 .map(name=>({

  name,

  count:

   num(cs[name]),

  percent:

   num(cs[name])/

   cs.total*

   100

 }))

 .filter(

  x=>x.count>0

 )

 .sort(

  (a,b)=>

   b.percent-a.percent

 );

}

/* =========================================================

   攻め手適性

========================================================= */

function attackPattern(

 racer,

 course

){

 const history=

  getHistoryForRacer(racer);

 const rates=

  techniqueRates(

   history,

   course

  );

 if(!rates.length){

  return{

   main:"データ不足",

   percent:0,

   rates:[]

  };

 }

 /*

  攻めとして意味が強い

  3種類を中心に評価

 */

 const attackRates=

  rates.filter(

   x=>

    x.name==="差し"||

    x.name==="まくり"||

    x.name==="まくり差し"

  );

 if(!attackRates.length){

  return{

   main:rates[0].name,

   percent:rates[0].percent,

   rates

  };

 }

 return{

  main:attackRates[0].name,

  percent:attackRates[0].percent,

  rates

 };

}

 return{

/* =========================================================

   基本AIスコア

========================================================= */

function baseScore(

 r,

 course,

 dev

){

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const n2=

  num(r.national_top_2_percent);

 const n3=

  num(r.national_top_3_percent);

 const l2=

  num(r.local_top_2_percent);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=

  previewFor(r);

 const st=

  getST(p);

 const ex=

  getExhibition(p);

 let s=0;

 s+=national*6;

 s+=local*3;

 s+=n2*.08;

 s+=n3*.04;

 s+=l2*.04;

 s+=m2*.18;

 s+=m3*.07;

 if(st>0)

  s+=Math.max(0,.25-st)*25;

 if(ex>0)

  s+=Math.max(0,6.90-ex)*8;

 s+=({

  1:10,

  2:6,

  3:5,

  4:4,

  5:2,

  6:0

 }[course]||0);

 const rank=

  num(r.rank_number);

 if(rank===1)s+=5;

 if(rank===2)s+=3;

 if(rank===4)s-=2;

 /*

  新機能

  コース別の得意戦法を反映

 */

 const attack=

  attackPattern(

   r,

   course

  );

 if(

  course>=2 &&

  attack.percent>0

 ){

  /*

   得意戦法が高いほど加点

  */

  s+=

   Math.min(

    12,

    attack.percent*.20

   );

 }

 return s;

}

/* =========================================================

   攻め手判定

========================================================= */

function attackScore(

 r,

 course

){

 const p=

  previewFor(r);

 const st=

  getST(p);

 const ex=

  getExhibition(p);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 let s=0;

 const pattern=

  attackPattern(

   r,

   course

  );

 /*

  過去実績

 */

 s+=

  Math.min(

   30,

   pattern.percent*.50

  );

 /*

  ST

 */

 if(st>0){

  if(st<=.12)s+=20;

  else if(st<=.15)s+=16;

  else if(st<=.18)s+=10;

  else if(st<=.20)s+=4;

 }

 /*

  展示

 */

 if(ex>0){

  if(ex<=6.70)s+=15;

  else if(ex<=6.80)s+=10;

  else if(ex<=6.90)s+=4;

 }

 /*

  モーター

 */

 if(m2>=45)s+=15;

 else if(m2>=40)s+=11;

 else if(m2>=35)s+=7;

 else if(m2>=30)s+=3;

 if(m3>=65)s+=10;

 else if(m3>=60)s+=7;

 else if(m3>=55)s+=4;

 /*

  外枠

 */

 if(course>=4)s+=7;

 if(course===3)s+=5;

 if(course===2)s+=3;

 return s;

}

  );

 if(!first){

  return{

  };

 }

  previewFor(first);

 const st=

  getST(p);

 const ex=

  getExhibition(p);

 const m2=

  num(first.motor_top_2_percent);

 const m3=

  num(first.motor_top_3_percent);

 let inside=58;

 if(

  num(first.national_win_rate)>=6.5

 )

  inside+=6;

 if(

  num(first.national_win_rate)<5.5

 )

  inside-=7;

 if(

  num(first.local_win_rate)>=6.5

 )

  inside+=4;

 if(

  num(first.local_win_rate)<5.5

 )

  inside-=4;

 if(m2>=40)

  inside+=5;

 if(m2<30)

  inside-=5;

 if(m3>=60)

  inside+=3;

 if(st>0&&st<=.15)

  inside+=7;

 if(st>=.21)

  inside-=7;

 if(ex>0&&ex<=6.75)

  inside+=4;

 if(ex>=6.95)

  inside-=4;

 /*

  1号艇自身の負け方を

  攻め手候補の選定に反映

 */

 const loss=

  insideLossPattern(first);

 const attacks=

  racers

  .map(r=>{

   const course=

    entry.indexOf(

     boatNo(r)

    )+1;

   const score=

    attackScore(

     r,

     course

    );

   const pattern=

    attackPattern(

     r,

     course

    );

   let finalScore=

    score;

   /*

    1号艇が過去に

   */

   if(

    loss.byTechnique &&

    loss.byTechnique.length

   ){

    const preferred=

     loss.byTechnique[0]

    if(

    pattern

   };

  })

  .filter(

   x=>

    x.boat!==entry[0]

  )

  .sort(

   (a,b)=>

    b.score-a.score

  );

 const attacker=

  attacks[0];

 if(

  attacker &&

  attacker.score>=32

 ){

  inside-=10;

  if(

   attacker.course>=4

  ){

   return{

    type:"まくり",

    attacker:

     attacker.boat,

     attacker.pattern,

    inside:

     Math.max(

      5,

      Math.round(inside)

     ),

    outside:

     Math.min(

      95,

      Math.round(100-inside)

     )

   };

  }

  return{

   type:"差し",

   attacker:

    attacker.boat,

   attackPattern:

    attacker.pattern,

   inside:

    Math.max(

     5,

     Math.round(inside)

    ),

   outside:

    Math.min(

     95,

     Math.round(100-inside)

    )

  };

 }

 inside=

  Math.max(

   5,

   Math.min(

    95,

    Math.round(inside)

   )

  );

 return{

  type:"イン逃げ",

  attacker:entry[0],

  inside,

  outside:100-inside

 };

/* =========================================================

   的中重視

========================================================= */

function buildHit(

 rank,

 dev

){

 const entry=

  getEntry();

 const first=

  entry[0];

 const r1=

  rank[0]?.boat;

 const r2=

  rank[1]?.boat;

 const r3=

  rank[2]?.boat;

 const arr=[];

 function add(

  a,b,c,text

 ){

  if(!validCombo(a,b,c))

   return;

  if(arr.length>=7)

   return;

  pushPick(

   arr,

   `${a}-${b}-${c}`,

   text

  );

 }

 /*

  1位頭

 */

 add(

  r1,r2,r3,

  "AI評価1位頭＋評価2・3位"

 );

 add(

  r1,r3,r2,

  "AI評価1位頭＋評価2・3位入替"

 );

 /*

  2位頭を必ず2点

 */

 add(

  r2,r1,r3,

  "AI評価2位頭＋評価1・3位"

 );

 add(

  r2,r3,r1,

  "AI評価2位頭＋評価3・1位"

 );

 /*

  展開

 */

 if(

  dev.type==="イン逃げ"

 ){

  add(

   first,r1,r2,

   "イン逃げ＋AI上位"

  );

  add(

   first,r2,r1,

   "イン逃げ＋相手入替"

  );

 }else{

  add(

   dev.attacker,r1,r2,

   "得意攻め手頭＋AI上位"

  );

 }

 return arr.slice(0,7);

}

/* =========================================================

   回収重視

========================================================= */

function buildROI(

 rank,

 dev

){

 const entry=

  getEntry();

 /*

  回収重視は

  頭を的中重視と同じ方向にする

 */

 const heads=[

  rank[0]?.boat,

  rank[1]?.boat

 ];

 const candidates=[];

 const secondCandidates=

  rank

  .slice(1)

  .sort(

   (a,b)=>

    b.score-a.score

  );

 heads.forEach(head=>{

  secondCandidates

  .forEach(second=>{

   if(

    second.boat===head

   )

    return;

   /*

    2着はAI評価中位〜低位を

    優先的に混ぜる

   */

   const low=

    rank

    .filter(

     x=>

      x.boat!==head &&

      x.boat!==second.boat

    )

    .sort(

     (a,b)=>

      a.score-b.score

    );

   low.forEach(third=>{

    if(

     !validCombo(

      head,

      second.boat,

      third.boat

     )

    )

     return;

    let score=

     0;

    /*

     頭はAI上位を強く評価

    */

    if(

     head===rank[0]?.boat

    )

     score+=40;

    if(

     head===rank[1]?.boat

    )

     score+=32;

    /*

     2着は中位〜低位を評価

    */

    const rankIndex=

     rank.findIndex(

      x=>

       x.boat===second.boat

     );

    if(rankIndex>=2)

     score+=20;

    if(rankIndex>=3)

     score+=10;

    /*

     3着

    */

    score+=

     10-

     Math.min(

      10,

      third.score*.02

     );

    /*

     得意攻め

    */

    const racer=

     getRacers(raceData)

     .find(

      r=>

       boatNo(r)===third.boat

     );

    if(racer){

     const course=

      entry.indexOf(

       third.boat

      )+1;

     const pattern=

      attackPattern(

       racer,

       course

      );

     score+=

      Math.min(

       15,

       pattern.percent*.15

      );

    }

    candidates.push({

     combo:

      `${head}-${second.boat}-${third.boat}`,

     score

    });

   });

  });

 });

 candidates.sort(

  (a,b)=>

   b.score-a.score

 );

 const arr=[];

 for(

  const c of candidates

 ){

  if(arr.length>=7)

   break;

  pushPick(

   arr,

   c.combo,

   "AI上位を頭固定＋中位〜低評価を2・3着に組み込み回収期待値を狙う"

  );

 }

 return arr.slice(0,7);

}

/* =========================================================

   大穴

========================================================= */

function buildHole(

 rank,

 dev,

 usedCombos

){

 const entry=

  getEntry();

 const top1=

  rank[0]?.boat;

 const top2=

  rank[1]?.boat;

 const list=

  getRacers(raceData)

  .map(r=>{

   const boat=

    boatNo(r);

   const course=

    entry.indexOf(boat)+1;

   const pattern=

    attackPattern(

     r,

     course

    );

   return{

    boat,

    course,

    pattern,

    score:

     attackScore(

      r,

      course

     )

   };

  })

  .filter(

   x=>

    x.boat!==top1 &&

    x.boat!==top2

  )

  .sort(

   (a,b)=>

    b.score-a.score

  );

 const arr=[];

 const outsiders=

  list.filter(

   x=>x.course>=4

  );

 const candidates=

  outsiders.length>=2

  ?outsiders

  :list;

 for(

  let i=0;

  i<candidates.length;

  i++

 ){

  const x=

   candidates[i];

  for(

   const y of candidates

  ){

   if(

    y.boat===x.boat

   )

    continue;

   for(

    const z of candidates

   ){

    if(

     z.boat===x.boat ||

     z.boat===y.boat

    )

     continue;

    const combo=

     `${x.boat}-${y.boat}-${z.boat}`;

    if(

     usedCombos.includes(combo)

    )

     continue;

    if(

     arr.some(

      q=>q.combo===combo

     )

    )

     continue;

    arr.push({

     combo,

     reason:

      `${x.boat}号艇の${x.pattern.main}実績＋外枠一撃`

    });

    if(arr.length>=3)

     break;

   }

   if(arr.length>=3)

    break;

  }

  if(arr.length>=3)

   break;

 }

 return arr.slice(0,3);

}

/* =========================================================

   買い目共通

========================================================= */

function validCombo(

 a,b,c

){

 return(

  Number.isInteger(a)&&

  Number.isInteger(b)&&

  Number.isInteger(c)&&

  a>=1&&a<=6&&

  b>=1&&b<=6&&

  c>=1&&c<=6&&

  a!==b&&

  a!==c&&

  b!==c

 );

}

function pushPick(

 arr,

 combo,

 reason

){

 if(

  !arr.some(

   x=>x.combo===combo

  )

 ){

  arr.push({

   combo,

   reason

  });

 }

}

/* =========================================================

   掛け金

========================================================= */

function makeMoney(

 picks,

 budget,

 type

){

 const count=

  picks.length;

 if(count===0)

  return[];

 let total=

  Math.floor(

   num(budget)/100

  )*100;

 if(total<100)

  total=100;

 let weights=[];

 if(type==="hit"){

  weights=

   picks.map(

    (_,i)=>

     i<4?3:1

   );

 }else if(

  type==="roi"

 ){

  /*

   回収重視は

   1・2位頭を強くする

  */

  weights=

   picks.map(

    (_,i)=>

     i<4?3:2

   );

 }else{

  weights=

   picks.map(

    (_,i)=>

     i===0?4:

     i===1?3:

     2

   );

 }

 const weightTotal=

  weights.reduce(

   (a,b)=>a+b,

   0

  );

 let money=

  weights.map(

   w=>

    Math.floor(

     total*w/

     weightTotal/

     100

    )*100

  );

 money=

  money.map(

   x=>

    x<100?100:x

  );

 let current=

  money.reduce(

   (a,b)=>a+b,

   0

  );

 while(current>total){

  let index=-1;

  for(

   let i=money.length-1;

   i>=0;

   i--

  ){

   if(money[i]>100){

    index=i;

    break;

   }

  }

  if(index===-1)

   break;

  money[index]-=100;

  current-=100;

 }

 let i=0;

 while(

  current+100<=total

 ){

  money[i%money.length]+=100;

  current+=100;

  i++;

 }

 return money;

}
