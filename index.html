<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#080808">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;background:#080808;color:#fff;

 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

header{

 background:#000;border-bottom:1px solid #d4af37;

 padding:22px 15px;text-align:center

}

.logo{font-size:30px;font-weight:900;letter-spacing:4px;color:#d4af37}

.tagline{font-size:12px;color:#888;margin-top:6px}

.container{max-width:900px;margin:auto;padding:18px}

.card{

 background:#151515;border:1px solid #292929;border-radius:14px;

 padding:18px;margin-bottom:18px

}

.title{font-size:18px;font-weight:900;color:#d4af37;margin-bottom:16px}

label{display:block;font-size:13px;color:#999;margin-bottom:6px}

select,input{

 width:100%;padding:13px;margin-bottom:15px;border-radius:8px;

 border:1px solid #444;background:#0b0b0b;color:#fff;font-size:15px

}

button{

 width:100%;padding:16px;border:none;border-radius:10px;

 background:linear-gradient(135deg,#d4af37,#9b7418);

 color:#000;font-size:16px;font-weight:900;cursor:pointer

}

button:disabled{opacity:.5}

.status{text-align:center;color:#d4af37;margin-top:12px;font-size:13px;line-height:1.8}

.hidden{display:none}

.boats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

.boat{

 background:#0d0d0d;border:1px solid #333;border-radius:10px;

 padding:12px 5px;text-align:center

}

.boat-number{font-size:23px;font-weight:900}

.boat-name{font-size:12px;margin-top:6px}

.boat-class{font-size:11px;color:#d4af37;margin-top:5px}

.metric{font-size:10px;color:#888;margin-top:5px}

.entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.entry-btn{

 background:#0d0d0d;color:#fff;border:1px solid #444;

 border-radius:8px;padding:14px 5px;font-size:16px;font-weight:900

}

.entry-btn.selected{

 background:#d4af37;color:#000;border-color:#d4af37

}

.entry-result{

 margin-top:15px;background:#0b0b0b;border:1px solid #333;

 border-radius:10px;padding:18px;text-align:center;font-size:28px;

 font-weight:900;color:#d4af37

}

.entry-clear{margin-top:10px;background:#222;color:#fff}

.analyze-btn{margin-top:12px}

.row{

 display:flex;justify-content:space-between;gap:10px;padding:12px 0;

 border-bottom:1px solid #292929

}

.row:last-child{border-bottom:none}

.left{color:#999}

.right{font-weight:900;text-align:right}

.gold{color:#d4af37}

.green{color:#65df8b}

.yellow{color:#ffd34d}

.red{color:#ff6b6b}

.gray{color:#666}

.rank{

 background:#0c0c0c;border:1px solid #292929;border-radius:10px;

 padding:14px;margin-bottom:9px

}

.rank-number{color:#d4af37;font-weight:900}

.note{font-size:11px;color:#777;margin-top:7px;line-height:1.8}

.warning{

 background:#211b08;border:1px solid #8d6c16;padding:15px;

 border-radius:10px;line-height:1.7

}

.ai-box{

 background:#0b0b0b;border:1px solid #3a3218;border-radius:10px;

 padding:15px;margin-bottom:10px

}

.score-bar{

 height:8px;background:#222;border-radius:10px;

 margin-top:8px;overflow:hidden

}

.score-fill{height:100%;background:#d4af37}

.pick-box{

 background:#0b0b0b;border:1px solid #333;border-radius:10px;

 padding:14px;margin-top:10px

}

.pick-title{font-size:15px;font-weight:900;color:#d4af37}

.pick-item{

 padding:12px 0;border-bottom:1px solid #222

}

.pick-item:last-child{border-bottom:none}

.pick-line{font-size:19px;font-weight:900}

.pick-money{font-size:12px;color:#888;margin-left:8px}

.pick-reason{

 margin-top:6px;font-size:11px;color:#999;line-height:1.7

}

.reason-tag{

 display:inline-block;padding:3px 6px;border-radius:5px;

 background:#1c1c1c;color:#d4af37;margin-right:4px;

 margin-bottom:4px;font-size:10px

}

.pick-main{color:#ffd34d}

.pick-roi{color:#65df8b}

.pick-hole{color:#ff8c5a}

.roi-main{

 border:1px solid #d4af37;

 box-shadow:0 0 12px rgba(212,175,55,.15)

}

.hole-box{

 border:1px solid #7b3e24;

 background:#130c09

}

.info-grid{

 display:grid;grid-template-columns:repeat(2,1fr);

 gap:8px;margin-top:10px

}

.info-item{

 background:#0b0b0b;border:1px solid #292929;

 border-radius:8px;padding:10px

}

.info-label{font-size:10px;color:#777}

.info-value{

 font-size:16px;font-weight:900;margin-top:4px

}

.big-percent{

 font-size:30px;font-weight:900;margin-top:5px

}

.direction{

 padding:16px;border-radius:10px;margin-bottom:10px;

 background:#0b0b0b;border:1px solid #333

}

.attack{

 font-size:24px;font-weight:900;color:#ffd34d

}

.flow{line-height:2;font-size:14px}

.lap-table{

 width:100%;border-collapse:collapse;

 margin-top:12px;font-size:12px

}

.lap-table th,.lap-table td{

 border-bottom:1px solid #292929;

 padding:9px 5px;text-align:center

}

.lap-table th{

 color:#d4af37;font-size:11px

}

footer{

 text-align:center;color:#444;font-size:11px;padding:25px

}

@media(max-width:600px){

 .boats{grid-template-columns:repeat(3,1fr)}

 .logo{font-size:25px}

}

</style>

</head>

<body>

進入変化がある場合だけ本番の進入コース順を入力してください。

<script>

"use strict";

const API_URLS=[

"https://boatraceopenapi.github.io/api/v1/today.json",

"https://boatraceopenapi.github.io/programs/v3/today.json",

"https://boatraceopenapi.github.io/programs/v2/today.json"

];

let raceData=null;

/* 画面上の進入入力 */

let selectedEntry=[];

/*

  ★今回の重要部分

  進入未入力ならAI内部では123456として扱う。

  画面上のボタンは未選択のまま。

*/

function getAnalysisEntry(){

 if(selectedEntry.length===0){

  return [1,2,3,4,5,6];

 }

 return [...selectedEntry];

}

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function format(v){

 if(v===null||v===undefined||v==="")return "-";

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(2):String(v);

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")

   return o[k];

 }

 return null;

}

function getRank(v){

 return {

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

function getRacers(race){

 if(!race)return[];

 if(Array.isArray(race.racers))

  return race.racers;

 if(race.racers&&typeof race.racers==="object")

  return Object.values(race.racers);

 if(Array.isArray(race.players))

  return race.players;

 if(race.players&&typeof race.players==="object")

  return Object.values(race.players);

 return[];

}

function getBoatNumber(r){

 return num(

  r.entry_number??

  r.boat_number??

  r.course_number??

  r.number

 );

}

function getName(r){

 return r.name||

 r.racer_name||

 r.player_name||

 "選手名不明";

}

function getLap(r){

 return num(firstValue(r,[

  "one_lap_time",

  "one_lap",

  "lap_time",

  "first_lap_time",

  "first_lap",

  "turn_time",

  "one_round_time",

  "one_round",

  "one_lap_time_sec",

  "one_round_time_sec",

  "1lap_time",

  "oneLapTime"

 ]));

}

function getST(r){

 return num(firstValue(r,[

  "start_timing",

  "st",

  "average_start_timing",

  "start"

 ]));

}

function getCourseST(r,c){

 const keys=[

  `course${c}_start_timing`,

  `course_${c}_start_timing`,

  `course${c}_st`,

  `course_${c}_st`,

  `course${c}_average_start_timing`,

  `course_${c}_average_start_timing`,

  `st_course${c}`,

  `st_course_${c}`

 ];

 for(const k of keys){

  if(r[k]!==undefined&&

     r[k]!==null&&

     r[k]!=="")

   return num(r[k]);

 }

 if(Array.isArray(r.course_start_timing))

  return num(r.course_start_timing[c-1]);

 if(

  r.course_start_timing&&

  typeof r.course_start_timing==="object"

 )

  return num(r.course_start_timing[String(c)]);

 return 0;

}

function getStyle(r){

 return String(firstValue(r,[

  "winning_technique",

  "decision_technique",

  "technique",

  "last_decision",

  "winning_decision",

  "kimarite"

 ])||"").toLowerCase();

}

async function fetchJson(url){

 const r=await fetch(url+"?t="+Date.now(),{

  cache:"no-store",

  headers:{Accept:"application/json"}

 });

 if(!r.ok)

  throw new Error("HTTP "+r.status);

 return await r.json();

}

function findRace(data,stadium,race){

 if(!data)return null;

 if(

  data.programs&&

  data.programs.stadiums

 ){

  const s=data.programs.stadiums[String(stadium)];

  if(s&&s.races){

   const r=s.races[String(race)];

   if(r)return r;

  }

 }

 let found=null;

 function walk(o){

  if(found||

     !o||

     typeof o!=="object")

   return;

  if(

   o.stadium_number!==undefined&&

   num(o.stadium_number)===stadium&&

   o.race_number!==undefined&&

   num(o.race_number)===race&&

   (o.racers||o.players)

  ){

   found=o;

   return;

  }

  Object.keys(o).forEach(k=>{

   if(!found)

    walk(o[k]);

  });

 }

 walk(data);

 return found;

}

function displayRace(race){

 const box=document.getElementById("boats");

 box.innerHTML="";

 const racers=getRacers(race).sort(

  (a,b)=>getBoatNumber(a)-getBoatNumber(b)

 );

 if(racers.length<6){

  box.innerHTML=

  '<div class="warning">⚠️ 6艇の選手データを取得できませんでした。</div>';

  return false;

 }

 racers.forEach(r=>{

  const d=document.createElement("div");

  d.className="boat";

  d.innerHTML=`

  <div class="boat-number">${getBoatNumber(r)}</div>

  <div class="boat-name">${esc(getName(r))}</div>

  <div class="boat-class">${getRank(r.rank_number)}</div>

  <div class="metric">全国 ${format(r.national_win_rate)}</div>

  <div class="metric">当地 ${format(r.local_win_rate)}</div>

  <div class="metric">M${r.motor_number||"-"}</div>

  <div class="metric">M2連 ${format(r.motor_top_2_percent)}%</div>

  <div class="metric">M3連 ${format(r.motor_top_3_percent)}%</div>

  <div class="metric">ST ${format(getST(r))}</div>

  <div class="metric gold">

   一周 ${getLap(r)>0?format(getLap(r))+"秒":"-"}

  </div>

  `;

  box.appendChild(d);

 });

 return true;

}

function displayPreview(race){

 const box=document.getElementById("previewInfo");

 const p=race.preview;

 if(!p){

  box.innerHTML=

  '<div class="warning">⚠️ 現在、直前情報は取得できません。</div>';

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

 <div class="info-item">

  <div class="info-label">風速</div>

  <div class="info-value">${p.wind_speed??"-"}m</div>

 </div>

 <div class="info-item">

  <div class="info-label">風向</div>

  <div class="info-value">${p.wind_direction??p.wind_dir??"-"}</div>

 </div>

 <div class="info-item">

  <div class="info-label">波高</div>

  <div class="info-value">${p.wave_height??"-"}cm</div>

 </div>

 <div class="info-item">

  <div class="info-label">気温</div>

  <div class="info-value">${p.air_temperature??"-"}℃</div>

 </div>

 <div class="info-item">

  <div class="info-label">水温</div>

  <div class="info-value">${p.water_temperature??"-"}℃</div>

 </div>

 </div>`;

}

function displayLap(race){

 const box=document.getElementById("lapInfo");

 const racers=getRacers(race).sort(

  (a,b)=>getBoatNumber(a)-getBoatNumber(b)

 );

 const valid=racers.filter(r=>getLap(r)>0);

 if(!valid.length){

  box.innerHTML=

  '<div class="warning">⚠️ 一周タイムデータなし</div>';

  return;

 }

 const best=Math.min(

  ...valid.map(r=>getLap(r))

 );

 let html=`

 <table class="lap-table">

 <thead>

 <tr>

  <th>艇</th>

  <th>選手</th>

  <th>一周</th>

  <th>最速差</th>

 </tr>

 </thead>

 <tbody>`;

 racers.forEach(r=>{

  const lap=getLap(r);

  html+=`

  <tr>

  <td>${getBoatNumber(r)}号艇</td>

  <td>${esc(getName(r))}</td>

  <td>${lap>0?format(lap)+"秒":"-"}</td>

  <td>${lap>0?"+"+format(lap-best)+"秒":"-"}</td>

  </tr>`;

 });

 html+="</tbody></table>";

 box.innerHTML=html;

}

async function loadRace(){

 const stadium=num(

  document.getElementById("venue").value

 );

 const raceNumber=num(

  document.getElementById("race").value

 );

 const status=document.getElementById("status");

 const btn=document.getElementById("loadButton");

 btn.disabled=true;

 btn.innerText="⏳ 取得中...";

 document.getElementById("result")

 .classList.add("hidden");

 let lastError=null;

 try{

  for(let i=0;i<API_URLS.length;i++){

   try{

    status.innerHTML=

    `⏳ API ${i+1}/${API_URLS.length} を確認中...`;

    const data=await fetchJson(API_URLS[i]);

    const race=findRace(

     data,

     stadium,

     raceNumber

    );

    if(!race){

     lastError=

     new Error("指定レースがありません");

     continue;

    }

    const racers=getRacers(race);

    if(racers.length<6){

     lastError=

     new Error("6艇のデータがありません");

     continue;

    }

    raceData=race;

    /* レース取得時は必ず未選択に戻す */

    selectedEntry=[];

    displayRace(race);

    displayPreview(race);

    displayLap(race);

    createEntryButtons();

    document.getElementById("result")

    .classList.remove("hidden");

    status.innerHTML="✅ 出走表取得成功";

    document.getElementById("apiInfo")

    .innerHTML=`

    取得元：

    <strong>${esc(API_URLS[i])}</strong><br>

    会場番号：${stadium}<br>

    レース：${raceNumber}R<br>

    選手：${racers.length}名`;

    btn.disabled=false;

    btn.innerText="🔥 出走表を取得";

    return;

   }catch(e){

    lastError=e;

   }

  }

  throw lastError||

  new Error("API取得失敗");

 }catch(e){

  status.innerHTML=`

  <span class="red">

   ❌ 出走表取得失敗

  </span>

  <br>${esc(e.message)}`;

  btn.disabled=false;

  btn.innerText="🔥 出走表を取得";

 }

}

function createEntryButtons(){

 const box=document.getElementById("entryButtons");

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.onclick=()=>selectEntry(i);

  box.appendChild(b);

 }

}

function selectEntry(boat){

 if(

  selectedEntry.includes(boat)||

  selectedEntry.length>=6

 )

  return;

 selectedEntry.push(boat);

 updateEntryButtons();

 document.getElementById("entryResult")

 .innerText=selectedEntry.join("-");

}

function updateEntryButtons(){

 document.querySelectorAll(".entry-btn")

 .forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 /* ★画面上だけ完全に未選択へ戻す */

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById("entryResult")

 .innerText="進入を入力してください";

}

function windInfo(){

 const p=raceData?.preview;

 if(!p)

  return{

   speed:0,

   head:false,

   tail:false

  };

 const speed=num(p.wind_speed);

 const d=String(

  p.wind_direction||

  p.wind_dir||

  p.wind_name||

  ""

 ).toLowerCase();

 return{

  speed,

  head:

   d.includes("向")&&

   !d.includes("追"),

  tail:

   d.includes("追")

 };

}

/* ================================

   AI能力評価

================================ */

function abilityScore(r,course){

 let s=0;

 const national=num(r.national_win_rate);

 const local=num(r.local_win_rate);

 const m2=num(r.motor_top_2_percent);

 const m3=num(r.motor_top_3_percent);

 const st=getST(r);

 const cst=getCourseST(r,course);

 const rank=num(r.rank_number);

 const lap=getLap(r);

 s+=national*6;

 s+=local*3;

 s+=m2*.22;

 s+=m3*.08;

 if(st>0)

  s+=Math.max(0,.30-st)*20;

 if(cst>0)

  s+=Math.max(0,.30-cst)*18;

 if(lap>0){

  const laps=getRacers(raceData)

   .map(x=>getLap(x))

   .filter(x=>x>0);

  if(laps.length){

   const best=Math.min(...laps);

   s+=Math.max(

    0,

    5-(lap-best)*25

   );

  }

 }

 s+=({

  1:10,

  2:5,

  3:4,

  4:3,

  5:1,

  6:0

 }[course]||0);

 if(rank===1)s+=4;

 if(rank===2)s+=2;

 if(rank===4)s-=2;

 return s;

}

/* ================================

   攻め手

function attackCandidates(){

 const entry=getAnalysisEntry();

 return getRacers(raceData).map(r=>{

  const boat=getBoatNumber(r);

  const course=

   entry.indexOf(boat)+1;

  const st=

   getCourseST(r,course)||getST(r);

  const m2=

   num(r.motor_top_2_percent);

  const m3=

   num(r.motor_top_3_percent);

  const style=getStyle(r);

  let score=0;

  let type="";

  if(st>0)

   score+=Math.max(0,.20-st)*45;

  score+=Math.max(0,m2-30)*.12;

  score+=Math.max(0,m3-50)*.04;

  if(

   style.includes("まくり")||

   style.includes("捲り")

  ){

   score+=10;

   type=

    style.includes("差")

     ?"まくり差し"

     :"まくり";

  }

  if(

   style.includes("差し")&&

   !type

  ){

   score+=8;

   type="差し";

  }

  if(course===2)

   score+=2;

  if(course>=4)

   score+=3;

  return{

   boat,

   course,

   racer:r,

   score,

   type,

   st,

   m2,

   m3

  };

 }).sort(

  (a,b)=>b.score-a.score

 );

}

/* ================================

   イン逃げ評価

================================ */

function raceTrend(){

 const entry=getAnalysisEntry();

 const first=entry[0];

 const r=getRacers(raceData).find(

  x=>getBoatNumber(x)===first

 );

 if(!r)

  return{

   inside:50,

   outside:50

  };

 let inside=55;

 const n=num(r.national_win_rate);

 const l=num(r.local_win_rate);

 const m2=num(r.motor_top_2_percent);

 const m3=num(r.motor_top_3_percent);

 const st=getST(r);

 const cst=getCourseST(r,1);

 if(n>=6.5)inside+=5;

 if(n<5.5)inside-=5;

 if(l>=6.5)inside+=4;

 if(l<5.5)inside-=4;

 if(m2>=40)inside+=5;

 if(m2<30)inside-=5;

 if(m3>=60)inside+=3;

 if(m3<45)inside-=3;

 if(st>0&&st<=.15)inside+=6;

 if(st>=.20)inside-=7;

 if(cst>0&&cst<=.15)inside+=7;

 if(cst>=.20)inside-=8;

 const attacks=attackCandidates();

 const out=

  attacks.find(x=>x.course>=2);

 if(out&&out.score>=16)

  inside-=12;

 if(out&&out.st>0&&out.st<=.15)

  inside-=6;

 const w=windInfo();

 if(w.speed>=4)

  inside-=4;

 if(w.head)

  inside-=4;

 if(w.tail)

  inside+=4;

 inside=Math.max(

  5,

  Math.min(95,Math.round(inside))

 );

 return{

  inside,

  outside:100-inside

 };

}

  };

 }

 return{

 };

}

   ランキング

function ranking(dev){

 const entry=getAnalysisEntry();

 const w=windInfo();

 return getRacers(raceData).map(r=>{

  const boat=getBoatNumber(r);

  const course=

   entry.indexOf(boat)+1;

  let score=

   abilityScore(r,course);

  if(w.head&&w.speed>=4){

   if(course>=4)score+=3;

   if(course<=3)score-=2;

  }

  if(w.tail&&w.speed>=4){

   if(course<=3)score+=3;

   if(course>=4)score-=1;

  }

  if(dev.type==="イン逃げ"){

   if(boat===entry[0])

    score+=8;

   if(course===2)

    score+=4;

   if(course===3)

    score+=3;

  }else{

   if(boat===dev.attacker)

    score+=10;

   if(

    dev.type==="まくり"&&

    course>dev.course

   )

    score+=3;

   if(

    dev.type==="差し"&&

    course===1

   )

    score+=5;

   if(

    dev.type==="まくり差し"&&

    (course===1||course===2)

   )

    score+=4;

  }

  return{

   number:boat,

   name:getName(r),

   racer:r,

   course,

   score

  };

 }).sort(

  (a,b)=>b.score-a.score

 );

}

/* ================================

   評価差を見る

================================ */

function scoreGap(ranking,index){

 if(!ranking[index])

  return 999;

 if(index===0)

  return 0;

 return ranking[0].score-

 ranking[index].score;

}

/* ================================

   回収重視用

================================ */

function valueCandidates(ranking,dev){

 return ranking.map((x,i)=>{

  const r=x.racer;

  const gap=scoreGap(ranking,i);

  const st=getST(r);

  const m2=num(r.motor_top_2_percent);

  const m3=num(r.motor_top_3_percent);

  const lap=getLap(r);

  let value=x.score;

  const reasons=[];

  if(gap<=3){

   value+=12;

   reasons.push("AI評価差小");

  }else if(gap<=6){

   value+=8;

   reasons.push("AI評価差小");

  }else if(gap<=10){

   value+=4;

  }

  if(i>=3&&gap<=8){

   value+=8;

   reasons.push("順位以上に評価");

  }

  if(m2>=40){

   value+=5;

   reasons.push("M2連40%以上");

  }

  if(m3>=60){

   value+=3;

   reasons.push("M3連60%以上");

  }

  if(st>0&&st<=.16){

   value+=5;

   reasons.push("ST優秀");

  }

  if(lap>0){

   const laps=getRacers(raceData)

    .map(x=>getLap(x))

    .filter(x=>x>0);

   if(laps.length){

    const best=Math.min(...laps);

    if(lap-best<=.15){

     value+=5;

     reasons.push("一周タイム上位");

    }

   }

  }

  if(dev.type!=="イン逃げ"){

   if(x.number===dev.attacker){

    value+=7;

    reasons.push("攻め手");

   }

  }

  return{

   ...x,

   value,

   gap,

   valueReasons:reasons

  };

 }).sort(

  (a,b)=>b.value-a.value

 );

}

/* ================================

   展開後候補

================================ */

function afterCandidates(dev,ranking){

 if(dev.type==="イン逃げ")

  return[];

 return ranking

 .filter(

  x=>x.number!==dev.attacker

 )

 .map(x=>{

  let s=x.score;

  const c=x.course;

  if(dev.type==="まくり"){

   if(c>dev.course)

    s+=10;

   if(c===dev.course+1)

    s+=5;

  }

  if(dev.type==="差し"){

   if(c===1)

    s+=9;

   if(c===3)

    s+=5;

  }

  if(dev.type==="まくり差し"){

   if(c===1)

    s+=7;

   if(c===4)

    s+=6;

   if(c===5)

    s+=4;

  }

  return{

   ...x,

   afterScore:s

  };

 })

 .sort(

  (a,b)=>b.afterScore-a.afterScore

 );

}

/* ================================

   買い目重複防止

================================ */

function addPick(arr,combo,ranking,dev,trend){

 const n=combo.split("-").map(Number);

 if(n.length!==3)return;

 if(new Set(n).size!==3)return;

 if(n.some(x=>x<1||x>6))return;

 if(arr.some(x=>x.combo===combo))

  return;

 const rs=[];

 const tags=[];

 n.forEach((boat,index)=>{

  const r=

   ranking.find(x=>x.number===boat);

  if(!r)return;

  if(ranking.indexOf(r)<=2){

   tags.push("⭐AI上位");

   rs.push(

    `${boat}号艇AI評価${ranking.indexOf(r)+1}位`

   );

  }

  if(index===2&&r.gap<=8){

   tags.push("📊評価差小");

   rs.push(

    `${boat}号艇は評価ポイント差${r.gap.toFixed(1)}pt`

   );

  }

 });

 if(

  n[0]===dev.attacker&&

  dev.type!=="イン逃げ"

 ){

  tags.push("🔥攻め手");

  rs.push(

   `${dev.attacker}号艇の${dev.type}`

  );

 }

 if(

  n[0]===getAnalysisEntry()[0]&&

  dev.type==="イン逃げ"

 ){

  tags.push("🏠イン逃げ");

  rs.push(

   `イン逃げ期待度${trend.inside}%`

  );

 }

 const after=afterCandidates(

  dev,

  ranking

 );

 if(after.some(x=>x.number===n[2])){

  tags.push("🌊展開");

  rs.push("攻め後の展開を評価");

 }

 const third=

  ranking.find(x=>x.number===n[2]);

 if(third){

  const m2=

   num(third.racer.motor_top_2_percent);

  const st=getST(third);

  if(m2>=40){

   tags.push("⚙モーター");

   rs.push(

    `M2連率${format(m2)}%`

   );

  }

  if(st>0&&st<=.16){

   tags.push("💨ST");

   rs.push(

    `ST${format(st)}`

   );

  }

 }

 arr.push({

  combo,

  tags:[...new Set(tags)],

  text:

   [...new Set(rs)].join("。")||

   "AI・展開・機力を総合評価。"

 });

}

/* ================================

   的中重視 7点

================================ */

function buildHit(ranking,dev,trend){

 const arr=[];

 const a=ranking[0]?.number;

 const b=ranking[1]?.number;

 const c=ranking[2]?.number;

 const d=ranking[3]?.number;

 const inside=getAnalysisEntry()[0];

 const add=x=>

  addPick(arr,x,ranking,dev,trend);

 if(dev.type==="イン逃げ"){

  add(`${inside}-${b}-${a}`);

  add(`${inside}-${a}-${b}`);

  add(`${inside}-${b}-${c}`);

  add(`${inside}-${c}-${b}`);

  add(`${inside}-${a}-${d}`);

  add(`${inside}-${d}-${a}`);

  add(`${inside}-${c}-${d}`);

 }else{

  add(`${a}-${b}-${c}`);

  add(`${a}-${c}-${b}`);

  add(`${b}-${a}-${c}`);

  add(`${b}-${c}-${a}`);

  add(`${a}-${b}-${inside}`);

  add(`${a}-${inside}-${b}`);

  add(`${b}-${inside}-${a}`);

 }

 return fillSeven(

  arr,

  ranking,

  dev,

  trend,

  []

 );

}

/* ================================

   回収重視 7点

================================ */

function buildROI(ranking,dev,trend,hit){

 const arr=[];

 const used=

  hit.map(x=>x.combo);

 const values=

  valueCandidates(ranking,dev);

 const add=x=>{

  if(used.includes(x))

   return;

  addPick(

   arr,

   x,

   ranking,

   dev,

   trend

  );

 };

 const top=values.slice(0,5);

 for(const h of top){

  for(const s of top){

   if(h.number===s.number)

    continue;

   for(const t of top){

    if(

     t.number===h.number||

     t.number===s.number

    )

     continue;

    const firstValue=h.value;

    const secondValue=s.value;

    const thirdValue=t.value;

    if(

     firstValue>=secondValue&&

     secondValue>=thirdValue

    ){

     add(

      `${h.number}-${s.number}-${t.number}`

     );

    }

    if(arr.length>=7)

     break;

   }

   if(arr.length>=7)

    break;

  }

  if(arr.length>=7)

   break;

 }

 const after=

  afterCandidates(dev,ranking);

 if(arr.length<7&&after[0]){

  const x=after[0].number;

  const a=ranking[0]?.number;

  const b=ranking[1]?.number;

  add(`${x}-${a}-${b}`);

  add(`${x}-${b}-${a}`);

 }

 for(const h of values){

  if(arr.length>=7)

   break;

  if(h.gap<=10){

   const a=ranking[0]?.number;

   const b=ranking[1]?.number;

   add(`${a}-${b}-${h.number}`);

   add(`${b}-${a}-${h.number}`);

  }

 }

 for(const h of values){

  if(arr.length>=7)

   break;

  for(const s of values){

   if(arr.length>=7)

    break;

   if(h.number===s.number)

    continue;

   const a=ranking[0]?.number;

   if(

    a===h.number||

    a===s.number

   )

    continue;

   add(

    `${h.number}-${s.number}-${a}`

   );

  }

 }

 return fillSeven(

  arr,

  ranking,

  dev,

  trend,

  used

 );

}

/* ================================

   7点補完

================================ */

function fillSeven(

 arr,

 ranking,

 dev,

 trend,

 exclude

){

 const candidates=[];

 for(const a of ranking){

  for(const b of ranking){

   if(a.number===b.number)

    continue;

   for(const c of ranking){

    if(

     c.number===a.number||

     c.number===b.number

    )

     continue;

    candidates.push(

     `${a.number}-${b.number}-${c.number}`

    );

   }

  }

 }

 for(const combo of candidates){

  if(arr.length>=7)

   break;

  if(exclude.includes(combo))

   continue;

  addPick(

   arr,

   combo,

   ranking,

   dev,

   trend

  );

 }

 return arr.slice(0,7);

}

/* ================================

   大穴

================================ */

function buildHole(

 ranking,

 dev,

 trend,

 hit,

 roi

){

 const used=[

  ...hit.map(x=>x.combo),

  ...roi.map(x=>x.combo)

 ];

 const candidates=

  ranking

  .map((x,i)=>{

   if(i<3)

    return null;

   const r=x.racer;

   const m2=

    num(r.motor_top_2_percent);

   const m3=

    num(r.motor_top_3_percent);

   const st=getST(r);

   const attack=

    attackCandidates()

    .find(a=>a.boat===x.number);

   let score=0;

   const reasons=[];

   if(m2>=40){

    score+=3;

    reasons.push(

     `M2連率${format(m2)}%`

    );

   }

   if(m3>=60){

    score+=2;

    reasons.push(

     `M3連率${format(m3)}%`

    );

   }

   if(st>0&&st<=.16){

    score+=3;

    reasons.push(

     `ST${format(st)}`

    );

   }

   if(

    attack&&

    attack.score>=14

   ){

    score+=4;

    reasons.push("攻め手候補");

   }

   const after=

    afterCandidates(dev,ranking);

   if(

    after.some(y=>y.number===x.number)

   ){

    score+=3;

    reasons.push("展開利");

   }

   if(

    dev.type!=="イン逃げ"&&

    x.number===dev.attacker

   ){

    score+=4;

    reasons.push("攻め手");

   }

   return{

    ...x,

    holeScore:score,

    reasons

   };

  })

  .filter(Boolean)

  .sort(

   (a,b)=>b.holeScore-a.holeScore

  );

 const head=candidates[0];

 if(

  !head||

  head.holeScore<7

 )

  return null;

 const seconds=

  ranking

  .filter(

   x=>x.number!==head.number

  )

  .sort(

   (a,b)=>b.score-a.score

  );

 const second=seconds[0];

 if(!second)

  return null;

 const thirds=

  ranking

  .filter(

   x=>

    x.number!==head.number&&

    x.number!==second.number

  )

  .slice(0,2)

  .map(x=>x.number);

 if(thirds.length<2)

  return null;

 const combos=

  thirds.map(t=>

   `${head.number}-${second.number}-${t}`

  );

 const unique=

  combos.filter(

   x=>!used.includes(x)

  );

 if(!unique.length)

  return null;

 return{

  head:head.number,

  second:second.number,

  thirds,

  score:head.holeScore,

  reasons:head.reasons

 };

}

   4位以下でも上位との差が小さい艇は

   3着候補として積極的に評価します。

  </div>

 </div>`;

 let html="";

 rank.forEach((r,i)=>{

  html+=`

  <div class="rank">

   <div class="rank-number">

    ${i+1}位

   </div>

   <strong>

    ${r.number}号艇

    ${esc(r.name)}

   </strong>

   <div class="gold">

    ${r.score.toFixed(1)} pt

   </div>

   <div class="score-bar">

    <div

     class="score-fill"

     style="width:${Math.min(

      100,

      Math.max(5,r.score)

     )}%">

    </div>

   </div>

   <div class="note">

    1位との差：

    ${

     i===0

      ?"0.0"

      :

     (rank[0].score-r.score)

      .toFixed(1)

    }pt

   </div>

  </div>`;

 });

 document.getElementById("ranking")

 .innerHTML=html;

 const main=rank[0];

 const second=rank[1];

 document.getElementById("final")

 .innerHTML=`

 <div class="row">

  <span class="left">

   本命

  </span>

  <span class="right gold">

   ${main.number}号艇

   ${esc(main.name)}

  </span>

 </div>

 <div class="row">

  <span class="left">

   対抗

  </span>

  <span class="right">

   ${second.number}号艇

   ${esc(second.name)}

  </span>

 </div>

 <div class="row">

  <span class="left">

   穴・攻め手

  </span>

  <span class="right yellow">

   ${hole

    ?hole.head+"号艇"

    :"該当なし"}

  </span>

 </div>

 <div class="row">

  <span class="left">

   AI展開

  </span>

  <span class="right gold">

   ${

    dev.type==="イン逃げ"

     ?"イン逃げ"

     :

    dev.attacker+

    "号艇 "+

    dev.type

   }

  </span>

 </div>

 <div class="row">

  <span class="left">

   イン逃げ期待度

  </span>

  <span class="right ${cls}">

   ${trend.inside}%

  </span>

 </div>`;

 const budget=

  num(

   document.getElementById("budget").value

  )||3000;

 const hitUnit=Math.max(

  100,

  Math.floor((budget*.55/7)/100)*100

 );

 const roiUnit=Math.max(

  100,

  Math.floor((budget*.45/7)/100)*100

 );

 let picks="";

 picks+=renderPicks(

 "🎯 的中率重視",

 hit,

 hitUnit,

 "pick-main"

 );

 picks+=`

 <div class="ai-box">

  <strong>

   🎯 的中重視：7点

  </strong>

  <div class="note">

   AI評価上位を中心に、

   安定性と展開を優先。

  </div>

 </div>`;

 picks+=renderPicks(

 "🔥 回収率重視",

 roi,

 roiUnit,

 "pick-roi"

 );

 picks+=`

 <div class="ai-box">

  <strong>

   🔥 回収重視：7点

  </strong>

  <div class="note">

   AI順位だけで固定せず、

   評価ポイント差・展開・ST・

   モーター・一周タイムを総合評価。

   <br><br>

   <strong>

   4位以下でも評価差が小さい艇は

   3着候補に入れます。

   </strong>

  </div>

 </div>`;

 picks+=renderHole(hole);

 picks+=`

 <div class="ai-box">

  <strong>

   💡 BOAT HUNTERの基本

  </strong>

  <div class="note">

   🎯 的中重視 → AI評価上位中心

   <br><br>

   🔥 回収重視 → 評価差＋展開＋機力

   <br><br>

   💣 大穴 → AI評価1〜3位を除外。

   低評価でも頭を取る明確な根拠がある場合のみ。

  </div>

 </div>`;

 document.getElementById("pickArea")

 .innerHTML=picks;

}

document.addEventListener(

 "DOMContentLoaded",

 ()=>{

  document.getElementById(

   "loadButton"

  ).onclick=loadRace;

  document.getElementById(

   "clearButton"

  ).onclick=clearEntry;

  document.getElementById(

   "analyzeButton"

  ).onclick=()=>{

   if(!raceData){

    alert(

     "先に出走表を取得してください。"

    );

    return;

   }

   /*

    ★ここが今回の重要変更

    進入0件 → 123456として解析

    進入6件 → 入力した進入で解析

    1〜5件 → 入力途中なのでエラー

   */

   if(

    selectedEntry.length!==0&&

    selectedEntry.length!==6

   ){

    alert(

     "進入を入力する場合は6艇すべて入力してください。\n\n入力しない場合は枠なり123456として解析します。"

    );

    return;

   }

   showAnalysis();

  };

 }

);
