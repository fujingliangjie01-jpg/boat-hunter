<script>

"use strict";

const API_URL =

"https://boatraceopenapi.github.io/api/v1/today.json";

let raceData=null;

let selectedEntry=[];

/* =========================

   基本

========================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(d):"-";

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

function getRank(v){

 return {

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

/* =========================

   API

========================= */

async function fetchJson(url){

 const response=await fetch(

  url+"?t="+Date.now(),

  {

   method:"GET",

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error("HTTP "+response.status);

 }

 return await response.json();

}

function findRace(data,stadium,race){

 if(!data)return null;

 try{

  const direct=

   data?.programs

    ?.stadiums

    ?.[String(stadium)]

    ?.races

    ?.[String(race)];

  if(direct)return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)return;

  if(typeof o!=="object")return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* =========================

   レーサー

========================= */

function getRacers(race){

 if(!race)return[];

 const racers=race.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)return[];

 const racers=preview.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function boatNo(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number

 );

}

function racerName(r){

 return(

  r?.name ||

  r?.racer_name ||

  "選手名不明"

 );

}

function previewFor(r){

 return getPreviewRacers(raceData)

 .find(

  x=>boatNo(x)===boatNo(r)

 )||{};

}

function getST(r){

 return num(

  firstValue(r,[

   "start_timing",

   "st"

  ])

 );

}

function getExhibition(r){

 return num(

  firstValue(r,[

   "exhibition_time",

   "display_time"

  ])

 );

}

function getCourse(r){

 return num(

  firstValue(r,[

   "course_number",

   "course"

  ])

 );

}

/* =========================

   出走表

========================= */

function displayRace(){

 const box=document.getElementById("boats");

 box.innerHTML="";

 const racers=

  getRacers(raceData)

  .sort(

   (a,b)=>boatNo(a)-boatNo(b)

  );

 if(racers.length<6){

  box.innerHTML=

  `<div class="warning">

  ⚠️ 6艇の出走表を取得できませんでした。

  </div>`;

  return false;

 }

 racers.forEach(r=>{

  const p=previewFor(r);

  const st=getST(p);

  const ex=getExhibition(p);

  const div=document.createElement("div");

  div.className="boat";

  div.innerHTML=`

   <div class="boat-number">

    ${boatNo(r)}

   </div>

   <div class="boat-name">

    ${esc(racerName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${fmt(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${fmt(r.local_win_rate)}

   </div>

   <div class="metric">

    M${r.motor_number||"-"}

   </div>

   <div class="metric">

    M2連 ${fmt(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${fmt(r.motor_top_3_percent)}%

   </div>

   <div class="metric st">

    ST ${st>0?fmt(st):"-"}

   </div>

   <div class="metric exhibition">

    展示 ${ex>0?fmt(ex):"-"}

   </div>

  `;

  box.appendChild(div);

 });

 return true;

}

/* =========================

   直前情報

========================= */

function displayPreview(){

 const box=document.getElementById("previewInfo");

 const p=raceData?.preview;

 if(!p){

  box.innerHTML=

  `<div class="warning">

   ⚠️ 直前情報なし

  </div>`;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">風向番号</div>

   <div class="info-value">

    ${p.wind_direction_number??"-"}

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* =========================

   展示

========================= */

function displayPreviewRacers(){

 const box=

  document.getElementById(

   "previewRacers"

  );

 const racers=

  getPreviewRacers(raceData)

  .sort(

   (a,b)=>boatNo(a)-boatNo(b)

  );

 if(!racers.length){

  box.innerHTML=

  `<div class="warning">

   ⚠️ 展示・ST・直前進入データなし

  </div>`;

  return;

 }

 let html=`

 <table class="table">

 <thead>

 <tr>

  <th>艇</th>

  <th>進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  html+=`

  <tr>

   <td>

    ${boatNo(r)}号艇

   </td>

   <td class="gold">

    ${

     getCourse(r)>0

     ?getCourse(r)+"コース"

     :"－"

    }

   </td>

   <td class="orange">

    ${

     getST(r)>0

     ?fmt(getST(r))

     :"－"

    }

   </td>

   <td class="yellow">

    ${

     getExhibition(r)>0

     ?fmt(getExhibition(r))

     :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 `;

 box.innerHTML=html;

}

/* =========================

   進入

========================= */

function createEntryButtons(){

 const box=

  document.getElementById(

   "entryButtons"

  );

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.onclick=()=>{

   selectEntry(i);

  };

  box.appendChild(b);

 }

}

function selectEntry(n){

 if(selectedEntry.includes(n))

  return;

 if(selectedEntry.length>=6)

  return;

 selectedEntry.push(n);

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  selectedEntry.join("-");

}

function updateEntryButtons(){

 document.querySelectorAll(

  ".entry-btn"

 ).forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  "進入を入力してください";

}

function getEntry(){

 if(selectedEntry.length===6)

  return [...selectedEntry];

 return[1,2,3,4,5,6];

}

========================= */

/* =========================

   選手攻め特性

========================= */

function racerPattern(r,course){

 const n2=num(r.national_top_2_percent);

 const n3=num(r.national_top_3_percent);

 const st=getST(previewFor(r));

 const ex=getExhibition(previewFor(r));

 let data={

  escape:0,

  difference:0,

  makuri:0,

  makuriSashi:0

 };

 /*

  実データ項目が存在する場合は

  それを優先して利用

 */

 const directKeys={

  difference:[

   "difference_rate",

   "sashi_rate",

   "course_difference_rate"

  ],

  makuri:[

   "makuri_rate",

   "course_makuri_rate"

  ],

  makuriSashi:[

   "makuri_sashi_rate",

   "makurisashi_rate",

   "course_makuri_sashi_rate"

  ],

  escape:[

   "escape_rate",

   "course_escape_rate"

  ]

 };

 Object.keys(directKeys).forEach(k=>{

  const v=firstValue(

   r,

   directKeys[k]

  );

  if(v!==null)

   data[k]=num(v);

 });

 /*

  APIに決まり手率が無い場合の推定

 */

 if(

  data.escape===0 &&

  data.difference===0 &&

  data.makuri===0 &&

  data.makuriSashi===0

 ){

  if(course===1){

   data.escape=

    Math.min(

     90,

     Math.max(

      35,

      55+

      n2*.15+

      n3*.05

    )

   );

  }else{

   data.difference=

    20+

    n2*.15;

   data.makuri=

    20+

    (st>0&&st<=.15?15:0)+

    (ex>0&&ex<=6.80?10:0);

   data.makuriSashi=

    30+

    (n3>=60?10:0);

  }

 }

 const total=

  data.escape+

  data.difference+

  data.makuri+

  data.makuriSashi;

 if(total>0){

  data.escape=

   data.escape/total*100;

  data.difference=

   data.difference/total*100;

  data.makuri=

   data.makuri/total*100;

  data.makuriSashi=

   data.makuriSashi/total*100;

 }

 return data;

}

/* =========================

   場×選手攻め

========================= */

function attackCompatibility(

 pattern,

 course,

 venue

){

 let score={

  escape:1,

  difference:1,

  makuri:1,

  makuriSashi:1

 };

 if(course===1){

  score.escape+=

   venue.escape/10;

 }else{

  if(

   venue.attack.includes("差し")

  )

   score.difference+=3;

  if(

   venue.attack.includes("まくり")

  )

   score.makuri+=3;

  if(

   venue.attack.includes("まくり差し")

  )

   score.makuriSashi+=4;

 }

 return{

  escape:

   pattern.escape*score.escape,

  difference:

   pattern.difference*score.difference,

  makuri:

   pattern.makuri*score.makuri,

  makuriSashi:

   pattern.makuriSashi*score.makuriSashi

 };

}

function baseScore(r,course){

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const n2=

  num(r.national_top_2_percent);

 const n3=

  num(r.national_top_3_percent);

 const l2=

  num(r.local_top_2_percent);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 let s=0;

 s+=national*6;

 s+=local*3;

 s+=n2*.08;

 s+=n3*.04;

 s+=l2*.04;

 s+=m2*.18;

 s+=m3*.07;

 if(st>0)

  s+=Math.max(0,.25-st)*25;

 if(ex>0)

  s+=Math.max(0,6.90-ex)*8;

 s+=({

  1:10,

  2:6,

  3:5,

  4:4,

  5:2,

  6:0

 }[course]||0);

 const rank=num(r.rank_number);

 if(rank===1)s+=5;

 if(rank===2)s+=3;

 if(rank===4)s-=2;

 return s;

}

function characteristicScore(

 r,

 course,

 dev

){

 const venue=

  VENUE_FEATURES[

   num(document.getElementById("venue").value)

  ]||VENUE_FEATURES[1];

 let score=0;

 const pattern=

  racerPattern(r,course);

 const compatible=

  attackCompatibility(

   pattern,

   course,

   venue

  );

 /*

  1号艇

 */

 if(course===1){

  score+=

   (venue.escape-50)*.25;

 }else{

  score+=

   compatible.difference*.04;

  score+=

   compatible.makuri*.04;

  score+=

   compatible.makuriSashi*.05;

  /*

   攻め手が展開予想と一致

  */

  if(

   dev.type==="差し" &&

   boatNo(r)===dev.attacker

  ){

   score+=8;

  }

  if(

   dev.type==="まくり" &&

   boatNo(r)===dev.attacker

  ){

   score+=10;

  }

 }

 /*

  STの攻め適性

 */

 const st=getST(

  previewFor(r)

 );

 if(st>0&&st<=.15&&course>=3)

  score+=5;

 if(st>=.21)

  score-=3;

 return score;

}

/* =========================

   攻め

========================= */

function attackScore(r,course){

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 let s=0;

 if(st>0){

  if(st<=.12)s+=20;

  else if(st<=.15)s+=16;

  else if(st<=.18)s+=10;

  else if(st<=.20)s+=4;

 }

 if(ex>0){

  if(ex<=6.70)s+=15;

  else if(ex<=6.80)s+=10;

  else if(ex<=6.90)s+=4;

 }

 if(m2>=45)s+=15;

 else if(m2>=40)s+=11;

 else if(m2>=35)s+=7;

 else if(m2>=30)s+=3;

 if(m3>=65)s+=10;

 else if(m3>=60)s+=7;

 else if(m3>=55)s+=4;

 if(course>=4)s+=7;

 if(course===3)s+=5;

 if(course===2)s+=3;

 return s;

}

 }

 return s;

}

/* =========================

   コンボ

========================= */

function validCombo(a,b,c){

 return(

  Number.isInteger(a)&&

  Number.isInteger(b)&&

  Number.isInteger(c)&&

  a>=1&&a<=6&&

  b>=1&&b<=6&&

  c>=1&&c<=6&&

  a!==b&&

  a!==c&&

  b!==c

 );

}

function pushPick(arr,combo,reason){

 if(

  !arr.some(

   x=>x.combo===combo

  )

 ){

  arr.push({

   combo,

   reason

  });

 }

}

 const r3=rank[2]?.boat;

 const r4=rank[3]?.boat;

 const arr=[];

 function add(a,b,c,text){

  if(!validCombo(a,b,c))

   return;

  if(arr.length>=7)

   return;

  pushPick(

   arr,

   `${a}-${b}-${c}`,

   text

  );

 }

 add(

  r1,r2,r3,

  "AI評価1位頭＋評価2・3位"

 );

 add(

  r1,r3,r2,

  "AI評価1位頭＋評価上位入替"

 );

 add(

  r2,r1,r3,

  "AI評価2位頭＋評価1・3位"

 );

 add(

  r2,r3,r1,

  "AI評価2位頭＋評価1・3位入替"

 );

 if(dev.type==="イン逃げ"){

  add(

   first,r1,r2,

   "イン逃げ想定＋AI上位"

  );

  add(

   first,r2,r1,

   "イン逃げ想定＋AI上位入替"

  );

 }else{

  add(

   dev.attacker,r1,r2,

   "展開の攻め手頭＋AI上位"

  );

  add(

   dev.attacker,r2,r1,

   "攻め手頭＋相手入替"

  );

 }

 const candidates=[

  [r1,r2,r4],

  [r1,r4,r2],

  [r2,r1,r4],

  [r2,r4,r1],

  [r3,r1,r2],

  [r3,r2,r1]

 ];

 for(const c of candidates){

  if(arr.length>=7)

   break;

  add(

   c[0],

   c[1],

   c[2],

   "AI評価上位を補完"

  );

 }

 return arr.slice(0,7);

}

function buildROI(rank,dev){

 const entry=getEntry();

 /*

  AI評価1位を頭の軸

 */

 const main=rank[0]?.boat;

 const second=rank[1]?.boat;

 const middle=rank.slice(2,5);

 const low=rank.slice(3,6);

 const arr=[];

 function add(a,b,c,text){

  if(!validCombo(a,b,c))

   return;

  if(arr.length>=7)

   return;

  pushPick(

   arr,

   `${a}-${b}-${c}`,

   text

  );

 }

 /*

  頭は的中重視と同じ

 */

 add(

  main,

  second,

  rank[2]?.boat,

  "AI評価1位頭＋上位相手"

 );

 add(

  main,

  rank[2]?.boat,

  second,

  "AI評価1位頭＋上位入替"

 );

 /*

  AI評価2位頭も確保

 */

 add(

  second,

  main,

  rank[2]?.boat,

  "AI評価2位頭＋本命"

 );

 /*

  ここが今回の変更ポイント。

  2・3着に評価中位〜低位を投入

 */

 for(const x of middle){

  if(x.boat===main||x.boat===second)

   continue;

  add(

   main,

   x.boat,

   second,

   "本命頭＋AI評価中位を2着"

  );

  add(

   main,

   second,

   x.boat,

   "本命頭＋AI評価中位を3着"

  );

  if(arr.length>=7)

   break;

 }

 /*

  展開の攻め手が強い場合

 */

 if(

  dev.type!=="イン逃げ" &&

  dev.attacker!==main

 ){

  add(

   main,

   dev.attacker,

   second,

   "本命頭＋展開攻め手"

  );

 }

 /*

  足りない場合

 */

 for(const x of low){

  if(arr.length>=7)

   break;

  if(

   x.boat===main||

   x.boat===second

  )

   continue;

  add(

   main,

   x.boat,

   rank[2]?.boat,

   "本命頭＋中低評価の期待値狙い"

  );

 }

 return arr.slice(0,7);

}

/* =========================

   大穴

========================= */

function holeScore(r,course,dev){

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const national=

  num(r.national_win_rate);

 let s=0;

 if(course>=4)s+=18;

 if(course>=5)s+=10;

 if(course===6)s+=5;

 if(m2>=40)s+=12;

 else if(m2>=35)s+=8;

 else if(m2>=30)s+=4;

 if(m3>=60)s+=10;

 else if(m3>=55)s+=6;

 if(st>0&&st<=.15)s+=16;

 else if(st>0&&st<=.18)s+=8;

 if(ex>0&&ex<=6.80)s+=10;

 if(national>=7.0)s-=12;

 else if(national>=6.5)s-=6;

 s+=

  characteristicScore(

   r,

   course,

   dev

  )*.7;

 return s;

}

function buildHole(rank,dev,usedCombos){

 const entry=getEntry();

 const top1=rank[0]?.boat;

 const top2=rank[1]?.boat;

 const list=

  getRacers(raceData)

  .map(r=>{

   const boat=boatNo(r);

   const course=

    entry.indexOf(boat)+1;

   return{

    boat,

    course,

    score:

     holeScore(

      r,

      course,

      dev

     )

   };

  })

  .filter(

   x=>

    x.boat!==top1 &&

    x.boat!==top2

  )

  .sort(

   (a,b)=>b.score-a.score

  );

 const arr=[];

 for(const x of list){

  for(const y of list){

   if(

    x.boat===y.boat

   )

    continue;

   const z=

    list.find(

     q=>

      q.boat!==x.boat &&

      q.boat!==y.boat

    );

   if(!z)

    continue;

   const combos=[

    `${x.boat}-${y.boat}-${z.boat}`,

    `${y.boat}-${x.boat}-${z.boat}`,

    `${y.boat}-${z.boat}-${x.boat}`

   ];

   for(const combo of combos){

    if(arr.length>=3)

     break;

    if(

     usedCombos.includes(combo)

    )

     continue;

    const p=

     combo.split("-")

     .map(Number);

    if(

     validCombo(

      p[0],

      p[1],

      p[2]

     )

    ){

     arr.push({

      combo,

      reason:

       "外枠・機力・ST・場特性から穴狙い"

     });

    }

   }

   if(arr.length>=3)

    break;

  }

  if(arr.length>=3)

   break;

 }

 return arr.slice(0,3);

}

/* =========================

   掛け金

========================= */

function makeMoney(

 picks,

 budget,

 type

){

 if(!picks.length)

  return[];

 let total=

  Math.floor(

   num(budget)/100

  )*100;

 if(total<100)

  total=100;

 let weights=[];

 /*

  回収重視も「大穴順」ではなく

  上位評価順に厚くする

 */

 if(type==="hit"){

  weights=

   picks.map(

    (_,i)=>

     i===0?5:

     i===1?4:

     i===2?3:

     2

   );

 }else if(type==="roi"){

  weights=

   picks.map(

    (_,i)=>

     i===0?5:

     i===1?4:

     i===2?3:

     2

   );

 }else{

  weights=

   picks.map(

    (_,i)=>

     i===0?3:

     i===1?2:

     1

   );

 }

 const weightTotal=

  weights.reduce(

   (a,b)=>a+b,

   0

  );

 let money=

  weights.map(

   w=>

    Math.floor(

     total*w/

     weightTotal/

     100

    )*100

  );

 money=

  money.map(

   x=>x<100?100:x

  );

 let current=

  money.reduce(

   (a,b)=>a+b,

   0

  );

 while(current>total){

  let index=-1;

  for(

   let i=money.length-1;

   i>=0;

   i--

  ){

   if(money[i]>100){

    index=i;

    break;

   }

  }

  if(index===-1)

   break;

  money[index]-=100;

  current-=100;

 }

 let i=0;

 while(current+100<=total){

  money[i%money.length]+=100;

  current+=100;

  i++;

 }

 return money;

}
