<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{

box-sizing:border-box;

}

body{

margin:0;

background:#080808;

color:#fff;

font-family:

-apple-system,

BlinkMacSystemFont,

"Segoe UI",

sans-serif;

}

header{

background:#000;

border-bottom:1px solid #d4af37;

padding:22px 15px;

text-align:center;

}

.logo{

font-size:30px;

font-weight:900;

letter-spacing:4px;

color:#d4af37;

}

.tagline{

font-size:12px;

color:#888;

margin-top:6px;

}

.container{

max-width:900px;

margin:auto;

padding:18px;

}

.card{

background:#151515;

border:1px solid #292929;

border-radius:14px;

padding:18px;

margin-bottom:18px;

}

.title{

font-size:18px;

font-weight:900;

color:#d4af37;

margin-bottom:16px;

}

label{

display:block;

font-size:13px;

color:#999;

margin-bottom:6px;

}

select,

input{

width:100%;

padding:13px;

margin-bottom:15px;

border-radius:8px;

border:1px solid #444;

background:#0b0b0b;

color:#fff;

font-size:15px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:10px;

background:linear-gradient(

135deg,

#d4af37,

#9b7418

);

color:#000;

font-size:16px;

font-weight:900;

cursor:pointer;

}

button:active{

transform:scale(.98);

}

.status{

text-align:center;

color:#d4af37;

margin-top:12px;

font-size:13px;

}

.hidden{

display:none;

}

.race-info{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}

.info{

background:#0c0c0c;

padding:13px;

border-radius:8px;

border:1px solid #292929;

}

.info span{

display:block;

color:#888;

font-size:11px;

margin-bottom:5px;

}

.info strong{

font-size:16px;

}

.boats{

display:grid;

grid-template-columns:

repeat(6,1fr);

gap:8px;

}

.boat{

background:#0d0d0d;

border:1px solid #333;

border-radius:10px;

padding:12px 5px;

text-align:center;

}

.boat-number{

font-size:23px;

font-weight:900;

}

.boat-name{

font-size:11px;

margin-top:5px;

}

.metric{

font-size:10px;

color:#888;

margin-top:5px;

}

.row{

display:flex;

justify-content:space-between;

gap:10px;

padding:12px 0;

border-bottom:1px solid #292929;

}

.row:last-child{

border-bottom:none;

}

.left{

color:#999;

}

.right{

font-weight:900;

text-align:right;

}

.gold{

color:#d4af37;

}

.green{

color:#65df8b;

}

.red{

color:#ff6f61;

}

.yellow{

color:#ffd34d;

}

.entry-box{

font-size:27px;

font-weight:900;

color:#d4af37;

text-align:center;

padding:18px;

background:#0b0b0b;

border:1px solid #333;

border-radius:10px;

}

.warning{

background:#211b08;

border:1px solid #8d6c16;

padding:15px;

border-radius:10px;

line-height:1.7;

}

.rank{

background:#0c0c0c;

border:1px solid #292929;

border-radius:10px;

padding:14px;

margin-bottom:9px;

}

.rank-number{

color:#d4af37;

font-weight:900;

}

.pick{

font-size:24px;

font-weight:900;

color:#d4af37;

margin-top:8px;

}

.note{

font-size:11px;

color:#777;

margin-top:6px;

line-height:1.6;

}

footer{

text-align:center;

color:#444;

font-size:11px;

padding:25px;

}

@media(max-width:600px){

.boats{

grid-template-columns:

repeat(3,1fr);

}

.race-info{

grid-template-columns:1fr;

}

.logo{

font-size:25px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

BOAT HUNTER

</div>

<div class="tagline">

人気ではなく期待値で勝つ

</div>

</header>

<main class="container">

<!-- レース選択 -->

<section class="card">

<div class="title">

🎯 レース選択

</div>

<label>

競艇場

</label>

<select id="venue">

<option>桐生</option>

<option>戸田</option>

<option>江戸川</option>

<option>平和島</option>

<option>多摩川</option>

<option>浜名湖</option>

<option>蒲郡</option>

<option>常滑</option>

<option>津</option>

<option>三国</option>

<option>びわこ</option>

<option>住之江</option>

<option>尼崎</option>

<option>鳴門</option>

<option>丸亀</option>

<option>児島</option>

<option>宮島</option>

<option>徳山</option>

<option>下関</option>

<option>若松</option>

<option>芦屋</option>

<option>福岡</option>

<option>唐津</option>

<option>大村</option>

</select>

<label>

レース

</label>

<select id="race">

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

<option>5</option>

<option>6</option>

<option>7</option>

<option>8</option>

<option>9</option>

<option>10</option>

<option>11</option>

<option>12</option>

</select>

<label>

予算

</label>

<input

id="budget"

type="number"

value="3000"

min="100"

step="100"

>

<button onclick="startAnalysis()">

🔥 AI解析開始

</button>

<div

id="status"

class="status"

></div>

</section>

<!-- 結果 -->

<div

id="result"

class="hidden"

>

<!-- 基本情報 -->

<section class="card">

<div class="title">

📊 レース情報

</div>

<div class="race-info">

<div class="info">

<span>競艇場</span>

<strong id="showVenue">-</strong>

</div>

<div class="info">

<span>レース</span>

<strong id="showRace">-</strong>

</div>

</div>

</section>

<!-- 出走表 -->

<section class="card">

<div class="title">

🚤 出走表

</div>

<div

id="boats"

class="boats"

></div>

</section>

<!-- 前付け -->

<section class="card">

<div class="title">

⚠️ 前付け解析

</div>

<div class="warning">

このレースの前付け可能性を分析します。

<br>

<strong>

重要：

</strong>

前付けは「外枠だからする」とは判断せず、

<br>

・過去の進入

<br>

・選手のコース取り傾向

<br>

・当地進入傾向

<br>

・展示進入

<br>

・ピット離れ

を総合して判定します。

</div>

<div

id="maezuke"

style="margin-top:15px"

></div>

</section>

<!-- 本番進入 -->

<section class="card">

<div class="title">

🚦 本番進入予想

</div>

<div

id="entry"

class="entry-box"

>

-

</div>

<div

id="entryReason"

class="note"

style="text-align:center"

>

-

</div>

</section>

<!-- 展開 -->

<section class="card">

<div class="title">

🧠 展開予想

</div>

<div id="development">

</div>

</section>

<!-- AIランキング -->

<section class="card">

<div class="title">

🏆 AI期待値ランキング

</div>

<div id="ranking">

</div>

</section>

<!-- 最終評価 -->

<section class="card">

<div class="title">

🎯 最終評価

</div>

<div id="final">

</div>

</section>

<!-- 買い目 -->

<section class="card">

<div class="title">

💰 買い目

</div>

<div class="rank">

<strong>

的中率重視

</strong>

<div

id="hitPick"

class="pick"

>

-

</div>

<div

id="hitMoney"

class="note"

>

-

</div>

</div>

<div class="rank">

<strong>

回収率重視

</strong>

<div

id="roiPick"

class="pick"

>

-

</div>

<div

id="roiMoney"

class="note"

>

-

</div>

</div>

</section>

</div>

</main>

<footer>

BOAT HUNTER © 2026

</footer>

<script>

/*

========================================

BOAT HUNTER ENGINE

========================================

*/

function startAnalysis(){

const venue =

document.getElementById(

"venue"

).value;

const race =

document.getElementById(

"race"

).value;

const budget =

Number(

document.getElementById(

"budget"

).value

);

const status =

document.getElementById(

"status"

);

status.innerText =

"⏳ レース情報を解析中...";

document.getElementById(

"result"

).classList.add(

"hidden"

);

setTimeout(

function(){

runAnalysis(

venue,

race,

budget

);

status.innerText =

"✅ 解析完了";

document.getElementById(

"result"

).classList.remove(

"hidden"

);

},

800

);

}

/*

========================================

ANALYSIS

========================================

*/

function runAnalysis(

venue,

race,

budget

){

document.getElementById(

"showVenue"

).innerText =

venue;

document.getElementById(

"showRace"

).innerText =

race + "R";

/*

----------------------------------------

仮の出走データ

----------------------------------------

*/

const boats = [

{

number:1,

name:"選手1",

score:88,

maezuke:false

},

{

number:2,

name:"選手2",

score:81,

maezuke:false

},

{

number:3,

name:"選手3",

score:76,

maezuke:false

},

{

number:4,

name:"選手4",

score:70,

maezuke:false

},

{

number:5,

name:"選手5",

score:64,

maezuke:false

},

{

number:6,

name:"選手6",

score:72,

maezuke:true

}

];

/*

----------------------------------------

出走表表示

----------------------------------------

*/

const boatsElement =

document.getElementById(

"boats"

);

boatsElement.innerHTML = "";

boats.forEach(

function(boat){

const div =

document.createElement(

"div"

);

div.className =

"boat";

div.innerHTML = `

<div class="boat-number">

${boat.number}

</div>

<div class="boat-name">

${boat.name}

</div>

<div class="metric">

AI ${boat.score}

</div>

`;

boatsElement.appendChild(

div

);

});

/*

========================================

前付け判定

========================================

ここが今後の重要部分。

現段階では実データAPI接続前なので

「前付け候補」という表示にする。

========================================

*/

const candidate =

boats.find(

boat => boat.maezuke

);

const maezukeElement =

document.getElementById(

"maezuke"

);

if(candidate){

maezukeElement.innerHTML = `

<div class="row">

<span class="left">

前付け候補

</span>

<span class="right yellow">

${candidate.number}号艇

</span>

</div>

<div class="row">

<span class="left">

現段階の判定

</span>

<span class="right yellow">

要警戒

</span>

</div>

<div class="row">

<span class="left">

信頼度

</span>

<span class="right">

データ取得後に算出

</span>

</div>

`;

}else{

maezukeElement.innerHTML = `

<div class="row">

<span class="left">

前付け

</span>

<span class="right green">

なし

</span>

</div>

`;

}

/*

========================================

進入予想

========================================

*/

let entry;

if(candidate){

entry =

"1-6-2-3-4-5";

}else{

entry =

"1-2-3-4-5-6";

}

document.getElementById(

"entry"

).innerText =

entry;

document.getElementById(

"entryReason"

).innerText =

candidate

?

"外枠艇の前付けを想定。1号艇の深インに注意。"

:

"前付け材料が弱く、枠なり進入を想定。";

/*

========================================

展開予想

========================================

*/

document.getElementById(

"development"

).innerHTML = `

<div class="row">

<span class="left">

逃げ

</span>

<span class="right gold">

1号艇

</span>

</div>

<div class="row">

<span class="left">

差し

</span>

<span class="right">

2号艇

</span>

</div>

<div class="row">

<span class="left">

まくり

</span>

<span class="right">

3・4号艇

</span>

</div>

<div class="row">

<span class="left">

展開穴

</span>

<span class="right yellow">

6号艇

</span>

</div>

`;

/*

========================================

ランキング

========================================

*/

const ranking =

boats

.slice()

.sort(

(a,b)=>

b.score-a.score

);

const rankingElement =

document.getElementById(

"ranking"

);

rankingElement.innerHTML =

"";

ranking.forEach(

function(

boat,

index

){

const div =

document.createElement(

"div"

);

div.className =

"rank";

div.innerHTML = `

<div class="rank-number">

${index+1}位

</div>

<strong>

${boat.number}号艇

</strong>

<div class="pick">

${boat.score}pt

</div>

<div class="note">

能力・展開・進入を総合した

AI期待値スコア

</div>

`;

rankingElement.appendChild(

div

);

});

/*

========================================

最終評価

========================================

*/

document.getElementById(

"final"

).innerHTML = `

<div class="row">

<span class="left">

本命

</span>

<span class="right gold">

1号艇

</span>

</div>

<div class="row">

<span class="left">

対抗

</span>

<span class="right">

2号艇

</span>

</div>

<div class="row">

<span class="left">

穴

</span>

<span class="right yellow">

6号艇

</span>

</div>

<div class="row">

<span class="left">

前付け警戒

</span>

<span class="right red">

6号艇

</span>

</div>

`;

/*

========================================

買い目

========================================

*/

const hitMoney =

Math.floor(

budget * 0.6

);

const roiMoney =

budget-hitMoney;

document.getElementById(

"hitPick"

).innerText =

"1-2-3 / 1-3-2";

document.getElementById(

"hitMoney"

).innerText =

"予算 " +

hitMoney +

"円";

document.getElementById(

"roiPick"

).innerText =

"2-3-1 / 3-2-1 / 6-2-1";

document.getElementById(

"roiMoney"

).innerText =

"予算 " +

roiMoney +

"円";

}

</script>

</body>

</html>
