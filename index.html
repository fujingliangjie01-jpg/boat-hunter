<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#050505;

  color:#fff;

  font-family:Arial,sans-serif;

}

header{

  background:#000;

  color:#d4af37;

  text-align:center;

  padding:22px 10px;

  font-size:30px;

  font-weight:bold;

  border-bottom:2px solid #d4af37;

}

.sub{

  text-align:center;

  color:#aaa;

  padding:10px;

}

.container{padding:15px}

.card{

  background:#151515;

  border:1px solid #d4af37;

  border-radius:14px;

  padding:16px;

  margin-bottom:16px;

}

.title{

  color:#d4af37;

  font-size:19px;

  font-weight:bold;

  margin-bottom:14px;

}

label{

  display:block;

  color:#aaa;

  font-size:13px;

  margin-top:8px;

}

select,input{

  width:100%;

  padding:12px;

  margin-top:5px;

  margin-bottom:8px;

  border-radius:7px;

  border:1px solid #555;

  font-size:16px;

}

button{

  width:100%;

  padding:15px;

  margin-top:10px;

  background:#d4af37;

  color:#000;

  border:0;

  border-radius:10px;

  font-size:17px;

  font-weight:bold;

}

.boat{

  border:1px solid #333;

  padding:12px;

  margin-bottom:12px;

  border-radius:10px;

  background:#101010;

}

.boat h3{

  color:#d4af37;

  margin:0 0 8px;

}

.result{

  display:flex;

  justify-content:space-between;

  padding:12px;

  margin:7px 0;

  background:#222;

  border-radius:8px;

}

.gold{color:#d4af37}

.center{text-align:center}

.hidden{display:none}

</style>

</head>

<body>

<header>🚤 BOAT HUNTER</header>

<div class="sub">人気ではなく期待値で勝つ</div>

<div class="container">

<!-- ホーム -->

<div id="home">

<div class="card">

<div class="title">🏟 レース情報</div>

<label>競艇場</label>

<select id="venue">

<option>桐生</option>

<option>戸田</option>

<option>江戸川</option>

<option>平和島</option>

<option>多摩川</option>

<option>浜名湖</option>

<option>蒲郡</option>

<option>常滑</option>

<option>津</option>

<option>三国</option>

<option>びわこ</option>

<option>住之江</option>

<option>尼崎</option>

<option>鳴門</option>

<option>丸亀</option>

<option>児島</option>

<option>宮島</option>

<option>徳山</option>

<option>下関</option>

<option>若松</option>

<option>芦屋</option>

<option>福岡</option>

<option>唐津</option>

<option>大村</option>

</select>

<label>レース番号</label>

<select id="race">

<option>1R</option>

<option>2R</option>

<option>3R</option>

<option>4R</option>

<option>5R</option>

<option>6R</option>

<option>7R</option>

<option>8R</option>

<option>9R</option>

<option>10R</option>

<option>11R</option>

<option>12R</option>

</select>

<label>予算（円）</label>

<input id="budget" type="number" placeholder="例：5000">

<button onclick="showInput()">AI解析開始</button>

</div>

</div>

<!-- データ入力 -->

<div id="inputPage" class="hidden">

<div class="card">

<div class="title">📊 6艇データ入力</div>

<p style="color:#aaa;font-size:13px">

全国勝率・モーター2連率・平均STを入力してください。

</p><div class="card">

<div class="title">🌊 水面・進入情報</div><div class="card">

<div class="title">💰 オッズ情報</div>

<label>本命想定オッズ</label>

<input id="odds1" type="number" step="0.1" placeholder="例 2.5">

<label>対抗想定オッズ</label>

<input id="odds2" type="number" step="0.1" placeholder="例 4.5">

<label>穴想定オッズ</label>

<input id="odds3" type="number" step="0.1" placeholder="例 10.0">

</div>

<label>風速（m）</label>

<input id="wind" type="number" step="0.1" placeholder="例 3.0">

<label>風向</label>

<select id="windDir">

<option>追い風</option>

<option>向かい風</option>

<option>左横風</option>

<option>右横風</option>

<option>無風</option>

</select>

<label>波高（cm）</label>

<input id="wave" type="number" step="1" placeholder="例 3">

<label>進入予想</label>

<input id="entry" placeholder="例 123456">

</div>

</div>

<div id="boats"></div>

<button onclick="analyze()">🔥 解析する</button>

</div>

<!-- 結果 -->

<div id="resultPage" class="hidden">

<div class="card">

<div class="title">🔥 AI期待値ランキング</div>

<div id="ranking"></div>

</div>

<div class="card">

<div class="title">🏆 AI判定</div>

<div id="judgement"></div>

</div>

<div class="card">

<div class="title">🌊 展開予想</div>

<div id="development"></div>

</div>

<div class="card">

<div class="title">💰 買い目</div>

<h3 class="gold">🎯 的中率重視</h3>

<div id="safe"></div>

<h3 class="gold">💎 回収率重視</h3>

<div id="value"></div>

</div>

<button onclick="location.reload()">↩ 最初に戻る</button>

</div>

</div>

<script>

function showInput(){

  document.getElementById("home").classList.add("hidden");

  document.getElementById("inputPage").classList.remove("hidden");

  let html="";

  for(let i=1;i<=6;i++){

    html += `

    <div class="boat">

    <h3>${i}号艇</h3>

    <label>選手名</label>

    <input id="name${i}" placeholder="選手名">

    <label>級別</label>

    <select id="class${i}">

      <option>A1</option>

      <option>A2</option>

      <option>B1</option>

      <option>B2</option>

    </select>

    <label>全国勝率</label>

<input id="win${i}" type="number" step="0.01" placeholder="例 6.50">

<label>当地勝率</label>

<input id="local${i}" type="number" step="0.01" placeholder="例 6.80">

<label>モーター2連率（%）</label>

    <input id="motor${i}" type="number" step="0.1" placeholder="例 40.0">

    <label>平均ST</label>

    <input id="st${i}" type="number" step="0.01" placeholder="例 0.15"><label>展示タイム</label>

<input id="exhibit${i}" type="number" step="0.01" placeholder="例 6.80">

    </div>`;

  }

  document.getElementById("boats").innerHTML=html;

}

function analyze(){

  let data=[];

  for(let i=1;i<=6;i++){

    let name=document.getElementById("name"+i).value || i+"号艇";

    let cls=document.getElementById("class"+i).value;

    let win=parseFloat(document.getElementById("win"+i).value)||0;

    let local=parseFloat(document.getElementById("local"+i).value)||0;

    let motor=parseFloat(document.getElementById("motor"+i).value)||0;

    let st=parseFloat(document.getElementById("st"+i).value)||0.20;

    let exhibit=parseFloat(document.getElementById("exhibit"+i).value)||0;

    let classPoint={

      "A1":5,

      "A2":4,

      "B1":2,

      "B2":1

    }[cls];

    /*

      BOAT HUNTER SCORE

      100点満点

    */

    let winScore=Math.min(win/8*15,15);

    let localScore=Math.min(local/8*15,15);

    let motorScore=Math.min(motor/50*15,15);

    let stScore=Math.max(0,Math.min((0.20-st)*50,10));

    let exhibitScore=0;

    if(exhibit>0){

      exhibitScore=Math.max(0,Math.min((7.0-exhibit)*10,10));

    }

    /*

      1号艇のコース優位を簡易評価

    */

    let courseScore=20;

    if(i===1){

      courseScore=20;

    }else if(i===2){

      courseScore=15;

    }else if(i===3){

      courseScore=13;

    }else if(i===4){

      courseScore=10;

    }else if(i===5){

      courseScore=7;

    }else{

      courseScore=5;

    }

    let waterScore=5;

    let score=

      winScore+

      localScore+

      motorScore+

      stScore+

      exhibitScore+

      classPoint+

      courseScore+

      waterScore;

    data.push({

      boat:i,

      name:name,

      score:score

    });

  }

  /*

    スコア順

  */

  data.sort((a,b)=>b.score-a.score);

  /*

    結果画面

  */

  document.getElementById("inputPage").classList.add("hidden");

  document.getElementById("resultPage").classList.remove("hidden");

  /*

    ランキング

  */

  let ranking="";

  data.forEach((x,index)=>{

    ranking+=`

    <div class="result">

      <span>

      ${index+1}位　

      ${x.boat}号艇　

      ${x.name}

      </span>

      <strong>

      ${x.score.toFixed(1)}点

      </strong>

    </div>

    `;

  });

  document.getElementById("ranking").innerHTML=ranking;

  /*

    本命・対抗・穴

  */

  document.getElementById("judgement").innerHTML=`

<p>

◎ 本命：<strong>${a}号艇</strong>

<br>

推定確率：${(probFavorite*100).toFixed(1)}%

<br>

想定オッズ：${oddsFavorite || "-"}倍

<br>

期待値：<strong>${evFavorite.toFixed(2)}</strong>

</p>

<p>

○ 対抗：<strong>${b}号艇</strong>

<br>

推定確率：${(probCounter*100).toFixed(1)}%

<br>

想定オッズ：${oddsCounter || "-"}倍

<br>

期待値：<strong>${evCounter.toFixed(2)}</strong>

</p>

<p>

▲ 穴：<strong>${c}号艇</strong>

<br>

推定確率：${(probDark*100).toFixed(1)}%

<br>

想定オッズ：${oddsDark || "-"}倍

<br>

期待値：<strong>${evDark.toFixed(2)}</strong>

</p>

`;

    <p>

    ◎ 本命：

    <strong>${data[0].boat}号艇</strong>

    </p>

    <p>

    ○ 対抗：

    <strong>${data[1].boat}号艇</strong>

    </p>

    <p>

    ▲ 穴：

    <strong>${data[2].boat}号艇</strong>

    </p>

  `;

  /*

    展開予想

  */

  let entry=document.getElementById("entry").value;

  let wind=parseFloat(document.getElementById("wind").value)||0;

  let wave=parseFloat(document.getElementById("wave").value)||0;

  document.getElementById("development").innerHTML=`

    進入予想：${entry || "未入力"}<br>

    風速：${wind}m<br>

    波高：${wave}cm<br><br>

    ${data[0].boat}号艇を中心に評価。<br>

    上位艇の選手力・モーター・ST・展示タイムを

    総合して判定しています。

  `;

  /*

    買い目

  */

  let a=data[0].boat;

  let b=data[1].boat;

  let c=data[2].boat;let oddsFavorite =

  parseFloat(document.getElementById("odds1").value) || 0;

let oddsCounter =

  parseFloat(document.getElementById("odds2").value) || 0;

let oddsDark =

  parseFloat(document.getElementById("odds3").value) || 0;

/*

  スコアから簡易推定確率を作る

*/

let totalScore =

  data[0].score +

  data[1].score +

  data[2].score;

let probFavorite =

  data[0].score / totalScore;

let probCounter =

  data[1].score / totalScore;

let probDark =

  data[2].score / totalScore;

/*

  期待値

*/

let evFavorite =

  probFavorite * oddsFavorite;

let evCounter =

  probCounter * oddsCounter;

let evDark =

  probDark * oddsDark;

  document.getElementById("safe").innerHTML=`

    ${a}-${b}-${c}<br>

    ${a}-${c}-${b}<br>

    ${b}-${a}-${c}

  `;

  document.getElementById("value").innerHTML=`

    ${c}-${a}-${b}<br>

    ${c}-${b}-${a}<br>

    ${b}-${c}-${a}

  `;

</script>

</body>

</html>
