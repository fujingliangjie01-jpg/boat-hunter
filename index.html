<script>

"use strict";

/* =========================================

   API

========================================= */

const API_URL=

"https://boatraceopenapi.github.io/api/v1/today.json";

let raceData=null;

let selectedEntry=[];

/* =========================================

   基本関数

========================================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)

  ?n

  :0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)

  ?n.toFixed(d)

  :"-";

}

function esc(v){

 return String(v??"")

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)

  return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

function getRank(v){

 return{

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

/* =========================================

   データ取得

========================================= */

async function fetchJson(url){

 const response=

  await fetch(

   url+"?t="+Date.now(),

   {

    method:"GET",

    cache:"no-store",

    headers:{

     "Accept":"application/json"

    }

   }

  );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

function findRace(data,stadium,race){

 if(!data)

  return null;

 try{

  const direct=

   data?.programs

    ?.stadiums

    ?.[String(stadium)]

    ?.races

    ?.[String(race)];

  if(direct)

   return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)

   return;

  if(typeof o!=="object")

   return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)

    return;

  }

 }

 walk(data);

 return found;

}

/* =========================================

   レーサー

========================================= */

function getRacers(race){

 if(!race)

  return[];

 const racers=race.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)

  return[];

 const racers=preview.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function boatNo(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number

 );

}

function racerName(r){

 return(

  r?.name ||

  r?.racer_name ||

  "選手名不明"

 );

}

function previewFor(r){

 return getPreviewRacers(raceData)

  .find(

   x=>boatNo(x)===boatNo(r)

  )||{};

}

function getST(r){

 return num(

  firstValue(

   r,

   [

    "start_timing",

    "st"

   ]

  )

 );

}

function getExhibition(r){

 return num(

  firstValue(

   r,

   [

    "exhibition_time",

    "display_time"

   ]

  )

 );

}

function getCourse(r){

 return num(

  firstValue(

   r,

   [

    "course_number",

    "course"

   ]

  )

 );

}

/* =========================================

   出走表

========================================= */

function displayRace(){

 const box=

  document.getElementById("boats");

 box.innerHTML="";

 let racers=

  getRacers(raceData)

   .sort(

    (a,b)=>boatNo(a)-boatNo(b)

   );

 if(racers.length<6){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 6艇の出走表を取得できませんでした。

   </div>

  `;

  return false;

 }

 const preview=

  getPreviewRacers(raceData);

 racers.forEach(r=>{

  const p=

   preview.find(

    x=>boatNo(x)===boatNo(r)

   )||{};

  const st=getST(p);

  const ex=getExhibition(p);

  const div=

   document.createElement("div");

  div.className="boat";

  div.innerHTML=`

   <div class="boat-number">

    ${boatNo(r)}

   </div>

   <div class="boat-name">

    ${esc(racerName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${fmt(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${fmt(r.local_win_rate)}

   </div>

   <div class="metric">

    M${r.motor_number||"-"}

   </div>

   <div class="metric">

    M2連 ${fmt(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${fmt(r.motor_top_3_percent)}%

   </div>

   <div class="metric st">

    ST ${st>0?fmt(st):"-"}

   </div>

   <div class="metric exhibition">

    展示 ${ex>0?fmt(ex):"-"}

   </div>

  `;

  box.appendChild(div);

 });

 return true;

}

/* =========================================

   直前情報

========================================= */

function displayPreview(){

 const box=

  document.getElementById("previewInfo");

 const p=raceData?.preview;

 if(!p){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 直前情報なし

   </div>

  `;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">

    風速

   </div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">

    風向番号

   </div>

   <div class="info-value">

    ${p.wind_direction_number??"-"}

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">

    波高

   </div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">

    気温

   </div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">

    水温

   </div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* =========================================

   展示情報

========================================= */

function displayPreviewRacers(){

 const box=

  document.getElementById(

   "previewRacers"

  );

 const racers=

  getPreviewRacers(raceData)

   .sort(

    (a,b)=>boatNo(a)-boatNo(b)

   );

 if(!racers.length){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 展示・ST・直前進入データなし

   </div>

  `;

  return;

 }

 let html=`

 <table class="table">

 <thead>

 <tr>

  <th>艇</th>

  <th>進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  html+=`

  <tr>

   <td>

    ${boatNo(r)}号艇

   </td>

   <td class="gold">

    ${

     getCourse(r)>0

      ?getCourse(r)+"コース"

      :"－"

    }

   </td>

   <td class="orange">

    ${

     getST(r)>0

      ?fmt(getST(r))

      :"－"

    }

   </td>

   <td class="yellow">

    ${

     getExhibition(r)>0

      ?fmt(getExhibition(r))

      :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 `;

 box.innerHTML=html;

}

/* =========================================

   進入

========================================= */

function createEntryButtons(){

 const box=

  document.getElementById(

   "entryButtons"

  );

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=

   document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.onclick=()=>{

   selectEntry(i);

  };

  box.appendChild(b);

 }

}

function selectEntry(n){

 if(selectedEntry.includes(n))

  return;

 if(selectedEntry.length>=6)

  return;

 selectedEntry.push(n);

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  selectedEntry.join("-");

}

function updateEntryButtons(){

 document.querySelectorAll(

  ".entry-btn"

 ).forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  "進入を入力してください";

}

function getEntry(){

 if(selectedEntry.length===6)

  return[...selectedEntry];

 return[1,2,3,4,5,6];

}

/* =========================================

   基本能力

========================================= */

function baseScore(r,course){

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const n2=

  num(r.national_top_2_percent);

 const n3=

  num(r.national_top_3_percent);

 const l2=

  num(r.local_top_2_percent);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 let s=0;

 s+=national*6;

 s+=local*3;

 s+=n2*.08;

 s+=n3*.04;

 s+=l2*.04;

 s+=m2*.18;

 s+=m3*.07;

 if(st>0){

  s+=Math.max(

   0,

   .25-st

  )*25;

 }

 if(ex>0){

  s+=Math.max(

   0,

   6.90-ex

  )*8;

 }

 s+=({

  1:10,

  2:6,

  3:5,

  4:4,

  5:2,

  6:0

 }[course]||0);

 const rank=num(r.rank_number);

 if(rank===1)

  s+=5;

 if(rank===2)

  s+=3;

 if(rank===4)

  s-=2;

 return s;

}

/* =========================================

   攻め手

========================================= */

function attackScore(r,course){

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 let s=0;

 if(st>0){

  if(st<=.12)

 if(m3>=65)

 if(st>0){

  else if(st<=.15)

  else if(st<=.18)

 }

 if(ex>0){

  else if(ex<=6.80)

   s+=5;

/* =========================================

function validCombo(a,b,c){

 return(

  [a,b,c].every(

   x=>

    Number.isInteger(x)&&

    x>=1&&

    x<=6

  )&&

  a!==b&&

  a!==c&&

  b!==c

 );

}

 )

 arr.push({

function buildROI(rank,dev){

 const arr=[];

 const entry=getEntry();

 const list=

  getRacers(raceData)

   .map(r=>{

    const boat=boatNo(r);

    const course=

     entry.indexOf(boat)+1;

    return{

     boat,

     course,

     score:

      roiScore(

       r,

       course,

       dev

      )

    };

   })

   .sort(

    (a,b)=>b.score-a.score

   );

 const candidates=[];

 for(const a of list){

  for(const b of list){

   for(const c of list){

    if(

     !validCombo(

      a.boat,

      b.boat,

      c.boat

     )

    )

     continue;

    let score=

     a.score+

     b.score+

     c.score;

    if(

     dev.type!=="イン逃げ" &&

     a.boat===dev.attacker

    ){

     score+=30;

    }

    if(

     dev.type!=="イン逃げ" &&

     b.course>=4

    ){

     score+=12;

    }

    if(

     dev.type!=="イン逃げ" &&

     c.course>=4

    ){

     score+=8;

    }

    candidates.push({

     combo:

      `${a.boat}-${b.boat}-${c.boat}`,

     score

    });

   }

  }

 }

 candidates.sort(

  (a,b)=>b.score-a.score

 );

 for(const c of candidates){

  if(arr.length>=7)

   break;

  pushPick(

   arr,

   c.combo,

   "機力・ST・展示・展開から回収期待値を評価"

  );

 }

 return arr.slice(0,7);

}

/* =========================================

   大穴3点

   ★ 的中・回収との重複完全禁止

========================================= */

function buildHole(rank,dev,excludedCombos){

 const entry=getEntry();

 const excluded=

  new Set(

   excludedCombos||[]

  );

 const racers=

  getRacers(raceData);

 /* 穴候補 */

 const list=

  racers

   .map(r=>{

    const boat=boatNo(r);

    const course=

     entry.indexOf(boat)+1;

    return{

     boat,

     course,

     score:

      holeScore(

       r,

       course,

       dev

      ),

     racer:r

    };

   })

   .filter(

    x=>x.course>=4

   )

   .sort(

    (a,b)=>b.score-a.score

   );

 const arr=[];

 /* 穴候補を優先 */

 for(const hole of list){

  if(arr.length>=3)

   break;

  const others=

   rank.filter(

    r=>r.boat!==hole.boat

   );

  for(const main of others){

   if(arr.length>=3)

    break;

   for(const second of others){

    if(arr.length>=3)

     break;

    if(

     second.boat===main.boat ||

     second.boat===hole.boat

    )

     continue;

    const patterns=[

     `${hole.boat}-${main.boat}-${second.boat}`,

     `${main.boat}-${hole.boat}-${second.boat}`,

     `${main.boat}-${second.boat}-${hole.boat}`

    ];

    for(const combo of patterns){

     if(arr.length>=3)

      break;

     /* ★ 既存買い目なら絶対に除外 */

     if(excluded.has(combo))

      continue;

     if(

      arr.some(

       x=>x.combo===combo

      )

     )

      continue;

     const parts=

      combo

       .split("-")

       .map(Number);

     if(

      !validCombo(

       parts[0],

       parts[1],

       parts[2]

      )

     )

      continue;

     const holeCount=

      parts.filter(

       n=>{

        const course=

         entry.indexOf(n)+1;

        return course>=4;

       }

      ).length;

     if(holeCount<1)

      continue;

     arr.push({

      combo,

      reason:

       `${hole.boat}号艇を穴軸にした外枠一撃・機力・ST・展開狙い`

     });

    }

   }

  }

 }

 /* -----------------------------------------

    3点に足りない場合

    既存買い目を除外して別候補を探す

 ----------------------------------------- */

 if(arr.length<3){

  for(let a=1;a<=6;a++){

   for(let b=1;b<=6;b++){

    for(let c=1;c<=6;c++){

     if(arr.length>=3)

      break;

     if(

      !validCombo(a,b,c)

     )

      continue;

     const combo=

      `${a}-${b}-${c}`;

     if(excluded.has(combo))

      continue;

     if(

      arr.some(

       x=>x.combo===combo

      )

     )

      continue;

     const holeCount=

      [a,b,c]

       .filter(n=>{

        const course=

         entry.indexOf(n)+1;

        return course>=4;

       }).length;

     if(holeCount<1)

      continue;

     arr.push({

      combo,

      reason:

       "既存買い目と重複しない外枠絡みの大穴"

     });

    }

   }

  }

 }

 return arr.slice(0,3);

}

    "指定レースがデータ内にありません"

   );

  }

  const racers=

   getRacers(raceObject);

  if(racers.length<6){

   throw new Error(

    "6艇データを取得できませんでした"

   );

  }

  raceData=raceObject;

  const venueName=

   document

    .getElementById("venue")

    .selectedOptions[0]

    .textContent;

  document.getElementById(

   "apiInfo"

  ).innerHTML=`

   API：v1<br>

   競艇場：${venueName}<br>

   レース：${race}R<br>

   日付：${raceObject.date||"-"}<br>

   出走艇：${racers.length}艇

  `;

  displayRace();

  displayPreview();

  displayPreviewRacers();

  createEntryButtons();

  clearEntry();

  result.classList.remove(

   "hidden"

  );

  status.innerHTML=

   "✅ 出走表を取得しました";

 }catch(error){

  console.error(error);

  status.innerHTML=`

   ❌ 出走表取得失敗

   <br>

   ${esc(error.message)}

   <br><br>

   APIのデータ更新待ち、または

   指定レースのデータ未掲載の可能性があります。

  `;

 }finally{

  button.disabled=false;

 }

}

========================================= */

document.getElementById(

 "loadButton"

).addEventListener(

 "click",

 loadRace

);

document.getElementById(

 "clearButton"

).addEventListener(

 "click",

 clearEntry

);

document.getElementById(

 "analyzeButton"

).addEventListener(

 "click",

 showAnalysis

);
