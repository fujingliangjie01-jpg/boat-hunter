<script>

/* =====================================================

   BOAT HUNTER

   API v1対応版

===================================================== */

const API="https://boatraceopenapi.github.io/api/v1";

let raceData=null;

let racers=[];

let previewRacers={};

let manualCourses={};

let currentBets=null;

/* =====================================================

   基本

===================================================== */

function n(v){

 if(v===null||v===undefined||v==="") return 0;

 const x=parseFloat(

  String(v)

   .replace("%","")

   .replace("秒","")

   .replace(",","")

 );

 return Number.isFinite(x)?x:0;

}

function esc(v){

 return String(v??"")

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}

function getBudget(){

 let v=Number(

  document.getElementById("budget").value

 );

 if(!Number.isFinite(v)||v<100)v=100;

 v=Math.floor(v/100)*100;

 document.getElementById("budget").value=v;

 return v;

}

function formatYen(v){

 return Number(v||0)

  .toLocaleString("ja-JP")+"円";

}

/* =====================================================

   今日 JST

===================================================== */

function todayParts(){

 const parts=

  new Intl.DateTimeFormat(

   "ja-JP",

   {

    timeZone:"Asia/Tokyo",

    year:"numeric",

    month:"2-digit",

    day:"2-digit"

   }

  ).formatToParts(new Date());

 const year=

  parts.find(x=>x.type==="year").value;

 const month=

  parts.find(x=>x.type==="month").value;

 const day=

  parts.find(x=>x.type==="day").value;

 return{

  year,

  yyyymmdd:year+month+day

 };

}

/* =====================================================

   API

===================================================== */

async function getJSON(url){

 const response=

  await fetch(

   url+"?t="+Date.now(),

   {

    cache:"no-store"

   }

  );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

/* =====================================================

   新APIからレース取得

===================================================== */

function findRaceV1(data,venue,race){

 const v=String(venue);

 const r=String(race);

 const root=

  data?.programs?.stadiums;

 if(root){

  const stadium=

   root[v];

  if(stadium){

   const races=

    stadium.races;

   if(races){

    if(races[r]){

     return races[r];

    }

    if(races[String(Number(r))]){

     return races[String(Number(r))];

    }

   }

  }

 }

 return null;

}

/* =====================================================

   旧API fallback

===================================================== */

function findRaceDeep(data,venue,race){

 const targetVenue=String(venue);

 const targetRace=String(race);

 let found=null;

 function walk(obj){

  if(found||!obj||typeof obj!=="object")

   return;

  if(

   obj.race_number!==undefined &&

   String(obj.race_number)===targetRace

  ){

   if(

    obj.stadium_number!==undefined &&

    String(obj.stadium_number)===targetVenue

   ){

    found=obj;

    return;

   }

   if(

    obj.venue_number!==undefined &&

    String(obj.venue_number)===targetVenue

   ){

    found=obj;

    return;

   }

  }

  if(Array.isArray(obj)){

   obj.forEach(walk);

  }else{

   Object.values(obj).forEach(walk);

  }

 }

 walk(data);

 return found;

}

/* =====================================================

   本日のデータ

===================================================== */

async function loadDailyData(){

 const parts=todayParts();

 const url=

  `${API}/${parts.year}/${parts.yyyymmdd}.json`;

 return{

  data:await getJSON(url),

  url,

  version:"api/v1"

 };

}

/* =====================================================

   選手抽出

===================================================== */

function extractRacers(race){

 const source=

  race?.racers||

  race?.entries||

  race?.participants;

 if(!source)return[];

 let arr=[];

 if(Array.isArray(source)){

  arr=source;

 }else{

  arr=Object.entries(source)

   .map(([key,value])=>({

    ...value,

    entry_number:

     n(

      value.entry_number||

      key

     )

   }));

 }

 return arr

  .map((r,index)=>({

   ...r,

   entry_number:

    n(

     r.entry_number||

     r.boat_number||

     index+1

    )

  }))

  .filter(r=>

   r.entry_number>=1&&

   r.entry_number<=6

  )

  .sort(

   (a,b)=>

    a.entry_number-b.entry_number

  )

  .slice(0,6);

}

/* =====================================================

   直前

===================================================== */

function getPreviewData(race){

 return race?.preview?.racers||{};

}

function getPreview(boat){

 return(

  previewRacers[String(boat)]||

  previewRacers[boat]||

  {}

 );

}

/* =====================================================

   進入

===================================================== */

function initCourses(){

 for(let boat=1;boat<=6;boat++){

  const el=

   document.getElementById(

    "course"+boat

   );

  el.innerHTML="";

  for(let course=1;course<=6;course++){

   const option=

    document.createElement("option");

   option.value=course;

   option.textContent=

    course+"コース";

   el.appendChild(option);

  }

  el.value=boat;

  manualCourses[boat]=boat;

  el.addEventListener(

   "change",

   ()=>{

    manualCourses[boat]=

     Number(el.value);

   }

  );

 }

}

function resetCourses(){

 for(let boat=1;boat<=6;boat++){

  const el=

   document.getElementById(

    "course"+boat

   );

  el.value=boat;

  manualCourses[boat]=boat;

 }

 document.getElementById(

  "message"

 ).innerHTML=

 `

 <span class="success">

 🔄 進入入力をリセットしました

 </span>

 `;

}

function getCourse(boat){

 return Number(

  manualCourses[boat]||boat

 );

}

/* =====================================================

   出走表取得

===================================================== */

async function loadRaceData(){

 const venue=

  Number(

   document.getElementById("venue").value

  );

 const race=

  Number(

   document.getElementById("race").value

  );

 const message=

  document.getElementById("message");

 message.innerHTML=

 `

 <span class="loading">

 ⏳ ${race}R の出走表を取得中...

 </span>

 `;

 document.getElementById(

  "raceCard"

 ).style.display="none";

 document.getElementById(

  "analysisCard"

 ).style.display="none";

 document.getElementById(

  "predictionCard"

 ).style.display="none";

 try{

  const result=

   await loadDailyData();

  const selected=

   findRaceV1(

    result.data,

    venue,

    race

   );

  if(!selected){

   throw new Error(

    "指定した場・レースがAPIにありません"

   );

  }

  const list=

   extractRacers(selected);

  if(list.length!==6){

   throw new Error(

    "出走表は取得できましたが、6艇を確認できませんでした"

   );

  }

  raceData=selected;

  racers=list;

  previewRacers=

   getPreviewData(selected);

  /* 実進入を自動反映 */

  for(let boat=1;boat<=6;boat++){

   const p=

    getPreview(boat);

   const course=

    n(

     p.course_number||

     p.course

    );

   if(course>=1&&course<=6){

    document.getElementById(

     "course"+boat

    ).value=course;

    manualCourses[boat]=course;

   }

  }

  renderRace();

  document.getElementById(

   "raceCard"

  ).style.display="block";

  message.innerHTML=

  `

  <span class="success">

  ✅ 出走表取得成功

  <br>

  API：${result.version}

  <br>

  ${racers.length}艇取得

  </span>

  `;

 }catch(error){

  console.error(error);

  message.innerHTML=

  `

  <span class="error">

  ❌ 出走表取得失敗

  <br><br>

  ${esc(error.message)}

  <br><br>

  API：

  ${API}

  </span>

  `;

 }

}

/* =====================================================

   級別

===================================================== */

function rankName(r){

 return(

  r.rank||

  r.class||

  r.rank_name||

  "-"

 );

}

/* =====================================================

   出走表表示

===================================================== */

function renderRace(){

 const box=

  document.getElementById("racers");

 const info=

  document.getElementById("raceInfo");

 box.innerHTML="";

 info.innerHTML=

 `

 <div class="info">

 <strong>

 ${esc(

  raceData.race_name||

  raceData.title||

  "BOAT RACE"

 )}

 </strong>

 <br>

 開催日：

 ${esc(

  raceData.date||

  "-"

 )}

 <br>

 ${n(raceData.distance)||1800}m

 <br>

 締切：

 ${esc(

  raceData.closed_at||

  "-"

 )}

 <br>

 API：

 boatraceopenapi / api v1

 </div>

 `;

 racers.forEach(r=>{

  const b=

   n(r.entry_number);

  const p=

   getPreview(b);

  const course=

   getCourse(b);

  box.innerHTML+=

  `

  <div class="racer">

   <div class="racerTop">

    <div class="number n${b}">

     ${b}

    </div>

    <div class="racerName">

     ${esc(r.name||"-")}

    </div>

   </div>

   <div class="small">

    級別：

    <span class="rank">

    ${esc(rankName(r))}

    </span>

    <br>

    登録番号：

/* =====================================================

   スコア

===================================================== */

function scoreBoat(boat){

 const r=

  racers.find(

   x=>n(x.entry_number)===boat

  );

 if(!r)return 0;

 const p=

  getPreview(boat);

 const course=

  getCourse(boat);

 let score=0;

 score+=

  n(r.national_win_rate)*8;

 score+=

  n(r.local_win_rate)*4;

 score+=

  n(

   r.national_2ren_rate||

   r.national_top_2_percent

  )*0.12;

 score+=

  n(

   r.motor_2ren_rate||

   r.motor_top_2_percent

  )*0.18;

 const avgST=

  n(r.average_start_timing);

 if(avgST>0){

  score+=

   Math.max(

    0,

    0.30-avgST

   )*20;

 }

 const st=

  n(p.start_timing);

 if(st>0){

  score+=

   Math.max(

    0,

    0.25-st

   )*20;

 }

 const exhibition=

  n(p.exhibition_time);

 if(exhibition>0){

  score+=

   Math.max(

    0,

    6.80-exhibition

   )*8;

 }

 const courseBonus={

  1:12,

  2:7,

  3:5,

  4:4,

  5:2,

  6:0

 };

 score+=

  courseBonus[course]||0;

 const rank=

  rankName(r);

 if(

  String(rank).includes("A1")

 ){

  score+=5;

 }

 if(

  String(rank).includes("A2")

 ){

  score+=2;

 }

 if(

  String(rank).includes("B2")

 ){

  score-=2;

 }

 return Math.max(

  0,

  score

 );

}

function calculateOverview(){

 let escape=0;

 let sashi=0;

 let maki=0;

 let makiSashi=0;

 const c1=

  getCourse(1);

 if(c1===1){

  escape+=

   50+

   n(

    racers[0]?.national_win_rate

   )*2;

 }

 for(let boat=2;boat<=6;boat++){

  const course=

   getCourse(boat);

  if(course===2)

   sashi+=18;

  if(course===3)

   maki+=18;

  if(course===4)

   maki+=20;

  if(course===3)

   makiSashi+=16;

  if(course===4)

   makiSashi+=18;

 }

 escape+=20;

 const total=

  escape+

  sashi+

  maki+

  makiSashi||1;

 return{

  escape:

   escape/total*100,

  sashi:

   sashi/total*100,

  maki:

   maki/total*100,

  makiSashi:

   makiSashi/total*100

 };

}

function dominantType(o){

 return Object.entries(o)

  .sort(

   (a,b)=>b[1]-a[1]

  )[0][0];

}

function typeName(t){

 return{

  escape:"逃げ",

  sashi:"差し",

  maki:"まくり",

  makiSashi:"まくり差し"

 }[t]||t;

}

/* =====================================================

   買い目生成

===================================================== */

function buildBets(rankings){

 const top=

  rankings.slice(0,4);

 const result={

  hit:[],

  escape:[],

  sashi:[],

  maki:[],

  makiSashi:[],

  under:[]

 };

 function add(group,a,b,bonus){

  if(a===b)return;

  const A=

   rankings.find(x=>x.boat===a);

  const B=

   rankings.find(x=>x.boat===b);

  if(!A||!B)return;

  let raw=

   A.score*1.5+

   B.score+

   bonus;

  if(getCourse(a)===1)

   raw+=10;

  if(getCourse(a)===2)

   raw+=5;

  result[group].push({

   key:`${a}-${b}`,

   a,

   b,

   raw

  });

 }

 /* 的中率 */

 top.forEach(a=>{

  top.forEach(b=>{

   if(a.boat!==b.boat)

    add(

     "hit",

     a.boat,

     b.boat,

     10

    );

  });

 });

 /* 逃げ */

 rankings.forEach(x=>{

  if(getCourse(x.boat)===1){

   rankings.forEach(y=>{

    if(x.boat!==y.boat){

     add(

      "escape",

      x.boat,

      y.boat,

      25

     );

    }

   });

  }

 });

 /* 差し */

 rankings.forEach(x=>{

  if(getCourse(x.boat)===2){

   rankings.forEach(y=>{

    if(x.boat!==y.boat){

     add(

      "sashi",

      x.boat,

      y.boat,

      20

     );

    }

   });

  }

 });

 /* まくり */

 rankings.forEach(x=>{

  if(

   getCourse(x.boat)===3||

   getCourse(x.boat)===4

  ){

   rankings.forEach(y=>{

    if(x.boat!==y.boat){

     add(

      "maki",

      x.boat,

      y.boat,

      18

     );

    }

   });

  }

 });

 /* まくり差し */

 rankings.forEach(x=>{

  if(

   getCourse(x.boat)===3||

   getCourse(x.boat)===4

  ){

   rankings.forEach(y=>{

    if(x.boat!==y.boat){

     add(

      "makiSashi",

      x.boat,

      y.boat,

      16

     );

    }

   });

  }

 });

 /* 穴 */

 if(rankings[4]){

  const a=

   rankings[4].boat;

  const b=

   rankings[0].boat;

  add(

   "under",

   a,

   b,

   25

  );

 }

 Object.keys(result)

  .forEach(key=>{

   result[key]=

    result[key]

     .sort(

      (a,b)=>b.raw-a.raw

     )

     .slice(0,5);

  });

 const all=[];

 Object.values(result)

  .forEach(list=>

   list.forEach(x=>

    all.push(x)

   )

  );

 const total=

  all.reduce(

   (s,x)=>s+x.raw,

   0

  )||1;

 all.forEach(x=>{

  x.probability=

   x.raw/total*100;

 });

 result.total=

  all.reduce(

   (s,x)=>

    s+(x.probability||0),

   0

  );

 return result;

}

function getStarCount(){

 const b=getBudget();

 if(b<=500)return 1;

 if(b<=1000)return 2;

 if(b<=2000)return 3;

 if(b<=3000)return 4;

 if(b<=5000)return 6;

 if(b<=10000)return 8;

 return 10;

}

function getStarKeys(bets){

 const all=[];

 Object.entries(bets)

  .forEach(([group,list])=>{

   if(!Array.isArray(list))return;

   list.forEach(x=>{

    all.push({

     ...x,

     group

    });

   });

  });

 all.sort(

  (a,b)=>

   (b.probability||0)-

   (a.probability||0)

 );

 return new Set(

  all

   .slice(0,getStarCount())

   .map(x=>x.key)

 );

}
