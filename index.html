<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#050505;

  color:#fff;

  font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;

}

header{

  background:#000;

  color:#d4af37;

  text-align:center;

  padding:22px 10px;

  font-size:30px;

  font-weight:bold;

  border-bottom:2px solid #d4af37;

}

.subtitle{

  text-align:center;

  color:#aaa;

  padding:9px;

  font-size:13px;

}

.container{

  max-width:720px;

  margin:auto;

  padding:15px;

}

.card{

  background:#151515;

  border:1px solid #d4af37;

  border-radius:14px;

  padding:16px;

  margin-bottom:16px;

}

.title{

  color:#d4af37;

  font-size:19px;

  font-weight:bold;

  margin-bottom:14px;

}

label{

  display:block;

  color:#aaa;

  font-size:13px;

  margin-top:9px;

}

input,select{

  width:100%;

  padding:12px;

  margin-top:5px;

  border-radius:7px;

  border:1px solid #555;

  background:#fff;

  color:#000;

  font-size:16px;

}

button{

  width:100%;

  padding:15px;

  margin-top:10px;

  background:#d4af37;

  color:#000;

  border:0;

  border-radius:10px;

  font-size:17px;

  font-weight:bold;

}

button:active{

  transform:scale(.98);

}

.boat{

  background:#101010;

  border:1px solid #333;

  border-radius:10px;

  padding:13px;

  margin-bottom:12px;

}

.boat h3{

  color:#d4af37;

  margin:0 0 10px;

}

.result{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:13px;

  margin:7px 0;

  background:#222;

  border-radius:8px;

}

.score{

  color:#d4af37;

  font-weight:bold;

}

.badge{

  display:inline-block;

  padding:5px 9px;

  border-radius:6px;

  background:#d4af37;

  color:#000;

  font-weight:bold;

  margin-right:5px;

}

.big{

  font-size:22px;

  color:#d4af37;

  font-weight:bold;

}

.bet{

  padding:13px;

  margin:7px 0;

  background:#222;

  border-radius:8px;

  font-size:18px;

}

.small{

  color:#999;

  font-size:12px;

  line-height:1.6;

}

.hidden{

  display:none;

}

.warning{

  color:#ffcc66;

  font-size:12px;

  line-height:1.6;

}

</style>

</head>

<body>

<header>🚤 BOAT HUNTER</header>

<div class="subtitle">

人気ではなく期待値で勝つ

</div>

<div class="container">

<!-- =========================

     HOME

========================= -->

<div id="home">

<div class="card">

<div class="title">🏟 レース情報</div>

<label>競艇場</label>

<select id="venue">

<option>桐生</option>

<option>戸田</option>

<option>江戸川</option>

<option>平和島</option>

<option>多摩川</option>

<option>浜名湖</option>

<option>蒲郡</option>

<option>常滑</option>

<option>津</option>

<option>三国</option>

<option>びわこ</option>

<option>住之江</option>

<option>尼崎</option>

<option>鳴門</option>

<option>丸亀</option>

<option>児島</option>

<option>宮島</option>

<option>徳山</option>

<option>下関</option>

<option>若松</option>

<option>芦屋</option>

<option>福岡</option>

<option>唐津</option>

<option>大村</option>

</select>

<label>レース番号</label>

<select id="race">

<option>1R</option>

<option>2R</option>

<option>3R</option>

<option>4R</option>

<option>5R</option>

<option>6R</option>

<option>7R</option>

<option>8R</option>

<option>9R</option>

<option>10R</option>

<option>11R</option>

<option>12R</option>

</select>

<label>予算（円）</label>

<input id="budget"

       type="number"

       min="0"

       placeholder="例：5000">

<button type="button" onclick="showInput()">

🔥 AI解析開始

</button>

</div>

</div>

<!-- =========================

     INPUT

========================= -->

<div id="inputPage" class="hidden">

<div class="card">

<div class="title">📊 6艇データ入力</div>

<p class="small">

分かるデータだけ入力してください。<br>

空欄の場合は中立値として評価します。

</p>

</div>

<div id="boats"></div>

<!-- 水面 -->

<div class="card">

<div class="title">🌊 水面・進入情報</div>

<label>風速（m）</label>

<input id="wind"

       type="number"

       step="0.1"

       placeholder="例：3.0">

<label>風向</label>

<select id="windDir">

<option>追い風</option>

<option>向かい風</option>

<option>左横風</option>

<option>右横風</option>

<option>無風</option>

</select>

<label>波高（cm）</label>

<input id="wave"

       type="number"

       placeholder="例：3">

<label>進入予想</label>

<input id="entry"

       placeholder="例：123456">

</div>

<!-- オッズ -->

<div class="card">

<div class="title">💰 想定オッズ</div>

<p class="small">

本命・対抗・穴に対応する想定オッズを入力してください。

</p>

<label>本命想定オッズ</label>

<input id="odds1"

       type="number"

       step="0.1"

       placeholder="例：2.5">

<label>対抗想定オッズ</label>

<input id="odds2"

       type="number"

       step="0.1"

       placeholder="例：4.5">

<label>穴想定オッズ</label>

<input id="odds3"

       type="number"

       step="0.1"

       placeholder="例：10.0">

</div>

<button type="button" onclick="analyze()">

🔥 BOAT HUNTER解析

</button>

</div>

<!-- =========================

     RESULT

========================= -->

<div id="resultPage" class="hidden">

<div class="card">

<div class="title">🏟 レース情報</div>

<div id="raceInfo"></div>

</div>

<div class="card">

<div class="title">🔥 AI期待値ランキング</div>

<div id="ranking"></div>

</div>

<div class="card">

<div class="title">🏆 BOAT HUNTER判定</div>

<div id="judgement"></div>

</div>

<div class="card">

<div class="title">🌊 展開予想</div>

<div id="development"></div>

</div>

<div class="card">

<div class="title">🎯 的中率重視</div>

<div id="safe"></div>

</div>

<div class="card">

<div class="title">💎 回収率重視</div>

<div id="value"></div>

</div>

<div class="card">

<div class="title">🔥 穴狙い</div>

<div id="dark"></div>

</div>

<div class="card">

<p class="warning">

※ 本システムは入力データを一定のルールで評価する簡易モデルです。

予想結果や利益を保証するものではありません。

</p>

</div>

<button type="button" onclick="location.reload()">

↩ 最初に戻る

</button>

</div>

</div>

<script>

/* ==========================================

   6艇入力画面

========================================== */

function showInput(){

  document.getElementById("home")

    .classList.add("hidden");

  document.getElementById("inputPage")

    .classList.remove("hidden");

  let html="";

  for(let i=1;i<=6;i++){

    html += `

    <div class="boat">

      <h3>🚤 ${i}号艇</h3>

      <label>選手名</label>

      <input id="name${i}"

             placeholder="選手名">

      <label>級別</label>

      <select id="class${i}">

        <option>A1</option>

        <option>A2</option>

        <option>B1</option>

        <option>B2</option>

      </select>

      <label>全国勝率</label>

      <input id="win${i}"

             type="number"

             step="0.01"

             placeholder="例：6.50">

      <label>当地勝率</label>

      <input id="local${i}"

             type="number"

             step="0.01"

             placeholder="例：6.80">

      <label>モーター2連率（%）</label>

      <input id="motor${i}"

             type="number"

             step="0.1"

             placeholder="例：40">

      <label>平均ST</label>

      <input id="st${i}"

             type="number"

             step="0.01"

             placeholder="例：0.15">

      <label>展示タイム</label>

      <input id="exhibit${i}"

             type="number"

             step="0.01"

             placeholder="例：6.80">

    </div>

    `;

  }

  document.getElementById("boats")

    .innerHTML=html;

}

/* ==========================================

   数値を安全に取得

========================================== */

function num(id,defaultValue){

  let el=document.getElementById(id);

  if(!el){

    return defaultValue;

  }

  let value=parseFloat(el.value);

  if(isNaN(value)){

    return defaultValue;

  }

  return value;

}

/* ==========================================

   解析

========================================== */

function analyze(){

  let data=[];

  /* ---------- 各艇評価 ---------- */

  for(let i=1;i<=6;i++){

    let name=

      document.getElementById("name"+i).value

      || i+"号艇";

    let cls=

      document.getElementById("class"+i).value;

    let win=num("win"+i,6.0);

    let local=num("local"+i,6.0);

    let motor=num("motor"+i,35);

    let st=num("st"+i,0.18);

    let exhibit=num("exhibit"+i,6.85);

    /* 級別 */

    let classScore=0;

    if(cls==="A1"){

      classScore=5;

    }

    else if(cls==="A2"){

      classScore=4;

    }

    else if(cls==="B1"){

      classScore=2;

    }

    else{

      classScore=1;

    }

    /* 全国勝率 15点 */

    let winScore=

      Math.max(

        0,

        Math.min(

          ((win-4.0)/4.0)*15,

          15

        )

      );

    /* 当地勝率 10点 */

    let localScore=

      Math.max(

        0,

        Math.min(

          ((local-4.0)/4.0)*10,

          10

        )

      );

    /* モーター 15点 */

    let motorScore=

      Math.max(

        0,

        Math.min(

          ((motor-20)/30)*15,

          15

        )

      );

    /* ST 10点 */

    let stScore=

      Math.max(

        0,

        Math.min(

          ((0.25-st)/0.15)*10,

          10

        )

      );

    /* 展示タイム 10点 */

    let exhibitScore=

      Math.max(

        0,

        Math.min(

          ((6.95-exhibit)/0.30)*10,

          10

        )

      );

    /* コース適性 20点 */

    let courseScore=0;

    if(i===1){

      courseScore=20;

    }

    else if(i===2){

      courseScore=15;

    }

    else if(i===3){

      courseScore=13;

    }

    else if(i===4){

      courseScore=10;

    }

    else if(i===5){

      courseScore=7;

    }

    else{

      courseScore=5;

    }

    /* 基本展開 10点 */

    let developmentScore=5;

    /* 水面 5点 */

    let waterScore=2.5;

    /* 合計 */

    let score=

      winScore+

      localScore+

      motorScore+

      stScore+

      exhibitScore+

      classScore+

      courseScore+

      developmentScore+

      waterScore;

    score=

      Math.max(

        0,

        Math.min(score,100)

      );

    data.push({

      boat:i,

      name:name,

      cls:cls,

      score:score

    });

  }

  /* ---------- 順位 ---------- */

  data.sort(

    (a,b)=>b.score-a.score

  );

  /* ---------- 推定確率 ---------- */

  let totalScore=0;

  data.forEach(x=>{

    totalScore+=x.score;

  });

  data.forEach(x=>{

    x.probability=

      x.score/totalScore;

  });

  /* ---------- 画面切替 ---------- */

  document.getElementById("inputPage")

    .classList.add("hidden");

  document.getElementById("resultPage")

    .classList.remove("hidden");

  /* ---------- レース情報 ---------- */

  let venue=

    document.getElementById("venue").value;

  let race=

    document.getElementById("race").value;

  let budget=

    num("budget",0);

  let wind=

    num("wind",0);

  let windDir=

    document.getElementById("windDir").value;

  let wave=

    num("wave",0);

  let entry=

    document.getElementById("entry").value

    ||"123456";

  document.getElementById("raceInfo")

    .innerHTML=`

    <p>

    <span class="badge">${venue}</span>

    <span class="badge">${race}</span>

    </p>

    <p>

    予算：${budget.toLocaleString()}円

    </p>

    <p>

    🌬 風速：${wind}m

    <br>

    🧭 風向：${windDir}

    <br>

    🌊 波高：${wave}cm

    <br>

    🚤 進入：${entry}

    </p>

    `;

  /* ---------- ランキング ---------- */

  let ranking="";

  data.forEach((x,index)=>{

    ranking += `

    <div class="result">

      <span>

      ${index+1}位　

      ${x.boat}号艇　

      ${x.name}

      </span>

      <span class="score">

      ${x.score.toFixed(1)}点

      </span>

    </div>

    `;

  });

  document.getElementById("ranking")

    .innerHTML=ranking;

  /* ---------- 本命・対抗・穴 ---------- */

  let favorite=data[0];

  let counter=data[1];

  let dark=data[2];

  /* オッズ */

  let oddsFavorite=num("odds1",0);

  let oddsCounter=num("odds2",0);

  let oddsDark=num("odds3",0);

  /* 期待値 */

  let evFavorite=

    favorite.probability*oddsFavorite;

  let evCounter=

    counter.probability*oddsCounter;

  let evDark=

    dark.probability*oddsDark;

  document.getElementById("judgement")

    .innerHTML=`

    <p>

    <span class="big">◎ 本命 ${favorite.boat}号艇</span>

    <br>

    ${favorite.name}

    </p>

    <p>

    <span class="big">○ 対抗 ${counter.boat}号艇</span>

    <br>

    ${counter.name}

    </p>

    <p>

    <span class="big">▲ 穴 ${dark.boat}号艇</span>

    <br>

    ${dark.name}

    </p>

    <hr>

    <p>

    本命 推定確率：

    ${(favorite.probability*100).toFixed(1)}%

    <br>

    想定オッズ：

    ${oddsFavorite>0 ? oddsFavorite+"倍" : "未入力"}

    <br>

    期待値：

    <strong>

    ${oddsFavorite>0 ? evFavorite.toFixed(2) : "-"}

    </strong>

    </p>

    <p>

    対抗 推定確率：

    ${(counter.probability*100).toFixed(1)}%

    <br>

    想定オッズ：

    ${oddsCounter>0 ? oddsCounter+"倍" : "未入力"}

    <br>

    期待値：

    <strong>

    ${oddsCounter>0 ? evCounter.toFixed(2) : "-"}

    </strong>

    </p>

    <p>

    穴 推定確率：

    ${(dark.probability*100).toFixed(1)}%

    <br>

    想定オッズ：

    ${oddsDark>0 ? oddsDark+"倍" : "未入力"}

    <br>

    期待値：

    <strong>

    ${oddsDark>0 ? evDark.toFixed(2) : "-"}

    </strong>

    </p>

    `;

  /* ---------- 展開 ---------- */

  let development="";

  if(entry.charAt(0)==="1"){

    development=

      "1号艇のイン逃げを中心に評価。";

  }

  else{

    development=

      "進入変化を考慮し、イン逃げ以外の展開も警戒。";

  }

  if(wind>=4){

    development+=

      "<br>風が強いため、水面による展開変化を警戒。";

  }

  if(wave>=5){

    development+=

      "<br>波高があるため、ターン力と機力を重視。";

  }

  development+=`

    <br><br>

    ${favorite.boat}号艇を中心に、

    ${counter.boat}号艇・${dark.boat}号艇の

    連動を警戒。

  `;

  document.getElementById("development")

    .innerHTML=development;

  /* ---------- 的中率重視 ---------- */

  let a=favorite.boat;

  let b=counter.boat;

  let c=dark.boat;

  document.getElementById("safe")

    .innerHTML=`

    <div class="bet">

    ① ${a}-${b}-${c}

    </div>

    <div class="bet">

    ② ${a}-${c}-${b}

    </div>

    <div class="bet">

    ③ ${b}-${a}-${c}

    </div>

    `;

  /* ---------- 回収率重視 ---------- */

  document.getElementById("value")

    .innerHTML=`

    <div class="bet">

    ① ${c}-${a}-${b}

    </div>

    <div class="bet">

    ② ${c}-${b}-${a}

    </div>

    <div class="bet">

    ③ ${b}-${c}-${a}

    </div>

    `;

  /* ---------- 穴狙い ---------- */

  let fourth=data[3];

  document.getElementById("dark")

    .innerHTML=`

    <div class="bet">

    🔥 ${fourth.boat}-${a}-${b}

    </div>

    <div class="bet">

    🔥 ${a}-${fourth.boat}-${c}

    </div>

    <div class="bet">

    🔥 ${fourth.boat}-${c}-${a}

    </div>

    <p class="small">

    ${fourth.boat}号艇は総合評価4位。

    人気が低い場合は期待値候補として

    オッズとの組み合わせを確認してください。

    </p>

    `;

}

</script>
<div id="apiStatus" style="

margin:15px 0;

padding:12px;

border:1px solid #d4af37;

border-radius:10px;

background:#111;

color:#aaa;

font-size:13px;

text-align:center;

">

無料データ取得：準備中

</div>

<script>

async function testBoatAPI(){

  const status=document.getElementById("apiStatus");

  status.innerHTML="⏳ 無料データを取得中...";

  try{

    const response=await fetch(

      "https://boatraceopenapi.github.io/programs/v3/today.json"

    );

    if(!response.ok){

      throw new Error("HTTP "+response.status);

    }

    const data=await response.json();

    console.log("BOATRACE DATA",data);

    status.innerHTML=

      "✅ 無料データ取得成功<br>" +

      "データ件数："+Object.keys(data).length;

  }catch(error){

    console.error(error);

    status.innerHTML=

      "⚠️ データ取得できませんでした<br>" +

      "現在は手入力モードで利用できます。";

  }

}

</script>

<button type="button" onclick="testBoatAPI()">

🌐 無料データ取得テスト

</button>
</body>

</html>
