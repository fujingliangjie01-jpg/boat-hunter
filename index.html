<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{

box-sizing:border-box

}

body{

margin:0;

background:#080808;

color:#fff;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

header{

background:linear-gradient(135deg,#111,#1c1605);

border-bottom:1px solid #9c7b24;

padding:18px 15px;

text-align:center

}

header h1{

margin:0;

color:#d4af37;

font-size:28px;

letter-spacing:3px

}

header p{

margin:5px 0 0;

color:#aaa;

font-size:12px

}

.container{

max-width:1000px;

margin:auto;

padding:15px

}

.card{

background:#111;

border:1px solid #292929;

border-radius:12px;

padding:15px;

margin-bottom:15px

}

h2{

font-size:17px;

margin:0 0 12px;

color:#d4af37

}

h3{

font-size:14px;

color:#d4af37;

margin:14px 0 8px

}

label{

display:block;

font-size:12px;

color:#aaa;

margin-bottom:5px

}

select,

input{

width:100%;

background:#181818;

color:#fff;

border:1px solid #444;

padding:12px;

}

.grid2{

grid-template-columns:1fr 1fr;

}

.racers{

display:grid;

grid-template-columns:repeat(2,1fr);

}

.racer{

border:1px solid #333;

border-radius:10px;

padding:10px

}

.racerTop{

display:flex;

align-items:center;

.n2{background:#222;color:#fff;border:1px solid #777}

.n4{background:#198cff;color:#fff}

.racerName{

font-weight:bold

}

.small{

font-size:11px;

color:#aaa;

margin-top:5px;

line-height:1.5

}

.rankTable{

width:100%;

border-collapse:collapse;

font-size:12px

}

.rankTable th,

.rankTable td{

border-bottom:1px solid #292929;

padding:8px 5px;

text-align:center

}

.rankTable th{

color:#d4af37

}

.badge{

display:inline-block;

padding:4px 7px;

border-radius:5px;

font-size:11px;

font-weight:bold

}

.good{

background:#194d2b;

color:#65e891

}

.ace{

background:#5b4010;

color:#ffd84d

}

.bad{

background:#4b1919;

color:#ff7373

}

.normal{

background:#333;

color:#ddd

}

.pickBox{

border:1px solid #333;

background:#151515;

border-radius:10px;

padding:12px;

margin-top:10px

}

.pickTitle{

font-size:15px;

color:#d4af37;

font-weight:bold;

margin-bottom:8px

}

.pick{

padding:8px 0;

border-bottom:1px solid #292929;

font-weight:bold;

display:flex;

justify-content:space-between;

gap:10px

}

.pick:last-child{

border-bottom:0

}

.hit{

color:#65e891

}

.recovery{

color:#ffd84d

}

.under{

color:#ff8c42

}

.prob{

font-size:12px;

color:#fff

}

.analysisText{

line-height:1.7;

font-size:13px;

color:#ddd

}

.highlight{

color:#d4af37;

font-weight:bold

}

.warning{

color:#ff8b8b

}

.infoGrid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:8px

}

.infoBox{

background:#171717;

border:1px solid #292929;

border-radius:8px;

padding:9px;

font-size:12px

}

.infoBox span{

color:#aaa;

display:block;

margin-bottom:3px

}

.techGrid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:6px;

margin-top:8px

}

.tech{

background:#101010;

border:1px solid #292929;

border-radius:7px;

padding:7px;

font-size:11px;

text-align:center

}

.tech span{

display:block;

color:#aaa;

margin-bottom:3px

}

.methodGrid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:6px

}

.method{

background:#101010;

border:1px solid #292929;

border-radius:7px;

padding:8px;

font-size:11px

}

.method strong{

color:#d4af37;

display:block;

font-size:15px;

margin-top:3px

}

.strategy{

background:#171717;

border-left:3px solid #d4af37;

padding:10px;

margin-top:10px;

font-size:12px;

line-height:1.7

}

.resultBox{

background:#171717;

border:1px solid #333;

border-radius:10px;

padding:12px;

margin-top:10px

}

.resultTitle{

color:#d4af37;

font-weight:bold;

margin-bottom:8px

}

.courseBox{

background:#151515;

border:1px solid #333;

border-radius:10px;

padding:10px;

margin-top:10px

}

.courseTitle{

color:#d4af37;

font-weight:bold;

font-size:13px;

margin-bottom:7px

}

.courseRow{

display:grid;

grid-template-columns:40px 1fr 1fr 1fr;

gap:4px;

font-size:11px;

padding:6px 2px;

border-bottom:1px solid #292929;

text-align:center

}

.courseRow:last-child{

border-bottom:0

}

.courseHead{

color:#aaa;

font-weight:bold

}

.fitGood{

color:#65e891;

font-weight:bold

}

.fitNormal{

color:#ffd84d;

font-weight:bold

}

.fitBad{

color:#ff7373;

font-weight:bold

}

.methodList{

margin-top:7px;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:5px

}

.methodMini{

background:#101010;

border-radius:6px;

padding:6px;

font-size:10px;

text-align:center

}

@media(max-width:600px){

.grid2{

grid-template-columns:1fr

}

.racers{

grid-template-columns:1fr

}

.techGrid{

grid-template-columns:repeat(2,1fr)

}

.courseRow{

grid-template-columns:35px 1fr 1fr 1fr;

font-size:10px

}

}

.footer{

text-align:center;

color:#555;

font-size:11px;

padding:20px

}

</style>

</head>

<script>

/* =====================================================

   BOAT HUNTER

   選手別コース適性・決まり手分析版

===================================================== */

const API=

"https://boatraceopenapi.github.io/api/v1";

let raceData=null;

let racers=[];

let previewRacers={};

let resultData=null;

let historicalStats={};

const techniqueNames={

1:"逃げ",

2:"差し",

3:"まくり",

4:"まくり差し",

5:"抜き",

6:"恵まれ"

};

/* =====================================================

   基本

===================================================== */

function num(v){

if(

v===null||

v===undefined||

v===""

)return 0;

const n=parseFloat(

String(v)

.replace("%","")

.replace("秒","")

.replace(",","")

);

return Number.isFinite(n)?n:0;

}

function esc(v){

return String(v??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;");

}

/* =====================================================

   JSON

===================================================== */

async function fetchJSON(url){

const response=

await fetch(

url,

{

cache:"no-store"

}

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

return await response.json();

}

/* =====================================================

   今日

===================================================== */

function getTodayJST(){

const now=new Date();

const parts=

new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(now);

const y=

parts.find(x=>x.type==="year").value;

const m=

parts.find(x=>x.type==="month").value;

const d=

parts.find(x=>x.type==="day").value;

return `${y}${m}${d}`;

}

/* =====================================================

   日付

===================================================== */

function dateObject(yyyymmdd){

return new Date(

Number(yyyymmdd.slice(0,4)),

Number(yyyymmdd.slice(4,6))-1,

Number(yyyymmdd.slice(6,8))

);

}

function dateString(date){

const y=

date.getFullYear();

const m=

String(date.getMonth()+1)

.padStart(2,"0");

const d=

String(date.getDate())

.padStart(2,"0");

return `${y}${m}${d}`;

}

/* =====================================================

   レース検索

===================================================== */

function findSelectedRace(

data,

venue,

race

){

if(!data)return null;

const s=

String(venue)

.replace(/^0/,"");

const r=

String(race);

return data

?.programs

?.stadiums

?.[s]

?.races

?.[r]||null;

}

/* =====================================================

   出走表

===================================================== */

async function loadRaceData(){

const venue=

document.getElementById("venue").value;

const race=

document.getElementById("race").value;

const message=

document.getElementById("message");

message.innerHTML=

"⏳ 出走表と過去コースデータを取得中...";

document.getElementById(

"raceCard"

).style.display="none";

document.getElementById(

"analysisCard"

).style.display="none";

document.getElementById(

"predictionCard"

).style.display="none";

try{

const date=

getTodayJST();

const url=

`${API}/${date.slice(0,4)}/${date}.json`;

const data=

await fetchJSON(url);

const selected=

findSelectedRace(

data,

venue,

race

);

if(!selected){

throw new Error(

"選択したレースのデータがありません。"

);

}

raceData=selected;

const racerObject=

selected.racers||{};

racers=

Object.values(racerObject)

.sort(

(a,b)=>

num(a.entry_number)-

num(b.entry_number)

);

if(!racers.length){

throw new Error(

"選手データがありません。"

);

}

previewRacers=

selected.preview?.racers||{};

resultData=

selected.result||null;

renderRace();

document.getElementById(

"raceCard"

).style.display="block";

message.innerHTML=

"✅ 出走表取得成功<br>"+

"選手："+racers.length+"名<br>"+

"⏳ 過去30日間のコース別データを分析中...";

await loadHistoricalData();

renderHistoricalCourseInfo();

message.innerHTML=

"✅ 完了<br>"+

"出走表＋過去30日コース適性＋決まり手分析";

}catch(error){

console.error(error);

message.innerHTML=

"❌ 取得失敗<br>"+

esc(error.message);

}

}

/* =====================================================

   選手

===================================================== */

function boatNumber(r,index){

return num(r.entry_number)||index+1;

}

function rankName(r){

const n=

num(r.rank_number);

const map={

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

return map[n]||"-";

}

/* =====================================================

   直前

===================================================== */

function previewForBoat(boat){

return previewRacers?.[String(boat)]||

previewRacers?.[boat]||

{};

}

function getCourse(r,boat){

const p=

previewForBoat(boat);

return num(p.course_number)||boat;

}

function getST(r,boat){

const p=

previewForBoat(boat);

return num(p.start_timing);

}

function getExhibition(r,boat){

const p=

previewForBoat(boat);

return num(p.exhibition_time);

}

/* =====================================================

   モーター

===================================================== */

function motorGrade(rate){

rate=num(rate);

if(rate>=70)

return{

text:"🔥 エース",

class:"ace",

score:18

};

if(rate>=60)

return{

text:"⭐ すごく良い",

class:"good",

score:14

};

if(rate>=50)

return{

text:"◎ 良い",

class:"good",

score:10

};

if(rate>=40)

return{

text:"○ 普通",

class:"normal",

score:6

};

if(rate>=35)

return{

text:"△ 悪くない",

class:"normal",

score:3

};

if(rate>30)

return{

text:"△ やや弱い",

class:"bad",

score:-2

};

return{

text:"❌ だめ",

class:"bad",

score:-7

};

}

/* =====================================================

   出走表表示

===================================================== */

function renderRace(){

const box=

document.getElementById("racers");

box.innerHTML="";

racers.forEach((r,i)=>{

const boat=

boatNumber(r,i);

const p=

previewForBoat(boat);

const motor=

num(r.motor_top_2_percent);

const grade=

motorGrade(motor);

const st=

num(p.start_timing);

const exhibition=

num(p.exhibition_time);

const course=

num(p.course_number);

box.innerHTML+=`

<div class="racer">

<div class="racerTop">

<div class="number n${boat}">

${boat}

</div>

<div class="racerName">

${esc(r.name)}

</div>

</div>

<div class="small">

級別：${rankName(r)}<br>

登録番号：

${r.number||"-"}<br>

年齢：

${r.age||"-"}歳<br>

全国勝率：

${num(r.national_win_rate).toFixed(2)}<br>

全国2連対率：

${num(r.national_top_2_percent).toFixed(1)}%<br>

当地勝率：

${num(r.local_win_rate).toFixed(2)}<br>

当地2連対率：

${num(r.local_top_2_percent).toFixed(1)}%

</div>

<div style="margin-top:7px">

<span class="badge ${grade.class}">

${motor

?motor.toFixed(1)+"% "+grade.text

:"モーター情報なし"}

</span>

</div>

<div class="techGrid">

<div class="tech">

<span>モーター</span>

${r.motor_number||"-"}

</div>

<div class="tech">

<span>進入</span>

${course||"-"}コース

</div>

<div class="tech">

<span>平均ST</span>

${num(r.average_start_timing)

?num(r.average_start_timing).toFixed(2)

:"-"}

</div>

<div class="tech">

<span>直前ST</span>

${st?st.toFixed(2):"-"}

</div>

<div class="tech">

<span>展示</span>

${exhibition

?exhibition.toFixed(2)

:"-"}

</div>

<div class="tech">

<span>ボート2連</span>

${num(r.boat_top_2_percent)

?num(r.boat_top_2_percent).toFixed(1)+"%"

:"-"}

</div>

</div>

</div>

`;

});

renderRaceInfo();

renderResult();

}

/* =====================================================

   レース情報

===================================================== */

function renderRaceInfo(){

const el=

document.getElementById("raceInfo");

const p=

raceData?.preview||{};

el.innerHTML=`

<div class="infoGrid">

<div class="infoBox">

<span>開催日</span>

${raceData.date||"-"}

</div>

<div class="infoBox">

<span>レース</span>

${raceData.race_number||"-"}R

</div>

<div class="infoBox">

<span>距離</span>

${raceData.distance||"-"}m

</div>

<div class="infoBox">

<span>風速</span>

${p.wind_speed??"-"}m

</div>

<div class="infoBox">

<span>波高</span>

${p.wave_height??"-"}cm

</div>

<div class="infoBox">

<span>気温</span>

${p.air_temperature??"-"}℃

</div>

</div>

`;

}

/* =====================================================

   結果

===================================================== */

function renderResult(){

const area=

document.getElementById("resultArea");

if(!resultData){

area.innerHTML=`

<div class="resultBox">

<div class="resultTitle">

📊 決まり手情報

</div>

<div class="small">

このレースの結果データは

まだ取得できません。

</div>

</div>

`;

return;

}

const technique=

num(resultData.technique_number);

const racersResult=

resultData.racers||{};

const order=

Object.values(racersResult)

.sort(

(a,b)=>

num(a.place_number)-

num(b.place_number)

);

const first=

order[0];

area.innerHTML=`

<div class="resultBox">

<div class="resultTitle">

📊 結果・決まり手

</div>

<div class="small">

1着：

<strong>

${first?.entry_number||"-"}号艇

${esc(first?.name||"")}

</strong>

<br>

決まり手：

<strong style="color:#d4af37">

${technique

?techniqueNames[String(technique)]||"不明"

:"データなし"}

</strong>

<br><br>

着順：

${order.map(

x=>

`${x.place_number}着 ${x.entry_number}号艇`

).join(" ／ ")}

</div>

</div>

`;

}

/* =====================================================

   過去30日データ

===================================================== */

function createEmptyStat(){

return{

total:0,

course:{

1:{n:0,win:0,top2:0,top3:0,methods:{}},

2:{n:0,win:0,top2:0,top3:0,methods:{}},

3:{n:0,win:0,top2:0,top3:0,methods:{}},

4:{n:0,win:0,top2:0,top3:0,methods:{}},

5:{n:0,win:0,top2:0,top3:0,methods:{}},

6:{n:0,win:0,top2:0,top3:0,methods:{}}

}

};

}

/* =====================================================

   選手別キー

===================================================== */

function racerKey(r){

return String(

r.number||

r.name||

""

).trim();

}

/* =====================================================

   過去データ取得

===================================================== */

async function loadHistoricalData(){

historicalStats={};

racers.forEach(r=>{

historicalStats[

racerKey(r)

]=createEmptyStat();

});

const today=

dateObject(getTodayJST());

const dates=[];

for(let i=1;i<=30;i++){

const d=

new Date(today);

d.setDate(

d.getDate()-i

);

dates.push(

dateString(d)

);

}

/*

  1日ずつ取得。

  Promise.allSettledで一部の日付が

  欠損していても全体を止めない。

*/

const requests=

dates.map(async date=>{

try{

const url=

`${API}/${date.slice(0,4)}/${date}.json`;

return await fetchJSON(url);

}catch(e){

return null;

}

});

const results=

await Promise.allSettled(requests);

for(const result of results){

if(

result.status!=="fulfilled"||

!result.value

)continue;

const data=

result.value;

const stadiums=

data?.programs?.stadiums||{};

for(const stadium of Object.values(stadiums)){

const races=

stadium?.races||{};

for(const race of Object.values(races)){

const resultData=

race?.result;

if(!resultData)continue;

const resultRacers=

resultData.racers||{};

for(const rr of Object.values(resultRacers)){

const key=

racerKey(rr);

if(

!historicalStats[key]

)continue;

const course=

num(rr.course_number);

const place=

num(rr.place_number);

if(

course<1||

course>6||

place<1

)continue;

const stat=

historicalStats[key];

const c=

stat.course[course];

c.n++;

stat.total++;

if(place===1)

c.win++;

if(place<=2)

c.top2++;

if(place<=3)

c.top3++;

/*

  決まり手はレース全体の

  technique_numberから取得。

  1着選手のデータとして集計。

*/

if(place===1){

const technique=

num(resultData.technique_number);

if(technique){

const name=

techniqueNames[

String(technique)

]||"不明";

c.methods[name]=

(c.methods[name]||0)+1;

}

}

}

}

}

}

}

/* =====================================================

   パーセント

===================================================== */

function pct(a,b){

if(!b)return 0;

return a/b*100;

}

/* =====================================================

   コース適性

===================================================== */

function getCourseStat(

r,

course

){

const key=

racerKey(r);

const stat=

historicalStats[key];

if(!stat)

return null;

return stat.course[course]||null;

}

function courseFitScore(

r,

course

){

const s=

getCourseStat(r,course);

if(!s||s.n<3)

return 50;

const win=

pct(s.win,s.n);

const top2=

pct(s.top2,s.n);

const top3=

pct(s.top3,s.n);

/*

  1着率、2連対率、3連対率を

  バランス評価

*/

let score=

win*1.8+

top2*0.8+

top3*0.4;

score=

Math.min(

100,

Math.max(

0,

score

)

);

return score;

}

/* =====================================================

   決まり手傾向

===================================================== */

function methodPercentages(

r,

course

){

const s=

getCourseStat(r,course);

if(!s||!s.n)

return [];

const total=

Object.values(s.methods)

.reduce(

(a,b)=>a+b,

0

);

if(!total)

return [];

return Object.entries(s.methods)

.map(

([name,count])=>({

name,

percent:

count/total*100,

count

})

)

.sort(

(a,b)=>

b.percent-a.percent

);

}

/* =====================================================

   AIスコア

===================================================== */

function calcScore(r,index){

const boat=

boatNumber(r,index);

const course=

getCourse(r,boat);

const national=

num(r.national_win_rate);

const local=

num(r.local_win_rate);

const motor=

num(r.motor_top_2_percent);

const avgST=

num(r.average_start_timing);

const st=

getST(r,boat);

const exhibition=

getExhibition(r,boat);

let score=0;

score+=national*6;

score+=local*3;

score+=motorGrade(motor).score;

/* 平均ST */

if(avgST>0){

if(avgST<=0.12)

score+=10;

else if(avgST<=0.15)

score+=7;

else if(avgST<=0.18)

score+=4;

else if(avgST<=0.22)

score+=1;

else

score-=3;

}

/* 直前ST */

if(st>0){

if(st<=0.10)

score+=7;

else if(st<=0.13)

score+=5;

else if(st<=0.16)

score+=3;

else if(st>=0.22)

score-=3;

}

/* 展示 */

if(exhibition>0){

if(exhibition<=6.70)

score+=8;

else if(exhibition<=6.80)

score+=5;

else if(exhibition<=6.90)

score+=2;

else if(exhibition>=7.10)

score-=3;

}

/* コース */

const courseBonus={

1:12,

2:7,

3:6,

4:5,

5:2,

6:0

};

score+=

courseBonus[course]||0;

/* 級別 */

const rank=

rankName(r);

if(rank==="A1")

score+=6;

else if(rank==="A2")

score+=3;

else if(rank==="B2")

score-=2;

/* =================================================

   過去コース適性

================================================= */

const fit=

courseFitScore(r,course);

if(fit>=80)

score+=14;

else if(fit>=70)

score+=10;

else if(fit>=60)

score+=6;

else if(fit>=50)

score+=2;

else if(fit>=40)

score-=3;

else

score-=7;

/* =================================================

   決まり手適性

================================================= */

const methods=

methodPercentages(r,course);

if(methods.length){

const best=

methods[0];

if(

course===1&&

best.name==="逃げ"

)

score+=6;

if(

(course===2||course===3)&&

(

best.name==="差し"||

best.name==="まくり"||

best.name==="まくり差し"

)

)

score+=5;

if(

(course===4||course===5)&&

(

best.name==="まくり"||

best.name==="まくり差し"

)

)

score+=5;

}

return Math.round(score*100)/100;

}

/* =====================================================

   ランキング

===================================================== */

function createRanking(){

return racers

.map((r,i)=>({

boat:

boatNumber(r,i),

racer:r,

score:

calcScore(r,i),

course:

getCourse(r,boatNumber(r,i)),

fit:

courseFitScore(

r,

getCourse(r,boatNumber(r,i))

)

}))

.sort(

(a,b)=>

b.score-a.score

);

}

/* =====================================================

   1号艇評価

===================================================== */

function insideRate(){

const first=

racers.find(

(r,i)=>

boatNumber(r,i)===1

);

if(!first)

return 50;

let rate=

num(first.national_top_2_percent);

const local=

num(first.local_top_2_percent);

if(local>0)

rate=

(rate+local)/2;

const course=

getCourse(first,1);

const stat=

getCourseStat(

first,

course

);

if(stat&&stat.n>=3){

const historical=

pct(

stat.win,

stat.n

);

/*

  全国・当地だけでなく

  本人の実コース1着率を加味

*/

rate=

rate*0.65+

historical*0.35;

}

if(rate<=0)

return 50;

return Math.min(

90,

Math.max(

25,

rate

)

);

}

/* =====================================================

   組み合わせ

===================================================== */

function combinationScore(

a,b,c,

ranking,

inside

){

const ra=

ranking.find(x=>x.boat===a);

const rb=

ranking.find(x=>x.boat===b);

const rc=

ranking.find(x=>x.boat===c);

if(!ra||!rb||!rc)

return 0;

let score=

ra.score*1.35+

rb.score+

rc.score*.75;

/* イン逃げ */

if(a===1){

if(inside>=55)

score+=12;

else if(inside>=50)

score+=5;

else

score-=10;

}

/* 1号艇が2・3着 */

if(b===1||c===1)

score+=

inside<50?2:5;

/* ST */

const st=

getST(

ra.racer,

a

);

if(st>0){

score+=Math.max(

0,

(0.25-st)*10

);

}

/* =================================================

   コース適性

================================================= */

score+=

ra.fit*.18+

rb.fit*.08+

rc.fit*.04;

return Math.max(

.1,

score

);

}

/* =====================================================

   プール

===================================================== */

function makePool(

ranking,

inside

){

const candidates=

ranking

.slice(0,6)

.map(x=>x.boat);

const pool=[];

for(const a of candidates){

for(const b of candidates){

if(a===b)

continue;

for(const c of candidates){

if(

a===c||

b===c

)

continue;

pool.push({

key:`${a}-${b}-${c}`,

a,

b,

c,

raw:

combinationScore(

a,b,c,

ranking,

inside

)

});

}

}

}

return pool.sort(

(a,b)=>

b.raw-a.raw

);

}

/* =====================================================

   確率

===================================================== */

function probabilities(picks){

if(!picks.length)

return [];

const total=

picks.reduce(

(s,x)=>s+x.raw,

0

);

return picks.map(x=>({

...x,

probability:

x.raw/total*100

}));

}

/* =====================================================

   重複除去

===================================================== */

function uniquePicks(

picks,

used

){

return picks.filter(

x=>

!used.has(x.key)

);

}

/* =====================================================

   的中重視

===================================================== */

function hitPicks(

ranking,

inside

){

const pool=

makePool(

ranking,

inside

);

let result=[];

/*

  的中重視は上位評価＋

  イン逃げを中心

*/

if(inside>=55){

result=

pool

.filter(x=>x.a===1)

.slice(0,6);

}else if(inside>=50){

result=[

...pool

.filter(x=>x.a===1)

.slice(0,3),

...pool

.filter(x=>x.a!==1)

.slice(0,3)

];

}else{

result=

pool

.filter(x=>x.a!==1)

.slice(0,6);

}

return probabilities(result);

}

/* =====================================================

   回収重視

===================================================== */

function recoveryPicks(

ranking,

inside,

used

){

const pool=

makePool(

ranking,

inside

);

const heads=

ranking

.slice(0,5)

.map(x=>x.boat);

let result=[];

for(const head of heads){

result.push(

...pool

.filter(

x=>

x.a===head

)

);

}

result=

uniquePicks(

result,

used

);

return probabilities(

result

.slice(0,8)

);

}

/* =====================================================

   大穴

===================================================== */

function underPicks(

ranking,

inside,

used

){

const pool=

makePool(

ranking,

inside

);

/*

  AI上位3艇以外を中心にする

*/

const outsiders=

ranking

.slice(3)

.map(x=>x.boat);

let result=

pool

.filter(

x=>

outsiders.includes(x.a)||

outsiders.includes(x.b)||

outsiders.includes(x.c)

);

result=

uniquePicks(

result,

used

);

/*

  穴は人気上位だけの組み合わせを排除

*/

result=

result.filter(

x=>

outsiders.includes(x.a)||

outsiders.includes(x.b)

);

return probabilities(

result.slice(0,8)

);

}
