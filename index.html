<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:#080808;

color:white;

font-family:Arial,sans-serif;

}

header{

background:#000;

color:#d4af37;

text-align:center;

padding:22px;

font-size:30px;

font-weight:bold;

border-bottom:2px solid #d4af37;

}

.container{

max-width:760px;

margin:auto;

padding:15px;

}

.card{

background:#151515;

border:1px solid #d4af37;

border-radius:14px;

padding:16px;

margin-bottom:16px;

}

.title{

color:#d4af37;

font-size:20px;

font-weight:bold;

margin-bottom:15px;

}

label{

display:block;

color:#aaa;

font-size:13px;

margin-top:10px;

}

select,input{

width:100%;

padding:12px;

margin-top:5px;

border-radius:7px;

border:1px solid #555;

background:#222;

color:white;

font-size:16px;

}

button{

width:100%;

padding:15px;

margin-top:14px;

border:0;

border-radius:10px;

background:#d4af37;

color:#000;

font-size:17px;

font-weight:bold;

}

.status{

margin-top:12px;

padding:12px;

background:#0b0b0b;

border-radius:8px;

font-size:13px;

line-height:1.7;

}

.success{color:#70ff8a}

.error{color:#ff7777}

.warning{color:#ffd166}

.boat{

background:#101010;

border:1px solid #333;

border-radius:10px;

padding:14px;

margin-bottom:10px;

}

.boatTop{

display:flex;

align-items:center;

gap:12px;

}

.number{

width:42px;

height:42px;

border-radius:8px;

background:#d4af37;

color:#000;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

font-weight:bold;

}

.player{

font-size:20px;

font-weight:bold;

}

.grade{

color:#d4af37;

margin-top:3px;

}

.info{

color:#bbb;

font-size:13px;

line-height:1.8;

margin-top:10px;

}

.result{

display:flex;

justify-content:space-between;

padding:13px;

margin:7px 0;

background:#222;

border-radius:8px;

}

.score{

color:#d4af37;

font-weight:bold;

}

.big{

font-size:23px;

color:#d4af37;

font-weight:bold;

}

.bet{

padding:14px;

margin:7px 0;

background:#222;

border-radius:8px;

font-size:19px;

font-weight:bold;

text-align:center;

}

.hidden{

display:none;

}

</style>

</head>

<body>

<header>🚤 BOAT HUNTER</header>

<div style="text-align:center;color:#aaa;padding:8px;">

人気ではなく期待値で勝つ

</div>

<div class="container">

<div class="card">

<div class="title">🏟 レース選択</div>

<label>競艇場</label>

<select id="venue">

<option value="1">桐生</option>

<option value="2">戸田</option>

<option value="3">江戸川</option>

<option value="4">平和島</option>

<option value="5">多摩川</option>

<option value="6">浜名湖</option>

<option value="7">蒲郡</option>

<option value="8">常滑</option>

<option value="9">津</option>

<option value="10">三国</option>

<option value="11">びわこ</option>

<option value="12">住之江</option>

<option value="13">尼崎</option>

<option value="14">鳴門</option>

<option value="15">丸亀</option>

<option value="16">児島</option>

<option value="17">宮島</option>

<option value="18">徳山</option>

<option value="19">下関</option>

<option value="20">若松</option>

<option value="21">芦屋</option>

<option value="22">福岡</option>

<option value="23">唐津</option>

<option value="24">大村</option>

</select>

<label>レース番号</label>

<select id="race">

<option value="1">1R</option>

<option value="2">2R</option>

<option value="3">3R</option>

<option value="4">4R</option>

<option value="5">5R</option>

<option value="6">6R</option>

<option value="7">7R</option>

<option value="8">8R</option>

<option value="9">9R</option>

<option value="10">10R</option>

<option value="11">11R</option>

<option value="12">12R</option>

</select>

<label>予算</label>

<input id="budget" type="number" value="3000">

<button onclick="getProgram()">

🔥 BOAT HUNTER解析開始

</button>

<div id="status" class="status">

まだ取得していません

</div>

</div>

<div class="card">

<div class="title">📋 出走表</div>

<div id="program">

まだ出走表を取得していません

</div>

</div>

<div id="analysis" class="hidden">

<div class="card">

<div class="title">🏆 AI判定</div>

<div id="judgement"></div>

</div>

<div class="card">

<div class="title">📊 AI期待値ランキング</div>

<div id="ranking"></div>

</div>

<div class="card">

<div class="title">🌊 展開予想</div>

<div id="development"></div>

</div>

<div class="card">

<div class="title">🎯 的中率重視</div>

<div id="safe"></div>

</div>

<div class="card">

<div class="title">💎 回収率重視</div>

<div id="value"></div>

</div>

<div class="card">

<div class="title">🔥 穴狙い</div>

<div id="dark"></div>

</div>

</div>

</div>

<script>

const API_URL =

"https://boatraceopenapi.github.io/programs/v3/today.json";

const VENUES = {

1:"桐生",

2:"戸田",

3:"江戸川",

4:"平和島",

5:"多摩川",

6:"浜名湖",

7:"蒲郡",

8:"常滑",

9:"津",

10:"三国",

11:"びわこ",

12:"住之江",

13:"尼崎",

14:"鳴門",

15:"丸亀",

16:"児島",

17:"宮島",

18:"徳山",

19:"下関",

20:"若松",

21:"芦屋",

22:"福岡",

23:"唐津",

24:"大村"

};

const CLASS_NAMES = {

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

/* =========================

出走表取得

========================= */

async function getProgram(){

const venue =

Number(

document.getElementById("venue").value

);

const race =

Number(

document.getElementById("race").value

);

const status =

document.getElementById("status");

const programBox =

document.getElementById("program");

status.innerHTML =

"⏳ "+

VENUES[venue]+

" "+

race+

"R の出走表を取得中...";

programBox.innerHTML = "";

try{

const response =

await fetch(API_URL);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

const data =

await response.json();

/*

APIのprogramsから

選択された場・レースを探す

*/

const raceData =

data.programs.find(function(p){

return Number(p.stadium_number) === venue

&&

Number(p.number) === race;

});

if(!raceData){

throw new Error(

VENUES[venue]+

" "+

race+

"R のデータが見つかりません"

);

}

/*

6艇を枠番順に並べる

*/

const boats =

Array.isArray(raceData.boats)

?

raceData.boats.slice().sort(

function(a,b){

return Number(a.racer_boat_number)

-

Number(b.racer_boat_number);

}

)

:

[];

if(boats.length === 0){

throw new Error(

"出走艇データがありません"

);

}

/*

出走表表示

*/

let html = "";

boats.forEach(function(b){

const no =

Number(b.racer_boat_number);

const name =

b.racer_name || "選手名不明";

const grade =

CLASS_NAMES[

Number(b.racer_class_number)

] || "不明";

html += `

<div class="boat">

<div class="boatTop">

<div class="number">

${no}

</div>

<div>

<div class="player">

${name}

</div>

<div class="grade">

${grade}

</div>

</div>

</div>

<div class="info">

全国勝率：

${num(b.racer_national_top_1_percent,2)}

<br>

全国2連率：

${num(b.racer_national_top_2_percent,2)}%

<br>

全国3連率：

${num(b.racer_national_top_3_percent,2)}%

<br>

当地勝率：

${num(b.racer_local_top_1_percent,2)}

<br>

当地2連率：

${num(b.racer_local_top_2_percent,2)}%

<br>

当地3連率：

${num(b.racer_local_top_3_percent,2)}%

<br>

モーター：

${b.racer_assigned_motor_number ?? "-"}

<br>

モーター2連率：

${num(b.racer_assigned_motor_top_2_percent,2)}%

<br>

モーター3連率：

${num(b.racer_assigned_motor_top_3_percent,2)}%

<br>

平均ST：

${num(b.racer_average_start_timing,2)}

</div>

</div>

`;

});

programBox.innerHTML = html;

status.innerHTML =

"<span class='success'>"+

"✅ 出走表取得成功"+

"</span>"+

"<br>"+

VENUES[venue]+" "+race+"R"+

"<br>"+

boats.length+"艇の選手データを取得";

/*

AI解析

*/

runAI(boats);

}

catch(error){

console.error(error);

status.innerHTML =

"<span class='error'>"+

"❌ 取得失敗"+

"</span>"+

"<br>"+

error.message;

}

}

/* =========================

数値処理

========================= */

function num(value,digits){

const n =

Number(value);

if(!Number.isFinite(n)){

return "-";

}

return n.toFixed(digits);

}

/* =========================

AIスコア

========================= */

function scoreBoat(b,index){

const national =

Number(

b.racer_national_top_1_percent

) || 0;

const local =

Number(

b.racer_local_top_1_percent

) || 0;

const motor =

Number(

b.racer_assigned_motor_top_2_percent

) || 0;

const motor3 =

Number(

b.racer_assigned_motor_top_3_percent

) || 0;

const st =

Number(

b.racer_average_start_timing

) || 0.20;

/*

選手力

*/

let score =

national * 8;

/*

当地適性

*/

score +=

local * 5;

/*

モーター

*/

score +=

motor * 0.35;

score +=

motor3 * 0.15;

/*

スタート

*/

score +=

(0.20 - st) * 100;

/*

コース補正

*/

const courseBonus = [

18,

10,

7,

4,

2,

0

];

score +=

courseBonus[index] || 0;

return score;

}

/* =========================

AI解析

========================= */

function runAI(boats){

const ranking =

boats.map(function(b,index){

return {

boat:

Number(b.racer_boat_number),

name:

b.racer_name || "不明",

score:

scoreBoat(b,index)

};

});

ranking.sort(function(a,b){

return b.score-a.score;

});

const first =

ranking[0];

const second =

ranking[1];

const third =

ranking[2];

const fourth =

ranking[3];

document.getElementById(

"analysis"

).classList.remove(

"hidden"

);

/*

本命・対抗・穴

*/

document.getElementById(

"judgement"

).innerHTML = `

<p>

<span class="big">

◎ 本命 ${first.boat}号艇

</span>

<br>

${first.name}

</p>

<p>

<span class="big">

○ 対抗 ${second.boat}号艇

</span>

<br>

${second.name}

</p>

<p>

<span class="big">

▲ 穴 ${third.boat}号艇

</span>

<br>

${third.name}

</p>

`;

/*

ランキング

*/

let rankingHTML = "";

ranking.forEach(function(x,i){

rankingHTML += `

<div class="result">

<span>

${i+1}位　

${x.boat}号艇　

${x.name}

</span>

<span class="score">

${x.score.toFixed(1)}

</span>

</div>

`;

});

document.getElementById(

"ranking"

).innerHTML =

rankingHTML;

/*

展開

*/

document.getElementById(

"development"

).innerHTML =

"基本展開：1号艇のイン逃げを軸に評価。"+

"<br><br>"+

"本命："+first.boat+"号艇"+

"<br>"+

"対抗："+second.boat+"号艇"+

"<br>"+

"穴："+third.boat+"号艇"+

"<br><br>"+

"全国勝率・当地勝率・モーター・ST・枠番を総合評価。";

/*

的中率重視

*/

document.getElementById(

"safe"

).innerHTML = `

<div class="bet">

${first.boat}-${second.boat}-${third.boat}

</div>

<div class="bet">

${first.boat}-${third.boat}-${second.boat}

</div>

<div class="bet">

${first.boat}-${second.boat}-${fourth.boat}

</div>

`;

/*

回収率重視

*/

document.getElementById(

"value"

).innerHTML = `

<div class="bet">

${first.boat}-${third.boat}-${fourth.boat}

</div>

<div class="bet">

${third.boat}-${first.boat}-${second.boat}

</div>

<div class="bet">

${second.boat}-${third.boat}-${first.boat}

</div>

`;

/*

穴狙い

*/

document.getElementById(

"dark"

).innerHTML = `

<div class="bet">

🔥 ${third.boat}-${first.boat}-${fourth.boat}

</div>

<div class="bet">

🔥 ${fourth.boat}-${third.boat}-${first.boat}

</div>

<div class="bet">

🔥 ${third.boat}-${fourth.boat}-${first.boat}

</div>

`;

}

</script>

</body>

</html>
