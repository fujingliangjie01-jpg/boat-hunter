<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{

box-sizing:border-box;

}

body{

margin:0;

background:#080808;

color:#fff;

font-family:Arial,sans-serif;

}

header{

background:#000;

color:#d4af37;

text-align:center;

padding:22px;

font-size:30px;

font-weight:bold;

border-bottom:2px solid #d4af37;

}

.container{

max-width:760px;

margin:auto;

padding:15px;

}

.card{

background:#151515;

border:1px solid #d4af37;

border-radius:14px;

padding:16px;

margin-bottom:16px;

}

.title{

color:#d4af37;

font-size:20px;

font-weight:bold;

margin-bottom:15px;

}

label{

display:block;

color:#aaa;

font-size:13px;

margin-top:10px;

}

select,

input{

width:100%;

padding:12px;

margin-top:5px;

border-radius:7px;

border:1px solid #555;

font-size:16px;

}

button{

width:100%;

padding:15px;

margin-top:12px;

border:0;

border-radius:10px;

background:#d4af37;

color:#000;

font-size:17px;

font-weight:bold;

}

button:active{

transform:scale(.98);

}

.secondary{

background:#222;

color:#d4af37;

border:1px solid #d4af37;

}

.boat{

background:#101010;

border:1px solid #333;

border-radius:10px;

padding:13px;

margin-bottom:12px;

}

.boat h3{

color:#d4af37;

margin-top:0;

}

.status{

margin-top:12px;

padding:12px;

background:#0b0b0b;

border-radius:8px;

font-size:13px;

line-height:1.7;

}

.success{

color:#70ff8a;

}

.error{

color:#ff7777;

}

.warning{

color:#ffd166;

}

.result{

display:flex;

justify-content:space-between;

padding:13px;

margin:7px 0;

background:#222;

border-radius:8px;

}

.score{

color:#d4af37;

font-weight:bold;

}

.big{

font-size:22px;

color:#d4af37;

font-weight:bold;

}

.bet{

padding:13px;

margin:7px 0;

background:#222;

border-radius:8px;

font-size:18px;

}

.hidden{

display:none;

}

.racer{

padding:12px;

margin:8px 0;

background:#101010;

border-left:4px solid #d4af37;

border-radius:7px;

}

</style>

</head>

<body>

<header>

🚤 BOAT HUNTER

</header>

<div style="

text-align:center;

color:#aaa;

padding:8px;

">

人気ではなく期待値で勝つ

</div>

<div class="container">

<!-- =========================

HOME

========================= -->

<div id="home">

<div class="card">

<div class="title">

🏟 レース選択

</div>

<label>

競艇場

</label>

<select id="venue">

<option>桐生</option>

<option>戸田</option>

<option>江戸川</option>

<option>平和島</option>

<option>多摩川</option>

<option>浜名湖</option>

<option>蒲郡</option>

<option>常滑</option>

<option>津</option>

<option>三国</option>

<option>びわこ</option>

<option>住之江</option>

<option>尼崎</option>

<option>鳴門</option>

<option>丸亀</option>

<option>児島</option>

<option>宮島</option>

<option>徳山</option>

<option>下関</option>

<option>若松</option>

<option>芦屋</option>

<option>福岡</option>

<option>唐津</option>

<option>大村</option>

</select>

<label>

レース番号

</label>

<select id="race">

<option>1R</option>

<option>2R</option>

<option>3R</option>

<option>4R</option>

<option>5R</option>

<option>6R</option>

<option>7R</option>

<option>8R</option>

<option>9R</option>

<option>10R</option>

<option>11R</option>

<option>12R</option>

</select>

<label>

予算

</label>

<input

id="budget"

type="number"

placeholder="例：5000"

>

<button onclick="startApp()">

🔥 AI解析を開始

</button>

</div>

</div>

<!-- =========================

INPUT

========================= -->

<div id="inputPage"

class="hidden">

<div class="card">

<div class="title">

🌐 無料出走表

</div>

<button

class="secondary"

onclick="getProgram()">

🚤 無料出走表を取得

</button>

<div

id="status"

class="status">

まだ取得していません

</div>

</div>

<div class="card">

<div class="title">

📊 出走表

</div>

<div id="boats">

</div>

</div>

<div class="card">

<div class="title">

🌊 水面情報

</div>

<label>

風速

</label>

<input

id="wind"

type="number"

step="0.1"

placeholder="例：3.0"

>

<label>

風向

</label>

<select id="windDir">

<option>無風</option>

<option>追い風</option>

<option>向かい風</option>

<option>左横風</option>

<option>右横風</option>

</select>

<label>

波高

</label>

<input

id="wave"

type="number"

placeholder="例：2"

>

<label>

進入予想

</label>

<input

id="entry"

value="123456"

>

</div>

<button onclick="analyze()">

🔥 BOAT HUNTER解析

</button>

</div>

<!-- =========================

RESULT

========================= -->

<div id="resultPage"

class="hidden">

<div class="card">

<div class="title">

🏆 AI判定

</div>

<div id="judgement">

</div>

</div>

<div class="card">

<div class="title">

📊 AIランキング

</div>

<div id="ranking">

</div>

</div>

<div class="card">

<div class="title">

🌊 展開予想

</div>

<div id="development">

</div>

</div>

<div class="card">

<div class="title">

🎯 的中率重視

</div>

<div id="safe">

</div>

</div>

<div class="card">

<div class="title">

💎 回収率重視

</div>

<div id="value">

</div>

</div>

<div class="card">

<div class="title">

🔥 穴狙い

</div>

<div id="dark">

</div>

</div>

<div class="card">

<div class="title">

🚤 AI自動買い目

</div>

<div id="autoBet">

</div>

</div>

<button onclick="location.reload()">

↩ 最初に戻る

</button>

</div>

</div>

<script>

/* =====================================

会場番号

===================================== */

const venueMap = {

"桐生":1,

"戸田":2,

"江戸川":3,

"平和島":4,

"多摩川":5,

"浜名湖":6,

"蒲郡":7,

"常滑":8,

"津":9,

"三国":10,

"びわこ":11,

"住之江":12,

"尼崎":13,

"鳴門":14,

"丸亀":15,

"児島":16,

"宮島":17,

"徳山":18,

"下関":19,

"若松":20,

"芦屋":21,

"福岡":22,

"唐津":23,

"大村":24

};

/* =====================================

APIデータ

===================================== */

let boatData = null;

let currentProgram = null;

/* =====================================

開始

===================================== */

function startApp(){

document

.getElementById("home")

.classList.add("hidden");

document

.getElementById("inputPage")

.classList.remove("hidden");

}

/* =====================================

出走表取得

===================================== */

async function getProgram(){

const venue =

document.getElementById("venue").value;

const race =

parseInt(

document

.getElementById("race")

.value

.replace("R",""),

10

);

const status =

document.getElementById("status");

status.innerHTML =

"⏳ 無料出走表を取得中...";

try{

const response =

await fetch(

"https://boatraceopenapi.github.io/programs/v3/today.json"

);

if(!response.ok){

throw new Error(

"HTTP "+response.status

);

}

boatData =

await response.json();

const stadium =

venueMap[venue];

currentProgram =

boatData.programs.find(

function(p){

return Number(

p.stadium_number

) === stadium

&&

Number(

p.number

) === race;

});

if(!currentProgram){

throw new Error(

venue+

" "+

race+

"Rのデータが見つかりません"

);

}

if(

!currentProgram.boats ||

currentProgram.boats.length < 6

){

throw new Error(

"6艇の出走表がありません"

);

}

displayBoats(

currentProgram.boats

);

status.innerHTML =

"<span class='success'>"+

"✅ 出走表取得成功"+

"</span>"+

"<br><br>"+

venue+

" "+

race+

"R"+

"<br>"+

currentProgram.title+

"<br><br>"+

"選手名・成績データを取得しました。";

}

catch(error){

console.error(error);

status.innerHTML =

"<span class='error'>"+

"❌ 取得失敗"+

"</span>"+

"<br>"+

error.message;

}

}

/* =====================================

6艇表示

===================================== */

function displayBoats(boats){

let html = "";

boats

.slice()

.sort(

function(a,b){

return Number(

a.racer_boat_number

)

-

Number(

b.racer_boat_number

);

})

.forEach(

function(b){

html += `

<div class="racer">

<b style="color:#d4af37;font-size:18px;">

${b.racer_boat_number}号艇

</b>

<br><br>

<strong>

${b.racer_name || "不明"}

</strong>

<br>

登録番号：

${b.racer_number}

<br>

級別：

${className(

b.racer_class_number

)}

<br>

全国3連対率：

${num(

b.racer_national_top_3_percent

)}%

<br>

当地3連対率：

${num(

b.racer_local_top_3_percent

)}%

<br>

モーター2連率：

${num(

b.racer_assigned_motor_top_2_percent

)}%

<br>

平均ST：

${num(

b.racer_average_start_timing

)}

</div>

`;

});

document

.getElementById("boats")

.innerHTML =

html;

}

/* =====================================

級別

===================================== */

function className(n){

if(Number(n)===1)

return "A1";

if(Number(n)===2)

return "A2";

if(Number(n)===3)

return "B1";

return "B2";

}

/* =====================================

数値

===================================== */

function num(n){

const x =

Number(n);

if(isNaN(x))

return "-";

return x.toFixed(2);

}

/* =====================================

AI解析

===================================== */

function analyze(){

if(!currentProgram){

alert(

"先に出走表を取得してください。"

);

return;

}

const boats =

currentProgram.boats

.slice()

.sort(

function(a,b){

return Number(

a.racer_boat_number

)

-

Number(

b.racer_boat_number

);

});

let ranking =

boats.map(

function(b,index){

const national =

Number(

b.racer_national_top_3_percent

) || 0;

const local =

Number(

b.racer_local_top_3_percent

) || 0;

const motor2 =

Number(

b.racer_assigned_motor_top_2_percent

) || 0;

const motor3 =

Number(

b.racer_assigned_motor_top_3_percent

) || 0;

const st =

Number(

b.racer_average_start_timing

) || 0.20;

let score = 0;

/*

全国成績

*/

score +=

national * 0.40;

/*

当地成績

*/

score +=

local * 0.30;

/*

モーター

*/

score +=

motor2 * 0.25;

score +=

motor3 * 0.10;

/*

ST

*/

score +=

Math.max(

0,

(0.23-st)*100

);

/*

枠番

*/

score +=

[22,13,10,7,4,2][index];

/*

A級

*/

if(

Number(

b.racer_class_number

) === 1

)

score += 6;

else if(

Number(

b.racer_class_number

) === 2

)

score += 4;

else if(

Number(

b.racer_class_number

) === 3

)

score += 2;

return {

boat:

Number(

b.racer_boat_number

),

name:

b.racer_name ||

"不明",

score:

score

};

});

ranking.sort(

function(a,b){

return b.score-a.score;

});

const first =

ranking[0];

const second =

ranking[1];

const third =

ranking[2];

const fourth =

ranking[3];

/* =====================================

結果画面

===================================== */

document

.getElementById("inputPage")

.classList.add("hidden");

document

.getElementById("resultPage")

.classList.remove("hidden");

/* 判定 */

document

.getElementById("judgement")

.innerHTML = `

<p>

<span class="big">

◎ 本命

${first.boat}号艇

</span>

<br>

${first.name}

</p>

<p>

<span class="big">

○ 対抗

${second.boat}号艇

</span>

<br>

${second.name}

</p>

<p>

<span class="big">

▲ 穴

${third.boat}号艇

</span>

<br>

${third.name}

</p>

`;

/* =====================================

ランキング

===================================== */

let rankingHTML = "";

ranking.forEach(

function(x,i){

rankingHTML += `

<div class="result">

<span>

${i+1}位　

${x.boat}号艇　

${x.name}

</span>

<span class="score">

${x.score.toFixed(1)}

</span>

</div>

`;

});

document

.getElementById("ranking")

.innerHTML =

rankingHTML;

/* =====================================

展開

===================================== */

document

.getElementById("development")

.innerHTML =

"基本展開：1号艇のイン逃げを軸に評価。"+

"<br><br>"+

"◎ "+

first.boat+

"号艇 "+

first.name+

"<br>"+

"○ "+

second.boat+

"号艇 "+

second.name+

"<br>"+

"▲ "+

third.boat+

"号艇 "+

third.name+

"<br><br>"+

"全国成績・当地成績・モーター・ST・枠番を総合評価。";

/* =====================================

的中率重視

===================================== */

document

.getElementById("safe")

.innerHTML = `

<div class="bet">

${first.boat}-${second.boat}-${third.boat}

</div>

<div class="bet">

${first.boat}-${third.boat}-${second.boat}

</div>

<div class="bet">

${first.boat}-${second.boat}-${fourth.boat}

</div>

`;

/* =====================================

回収率重視

===================================== */

document

.getElementById("value")

.innerHTML = `

<div class="bet">

${first.boat}-${third.boat}-${fourth.boat}

</div>

<div class="bet">

${third.boat}-${first.boat}-${second.boat}

</div>

<div class="bet">

${second.boat}-${third.boat}-${first.boat}

</div>

`;

/* =====================================

穴狙い

===================================== */

document

.getElementById("dark")

.innerHTML = `

<div class="bet">

🔥 ${third.boat}-${first.boat}-${fourth.boat}

</div>

<div class="bet">

🔥 ${fourth.boat}-${third.boat}-${first.boat}

</div>

<div class="bet">

🔥 ${third.boat}-${fourth.boat}-${first.boat}

</div>

`;

/* =====================================

AI自動買い目

===================================== */

generateAutoBets(

ranking

);

}

/* =====================================

AI自動買い目

===================================== */

function generateAutoBets(

ranking

){

const top =

ranking.slice(0,4);

let combinations = [];

top.forEach(

function(a){

top.forEach(

function(b){

top.forEach(

function(c){

if(

a.boat===b.boat ||

a.boat===c.boat ||

b.boat===c.boat

){

return;

}

let score =

a.score *

b.score *

c.score;

combinations.push({

bet:

a.boat+

"-"+

b.boat+

"-"+

c.boat,

score:

score

});

});

});

});

combinations.sort(

function(a,b){

return b.score-a.score;

});

const best =

combinations.slice(0,10);

let total = 0;

best.forEach(

function(x){

total += x.score;

});

let html = "";

best.forEach(

function(x,i){

const probability =

x.score /

total *

100;

html += `

<div class="bet">

<b>

${i+1}位　

${x.bet}

</b>

<br>

AI推定値：

${probability.toFixed(2)}%

<br>

AIスコア：

${x.score.toFixed(1)}

</div>

`;

});

document

.getElementById("autoBet")

.innerHTML =

html;

}

/* =====================================

ページ表示時

===================================== */

window.addEventListener(

"load",

function(){

console.log(

"BOAT HUNTER READY"

);

});

</script>

</body>

</html>
