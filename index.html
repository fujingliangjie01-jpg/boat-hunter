<script>

"use strict";

/* ================================

設定

================================ */

const API_URLS = [

"https://boatraceopenapi.github.io/api/v1/today.json",

"https://boatraceopenapi.github.io/programs/v3/today.json",

"https://boatraceopenapi.github.io/programs/v2/today.json"

];

let raceData = null;

let selectedEntry = [];

/* ================================

共通

================================ */

function num(value){

if(value===null || value===undefined || value===""){

return 0;

}

const n=Number(value);

return Number.isFinite(n) ? n : 0;

}

function format(value){

if(value===null || value===undefined || value===""){

return "-";

}

const n=Number(value);

if(!Number.isFinite(n)){

return String(value);

}

return n.toFixed(2);

}

function escapeHtml(text){

return String(text ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

/* ================================

級別

================================ */

function getRank(value){

const map={

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

return map[num(value)] || "-";

}

/* ================================

API

================================ */

async function fetchJson(url){

const response=await fetch(

url+"?t="+Date.now(),

{

method:"GET",

cache:"no-store",

headers:{

"Accept":"application/json"

}

}

);

if(!response.ok){

throw new Error("HTTP "+response.status);

}

return await response.json();

}

/* ================================

レース検索

================================ */

function findRace(data,stadiumNumber,raceNumber){

if(!data){

return null;

}

if(

data.programs &&

data.programs.stadiums

){

const stadiums=data.programs.stadiums;

const stadium=

stadiums[String(stadiumNumber)] ||

stadiums[stadiumNumber];

if(stadium && stadium.races){

const race=

stadium.races[String(raceNumber)] ||

stadium.races[raceNumber];

if(race){

return race;

}

}

}

let found=null;

function walk(obj){

if(found || !obj || typeof obj!=="object"){

return;

}

if(

obj.stadium_number!==undefined &&

num(obj.stadium_number)===stadiumNumber &&

obj.race_number!==undefined &&

num(obj.race_number)===raceNumber &&

(

obj.racers ||

obj.entries

)

){

found=obj;

return;

}

Object.keys(obj).forEach(function(key){

if(!found){

walk(obj[key]);

}

});

}

walk(data);

return found;

}

/* ================================

選手

================================ */

function getRacers(race){

if(!race){

return [];

}

if(Array.isArray(race.racers)){

return race.racers;

}

if(race.racers && typeof race.racers==="object"){

return Object.values(race.racers);

}

if(Array.isArray(race.entries)){

return race.entries;

}

if(race.entries && typeof race.entries==="object"){

return Object.values(race.entries);

}

return [];

}

function getBoatNumber(r){

return num(

r.entry_number ??

r.boat_number ??

r.number ??

r.lane

);

}

function getName(r){

return(

r.name ||

r.racer_name ||

r.player_name ||

"選手名不明"

);

}

/* ================================

出走表

================================ */

function displayRace(race){

const boats=document.getElementById("boats");

boats.innerHTML="";

const racers=getRacers(race)

.sort(function(a,b){

return getBoatNumber(a)-getBoatNumber(b);

});

if(racers.length<6){

boats.innerHTML=`

<div class="warning">

⚠️ 6艇の選手データを取得できませんでした。

<br><br>

取得数：<strong>${racers.length}艇</strong>

</div>

`;

return false;

}

racers.forEach(function(r){

const div=document.createElement("div");

div.className="boat";

div.innerHTML=`

<div class="boat-number">

${getBoatNumber(r)}

</div>

<div class="boat-name">

${escapeHtml(getName(r))}

</div>

<div class="boat-class">

${getRank(r.rank_number ?? r.rank)}

</div>

<div class="metric">

全国 ${format(r.national_win_rate)}

</div>

<div class="metric">

当地 ${format(r.local_win_rate)}

</div>

<div class="metric">

M${r.motor_number || "-"}

</div>

<div class="metric">

M2連 ${format(r.motor_top_2_percent)}%

</div>

<div class="metric">

M3連 ${format(r.motor_top_3_percent)}%

</div>

<div class="metric">

ST ${format(r.average_start_timing)}

</div>

`;

boats.appendChild(div);

});

return true;

}

/* ================================

直前情報

================================ */

function displayPreview(race){

const box=document.getElementById("previewInfo");

const preview=race.preview;

if(!preview){

box.innerHTML=`

<div class="warning">

⚠️ 現在、直前情報はまだ取得できません。

<br><br>

出走表は取得できています。

</div>

`;

return;

}

let html=`

<div class="info-grid">

<div class="info-item">

<div class="info-label">風速</div>

<div class="info-value">

${preview.wind_speed ?? "-"} m

</div>

</div>

<div class="info-item">

<div class="info-label">波高</div>

<div class="info-value">

${preview.wave_height ?? "-"} cm

</div>

</div>

<div class="info-item">

<div class="info-label">気温</div>

<div class="info-value">

${preview.air_temperature ?? "-"} ℃

</div>

</div>

<div class="info-item">

<div class="info-label">水温</div>

<div class="info-value">

${preview.water_temperature ?? "-"} ℃

</div>

</div>

</div>

`;

const previewRacers=preview.racers

?Object.values(preview.racers)

:[];

if(previewRacers.length){

previewRacers.sort(function(a,b){

return num(a.entry_number)-num(b.entry_number);

});

html+=`

<div class="ai-box">

<strong>📊 展示・直前情報</strong>

`;

previewRacers.forEach(function(r){

html+=`

<div class="row">

<span class="left">

${num(r.entry_number)}号艇

</span>

<span class="right">

展示 ${format(r.exhibition_time)}秒

　

ST ${format(r.start_timing)}

</span>

</div>

`;

});

html+="</div>";

}

box.innerHTML=html;

}

/* ================================

出走表取得

================================ */

async function loadRace(){

const stadium=num(

document.getElementById("venue").value

);

const raceNumber=num(

document.getElementById("race").value

);

const status=document.getElementById("status");

const apiInfo=document.getElementById("apiInfo");

const loadButton=document.getElementById("loadButton");

status.innerHTML="⏳ レースデータを取得中...";

apiInfo.innerHTML="API接続中...";

document.getElementById("result")

.classList.add("hidden");

loadButton.disabled=true;

loadButton.innerText="⏳ 取得中...";

let lastError=null;

try{

for(let i=0;i<API_URLS.length;i++){

const url=API_URLS[i];

status.innerHTML=

"⏳ API "+(i+1)+"/"+API_URLS.length+" を確認中...";

try{

const data=await fetchJson(url);

const race=findRace(

data,

stadium,

raceNumber

);

if(!race){

lastError=new Error(

"指定レースがデータ内にありません"

);

continue;

}

const racers=getRacers(race);

if(racers.length<6){

lastError=new Error(

"選手データが6艇ありません"

);

continue;

}

raceData=race;

selectedEntry=[];

displayRace(race);

displayPreview(race);

createEntryButtons();

document.getElementById("result")

.classList.remove("hidden");

status.innerHTML="✅ 出走表取得成功";

apiInfo.innerHTML=`

取得元：

<strong>${escapeHtml(url)}</strong>

<br>

会場番号：${stadium}

<br>

レース：${raceNumber}R

<br>

選手：${racers.length}名

<br>

API：<strong>Boatrace Open API</strong>

<br>

締切：${escapeHtml(race.closed_at || "-")}

<br>

タイトル：${escapeHtml(race.title || "-")}

`;

loadButton.disabled=false;

loadButton.innerText="🔥 出走表を取得";

return;

}catch(error){

console.error("API ERROR",error);

lastError=error;

}

}

throw lastError ||

new Error("APIからデータを取得できませんでした。");

}catch(error){

status.innerHTML=`

<span class="red">

❌ 出走表取得失敗

</span>

<br><br>

${escapeHtml(error.message)}

`;

apiInfo.innerHTML=`

<div class="warning">

<strong>

APIからデータを取得できませんでした。

</strong>

<br><br>

${escapeHtml(error.message)}

<br><br>

・開催状況を確認してください

<br>

・API更新前の可能性があります

<br>

・通信環境を確認してください

</div>

`;

document.getElementById("result")

.classList.add("hidden");

loadButton.disabled=false;

loadButton.innerText="🔥 出走表を取得";

}

}

/* ================================

進入

================================ */

function createEntryButtons(){

const container=document.getElementById("entryButtons");

container.innerHTML="";

for(let i=1;i<=6;i++){

const button=document.createElement("button");

button.type="button";

button.className="entry-btn";

button.innerText=i+"号艇";

button.addEventListener("click",function(){

selectEntry(i);

});

container.appendChild(button);

}

}

function selectEntry(boat){

if(selectedEntry.includes(boat)){

return;

}

if(selectedEntry.length>=6){

return;

}

selectedEntry.push(boat);

updateEntryButtons();

document.getElementById("entryResult")

.innerText=selectedEntry.join("-");

}

function updateEntryButtons(){

document.querySelectorAll(".entry-btn")

.forEach(function(button,index){

button.classList.toggle(

"selected",

selectedEntry.includes(index+1)

);

});

}

function clearEntry(){

selectedEntry=[];

updateEntryButtons();

document.getElementById("entryResult")

.innerText="進入を入力してください";

document.getElementById("maezuke")

.innerHTML=

'<div class="note">本番進入を入力してください。</div>';

document.getElementById("development")

.innerHTML=

'<div class="note">解析待ち</div>';

}

/* ================================

AIスコア

================================ */

function calcScore(r,entry){

let score=0;

const national=num(r.national_win_rate);

const local=num(r.local_win_rate);

const motor2=num(r.motor_top_2_percent);

const motor3=num(r.motor_top_3_percent);

const national2=num(r.national_top_2_percent);

const local2=num(r.local_top_2_percent);

const st=num(r.average_start_timing);

const rank=num(r.rank_number ?? r.rank);

const boat=getBoatNumber(r);

const course=entry.indexOf(boat)+1;

/* 能力 */

score+=national*7;

score+=local*4;

score+=national2*0.08;

score+=local2*0.06;

score+=motor2*0.15;

score+=motor3*0.05;

/* ST */

if(st>0){

score+=Math.max(0,0.30-st)*20;

}

/* コース */

const courseBonus={

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

};

score+=courseBonus[course] || 0;

/* 級別 */

if(rank===1)score+=5;

if(rank===2)score+=2;

if(rank===4)score-=2;

/* 1コース */

if(course===1){

score+=3;

}

/* 6コース */

if(course===6){

score-=1;

}

/* 水面 */

const preview=

raceData && raceData.preview

?raceData.preview

:null;

if(preview){

const wind=num(preview.wind_speed);

const wave=num(preview.wave_height);

if(wind>=5){

if(course<=3)score+=2;

if(course>=5)score-=1;

}

if(wind>=6 && wave>=4){

if(course<=3)score+=2;

if(course>=4)score-=2;

}

if(wave>=5){

if(course===1)score+=2;

if(course===2)score+=1;

if(course>=5)score-=1;

}

}

/* ================================

展開パターン判定

================================ */

function detectPattern(ranking,entry){

const first=entry[0];

const second=entry[1];

const third=entry[2];

const fourth=entry[3];

const r1=ranking.find(r=>r.number===first);

const r2=ranking.find(r=>r.number===second);

const r3=ranking.find(r=>r.number===third);

const r4=ranking.find(r=>r.number===fourth);

if(!r1 || !r2 || !r3 || !r4){

return{

type:"normal",

text:"基本進入から総合評価で判断"

};

}

/*

1コース艇のST・能力が低く、

2・3コースが強い場合

*/

if(

first!==1 ||

(

r1.score<r2.score-8 &&

r2.score>=r3.score-4

)

){

return{

type:"sashi",

text:"差し展開を重視"

};

}

/*

3コース・4コースの攻撃力が高い

*/

if(

r3.score>r1.score+5 ||

r4.score>r1.score+5

){

return{

type:"makuri",

text:"まくり・まくり差し展開を重視"

};

}

return{

type:"normal",

text:"イン逃げを基本線に差し・まくり差しを警戒"

};

}

/* ================================

確率

================================ */

function calculateProbabilities(ranking){

if(!ranking || ranking.length!==6){

return [];

}

const values=ranking.map(function(r){

return Math.exp(r.score/12);

});

const total=values.reduce(

function(a,b){return a+b;},

0

);

return ranking.map(function(r,i){

const first=values[i]/total;

/*

2連対は1着確率＋

2着になる可能性を簡易推定

*/

let second=0;

for(let j=0;j<6;j++){

if(i===j)continue;

second+=

(values[j]/total)*

(values[i]/(total-values[j]));

}

let third=0;

for(let j=0;j<6;j++){

if(i===j)continue;

for(let k=0;k<6;k++){

if(k===i || k===j)continue;

const remain=total-values[j]-values[k];

if(remain<=0)continue;

third+=

(values[j]/total)*

(values[k]/(total-values[j]))*

(values[i]/remain);

}

}

return{

number:r.number,

name:r.name,

score:r.score,

first:Math.round(first*100),

second:Math.round(second*100),

third:Math.round(third*100)

};

});

}

function getHoleReason(r){

.find(function(x){

return getBoatNumber(x)===r.number;

if(!racer){

return "総合AI評価から穴候補として選出。";

}

const reasons=[];

const motor2=num(racer.motor_top_2_percent);

const motor3=num(racer.motor_top_3_percent);

const st=num(racer.average_start_timing);

const national=num(racer.national_win_rate);

const local=num(racer.local_win_rate);

const course=selectedEntry.indexOf(r.number)+1;

if(motor2>=40){

reasons.push("モーター2連率が高い");

}

if(motor3>=60){

reasons.push("モーター3連率が高い");

}

if(st>0 && st<=0.15){

reasons.push("平均STが上位");

}

if(national>=6){

reasons.push("全国勝率が高い");

}

if(local>=6){

reasons.push("当地勝率が高い");

}

if(course<=3){

reasons.push(course+"コース取得で展開利");

}

if(reasons.length===0){

reasons.push("総合AIスコアが高い");

}

return reasons.slice(0,4).join("・");

}

/* ================================

3連単重複防止

================================ */

function uniquePicks(picks){

const seen=new Set();

const result=[];

picks.forEach(function(p){

if(!p)return;

const parts=p.split("-");

if(

parts.length!==3 ||

parts[0]===parts[1] ||

parts[0]===parts[2] ||

parts[1]===parts[2]

){

return;

}

if(!seen.has(p)){

seen.add(p);

result.push(p);

}

});

return result;

}
