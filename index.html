<script>

const API_V3 =

"https://boatraceopenapi.github.io/programs/v3";

const API_V2 =

"https://boatraceopenapi.github.io/programs/v2";

const STADIUMS=[

["桐生",1],["戸田",2],["江戸川",3],["平和島",4],

["多摩川",5],["浜名湖",6],["蒲郡",7],["常滑",8],

["津",9],["三国",10],["びわこ",11],["住之江",12],

["尼崎",13],["鳴門",14],["丸亀",15],["児島",16],

["宮島",17],["徳山",18],["下関",19],["若松",20],

["芦屋",21],["福岡",22],["唐津",23],["大村",24]

];

let raceData=null;

let racers=[];

let entryOrder=[1,2,3,4,5,6];

let usedApi="";

const stadium=

document.getElementById("stadium");

STADIUMS.forEach(x=>{

const op=document.createElement("option");

op.value=x[1];

op.textContent=x[0];

stadium.appendChild(op);

});

function todayJP(){

const d=new Date();

return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

}

function setStatus(text){

document.getElementById("status").textContent=text;

}

function num(v){

if(v===null||v===undefined||v==="")return 0;

const n=parseFloat(

String(v)

.replace("%","")

.replace(",","")

);

return isNaN(n)?0:n;

}

function first(obj,keys,def=0){

if(!obj)return def;

for(const key of keys){

if(

obj[key]!==undefined &&

obj[key]!==null &&

obj[key]!==""

){

return obj[key];

}

}

return def;

}

/* =========================

   過去10走データ抽出

========================= */

function extractPastResults(r){

let data=first(r,[

"past10",

"past10Results",

"recent10",

"recentResults",

"last10",

"last10Results",

"recentRaceResults",

"results",

"recent"

],null);

if(!Array.isArray(data)){

for(const key of Object.keys(r||{})){

const v=r[key];

if(

Array.isArray(v) &&

v.length>=5 &&

v.every(x=>

typeof x==="number" ||

typeof x==="string" ||

typeof x==="object"

)

){

const possible=v.map(parseFinish);

const valid=possible.filter(x=>x>=1&&x<=6);

if(valid.length>=5){

data=v;

break;

}

}

}

}

if(!Array.isArray(data))return [];

return data

.slice(0,10)

.map(parseFinish)

.filter(x=>x>=1&&x<=6);

}

function parseFinish(v){

if(typeof v==="number")return Math.round(v);

if(typeof v==="string"){

const m=v.match(/[1-6]/);

return m?Number(m[0]):0;

}

if(v&&typeof v==="object"){

return Number(first(v,[

"finish",

"finishPosition",

"rank",

"result",

"着順",

"arrival",

"position"

],0));

}

return 0;

}

function calcPastStats(results){

if(!results||!results.length){

return {

count:0,

avg:0,

firstRate:0,

secondRate:0,

thirdRate:0,

trend:0,

score:0

};

}

let weightedSum=0;

let weightTotal=0;

results.forEach((finish,i)=>{

const weight=

10-i;

weightedSum+=finish*weight;

weightTotal+=weight;

});

const avg=

weightedSum/weightTotal;

const firstCount=

results.filter(x=>x===1).length;

const secondCount=

results.filter(x=>x<=2).length;

const thirdCount=

results.filter(x=>x<=3).length;

/*

直近5走と後半5走を比較。

プラスなら上昇傾向。

*/

const recent=

results.slice(0,5);

const older=

results.slice(5,10);

let trend=0;

if(recent.length && older.length){

const recentAvg=

recent.reduce((a,b)=>a+b,0)/recent.length;

const olderAvg=

older.reduce((a,b)=>a+b,0)/older.length;

trend=

olderAvg-recentAvg;

}

const avgScore=

Math.max(

0,

Math.min(

100,

(6-avg)/5*100

)

);

const firstScore=

firstCount/results.length*100;

const secondScore=

secondCount/results.length*100;

const thirdScore=

thirdCount/results.length*100;

const trendScore=

Math.max(

0,

Math.min(

100,

50+trend*15

)

);

/*

過去10走総合点

平均着順 40%

3連対 25%

2連対 15%

1着率 10%

勢い 10%

*/

const score=

avgScore*0.40+

thirdScore*0.25+

secondScore*0.15+

firstScore*0.10+

trendScore*0.10;

return{

count:results.length,

avg,

firstRate:firstCount/results.length*100,

secondRate:secondCount/results.length*100,

thirdRate:thirdCount/results.length*100,

trend,

score

};

}

function normalizeRacer(r,i){

const course=Number(first(r,[

"course",

"courseNumber",

"entry",

"boatNumber",

"waku"

],i+1));

const name=first(r,[

"name",

"racerName",

"playerName",

"fullName"

],`選手${i+1}`);

const rank=first(r,[

"rank",

"class",

"racerClass"

],"B1");

const national=num(first(r,[

"nationalWinRate",

"national_win_rate",

"winRate",

"nationWinRate"

],0));

const local=num(first(r,[

"localWinRate",

"local_win_rate",

"localRate"

],0));

const motor2=num(first(r,[

"motor2Rate",

"motorSecondRate",

"motor2",

"motorWinRate2"

],0));

const motor3=num(first(r,[

"motor3Rate",

"motorThirdRate",

"motor3",

"motorWinRate3"

],0));

const st=num(first(r,[

"ST","st","startTime","averageST"

],0));

const exhibition=num(first(r,[

"exhibitionTime",

"exhibition",

"tenjiTime"

],0));

const motorNo=first(r,[

"motorNumber",

"motorNo",

"motor"

],"-");

const past10=

extractPastResults(r);

const pastStats=

calcPastStats(past10);

const currentResults=

extractCurrentResults(r);

const currentStats=

calcCurrentStats(currentResults);

return{

raw:r,

course,

name,

rank,

national,

local,

motor2,

motor3,

st,

exhibition,

motorNo,

past10,

pastStats,

currentResults,

currentStats,

score:0

};

}

/* =========================

   今節成績

========================= */

function extractCurrentResults(r){

const data=first(r,[

"currentResults",

"thisMeetingResults",

"meetingResults",

"todayResults",

"currentSeriesResults",

"seriesResults",

"thisSeries"

],null);

if(!Array.isArray(data))return [];

return data

.map(parseFinish)

.filter(x=>x>=1&&x<=6)

.slice(0,6);

}

function calcCurrentStats(results){

if(!results.length){

return{

count:0,

avg:0,

score:50

};

}

const avg=

results.reduce((a,b)=>a+b,0)/results.length;

const score=

Math.max(

0,

Math.min(

100,

(6-avg)/5*100

)

);

return{

count:results.length,

avg,

score

};

}

/* =========================

   API

========================= */

async function fetchJSON(url){

const response=

await fetch(url,{

method:"GET",

cache:"no-store"

});

if(!response.ok){

throw new Error("HTTP "+response.status);

}

return await response.json();

}

function findRace(data,stadiumNo,raceNo){

if(!data)return null;

if(Array.isArray(data)){

for(const item of data){

const found=

findRace(item,stadiumNo,raceNo);

if(found)return found;

}

return null;

}

if(typeof data!=="object")return null;

const s=Number(first(data,[

"stadiumNumber",

"stadiumNo",

"venueNumber",

"jyo",

"stadium"

],-1));

const r=Number(first(data,[

"raceNumber",

"raceNo",

"race"

],-1));

if(

s===Number(stadiumNo) &&

r===Number(raceNo)

){

return data;

}

for(const key of Object.keys(data)){

const value=data[key];

if(

value &&

typeof value==="object"

){

const found=

findRace(value,stadiumNo,raceNo);

if(found)return found;

}

}

return null;

}

function extractRacers(race){

if(!race)return [];

let arr=

race.racers ||

race.entries ||

race.program ||

race.players ||

race.boats ||

race.racerList;

if(!Array.isArray(arr)){

for(const key of Object.keys(race)){

if(Array.isArray(race[key])){

const a=race[key];

if(

a.length>=6 &&

a.some(x=>typeof x==="object")

){

arr=a;

break;

}

}

}

}

if(!Array.isArray(arr))return [];

return arr

.slice(0,6)

.map((r,i)=>normalizeRacer(r,i));

}

async function getRace(){

const stadiumNo=Number(stadium.value);

const raceNo=

Number(document.getElementById("raceNo").value);

const date=todayJP();

const urls=[

`${API_V3}/${date}/${stadiumNo}`,

`${API_V3}/${date}`,

`${API_V3}`

];

for(const url of urls){

try{

const data=await fetchJSON(url);

const race=

findRace(data,stadiumNo,raceNo);

if(race){

usedApi="V3";

return race;

}

}catch(e){}

}

const urls2=[

`${API_V2}/${date}/${stadiumNo}`,

`${API_V2}/${date}`,

`${API_V2}`

];

for(const url of urls2){

try{

const data=await fetchJSON(url);

const race=

findRace(data,stadiumNo,raceNo);

if(race){

usedApi="V2";

return race;

}

}catch(e){}

}

throw new Error(

"V3/V2の両APIから該当レースを取得できませんでした。"

);

}

/* =========================

   レース取得

========================= */

async function loadRace(){

const btn=document.querySelector(".mainBtn");

btn.disabled=true;

setStatus(

"出走表を取得中...\nV3 → V2 の順で確認しています。"

);

document

.getElementById("resultArea")

.classList.add("hidden");

try{

raceData=await getRace();

racers=extractRacers(raceData);

if(racers.length<6){

throw new Error(

"選手データを6艇取得できませんでした。"

);

}

racers.forEach((r,i)=>{

r.course=i+1;

});

entryOrder=[1,2,3,4,5,6];

renderEntryButtons();

renderRace();

document

.getElementById("raceArea")

.classList.remove("hidden");

setStatus(

"出走表取得成功！\nAI解析開始ボタンを押してください。"

);

}catch(e){

console.error(e);

setStatus(

"❌ 出走表取得失敗\n\n"+e.message

);

}finally{

btn.disabled=false;

}

}

/* =========================

   表示

========================= */

function renderRace(){

const sName=

stadium.options[

stadium.selectedIndex

].textContent;

const raceNo=

document.getElementById("raceNo").value;

document.getElementById("raceTitle")

.textContent=

`${sName} ${raceNo}R`;

document.getElementById("raceMeta")

.innerHTML=

`<span class="badge">API ${usedApi}</span>

<span class="badge">${todayJP()}</span>`;

renderRacers();

document.getElementById("apiInfo")

.innerHTML=

`使用API：${usedApi}<br>

日付：${todayJP()}<br>

場番号：${stadium.value}<br>

レース：${raceNo}R<br>

選手数：${racers.length}艇`;

}

function renderRacers(){

const area=document.getElementById("racers");

area.innerHTML="";

racers.forEach((r,i)=>{

const p=r.pastStats;

const div=document.createElement("div");

div.className="racer";

let pastHtml="";

if(r.past10.length){

pastHtml=`

<div class="past10">

<div class="pastTitle">

過去${r.past10.length}走

</div>

/* =========================

   AIスコア

========================= */

function courseBonus(course){

return{

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

}[course]||0;

}

function rankBonus(rank){

const r=String(rank).toUpperCase();

if(r==="A1")return 5;

if(r==="A2")return 2;

if(r==="B1")return 0;

if(r==="B2")return -2;

return 0;

}

function calcScore(r){

/*

ベース評価

*/

let score=0;

/*

全国・当地

*/

score+=r.national*7;

score+=r.local*4;

/*

モーター

*/

score+=r.motor2*0.15;

/*

ST

*/

if(r.st>0){

score+=

Math.max(0,0.30-r.st)*20;

}

/*

コース

*/

score+=courseBonus(r.course);

/*

級別

*/

score+=rankBonus(r.rank);

/*

展示

*/

if(r.exhibition>0){

if(r.exhibition<=6.70){

score+=3;

}else if(r.exhibition<=6.80){

score+=1;

}else if(r.exhibition>=7.00){

score-=2;

}

}

/*

=========================

過去10走を本格反映

=========================

過去10走のスコアは0〜100。

全体スコアに対して

「20%相当」を反映する。

*/

if(r.pastStats.count>0){

const pastContribution=

r.pastStats.score*0.20;

score+=pastContribution;

/*

直近上昇傾向を追加評価

*/

if(r.pastStats.trend>0.5){

score+=3;

}else if(r.pastStats.trend>0.2){

score+=1.5;

}else if(r.pastStats.trend<-0.5){

score-=3;

}else if(r.pastStats.trend<-0.2){

score-=1.5;

}

}

/*

=========================

今節成績

=========================

*/

if(r.currentStats.count>0){

score+=

r.currentStats.score*0.15;

}

/*

前付け補正

*/

if(entryOrder[0]!==1){

if(r.course===entryOrder[0]){

score+=3;

}

if(r.course===1){

score-=2;

}

}

return Math.round(score*10)/10;

}

function analyzeRace(){

racers.forEach(r=>{

r.score=calcScore(r);

});

}

/*

同点なら

過去10走 → モーター → 全国勝率

の順で優先

*/

function getOrdered(){

return[...racers].sort((a,b)=>{

if(b.score!==a.score){

return b.score-a.score;

}

if(b.pastStats.score!==a.pastStats.score){

return b.pastStats.score-a.pastStats.score;

}

if(b.motor2!==a.motor2){

return b.motor2-a.motor2;

}

return b.national-a.national;

});

}

function getBoat(n){

return racers.find(

r=>r.course===n

);

}

/* =========================

   買い目

========================= */

function uniquePush(arr,value){

if(!arr.includes(value)){

arr.push(value);

}

}

function makeCombinations(){

const sorted=getOrdered();

const top=sorted.slice(0,5);

const first=top[0];

const second=top[1];

const third=top[2];

const fourth=top[3];

const fifth=top[4];

const hit=[];

const roi=[];

const hole=[];

/*

的中率重視

*/

if(first&&second&&third){

uniquePush(

hit,

`${first.course}-${second.course}-${third.course}`

);

}

if(first&&third&&second){

uniquePush(

hit,

`${first.course}-${third.course}-${second.course}`

);

}

if(first&&second&&fourth){

uniquePush(

hit,

`${first.course}-${second.course}-${fourth.course}`

);

}

if(first&&third&&fourth){

uniquePush(

hit,

`${first.course}-${third.course}-${fourth.course}`

);

}

/*

回収率重視

上位評価を必ず残しながら

組み合わせを広げる

*/

for(const a of top){

for(const b of top){

for(const c of top){

if(

a===b ||

a===c ||

b===c

)continue;

const combo=

`${a.course}-${b.course}-${c.course}`;

if(

!roi.includes(combo) &&

roi.length<8

){

roi.push(combo);

}

}

}

}

/*

穴

評価4〜6位を絡める

ただし完全な人気薄だけではなく

AI評価上位との組み合わせ

*/

const holeCandidates=

sorted.slice(3,6);

for(const h of holeCandidates){

if(first&&second){

uniquePush(

hole,

`${first.course}-${second.course}-${h.course}`

);

uniquePush(

hole,

`${first.course}-${h.course}-${second.course}`

);

}

if(hole.length>=4)break;

}

return{

hit,

roi:roi.slice(0,8),

hole

};

}

/* =========================

   HTML安全化

========================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
