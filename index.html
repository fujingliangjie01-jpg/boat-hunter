<style>

*{box-sizing:border-box}

body{

 margin:0;

 background:#080808;

 color:#fff;

 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

header{

.logo{

select,input{

}

.entry-clear{

 color:#fff

}

.analyze-btn{

}

.row{

 justify-content:space-between;

 gap:10px;

 padding:12px 0;

 border-bottom:1px solid #292929

}

.row:last-child{

 border-bottom:none

}

.left{

}

.right{

}

.gold{color:#d4af37}

.green{color:#65df8b}

.yellow{color:#ffd34d}

.red{color:#ff6b6b}

.rank{

 background:#0c0c0c;

 border:1px solid #292929;

 border-radius:10px;

 padding:14px;

 margin-bottom:9px

}

.rank-number{

 color:#d4af37;

 font-weight:900

}

.note{

 font-size:11px;

 color:#777;

 margin-top:7px;

 line-height:1.8

}

.warning{

 background:#211b08;

 border:1px solid #8d6c16;

 padding:15px;

 border-radius:10px;

 line-height:1.7

}

.ai-box{

 background:#0b0b0b;

 border:1px solid #3a3218;

 border-radius:10px;

 padding:15px;

 margin-bottom:10px

}

.score-bar{

 height:8px;

 background:#222;

 border-radius:10px;

 margin-top:8px;

 overflow:hidden

}

.score-fill{

 height:100%;

 background:#d4af37

}

.pick-box{

 background:#0b0b0b;

 border:1px solid #333;

 border-radius:10px;

 padding:14px;

 margin-top:10px

}

.pick-title{

 font-size:15px;

 font-weight:900;

 color:#d4af37

}

.pick-line{

 padding:10px 0;

 border-bottom:1px solid #222;

 font-size:18px;

 font-weight:900

}

.pick-money{

 font-size:12px;

 color:#888;

 margin-left:8px

}

.pick-main{

 color:#ffd34d

}

.pick-ai{

 color:#65df8b

}

.roi-main{

 border:1px solid #d4af37;

 box-shadow:0 0 12px rgba(212,175,55,.15)

}

.info-grid{

 display:grid;

 grid-template-columns:repeat(2,1fr);

 gap:8px;

 margin-top:10px

}

.info-item{

 background:#0b0b0b;

 border:1px solid #292929;

 border-radius:8px;

 padding:10px

}

.info-label{

 font-size:10px;

 color:#777

}

.info-value{

 font-size:16px;

 font-weight:900;

 margin-top:4px

}

.big-percent{

 font-size:30px;

 font-weight:900;

 margin-top:5px

}

.direction{

 padding:16px;

 border-radius:10px;

 margin-bottom:10px;

 background:#0b0b0b;

 border:1px solid #333

}

.attack{

 font-size:24px;

 font-weight:900;

 color:#ffd34d

}

.flow{

 line-height:2;

 font-size:14px

}

.lap-table{

 width:100%;

 border-collapse:collapse;

 margin-top:12px;

 font-size:12px

}

.lap-table th,

.lap-table td{

 border-bottom:1px solid #292929;

 padding:9px 5px;

 text-align:center

}

.lap-table th{

 color:#d4af37;

 font-size:11px

}

footer{

 text-align:center;

 color:#444;

 font-size:11px;

 padding:25px

}

@media(max-width:600px){

 .boats{

  grid-template-columns:repeat(3,1fr)

 }

 .logo{

  font-size:25px

 }

}

</style>

</head>

<script>

"use strict";

/* =========================================

   API

========================================= */

const API_URLS=[

"https://boatraceopenapi.github.io/api/v1/today.json",

"https://boatraceopenapi.github.io/programs/v3/today.json",

"https://boatraceopenapi.github.io/programs/v2/today.json"

];

let raceData=null;

let selectedEntry=[];

/* =========================================

   基本関数

========================================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function format(v){

 if(v===null||v===undefined||v==="")

  return "-";

 const n=Number(v);

 return Number.isFinite(n)

  ?n.toFixed(2)

  :String(v);

}

function escapeHtml(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(obj,keys){

 if(!obj)return null;

 for(const key of keys){

  if(

   obj[key]!==undefined&&

   obj[key]!==null&&

   obj[key]!==""

  )

   return obj[key];

 }

 return null;

}

function getRank(v){

 return {

 1:"A1",

 2:"A2",

 3:"B1",

 4:"B2"

 }[num(v)]||"-";

}

/* =========================================

   API取得

========================================= */

async function fetchJson(url){

 const r=await fetch(

  url+"?t="+Date.now(),

  {

   cache:"no-store",

   headers:{

    Accept:"application/json"

   }

  }

 );

 if(!r.ok)

  throw new Error("HTTP "+r.status);

 return await r.json();

}

function findRace(

 data,

 stadiumNumber,

 raceNumber

){

 if(!data)return null;

 if(

  data.programs&&

  data.programs.stadiums

 ){

  const s=

   data.programs.stadiums[

    String(stadiumNumber)

   ];

  if(s&&s.races){

   const r=

    s.races[String(raceNumber)];

   if(r)return r;

  }

 }

 let found=null;

 function walk(obj){

  if(

   found||

   !obj||

   typeof obj!=="object"

  )

   return;

  if(

   obj.stadium_number!==undefined&&

   num(obj.stadium_number)===stadiumNumber&&

   obj.race_number!==undefined&&

   num(obj.race_number)===raceNumber&&

   (obj.racers||obj.players)

  ){

   found=obj;

   return;

  }

  Object.keys(obj).forEach(k=>{

   if(!found)

    walk(obj[k]);

  });

 }

 walk(data);

 return found;

}

function getRacers(race){

 if(!race)return [];

 if(Array.isArray(race.racers))

  return race.racers;

 if(

  race.racers&&

  typeof race.racers==="object"

 )

  return Object.values(race.racers);

 if(Array.isArray(race.players))

  return race.players;

 if(

  race.players&&

  typeof race.players==="object"

 )

  return Object.values(race.players);

 return [];

}

function getBoatNumber(r){

 return num(

  r.entry_number??

  r.boat_number??

  r.course_number??

  r.number

 );

}

function getName(r){

 return r.name||

 r.racer_name||

 r.player_name||

 "選手名不明";

}

/* =========================================

   各種データ

========================================= */

function getOneLapTime(r){

 const v=firstValue(r,[

  "one_lap_time",

  "one_lap",

  "lap_time",

  "first_lap_time",

  "first_lap",

  "turn_time",

  "one_round_time",

  "one_round",

  "one_lap_time_sec",

  "one_round_time_sec",

  "1lap_time",

  "oneLapTime"

 ]);

 return num(v);

}

function getStartTiming(r){

 return num(

  firstValue(r,[

   "start_timing",

   "st",

   "average_start_timing",

   "start"

  ])

 );

}

function getCourseST(r,course){

 const keys=[

  `course${course}_start_timing`,

  `course_${course}_start_timing`,

  `course${course}_st`,

  `course_${course}_st`,

  `course${course}_average_start_timing`,

  `course_${course}_average_start_timing`,

  `st_course${course}`,

  `st_course_${course}`

 ];

 for(const k of keys){

  if(

   r[k]!==undefined&&

   r[k]!==null&&

   r[k]!==""

  )

   return num(r[k]);

 }

 if(Array.isArray(r.course_start_timing))

  return num(

   r.course_start_timing[course-1]

  );

 if(

  r.course_start_timing&&

  typeof r.course_start_timing==="object"

 )

  return num(

   r.course_start_timing[String(course)]

  );

 return 0;

}

function getStyle(r){

 const v=firstValue(r,[

  "winning_technique",

  "decision_technique",

  "technique",

  "last_decision",

  "winning_decision",

  "kimarite"

 ])||"";

 return String(v).toLowerCase();

}

/* =========================================

   決まり手

========================================= */

function attackStyleScore(r,type){

 const t=getStyle(r);

 if(type==="まくり"){

  return(

   t.includes("まくり")||

   t.includes("捲り")

  )?12:0;

 }

 if(type==="差し"){

  return(

   t.includes("差し")||

   t==="差"

  )?10:0;

 }

 if(type==="まくり差し"){

  return(

   t.includes("まくり差し")||

   t.includes("捲り差し")

  )?12:0;

 }

 return 0;

}

/* =========================================

   出走表

========================================= */

function displayRace(race){

 const box=

  document.getElementById("boats");

 box.innerHTML="";

 const racers=

  getRacers(race)

  .sort(

   (a,b)=>

    getBoatNumber(a)-

    getBoatNumber(b)

  );

 if(racers.length<6){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 6艇の選手データを取得できませんでした。

  <br><br>

  取得数：

  <strong>${racers.length}艇</strong>

  </div>

  `;

  return false;

 }

 racers.forEach(r=>{

  const d=

   document.createElement("div");

  d.className="boat";

  d.innerHTML=`

  <div class="boat-number">

  ${getBoatNumber(r)}

  </div>

  <div class="boat-name">

  ${escapeHtml(getName(r))}

  </div>

  <div class="boat-class">

  ${getRank(r.rank_number)}

  </div>

  <div class="metric">

  全国 ${format(r.national_win_rate)}

  </div>

  <div class="metric">

  当地 ${format(r.local_win_rate)}

  </div>

  <div class="metric">

  M${r.motor_number||"-"}

  </div>

  <div class="metric">

  M2連 ${format(r.motor_top_2_percent)}%

  </div>

  <div class="metric">

  M3連 ${format(r.motor_top_3_percent)}%

  </div>

  <div class="metric">

  ST ${format(r.average_start_timing)}

  </div>

  <div class="metric gold">

  一周 ${

   getOneLapTime(r)>0

   ?format(getOneLapTime(r))+"秒"

   :"-"

  }

  </div>

  `;

  box.appendChild(d);

 });

 return true;

}

/* =========================================

   直前情報

========================================= */

function displayPreview(race){

 const box=

  document.getElementById("previewInfo");

 const p=race.preview;

 if(!p){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 現在、直前情報は取得できません。

  </div>

  `;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

 <div class="info-item">

 <div class="info-label">

 風速

 </div>

 <div class="info-value">

 ${p.wind_speed??"-"}m

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">

 波高

 </div>

 <div class="info-value">

 ${p.wave_height??"-"}cm

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">

 気温

 </div>

 <div class="info-value">

 ${p.air_temperature??"-"}℃

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">

 水温

 </div>

 <div class="info-value">

 ${p.water_temperature??"-"}℃

 </div>

 </div>

 </div>

 `;

}

/* =========================================

   一周タイム

========================================= */

function displayLapTable(race){

 const box=

  document.getElementById("lapInfo");

 const racers=

  getRacers(race)

  .sort(

   (a,b)=>

    getBoatNumber(a)-

    getBoatNumber(b)

  );

 const valid=

  racers.filter(

   r=>getOneLapTime(r)>0

  );

 if(!valid.length){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 一周タイムデータなし

  </div>

  `;

  return;

 }

 const best=

  Math.min(

   ...valid.map(

    r=>getOneLapTime(r)

   )

  );

 let html=`

 <table class="lap-table">

 <thead>

 <tr>

 <th>艇</th>

 <th>選手</th>

 <th>一周</th>

 <th>最速差</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  const lap=

   getOneLapTime(r);

  html+=`

  <tr>

  <td>

  ${getBoatNumber(r)}号艇

  </td>

  <td>

  ${escapeHtml(getName(r))}

  </td>

  <td>

  ${lap>0?format(lap)+"秒":"-"}

  </td>

  <td>

  ${

   lap>0

   ?"+"+format(lap-best)+"秒"

   :"-"

  }

  </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 `;

 box.innerHTML=html;

}

/* =========================================

   出走表取得

========================================= */

async function loadRace(){

 const stadium=

  num(

   document.getElementById("venue").value

  );

 const raceNumber=

  num(

   document.getElementById("race").value

  );

 const status=

  document.getElementById("status");

 const btn=

  document.getElementById("loadButton");

 btn.disabled=true;

 btn.innerText="⏳ 取得中...";

 document

  .getElementById("result")

  .classList.add("hidden");

 let lastError=null;

 try{

  for(

   let i=0;

   i<API_URLS.length;

   i++

  ){

   try{

    status.innerHTML=

     `⏳ API ${i+1}/${API_URLS.length} を確認中...`;

    const data=

     await fetchJson(

      API_URLS[i]

     );

    const race=

     findRace(

      data,

      stadium,

      raceNumber

     );

    if(!race){

     lastError=

      new Error(

       "指定レースがありません"

      );

     continue;

    }

    const racers=

     getRacers(race);

    if(racers.length<6){

     lastError=

      new Error(

       "6艇のデータがありません"

      );

     continue;

    }

    raceData=race;

    selectedEntry=[];

    displayRace(race);

    displayPreview(race);

    displayLapTable(race);

    createEntryButtons();

    document

     .getElementById("result")

     .classList.remove("hidden");

    status.innerHTML=

     "✅ 出走表取得成功";

    document

     .getElementById("apiInfo")

     .innerHTML=`

     取得元：

     <strong>

     ${escapeHtml(API_URLS[i])}

     </strong>

     <br>

     会場番号：

     ${stadium}

     <br>

     レース：

     ${raceNumber}R

     <br>

     選手：

     ${racers.length}名

     `;

    btn.disabled=false;

    btn.innerText="🔥 出走表を取得";

    return;

   }catch(e){

    lastError=e;

   }

  }

  throw(

   lastError||

   new Error("API取得失敗")

  );

 }catch(e){

  status.innerHTML=`

  <span class="red">

/* =========================================

   選手能力

========================================= */

function abilityScore(r,course){

 let s=0;

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const motor2=

  num(r.motor_top_2_percent);

 const motor3=

  num(r.motor_top_3_percent);

 const st=

  num(r.average_start_timing);

 const courseST=

  getCourseST(r,course);

 const rank=

  num(r.rank_number);

 const lap=

  getOneLapTime(r);

 s+=national*6;

 s+=local*3;

 s+=motor2*.22;

 s+=motor3*.08;

 if(st>0){

  s+=

   Math.max(

    0,

    .30-st

   )*20;

 }

 if(courseST>0){

  s+=

   Math.max(

    0,

    .30-courseST

   )*18;

 }

 if(lap>0){

  const laps=

   getRacers(raceData)

   .map(x=>getOneLapTime(x))

   .filter(x=>x>0);

  if(laps.length){

   const best=

    Math.min(...laps);

   s+=

    Math.max(

     0,

     5-(lap-best)*25

    );

  }

 }

 const courseBonus={

 1:10,

 2:5,

 3:4,

 4:3,

 5:1,

 6:0

 };

 s+=

  courseBonus[course]||0;

 if(rank===1)s+=4;

 if(rank===2)s+=2;

 if(rank===4)s-=2;

 return s;

}

/* =========================================

   攻め手判定

========================================= */

function getAttackCandidates(){

 const racers=

  getRacers(raceData);

 return racers

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   selectedEntry.indexOf(boat)+1;

  const st=

   num(r.average_start_timing);

  const cst=

   getCourseST(r,course);

  const motor2=

   num(r.motor_top_2_percent);

  const motor3=

   num(r.motor_top_3_percent);

  const maekiri=

   attackStyleScore(

    r,

    "まくり"

   );

  const sash=

   attackStyleScore(

    r,

    "差し"

   );

  const mds=

   attackStyleScore(

    r,

    "まくり差し"

   );

  let attack=0;

  let style="";

  const effectiveST=

   cst>0?cst:st;

  if(effectiveST>0){

   attack+=

    Math.max(

     0,

     .20-effectiveST

    )*45;

  }

  attack+=

   Math.max(

    0,

    motor2-30

   )*.12;

  attack+=

   Math.max(

    0,

    motor3-50

   )*.04;

  if(maekiri>0){

   attack+=maekiri;

   style="まくり";

  }

  if(

   mds>0&&

   mds>maekiri

  ){

   attack+=mds;

   style="まくり差し";

  }

  if(

   sash>0&&

   course<=3

  ){

   attack+=sash*.7;

   if(!style)

    style="差し";

  }

  if(course===2)

   attack+=2;

  if(course>=4)

   attack+=3;

  return{

   boat,

   course,

   racer:r,

   attack,

   style,

   st:effectiveST,

   motor2,

   motor3

  };

 })

 .sort(

  (a,b)=>

   b.attack-a.attack

 );

}

/* =========================================

   イン逃げ期待度

========================================= */

function calculateRaceTrend(){

 const racers=

  getRacers(raceData);

 const insideBoat=

  selectedEntry[0];

 const one=

  racers.find(

   r=>

    getBoatNumber(r)===

    insideBoat

  );

 if(!one){

  return{

   inside:50,

   outside:50

  };

 }

 const course1=1;

 let inside=55;

 const national=

  num(one.national_win_rate);

 const local=

  num(one.local_win_rate);

 const motor2=

  num(one.motor_top_2_percent);

 const motor3=

  num(one.motor_top_3_percent);

 const st=

  num(one.average_start_timing);

 const cst=

  getCourseST(one,course1);

 /* 選手 */

 if(national>=6.5)

  inside+=5;

 else if(national<5.5)

  inside-=5;

 /* 当地 */

 if(local>=6.5)

  inside+=4;

 else if(local<5.5)

  inside-=4;

 /* モーター */

 if(motor2>=40)

  inside+=5;

 else if(motor2<30)

  inside-=5;

 if(motor3>=60)

  inside+=3;

 else if(motor3<45)

  inside-=3;

 /* ST */

 if(st>0){

  if(st<=.15)

   inside+=6;

  else if(st>=.20)

   inside-=7;

 }

 /* コースST */

 if(cst>0){

  if(cst<=.15)

   inside+=7;

  else if(cst>=.20)

   inside-=8;

 }

 /* 攻め手 */

 const attacks=

  getAttackCandidates();

 const outsideAttack=

  attacks.find(

   x=>x.course>=2

  );

 if(outsideAttack){

  if(

   outsideAttack.attack>=16

  )

   inside-=12;

  if(

   outsideAttack.st>0&&

   outsideAttack.st<=.15

  )

   inside-=6;

 }

 /* 水面 */

 const p=

  raceData?.preview;

 if(p){

  const wind=

   num(p.wind_speed);

  const wave=

   num(p.wave_height);

  if(wind>=5)

   inside-=3;

  if(wave>=4)

   inside-=3;

 }

 inside=

  Math.max(

   5,

   Math.min(

    95,

    Math.round(inside)

   )

  );

 return{

  inside,

  outside:

   100-inside,

  reason:

   inside>=70

   ?"イン逃げ中心"

   :

   inside>=50

   ?"ややイン有利"

   :

   inside>=30

   ?"イン以外も十分"

   :

   "イン逃げしにくい"

 };

}

function buildRanking(dev){

 return getRacers(raceData)

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   selectedEntry.indexOf(boat)+1;

  let score=

   abilityScore(

    r,

    course

   );

  /* 展開補正 */

  if(

   dev.type==="イン逃げ"

  ){

   if(

    boat===

    selectedEntry[0]

   )

    score+=8;

   if(course===2)

    score+=4;

   if(course===3)

    score+=3;

  }else{

   if(

    boat===

    dev.attacker

   )

    score+=8;

   /*

    攻め手だから

    無条件で1位にはしない

   */

   if(

    dev.type==="まくり"&&

    course>=4

   )

    score+=3;

   if(

    dev.type==="差し"&&

    course===2

   )

    score+=3;

   if(

    dev.type==="まくり差し"&&

    course>=3

   )

    score+=3;

  }

  return{

   number:boat,

   name:getName(r),

   racer:r,

   score

  };

 })

 .sort(

  (a,b)=>

   b.score-a.score

 );

}

/* =========================================

   攻めた後のチャンス

========================================= */

function getAfterAttackCandidates(

 dev,

 ranking

){

 if(

  dev.type==="イン逃げ"

 )

  return [];

 const attacker=

  dev.attacker;

 const attackerCourse=

  selectedEntry.indexOf(

   attacker

  )+1;

 return ranking

 .filter(

  x=>x.number!==attacker

 )

 .map(x=>{

  const c=

   selectedEntry.indexOf(

    x.number

   )+1;

  let s=x.score;

  if(dev.type==="まくり"){

   if(c>attackerCourse)

    s+=10;

   if(

    c===

    attackerCourse+1

   )

    s+=5;

  }

  if(dev.type==="差し"){

   if(c===1)

    s+=9;

   if(c===3)

    s+=5;

  }

  if(

   dev.type==="まくり差し"

  ){

   if(c===1)

    s+=7;

   if(c===4)

    s+=6;

   if(c===5)

    s+=4;

  }

  return{

   ...x,

   afterScore:s

  };

 })

 .sort(

  (a,b)=>

   b.afterScore-a.afterScore

 )

 .slice(0,3);

}

/* =========================================

   買い目重複防止

========================================= */

function uniquePush(

 arr,

 pick

){

 const a=

  pick.split("-");

 if(

  a.length===3&&

  new Set(a).size===3&&

  a.every(

   x=>

    Number(x)>=1&&

    Number(x)<=6

  )&&

  !arr.includes(pick)

 ){

  arr.push(pick);

 }

}

   は展開を拾う候補。

   </div>

   </div>

   `

   :""

  }

  <div class="ai-box">

  <strong>

  🌊 展開の流れ

  </strong>

  <div class="flow">

  ${

   dev.type==="イン逃げ"

   ?

   `

   1号艇が先マイ

   <br>↓

   2・3号艇が相手

   <br>↓

   外枠は展開待ち

   `

   :

   `

   ${dev.attacker}号艇が攻める

   <br>↓

   内側艇が残す可能性

   <br>↓

   ${

    after.length

    ?after[0].number+"号艇が展開を拾う"

    :"後続艇へ展開"

   }

   `

  }

  </div>

  </div>

  `;

 /* =====================================

    ランキング

 ===================================== */

 let rankHtml="";

 ranking.forEach(

  (r,i)=>{

   rankHtml+=`

   <div class="rank">

   <div class="rank-number">

   ${i+1}位

   </div>

   <strong>

   ${r.number}号艇　

   ${escapeHtml(r.name)}

   </strong>

   <div class="pick">

   ${Math.round(r.score)} pt

   </div>

   <div class="score-bar">

   <div

    class="score-fill"

    style="width:${Math.min(

     100,

     Math.max(

      5,

      r.score

     )

    )}%"

   ></div>

   </div>

   </div>

   `;

  }

 );

 document

  .getElementById(

   "ranking"

  )

  .innerHTML=

  rankHtml;

 /* =====================================

    最終評価

 ===================================== */

 const main=

  ranking[0];

 const second=

  ranking[1];

 let hole=

  ranking.find(

   r=>

    r.number!==main.number&&

    r.number!==second.number

  );

 if(

  dev.type!=="イン逃げ"

 ){

  const ar=

   ranking.find(

    r=>

     r.number===

     dev.attacker

   );

  if(ar)

   hole=ar;

 }

 document

  .getElementById(

   "final"

  )

  .innerHTML=`

  <div class="row">

  <span class="left">

  本命

  </span>

  <span class="right gold">

  ${main.number}号艇

  ${escapeHtml(main.name)}

  </span>

  </div>

  <div class="row">

  <span class="left">

  対抗

  </span>

  <span class="right">

  ${second.number}号艇

  ${escapeHtml(second.name)}

  </span>

  </div>

  <div class="row">

  <span class="left">

  穴・攻め手

  </span>

  <span class="right yellow">

  ${hole.number}号艇

  ${escapeHtml(hole.name)}

  </span>

  </div>

  <div class="row">

  <span class="left">

  AI展開

  </span>

  <span class="right gold">

  ${

   dev.type==="イン逃げ"

   ?"イン逃げ"

   :dev.attacker+"号艇 "+dev.type

  }

  </span>

  </div>

  <div class="row">

  <span class="left">

  イン逃げ期待度

  </span>

  <span class="right ${insideClass}">

  ${trend.inside}%

  </span>

  </div>

  <div class="row">

  <span class="left">

  イン以外期待度

  </span>

  <span class="right red">

  ${trend.outside}%

  </span>

  </div>

  `;

 /* 買い目 */

 createPicks(

  ranking,

  dev,

  trend

 );

}

/* =========================================

   起動

========================================= */

document.addEventListener(

 "DOMContentLoaded",

 ()=>{

  document

   .getElementById(

    "loadButton"

   )

   .onclick=

   loadRace;

  document

   .getElementById(

    "clearButton"

   )

   .onclick=

   clearEntry;

  document

   .getElementById(

    "analyzeButton"

   )

   .onclick=

   ()=>{

    if(!raceData){

     alert(

      "先に出走表を取得してください。"

     );

     return;

    }

    if(

     selectedEntry.length!==6

    ){

     alert(

      "6艇すべての進入を入力してください。"

     );

     return;

    }

    showAnalysis();

   };

 }

);

</script>

</body>

</html>
