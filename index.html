<script>

"use strict";

/* =========================================================

   BOAT HUNTER NEW ENGINE

========================================================= */

const API_URL =

"https://boatraceopenapi.github.io/api/v1/today.json";

/*

 過去傾向取得日数

 30日だと通信量がかなり増えるため、

 まず21日分を使用。

 結果APIがある日のみ集計。

*/

const HISTORY_DAYS=21;

let raceData=null;

let selectedEntry=[];

let historyData=[];

let playerHistory={};

let venueHistory={};

/* =========================================================

   基本

========================================================= */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)

 ?n.toFixed(d)

 :"-";

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

function getRank(v){

 return {

 1:"A1",

 2:"A2",

 3:"B1",

 4:"B2"

 }[num(v)]||"-";

}

function sleep(ms){

 return new Promise(

  resolve=>setTimeout(resolve,ms)

 );

}

/* =========================================================

   API

========================================================= */

async function fetchJson(url){

 const response=

 await fetch(

  url+

  (url.includes("?")?"&":"?")+

  "t="+Date.now(),

  {

   method:"GET",

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

function findRace(data,stadium,race){

 if(!data)return null;

 try{

  const direct=

   data?.programs

    ?.stadiums

    ?.[String(stadium)]

    ?.races

    ?.[String(race)];

  if(direct)return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)return;

  if(typeof o!=="object")return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* =========================================================

   レーサー

========================================================= */

function getRacers(race){

 const racers=race?.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const racers=

  race?.preview?.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getResultRacers(race){

 const racers=

  race?.result?.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function boatNo(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number

 );

}

function racerName(r){

 return(

  r?.name ||

  r?.racer_name ||

  "選手名不明"

 );

}

function racerNumber(r){

 return num(

  r?.number ??

  r?.racer_number ??

  r?.registration_number

 );

}

function previewFor(r){

 return getPreviewRacers(raceData)

 .find(

  x=>boatNo(x)===boatNo(r)

 )||{};

}

function getST(r){

 return num(

  firstValue(

   r,

   [

    "start_timing",

    "st"

   ]

  )

 );

}

function getExhibition(r){

 return num(

  firstValue(

   r,

   [

    "exhibition_time",

    "display_time"

   ]

  )

 );

}

function getCourse(r){

 return num(

  firstValue(

   r,

   [

    "course_number",

    "course"

   ]

  )

 );

}

/* =========================================================

   決まり手番号

========================================================= */

/*

 APIのresult.technique_numberを

 BOAT HUNTER内の名称に変換。

 1 逃げ

 2 差し

 3 まくり

 4 まくり差し

 5 抜き

 6 恵まれ

 不明な値はその他。

*/

const TECHNIQUES={

 1:"逃げ",

 2:"差し",

 3:"まくり",

 4:"まくり差し",

 5:"抜き",

 6:"恵まれ"

};

function techniqueName(n){

 return TECHNIQUES[num(n)]||"その他";

}

/* =========================================================

   出走表

========================================================= */

function displayRace(){

 const box=

  document.getElementById("boats");

 box.innerHTML="";

 const racers=

  getRacers(raceData)

  .sort(

   (a,b)=>boatNo(a)-boatNo(b)

  );

 if(racers.length<6){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 6艇の出走表を取得できません。

   </div>

  `;

  return false;

 }

 racers.forEach(r=>{

  const p=previewFor(r);

  const st=getST(p);

  const ex=getExhibition(p);

  const div=

   document.createElement("div");

  div.className="boat";

  div.innerHTML=`

   <div class="boat-number">

    ${boatNo(r)}

   </div>

   <div class="boat-name">

    ${esc(racerName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${fmt(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${fmt(r.local_win_rate)}

   </div>

   <div class="metric">

    M${r.motor_number||"-"}

   </div>

   <div class="metric">

    M2連 ${fmt(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${fmt(r.motor_top_3_percent)}%

   </div>

   <div class="metric st">

    ST ${st>0?fmt(st):"-"}

   </div>

   <div class="metric exhibition">

    展示 ${ex>0?fmt(ex):"-"}

   </div>

  `;

  box.appendChild(div);

 });

 return true;

}

/* =========================================================

   直前

========================================================= */

function displayPreview(){

 const box=

  document.getElementById(

   "previewInfo"

  );

 const p=raceData?.preview;

 if(!p){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 直前情報なし

   </div>

  `;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">風向番号</div>

   <div class="info-value">

    ${p.wind_direction_number??"-"}

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* =========================================================

   展示

========================================================= */

function displayPreviewRacers(){

 const box=

  document.getElementById(

   "previewRacers"

  );

 const racers=

  getPreviewRacers(raceData)

  .sort(

   (a,b)=>boatNo(a)-boatNo(b)

  );

 if(!racers.length){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 展示・ST・直前進入データなし

   </div>

  `;

  return;

 }

 let html=`

 <table class="table">

 <thead>

 <tr>

  <th>艇</th>

  <th>進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  html+=`

  <tr>

   <td>

    ${boatNo(r)}号艇

   </td>

   <td class="gold">

    ${

     getCourse(r)>0

     ?getCourse(r)+"コース"

     :"－"

    }

   </td>

   <td class="orange">

    ${

     getST(r)>0

     ?fmt(getST(r))

     :"－"

    }

function dateStringOffset(daysAgo){

 const d=new Date();

 d.setHours(12,0,0,0);

 d.setDate(

  d.getDate()-daysAgo

 );

 const y=d.getFullYear();

 const m=

  String(d.getMonth()+1)

  .padStart(2,"0");

 const day=

  String(d.getDate())

  .padStart(2,"0");

 return{

  year:y,

  date:`${y}${m}${day}`

 };

}

/*

  過去データは全部同時取得せず、

  4件ずつ取得してブラウザ負荷を抑える。

*/

async function loadHistory(){

 const history=[];

 const status=

  document.getElementById(

   "status"

  );

 for(

  let start=1;

  start<=HISTORY_DAYS;

  start+=4

 ){

  const jobs=[];

  for(

   let i=start;

   i<start+4 &&

   i<=HISTORY_DAYS;

   i++

  ){

   const d=

    dateStringOffset(i);

   const url=

    `https://boatraceopenapi.github.io/api/v1/${d.year}/${d.date}.json`;

   jobs.push(

    fetchJson(url)

    .then(data=>({

     ok:true,

     data

    }))

    .catch(()=>({

     ok:false

    }))

   );

  }

  const results=

   await Promise.all(jobs);

  results.forEach(x=>{

   if(x.ok&&x.data)

    history.push(x.data);

  });

  status.innerHTML=

   `⏳ 過去データ分析中... ${Math.min(start+3,HISTORY_DAYS)}/${HISTORY_DAYS}日`;

 }

 return history;

}

 venue

 c.total++;

function analyzeHistory(){

 playerHistory={};

 venueHistory={};

 historyData.forEach(day=>{

  if(!day?.programs?.stadiums)

   return;

  Object.values(

   day.programs.stadiums

  ).forEach(stadium=>{

   const stadiumNo=

    num(stadium.stadium_number);

   if(!stadiumNo)

    return;

   if(!venueHistory[stadiumNo]){

    venueHistory[stadiumNo]={

     races:0,

     techniques:{

      逃げ:0,

      差し:0,

      まくり:0,

      まくり差し:0,

      抜き:0,

      恵まれ:0

     },

     insideLoss:{

      差し:0,

      まくり:0,

      まくり差し:0,

      抜き:0,

      恵まれ:0

     },

     insideTotal:0,

     insideWins:0

    };

   }

   const vh=

    venueHistory[stadiumNo];

   Object.values(

    stadium.races||{}

   ).forEach(race=>{

    const result=race?.result;

    if(!result)

     return;

    const rr=

     getResultRacers(race);

    if(rr.length<6)

     return;

    vh.races++;

    const technique=

     techniqueName(

      result.technique_number

     );

    if(

     vh.techniques[technique]!==undefined

    ){

     vh.techniques[technique]++;

    }

    const first=

     rr.find(

      r=>num(r.place_number)===1

     );

    if(first){

     const firstBoat=

      num(first.entry_number);

     if(firstBoat===1){

      vh.insideWins++;

      vh.insideTotal++;

     }else{

      vh.insideTotal++;

      if(

       vh.insideLoss[technique]!==undefined

      ){

       vh.insideLoss[technique]++;

      }

     }

    }

    /*

      過去出走選手の

      コース別決まり手を集計

    */

    rr.forEach(r=>{

     const course=

      num(r.course_number);

     const playerId=

      num(r.number);

     if(!course||!playerId)

      return;

     addPlayerHistory(

      {

       number:playerId,

       name:r.name||""

      },

      course,

      num(first?.entry_number)===1

       ?technique

       :(

        num(r.place_number)===1

        ?technique

        :""

       ),

      stadiumNo

     );

    });

   });

  });

 });

}

========================================================= */

function exhibitionDeltaScore(

 racer,

 course

){

 const p=

  previewFor(racer);

 const ex=

  getExhibition(p);

 if(ex<=0)

  return 0;

 const racers=

  getRacers(raceData);

 /*

  前の艇＝現在の進入コースの

  ひとつ前の艇

  1コースは比較なし

 */

 if(course<=1)

  return 0;

 const prevBoat=

  getEntry()[course-2];

 const prev=

  racers.find(

   r=>boatNo(r)===prevBoat

  );

 if(!prev)

  return 0;

 const prevEx=

  getExhibition(

   previewFor(prev)

  );

 if(prevEx<=0)

  return 0;

 const diff=

  prevEx-ex;

 if(diff>=0.15)

  return 12;

 if(diff>=0.10)

  return 8;

 if(diff>=0.08)

  return 5;

 return 0;

}

/* =========================================================

   AI選手特性

========================================================= */

function attackTypeScore(

 racer,

 course

){

 const feature=

  getPlayerCourseFeature(

   racer,

   course

  );

 if(!feature)

  return{

   total:0,

   details:[]

  };

 let total=0;

 const details=[];

 const wanted=

  course>=4

  ?[

   "まくり",

   "まくり差し",

   "差し"

  ]

  :[

   "差し",

   "まくり差し",

   "まくり"

  ];

 wanted.forEach(

  (type,index)=>{

   const item=

    feature.techniques

    .find(

     x=>x.name===type

    );

   if(!item)

    return;

   const weight=

    index===0?0.28:

    index===1?0.20:

    0.12;

   const add=

    item.percent*weight;

   total+=add;

   details.push({

    type,

    percent:item.percent,

    score:add

   });

  }

 );

 return{

  total,

  details

 };

}

function scenarioBase(){

 const entry=getEntry();

 const racers=

  getRacers(raceData);

 const inside=

  racers.find(

   r=>boatNo(r)===entry[0]

  );

 if(!inside)

  return{

   逃げ:50,

   差し:20,

   まくり:20,

   "まくり差し":10

  };

 let escape=52;

 let sash=20;

 let makuri=18;

 let makuriSashi=10;

 const insideFeature=

  getPlayerCourseFeature(

   inside,

   1

  );

 if(insideFeature){

  const escapeData=

   insideFeature.techniques

   .find(

    x=>x.name==="逃げ"

   );

  if(escapeData){

   escape+=

    (escapeData.percent-50)

    *.20;

  }

 }

 const venue=

  getVenueFeature();

 if(venue){

  escape+=

   (venue.insideRate-50)

   *.15;

 }

 racers.forEach(r=>{

  const boat=boatNo(r);

  const course=

   entry.indexOf(boat)+1;

  if(course<2)

   return;

  const attack=

   attackTypeScore(

    r,

    course

   );

  const p=

   previewFor(r);

  const st=

   getST(p);

  const ex=

   getExhibition(p);

  let attackPower=

   attack.total;

  /*

   展示タイム差

  */

  attackPower+=

   exhibitionDeltaScore(

    r,

    course

   );

  if(st>0){

   if(st<=.12)

    attackPower+=12;

   else if(st<=.15)

    attackPower+=8;

   else if(st<=.18)

    attackPower+=4;

  }

  const topType=

   attack.details[0]?.type;

  if(topType==="まくり")

   makuri+=attackPower*.025;

  if(topType==="差し")

   sash+=attackPower*.025;

  if(topType==="まくり差し")

   makuriSashi+=attackPower*.025;

 });

 /*

  1号艇の敗戦傾向を反映

 */

 const weak=

  getInsideWeakness();

 if(weak){

  weak.losses.forEach(x=>{

   const boost=

    x.percent*.08;

   if(x.name==="差し")

    sash+=boost;

   if(x.name==="まくり")

    makuri+=boost;

   if(x.name==="まくり差し")

    makuriSashi+=boost;

  });

 }

 /*

  逃げ率を最低限確保。

  全国平均50%超という考え方を

  ベースラインとして使用。

 */

 escape=

  Math.max(

   25,

   Math.min(80,escape)

  );

 const sum=

  escape+

  sash+

  makuri+

  makuriSashi;

 return{

  逃げ:escape/sum*100,

  差し:sash/sum*100,

  まくり:makuri/sum*100,

  "まくり差し":makuriSashi/sum*100

 };

}

  const ex=

   );

  const venueBonus=

   (

    venueAttackScore("まくり")+

    venueAttackScore("差し")+

    venueAttackScore("まくり差し")

   )*.10;

  let score=

   )[0];

   course,

   racer:r,

   score,

   type:

    top?.type||"攻め不明",

   percent:

    top?.percent||0,

   delta

  });

 });

 return result.sort(

  (a,b)=>b.score-a.score

 );

/* =========================================================

   AI基本評価

========================================================= */

function baseScore(

 r,

 course,

 scenarios

){

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const n2=

  num(r.national_top_2_percent);

 const n3=

  num(r.national_top_3_percent);

 const l2=

  num(r.local_top_2_percent);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=

  previewFor(r);

 const st=

  getST(p);

 const ex=

  getExhibition(p);

 let s=0;

 s+=national*5.5;

 s+=local*2.5;

 s+=n2*.08;

 s+=n3*.04;

 s+=l2*.04;

 s+=m2*.18;

 s+=m3*.07;

 if(st>0)

  s+=

   Math.max(

    0,

    .25-st

   )*24;

 if(ex>0)

  s+=

   Math.max(

    0,

    6.90-ex

   )*8;

 s+=({

  1:11,

  2:6,

  3:5,

  4:4,

  5:2,

  6:0

 }[course]||0);

 /*

  選手コース別決まり手

 */

 const attack=

  attackTypeScore(

   r,

   course

  );

 s+=attack.total*.65;

 /*

  場特性

 */

 s+=

  venueAttackScore(

   attack.details[0]?.type

  )*.35;

 /*

  展示タイム差

 */

 s+=

  exhibitionDeltaScore(

   r,

   course

  );

 const rank=

  num(r.rank_number);

 if(rank===1)s+=5;

 if(rank===2)s+=3;

 if(rank===4)s-=2;

 /*

  シナリオ適性

 */

 if(

  course===1 &&

  scenarios.逃げ>=55

 ){

  s+=8;

 }

 return s;

}

/* =========================================================

   買い目候補

========================================================= */

function comboValid(a,b,c){

 return(

  [a,b,c].every(

   x=>Number.isInteger(x)&&

   x>=1&&x<=6

  )&&

  a!==b&&

  a!==c&&

  b!==c

 );

}

function addCombo(

 arr,

 combo,

 reason,

 must=false

){

 if(

  !arr.some(

   x=>x.combo===combo

  )

 ){

  arr.push({

   combo,

   reason,

   must

  });

 }

}

/* =========================================================

   的中重視

========================================================= */

/*

 イン逃げなら

 1着＝1号艇

 2着＝

 AI評価

 展示

 場

 選手特性

 3着＝

 残った上位

 を優先。

 ただし1号艇が

 AI評価上位でなければ

 無理に1頭固定しない。

*/

function buildHit(rank){

 const scenarios=

  scenarioBase();

 const entry=getEntry();

 const arr=[];

 const top1=

  rank[0]?.boat;

 const top2=

  rank[1]?.boat;

 const top3=

  rank[2]?.boat;

 const insideBoat=

  entry[0];

 const likelyInside=

  scenarios.逃げ>=50;

 /*

  2着候補を作る

 */

 const secondCandidates=

  rank

  .filter(

   r=>r.boat!==insideBoat

  )

  .map(r=>{

   const attack=

    attackTypeScore(

     r.racer,

     r.course

    );

   let score=

    r.score;

   score+=

    attack.total*.8;

   score+=

    exhibitionDeltaScore(

     r.racer,

     r.course

    );

   return{

    ...r,

    candidateScore:score

   };

  })

  .sort(

   (a,b)=>

    b.candidateScore-

    a.candidateScore

  );

 const s1=

  secondCandidates[0]?.boat;

 const s2=

  secondCandidates[1]?.boat;

 const s3=

  secondCandidates[2]?.boat;

 /*

  イン逃げ本線

 */

 if(

  likelyInside &&

  insideBoat===1

 ){

  const third=

   [

    top2,

    top3,

    s1,

    s2,

    s3

   ]

   .filter(

    x=>

     x&&

     x!==1&&

     x!==s1

   );

  const t=

   [...new Set(third)];

  if(

   s1&&

   t[0]&&

   comboValid(1,s1,t[0])

  ){

   addCombo(

    arr,

    `1-${s1}-${t[0]}`,

    `イン逃げ${scenarios.逃げ.toFixed(1)}%＋2着候補${s1}＋AI上位`,

    true

   );

  }

  if(

   s2&&

   t[1]&&

   comboValid(1,s2,t[1])

  ){

   addCombo(

    arr,

    `1-${s2}-${t[1]}`,

    "イン逃げ＋展示・選手特性上位"

   );

  }

  if(

   s1&&

   t[1]&&

   comboValid(1,s1,t[1])

  ){

   addCombo(

    arr,

    `1-${s1}-${t[1]}`,

    "イン逃げ＋2着本線"

   );

  }

  if(

   s2&&

   t[0]&&

   comboValid(1,s2,t[0])

  ){

   addCombo(

    arr,

    `1-${s2}-${t[0]}`,

    "イン逃げ＋2着対抗"

   );

  }

  if(

   top2&&

   top3&&

   comboValid(1,top2,top3)

  ){

   addCombo(

    arr,

    `1-${top2}-${top3}`,

    "AI評価上位のイン逃げ"

   );

  }

  if(

   top3&&

   top2&&

   comboValid(1,top3,top2)

  ){

   addCombo(

    arr,

    `1-${top3}-${top2}`,

    "AI評価上位入替"

   );

  }

  if(

   arr.length<6 &&

   s3&&

   s1&&

   comboValid(1,s3,s1)

  ){

   addCombo(

    arr,

    `1-${s3}-${s1}`,

    "イン逃げ＋展開適性"

   );

  }

 }else{

  /*

   イン逃げが本線ではない場合も

   AI1位を尊重。

  */

  if(

   top1&&

   top2&&

   top3&&

   comboValid(top1,top2,top3)

  ){

   addCombo(

    arr,

    `${top1}-${top2}-${top3}`,

    "AI評価1位頭"

   );

  }

  if(

   top1&&

   top3&&

   top2&&

   comboValid(top1,top3,top2)

  ){

   addCombo(

    arr,

    `${top1}-${top3}-${top2}`,

    "AI評価1位頭＋入替"

   );

  }

 }

 return arr.slice(0,6);

}

/* =========================================================

   回収重視

========================================================= */

/*

 展開ごとに候補を作る。

 ①イン逃げ

 ②まくり

 ③差し

 ④まくり差し

 それぞれ

 1着候補

 2着候補

 3着候補

 を作る。

*/

function buildROI(rank){

 const scenarios=

  scenarioBase();

 const attacks=

  getAttackCandidates();

 const arr=[];

 const addScenario=

  (

   type,

   first,

   second,

   third,

   reason,

   must=false

  )=>{

   if(

    !first||

    !second||

    !third

   )

    return;

   if(

    !comboValid(

     first,

     second,

     third

    )

   )

    return;

   addCombo(

    arr,

    `${first}-${second}-${third}`,

    reason,

    must

   );

  };

 /*

  イン逃げ

 */

 if(scenarios.逃げ>=35){

  const first=1;

  const seconds=

   rank

   .filter(

    x=>x.boat!==1

   )

   .map(r=>{

    const attack=

     attackTypeScore(

      r.racer,

      r.course

     );

    return{

     ...r,

     score:

      r.score+

      attack.total*.9+

      exhibitionDeltaScore(

       r.racer,

       r.course

      )

    };

   })

   .sort(

    (a,b)=>b.score-a.score

   );

  const s1=

   seconds[0]?.boat;

  const s2=

   seconds[1]?.boat;

  const thirds=

   rank

   .map(x=>x.boat)

   .filter(

    x=>

     x!==1&&

     x!==s1&&

     x!==s2

   );

  addScenario(

   "逃げ",

   first,

   s1,

   thirds[0],

   `イン逃げ ${scenarios.逃げ.toFixed(1)}%：2着${s1}を重視`,

   scenarios.逃げ>=60

  );

  addScenario(

   "逃げ",

   first,

   s2,

   thirds[0],

   `イン逃げ：2着${s2}も警戒`

  );

  addScenario(

   "逃げ",

   first,

   s1,

   thirds[1],

   "イン逃げ＋3着穴展開"

  );

 }

 /*

  まくり

 */

 if(scenarios.まくり>=12){

  const candidates=

   attacks

   .filter(

    x=>x.type==="まくり"

   );

  candidates

   .slice(0,2)

   .forEach(

    a=>{

     const others=

      rank

      .filter(

       x=>x.boat!==a.boat

      );

     const s1=

      others[0]?.boat;

     const s2=

      others[1]?.boat;

     const s3=

      others[2]?.boat;

     addScenario(

      "まくり",

      a.boat,

      s1,

      s2,

      `まくり ${scenarios.まくり.toFixed(1)}%：${a.boat}号艇の${a.percent.toFixed(1)}%特性`

     );

     addScenario(

      "まくり",

      a.boat,

      s2,

      s1,

      `まくり：${a.boat}号艇頭＋2着${s2}`

     );

     if(

      s3

     ){

      addScenario(

       "まくり",

       a.boat,

       s1,

       s3,

       "まくり＋3着展開"

      );

     }

    }

   );

 }

 /*

  差し

 */

 if(scenarios.差し>=12){

  const candidates=

   attacks

   .filter(

    x=>x.type==="差し"

   );

  candidates

   .slice(0,2)

   .forEach(

    a=>{

     const others=

      rank

      .filter(

       x=>x.boat!==a.boat

      );

     addScenario(

      "差し",

      a.boat,

      others[0]?.boat,

      others[1]?.boat,

      `差し ${scenarios.差し.toFixed(1)}%：${a.boat}号艇の差し特性${a.percent.toFixed(1)}%`

     );

     addScenario(

      "差し",

      a.boat,

      others[1]?.boat,

      others[0]?.boat,

      "差し＋相手入替"

     );

    }

   );

 }

 /*

  まくり差し

 */

 if(scenarios["まくり差し"]>=8){

  const candidates=

   attacks

   .filter(

    x=>x.type==="まくり差し"

   );

  candidates

   .slice(0,2)

   .forEach(

    a=>{

     const others=

      rank

      .filter(

       x=>x.boat!==a.boat

      );

     addScenario(

      "まくり差し",

      a.boat,

      others[0]?.boat,

      others[1]?.boat,

      `まくり差し ${scenarios["まくり差し"].toFixed(1)}%：${a.boat}号艇の得意形`

     );

    }

   );

 }

 /*

  足りなければ

  AI上位を追加

 */

 for(

  const a of rank

 ){

  for(

   const b of rank

  ){

   for(

    const c of rank

   ){

    if(arr.length>=10)

     break;

    if(

     !comboValid(

      a.boat,

      b.boat,

      c.boat

     )

    )

     continue;

    addCombo(

     arr,

     `${a.boat}-${b.boat}-${c.boat}`,

     "AI評価・展開・機力補完"

    );

   }

   if(arr.length>=10)

    break;

  }

  if(arr.length>=10)

   break;

 }

 /*

  重要買い目を先頭へ

 */

 arr.sort(

  (a,b)=>

   Number(b.must)-

   Number(a.must)

 );

 return arr.slice(0,10);

}

/* =========================================================

   大穴

========================================================= */

function buildHole(

 rank,

 used

){

 const attacks=

  getAttackCandidates();

 const top=

  rank.slice(0,2)

  .map(x=>x.boat);

 const arr=[];

 const candidates=

  attacks

  .filter(

   x=>

    !top.includes(x.boat)

  )

  .slice(0,4);

 for(

  const a of candidates

 ){

  const others=

   rank

   .filter(

    x=>

     x.boat!==a.boat

   );

  for(

   const b of others

  ){

   for(

    const c of others

   ){

    if(arr.length>=3)

     break;

    if(

     !comboValid(

      a.boat,

      b.boat,

      c.boat

     )

    )

     continue;

    const combo=

     `${a.boat}-${b.boat}-${c.boat}`;

    if(

     used.includes(combo)

    )

     continue;

    addCombo(

     arr,

     combo,

     `${a.boat}号艇の${a.type} ${a.percent.toFixed(1)}%＋展開穴`

    );

   }

   if(arr.length>=3)

    break;

  }

  if(arr.length>=3)

   break;

 }

 return arr.slice(0,3);

}

/* =========================================================

   掛け金

========================================================= */

function makeMoney(

 picks,

 budget

){

 if(!picks.length)

  return[];

 const total=

  Math.max(

   100,

   Math.floor(

    num(budget)/100

   )*100

  );

 /*

  mustを厚く。

  通常：

  1.5

  must：

  2.5

 */

 let weights=

  picks.map(

   p=>

    p.must?2.5:1

  );

 const weightTotal=

  weights.reduce(

   (a,b)=>a+b,

   0

  );

 let money=

  weights.map(

   w=>

    Math.floor(

     total*w/

     weightTotal/

     100

    )*100

  );

 money=

  money.map(

   x=>Math.max(100,x)

  );

 let current=

  money.reduce(

   (a,b)=>a+b,

   0

  );

 while(

  current>total

 ){

  let index=-1;

  for(

   let i=money.length-1;

   i>=0;

   i--

  ){

   if(

    money[i]>100

   ){

    index=i;

    break;

   }

  }

  if(index<0)

   break;

  money[index]-=100;

  current-=100;

 }

 let i=0;

 while(

  current+100<=total

 ){

  money[i%money.length]+=100;

  current+=100;

  i++;

 }

 return money;

}
