<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{

box-sizing:border-box;

}

body{

margin:0;

background:#080808;

color:#fff;

font-family:

-apple-system,

BlinkMacSystemFont,

"Segoe UI",

sans-serif;

}

header{

background:#000;

border-bottom:1px solid #d4af37;

padding:22px 15px;

text-align:center;

}

.logo{

font-size:30px;

font-weight:900;

letter-spacing:4px;

color:#d4af37;

}

.tagline{

font-size:12px;

color:#888;

margin-top:6px;

}

.container{

max-width:900px;

margin:auto;

padding:18px;

}

.card{

background:#151515;

border:1px solid #292929;

border-radius:14px;

padding:18px;

margin-bottom:18px;

}

.title{

font-size:18px;

font-weight:900;

color:#d4af37;

margin-bottom:16px;

}

label{

display:block;

font-size:13px;

color:#999;

margin-bottom:6px;

}

select,

input{

width:100%;

padding:13px;

margin-bottom:15px;

border-radius:8px;

border:1px solid #444;

background:#0b0b0b;

color:#fff;

font-size:15px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:10px;

background:

linear-gradient(

135deg,

#d4af37,

#9b7418

);

color:#000;

font-size:16px;

font-weight:900;

cursor:pointer;

}

.status{

text-align:center;

color:#d4af37;

margin-top:12px;

font-size:13px;

}

.hidden{

display:none;

}

.boats{

display:grid;

grid-template-columns:

repeat(6,1fr);

gap:8px;

}

.boat{

background:#0d0d0d;

border:1px solid #333;

border-radius:10px;

padding:12px 5px;

text-align:center;

}

.boat-number{

font-size:23px;

font-weight:900;

}

.boat-name{

font-size:12px;

margin-top:6px;

}

.boat-class{

font-size:11px;

color:#d4af37;

margin-top:5px;

}

.metric{

font-size:10px;

color:#888;

margin-top:5px;

}

.entry-grid{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:8px;

}

.entry-btn{

background:#0d0d0d;

color:#fff;

border:1px solid #444;

border-radius:8px;

padding:14px 5px;

font-size:16px;

font-weight:900;

}

.entry-btn.selected{

background:#d4af37;

color:#000;

border-color:#d4af37;

}

.entry-result{

margin-top:15px;

background:#0b0b0b;

border:1px solid #333;

border-radius:10px;

padding:18px;

text-align:center;

font-size:28px;

font-weight:900;

color:#d4af37;

}

.entry-clear{

margin-top:10px;

background:#222;

color:#fff;

}

.row{

display:flex;

justify-content:space-between;

gap:10px;

padding:12px 0;

border-bottom:1px solid #292929;

}

.row:last-child{

border-bottom:none;

}

.left{

color:#999;

}

.right{

font-weight:900;

text-align:right;

}

.gold{

color:#d4af37;

}

.green{

color:#65df8b;

}

.red{

color:#ff6f61;

}

.yellow{

color:#ffd34d;

}

.rank{

background:#0c0c0c;

border:1px solid #292929;

border-radius:10px;

padding:14px;

margin-bottom:9px;

}

.pick{

font-size:24px;

font-weight:900;

color:#d4af37;

margin-top:8px;

}

.note{

font-size:11px;

color:#777;

margin-top:7px;

line-height:1.6;

}

.warning{

background:#211b08;

border:1px solid #8d6c16;

padding:15px;

border-radius:10px;

line-height:1.7;

}

.error{

background:#260d0d;

border:1px solid #8d3030;

padding:15px;

border-radius:10px;

color:#ff8c8c;

line-height:1.6;

}

@media(max-width:600px){

.boats{

grid-template-columns:

repeat(3,1fr);

}

.logo{

font-size:25px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

BOAT HUNTER

</div>

<div class="tagline">

人気ではなく期待値で勝つ

</div>

</header>

<main class="container">

<section class="card">

<div class="title">

🎯 レース選択

</div>

<label>

競艇場

</label>

<select id="venue">

<option value="1">桐生</option>

<option value="2">戸田</option>

<option value="3">江戸川</option>

<option value="4">平和島</option>

<option value="5">多摩川</option>

<option value="6">浜名湖</option>

<option value="7">蒲郡</option>

<option value="8">常滑</option>

<option value="9">津</option>

<option value="10">三国</option>

<option value="11">びわこ</option>

<option value="12">住之江</option>

<option value="13">尼崎</option>

<option value="14">鳴門</option>

<option value="15">丸亀</option>

<option value="16">児島</option>

<option value="17">宮島</option>

<option value="18">徳山</option>

<option value="19">下関</option>

<option value="20">若松</option>

<option value="21">芦屋</option>

<option value="22">福岡</option>

<option value="23">唐津</option>

<option value="24">大村</option>

</select>

<label>

レース

</label>

<select id="race">

<option value="1">1R</option>

<option value="2">2R</option>

<option value="3">3R</option>

<option value="4">4R</option>

<option value="5">5R</option>

<option value="6">6R</option>

<option value="7">7R</option>

<option value="8">8R</option>

<option value="9">9R</option>

<option value="10">10R</option>

<option value="11">11R</option>

<option value="12">12R</option>

</select>

<label>

予算

</label>

<input

id="budget"

type="number"

value="3000"

min="100"

step="100"

>

<button onclick="loadRace()">

🔥 出走表を取得

</button>

<div

id="status"

class="status">

</div>

</section>

<div

id="result"

class="hidden">

<section class="card">

<div class="title">

🚤 出走表

</div>

<div

id="boats"

class="boats">

</div>

</section>

<section class="card">

<div class="title">

🚦 本番進入を手動入力

</div>

<div class="warning">

展示やピット離れを見て、

<strong>

本番の進入コース順

</strong>

を入力してください。

<br><br>

前付けがあれば、

<strong>

6-1-2-3-4-5

</strong>

のように入力できます。

<br><br>

※同じ艇を2回選択することはできません。

</div>

<br>

<div

id="entryButtons"

class="entry-grid">

</div>

<div

id="entryResult"

class="entry-result">

進入を入力してください

</div>

<button

class="entry-clear"

onclick="clearEntry()">

↩ 進入をリセット

</button>

</section>

<section class="card">

<div class="title">

⚠️ 前付け解析

</div>

<div

id="maezuke">

<div class="note">

本番進入を入力すると、

前付けの有無を自動判定します。

</div>

</div>

</section>

<section class="card">

<div class="title">

📊 直前情報

</div>

<div

id="preview">

<div class="note">

直前情報を取得中...

</div>

</div>

</section>

<section class="card">

<div class="title">

🧠 展開予想

</div>

<div

id="development">

<div class="note">

進入を入力してください。

</div>

</div>

</section>

<section class="card">

<div class="title">

🏆 AI期待値ランキング

</div>

<div

id="ranking">

</div>

</section>

<section class="card">

<div class="title">

🎯 最終評価

</div>

<div

id="final">

</div>

</section>

<section class="card">

<div class="title">

💰 買い目

</div>

<div class="rank">

<strong>

的中率重視

</strong>

<div

id="hitPick"

class="pick">

-

</div>

<div

id="hitMoney"

class="note">

-

</div>

</div>

<div class="rank">

<strong>

回収率重視

</strong>

<div

id="roiPick"

class="pick">

-

</div>

<div

id="roiMoney"

class="note">

-

</div>

</div>

</section>

</div>

</main>

<footer>

BOAT HUNTER © 2026

</footer>

<script>

/*

========================================

設定

========================================

*/

const API_BASE =

"https://boatraceopenapi.github.io/api/v1";

const stadiumNames = {

1:"桐生",

2:"戸田",

3:"江戸川",

4:"平和島",

5:"多摩川",

6:"浜名湖",

7:"蒲郡",

8:"常滑",

9:"津",

10:"三国",

11:"びわこ",

12:"住之江",

13:"尼崎",

14:"鳴門",

15:"丸亀",

16:"児島",

17:"宮島",

18:"徳山",

19:"下関",

20:"若松",

21:"芦屋",

22:"福岡",

23:"唐津",

24:"大村"

};

let raceData = null;

let selectedEntry = [];

/*

========================================

今日の日付 JST

========================================

*/

function getJstDate(){

const now =

new Date();

const jst =

new Date(

now.toLocaleString(

"en-US",

{

timeZone:

"Asia/Tokyo"

}

)

);

const year =

jst.getFullYear();

const month =

String(

jst.getMonth()+1

).padStart(2,"0");

const day =

String(

jst.getDate()

).padStart(2,"0");

return {

year:year,

date:

year +

month +

day

};

}

/*

========================================

出走表取得

========================================

*/

async function loadRace(){

const stadium =

Number(

document.getElementById(

"venue"

).value

);

const raceNumber =

Number(

document.getElementById(

"race"

).value

);

const status =

document.getElementById(

"status"

);

status.innerText =

"⏳ 実データ取得中...";

document

.getElementById(

"result"

)

.classList.add(

"hidden"

);

try{

const date =

getJstDate();

const url =

API_BASE +

"/" +

date.year +

"/" +

date.date +

".json";

console.log(

"API:",

url

);

const response =

await fetch(

url,

{

cache:"no-store"

}

);

if(!response.ok){

throw new Error(

"API HTTP " +

response.status

);

}

const data =

await response.json();

/*

正式なv1構造

programs

 ↓

stadiums

 ↓

stadium番号

 ↓

races

 ↓

race番号

*/

const race =

data

?.programs

?.stadiums

?.[String(stadium)]

?.races

?.[String(raceNumber)];

if(!race){

throw new Error(

"指定したレースのデータがありません"

);

}

raceData =

race;

displayRace(

race

);

createEntryButtons();

displayPreview(

race

);

document

.getElementById(

"result"

)

.classList.remove(

"hidden"

);

status.innerText =

"✅ 実データ取得完了";

}

catch(error){

console.error(

error

);

status.innerText =

"❌ " +

error.message;

}

}

/*

========================================

出走表表示

========================================

*/

function displayRace(

race

){

const boats =

document.getElementById(

"boats"

);

boats.innerHTML =

"";

const racers =

race.racers ||

{};

Object

.keys(racers)

.sort(

(a,b)=>

Number(a)-Number(b)

)

.forEach(

function(key){

const racer =

racers[key];

const div =

document.createElement(

"div"

);

div.className =

"boat";

div.innerHTML = `

<div class="boat-number">

${racer.entry_number}

</div>

<div class="boat-name">

${escapeHtml(

racer.name

)}

</div>

<div class="boat-class">

${getRank(

racer.rank_number

)}

</div>

<div class="metric">

全国 ${format(

racer.national_win_rate

)}

</div>

<div class="metric">

当地 ${format(

racer.local_win_rate

)}

</div>

<div class="metric">

M${racer.motor_number}

</div>

`;

boats.appendChild(

div

);

});

}

/*

========================================

級別

========================================

*/

function getRank(

rank

){

const map = {

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

return map[rank] || "-";

}

/*

========================================

数値表示

========================================

*/

function format(

value

){

if(

value === null ||

value === undefined

){

return "-";

}

return Number(

value

).toFixed(2);

}

/*

========================================

直前情報

========================================

*/

function displayPreview(

race

){

const element =

document.getElementById(

"preview"

);

const preview =

race.preview;

if(

!preview ||

!preview.racers

){

element.innerHTML = `

<div class="note">

まだ直前情報がありません。

</div>

`;

return;

}

const racers =

preview.racers;

let html = "";

Object

.keys(racers)

.sort(

(a,b)=>

Number(a)-Number(b)

)

.forEach(

function(key){

const racer =

racers[key];

html += `

<div class="row">

<span class="left">

${racer.entry_number}号艇

</span>

<span class="right">

進入

${racer.course_number ?? "-"}

　

ST

${racer.start_timing ?? "-"}

　

展示

${racer.exhibition_time ?? "-"}

</span>

</div>

`;

});

element.innerHTML =

html;

}

/*

========================================

手動進入ボタン

========================================

*/

function createEntryButtons(){

const container =

document.getElementById(

"entryButtons"

);

container.innerHTML =

"";

for(

let i=1;

i<=6;

i++

){

const button =

document.createElement(

"button"

);

button.className =

"entry-btn";

button.innerText =

i +

"号艇";

button.onclick =

function(){

selectEntry(i);

};

container.appendChild(

button

);

}

}

/*

========================================

進入選択

========================================

*/

function selectEntry(

boat

){

if(

selectedEntry.includes(

boat

)

){

return;

}

if(

selectedEntry.length >= 6

){

return;

}

selectedEntry.push(

boat

);

updateEntryButtons();

document.getElementById(

"entryResult"

).innerText =

selectedEntry.join("-");

if(

selectedEntry.length === 6

){

analyzeEntry();

}

}

/*

========================================

ボタン状態

========================================

*/

function updateEntryButtons(){

const buttons =

document.querySelectorAll(

".entry-btn"

);

buttons.forEach(

function(

button,

index

){

const boat =

index+1;

if(

selectedEntry.includes(

boat

)

){

button.classList.add(

"selected"

);

}else{

button.classList.remove(

"selected"

);

}

});

}

/*

========================================

進入リセット

========================================

*/

function clearEntry(){

selectedEntry =

[];

updateEntryButtons();

document.getElementById(

"entryResult"

).innerText =

"進入を入力してください";

document.getElementById(

"maezuke"

).innerHTML = `

<div class="note">

本番進入を入力してください。

</div>

`;

document.getElementById(

"development"

).innerHTML = `

<div class="note">

進入を入力してください。

</div>

`;

document.getElementById(

"ranking"

).innerHTML =

"";

document.getElementById(

"final"

).innerHTML =

"";

}

/*

========================================

進入解析

========================================

*/

function analyzeEntry(){

const entry =

selectedEntry;

const original =

[1,2,3,4,5,6];

const outsideMoved =

entry.filter(

x =>

x > x

);

/*

前付け判定

1号艇以外が

1コースを取っている場合などを判定

*/

let maezuke = false;

let maezukeBoat = null;

if(

entry[0] !== 1

){

maezuke = true;

maezukeBoat =

entry[0];

}

/*

表示

*/

document.getElementById(

"maezuke"

).innerHTML = `

<div class="row">

<span class="left">

本番進入

</span>

<span class="right gold">

${entry.join("-")}

</span>

</div>

<div class="row">

<span class="left">

前付け

</span>

<span class="right ${

maezuke

?

"yellow"

:

"green"

}">

${

maezuke

?

maezukeBoat +

"号艇が1コース進入"

:

"なし"

}

</span>

</div>

`;

/*

展開解析

*/

const first =

entry[0];

const second =

entry[1];

const third =

entry[2];

document.getElementById(

"development"

).innerHTML = `

<div class="row">

<span class="left">

1コース

</span>

<span class="right gold">

${first}号艇

</span>

</div>

<div class="row">

<span class="left">

2コース

</span>

<span class="right">

${second}号艇

</span>

</div>

<div class="row">

<span class="left">

3コース

</span>

<span class="right">

${third}号艇

</span>

</div>

<div class="row">

<span class="left">

展開

</span>

<span class="right yellow">

${first}号艇中心

</span>

</div>

`;

/*

ランキング

*/

const racers =

raceData.racers ||

{};

const ranking =

Object

.keys(racers)

.map(

key => {

const r =

racers[key];

return {

number:

Number(

r.entry_number

),

name:

r.name,

score:

calcScore(r)

};

}

)

.sort(

(a,b)=>

b.score-a.score

);

const rankingElement =

document.getElementById(

"ranking"

);

rankingElement.innerHTML =

"";

ranking

.forEach(

function(

r,

index

){

const div =

document.createElement(

"div"

);

div.className =

"rank";

div.innerHTML = `

<strong>

${index+1}位

　

${r.number}号艇

　

${escapeHtml(

r.name

)}

</strong>

<div class="pick">

${r.score}pt

</div>

<div class="note">

全国勝率・当地勝率・モーター・ST等を

基礎評価

</div>

`;

rankingElement.appendChild(

div

);

});

/*

最終評価

*/

const top =

ranking[0];

const secondRank =

ranking[1];

const thirdRank =

ranking[2];

document.getElementById(

"final"

).innerHTML = `

<div class="row">

<span class="left">

本命

</span>

<span class="right gold">

${top.number}号艇

${escapeHtml(top.name)}

</span>

</div>

<div class="row">

<span class="left">

対抗

</span>

<span class="right">

${secondRank.number}号艇

${escapeHtml(secondRank.name)}

</span>

</div>

<div class="row">

<span class="left">

穴

</span>

<span class="right yellow">

${thirdRank.number}号艇

${escapeHtml(thirdRank.name)}

</span>

</div>

`;

/*

買い目

*/

const budget =

Number(

document.getElementById(

"budget"

).value

);

const hitMoney =

Math.floor(

budget * 0.6

);

const roiMoney =

budget -

hitMoney;

document.getElementById(

"hitPick"

).innerText =

`${first}-${second}-${third}`;

document.getElementById(

"hitMoney"

).innerText =

"予算：" +

hitMoney +

"円";

document.getElementById(

"roiPick"

).innerText =

`${second}-${third}-${first}`;

document.getElementById(

"roiMoney"

).innerText =

"予算：" +

roiMoney +

"円";

}

/*

========================================

基礎スコア

========================================

*/

function calcScore(

r

){

let score = 0;

score +=

Number(

r.national_win_rate || 0

) * 10;

score +=

Number(

r.local_win_rate || 0

) * 5;

score +=

Number(

r.motor_top_2_percent || 0

) * 0.15;

score +=

Number(

r.motor_top_3_percent || 0

) * 0.08;

score -=

Number(

r.average_start_timing || 0

) * 10;

return Math.round(

score

);

}

/*

========================================

HTMLエスケープ

========================================

*/

function escapeHtml(

text

){

return String(

text ?? ""

)

.replace(

/&/g,

"&amp;"

)

.replace(

/</g,

"&lt;"

)

.replace(

/>/g,

"&gt;"

)

.replace(

/"/g,

"&quot;"

)

.replace(

/'/g,

"&#039;"

);

}

</script>

</body>

</html>
