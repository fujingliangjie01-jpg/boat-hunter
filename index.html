<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

header{background:linear-gradient(135deg,#080808,#211a07,#080808);padding:18px 14px;border-bottom:1px solid #b8952e}

h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:2px}

.sub{color:#aaa;font-size:11px;margin-top:4px}

.wrap{max-width:1100px;margin:auto;padding:12px}

.card{background:#111;border:1px solid #292929;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 0 0 1px rgba(212,175,55,.04)}

.card h2{font-size:15px;color:#d4af37;margin:0 0 10px}

label{font-size:11px;color:#aaa}

select,input,button{background:#171717;color:#fff;border:1px solid #444;border-radius:6px;padding:9px;font-size:13px}

select,input{width:100%}

button{cursor:pointer}

button:hover{border-color:#d4af37}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}

.goldBtn{background:linear-gradient(135deg,#5d4812,#b8952e,#5d4812);color:#fff;border:1px solid #d4af37;font-weight:700}

.resetBtn{border-color:#755;color:#f88}

.message{margin-top:8px;font-size:12px}

.loading{color:#d4af37}

.success{color:#aaa}

.error{color:#ff5555}

table{width:100%;border-collapse:collapse;font-size:10px}

th{background:#211a07;color:#d4af37;padding:7px;border-bottom:1px solid #725c1e}

td{padding:6px 5px;border-bottom:1px solid #222;text-align:center}

.attackBox{border:1px solid #8a7020;border-radius:8px;padding:12px;background:linear-gradient(135deg,#111,#171308)}

.attackMain{font-size:18px;font-weight:800;color:#ffd84d}

.attackSub{margin-top:8px;color:#ccc;font-size:11px;line-height:1.7}

.outlookBox{margin-top:12px;border:1px solid #725c1e;border-radius:8px;padding:10px;background:#0d0d0d}

.outlookTitle{color:#d4af37;font-weight:700;margin-bottom:8px}

.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.outlookItem{border:1px solid #333;border-radius:8px;padding:10px;text-align:center}

.outlookEscape{border-color:#7b2d2d;background:#241414}

.outlookNonEscape{border-color:#294a2d;background:#111a12}

.outlookLabel{font-size:10px;color:#aaa}

.outlookValue{font-size:25px;font-weight:800;margin:3px 0}

.outlookEscape .outlookValue{color:#ff5555}

.outlookNonEscape .outlookValue{color:#4cd964}

.outlookStatus{font-size:10px;color:#d4af37}

.outlookInactive{opacity:.35}

.outlookLow{opacity:.55!important;border-color:#444!important;background:#101010!important}

.outlookLow .outlookLabel,.outlookLow .outlookValue,.outlookLow .outlookStatus{color:#666!important}

.overviewReason{font-size:10px;color:#777;line-height:1.7;margin-top:8px}

.aiDetail{font-size:10px;color:#777;margin-top:10px;line-height:1.7}

.strategy{background:#17120a;border:1px solid #725c1e;border-radius:7px;padding:9px;margin-top:8px;color:#ddd;font-size:10px;line-height:1.6}

.exclusion{background:#241111;border:1px solid #7a3030;border-radius:8px;padding:9px;margin-bottom:7px;font-size:10px;line-height:1.55}

.exclusionKeep{background:#211b0a;border:1px solid #806b23;border-radius:8px;padding:9px;margin-bottom:7px;font-size:10px;line-height:1.55}

.pickBox{background:#111;border:1px solid #725c1e;border-radius:9px;padding:10px;margin-bottom:9px}

.pickTitle{color:#ffd84d;font-size:13px;font-weight:800;margin-bottom:8px}

.betHeader{display:grid;grid-template-columns:1fr 1fr;gap:8px;color:#888;font-size:9px;margin-bottom:5px}

.betRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}

.bet2{display:flex;align-items:center;justify-content:center;gap:7px;background:#080808;border:1px solid #444;border-radius:7px;padding:12px;font-size:14px;font-weight:800}

.bet2Number{color:#ffd84d}

.thirdCandidates{display:flex;flex-wrap:wrap;gap:5px}

.thirdCandidate{padding:6px 8px;border-radius:5px;font-size:10px}

.thirdCandidate.normal{background:#171717;border:1px solid #333}

.thirdCandidate.revival{background:#30250b;border:1px solid #d4af37;color:#ffd84d}

.thirdProb{color:#aaa;margin-left:4px}

.revivalLabel{font-size:8px;margin-left:4px}

.patternNote{font-size:9px;color:#777;line-height:1.6;margin-top:8px}

.longshotBox{background:linear-gradient(135deg,#21100b,#0d0d0d);border:2px solid #d4af37;border-radius:9px;padding:11px;margin:10px 0}

.longshotTitle{font-size:14px;font-weight:900;color:#ffd84d;margin-bottom:7px}

.longshotReason{font-size:10px;color:#aaa;line-height:1.6;margin-bottom:7px}

.longshotBet{background:#080808;border:1px solid #d4af37;color:#ffd84d;border-radius:6px;padding:9px;margin-top:5px;font-size:13px;font-weight:900;text-align:center;box-shadow:0 0 8px rgba(212,175,55,.18)}

.sevenPointBox{background:linear-gradient(135deg,#17120a,#0d0d0d);border:2px solid #b8952e;border-radius:9px;padding:11px;margin:10px 0}

.sevenPointTitle{font-size:14px;font-weight:900;color:#ffd84d;margin-bottom:8px}

.sevenPointRow{display:flex;align-items:center;gap:8px;background:#080808;border:1px solid #333;border-radius:6px;padding:8px;margin-top:5px}

.sevenPointNo{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#211a07;color:#d4af37;font-weight:900;font-size:11px}

.sevenPointBet{font-size:12px;font-weight:800}

.sevenPointBet span{color:#ffd84d}

.sevenPointNote{font-size:9px;color:#777;line-height:1.6;margin-top:8px}

.noPick{color:#666;font-size:10px;padding:8px}

.topBtn{margin-top:14px;background:#171717;border:1px solid #b8952e;color:#d4af37}

@media(max-width:700px){

.grid6{grid-template-columns:repeat(3,1fr)}

.grid2,.outlookGrid,.betRow{grid-template-columns:1fr}

table{font-size:8px}

th,td{padding:4px 2px}

}

</style>

</head>

<script>

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

let racers=[];

let historyData={};

let manualCourses={};

let currentBets=null;

function $(id){

return document.getElementById(id)

}

function num(v){

let n=parseFloat(v);

return Number.isFinite(n)?n:0

}

function esc(v){

return String(v??"").replace(/[&<>"']/g,m=>({

"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

}[m]))

}

function today(){

let d=new Date();

let y=d.getFullYear();

let m=String(d.getMonth()+1).padStart(2,"0");

let day=String(d.getDate()).padStart(2,"0");

return{year:y,ymd:`${y}${m}${day}`}

}

function initCourses(){

for(let b=1;b<=6;b++){

let s=$("course"+b);

s.innerHTML="";

for(let c=1;c<=6;c++){

let o=document.createElement("option");

o.value=c;

o.textContent=c+"コース";

s.appendChild(o)

}

s.value=b;

manualCourses[b]=b

}

}

function resetCourses(){

for(let b=1;b<=6;b++){

$("course"+b).value=b;

manualCourses[b]=b

}

renderRace()

}

function course(b){

return num(manualCourses[b])||num($("course"+b)?.value)||b

}

function getRacerNumber(r){

return num(r?.entry_number||r?.racer_number||r?.boat||r?.number)

}

function racer(b){

return racers.find(x=>getRacerNumber(x)===b)||racers[b-1]||null

}

function preview(b){

let r=racer(b)||{};

return r.preview||r.exhibition||r

}

function decisions(r){

r=r||{};

let escape=num(r.escape_rate||r.nige_rate||r.escape||r.nige);

let sashi=num(r.sashi_rate||r.dashi_rate||r.dashi);

let maki=num(r.makuri_rate||r.maki_rate||r.makuri);

let makiSashi=num(r.makuri_sashi_rate||r.makurisashi_rate||r.makuri_sashi);

let makare=num(r.makare_rate||r.makura_rate||r.makare);

let sasare=num(r.sasare_rate||r.sasare);

let makiSashiSare=num(r.makuri_sashi_sare_rate||r.makurisashi_sare_rate||r.makuri_sashi_sare);

return{

escape,sashi,maki,makiSashi,

makareRate:makare,

sasareRate:sasare,

makiSashiSareRate:makiSashiSare

}

}

async function fetchJson(url){

let res=await fetch(url);

if(!res.ok)throw new Error("HTTP "+res.status);

return await res.json()

}

async function loadDaily(){

let t=today(),

v=$("venue").value,

r=$("race").value;

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let lastError=null;

for(const u of urls){

try{

let data=await fetchJson(u);

let found=findRace(data,v,r);

if(found)return found

}catch(e){

lastError=e

}

}

throw lastError||new Error("出走表データを取得できません")

}

function findRace(data,venue,raceNo){

let target=String(raceNo);

let venueNames=[

venue,

venue+"競艇場"

];

let found=null;

function walk(x){

if(found)return;

if(Array.isArray(x)){

for(const y of x)walk(y);

return

}

if(!x||typeof x!=="object")return;

let race=String(x.race_number??x.race_no??x.race??"");

let v=String(x.venue??x.venue_code??x.jyo_code??x.place??"");

if(race===target&&venueNames.some(n=>v===n||v.toLowerCase()===n.toLowerCase())){

found=x;

return

}

for(const k of Object.keys(x))walk(x[k])

}

walk(data);

if(found)return found;

function findByRace(x){

if(Array.isArray(x)){

for(const y of x){

let z=findByRace(y);

if(z)return z

}

return null

}

if(!x||typeof x!=="object")return null;

let race=String(x.race_number??x.race_no??x.race??"");

if(race===target){

if(x.entries||x.racers||x.players||x.program||x.race_card)return x

}

for(const k of Object.keys(x)){

let z=findByRace(x[k]);

if(z)return z

}

return null

}

return findByRace(data)

}

function extractRacers(race){

let a=race?.entries||race?.racers||race?.players||race?.program||race?.race_card||[];

if(!Array.isArray(a)&&a&&typeof a==="object"){

a=Object.values(a)

}

return a.slice(0,6).map((x,i)=>{

if(!x||typeof x!=="object")x={};

return{

...x,

entry_number:num(x.entry_number||x.boat_number||x.boat||x.number)||i+1,

name:x.name||x.racer_name||x.player_name||"-"

}

})

}

async function loadRace(){

$("message").innerHTML='<span class="loading">出走表取得中...</span>';

try{

let race=await loadDaily();

racers=extractRacers(race);

if(racers.length!==6)throw new Error("6艇の出走表を取得できませんでした");

for(let b=1;b<=6;b++){

manualCourses[b]=b;

$("course"+b).value=String(b)

}

renderRace();

$("message").innerHTML='<span class="success">✅ 出走表取得完了</span>'

}catch(e){

console.error(e);

$("message").innerHTML='<span class="error">❌ 出走表取得失敗<br>'+esc(e.message)+'</span>'

}

}

function renderRace(){

if(racers.length!==6){

$("raceTable").innerHTML="出走表を取得してください";

return

}

$("raceTable").innerHTML=`

<table>

<tr>

<th>艇</th>

<th>選手</th>

<th>級別</th>

<th>全国勝率</th>

<th>当地勝率</th>

<th>モーター2連</th>

<th>展示</th>

<th>ST</th>

<th>進入</th>

</tr>

${racers.map((r,i)=>{

let b=getRacerNumber(r)||i+1;

let p=preview(b);

return`<tr>

<td>${b}</td>

<td>${esc(r.name||r.racer_name||r.player_name||"-")}</td>

<td>${rank(r.rank_number||r.class_number||r.rank||r.class)}</td>

<td>${num(r.national_win_rate||r.win_rate_national).toFixed(2)}</td>

<td>${num(r.local_win_rate||r.win_rate_local).toFixed(2)}</td>

<td>${num(r.motor_top_2_percent||r.motor_2ren_rate||r.motor_2ren).toFixed(1)}%</td>

<td>${num(p.exhibition_time||p.exhibition).toFixed(2)}</td>

<td>${num(p.start_timing||p.st).toFixed(2)}</td>

<td>${course(b)}</td>

</tr>`

}).join("")}

</table>`

}

async function loadHistory(){

historyData={};

for(let b=1;b<=6;b++){

let r=racer(b);

if(!r)continue;

let no=getRacerNumber(r);

let c=course(b);

let urls=[

`${API_V1}/racer/${no}/results.json`,

`${API_V1}/racer/${no}.json`

];

for(const u of urls){

try{

let d=await fetchJson(u);

let rows=Array.isArray(d)?d:d.results||d.data||d.history||[];

if(!Array.isArray(rows))continue;

historyData[no]={boats:{}};

historyData[no].boats[c]=rows.slice(0,15);

break

}catch(e){}

}

}

}

function hstats(b){

let r=racer(b),

no=getRacerNumber(r),

c=course(b),

rows=historyData[no]?.boats?.[c]||[];

let first=0,total=0;

rows.forEach(x=>{

let pos=num(x.finish_position||x.rank||x.result);

if(pos>0){

total++;

if(pos<=3)first++

}

});

return{

count:total,

rate:total?first/total*100:0

}

}

function hscore(b){

let r=racer(b),

no=getRacerNumber(r),

c=course(b),

rows=historyData[no]?.boats?.[c]||[];

if(!rows.length)return 0;

let s=0;

rows.slice(0,15).forEach(x=>{

let pos=num(x.finish_position||x.rank||x.result);

if(pos===1)s+=8;

else if(pos===2)s+=5;

else if(pos===3)s+=3;

else if(pos>=4)s-=1;

});

return s

}

function recentForm(b){

let r=racer(b)||{},

rows=r.recent_results||r.recent||r.last15||[];

if(!Array.isArray(rows))rows=[];

let s=0;

rows.slice(0,15).forEach(x=>{

let p=num(x.finish_position||x.rank||x.result);

if(p===1)s+=3;

else if(p===2)s+=2;

else if(p===3)s+=1;

else if(p>=5)s-=1

});

return{

score:s,

label:s>=3?"好調":s<=-2?"不調":"普通"

}

}

function windInfo(){

let r=racer(1)||{};

let w=r.wind||r.wind_info||{};

let speed=num(w.speed||r.wind_speed);

let dir=String(w.direction||w.wind_direction||r.wind_direction||"").toLowerCase();

let mode="none";

if(/向|head|against|追い風逆/.test(dir))mode="head";

if(/追|tail|following/.test(dir))mode="tail";

return{

speed,

direction:dir,

mode,

label:mode==="head"?"向かい風":mode==="tail"?"追い風":"風向不明"

}

}

let v=$("venue")?.value||"";

const map={

kiryu:{name:"桐生",escape:1.00,sashi:.98,maki:1.05,makiSashi:1.04},

toda:{name:"戸田",escape:.88,sashi:1.08,maki:1.10,makiSashi:1.05},

hamamatsu:{name:"浜名湖",escape:1.00,sashi:1.00,maki:1.03,makiSashi:1.02},

gamagori:{name:"蒲郡",escape:1.02,sashi:1.00,maki:1.00,makiSashi:1.00},

mikuni:{name:"三国",escape:.98,sashi:1.02,maki:1.02,makiSashi:1.02},

biwako:{name:"びわこ",escape:.95,sashi:1.04,maki:1.06,makiSashi:1.05},

suminoe:{name:"住之江",escape:1.04,sashi:.99,maki:.98,makiSashi:.99},

amagasaki:{name:"尼崎",escape:1.03,sashi:1.00,maki:1.00,makiSashi:1.00},

naruto:{name:"鳴門",escape:1.00,sashi:1.02,maki:1.02,makiSashi:1.03},

marugame:{name:"丸亀",escape:1.02,sashi:1.00,maki:1.00,makiSashi:1.00},

num(r.local_win_rate||r.win_rate_local)*4+

num(r.national_top_2_percent||r.national_2ren_rate)*.12;

if(ast>0){

}

if(st>0){

}

if(ex>0){

else if(ex>=6.95)s-=3;

}

s+=({1:10,2:6,3:5,4:3,5:1,6:0}[course(b)]||0);

let hs=hstats(b);

if(hs.count){

s+=hscore(b);

s+=hs.rate>=60?5:hs.rate>=40?3:hs.rate<20?-2:0

}

let form=recentForm(b);

s+=form.score;

let rk=rank(r.rank_number||r.class_number||r.rank||r.class);

s+=rk==="A1"?5:rk==="A2"?2:rk==="B2"?-2:0;

let o=overview(),dom=dominant(o);

if(course(b)!==1)s+=suitability(b,dom)*.35;

Object.entries(o).forEach(([t,v])=>{

if(t!=="escape"&&v>=20)s+=suitability(b,t)*.12

});

let vt=venueTrait();

if(course(b)===1){

s+=(vt.escape-1)*20;

s-=d.makare*.55;

s-=d.sasare*.40;

s-=d.makiSashi*.25;

if(ast>0&&ast<=.18)s+=3;

let de=decisionEvaluation(1,"escape");

s+=de.value*1.2

}

if(course(b)===2){

s+=d.sashi*.9;

if(d.sashi>=15)s+=4;

s+=d.maki*.35;

s+=decisionEvaluation(b,"sashi").value*.7;

s+=decisionEvaluation(b,"maki").value*.35

}

if(course(b)>=3&&course(b)<=5){

s+=d.maki*.55;

s+=d.makiSashi*.55;

s+=decisionEvaluation(b,"maki").value*.55;

s+=decisionEvaluation(b,"makiSashi").value*.55

}

if(course(b)!==1){

s+=(suitability(b,"maki")+suitability(b,"makiSashi")+suitability(b,"sashi"))*.025

}

let wi=windInfo();

if(wi.mode==="head"&&wi.speed>=3){

if(course(b)>=3){

s+=windSuitability(b,"maki")*.9;

s+=windSuitability(b,"makiSashi")*.6;

}

if(course(b)===1)s-=4;

}

if(wi.mode==="tail"&&wi.speed>=3){

if(course(b)===1)s+=windSuitability(b,"escape")*1.0;

if(course(b)===2)s+=windSuitability(b,"sashi")*.9;

}

return Math.max(0,s)

function candidate(a,b,rankings,type,mode="recovery"){

raw+=30+o.escape*.9+suitability(a,type)*.7

raw+=10+suitability(a,type)*.9+o.sashi*.75+18;

if(o.escape<42)raw+=10

}

if(type==="maki"){

if(course(a)===1)return null;

raw+=8+suitability(a,type)*.9+o.maki*.75;

if(o.escape<42)raw+=10

}

if(type==="makiSashi"){

if(course(a)===1||course(a)===2)return null;

raw+=10+suitability(a,type)*.9+o.makiSashi*.75;

if(o.escape<42)raw+=10

}

if(type==="maki"&&course(a)===2){

let rr=decisions(racer(a));

if(rr.maki<10||o.maki<20)return null;

raw+=rr.maki*.5

}

if(b===1){

raw+=18;

if(o.escape>=50)raw+=10

}

raw+=hscore(a)*1.3+recentForm(a).score*1.5+

num(racer(a)?.motor_top_2_percent||racer(a)?.motor_2ren_rate||racer(a)?.motor_2ren)*.08;

type==="sashi"?vt.sashi:

type==="maki"?vt.maki:

function motorRate(b){

return num(

racer(b)?.motor_top_2_percent||

racer(b)?.motor_2ren_rate||

racer(b)?.motor_2ren

)

}

function recentFormValue(b){

return recentForm(b).score

}

function patternThirdScore(b,rankings,type){

let x=rankings.find(z=>z.boat===b);

if(!x)return -999;

let v=x.score;

v+=motorRate(b)*.35;

v+=recentFormValue(b)*4;

v+=suitability(b,type)*.35;

let dev=developmentBonus(b,rankings,type);

v+=dev.bonus*.8;

if(goodHistory(b))v+=5;

return v

}

function thirdProbabilityList(excluded,rankings,type){

let list=[];

for(let b=2;b<=6;b++){

if(excluded.includes(b))continue;

let v=patternThirdScore(b,rankings,type);

if(v<=-900)continue;

list.push({

boat:b,

value:v

})

}

list.sort((a,b)=>b.value-a.value);

let min=list.length?Math.min(...list.map(x=>x.value)):0;

let weights=list.map(x=>Math.max(.1,x.value-min+5));

let total=weights.reduce((s,x)=>s+x,0)||1;

list.forEach((x,i)=>{

x.prob=weights[i]/total*100

});

return list

}

function bestSecondNonOne(rankings){

return rankings.find(x=>x.boat!==1)?.boat||null

}

function patternTwoCandidates(rankings){

let avg=scoreAverage(rankings);

let eligible=[];

rankings.forEach((x,i)=>{

if(x.boat===1)return;

let lowAI=x.score<=avg-20;

let weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

eligible.push({

boat:x.boat,

rank:i+1,

score:x.score

})

});

let fourth=rankings[3],

fifth=rankings[4],

picked=[];

[fourth,fifth].forEach(x=>{

if(!x||x.boat===1)return;

let lowAI=x.score<=avg-20;

let weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

if(!picked.includes(x.boat))picked.push(x.boat)

});

if(!picked.length&&eligible.length){

picked.push(eligible[0].boat)

}

if(picked.length>2)picked=picked.slice(0,2);

return{

picked,

eligible,

avg

}

}

function renderThirdCandidates(list,secondBoats,firstBoat,forcedBoat){

if(!list.length)return'<div class="noPick">3着候補なし</div>';

return`

${list.map(x=>{

let forced=x.boat===forcedBoat;

if(duplicate&&!forced)return"";

return`

${x.boat}号艇

<span class="thirdProb">${x.prob.toFixed(1)}%</span>

${forced?'<span class="revivalLabel">⭐ AI80以上＋モーター35%以上</span>':""}

function attackDecisionRanking(rankings){

let o=overview(),d1=decisions(racer(1)),rows=[];

const attackTypes=["sashi","maki","makiSashi"];

for(let type of attackTypes){

let danger=type==="sashi"?d1.sasareRate:type==="maki"?d1.makareRate:d1.makiSashiSareRate;

let dangerBonus=danger<7?9:danger<15?-3:danger<25?-10:-20;

for(let b=2;b<=6;b++){

let c=course(b),d=decisions(racer(b));

let rate=type==="sashi"?d.sashi:type==="maki"?d.maki:d.makiSashi;

if(type==="makiSashi"&&c===2)continue;

if(type==="maki"&&c===2&&(d.maki<10||o.maki<20))continue;

let methodBonus=rate>=25?28:rate>=20?18:rate>=15?12:rate>=7?5:-4;

let form=recentForm(b),motor=motorRate(b),p=preview(b);

let ex=num(p.exhibition_time||p.exhibition),st=num(p.start_timing||p.st),rk=rank(racer(b)?.rank_number||racer(b)?.class_number||racer(b)?.rank||racer(b)?.class);

let value=methodBonus+dangerBonus;

value+=suitability(b,type)*.9;

value+=score(b)*.32;

value+=motor*.18;

value+=form.score*2.2;

value+=(hstats(b).rate>=40?4:hstats(b).rate<20?-3:0);

value+=windSuitability(b,type)*.8;

value+=type==="sashi"?venueTrait().sashi*3:type==="maki"?venueTrait().maki*3:venueTrait().makiSashi*3;

if(st>0)value+=Math.max(0,.25-st)*8;

if(ex>0)value+=Math.max(0,6.8-ex)*3;

if(rk==="A1")value+=5;

else if(rk==="A2")value+=2;

rows.push({boat:b,type,rate,danger,value,course:c});

}

}

return rows.sort((a,b)=>b.value-a.value)

}

function nonEscapeAttackType(rankings){

let rows=attackDecisionRanking(rankings);

return rows.length?rows[0].type:"maki"

}

function insideSecondCandidates(rankings,type,attacker){

let out=[],candidates=[1,2,3];

if(type==="sashi")candidates=[1,2,3];

if(type==="maki")candidates=[1,2,3,4,6];

if(type==="makiSashi")candidates=[1,attacker,2,3,4];

candidates.forEach(b=>{

if(b<1||b>6||b===attacker||out.some(x=>x.boat===b))return;

let r=racer(b),f=recentForm(b),hs=hstats(b),m=motorRate(b),st=num(preview(b).start_timing||preview(b).st),rk=rank(r?.rank_number||r?.class_number||r?.rank||r?.class);

let v=score(b)+m*.35+f.score*4+hs.rate*.12+(rk==="A1"?8:rk==="A2"?4:0)+(st>0?Math.max(0,.25-st)*10:0);

if(type==="maki"&&b===6&&m>=35&&hs.rate>=40&&classification(b,rankings).type!=="cut")v+=18;

if(course(b)<=3)v+=10;

out.push({boat:b,value:v})

});

return out.sort((a,b)=>b.value-a.value)

}

function thirdPoolForNonEscape(rankings,secondBoat,type,firstBoat){

let list=thirdCandidates(rankings,secondBoat,rankings,type,firstBoat).map(x=>x.boat);

let extra=rankings.map(x=>x.boat).filter(b=>b!==firstBoat&&b!==secondBoat&&!list.includes(b));

return [...list,...extra]

}

function buildNonEscapeSevenBets(rankings,type){

let attackRows=attackDecisionRanking(rankings),attackers=[];

attackRows.forEach(x=>{

if(!attackers.includes(x.boat)&&attackers.length<3)attackers.push(x.boat)

});

if(!attackers.length)attackers=[bestAttackBoat(type)];

let attacker=attackers[0],

secondPool=insideSecondCandidates(rankings,type,attacker).map(x=>x.boat);

if(!secondPool.includes(1))secondPool.unshift(1);

let bets=[],seen=new Set();

function add(a,b,c){

if(!a||!b||!c||a===b||a===c||b===c)return;

let key=`${a}-${b}-${c}`;

if(seen.has(key))return;

seen.add(key);

bets.push({a,b,c})

}

let firstOrder=[...attackers,...rankings.map(x=>x.boat)].filter((b,i,a)=>a.indexOf(b)===i&&b!==1);

firstOrder.forEach(a=>{

let secs=[...secondPool];

if(type==="maki"){

let ac=course(a),

follow=[...rankings]

.sort((x,y)=>Math.abs(course(x.boat)-(ac+1))-Math.abs(course(y.boat)-(ac+1)))

.map(x=>x.boat);

secs=[...follow,...secs];

if(!secs.includes(1))secs.push(1)

}

secs=[...new Set(secs)].filter(b=>b!==a);

secs.forEach(b=>thirdPoolForNonEscape(rankings,b,type,a).forEach(c=>add(a,b,c)))

});

let priority=[];

bets.forEach(x=>{

let v=0;

if(x.b===1)v+=24;

if(x.c===1)v+=20;

if(x.b===attacker)v+=6;

let ra=rankings.findIndex(z=>z.boat===x.a)+1,

rb=rankings.findIndex(z=>z.boat===x.b)+1,

rc=rankings.findIndex(z=>z.boat===x.c)+1;

v+=(ra<=2?10:ra===3?5:0)+(rb<=3?6:0)+(rc<=3?4:0);

if(type==="maki"&&course(x.b)===course(attacker)+1)v+=12;

priority.push({...x,value:v})

});

priority.sort((a,b)=>b.value-a.value);

let selected=priority.slice(0,7);

if(selected.length<7)

for(let x of bets){

if(selected.length>=7)break;

if(!selected.some(y=>y.a===x.a&&y.b===x.b&&y.c===x.c))

selected.push(x)

}

return selected.slice(0,7)

}
