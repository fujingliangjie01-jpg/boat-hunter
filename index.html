<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

header{background:linear-gradient(135deg,#080808,#211a07);border-bottom:1px solid #b8952e;padding:18px;text-align:center}

header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:3px}

header p{margin:5px 0 0;font-size:12px;color:#999}

.container{max-width:1000px;margin:auto;padding:14px}

.card{background:#111;border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:14px}

h2{margin:0 0 12px;font-size:17px;color:#d4af37}

h3{font-size:14px;color:#d4af37;margin:14px 0 8px}

label{font-size:11px;color:#aaa;display:block;margin-bottom:5px}

select,input{width:100%;background:#181818;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{width:100%;padding:13px;border:0;border-radius:9px;font-size:14px;font-weight:bold}

.mainBtn{margin-top:12px;background:linear-gradient(135deg,#d4af37,#8b6914);color:#000}

.subBtn{margin-top:8px;background:#222;border:1px solid #555;color:#fff}

.resetBtn{margin-top:8px;background:#171717;border:1px solid #777;color:#fff}

.topBtn{margin-top:14px;background:#171717;border:1px solid #b8952e;color:#d4af37}

.message{margin-top:10px;font-size:12px;line-height:1.6;color:#aaa}

.info{background:#151515;border:1px solid #333;border-radius:8px;padding:10px;font-size:11px;line-height:1.7;margin-bottom:10px}

.courseGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.courseBox{background:#171717;padding:8px;border-radius:8px;border:1px solid #333}

.racers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.racer{background:#171717;border:1px solid #333;border-radius:9px;padding:9px}

.racerTop{display:flex;align-items:center;gap:8px}

.number{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#000}

.n1{background:#fff}.n2{background:#222;color:#fff;border:1px solid #777}.n3{background:#e22;color:#fff}.n4{background:#248cff;color:#fff}.n5{background:#e5d000}.n6{background:#20a747;color:#fff}

.racerName{font-weight:bold}

.small{font-size:10px;color:#aaa;line-height:1.6;margin-top:6px}

.tech{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.tech div{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px;font-size:10px;text-align:center}

.tech span{display:block;color:#888;margin-bottom:2px}

.decisionStats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.decisionStat{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px 4px;font-size:10px;text-align:center}

.decisionStat span{display:block;color:#888;margin-bottom:2px}

.decisionStat strong{display:block;color:#d4af37;font-size:12px}

.history{margin-top:8px;background:#0d0d0d;border:1px solid #292929;border-radius:8px;padding:8px}

.historyTitle{color:#d4af37;font-weight:bold;font-size:11px;margin-bottom:6px}

.historyStats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}

.historyStat{background:#151515;border-radius:5px;padding:5px 2px;text-align:center;font-size:9px;color:#aaa}

.historyStat strong{display:block;font-size:12px;color:#d4af37;margin-top:2px}

.historyList{font-size:9px;color:#aaa;line-height:1.6;max-height:180px;overflow-y:auto}

.historyItem{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:3px 0}

.historyItem:last-child{border-bottom:0}

.historyGood{color:#4cd964;font-weight:bold}.historyBad{color:#777}.historyMiddle{color:#ffd84d;font-weight:bold}.historyDecision{color:#d4af37;font-weight:bold}

table{width:100%;border-collapse:collapse;font-size:11px}

th,td{padding:7px 3px;border-bottom:1px solid #292929;text-align:center}

th{color:#d4af37}

.strategy{background:#171717;border-left:3px solid #d4af37;padding:9px;font-size:11px;line-height:1.7;margin-top:8px}

.attackBox{background:#211a07;border:1px solid #8a6d1c;border-radius:9px;padding:10px;font-size:11px;line-height:1.8;margin-top:8px}

.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}.attackSub{color:#aaa;margin-top:4px}

.exclusion{background:#241414;border-left:3px solid #e55;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.exclusionKeep{background:#171707;border-left:3px solid #d4af37;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.revivalBox{background:#211a07;border-left:3px solid #ffd84d;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.pickBox{background:#151515;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}

.betHeader{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;background:#0d0d0d;border:1px solid #292929;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px;color:#888;text-align:center}

.betRow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #292929}

.betRow:last-child{border-bottom:0}

.bet2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:bold}

.bet2Number{background:#211a07;border:1px solid #8a6d1c;border-radius:6px;padding:5px 8px;color:#ffd84d}

.betPercent{font-size:11px;color:#ffd84d;font-weight:bold}

.thirdCandidates{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}

.thirdCandidate{background:#101010;border:1px solid #333;border-radius:6px;padding:5px 6px;font-size:10px;color:#fff}

.thirdCandidate.normal{border-color:#555}

.thirdCandidate.revival{border-color:#d4af37;color:#ffd84d;background:#211a07}

.thirdCandidate.warning{border-color:#8a4b4b;color:#ff9b9b}

.revivalLabel{display:block;font-size:8px;color:#ffd84d;margin-top:2px}

.betNote{font-size:9px;color:#777;margin-top:5px;line-height:1.5}

.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px}

.pick:last-child{border-bottom:0}.pickLeft{display:flex;align-items:center;gap:5px}

.star{width:18px;min-width:18px;color:#ffd84d;font-size:15px;font-weight:bold}

.prob{color:#ffd84d;font-weight:bold}

.pick.veryStrong .prob,.pick.veryStrong strong{color:#ff3b30}.pick.veryStrong .prob{font-size:15px;font-weight:900}

.pick.strong .prob,.pick.strong strong{color:#ffd84d}.pick.strong .prob{font-size:14px;font-weight:900}

.pick.weak{opacity:.38}

.total{background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;padding:10px;text-align:center;color:#d4af37;font-weight:bold;margin-bottom:8px}

.budgetInfo{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:11px;line-height:1.6;color:#aaa}

.budgetStrong{color:#d4af37;font-weight:bold}.noPick{font-size:11px;color:#777;padding:8px 0;line-height:1.6}

.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}

.overviewBox{background:#101010;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}

.overviewBox .label{font-size:10px;color:#888}.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}

.overviewBox.main{border-color:#8a6d1c;background:#1c1709}

.overviewReason{font-size:11px;color:#aaa;line-height:1.7;margin-top:8px}

.venueBox{background:#101010;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.venueBox strong{color:#d4af37}.formBox{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.footer{text-align:center;color:#555;font-size:10px;padding:20px}

.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}

.betEscape{color:#ff9500}.betSashi{color:#4cd964}.betMaki{color:#ff5555}.betMakiSashi{color:#58a6ff}

.recommendPick{opacity:.52}.recommendTitle{color:#888!important}

.outlookBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.outlookTitle{font-size:13px;font-weight:bold;color:#d4af37;margin-bottom:8px}

.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}

.outlookEscape{border-color:#7b2d2d;background:#241414}

.outlookNonEscape{border-color:#285b8c;background:#0e1722}

.outlookInactive{border-color:#333!important;background:#151515!important}

.outlookLabel{font-size:10px;color:#aaa}

.outlookValue{font-size:22px;font-weight:900;margin-top:3px}

.outlookEscape .outlookValue{color:#ff5555}

.outlookNonEscape .outlookValue{color:#58a6ff}

.outlookInactive .outlookValue{color:#777}

.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}

.decisionPositive{color:#4cd964}

.decisionWarning{color:#ffd84d}

.decisionDanger{color:#ff5555}

.decisionMuted{color:#777!important}

.outlookBand-balanced{border-color:#2e8b57!important;background:#102014!important}

.outlookBand-balanced .outlookValue{color:#4cd964!important}

.outlookBand-escapeHigh .outlookEscape{border-color:#7b2d2d!important;background:#241414!important}

.outlookBand-escapeHigh .outlookEscape .outlookValue{color:#ff5555!important}

.outlookBand-escapeHigh .outlookNonEscape{border-color:#444!important;background:#101010!important}

.outlookBand-escapeHigh .outlookNonEscape .outlookValue{color:#777!important}

.outlookBand-nonEscapeHigh .outlookNonEscape{border-color:#285b8c!important;background:#0e1722!important}

.outlookBand-nonEscapeHigh .outlookNonEscape .outlookValue{color:#58a6ff!important}

.outlookBand-nonEscapeHigh .outlookEscape{border-color:#444!important;background:#101010!important}

.outlookBand-nonEscapeHigh .outlookEscape .outlookValue{color:#777!important}

.outlookCaution{margin-top:8px;padding:10px;border:2px solid #ffd84d;border-radius:8px;background:#2a240d;color:#ffd84d;text-align:center;font-weight:900;font-size:14px;letter-spacing:.5px;box-shadow:0 0 10px rgba(255,216,77,.18)}

.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}

.aiDetail strong{color:#d4af37}

.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}

.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}

.patternExcluded{color:#777;text-decoration:line-through}

@media(max-width:600px){

.grid2{grid-template-columns:1fr}

.courseGrid{grid-template-columns:repeat(2,1fr)}

.racers{grid-template-columns:1fr}

.overviewGrid{grid-template-columns:repeat(2,1fr)}

.betHeader,.betRow{grid-template-columns:1fr 1.3fr}

.decisionStats{grid-template-columns:repeat(2,1fr)}

}

</style>

</head>

<body>

<header>

<h1>BOAT HUNTER</h1>

<p>人気ではなく期待値で勝つ</p>

</header>

<div class="container">

<div class="card">

<h2>🎯 レース選択</h2>

<div class="grid2">

<div>

<label>開催場</label>

<select id="venue">

<option value="kiryu">桐生</option>

<option value="toda">戸田</option>

<option value="edogawa">江戸川</option>

<option value="heiwajima">平和島</option>

<option value="tamagawa">多摩川</option>

<option value="hamamatsu">浜名湖</option>

<option value="gamagori">蒲郡</option>

<option value="tokoname">常滑</option>

<option value="tsu">津</option>

<option value="mikuni">三国</option>

<option value="biwako">びわこ</option>

<option value="suminoe">住之江</option>

<option value="amagasaki">尼崎</option>

<option value="naruto">鳴門</option>

<option value="marugame">丸亀</option>

<option value="児島">児島</option>

<option value="miyajima">宮島</option>

<option value="tokuyama">徳山</option>

<option value="shimonoseki">下関</option>

<option value="6">6R</option>

<option value="7">7R</option>

<option value="8">8R</option>

<option value="9">9R</option>

<option value="10">10R</option>

<option value="11">11R</option>

<option value="12">12R</option>

</select>

</div>

</div>

<div style="margin-top:10px">

<label>予算（100円単位）</label>

<input id="budget" type="number" min="100" step="100" value="3000">

</div>

<button class="subBtn" onclick="loadRace()">📋 出走表を取得</button>

<div id="message" class="message"></div>

</div>

<div class="card">

<h2>🛥️ 進入入力</h2>

<div class="info">

現在の進入コースを入力してください。<br>

同じコースを走った過去15走をAI解析へ反映します。

</div>

<div class="courseGrid">

<div class="courseBox"><label>1号艇</label><select id="course1"></select></div>

<div class="courseBox"><label>2号艇</label><select id="course2"></select></div>

<div class="courseBox"><label>3号艇</label><select id="course3"></select></div>

<div class="courseBox"><label>4号艇</label><select id="course4"></select></div>

<div class="courseBox"><label>5号艇</label><select id="course5"></select></div>

<div class="courseBox"><label>6号艇</label><select id="course6"></select></div>

</div>

<button class="resetBtn" onclick="resetCourses()">🔄 進入リセット</button>

<button class="mainBtn" onclick="runAnalysis()">🤖 AI解析開始</button>

</div>

<div class="card">

<h2>📋 出走表</h2>

<div id="raceTable">

<div class="noPick">出走表を取得してください。</div>

</div>

</div>

<div class="card" id="analysisCard" style="display:none">

<h2>🤖 AI解析</h2>

<h3>📊 AI期待値ランキング</h3>

<div id="ranking"></div>

<h3>🔥 全体見通し</h3>

<div id="attack"></div>

<h3>✂️ 3着から切り候補</h3>

<div id="exclusions"></div>

<div id="bettingPatterns"></div>

</div>

<div class="footer">BOAT HUNTER © 2026</div>

</div>

<script>

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

let raceData=null,racers=[],previewRacers={},manualCourses={},historyData={},currentBets=null;

const HISTORY_RACES=15;

const HISTORY_DAYS=180;

const $=id=>document.getElementById(id);

const num=v=>{

if(v==null||v==="")return 0;

let x=parseFloat(String(v).replace(/[%,秒,]/g,""));

return Number.isFinite(x)?x:0

};

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function course(b){return Number(manualCourses[b]||b)}

function racer(b){return racers.find(x=>num(x.entry_number)===b)}

function preview(b){return previewRacers[b]||previewRacers[String(b)]||{}}

function today(){

let p=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());

return{

year:p.find(x=>x.type==="year").value,

ymd:p.find(x=>x.type==="year").value+p.find(x=>x.type==="month").value+p.find(x=>x.type==="day").value

}

}

function dateInfo(d){

return{

year:String(d.getFullYear()),

ymd:String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")

}

}

async function json(url){

let sep=url.includes("?")?"&":"?";

let r=await fetch(url+sep+"_="+Date.now(),{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

return r.json()

}

function normalizeEntry(x,i){

if(x==null||typeof x!=="object")return null;

let entry=num(

x.entry_number??x.entryNumber??x.boat_number??x.boatNumber??x.boat_no??

x.number_boat??x.boat??x.lane??x.lane_number??x.laneNumber??

x.course_number??x.course??x.entry??x.number

);

if(!entry&&i<6)entry=i+1;

let name=x.name??x.racer_name??x.racerName??x.player_name??x.playerName??

x.racer??x.player??x.racers_name??"";

if(typeof name==="object")name=name.name||name.racer_name||name.player_name||"";

return{...x,entry_number:entry,name:name}

}

function extractRaceEntries(race){

if(!race)return[];

const directCandidates=[

race.racers,race.entries,race.participants,race.program,race.race_entries,

race.racer,race.players,race.boats,race.starting_list,race.startingList,

race.entry_list,race.entryList

];

for(const a of directCandidates){

if(Array.isArray(a)&&a.length>=6)return a.slice(0,6).map(normalizeEntry).filter(Boolean)

}

if(typeof race==="object"){

for(const k of Object.keys(race)){

const a=race[k];

if(Array.isArray(a)&&a.length>=6){

let n=a.slice(0,6).map(normalizeEntry).filter(x=>x&&x.entry_number>=1&&x.entry_number<=6);

if(n.length===6)return n

}

}

}

return[]

}

function findRace(obj,venue,raceNo){

if(!obj)return null;

let target=String(raceNo);

let candidates=[];

function walk(x){

if(!x||typeof x!=="object")return;

if(Array.isArray(x)){

for(const y of x)walk(y);

return

}

let no=x.race_number??x.raceNumber??x.race_no??x.raceNo??x.number;

let v=x.venue??x.place??x.race_venue??x.venue_code??x.jcd;

if(String(no)===target){

if(!v||String(v).toLowerCase()===String(venue).toLowerCase())candidates.push(x)

}

for(const k of Object.keys(x)){

if(k==="racers"||k==="entries"||k==="participants"||k==="program"||k==="race_entries"||k==="boats"||k==="starting_list"||k==="startingList"){

let a=x[k];

if(Array.isArray(a)&&a.length>=6&&String(no)===target)candidates.push(x)

}else if(typeof x[k]==="object")walk(x[k])

}

}

walk(obj);

return candidates.find(x=>extractRaceEntries(x).length===6)||candidates[0]||null

}

function mergeRacerData(entry,extra){

let a=entry||{},b=extra||{};

return{

...b,

...a,

name:a.name||b.name||b.racer_name||b.player_name||"",

entry_number:num(a.entry_number||b.entry_number||b.entryNumber||b.boat_number)

}

}

async function fetchDaily(){

let t=today(),v=$("venue").value,r=$("race").value;

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let last=null;

for(const u of urls){

try{

let data=await json(u);

let race=findRace(data,v,r);

if(race)return race

}catch(e){last=e}

}

throw last||Error("出走表データを取得できませんでした")

}

function extractPreview(race){

let a=extractRaceEntries(race),o={};

a.forEach((x,i)=>{

let b=num(x.entry_number)||i+1;

o[b]={...x}

});

return o

}

function renderRace(){

if(!racers.length){

$("raceTable").innerHTML='<div class="noPick">出走表を取得してください。</div>';

return

}

$("raceTable").innerHTML=`

<div class="racers">

${racers.map((r,i)=>{

let b=num(r.entry_number)||i+1,

p=preview(b),

m=num(r.motor_top_2_percent||r.motor_2ren_rate||r.motor_2ren),

st=num(r.average_start_timing||r.average_st),

nw=num(r.national_win_rate||r.win_rate_national),

lw=num(r.local_win_rate||r.win_rate_local);

return`

<div class="racer">

<div class="racerTop">

<div class="number n${b}">${b}</div>

<div>

<div class="racerName">${esc(r.name||"-")}</div>

<div class="small">全国勝率 ${nw.toFixed(2)} / 当地勝率 ${lw.toFixed(2)}</div>

</div>

</div>

<div class="tech">

<div><span>モーター2連</span>${m?m.toFixed(1)+"%":"-"}</div>

<div><span>平均ST</span>${st?st.toFixed(2):"-"}</div>

<div><span>展示</span>${num(p.exhibition_time||p.exhibition)?num(p.exhibition_time||p.exhibition).toFixed(2):"-"}</div>

</div>

</div>`

function motorRate(b){

return num(

racer(b)?.motor_top_2_percent||

racer(b)?.motor_2ren_rate||

racer(b)?.motor_2ren

)

}

function recentFormValue(b){

return recentForm(b).score

}

function patternThirdScore(b,rankings,type){

let x=rankings.find(z=>z.boat===b);

if(!x)return -999;

let v=x.score;

v+=motorRate(b)*.35;

v+=recentFormValue(b)*4;

v+=suitability(b,type)*.35;

let dev=developmentBonus(b,rankings,type);

v+=dev.bonus*.8;

if(goodHistory(b))v+=5;

return v

}

function thirdProbabilityList(excluded,rankings,type){

let list=[];

for(let b=2;b<=6;b++){

if(excluded.includes(b))continue;

let v=patternThirdScore(b,rankings,type);

if(v<=-900)continue;

list.push({

boat:b,

value:v

})

}

list.sort((a,b)=>b.value-a.value);

let min=list.length?Math.min(...list.map(x=>x.value)):0;

let weights=list.map(x=>Math.max(.1,x.value-min+5));

let total=weights.reduce((s,x)=>s+x,0)||1;

list.forEach((x,i)=>{

x.prob=weights[i]/total*100

});

return list

}

function bestSecondNonOne(rankings){

return rankings.find(x=>x.boat!==1)?.boat||null

}

function patternTwoCandidates(rankings){

let avg=scoreAverage(rankings);

let eligible=[];

rankings.forEach((x,i)=>{

if(x.boat===1)return;

let lowAI=x.score<=avg-20;

let weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

eligible.push({

boat:x.boat,

rank:i+1,

score:x.score

})

});

let fourth=rankings[3],

fifth=rankings[4],

picked=[];

[fourth,fifth].forEach(x=>{

if(!x||x.boat===1)return;

let lowAI=x.score<=avg-20;

let weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

if(!picked.includes(x.boat))picked.push(x.boat)

});

if(!picked.length&&eligible.length){

picked.push(eligible[0].boat)

}

if(picked.length>2)picked=picked.slice(0,2);

return{

picked,

eligible,

avg

}

}

function renderThirdCandidates(list,secondBoats,firstBoat,forcedBoat){

if(!list.length)return'<div class="noPick">3着候補なし</div>';

return`

${list.map(x=>{

let forced=x.boat===forcedBoat;

let duplicate=secondBoats.includes(x.boat)||x.boat===firstBoat;

if(duplicate&&!forced)return"";

return`

<div class="thirdCandidate ${forced?"revival":"normal"}">

${x.boat}号艇

<span class="thirdProb">${x.prob.toFixed(1)}%</span>

${forced?'<span class="revivalLabel">⭐ AI80以上＋モーター35%以上</span>':""}

</div>`

}).join("")}

</div>`

}

if(forced6&&!p1Third.some(x=>x.boat===forced6.boat)){

p1Third.push({

prob:0,

forced:true

}

p1Third.sort((a,b)=>{

パターン1・パターン2の両方で3着候補へ無条件採用。
