<head>

<title>BOAT HUNTER</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  background:#080808;

  color:#fff;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

header{

  background:#000;

  border-bottom:1px solid #d4af37;

  padding:22px 15px;

  text-align:center;

}

.logo{

  font-size:30px;

  font-weight:900;

  letter-spacing:4px;

  color:#d4af37;

.tagline{

  font-size:12px;

}

  margin:auto;

  padding:18px;

}

.card{

  border:1px solid #292929;

.title{

}

label{

  color:#999;

  margin-bottom:6px;

}

select,

  padding:13px;

  margin-bottom:15px;

  border-radius:8px;

  border:1px solid #444;

  background:#0b0b0b;

  color:#fff;

}

button{

  width:100%;

  padding:16px;

  border:none;

  border-radius:10px;

  background:linear-gradient(135deg,#d4af37,#9b7418);

  margin-top:12px;

  font-size:13px;

}

.hidden{

  display:none;

}

.boats{

  display:grid;

  grid-template-columns:repeat(6,1fr);

  gap:8px;

}

  border:1px solid #333;

  border-radius:10px;

  padding:12px 5px;

  text-align:center;

}

.boat-number{

  font-size:23px;

  font-weight:900;

}

.boat-name{

  font-size:12px;

  margin-top:6px;

}

.boat-class{

  font-size:11px;

  color:#d4af37;

  margin-top:5px;

}

.metric{

  font-size:10px;

  color:#888;

  margin-top:5px;

}

.row{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:12px 0;

  border-bottom:1px solid #292929;

}

.row:last-child{

  border-bottom:none;

}

.left{

  color:#999;

}

.right{

  font-weight:900;

  text-align:right;

}

.gold{

  color:#d4af37;

}

.green{

  color:#65df8b;

}

.yellow{

  color:#ffd34d;

}

.red{

  color:#ff6f61;

}

.entry-grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

}

.entry-btn{

  background:#0d0d0d;

  color:#fff;

  border:1px solid #444;

  border-radius:8px;

  padding:14px 5px;

  font-size:16px;

  font-weight:900;

}

.entry-btn.selected{

  background:#d4af37;

  color:#000;

}

.entry-result{

  margin-top:15px;

  background:#0b0b0b;

  border:1px solid #333;

  border-radius:10px;

  padding:18px;

  text-align:center;

  font-size:28px;

  font-weight:900;

  color:#d4af37;

}

.reset-btn{

  margin-top:10px;

  background:#222;

  color:#fff;

}

.analyze-btn{

  margin-top:10px;

}

.rank{

  background:#0c0c0c;

  border:1px solid #292929;

  border-radius:10px;

  padding:14px;

  margin-bottom:9px;

}

.rank-number{

  color:#d4af37;

  font-weight:900;

}

.score{

  font-size:24px;

  font-weight:900;

  color:#d4af37;

  margin-top:6px;

}

.score-bar{

  height:8px;

  background:#222;

  border-radius:10px;

  margin-top:8px;

  overflow:hidden;

}

.score-fill{

  height:100%;

  background:#d4af37;

}

.pick-box{

  background:#0b0b0b;

  border:1px solid #333;

  border-radius:10px;

  padding:14px;

  margin-top:10px;

}

.pick-box.main{

  border-color:#d4af37;

}

.pick-title{

  font-size:15px;

  font-weight:900;

  color:#d4af37;

}

.pick{

  padding:10px 0;

  border-bottom:1px solid #222;

  font-size:19px;

  font-weight:900;

}

.pick:last-child{

  border-bottom:none;

}

.note{

  font-size:11px;

  color:#777;

  margin-top:7px;

  line-height:1.7;

}

.warning{

  background:#211b08;

  border:1px solid #8d6c16;

  padding:15px;

  border-radius:10px;

  line-height:1.7;

}

.ai-box{

  background:#0b0b0b;

  border:1px solid #3a3218;

  border-radius:10px;

  padding:15px;

  margin-top:10px;

}

footer{

  text-align:center;

  color:#444;

  font-size:11px;

  padding:25px;

}

@media(max-width:600px){

  .boats{

    grid-template-columns:repeat(3,1fr);

  }

  .logo{

    font-size:25px;

  }

}

</style>

<script>

/* =====================================

API

===================================== */

const PROGRAM_API =

"https://boatraceopenapi.github.io/programs/v3";

const PREVIEW_API =

"https://boatraceopenapi.github.io/previews/v3";

let raceData = null;

let previewData = null;

let selectedEntry = [];

/* =====================================

JST

===================================== */

function getJst(){

const now =

new Date();

const parts =

new Intl.DateTimeFormat(

"ja-JP",

{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).formatToParts(now);

const obj={};

parts.forEach(

p=>{

obj[p.type]=p.value;

}

);

return {

year:obj.year,

date:

obj.year+

obj.month+

obj.day

};

}

/* =====================================

安全表示

===================================== */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

/* =====================================

数値

===================================== */

function num(value){

if(

value===null ||

value===undefined ||

value===""

){

return null;

}

const n=Number(value);

return Number.isFinite(n)

?n

:null;

}

function fmt(value){

const n=num(value);

return n===null

?"--"

:n.toFixed(2);

}

/* =====================================

級別

===================================== */

function rankName(value){

const map={

1:"A1",

2:"A2",

3:"B1",

4:"B2"

};

return map[value] || "--";

}

/* =====================================

レース取得

===================================== */

async function loadRace(){

const stadium=

Number(

document.getElementById("venue").value

);

const raceNumber=

Number(

document.getElementById("race").value

);

const status=

document.getElementById("status");

status.innerHTML=

"⏳ 出走表を取得しています...";

document

.getElementById("result")

.classList.add("hidden");

try{

const jst=getJst();

const url=

PROGRAM_API+

"/"+

jst.year+

"/"+

jst.date+

".json";

console.log(

"PROGRAM API:",

url

);

const response=

await fetch(

url,

{

cache:"no-store"

}

);

if(!response.ok){

throw new Error(

"出走表API HTTP "+response.status

);

}

const data=

await response.json();

console.log(

"PROGRAM DATA:",

data

);

const race=

findRace(

data,

stadium,

raceNumber

);

if(!race){

throw new Error(

"指定したレースが見つかりません。"

);

}

raceData=race;

displayRace(race);

displayMotor(race);

createEntryButtons();

/* =====================================

直前情報

===================================== */

status.innerHTML=

"⏳ 直前情報を取得しています...";

try{

const previewUrl=

PREVIEW_API+

"/"+

jst.year+

"/"+

jst.date+

".json";

console.log(

"PREVIEW API:",

previewUrl

);

const previewResponse=

await fetch(

previewUrl,

{

cache:"no-store"

}

);

if(previewResponse.ok){

const previewJson=

await previewResponse.json();

previewData=

findRace(

previewJson,

stadium,

raceNumber

);

displayPreview(

previewData

);

}else{

displayPreview(null);

}

}catch(previewError){

console.warn(

"直前情報取得失敗:",

previewError

);

displayPreview(null);

}

document

.getElementById("result")

.classList.remove("hidden");

status.innerHTML=

"✅ 出走表取得完了";

}catch(error){

console.error(error);

status.innerHTML=

"❌ 取得失敗<br>"+

escapeHtml(error.message)+

"<br><small>日付・レースのデータがまだ公開されていない可能性があります。</small>";

}

}

/* =====================================

レース検索

===================================== */

function findRace(

data,

stadium,

raceNumber

){

/*

APIの構造差に対応

*/

const stadiumKey=

String(stadium);

const raceKey=

String(raceNumber);

/* programs.stadiums */

if(

data?.programs?.stadiums?.[stadiumKey]?.races?.[raceKey]

){

return data

.programs

.stadiums

[stadiumKey]

.races

[raceKey];

}

/* stadiums */

if(

data?.stadiums?.[stadiumKey]?.races?.[raceKey]

){

return data

.stadiums

[stadiumKey]

.races

[raceKey];

}

/* race */

if(

data?.races?.[stadiumKey]?.[raceKey]

){

return data

.races

[stadiumKey]

[raceKey];

}

/* programs.stadiumsが配列の場合 */

if(

Array.isArray(data?.programs?.stadiums)

){

const stadiumData=

data.programs.stadiums.find(

x=>

String(

x.stadium_number ??

x.stadium_id ??

x.id

)===stadiumKey

);

if(stadiumData){

if(

Array.isArray(stadiumData.races)

){

return stadiumData.races.find(

x=>

Number(

x.race_number ??

x.raceNo ??

x.number

)===raceNumber

);

}

}

}

return null;

}

/* =====================================

選手データ取得

===================================== */

function getRacers(race){

if(

race?.racers &&

!Array.isArray(race.racers)

){

return race.racers;

}

if(

Array.isArray(race?.racers)

){

const obj={};

race.racers.forEach(

r=>{

const no=

r.entry_number ??

r.number ??

r.boat_number;

if(no){

obj[String(no)]=r;

}

});

return obj;

}

if(

race?.entries

){

const obj={};

const arr=

Array.isArray(race.entries)

?race.entries

:Object.values(race.entries);

arr.forEach(

r=>{

const no=

r.entry_number ??

r.number ??

r.boat_number;

if(no){

obj[String(no)]=r;

}

});

return obj;

}

return {};

}

/* =====================================

出走表表示

===================================== */

function displayRace(race){

const boats=

document.getElementById("boats");

boats.innerHTML="";

const racers=

getRacers(race);

const list=

Object.values(racers)

.sort(

(a,b)=>

Number(

a.entry_number ??

a.number ??

a.boat_number

)-

Number(

b.entry_number ??

b.number ??

b.boat_number

)

);

if(!list.length){

boats.innerHTML=

'<div class="note">選手データがありません。</div>';

return;

}

list.forEach(

r=>{

const no=

r.entry_number ??

r.number ??

r.boat_number;

const name=

r.name ??

r.racer_name ??

r.racer?.name ??

"--";

const national=

r.national_win_rate ??

r.national_winrate;

const local=

r.local_win_rate ??

r.local_winrate;

const div=

document.createElement("div");

div.className="boat";

div.innerHTML=`

<div class="boat-number">

${escapeHtml(no)}

</div>

<div class="boat-name">

${escapeHtml(name)}

</div>

<div class="boat-class">

${rankName(

r.rank_number ??

r.rank

)}

</div>

<div class="metric">

全国 ${fmt(national)}

</div>

<div class="metric">

当地 ${fmt(local)}

</div>

<div class="metric">

M${escapeHtml(

r.motor_number ??

r.motor ??

"--"

)}

</div>

`;

boats.appendChild(div);

}

);

}

/* =====================================

モーター

===================================== */

function displayMotor(race){

const element=

document.getElementById(

"motorInfo"

);

const racers=

getRacers(race);

let html="";

Object.values(racers)

.sort(

(a,b)=>

Number(

a.entry_number ??

a.number ??

a.boat_number

)-

Number(

b.entry_number ??

b.number ??

b.boat_number

)

)

.forEach(

r=>{

const no=

r.entry_number ??

r.number ??

r.boat_number;

const motor=

r.motor_number ??

r.motor ??

"--";

const m2=

r.motor_top_2_percent ??

r.motor_2_rate ??

r.motor_2rentai;

const m3=

r.motor_top_3_percent ??

r.motor_3_rate ??

r.motor_3rentai;

html+=`

<div class="row">

<span class="left">

${no}号艇 M${motor}

</span>

<span class="right">

2連率 ${m2===undefined||m2===null?"--":fmt(m2)+"%"}

<br>

3連率 ${m3===undefined||m3===null?"--":fmt(m3)+"%"}

</span>

</div>

`;

});

element.innerHTML=

html ||

'<div class="note">モーター情報なし</div>';

}

/* =====================================

直前情報

===================================== */

function displayPreview(race){

const element=

document.getElementById(

"preview"

);

if(!race){

element.innerHTML=

'<div class="note">直前情報はまだ取得できません。</div>';

return;

}

const racers=

getRacers(race);

let html="";

Object.values(racers)

.sort(

(a,b)=>

Number(

a.entry_number ??

a.number ??

a.boat_number

)-

Number(

b.entry_number ??

b.number ??

b.boat_number

)

)

.forEach(

r=>{

const no=

r.entry_number ??

r.number ??

r.boat_number;

const course=

r.course_number ??

r.course ??

"--";

const st=

r.start_timing ??

r.st ??

r.start;

const exhibition=

r.exhibition_time ??

r.exhibition ??

r.exhibition_time_value ??

"--";

html+=`

<div class="row">

<span class="left">

${no}号艇

</span>

<span class="right">

進入 ${escapeHtml(course)}

　

ST ${escapeHtml(st ?? "--")}

　

展示 ${escapeHtml(exhibition ?? "--")}

</span>

</div>

`;

});

element.innerHTML=

html ||

'<div class="note">直前情報なし</div>';

}

/* =====================================

進入ボタン

===================================== */

function createEntryButtons(){

const container=

document.getElementById(

"entryButtons"

);

container.innerHTML="";

for(

let i=1;

i<=6;

i++

){

const button=

document.createElement(

"button"

);

button.className=

"entry-btn";

button.innerText=

i+"号艇";

button.onclick=

function(){

selectEntry(i);

};

container.appendChild(

button

);

}

}

/* =====================================

進入選択

===================================== */

function selectEntry(boat){

if(

selectedEntry.includes(boat)

){

return;

}

if(

selectedEntry.length>=6

){

return;

}

selectedEntry.push(boat);

updateEntry();

}

/* =====================================

進入表示

===================================== */

function updateEntry(){

document

.querySelectorAll(".entry-btn")

.forEach(

(button,index)=>{

button.classList.toggle(

"selected",

selectedEntry.includes(index+1)

);

}

);

document

.getElementById("entryResult")

.innerText=

selectedEntry.length

?selectedEntry.join("-")

:"進入を入力してください";

}

/* =====================================

リセット

===================================== */

function clearEntry(){

selectedEntry=[];

updateEntry();

document.getElementById(

"maezuke"

).innerHTML=

'<div class="note">本番進入を入力してください。</div>';

document.getElementById(

"development"

).innerHTML=

'<div class="note">解析待ち</div>';

document.getElementById(

"ranking"

).innerHTML=

'<div class="note">解析待ち</div>';

document.getElementById(

"final"

).innerHTML=

'<div class="note">解析待ち</div>';

document.getElementById(

"pickArea"

).innerHTML=

'<div class="note">解析待ち</div>';

}

/* =====================================

AI解析

===================================== */

function analyzeRace(){

if(!raceData){

alert(

"先に出走表を取得してください。"

);

return;

}

if(

selectedEntry.length!==6

){

alert(

"6艇すべての進入を入力してください。"

);

return;

}

const racers=

getRacers(raceData);

const entry=

selectedEntry;

const normal=

entry.join("")==="123456";

/* 前付け */

let changes=[];

for(

let i=0;

i<6;

i++

){

if(

entry[i]!==i+1

){

changes.push(

entry[i]+"号艇"

);

}

}

document.getElementById(

"maezuke"

).innerHTML=`

<div class="row">

<span class="left">

本番進入

</span>

<span class="right gold">

${entry.join("-")}

</span>

</div>

/* =====================================

AIスコア

===================================== */

function calcScore(

r,

entry

){

let score=0;

/* 全国勝率 */

score+=

Number(

r.national_win_rate ??

r.national_winrate ??

0

)*7;

/* 当地勝率 */

score+=

Number(

r.local_win_rate ??

r.local_winrate ??

0

)*4;

/* モーター */

score+=

Number(

r.motor_top_2_percent ??

r.motor_2_rate ??

0

)*0.15;

score+=

Number(

r.motor_top_3_percent ??

r.motor_3_rate ??

0

)*0.08;

/* ST */

const st=

Number(

r.average_start_timing ??

r.average_st ??

0

);

if(st>0){

score+=

Math.max(

0,

0.30-st

)*20;

}

/* コース */

const no=

Number(

r.entry_number ??

r.number ??

r.boat_number

);

const course=

entry.indexOf(no)+1;

if(course===1){

score+=10;

}

if(course===2){

score+=6;

}

if(course===3){

score+=5;

}

if(course===4){

score+=3;

}

if(course===5){

score+=1;

}

/* 級別 */

if(

Number(

r.rank_number ??

r.rank

)===1

){

score+=5;

}

if(

Number(

r.rank_number ??

r.rank

)===4

){

score-=2;

}

return Math.round(

score

);

}

/* =====================================

買い目

===================================== */

function createPicks(

ranking

){

const budget=

Number(

document.getElementById(

"budget"

).value

)||3000;

const a=ranking[0].number;

const b=ranking[1].number;

const c=ranking[2].number;

const d=ranking[3].number;

const e=ranking[4].number;

const hit=[

`${a}-${b}-${c}`,

`${a}-${c}-${b}`,

`${a}-${b}-${d}`,

`${a}-${d}-${b}`,

`${b}-${a}-${c}`,

`${b}-${c}-${a}`

];

const roi=[

`${a}-${b}-${c}`,

`${a}-${c}-${b}`,

`${a}-${b}-${d}`,

`${b}-${a}-${c}`,

`${b}-${c}-${a}`,

`${b}-${a}-${d}`,

`${c}-${a}-${b}`,

`${c}-${b}-${a}`,

`${c}-${a}-${d}`,

`${d}-${a}-${b}`,

`${e}-${a}-${b}`

];

const hitBudget=

Math.floor(

budget*0.6/100

)*100;

const roiBudget=

budget-hitBudget;

const hitUnit=

Math.max(

100,

Math.floor(

hitBudget/hit.length/100

)*100

);

const roiUnit=

Math.max(

100,

Math.floor(

roiBudget/roi.length/100

)*100

);

function make(

list,

unit

){

return list.map(

(p,i)=>`

<div class="pick">

${i+1}. ${p}

<span class="note">

${unit}円

</span>

</div>

`

).join("");

}

document.getElementById(

"pickArea"

).innerHTML=`

<div class="pick-box">

<div class="pick-title">

🟢 的中率重視

</div>

<div class="note">

AI上位を中心に絞る。

</div>

${make(hit,hitUnit)}

<div class="note">

配分：約${hitUnit*hit.length}円

</div>

</div>

<div class="pick-box main">

<div class="pick-title">

🔥 回収率重視

</div>

<div class="note">

上位だけでなく中位・穴まで含めて高配当を狙う。

</div>

${make(roi,roiUnit)}

<div class="note">

配分：約${roiUnit*roi.length}円

</div>

</div>

`;

}
