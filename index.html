*{box-sizing:border-box}

body{

.row:last-child{border-bottom:none}

.rank-number{color:#d4af37;font-weight:900}

.pick{font-size:24px;font-weight:900;color:#d4af37;margin-top:8px}

.note{font-size:11px;color:#777;margin-top:7px;line-height:1.8}

.warning{

}

.ai-box{

}

.score-bar{

 height:8px;background:#222;border-radius:10px;

 margin-top:8px;overflow:hidden

}

.score-fill{height:100%;background:#d4af37}

.pick-box{

 background:#0b0b0b;border:1px solid #333;

}

.pick-title{font-size:14px;font-weight:900;color:#d4af37}

}

.pick-line:last-child{border-bottom:none}

.pick-money{font-size:12px;color:#888;margin-left:8px}

.roi-main{

 border:1px solid #d4af37;

}

.info-grid{

 display:grid;grid-template-columns:repeat(2,1fr);

 gap:8px;margin-top:10px

}

.info-item{

 background:#0b0b0b;border:1px solid #292929;

 border-radius:8px;padding:10px

}

.info-label{font-size:10px;color:#777}

.info-value{font-size:14px;font-weight:900;margin-top:4px}

footer{text-align:center;color:#444;font-size:11px;padding:25px}

@media(max-width:600px){

 .boats{grid-template-columns:repeat(3,1fr)}

 .logo{font-size:25px}

}

<script>

"use strict";

/* ================================

API

================================ */

const API_URLS=[

"https://boatraceopenapi.github.io/api/v1/today.json",

"https://boatraceopenapi.github.io/programs/v3/today.json",

"https://boatraceopenapi.github.io/programs/v2/today.json"

];

let raceData=null;

let selectedEntry=[];

/* ================================

基本

================================ */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function format(v){

 if(v===null||v===undefined||v==="")return "-";

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(2):String(v);

}

function escapeHtml(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function getRank(v){

 return {

 1:"A1",

 2:"A2",

 3:"B1",

 4:"B2"

 }[num(v)]||"-";

}

/* ================================

API取得

================================ */

async function fetchJson(url){

 const r=await fetch(

  url+"?t="+Date.now(),

  {

   cache:"no-store",

   headers:{Accept:"application/json"}

  }

 );

 if(!r.ok)throw new Error("HTTP "+r.status);

 return await r.json();

}

/* ================================

レース検索

================================ */

function findRace(data,stadiumNumber,raceNumber){

 if(!data)return null;

 if(data.programs&&data.programs.stadiums){

  const s=data.programs.stadiums[String(stadiumNumber)];

  if(s&&s.races){

   const r=s.races[String(raceNumber)];

   if(r)return r;

  }

 }

 let found=null;

 function walk(obj){

  if(found||!obj||typeof obj!=="object")return;

  if(

   obj.stadium_number!==undefined &&

   num(obj.stadium_number)===stadiumNumber &&

   obj.race_number!==undefined &&

   num(obj.race_number)===raceNumber &&

   obj.racers

  ){

   found=obj;

   return;

  }

  Object.keys(obj).forEach(k=>{

   if(!found)walk(obj[k]);

  });

 }

 walk(data);

 return found;

}

function getRacers(race){

 if(!race)return [];

 if(Array.isArray(race.racers))

  return race.racers;

 if(race.racers&&typeof race.racers==="object")

  return Object.values(race.racers);

 return [];

}

function getBoatNumber(r){

 return num(r.entry_number??r.boat_number);

}

function getName(r){

 return r.name||r.racer_name||"選手名不明";

}

/* ================================

一周タイム取得

APIの項目名違いに対応

================================ */

function getLapTime(r){

 const keys=[

  "one_lap_time",

  "one_lap",

  "lap_time",

  "around_time",

  "one_round_time",

  "first_lap_time",

  "first_lap",

  "turn_time",

  "exhibition_lap_time",

  "exhibition_one_lap_time"

 ];

 for(const key of keys){

  if(

   r[key]!==undefined &&

   r[key]!==null &&

   r[key]!==""

  ){

   const value=num(r[key]);

   if(value>0)return value;

  }

 }

 return 0;

}

/* ================================

直前情報の選手検索

================================ */

function getPreviewRacer(race,boat){

 const p=race?.preview;

 if(!p)return null;

 const list=p.racers;

 if(Array.isArray(list)){

  return list.find(

   r=>getBoatNumber(r)===boat

  )||null;

 }

 if(list&&typeof list==="object"){

  const arr=Object.values(list);

  return arr.find(

   r=>getBoatNumber(r)===boat

  )||null;

 }

 return null;

}

/* ================================

一周タイムを取得

================================ */

function getRacerLapTime(r){

 const direct=getLapTime(r);

 if(direct>0)return direct;

 const boat=getBoatNumber(r);

 const previewRacer=getPreviewRacer(

  raceData,

  boat

 );

 if(previewRacer){

  const previewTime=getLapTime(previewRacer);

  if(previewTime>0)return previewTime;

 }

 return 0;

}

/* ================================

出走表

================================ */

function displayRace(race){

 const box=document.getElementById("boats");

 box.innerHTML="";

 const racers=getRacers(race)

 .sort(

  (a,b)=>getBoatNumber(a)-getBoatNumber(b)

 );

 if(racers.length<6){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 6艇の選手データを取得できませんでした。

  <br><br>

  取得数：<strong>${racers.length}艇</strong>

  </div>`;

  return false;

 }

 racers.forEach(r=>{

  const d=document.createElement("div");

  d.className="boat";

  const lap=getRacerLapTime(r);

  d.innerHTML=`

  <div class="boat-number">

  ${getBoatNumber(r)}

  </div>

  <div class="boat-name">

  ${escapeHtml(getName(r))}

  </div>

  <div class="boat-class">

  ${getRank(r.rank_number)}

  </div>

  <div class="metric">

  全国 ${format(r.national_win_rate)}

  </div>

  <div class="metric">

  当地 ${format(r.local_win_rate)}

  </div>

  <div class="metric">

  M${r.motor_number||"-"}

  </div>

  <div class="metric">

  M2連 ${format(r.motor_top_2_percent)}%

  </div>

  <div class="metric">

  M3連 ${format(r.motor_top_3_percent)}%

  </div>

  <div class="metric">

  ST ${format(r.average_start_timing)}

  </div>

  <div class="metric">

  一周 ${lap>0?format(lap)+"秒":"-"}

  </div>

  `;

  box.appendChild(d);

 });

 return true;

}

/* ================================

直前情報

================================ */

function displayPreview(race){

 const box=document.getElementById("previewInfo");

 const p=race.preview;

 if(!p){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 現在、直前情報はまだ取得できません。

  </div>`;

  return;

 }

 let html=`

 <div class="info-grid">

 <div class="info-item">

 <div class="info-label">風速</div>

 <div class="info-value">

 ${p.wind_speed??"-"} m

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">波高</div>

 <div class="info-value">

 ${p.wave_height??"-"} cm

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">気温</div>

 <div class="info-value">

 ${p.air_temperature??"-"} ℃

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">水温</div>

 <div class="info-value">

 ${p.water_temperature??"-"} ℃

 </div>

 </div>

 </div>

 `;

 const pr=p.racers

 ?Object.values(p.racers)

 :[];

 pr.sort(

  (a,b)=>num(a.entry_number)-num(b.entry_number)

 );

 if(pr.length){

  html+=`

  <div class="ai-box">

  <strong>

  📊 展示・直前情報

  </strong>

  `;

  pr.forEach(r=>{

   const lap=getLapTime(r);

   html+=`

   <div class="row">

   <span class="left">

   ${num(r.entry_number)}号艇

   </span>

   <span class="right">

   展示 ${format(r.exhibition_time)}秒

  　

   ST ${format(r.start_timing)}

   <br>

   一周

   <span class="gold">

   ${lap>0?format(lap)+"秒":"-"}

   </span>

   </span>

   </div>

   `;

  });

  html+="</div>";

 }

 box.innerHTML=html;

}

/* ================================

出走表取得

================================ */

async function loadRace(){

 const stadium=num(

  document.getElementById("venue").value

 );

 const raceNumber=num(

  document.getElementById("race").value

 );

 const status=

  document.getElementById("status");

 const apiInfo=

  document.getElementById("apiInfo");

 const btn=

  document.getElementById("loadButton");

 btn.disabled=true;

 btn.innerText="⏳ 取得中...";

 document

 .getElementById("result")

 .classList.add("hidden");

 let lastError=null;

 try{

  for(let i=0;i<API_URLS.length;i++){

   const url=API_URLS[i];

   status.innerHTML=

   `⏳ API ${i+1}/${API_URLS.length} を確認中...`;

   try{

    const data=await fetchJson(url);

    const race=findRace(

     data,

     stadium,

     raceNumber

    );

    if(!race){

     lastError=

     new Error(

      "指定レースがデータ内にありません"

     );

     continue;

    }

    const racers=getRacers(race);

    if(racers.length<6){

     lastError=

     new Error(

      "選手データが6艇ありません"

     );

     continue;

    }

    raceData=race;

    selectedEntry=[];

    displayRace(race);

    displayPreview(race);

    createEntryButtons();

    document

    .getElementById("result")

    .classList.remove("hidden");

    status.innerHTML=

    "✅ 出走表取得成功";

    apiInfo.innerHTML=`

    取得元：

    <strong>

    ${escapeHtml(url)}

    </strong>

    <br>

    会場番号：${stadium}

    <br>

    レース：${raceNumber}R

    <br>

    選手：${racers.length}名

    <br>

    API：Boatrace Open API

    `;

    btn.disabled=false;

    btn.innerText="🔥 出走表を取得";

    return;

   }catch(e){

    console.error(e);

    lastError=e;

   }

  }

  throw lastError||

  new Error(

   "APIから取得できませんでした"

  );

 }catch(e){

  status.innerHTML=

  `<span class="red">

  ❌ 出走表取得失敗

  </span>

  <br>

  ${escapeHtml(e.message)}

  `;

  apiInfo.innerHTML=`

  <div class="warning">

  APIからデータを取得できませんでした。

  <br><br>

  ${escapeHtml(e.message)}

  </div>

  `;

  btn.disabled=false;

  btn.innerText="🔥 出走表を取得";

 }

}

/* ================================

進入

================================ */

function createEntryButtons(){

 const box=

  document.getElementById("entryButtons");

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.addEventListener(

   "click",

   ()=>selectEntry(i)

  );

  box.appendChild(b);

 }

}

function selectEntry(boat){

 if(selectedEntry.includes(boat))return;

 if(selectedEntry.length>=6)return;

 selectedEntry.push(boat);

 updateEntryButtons();

 document.getElementById("entryResult")

 .innerText=

 selectedEntry.join("-");

}

function updateEntryButtons(){

 document

 .querySelectorAll(".entry-btn")

 .forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById("entryResult")

 .innerText=

 "進入を入力してください";

}

/* ================================

決まり手

================================ */

function getStyle(r){

 const win=

 r.winning_technique||

 r.decision_technique||

 r.technique||

 r.last_decision||

 "";

 return String(win).toLowerCase();

}

function styleScore(r,type){

 const text=getStyle(r);

 if(type==="差し"){

  if(text.includes("差"))return 10;

 }

 if(type==="まくり"){

  if(

   text.includes("まくり") &&

   !text.includes("差し")

  )return 10;

 }

 if(type==="まくり差し"){

  if(text.includes("まくり差"))return 12;

 }

 return 0;

}

/* ================================

枠別ST

================================ */

function getCourseST(r,course){

 const keys=[

  `course${course}_start_timing`,

  `course_${course}_start_timing`,

  `course${course}_st`,

  `course_${course}_st`

 ];

 for(const k of keys){

  if(

   r[k]!==undefined &&

   r[k]!==null &&

   r[k]!==""

  ){

   return num(r[k]);

  }

 }

 if(Array.isArray(r.course_start_timing)){

  return num(

   r.course_start_timing[course-1]

  );

 }

 if(

  r.course_start_timing &&

  typeof r.course_start_timing==="object"

 ){

  return num(

   r.course_start_timing[String(course)]

  );

 }

 return 0;

}

/* ================================

一周タイム コース補正

1コース基準

各コース +0.15秒

================================ */

function getLapExpected(course){

 return (course-1)*0.15;

}

function getLapAdjustedScore(r,course){

 const lap=getRacerLapTime(r);

 if(lap<=0)return 0;

 const expected=getLapExpected(course);

 /*

 一周タイムそのものの絶対値ではなく

 コースごとの基準からどれだけ優秀かを見る

 */

 const allLaps=[];

 getRacers(raceData).forEach(x=>{

  const t=getRacerLapTime(x);

  if(t>0)allLaps.push(t);

 });

 if(allLaps.length<2)return 0;

 const fastest=Math.min(...allLaps);

 /*

 実際のタイム差

 */

 const actualDiff=lap-fastest;

 /*

 期待されるコース差との差

 */

 const advantage=expected-actualDiff;

 /*

 0.05秒差ごとに評価。

 約0.15秒優秀なら大きく加点。

 */

 let score=advantage*45;

 if(advantage>=0.30)score+=8;

 else if(advantage>=0.20)score+=5;

 else if(advantage>=0.10)score+=3;

 else if(advantage<=-0.30)score-=8;

 else if(advantage<=-0.20)score-=5;

 else if(advantage<=-0.10)score-=3;

 return Math.round(score);

}

function calcScore(r,entry){

 let score=0;

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const motor2=

  num(r.motor_top_2_percent);

 const motor3=

  num(r.motor_top_3_percent);

 const national2=

  num(r.national_top_2_percent);

 const local2=

  num(r.local_top_2_percent);

 const st=

  num(r.average_start_timing);

 const rank=

  num(r.rank_number);

 const boat=

  getBoatNumber(r);

 const course=

  entry.indexOf(boat)+1;

 /* 選手能力 */

 score+=national*7;

 score+=local*4;

 score+=national2*.08;

 score+=local2*.06;

 /* ================================

 モーター

 強化版

 ================================ */

 score+=motor2*.25;

 score+=motor3*.10;

 /* 平均ST */

 if(st>0){

  score+=

  Math.max(0,.30-st)*20;

 }

 /* コース */

 const courseBonus={

 1:10,

 2:6,

 3:5,

 4:3,

 5:1,

 6:0

 };

 score+=

 courseBonus[course]||0;

 /* 級別 */

 if(rank===1)score+=5;

 if(rank===2)score+=2;

 if(rank===4)score-=2;

 if(course===1)score+=3;

 if(course===6)score-=1;

 /* 枠別ST */

 const courseST=

  getCourseST(r,course);

 if(courseST>0){

  score+=

  Math.max(0,.30-courseST)*18;

 }

 /* ================================

 一周タイム

 コース差0.15秒補正

 ================================ */

 score+=

 getLapAdjustedScore(

  r,

  course

 );

 /* ================================

 風・波

 ================================ */

 const p=raceData?.preview;

 if(p){

  const wind=num(p.wind_speed);

  const wave=num(p.wave_height);

  if(wind>=5){

   if(course<=3)score+=2;

   if(course>=5)score-=1;

  }

  if(wind>=6&&wave>=4){

   if(course<=3)score+=2;

   if(course>=4)score-=2;

  }

  if(wave>=5){

   if(course===1)score+=2;

   if(course===2)score+=1;

   if(course>=5)score-=1;

  }

 }

 return Math.round(score);

}

 const st3=

function applyDevelopmentScore(

 ranking,

 entry,

 attack

){

 const result=

  ranking.map(x=>({...x}));

 const add=(n,v)=>{

  const x=

   result.find(

    r=>r.number===n

   );

  if(x)x.score+=v;

 };

 const c1=entry[0];

 const c2=entry[1];

 const c3=entry[2];

 const c4=entry[3];

 const c5=entry[4];

 const c6=entry[5];

 if(attack==="差し"){

  add(c2,8);

  add(c1,7);

  add(c3,4);

  add(c4,2);

 }

 else if(attack==="まくり"){

  add(c3,8);

  add(c4,6);

  add(c5,4);

  add(c6,3);

  add(c1,-3);

 }

 else if(attack==="まくり差し"){

  add(c3,8);

  add(c4,5);

  add(c1,5);

  add(c2,4);

  add(c5,3);

 }

 else{

  add(c1,8);

  add(c2,4);

  add(c3,3);

 }

 return result.sort(

  (a,b)=>b.score-a.score

 );

}

/* ================================

確率

================================ */

function calculateProbabilities(ranking){

 const values=

  ranking.map(

   r=>Math.exp(r.score/12)

  );

 const total=

  values.reduce(

   (a,b)=>a+b,

   0

  );

 return ranking.map((r,i)=>{

  const first=

   values[i]/total;

  let second=0;

  let third=0;

  for(let j=0;j<6;j++){

   if(i===j)continue;

   second+=

    (values[j]/total)*

    (values[i]/

    (total-values[j]));

  }

  for(let j=0;j<6;j++){

   if(i===j)continue;

   for(let k=0;k<6;k++){

    if(k===i||k===j)continue;

    third+=

     (values[j]/total)*

     (values[k]/

     (total-values[j]))*

     (values[i]/

     (total-values[j]-values[k]));

   }

  }

  return {

   ...r,

   first:Math.round(first*100),

   second:Math.round(second*100),

   third:Math.round(third*100)

  };

 });

}
