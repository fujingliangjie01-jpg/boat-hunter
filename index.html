<script>

"use strict";

/* ==================================================

   API

================================================== */

const API_URL=

"https://boatraceopenapi.github.io/api/v1/today.json";

let raceData=null;

let selectedEntry=[];

/* ==================================================

   基本関数

================================================== */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(d):"-";

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

function getRank(v){

 return{

  1:"A1",

  2:"A2",

  3:"B1",

  4:"B2"

 }[num(v)]||"-";

}

/* ==================================================

   API取得

================================================== */

async function fetchJson(url){

 const response=

 await fetch(

  url+"?t="+Date.now(),

  {

   method:"GET",

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error(

   "HTTP "+response.status

  );

 }

 return await response.json();

}

function findRace(data,stadium,race){

 if(!data)return null;

 try{

  const direct=

   data?.programs

   ?.stadiums

   ?.[String(stadium)]

   ?.races

   ?.[String(race)];

  if(direct)return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)return;

  if(typeof o!=="object")return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* ==================================================

   レーサー

================================================== */

function getRacers(race){

 if(!race)return[];

 const racers=race.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)return[];

 const racers=preview.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function boatNo(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number

 );

}

function racerName(r){

 return(

  r?.name ||

  r?.racer_name ||

  "選手名不明"

 );

}

function previewFor(r){

 return getPreviewRacers(raceData)

 .find(

  x=>boatNo(x)===boatNo(r)

 )||{};

}

function getST(r){

 return num(

  firstValue(r,[

   "start_timing",

   "st",

   "start_time"

  ])

 );

}

function getExhibition(r){

 return num(

  firstValue(r,[

   "exhibition_time",

   "display_time",

   "exhibition"

  ])

 );

}

function getCourse(r){

 return num(

  firstValue(r,[

   "course_number",

   "course",

   "entry_course"

  ])

 );

}

/* ==================================================

   決まり手

================================================== */

function getDecision(r){

 return firstValue(r,[

  "decision",

  "decision_name",

  "winning_decision",

  "winning_decision_name",

  "kimarite",

  "kimarite_name",

  "winning_technique",

  "technique"

 ]);

}

function getWinCount(r,key){

 return num(

  firstValue(r,[

   key,

   key+"_count",

   key+"_number"

  ])

 );

}

function getAttackData(r){

 return{

  makuri:getWinCount(r,"makuri"),

  sashi:getWinCount(r,"sashi"),

  makurisashi:getWinCount(r,"makurisashi"),

  nige:getWinCount(r,"nige"),

  nuki:getWinCount(r,"nuki"),

  megumare:getWinCount(r,"megumare")

 };

}

/* ==================================================

   出走表表示

================================================== */

function displayRace(){

 const box=

 document.getElementById("boats");

 box.innerHTML="";

 const racers=

 getRacers(raceData)

 .sort(

  (a,b)=>boatNo(a)-boatNo(b)

 );

 if(racers.length<6){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 6艇の出走表を取得できませんでした。

   </div>

  `;

  return false;

 }

 racers.forEach(r=>{

  const p=

   previewFor(r);

  const st=getST(p);

  const ex=getExhibition(p);

  const div=

   document.createElement("div");

  div.className="boat";

  div.innerHTML=`

   <div class="boat-number">

    ${boatNo(r)}

   </div>

   <div class="boat-name">

    ${esc(racerName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${fmt(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${fmt(r.local_win_rate)}

   </div>

   <div class="metric">

    M${esc(r.motor_number||"-")}

   </div>

   <div class="metric">

    M2連 ${fmt(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${fmt(r.motor_top_3_percent)}%

   </div>

   <div class="metric st">

    ST ${st>0?fmt(st):"-"}

   </div>

   <div class="metric ex">

    展示 ${ex>0?fmt(ex):"-"}

   </div>

  `;

  box.appendChild(div);

 });

 return true;

}

/* ==================================================

   直前情報

================================================== */

function displayPreview(){

 const box=

 document.getElementById(

  "previewInfo"

 );

 const p=raceData?.preview;

 if(!p){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 直前情報なし

   </div>

  `;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">風向</div>

   <div class="info-value">

    ${p.wind_direction_number??"-"}

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* ==================================================

   展示情報

================================================== */

function displayPreviewRacers(){

 const box=

 document.getElementById(

  "previewRacers"

 );

 const racers=

 getPreviewRacers(raceData)

 .sort(

  (a,b)=>boatNo(a)-boatNo(b)

 );

 if(!racers.length){

  box.innerHTML=`

   <div class="warning">

   ⚠️ 展示・ST・直前進入データなし

   </div>

  `;

  return;

 }

 let html=`

 <table class="table">

 <thead>

 <tr>

  <th>艇</th>

  <th>進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  html+=`

  <tr>

   <td>

    ${boatNo(r)}号艇

   </td>

   <td class="gold">

    ${

     getCourse(r)>0

     ?getCourse(r)+"コース"

     :"－"

    }

   </td>

   <td class="orange">

    ${

     getST(r)>0

     ?fmt(getST(r))

     :"－"

    }

   </td>

   <td class="yellow">

    ${

     getExhibition(r)>0

     ?fmt(getExhibition(r))

     :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

 </table>

 `;

 box.innerHTML=html;

}

/* ==================================================

   進入

================================================== */

function createEntryButtons(){

 const box=

 document.getElementById(

  "entryButtons"

 );

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=

   document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.onclick=()=>{

   selectEntry(i);

  };

  box.appendChild(b);

 }

}

function selectEntry(n){

 if(selectedEntry.includes(n))

  return;

 if(selectedEntry.length>=6)

  return;

 selectedEntry.push(n);

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  selectedEntry.join("-");

}

function updateEntryButtons(){

 document.querySelectorAll(

  ".entry-btn"

 ).forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById(

  "entryResult"

 ).innerText=

  "進入を入力してください";

}

function getEntry(){

 if(selectedEntry.length===6)

  return [...selectedEntry];

 return[1,2,3,4,5,6];

}

/* ==================================================

   場特性

================================================== */

const STADIUM_TRAITS={

 1:{name:"桐生",nige:54,makuri:18,sashi:14,note:"イン優勢。ナイターは機力差も重視"},

function exhibitionComparison(){

 const entry=getEntry();

 const racers=

 getRacers(raceData);

 const rows=[];

 for(let i=1;i<entry.length;i++){

  const currentBoat=entry[i];

  const prevBoat=entry[i-1];

  const current=

   racers.find(

    r=>boatNo(r)===currentBoat

   );

  const prev=

   racers.find(

    r=>boatNo(r)===prevBoat

   );

  if(!current||!prev)

   continue;

  const ex1=

   getExhibition(

    previewFor(current)

   );

  const ex2=

   getExhibition(

    previewFor(prev)

   );

  if(ex1<=0||ex2<=0)

   continue;

  const diff=ex2-ex1;

  let bonus=0;

  if(diff>=0.15)

   bonus=10;

  else if(diff>=0.10)

   bonus=7;

  else if(diff>=0.08)

   bonus=4;

  rows.push({

   boat:currentBoat,

   prev:prevBoat,

   current:ex1,

   previous:ex2,

   diff,

   bonus

  });

 }

 return rows;

}

function baseScore(r,course){

 const national=

  num(r.national_win_rate);

 const local=

  num(r.local_win_rate);

 const n2=

  num(r.national_top_2_percent);

 const n3=

  num(r.national_top_3_percent);

 const l2=

  num(r.local_top_2_percent);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 const p=

  previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 let s=0;

 s+=national*6;

 s+=local*3;

 s+=n2*.08;

 s+=n3*.04;

 s+=l2*.04;

 s+=m2*.18;

 s+=m3*.07;

 if(st>0)

  s+=Math.max(0,.25-st)*25;

 if(ex>0)

  s+=Math.max(0,6.90-ex)*8;

 s+=({

  1:10,

  2:6,

  3:5,

  4:4,

  5:2,

  6:0

 }[course]||0);

 const rank=

  num(r.rank_number);

 if(rank===1)

  s+=5;

 if(rank===2)

  s+=3;

 if(rank===4)

  s-=2;

 const stadium=

  getStadiumTrait();

 if(course===1){

  s+=

   (stadium.nige-50)*.20;

 }

 const trait=

  racerTrait(r,course);

 if(trait.available){

  if(course>=3){

   if(trait.makuri>25)

    s+=4;

   if(trait.makurisashi>20)

    s+=3;

   if(trait.sashi>25)

    s+=2;

  }

  if(course===1&&trait.nige>30)

   s+=4;

 }

 const comparisons=

  exhibitionComparison();

 const cmp=

  comparisons.find(

   x=>x.boat===boatNo(r)

  );

 if(cmp)

  s+=cmp.bonus;

 return s;

}

================================================== */

function attackAbility(r,course){

 const p=

  previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 const m2=

  num(r.motor_top_2_percent);

 const m3=

  num(r.motor_top_3_percent);

 let s=0;

 if(st>0){

  if(st<=.12)s+=20;

  else if(st<=.15)s+=16;

  else if(st<=.18)s+=10;

  else if(st<=.20)s+=4;

 }

 if(ex>0){

  if(ex<=6.70)s+=15;

  else if(ex<=6.80)s+=10;

  else if(ex<=6.90)s+=4;

 }

 if(m2>=45)s+=15;

 else if(m2>=40)s+=11;

 else if(m2>=35)s+=7;

 else if(m2>=30)s+=3;

 if(m3>=65)s+=10;

 else if(m3>=60)s+=7;

 else if(m3>=55)s+=4;

 if(course>=4)s+=7;

 if(course===3)s+=5;

 if(course===2)s+=3;

 const trait=

  racerTrait(r,course);

 if(trait.available){

  s+=trait.makuri*.15;

  s+=trait.sashi*.10;

  s+=trait.makurisashi*.18;

 }

 return s;

}

  100-

  );

  getExhibition(

  if(firstEx>=6.95)

 if(firstM2>=40)

 if(firstM2<30)

 )

     course

    ),

    racerTrait(

     r,

     course

    )

  };

 })

 .sort(

  (a,b)=>b.score-a.score

 );

 const attacker=

  attacks[0]||null;

 if(attacker){

  if(attacker.score>=35){

   if(attacker.course>=4){

     Math.min(

     );

   }

  }

  if(

   attacker.trait.available &&

   attacker.trait.makurisashi>=25

  ){

   makurisashi+=7;

  }

 }

 nige=Math.max(5,nige);

 makuri=Math.max(5,makuri);

 sashi=Math.max(5,sashi);

 makurisashi=Math.max(5,makurisashi);

 const total=

  nige+

  makuri+

  sashi+

  makurisashi;

 return{

  nige:nige/total*100,

  makuri:makuri/total*100,

  sashi:sashi/total*100,

  makurisashi:makurisashi/total*100,

  attacker

 };

}

function validCombo(a,b,c){

 return(

  Number.isInteger(a)&&

  Number.isInteger(b)&&

  Number.isInteger(c)&&

  a>=1&&a<=6&&

  b>=1&&b<=6&&

  c>=1&&c<=6&&

  a!==b&&

  a!==c&&

  b!==c

 );

}

function addUnique(arr,a,b,c,reason){

 if(!validCombo(a,b,c))

  return;

 const combo=

  `${a}-${b}-${c}`;

 if(

  !arr.some(

   x=>x.combo===combo

  )

 ){

  arr.push({

   combo,

   reason

  });

 }

}

================================================== */

function roiValue(item,dev){

 const r=item.racer;

 let s=

  baseScore(

   r,

   item.course

  );

 const trait=

  racerTrait(

   r,

   item.course

  );

 if(trait.available){

  if(item.course>=3){

   s+=trait.makuri*.25;

   s+=trait.sashi*.18;

   s+=trait.makurisashi*.30;

  }

 }

 /* 攻め手 */

 if(

  dev.attacker &&

  item.boat===dev.attacker.boat

 ){

  s+=

   dev.makuri+

   dev.sashi+

   dev.makurisashi;

 }

 /*

  回収重視では

  イン逃げ率が低くても

  1号艇を穴候補として残す

 */

 if(

  item.course===1 &&

  dev.nige<45

 ){

  s+=3;

 }

 return s;

}

function buildROI(rank,dev,used){

 const entry=getEntry();

 const racers=

  getRacers(raceData);

 const list=

  racers.map(r=>{

   const boat=boatNo(r);

   return{

    boat,

    course:

     entry.indexOf(boat)+1,

    racer:r

   };

  });

 const arr=[];

 /* ==================================================

    展開シナリオ

 ================================================== */

 const scenarios=[

  {

   name:"まくり",

   percent:dev.makuri

  },

  {

   name:"差し",

   percent:dev.sashi

  },

  {

   name:"まくり差し",

   percent:dev.makurisashi

  }

 ];

 scenarios.sort(

  (a,b)=>b.percent-a.percent

 );

 for(const scenario of scenarios){

  if(arr.length>=10)

   break;

  const candidates=

   list

   .map(x=>({

    ...x,

    value:

     roiValue(

      x,

      dev

     )

   }))

   .sort(

    (a,b)=>b.value-a.value

   );

  const attacker=

   dev.attacker;

  if(

   attacker &&

   scenario.percent>=20

  ){

   const second=

    candidates.find(

     x=>x.boat!==attacker.boat

    );

   const third=

    candidates.find(

     x=>

      x.boat!==attacker.boat &&

      x.boat!==second?.boat

    );

   if(second&&third){

    const combo=

     `${attacker.boat}-${second.boat}-${third.boat}`;

    if(!used.includes(combo)){

     addUnique(

      arr,

      attacker.boat,

      second.boat,

      third.boat,

      `回収狙い：${scenario.name}${scenario.percent.toFixed(0)}%`

     );

    }

   }

  }

  /*

   ここが今回の重要ポイント

   イン逃げ率45%未満でも

   回収重視なら1号艇を穴として残す

  */

  if(

   dev.nige<45 &&

   scenario.percent>=18

  ){

   const second=

    candidates.find(

     x=>x.boat!==1

    );

   const third=

    candidates.find(

     x=>

      x.boat!==1 &&

      x.boat!==second?.boat

    );

   if(second&&third){

    const combo=

     `1-${second.boat}-${third.boat}`;

    if(!used.includes(combo)){

     addUnique(

      arr,

      1,

      second.boat,

      third.boat,

      `穴狙い：イン逃げ${dev.nige.toFixed(1)}%でも回収候補`

     );

    }

   }

  }

  /*

   45%以上は

   回収候補として普通に残す

  */

  if(

   dev.nige>=45 &&

   scenario.name==="差し"

  ){

   const second=

    candidates.find(

     x=>x.boat!==1

    );

   const third=

    candidates.find(

     x=>

      x.boat!==1 &&

      x.boat!==second?.boat

    );

   if(second&&third){

    const combo=

     `1-${second.boat}-${third.boat}`;

    if(!used.includes(combo)){

     addUnique(

      arr,

      1,

      second.boat,

      third.boat,

      `イン残り＋${scenario.name}`

     );

    }

   }

  }

 }

 /* ==================================================

    AI上位＋穴を組み合わせる

 ================================================== */

 const sorted=

  list

  .map(x=>({

   ...x,

   value:

    roiValue(

     x,

     dev

    )

  }))

  .sort(

   (a,b)=>b.value-a.value

  );

 for(let i=0;i<sorted.length;i++){

  if(arr.length>=10)

   break;

  for(let j=0;j<sorted.length;j++){

   if(arr.length>=10)

    break;

   for(let k=0;k<sorted.length;k++){

    if(arr.length>=10)

     break;

    const a=sorted[i];

    const b=sorted[j];

    const c=sorted[k];

    if(

     a.boat===b.boat||

     a.boat===c.boat||

     b.boat===c.boat

    )

     continue;

    const combo=

     `${a.boat}-${b.boat}-${c.boat}`;

    if(used.includes(combo))

     continue;

    /*

     回収重視では

     AI上位＋穴艇の組み合わせを優先

    */

    const rankA=

     rank.findIndex(

      x=>x.boat===a.boat

     );

    const rankB=

     rank.findIndex(

      x=>x.boat===b.boat

     );

    const rankC=

     rank.findIndex(

      x=>x.boat===c.boat

     );

    const hasHole=

     [a,b,c].some(

      x=>

       x.course>=4

    );

    const hasTop=

     [rankA,rankB,rankC]

     .some(

      x=>x>=0&&x<=2

     );

    if(

     hasHole||

     hasTop

    ){

     addUnique(

      arr,

      a.boat,

      b.boat,

      c.boat,

      hasHole

      ?"AI上位＋穴艇の回収期待値"

      :"AI評価＋展開期待値"

     );

    }

   }

  }

 }

 return arr.slice(0,10);

}

/* ==================================================

   絶対押さえる

================================================== */

function buildMustHit(rank,dev){

 const arr=[];

 const r1=rank[0]?.boat;

 const r2=rank[1]?.boat;

 const r3=rank[2]?.boat;

 /*

  55%以上だけ

  イン逃げを絶対押さえる

 */

 if(

  dev.nige>=55 &&

  [r1,r2].includes(1)

 ){

  addUnique(

   arr,

   1,

   r2,

   r3,

   `イン逃げ${dev.nige.toFixed(1)}%＋AI上位`

  );

  addUnique(

   arr,

   1,

   r3,

   r2,

   "イン逃げの2・3着入替"

  );

 }

 /*

  強い攻め

 */

 if(

  dev.attacker &&

  (

   dev.makuri>=30||

   dev.sashi>=30||

   dev.makurisashi>=25

  )

 ){

  addUnique(

   arr,

   dev.attacker.boat,

   r1,

   r2,

   "攻め手の展開確率が高い"

  );

 }

 return arr.slice(0,3);

}

/* ==================================================

   掛け金

================================================== */

function makeMoney(

 picks,

 budget,

 type

){

 if(!picks.length)

  return[];

 let total=

  Math.floor(

   num(budget)/100

  )*100;

 if(total<100)

  total=100;

 let weights=[];

 if(type==="hit"){

  weights=

   picks.map(

    (_,i)=>

     i<2?3:

     i<4?2:

     1

   );

 }else{

  weights=

   picks.map(

    (_,i)=>

     i<3?2:

     1

   );

 }

 const sum=

  weights.reduce(

   (a,b)=>a+b,

   0

  );

 let money=

  weights.map(

   w=>

    Math.floor(

     total*w/sum/100

    )*100

  );

 money=

  money.map(

   x=>Math.max(100,x)

  );

 let current=

  money.reduce(

   (a,b)=>a+b,

   0

  );

 while(current>total){

  const index=

   money

   .map(

    (x,i)=>({x,i})

   )

   .filter(

    x=>x.x>100

   )

   .sort(

    (a,b)=>b.i-a.i

   )[0];

  if(!index)

   break;

  money[index.i]-=100;

  current-=100;

 }

 let i=0;

 while(

  current+100<=total

 ){

  money[

   i%money.length

  ]+=100;

  current+=100;

  i++;

 }

 return money;

}

/* ==================================================

   買い目表示

================================================== */

function renderPickBox(

 title,

 subtitle,

 picks,

 cls,

 type,

 budget

){

 if(!picks.length)

  return"";

 const money=

  makeMoney(

   picks,

   budget,

   type

  );

 let total=0;

 let html=`

 <div class="pick-box ${cls}">

 <div class="pick-title">

  ${title}

  （${picks.length}点）

 </div>

 <div class="pick-sub">

  ${subtitle}

 </div>

 `;

 picks.forEach(

  (p,i)=>{

   const amount=

    money[i]||100;

   total+=amount;

   html+=`

   <div class="pick-item">

    <div class="pick-line">

     ${i+1}.

     ${p.combo}

     <span class="pick-money">

      ${amount.toLocaleString()}円

     </span>

    </div>

    <div class="pick-reason">

     ${esc(p.reason)}

    </div>

   </div>

   `;

  }

 );

 html+=`

 <div class="money-total">

  使用金額

  ${total.toLocaleString()}円

  ／

  予算

  ${num(budget).toLocaleString()}円

 </div>

 </div>

 `;

 return html;

}

 document.getElementById(

  </span>

 <div class="row">

  <span class="left">

 const budget=

  roi,

  "roi",

  "roi",

  budget

 );

 document.getElementById(

  "pickArea"

 ).innerHTML=

  html;

}

/* ==================================================

   出走表取得

================================================== */

async function loadRace(){

 const venue=

  num(

   document.getElementById(

    "venue"

   ).value

  );

 const race=

  num(

   document.getElementById(

    "race"

   ).value

  );

 const status=

  document.getElementById(

   "status"

  );

 const result=

  document.getElementById(

   "result"

  );

 const button=

  document.getElementById(

   "loadButton"

  );

 button.disabled=true;

 status.innerHTML=

  "⏳ 出走表を取得中...";

 result.classList.add(

  "hidden"

 );

 raceData=null;

 selectedEntry=[];

 try{

  const data=

   await fetchJson(

    API_URL

   );

  const raceObject=

   findRace(

    data,

    venue,

    race

   );

  if(!raceObject){

   throw new Error(

    "指定レースがデータ内にありません"

   );

  }

  const racers=

   getRacers(

    raceObject

   );

  if(racers.length<6){

   throw new Error(

    "6艇データを取得できませんでした"

   );

  }

  raceData=

   raceObject;

  const venueName=

   document

   .getElementById(

    "venue"

   )

   .selectedOptions[0]

   .textContent;

  document.getElementById(

   "apiInfo"

  ).innerHTML=`

   API：v1<br>

   競艇場：${venueName}<br>

   レース：${race}R<br>

   日付：${raceObject.date||"-"}<br>

   出走艇：${racers.length}艇

  `;

  displayRace();

  displayPreview();

  displayPreviewRacers();

  createEntryButtons();

  clearEntry();

  result.classList.remove(

   "hidden"

  );

  status.innerHTML=

   "✅ 出走表を取得しました";

 }catch(error){

  console.error(error);

  status.innerHTML=`

   ❌ 出走表取得失敗

   <br>

   ${esc(error.message)}

   <br><br>

   APIのデータ更新待ち、または

   指定レースのデータ未掲載の可能性があります。

  `;

 }finally{

  button.disabled=false;

 }

}
