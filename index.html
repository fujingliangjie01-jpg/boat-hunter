x;padding:10px;font-size:11px;line-height:1.8;margin-top:8px}.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}.attackSub{color:#aaa;margin-top:4px}.exclusion{background:#241414;border-left:3px solid #e55;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}.exclusionKeep{background:#171707;border-left:3px solid #d4af37;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}.revivalBox{background:#211a07;border-left:3px solid #ffd84d;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}.pickBox{background:#151515;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}.betHeader{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;background:#0d0d0d;border:1px solid #292929;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px;color:#888;text-align:center}.betRow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #292929}.betRow:last-child{border-bottom:0}.bet2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:bold}.bet2Number{background:#211a07;border:1px solid #8a6d1c;border-radius:6px;padding:5px 8px;color:#ffd84d}.betPercent{font-size:11px;color:#ffd84d;font-weight:bold}.thirdCandidates{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}.thirdCandidate{background:#101010;border:1px solid #333;border-radius:6px;padding:5px 6px;font-size:10px;color:#fff}.thirdCandidate.normal{border-color:#555}.thirdCandidate.revival{border-color:#d4af37;color:#ffd84d;background:#211a07}.thirdCandidate.warning{border-color:#8a4b4b;color:#ff9b9b}.revivalLabel{display:block;font-size:8px;color:#ffd84d;margin-top:2px}.betNote{font-size:9px;color:#777;margin-top:5px;line-height:1.5}.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px}.pick:last-child{border-bottom:0}.pickLeft{display:flex;align-items:center;gap:5px}.star{width:18px;min-width:18px;color:#ffd84d;font-size:15px;font-weight:bold}.prob{color:#ffd84d;font-weight:bold}.pick.veryStrong .prob,.pick.veryStrong strong{color:#ff3b30}.pick.veryStrong .prob{font-size:15px;font-weight:900}.pick.strong .prob,.pick.strong strong{color:#ffd84d}.pick.strong .prob{font-size:14px;font-weight:900}.pick.weak{opacity:.38}.total{background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;padding:10px;text-align:center;color:#d4af37;font-weight:bold;margin-bottom:8px}.budgetInfo{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:11px;line-height:1.6;color:#aaa}.budgetStrong{color:#d4af37;font-weight:bold}.noPick{font-size:11px;color:#777;padding:8px 0;line-height:1.6}.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.overviewBox{background:#101010;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}.overviewBox .label{font-size:10px;color:#888}.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}.overviewBox.main{border-color:#8a6d1c;background:#1c1709}.overviewReason{font-size:11px;color:#aaa;line-height:1.7;margin-top:8px}.venueBox{background:#101010;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}.venueBox strong{color:#d4af37}.formBox{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}.footer{text-align:center;color:#555;font-size:10px;padding:20px}.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}.betEscape{color:#ff9500}.betSashi{color:#4cd964}.betMaki{color:#ff5555}.betMakiSashi{color:#58a6ff}.recommendPick{opacity:.52}.recommendTitle{color:#888!important}.outlookBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}.outlookTitle{font-size:13px;font-weight:bold;color:#d4af37;margin-bottom:8px}.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}.outlookEscape{border-color:#7b2d2d;background:#241414}.outlookNonEscape{border-color:#285b8c;background:#0e1722}.outlookInactive{border-color:#333!important;background:#151515!important}.outlookLabel{font-size:10px;color:#aaa}.outlookValue{font-size:22px;font-weight:900;margin-top:3px}.outlookEscape .outlookValue{color:#ff5555}.outlookNonEscape .outlookValue{color:#58a6ff}.outlookInactive .outlookValue{color:#777}.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}.decisionPositive{color:#4cd964}.decisionWarning{color:#ffd84d}.decisionDanger{color:#ff5555}.decisionMuted{color:#777!important}.outlookBand-balanced{border-color:#2e8b57!important;background:#102014!important}.outlookBand-balanced .outlookValue{color:#4cd964!important}.outlookCaution{margin-top:8px;padding:11px;border:2px solid #ffd84d;border-radius:8px;background:#211a07;color:#ffd84d;text-align:center;font-weight:900;font-size:15px;letter-spacing:.7px;box-shadow:0 0 0 1px #8a6d1c inset}.outlookLow{border-color:#444!important;background:#151515!important}.outlookLow .outlookLabel,.outlookLow .outlookStatus{color:#777!important}.outlookLow .outlookValue{color:#777!important}.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}.aiDetail strong{color:#d4af37}.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}.patternExcluded{color:#777;text-decoration:line-through}@media(max-width:600px){.grid2{grid-template-columns:1fr}.courseGrid{grid-template-columns:repeat(2,1fr)}.racers{grid-template-columns:1fr}.overviewGrid{grid-template-columns:repeat(2,1fr)}.betHeader,.betRow{grid-template-columns:1fr 1.3fr}.decisionStats{grid-template-columns:repeat(2,1fr)}}</style>

<script>

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

let raceData=null,racers=[],previewRacers={},manualCourses={},historyData={},currentBets=null;

const HISTORY_RACES=15;

const HISTORY_DAYS=180;

const $=id=>document.getElementById(id);

const VENUE_NAMES={1:"桐生",2:"戸田",3:"江戸川",4:"平和島",5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",9:"津",10:"三国",11:"びわこ",12:"住之江",13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",17:"宮島",18:"徳山",19:"下関",20:"若松",21:"芦屋",22:"福岡",23:"唐津",24:"大村"};

const TODAY_VENUE_FALLBACK={"20260821":[2,3,4,6,7,13,15,16,19,21,23,24]};

function collectTodayVenues(data){

let active=new Set();

function add(v){let n=Number(v);if(Number.isInteger(n)&&n>=1&&n<=24)active.add(n)}

function walk(obj){

if(obj==null)return;

if(Array.isArray(obj)){obj.forEach(walk);return}

if(typeof obj!=="object")return;

add(obj.stadium_number??obj.stadiumNumber??obj.venue_number??obj.venueNumber??obj.stadiumNo??obj.venueNo);

for(const key of Object.keys(obj)){

if((key==="stadiums"||key==="venues")&&obj[key]&&typeof obj[key]==="object"){

for(const [k,v] of Object.entries(obj[key])){if(/^([1-9]|1[0-9]|2[0-4])$/.test(String(k)))add(k);walk(v)}

}else walk(obj[key]);

}

}

walk(data);

return Array.from(active).sort((a,b)=>a-b)

}

async function filterTodayVenues(){

const sel=$("venue");

if(!sel)return;

const keep=sel.value;

const t=today();

const urls=[`${API_V1}/today.json`,`${API_V1}/${t.year}/${t.ymd}.json`,`${API_V3}/today.json`,`${API_V3}/${t.year}/${t.ymd}.json`,`${API_V2}/today.json`,`${API_V2}/${t.year}/${t.ymd}.json`];

let active=[];

for(const url of urls){

try{

const data=await json(url);

active=collectTodayVenues(data);

if(active.length)break;

}catch(e){}

}

if(!active.length)active=TODAY_VENUE_FALLBACK[t.ymd]||[];

if(!active.length)return;

sel.innerHTML=active.map(v=>`<option value="${v}">${VENUE_NAMES[v]}</option>`).join("");

sel.value=active.includes(Number(keep))?keep:String(active[0]);

}

const num=v=>{

if(v==null||v==="")return 0;

let x=parseFloat(String(v).replace(/[%,秒,]/g,""));

return Number.isFinite(x)?x:0

};

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function course(b){return Number(manualCourses[b]||b)}

function racer(b){return racers.find(x=>num(x.entry_number)===b)}

function preview(b){return previewRacers[b]||previewRacers[String(b)]||{}}

function today(){

let p=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());

return{year:p.find(x=>x.type==="year").value,ymd:p.find(x=>x.type==="year").value+p.find(x=>x.type==="month").value+p.find(x=>x.type==="day").value}

}

function dateInfo(d){

return{year:String(d.getFullYear()),ymd:String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}

}

async function json(url){

let r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

return r.json()

}

function normalizeEntry(x,i){

if(x==null||typeof x!=="object")return null;

let entry=num(x.entry_number??x.entryNumber??x.boat_number??x.boatNumber??x.boat_no??x.number_boat??x.boat??x.lane??x.lane_number??x.laneNumber??x.course_number??x.course??x.entry??x.number);

if(!entry&&i<6)entry=i+1;

let name=x.name??x.racer_name??x.racerName??x.player_name??x.playerName??x.racer??x.player??x.racers_name??"";

if(typeof name==="object")name=name.name||name.racer_name||name.player_name||"";

return{...x,entry_number:entry,name:name}

}

function extractRaceEntries(race){

if(!race)return[];

const directCandidates=[race.racers,race.entries,race.participants,race.program,race.race_entries,race.racer,race.players,race.boats,race.starting_list,race.startingList,race.entry_list,race.entryList,race.raceRacers,race.race_entries_list];

for(const source of directCandidates){

if(!source)continue;

let arr=Array.isArray(source)?source:Object.values(source);

let list=arr.map((x,i)=>normalizeEntry(x,i)).filter(x=>x&&x.entry_number>=1&&x.entry_number<=6);

let unique=new Map();

list.forEach(x=>{if(!unique.has(x.entry_number))unique.set(x.entry_number,x)});

let result=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

if(result.length===6)return result

}

let found=[];

function walk(root){

if(root==null)return;

if(Array.isArray(root)){root.forEach(walk);return}

if(typeof root!=="object")return;

let e=normalizeEntry(root,found.length);

if(e&&e.entry_number>=1&&e.entry_number<=6&&e.name)found.push(e);

Object.keys(root).forEach(k=>walk(root[k]))

}

walk(race);

let unique=new Map();

found.forEach(x=>{if(!unique.has(x.entry_number))unique.set(x.entry_number,x)});

let list=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

return list.length===6?list:[]

}

function findRace(data,venue,raceNo){

let found=null;

function walk(obj){

if(found||obj==null)return;

if(Array.isArray(obj)){for(const item of obj){walk(item);if(found)break}return}

if(typeof obj!=="object")return;

const rn=obj.race_number??obj.raceNumber??obj.race_no??obj.raceNo??obj.raceno??obj.number;

const vn=obj.stadium_number??obj.stadiumNumber??obj.venue_number??obj.venueNumber??obj.stadiumNo??obj.venueNo;

if(rn!=null&&String(rn)===String(raceNo)&&(vn==null||String(vn)===String(venue))){

let list=extractRaceEntries(obj);

if(list.length===6){found=obj;return}

}

for(const key of Object.keys(obj)){walk(obj[key]);if(found)break}

}

walk(data);

return found

}

function directRace(data,v,r){

const paths=[data?.programs?.stadiums?.[String(v)]?.races?.[String(r)],data?.programs?.stadiums?.[String(v)]?.races?.[Number(r)],data?.stadiums?.[String(v)]?.races?.[String(r)],data?.stadiums?.[String(v)]?.races?.[Number(r)],data?.races?.[String(r)],data?.races?.[Number(r)]];

for(const x of paths){if(x&&extractRaceEntries(x).length===6)return x}

const raceArrays=[data?.programs?.stadiums?.[String(v)]?.races,data?.stadiums?.[String(v)]?.races,data?.races,data?.programs?.races];

for(const arr of raceArrays){

if(!arr)continue;

const list=Array.isArray(arr)?arr:Object.values(arr);

const x=list.find(z=>{const rn=z?.race_number??z?.raceNumber??z?.race_no??z?.raceNo;return String(rn)===String(r)&&extractRaceEntries(z).length===6});

if(x)return x

}

return findRace(data,v,r)

}

async function loadDaily(){

let t=today(),v=$("venue").value,r=$("race").value;

const urls=[`${API_V1}/today.json`,`${API_V1}/${t.year}/${t.ymd}.json`,`${API_V3}/today.json`,`${API_V3}/${t.year}/${t.ymd}.json`,`${API_V2}/today.json`,`${API_V2}/${t.year}/${t.ymd}.json`];

let errors=[];

for(const url of urls){

try{

let data=await json(url);

let race=directRace(data,v,r);

if(race){

let list=extractRaceEntries(race);

if(list.length===6)return{data,race,base:url};

errors.push(url+" : race found but entries="+list.length)

}else errors.push(url+" : race not found")

}catch(e){errors.push(url+" : "+e.message)}

}

throw Error("APIから6艇の出走表を取得できませんでした.\n"+errors.slice(-3).join("\n"))

}

function initCourses(){

for(let b=1;b<=6;b++){

let e=$("course"+b);

e.innerHTML="";

for(let c=1;c<=6;c++)e.add(new Option(c+"コース",c));

e.value=String(b);

manualCourses[b]=b;

e.onchange=()=>manualCourses[b]=Number(e.value)

}

}

function resetCourses(){

for(let b=1;b<=6;b++){

$("course"+b).value=String(b);

manualCourses[b]=b

}

$("message").innerHTML='<span class="success">🔄 進入入力をリセットしました</span>'

}

async function loadRaceData(){

$("message").innerHTML='<span class="loading">⏳ 出走表を取得中...</span>';

$("raceCard").style.display="none";

$("analysisCard").style.display="none";

historyData={};

currentBets=null;

try{

let api=await loadDaily();

raceData=api.race;

function rank(n){return{1:"A1",2:"A2",3:"B1",4:"B2"}[num(n)]||"-"}

function hstats(b){

let no=getRacerNumber(racer(b));

let c=course(b);

let arr=historyData[no]?.boats?.[c]||[];

let first=arr.filter(x=>x.finish===1).length;

let second=arr.filter(x=>x.finish===2).length;

let third=arr.filter(x=>x.finish===3).length;

return{count:arr.length,first,second,third,rate:arr.length?(first+second+third)/arr.length*100:0,list:arr}

}

function recentForm(b){

let r=racer(b)||{};

let no=getRacerNumber(r);

let arr=historyData[no]?.recent||[];

if(!arr.length)return{score:0,label:"データなし"};

let recent=arr.slice(0,15);

let score=0;

recent.forEach((x,i)=>{

let f=num(x.finish);

let w=15-i;

if(f===1)score+=2.5*w/15;

else if(f===2)score+=1.5*w/15;

else if(f===3)score+=.7*w/15;

else if(f>=5)score-=1*w/15

});

return{score,label:score>=4?"好調":score<=-2?"不調":"普通"}

}

function decisions(r){

let b=num(r?.entry_number),no=getRacerNumber(r),c=course(b),arr=historyData[no]?.boats?.[c]||[],n=arr.length||0;

if(!n)return{escape:0,sashi:0,maki:0,makiSashi:0,makareRate:0,sasareRate:0,makiSashiSareRate:0};

let firstArr=arr.filter(x=>x.finish===1);

let firstCount=firstArr.length;

let sashi=firstArr.filter(x=>x.decision==="差し").length/n*100;

let maki=firstArr.filter(x=>x.decision==="まくり").length/n*100;

let makiSashi=firstArr.filter(x=>x.decision==="まくり差し").length/n*100;

let escape=firstArr.filter(x=>x.decision==="逃げ").length/n*100;

let makare=arr.filter(x=>x.finish!==1&&x.againstDecision==="まくり").length/n*100;

let sasare=arr.filter(x=>x.finish!==1&&x.againstDecision==="差し").length/n*100;

let makiSashiSare=arr.filter(x=>x.finish!==1&&x.againstDecision==="まくり差し").length/n*100;

return{escape,sashi,maki,makiSashi,makareRate:makare,sasareRate:sasare,makiSashiSareRate:makiSashiSare}

}

async function loadHistoryAsync(t,v,targets){

let days=[];

for(let i=1;i<=HISTORY_DAYS&&days.length<HISTORY_RACES;i++){

let d=new Date(Number(t.year),Number(t.ymd.slice(4,6))-1,Number(t.ymd.slice(6,8)));

d.setDate(d.getDate()-i);

days.push(dateInfo(d))

}

for(let i=0;i<days.length;i+=10){

let batch=days.slice(i,i+10);

await Promise.all(batch.map(d=>loadHistoryDay(d,targets)));

if(Object.values(targets).every(x=>Object.values(x.boats).some(a=>a.length>=HISTORY_RACES)))break

}

}

}

}

function addResultRace(race,targets,wanted){

let result=race.result||race.results||race.race_result||race.raceResult||race.finish;

if(!result)return;

let rows=Array.isArray(result)?result:Object.values(result);

let order=rows.map((x,i)=>{

let b=num(x.entry_number??x.entryNumber??x.boat_number??x.boatNumber??x.boat??x.lane??x.course??x.number??x.rank);

let finish=num(x.finish??x.finish_position??x.finishPosition??x.rank??x.result);

return{b,finish,x}

}).filter(x=>x.b>=1&&x.b<=6&&x.finish>=1&&x.finish<=6).sort((a,b)=>a.finish-b.finish);

if(order.length<3)return;

let winner=order[0];

let winningDecision=winner.x.decision??winner.x.deciding??winner.x.determined_by??winner.x.kimete??winner.x.result_type??winner.x.win_method??winner.x.method??"-";

let date=race.date??race.race_date??race.raceDate??"";

let place=race.place??race.venue_name??race.venueName??race.stadium_name??race.stadiumName??"";

order.forEach(o=>{

let no=wanted?getRacerNumber(o.x):null;

if(!no)return;

let c=num(o.x.course??o.x.entry_course??o.x.entryCourse??o.x.lane??o.x.start_course);

if(c<1||c>6)return;

if(!targets[no])targets[no]={recent:[],boats:{1:[],2:[],3:[],4:[],5:[],6:[]}};

if(!targets[no].boats[c])targets[no].boats[c]=[];

if(targets[no].boats[c].length>=HISTORY_RACES)return;

let ownDecision=o.x.decision??o.x.deciding??o.x.determined_by??o.x.kimete??o.x.result_type??o.x.win_method??o.x.method??"-";

targets[no].boats[c].push({date,place,course:c,finish:o.finish,decision:ownDecision,againstDecision:winningDecision&&winningDecision!=="-"?winningDecision:null});

if(targets[no].recent.length<15)targets[no].recent.push({date,finish:o.finish})

})

}

function collectHistoryFromDay(data,targets){

let stadiums=data?.programs?.stadiums||data?.stadiums||data?.programs?.venues||data?.venues;

if(!stadiums)return;

let stadiumList=Array.isArray(stadiums)?stadiums:Object.values(stadiums);

stadiumList.forEach(stadium=>{

let races=stadium?.races||stadium?.race||stadium?.programs;

if(!races)return;

let list=Array.isArray(races)?races:Object.values(races);

list.forEach(race=>{if(race?.result||race?.results||race?.race_result)addResultRace(race,targets)})

})

}

function windInfo(){

let w=raceData?.weather||raceData?.weather_info||raceData?.weatherInfo||raceData?.conditions||{};

let speed=num(w.wind_speed??w.windSpeed??w.wind??w.wind_velocity);

let dir=String(w.wind_direction??w.windDirection??w.wind_dir??w.direction??"").toLowerCase();

let mode="none";

if(/向|追|tail|following/.test(dir))mode="tail";

else if(/向か|head|against/.test(dir))mode="head";

return{speed,label:dir||"風向不明",mode}

}

function motorRate(b){return num(racer(b)?.motor_top_2_percent||racer(b)?.motor_2ren_rate||racer(b)?.motor_2ren)}

function sameCourseRate(b){

let h=hstats(b);

return h.rate

}

function ranking(){

let a=racers.map(r=>{

let b=num(r.entry_number),d=decisions(r),h=hstats(b),f=recentForm(b),m=motorRate(b),n=num(r.national_win_rate||r.win_rate_national),l=num(r.local_win_rate||r.win_rate_local),courseFit=sameCourseRate(b);

let score=n*8+l*5+m*.35+courseFit*.25+f.score*4;

score+=b===1?d.escape*1.2:(d.sashi+d.maki+d.makiSashi)*.4;

let vt=venueTrait();

if(b===1)score*=vt.escape;

if(b>=2){score+=d.sashi*vt.sashi*.4+d.maki*vt.maki*.4+d.makiSashi*vt.makiSashi*.4}

return{boat:b,racer:r,score}

});

return a.sort((a,b)=>b.score-a.score)

}

function scoreAverage(a){return a.length?a.reduce((s,x)=>s+x.score,0)/a.length:0}

function goodHistory(b){let h=hstats(b);return h.count>=8&&h.rate>=55}

function developmentBonus(b,rankings,type){

let idx=rankings.findIndex(x=>x.boat===b);

if(idx<0)return{bonus:0,reason:""};

let bonus=0,reason=[];

if(type==="maki"&&b===idx+2){bonus+=8;reason.push("まくり後ろ")}

if(type==="makiSashi"&&b===idx+2){bonus+=6;reason.push("まくり差し展開")}

if(type==="escape"&&b===1){bonus+=5;reason.push("1号艇残り")}

return{bonus,reason:reason.join("・")}

}

function classification(b,rankings){

let avg=scoreAverage(rankings),x=rankings.find(z=>z.boat===b);

if(!x)return{type:"normal"};

if(x.score<=avg-35)return{type:"cut"};

if(x.score>=avg+15)return{type:"strong"};

if(x.score>=avg-5)return{type:"normal"};

return{type:"third"}

}

function overallEscapeProbability(){

let r1=racer(1);

let d1=decisions(r1);

let h1=hstats(1);

let vt=venueTrait();

let n=num(r1?.national_win_rate||r1?.win_rate_national);

let l=num(r1?.local_win_rate||r1?.win_rate_local);

let m=motorRate(1);

let base=45;

base+=(n-5)*3;

base+=(l-5)*2;

base+=(m-30)*.12;

base+=h1.rate>=60?8:h1.rate>=50?4:h1.rate>=40?0:-5;

base+=d1.escape>=50?10:d1.escape>=35?5:-3;

base*=vt.escape;

let wi=windInfo();

if(wi.mode==="tail"&&wi.speed>=3)base+=4;

if(wi.mode==="head"&&wi.speed>=3)base-=5;

base=Math.max(5,Math.min(95,base));

let non=100-base;

let band=base>=60?"escapeHigh":non>=60?"nonEscapeHigh":"balanced";

let status=base>=83?"🔥 鉄板激アツ":base>=65?"🔴 期待大":base>=50?"🟢 標準":"🔵 イン以外警戒";

return{escape:base,nonEscape:non,status,band}

}

function patternThirdScore(b,rankings,type){

let x=rankings.find(z=>z.boat===b);

if(!x)return-999;

let v=x.score;

v+=motorRate(b)*.35;

v+=recentFormValue(b)*4;

v+=suitability(b,type)*.35;

let dev=developmentBonus(b,rankings,type);

v+=dev.bonus*.8;

if(goodHistory(b))v+=5;

return v

}

function recentFormValue(b){return recentForm(b).score}

function thirdProbabilityList(excluded,rankings,type){

let list=[];

for(let b=2;b<=6;b++){if(excluded.includes(b))continue;let v=patternThirdScore(b,rankings,type);if(v<=-900)continue;list.push({boat:b,value:v})}

list.sort((a,b)=>b.value-a.value);

let min=list.length?Math.min(...list.map(x=>x.value)):0;

let weights=list.map(x=>Math.max(.1,x.value-min+5));

let total=weights.reduce((s,x)=>s+x,0)||1;

list.forEach((x,i)=>{x.prob=weights[i]/total*100});

return list

}

function bestSecondNonOne(rankings){return rankings.find(x=>x.boat!==1)?.boat||null}

function patternTwoCandidates(rankings){

let avg=scoreAverage(rankings),eligible=[];

rankings.forEach((x,i)=>{if(x.boat===1)return;let lowAI=x.score<=avg-20,weakMotor=motorRate(x.boat)<30;if(lowAI&&weakMotor)return;eligible.push({boat:x.boat,rank:i+1,score:x.score})});

let fourth=rankings[3],fifth=rankings[4],picked=[];

[fourth,fifth].forEach(x=>{if(!x||x.boat===1)return;let lowAI=x.score<=avg-20,weakMotor=motorRate(x.boat)<30;if(lowAI&&weakMotor)return;if(!picked.includes(x.boat))picked.push(x.boat)});

if(!picked.length&&eligible.length)picked.push(eligible[0].boat);

if(picked.length>2)picked=picked.slice(0,2);

return{picked,eligible,avg}

}

}

function renderRanking(a){

$("ranking").innerHTML=`<table><tr><th>順位</th><th>艇</th><th>選手</th><th>AI</th><th>進入</th><th>全国勝率</th><th>当地勝率</th><th>モーター2連</th><th>同コース3連対</th><th>調子</th></tr>${a.map((x,i)=>{let r=x.racer,s=hstats(x.boat),c=classification(x.boat,a),f=recentForm(x.boat),escapeEval=decisionEvaluation(x.boat,"escape"),sashiEval=decisionEvaluation(x.boat,"sashi"),makiEval=decisionEvaluation(x.boat,"maki"),makiSashiEval=decisionEvaluation(x.boat,"makiSashi");let status=c.type==="cut"?"<br><span style='color:#ff5555;font-size:9px'>✂️3着切候補</span>":c.type==="third"?"<br><span style='color:#ffd84d;font-size:9px'>△3着まで</span>":"";return`<tr><td>${i+1}</td><td><strong>${x.boat}</strong>${status}</td><td>${esc(r?.name||r?.racer_name||r?.player_name||"-")}</td><td><strong>${x.score.toFixed(1)}</strong></td><td>${course(x.boat)}</td><td>${num(r?.national_win_rate||r?.win_rate_national).toFixed(2)}</td><td>${num(r?.local_win_rate||r?.win_rate_local).toFixed(2)}</td><td>${num(r?.motor_top_2_percent||r?.motor_2ren_rate||r?.motor_2ren).toFixed(1)}%</td><td>${s.count?s.rate.toFixed(1)+"%":"-"}</td><td><span style="color:${f.score>=3?"#4cd964":f.score<=-2?"#ff5555":"#aaa"}">${f.label}</span></td></tr><tr><td colspan="10" style="padding:3px 5px 7px;font-size:9px;color:#777;text-align:left">決まり手評価：${x.boat===1?`逃げ ${decisions(r).escape.toFixed(1)}% / ${escapeEval.label} / ${decisions(r).makareRate.toFixed(1)}%まくられ / ${decisions(r).sasareRate.toFixed(1)}%差され / ${decisions(r).makiSashiSareRate.toFixed(1)}%まくり差され`:`差し ${decisions(r).sashi.toFixed(1)}%(${sashiEval.label}) / まくり ${decisions(r).maki.toFixed(1)}%(${makiEval.label}) / まくり差し ${decisions(r).makiSashi.toFixed(1)}%(${makiSashiEval.label})`}</td></tr>`}).join("")}</table>`

}

function renderAttack(o){

let wi=windInfo();

let main=dominant(o);

let attacker=rankings().find(x=>x.boat!==1)?.boat||2;

let headline=main==="escape"?"イン逃げ中心":main==="sashi"?"差し中心":main==="maki"?"まくり中心":"まくり差し中心";

let mt=Object.entries(o).filter(([k])=>["escape","sashi","maki","makiSashi"].includes(k)).sort((a,b)=>b[1]-a[1]);

let outlook=overallEscapeProbability();

let outlookBand=outlook.band;

let escapeClass=outlook.escape>=65?"decisionDanger":outlook.escape>=50?"decisionPositive":"decisionMuted";

let nonEscapeClass=outlook.nonEscape>=65?"decisionDanger":outlook.nonEscape>=50?"decisionPositive":"decisionMuted";

let escapeLowClass=outlookBand==="nonEscapeHigh"?"outlookLow":"";

let nonEscapeLowClass=outlookBand==="escapeHigh"?"outlookLow":"";

$("attack").innerHTML=`<div class="attackBox"><div class="attackMain">${headline}</div><div class="attackSub">逃げ：${o.escape.toFixed(1)}%<br>差し：${o.sashi.toFixed(1)}%<br>まくり：${o.maki.toFixed(1)}%<br>まくり差し：${o.makiSashi.toFixed(1)}%<br><br><strong style="color:#d4af37">風展開</strong><br>${wi.mode==="head"&&wi.speed>=3?"🌬️ 向かい風3m以上 → アウトコース有利。特にまくり艇を上方補正。":wi.mode==="tail"&&wi.speed>=3?"🌬️ 追い風3m以上 → インコース有利。特に2・3コースの差しを上方補正。":wi.mode==="head"?"🌬️ 向かい風 → アウトコース・まくり方向を補正。":wi.mode==="tail"?"🌬️ 追い風 → インコース・差し方向を補正。":"風向データなし → 風補正なし。"}<br>風速：${wi.speed.toFixed(1)}m<br><br><strong style="color:#d4af37">今回の中心展開</strong><br>${mt.length?mt.map(x=>typeName(x[0])+" "+x[1].toFixed(1)+"%").join(" / "):typeName(main)}<br><br><strong style="color:#d4af37">主攻め候補</strong><br>${attacker}号艇<br><br><strong style="color:#d4af37">進入</strong><br>${[1,2,3,4,5,6].map(b=>`${b}号艇→${course(b)}コース`).join(" / ")}${main==="maki"||main==="makiSashi"?`<br><br>🟡 <strong style="color:#ffd84d">まくり艇直後・外側の展開を3着評価へ反映</strong><br>まくり買い目が成立する場合は、まくる艇の後ろからまくり差し候補を優先評価。<br>前艇がまくりの場合は条件を満たす艇を2着まで昇格。`:""}</div><div class="outlookBox"><div class="outlookTitle">🎯 全体見通し：イン逃げする / しない</div><div class="outlookGrid"><div class="outlookItem outlookEscape outlookBand-${outlookBand} ${escapeLowClass} ${outlook.escape<=0?"outlookInactive":""}"><div class="outlookLabel">イン逃げする</div><div class="outlookValue">${outlook.escape.toFixed(1)}%</div><div class="outlookStatus ${escapeClass}">${outlook.status}</div></div><div class="outlookItem outlookNonEscape outlookBand-${outlookBand} ${nonEscapeLowClass} ${outlook.nonEscape<=0?"outlookInactive":""}"><div class="outlookLabel">イン逃げしない</div><div class="outlookValue">${outlook.nonEscape.toFixed(1)}%</div><div class="outlookStatus ${nonEscapeClass}">${outlook.nonEscape>=65?"期待大":"展開警戒"}</div></div></div><div class="outlookCaution" style="display:${outlookBand==="balanced"?"block":"none"}">⚠️ 展開多数・買いすぎ注意！！</div><div class="overviewReason">イン逃げ/イン逃げしないを合計100%で評価。<br>${outlook.escape>=83?"🔥 1号艇の逃げ率83%以上。イン逃げ鉄板激アツ評価。":outlook.escape>=65?"🔴 イン逃げ65%以上。イン逃げとして評価。":outlook.escape>=50?"🟢 イン逃げ50.0〜64.9%。緑評価。":"🔵 イン逃げ49.9%以下。イン以外として評価。"}<br>決まり手評価：1号艇逃げ50%=場平均 / 65%=期待大 / 83%=鉄板激アツ。<br>差し・まくり・まくり差し：7%=場平均 / 15%=期待大 / 20%=期待プラス / 25%=激アツ。<br>1号艇のまくられ・差され・まくり差されは7%未満=プラス、7〜14%=やや危険、15%以上=危険、25%以上=かなりマイナス。</div></div><div class="aiDetail"><strong>🤖 AI総合評価の主要項目</strong><br>機力・モーター・今節選手調子・展示タイム・ST・全国勝率・当地勝率・場特性・決まり手傾向・同コース過去15走・直近15走・進入・風向・風速・展開連動を統合評価。</div></div>`

}

function renderExclusions(rankings){

let cuts=rankings.filter(x=>classification(x.boat,rankings).type==="cut").slice(0,1);

$("exclusions").innerHTML=`<div class="pickBox"><div class="pickTitle">✂️ 3着から切り候補</div>${cuts.length?cuts.map(x=>`<div class="exclusion">✂️ ${x.boat}号艇：AI ${x.score.toFixed(1)} — 完全除外候補</div>`).join(""):'<div class="noPick">なし。無理に設定しません。</div>'}</div>`

}

function runAnalysis(){

if(racers.length!==6){alert("先に出走表を取得してください");return}

$("message").innerHTML='<span class="loading">🤖 AI解析中...</span>';

(async()=>{

try{

for(let b=1;b<=6;b++)manualCourses[b]=+$("course"+b).value;

for(let b=1;b<=6;b++){

if(!Number.isInteger(manualCourses[b])||manualCourses[b]<1||manualCourses[b]>6){manualCourses[b]=b;$("course"+b).value=String(b)}

}

$("message").innerHTML='<span class="loading">🤖 同じコースを走った過去15走を検索中...</span>';

await loadHistory();

renderRace();

let o=overview(),r=ranking();

renderRanking(r);

renderAttack(o);

renderExclusions(r);

$("analysisCard").style.display="block";

let outlook=overallEscapeProbability();

renderPatternBets(r,outlook);

let counts=racers.map(x=>{let no=getRacerNumber(x),c=course(num(x.entry_number));return historyData[no]?.boats?.[c]?.length||0});

let wi=windInfo();

$("message").innerHTML=`<span class="success">✅ AI解析完了<br>🔥 主攻め：${typeName(dominant(o))}<br>📈 今回と同コースの過去15走：${counts.join(" / ")}走取得<br>🏟️ 場特性：${esc(venueTrait().name)}を評価<br>🌬️ 風情報：${esc(wi.label)} ${wi.speed.toFixed(1)}m<br>🎯 風補正：${wi.mode==="head"&&wi.speed>=3?"向かい風3m以上 → アウトコース・まくりを上方補正":wi.mode==="tail"&&wi.speed>=3?"追い風3m以上 → インコース・2・3コース差しを上方補正":wi.mode==="head"?"向かい風 → アウトコース・まくり方向を補正":wi.mode==="tail"?"追い風 → インコース・差し方向を補正":"風向データなし → 風補正なし"}<br>📊 全体見通し：イン逃げ ${outlook.escape.toFixed(1)}% / イン逃げしない ${outlook.nonEscape.toFixed(1)}%<br>📈 直近15走の調子：AIスコアへ反映<br>🛥️ 進入コース：AI評価へ反映<br>🎯 過去15走：1着は本人の決まり手、1着以外は1着艇の決まり手を表示<br>📊 決まり手集計：母数15走。差し・まくり・まくり差しは「1着」のみを分子に使用<br>🛡️ 1号艇のまくられ・差され・まくり差されは「1着以外」のみを分子に使用<br>📊 すべて今回と同コース過去15走の出走回数を母数として算出<br>✂️ 3着から切候補：0〜複数艇、無理に設定なし<br>🟡 展開復活：根拠がある場合のみ3着まで<br>⬆️ まくり後ろ：条件を満たせば2着まで昇格<br>🎯 AI評価：全国勝率・当地勝率・モーター・ST・展示・進入・決まり手・同コース過去15走・直近15走・風向・風速・場特性・展開連動を総合評価${outlook.escape>=65?"<br>🎯 イン逃げ65%以上：買い目パターン1・パターン2を生成":""}</span>`

}catch(e){

console.error(e);

$("message").innerHTML='<span class="error">❌ AI解析失敗<br>'+esc(e.message).replace(/\n/g,"<br>")+'</span>'

}

})()

}

function rank(n){return{1:"A1",2:"A2",3:"B1",4:"B2"}[num(n)]||"-"}

initCourses();

filterTodayVenues();

</script>
