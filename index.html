<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

header{background:linear-gradient(135deg,#080808,#211a07);border-bottom:1px solid #b8952e;padding:18px;text-align:center}

header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:3px}

header p{margin:5px 0 0;font-size:12px;color:#999}

.container{max-width:1000px;margin:auto;padding:14px}

.card{background:#111;border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:14px}

h2{margin:0 0 12px;font-size:17px;color:#d4af37}

h3{font-size:14px;color:#d4af37;margin:14px 0 8px}

label{font-size:11px;color:#aaa;display:block;margin-bottom:5px}

select,input{width:100%;background:#181818;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{width:100%;padding:13px;border:0;border-radius:9px;font-size:14px;font-weight:bold}

.mainBtn{margin-top:12px;background:linear-gradient(135deg,#d4af37,#8b6914);color:#000}

.subBtn{margin-top:8px;background:#222;border:1px solid #555;color:#fff}

.resetBtn{margin-top:8px;background:#171717;border:1px solid #777;color:#fff}

.topBtn{margin-top:14px;background:#171717;border:1px solid #b8952e;color:#d4af37}

.message{margin-top:10px;font-size:12px;line-height:1.6;color:#aaa}

.info{background:#151515;border:1px solid #333;border-radius:8px;padding:10px;font-size:11px;line-height:1.7;margin-bottom:10px}

.courseGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.courseBox{background:#171717;padding:8px;border-radius:8px;border:1px solid #333}

.racers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.racer{background:#171717;border:1px solid #333;border-radius:9px;padding:9px}

.racerTop{display:flex;align-items:center;gap:8px}

.number{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#000}

.n1{background:#fff}.n2{background:#222;color:#fff;border:1px solid #777}.n3{background:#e22;color:#fff}.n4{background:#248cff;color:#fff}.n5{background:#e5d000}.n6{background:#20a747;color:#fff}

.racerName{font-weight:bold}

.small{font-size:10px;color:#aaa;line-height:1.6;margin-top:6px}

.tech{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.tech div{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px;font-size:10px;text-align:center}

.tech span{display:block;color:#888;margin-bottom:2px}

.decisionStats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.decisionStat{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px 4px;font-size:10px;text-align:center}

.decisionStat span{display:block;color:#888;margin-bottom:2px}

.decisionStat strong{display:block;color:#d4af37;font-size:12px}

.history{margin-top:8px;background:#0d0d0d;border:1px solid #292929;border-radius:8px;padding:8px}

.historyTitle{color:#d4af37;font-weight:bold;font-size:11px;margin-bottom:6px}

.historyStats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}

.historyStat{background:#151515;border-radius:5px;padding:5px 2px;text-align:center;font-size:9px;color:#aaa}

.historyStat strong{display:block;font-size:12px;color:#d4af37;margin-top:2px}

.historyList{font-size:9px;color:#aaa;line-height:1.6;max-height:180px;overflow-y:auto}

.historyItem{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:3px 0}

.historyItem:last-child{border-bottom:0}

.historyGood{color:#4cd964;font-weight:bold}.historyBad{color:#777}.historyMiddle{color:#ffd84d;font-weight:bold}.historyDecision{color:#d4af37;font-weight:bold}

table{width:100%;border-collapse:collapse;font-size:11px}

th,td{padding:7px 3px;border-bottom:1px solid #292929;text-align:center}

th{color:#d4af37}

.strategy{background:#171717;border-left:3px solid #d4af37;padding:9px;font-size:11px;line-height:1.7;margin-top:8px}

.attackBox{background:#211a07;border:1px solid #8a6d1c;border-radius:9px;padding:10px;font-size:11px;line-height:1.8;margin-top:8px}

.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}.attackSub{color:#aaa;margin-top:4px}

.exclusion{background:#241414;border-left:3px solid #e55;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.exclusionKeep{background:#171707;border-left:3px solid #d4af37;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.revivalBox{background:#211a07;border-left:3px solid #ffd84d;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.pickBox{background:#151515;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}

.betHeader{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;background:#0d0d0d;border:1px solid #292929;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px;color:#888;text-align:center}

.betRow{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #292929}

.betRow:last-child{border-bottom:0}

.bet2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:bold}

.bet2Number{background:#211a07;border:1px solid #8a6d1c;border-radius:6px;padding:5px 8px;color:#ffd84d}

.betPercent{font-size:11px;color:#ffd84d;font-weight:bold}

.thirdCandidates{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}

.thirdCandidate{background:#101010;border:1px solid #333;border-radius:6px;padding:5px 6px;font-size:10px;color:#fff}

.thirdCandidate.normal{border-color:#555}

.thirdCandidate.revival{border-color:#d4af37;color:#ffd84d;background:#211a07}

.thirdCandidate.warning{border-color:#8a4b4b;color:#ff9b9b}

.revivalLabel{display:block;font-size:8px;color:#ffd84d;margin-top:2px}

.betNote{font-size:9px;color:#777;margin-top:5px;line-height:1.5}

.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px}

.pick:last-child{border-bottom:0}.pickLeft{display:flex;align-items:center;gap:5px}

.star{width:18px;min-width:18px;color:#ffd84d;font-size:15px;font-weight:bold}

.prob{color:#ffd84d;font-weight:bold}

.pick.veryStrong .prob,.pick.veryStrong strong{color:#ff3b30}.pick.veryStrong .prob{font-size:15px;font-weight:900}

.pick.strong .prob,.pick.strong strong{color:#ffd84d}.pick.strong .prob{font-size:14px;font-weight:900}

.pick.weak{opacity:.38}

.total{background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;padding:10px;text-align:center;color:#d4af37;font-weight:bold;margin-bottom:8px}

.budgetInfo{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:11px;line-height:1.6;color:#aaa}

.budgetStrong{color:#d4af37;font-weight:bold}.noPick{font-size:11px;color:#777;padding:8px 0;line-height:1.6}

.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}

.overviewBox{background:#101010;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}

.overviewBox .label{font-size:10px;color:#888}.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}

.overviewBox.main{border-color:#8a6d1c;background:#1c1709}

.overviewReason{font-size:11px;color:#aaa;line-height:1.7;margin-top:8px}

.venueBox{background:#101010;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.venueBox strong{color:#d4af37}.formBox{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.footer{text-align:center;color:#555;font-size:10px;padding:20px}

.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}

.betEscape{color:#ff9500}.betSashi{color:#4cd964}.betMaki{color:#ff5555}.betMakiSashi{color:#58a6ff}

.recommendPick{opacity:.52}.recommendTitle{color:#888!important}

.outlookBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.outlookTitle{font-size:13px;font-weight:bold;color:#d4af37;margin-bottom:8px}

.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}

.outlookEscape{border-color:#7b2d2d;background:#241414}

.outlookNonEscape{border-color:#285b8c;background:#0e1722}

.outlookInactive{border-color:#333!important;background:#151515!important}

.outlookLabel{font-size:10px;color:#aaa}

.outlookValue{font-size:22px;font-weight:900;margin-top:3px}

.outlookEscape .outlookValue{color:#ff5555}

.outlookNonEscape .outlookValue{color:#58a6ff}

.outlookInactive .outlookValue{color:#777}

.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}

.decisionPositive{color:#4cd964}

.decisionWarning{color:#ffd84d}

.decisionDanger{color:#ff5555}

.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}

.aiDetail strong{color:#d4af37}

.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}

.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}

.patternExcluded{color:#777;text-decoration:line-through}

/* 決まり手ランキング */

.decisionRankBtn{margin-top:12px;background:#171717;border:1px solid #b8952e;color:#d4af37}

.decisionRankPanel{display:none;margin-top:10px}

.decisionRankPanel.open{display:block}

.decisionRankBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:8px}

.decisionRankTitle{color:#d4af37;font-size:13px;font-weight:bold;margin-bottom:7px}

.decisionRankItem{display:grid;grid-template-columns:36px 1fr auto;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #292929;font-size:11px}

.decisionRankItem:last-child{border-bottom:0}

.decisionRankNo{font-weight:900;color:#ffd84d;text-align:center}

.decisionRankScore{color:#ffd84d;font-weight:bold}

.decisionRankReason{font-size:9px;color:#888;line-height:1.5;margin-top:2px}

/* 切候補詳細は内部ロジックだけ維持して非表示 */

#exclusions{display:none!important}

@media(max-width:600px){

.grid2{grid-template-columns:1fr}

.courseGrid{grid-template-columns:repeat(2,1fr)}

.racers{grid-template-columns:1fr}

.overviewGrid{grid-template-columns:repeat(2,1fr)}

.betHeader,.betRow{grid-template-columns:1fr 1.3fr}

.decisionStats{grid-template-columns:repeat(2,1fr)}

}

</style>

</head>

<body>

<header>

<h1>BOAT HUNTER</h1>

<p>人気ではなく期待値で勝つ</p>

</header>

<div class="container">

<div class="card">

<h2>🎯 レース選択</h2>

<div class="grid2">

<div>

<label>本日の開催場</label>

<select id="venue"></select>

</div>

<div>

<label>レース</label>

<select id="race">

<option value="1">1R</option>

<option value="2">2R</option>

<option value="3">3R</option>

<option value="4">4R</option>

<option value="5">5R</option>

<option value="6">6R</option>

<option value="7">7R</option>

<option value="8">8R</option>

<option value="9">9R</option>

<option value="10">10R</option>

<option value="11">11R</option>

<option value="12">12R</option>

</select>

</div>

</div>

<h3>🛥️ 今回の進入コース</h3>

<div class="courseGrid">

<div class="courseBox"><label>1号艇</label><select id="course1"></select></div>

<div class="courseBox"><label>2号艇</label><select id="course2"></select></div>

<div class="courseBox"><label>3号艇</label><select id="course3"></select></div>

<div class="courseBox"><label>4号艇</label><select id="course4"></select></div>

<div class="courseBox"><label>5号艇</label><select id="course5"></select></div>

<div class="courseBox"><label>6号艇</label><select id="course6"></select></div>

</div>

<button class="resetBtn" id="resetCoursesBtn">🔄 進入入力をリセット</button>

<button class="mainBtn" id="loadRaceBtn">出走表を取得</button>

<button class="subBtn" id="analysisBtn">🤖 AI解析開始</button>

<div id="message" class="message"></div>

</div>

<div id="raceCard" class="card" style="display:none">

<h2>🏁 出走表</h2>

<div id="raceInfo"></div>

<div id="racers" class="racers"></div>

</div>

<div id="analysisCard" class="card" style="display:none">

<h2>🤖 AI期待値ランキング</h2>

<div id="ranking"></div>

<h3>🔥 このレースの攻め手</h3>

<div id="attack"></div>

<button class="decisionRankBtn" id="decisionRankBtn" type="button">

📊 決まり手ランキングを表示

</button>

<div id="decisionRankPanel" class="decisionRankPanel">

<div id="decisionRanking"></div>

</div>

<h3 style="display:none">✂️ 3着から切候補</h3>

<div id="exclusions"></div>

<div id="bettingPatterns"></div>

</div>

<div class="footer">BOAT HUNTER © 2026</div>

<button class="topBtn" id="topBtn" type="button">⬆️ 1番上へ</button>

</div>

<script>

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

let raceData=null,

racers=[],

previewRacers={},

manualCourses={},

historyData={},

currentBets=null;

const HISTORY_RACES=15;

const HISTORY_DAYS=180;

const $=id=>document.getElementById(id);

const num=v=>{

if(v==null||v==="")return 0;

let x=parseFloat(String(v).replace(/[%,秒,]/g,""));

return Number.isFinite(x)?x:0

};

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

}[m]));

function course(b){

return Number(manualCourses[b]||b)

}

function racer(b){

return racers.find(x=>num(x.entry_number)===b)

}

function preview(b){

return previewRacers[b]||previewRacers[String(b)]||{}

}

function today(){

let p=new Intl.DateTimeFormat("ja-JP",{

timeZone:"Asia/Tokyo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}).formatToParts(new Date());

return{

year:p.find(x=>x.type==="year").value,

ymd:

p.find(x=>x.type==="year").value+

p.find(x=>x.type==="month").value+

p.find(x=>x.type==="day").value

}

}

function dateInfo(d){

return{

year:String(d.getFullYear()),

ymd:

String(d.getFullYear())+

String(d.getMonth()+1).padStart(2,"0")+

String(d.getDate()).padStart(2,"0")

}

}

async function json(url){

let r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

return r.json()

}

function normalizeEntry(x,i){

if(x==null||typeof x!=="object")return null;

let entry=num(

x.entry_number??

x.entryNumber??

x.boat_number??

x.boatNumber??

x.boat_no??

x.number_boat??

x.boat??

x.lane??

x.lane_number??

x.laneNumber??

x.course_number??

x.course??

x.entry??

x.number

);

if(!entry&&i<6)entry=i+1;

let name=

x.name??

x.racer_name??

x.racerName??

x.player_name??

x.playerName??

x.racer??

x.player??

x.racers_name??

"";

if(typeof name==="object")

name=name.name||name.racer_name||name.player_name||"";

return{

...x,

entry_number:entry,

name:name

}

}

function extractRaceEntries(race){

if(!race)return[];

const directCandidates=[

race.racers,

race.entries,

race.participants,

race.program,

race.race_entries,

race.racer,

race.players,

race.boats,

race.starting_list,

race.startingList,

race.entry_list,

race.entryList,

race.raceRacers,

race.race_entries_list

];

for(const source of directCandidates){

if(!source)continue;

let arr=Array.isArray(source)?source:Object.values(source);

let list=arr

.map((x,i)=>normalizeEntry(x,i))

.filter(x=>x&&x.entry_number>=1&&x.entry_number<=6);

let unique=new Map();

list.forEach(x=>{

if(!unique.has(x.entry_number))

unique.set(x.entry_number,x)

});

list=Array.from(unique.values())

.sort((a,b)=>a.entry_number-b.entry_number);

if(list.length===6)return list

}

return extractEntriesDeep(race)

}

function extractEntriesDeep(root){

let found=[];

function walk(obj,depth=0){

if(!obj||depth>12)return;

if(Array.isArray(obj)){

for(const x of obj)walk(x,depth+1);

return

}

if(typeof obj!=="object")return;

const looksLikeRacer=

obj.name!=null||

obj.racer_name!=null||

obj.racerName!=null||

obj.player_name!=null||

obj.registration_number!=null||

obj.racer_number!=null||

obj.player_number!=null;

const e=num(

obj.entry_number??

obj.entryNumber??

obj.boat_number??

obj.boatNumber??

obj.boat_no??

obj.lane??

obj.course_number??

obj.course??

obj.entry

);

if(looksLikeRacer&&e>=1&&e<=6){

let z=normalizeEntry(obj,0);

if(z)found.push(z)

}

for(const k of Object.keys(obj)){

if(k==="result"||k==="results"||k==="history")continue;

walk(obj[k],depth+1)

}

}

walk(root);

let unique=new Map();

found.forEach(x=>{

if(!unique.has(x.entry_number))

unique.set(x.entry_number,x)

});

let list=Array.from(unique.values())

.sort((a,b)=>a.entry_number-b.entry_number);

return list.length===6?list:[]

}

function findRace(data,venue,raceNo){

let found=null;

function walk(obj){

if(found||obj==null)return;

if(Array.isArray(obj)){

for(const item of obj){

walk(item);

if(found)break

}

return

}

if(typeof obj!=="object")return;

const rn=

obj.race_number??

obj.raceNumber??

obj.race_no??

obj.raceNo??

obj.raceno??

obj.number;

const vn=

obj.stadium_number??

obj.stadiumNumber??

obj.venue_number??

obj.venueNumber??

obj.stadiumNo??

obj.venueNo;

if(

rn!=null&&

String(rn)===String(raceNo)&&

(vn==null||String(vn)===String(venue))

){

let list=extractRaceEntries(obj);

if(list.length===6){

found=obj;

return

}

}

for(const key of Object.keys(obj)){

walk(obj[key]);

if(found)break

}

}

walk(data);

return found

}

function directRace(data,v,r){

const paths=[

data?.programs?.stadiums?.[String(v)]?.races?.[String(r)],

data?.programs?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.stadiums?.[String(v)]?.races?.[String(r)],

data?.stadiums?.[String(v)]?.races?.[Number(r)],

data?.races?.[String(r)],

data?.races?.[Number(r)]

];

for(const x of paths){

if(x&&extractRaceEntries(x).length===6)return x

}

const raceArrays=[

data?.programs?.stadiums?.[String(v)]?.races,

data?.stadiums?.[String(v)]?.races,

data?.races,

data?.programs?.races

];

for(const arr of raceArrays){

if(!arr)continue;

const list=Array.isArray(arr)?arr:Object.values(arr);

const x=list.find(z=>{

const rn=

z?.race_number??

z?.raceNumber??

z?.race_no??

z?.raceNo;

return String(rn)===String(r)&&

extractRaceEntries(z).length===6

});

if(x)return x

}

return findRace(data,v,r)

}

async function loadDaily(){

let t=today(),v=$("venue").value,r=$("race").value;

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

let errors=[];

for(const url of urls){

try{

let data=await json(url);

let race=directRace(data,v,r);

if(race){

let list=extractRaceEntries(race);

if(list.length===6)return{data,race,base:url};

errors.push(url+" : race found but entries="+list.length)

}else errors.push(url+" : race not found")

}catch(e){

errors.push(url+" : "+e.message)

}

}

throw Error("APIから6艇の出走表を取得できませんでした.\n"+errors.slice(-3).join("\n"))

}

function initCourses(){

for(let b=1;b<=6;b++){

let e=$("course"+b);

e.innerHTML="";

for(let c=1;c<=6;c++)

e.add(new Option(c+"コース",c));

e.value=String(b);

manualCourses[b]=b;

e.onchange=()=>{

manualCourses[b]=Number(e.value)

}

}

function decision(n){

if(n==null||n==="")return"-";

let s=String(n)

.trim()

.replace(/\s+/g,"")

.replace(/捲/g,"まく");

if(s.includes("まくり差し"))return"まくり差し";

if(s.includes("逃げ"))return"逃げ";

if(s.includes("差し"))return"差し";

if(s.includes("まくり"))return"まくり";

if(s.includes("恵まれ"))return"恵まれ";

if(s.includes("抜き"))return"抜き";

return s||"-"

}

function decisionKey(n){

let s=decision(n);

if(s==="逃げ")return"escape";

if(s==="差し")return"sashi";

if(s==="まくり")return"maki";

if(s==="まくり差し")return"makiSashi";

if(s==="恵まれ")return"megumare";

if(s==="抜き")return"nuki";

return"other"

}

function deepDecision(obj){

if(!obj||typeof obj!=="object")return"";

const keys=[

"winning_technique",

"winningTechnique",

"kimarite",

"decision",

"technique",

"winning_method",

"winningMethod",

"win_technique",

"winTechnique"

];

for(const k of keys){

if(obj[k]!=null&&obj[k]!==""){

let d=decision(obj[k]);

if(d!=="-"&&d!=="")return d

}

}

for(const k of Object.keys(obj)){

if(k==="racers"||k==="entries"||k==="participants"||k==="result_racers")continue;

let v=obj[k];

if(v&&typeof v==="object"){

let d=deepDecision(v);

if(d)return d

}

}

return""

}

function resultEntries(race){

if(!race)return[];

const candidates=[

race.result?.racers,

race.result?.entries,

race.results?.racers,

race.results?.entries,

race.result_racers,

race.resultRacers,

race.racers,

race.entries

];

for(const source of candidates){

if(!source)continue;

let arr=Array.isArray(source)?source:Object.values(source);

let list=arr.map(x=>({

raw:x,

number:getResultRacerNumber(x),

place:getPlace(x),

course:getCourse(x),

decision:decision(

x?.winning_technique||

x?.winningTechnique||

x?.kimarite||

x?.decision||

x?.technique||

x?.winning_method||

x?.winningMethod

)

}));

if(list.some(x=>x.place>0))return list

}

return[]

}

function raceWinnerDecision(race){

let entries=resultEntries(race);

let winner=entries.find(x=>x.place===1);

if(winner&&winner.decision&&winner.decision!=="-")

return winner.decision;

let d=deepDecision(race?.result||race?.results||race);

return d||"-"

}

race?.date||

race?.raceDate||

race?.dateString||

"";

function collectRaces(data){

let list=[];

function walk(obj){

if(!obj)return;

if(Array.isArray(obj)){

obj.forEach(walk);

return

}

if(typeof obj!=="object")return;

let entries=resultEntries(obj);

if(entries.length){

list.push(obj);

return

}

for(const k of Object.keys(obj))

walk(obj[k])

}

walk(data);

return list

}

function decisions(r){

if(!r)return{

escape:0,

sashi:0,

maki:0,

makiSashi:0,

megumare:0,

nuki:0,

makare:0,

sasare:0,

makiSashiSare:0,

makareRate:0,

sasareRate:0,

makiSashiSareRate:0,

count:0

};

let b=num(r.entry_number),

a=history(b),

count=a.length;

let out={

sashi:0,

maki:0,

makiSashi:0,

megumare:0,

nuki:0,

makare:0,

sasare:0,

makiSashiSare:0,

makareRate:0,

sasareRate:0,

makiSashiSareRate:0,

count

};

if(!count)return out;

if(course(b)===1){

a.forEach(x=>{

if(x.place===1){

let k=decisionKey(x.selfDecision||x.decision);

if(k==="escape")out.escape++

}else{

if(k==="maki")out.makare++;

if(k==="sashi")out.sasare++;

if(k==="makiSashi")out.makiSashiSare++

}

});

out.escape=out.escape/count*100;

out.makareRate=out.makare/count*100;

out.sasareRate=out.sasare/count*100;

out.makiSashiSareRate=out.makiSashiSare/count*100;

}

a.forEach(x=>{

let k=decisionKey(x.selfDecision||x.decision);

if(k==="sashi")out.sashi++;

if(k==="maki")out.maki++;

if(k==="makiSashi")out.makiSashi++;

if(k==="megumare")out.megumare++;

if(k==="nuki")out.nuki++

});

out.sashi=out.sashi/count*100;

out.maki=out.maki/count*100;

out.makiSashi=out.makiSashi/count*100;

out.megumare=out.megumare/count*100;

out.nuki=out.nuki/count*100;

return out

}

function motorRate(b){

return num(

racer(b)?.motor_top_2_percent||

racer(b)?.motor_2ren_rate||

racer(b)?.motor_2ren

)

}

function recentFormValue(b){

return recentForm(b).score

}

function patternThirdScore(b,rankings,type){

let x=rankings.find(z=>z.boat===b);

if(!x)return-999;

let v=x.score;

v+=motorRate(b)*.35;

v+=recentFormValue(b)*4;

v+=suitability(b,type)*.35;

let dev=developmentBonus(b,rankings,type);

v+=dev.bonus*.8;

if(goodHistory(b))v+=5;

return v

}

function thirdProbabilityList(excluded,rankings,type){

let list=[];

for(let b=2;b<=6;b++){

if(excluded.includes(b))continue;

let v=patternThirdScore(b,rankings,type);

if(v<=-900)continue;

list.push({boat:b,value:v})

}

list.sort((a,b)=>b.value-a.value);

let min=list.length?Math.min(...list.map(x=>x.value)):0;

let weights=list.map(x=>Math.max(.1,x.value-min+5));

let total=weights.reduce((s,x)=>s+x,0)||1;

list.forEach((x,i)=>{

x.prob=weights[i]/total*100

});

return list

}

function bestSecondNonOne(rankings){

return rankings.find(x=>x.boat!==1)?.boat||null

}

function patternTwoCandidates(rankings){

let avg=scoreAverage(rankings),

eligible=[];

rankings.forEach((x,i)=>{

if(x.boat===1)return;

let lowAI=x.score<=avg-20,

weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

eligible.push({boat:x.boat,rank:i+1,score:x.score})

});

let fourth=rankings[3],

fifth=rankings[4],

picked=[];

[fourth,fifth].forEach(x=>{

if(!x||x.boat===1)return;

let lowAI=x.score<=avg-20,

weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

if(!picked.includes(x.boat))picked.push(x.boat)

});

if(!picked.length&&eligible.length)picked.push(eligible[0].boat);

if(picked.length>2)picked=picked.slice(0,2);

return{picked,eligible,avg}

}

function renderThirdCandidates(list,secondBoats,firstBoat,forcedBoat){

if(!list.length)return'<div class="noPick">3着候補なし</div>';

return`

<div class="thirdCandidates">

${list.map(x=>{

let forced=x.boat===forcedBoat,

duplicate=secondBoats.includes(x.boat)||x.boat===firstBoat;

if(duplicate&&!forced)return"";

return`

<div class="thirdCandidate ${forced?"revival":"normal"}">

${x.boat}号艇

<span class="thirdProb">${x.prob.toFixed(1)}%</span>

${forced?'<span class="revivalLabel">⭐ AI80以上＋モーター35%以上</span>':""}

</div>`

}).join("")}

</div>`

}

function renderPatternBets(rankings,outlook){

if(!outlook||outlook.escape<65){

$("bettingPatterns").innerHTML="";

currentBets=null;

return

}

let bestSecond=bestSecondNonOne(rankings);

if(!bestSecond){

$("bettingPatterns").innerHTML="";

currentBets=null;

return

}

let type="escape";

let forced6=rankings.find(x=>x.boat===6&&x.score>=80&&motorRate(x.boat)>=35);

let p1Third=thirdProbabilityList([1,bestSecond],rankings,type);

if(forced6&&forced6.boat!==bestSecond&&!p1Third.some(x=>x.boat===forced6.boat)){

p1Third.push({

boat:forced6.boat,

value:patternThirdScore(forced6.boat,rankings,type),

prob:0,

forced:true

})

}

p1Third.sort((a,b)=>{

if(a.boat===forced6?.boat)return -1;

if(b.boat===forced6?.boat)return 1;

return b.value-a.value

});

let p2=patternTwoCandidates(rankings);

let p2Third=thirdProbabilityList([1,...p2.picked],rankings,type).slice(0,2);

if(forced6&&forced6.boat!==1&&!p2.picked.includes(forced6.boat)&&!p2Third.some(x=>x.boat===forced6.boat)){

p2Third.push({

boat:forced6.boat,

value:patternThirdScore(forced6.boat,rankings,type),

prob:0,

forced:true

})

}

function normalizeThird(list,secondBoats){

let a=list.filter(x=>x.boat!==1&&!secondBoats.includes(x.boat));

a.sort((x,y)=>{

if(x.boat===forced6?.boat)return -1;

if(y.boat===forced6?.boat)return 1;

return y.value-x.value

});

let weights=a.map(x=>Math.max(.1,x.value-(Math.min(...a.map(y=>y.value))||0)+5));

let total=weights.reduce((s,x)=>s+x,0)||1;

a.forEach((x,i)=>x.prob=weights[i]/total*100);

return a

}

p1Third=normalizeThird(p1Third,[bestSecond]);

p2Third=normalizeThird(p2Third,p2.picked);

let secondNames=p2.picked.map(b=>{

let x=rankings.find(z=>z.boat===b);

return x?`${b}号艇（AI${x.score.toFixed(1)}）`:""

}).filter(Boolean).join("・");

function decisionRankStartPower(b){

let r=racer(b),

p=preview(b),

a=num(r?.average_start_timing||r?.average_st),

st=num(p.start_timing||p.st),

v=0;

if(a>0)v+=Math.max(0,.30-a)*80;

if(st>0)v+=Math.max(0,.25-st)*65;

return v

}

function escapeDecisionRanking(){

let o=overview(),

att=bestAttackBoat(dominant(o)),

a=[];

for(let b=2;b<=6;b++){

let h=hstats(b),

f=recentForm(b),

m=num(

racer(b)?.motor_top_2_percent||

racer(b)?.motor_2ren_rate||

racer(b)?.motor_2ren

),

v=

h.rate*1.05+

h.rate2*.8+

m*.55+

f.score*4+

decisionRankStartPower(b)*.55+

score(b)*.22+

(b===att?18:0);

a.push({

boat:b,

score:v,

rate2:h.rate2,

rate3:h.rate,

motor:m,

form:f.label,

attack:b===att

})

}

return a.sort((x,y)=>y.score-x.score)

}

function nonEscapeDecisionRanking(){

let d1=decisions(racer(1)),

a=[];

for(let b=2;b<=6;b++){

let d=decisions(racer(b)),

f=recentForm(b),

m=num(

racer(b)?.motor_top_2_percent||

racer(b)?.motor_2ren_rate||

racer(b)?.motor_2ren

);

for(const type of ["sashi","maki","makiSashi"]){

let rate=

type==="sashi"?d.sashi:

type==="maki"?d.maki:

d.makiSashi,

danger=

type==="sashi"?d1.sasareRate:

type==="maki"?d1.makareRate:

d1.makiSashiSareRate,

v=

rate*2.2+

danger*1.15+

m*.45+

f.score*3.5+

decisionRankStartPower(b)*.55+

suitability(b,type)*.7+

decisionEvaluation(b,type).value*.8+

(bestAttackBoat(type)===b?18:0);

a.push({

boat:b,

type,

score:v,

rate,

danger,

motor:m,

form:f.label

})

}

}

return a.sort((x,y)=>y.score-x.score).slice(0,10)

}
