<script>

const API_BASE =

"https://boatraceopenapi.github.io/api/v1/today.json";

const STADIUMS=[

["桐生",1],["戸田",2],["江戸川",3],["平和島",4],

["多摩川",5],["浜名湖",6],["蒲郡",7],["常滑",8],

["津",9],["三国",10],["びわこ",11],["住之江",12],

["尼崎",13],["鳴門",14],["丸亀",15],["児島",16],

["宮島",17],["徳山",18],["下関",19],["若松",20],

["芦屋",21],["福岡",22],["唐津",23],["大村",24]

];

let raceData=null;

let racers=[];

let entryOrder=[1,2,3,4,5,6];

const stadium=document.getElementById("stadium");

STADIUMS.forEach(x=>{

const op=document.createElement("option");

op.value=x[1];

op.textContent=x[0];

stadium.appendChild(op);

});

function num(v){

if(v===null||v===undefined||v==="")return 0;

const n=parseFloat(String(v).replace("%","").replace(",",""));

return isNaN(n)?0:n;

}

function first(obj,keys,def=0){

if(!obj)return def;

for(const key of keys){

if(obj[key]!==undefined&&obj[key]!==null&&obj[key]!==""){

return obj[key];

}

}

return def;

}

/* ================================

   過去10走

================================ */

function parseFinish(v){

if(typeof v==="number"){

return Math.round(v);

}

if(typeof v==="string"){

const m=v.match(/[1-6]/);

return m?Number(m[0]):0;

}

if(v&&typeof v==="object"){

return Number(first(v,[

"finish",

"finishPosition",

"arrival",

"position",

"result",

"rank",

"place_number",

"着順"

],0));

}

return 0;

}

function extractPast10(r){

const data=first(r,[

"past10",

"past10Results",

"recent10",

"recentResults",

"last10",

"last10Results",

"recentRaceResults",

"results",

"recent"

],null);

if(!Array.isArray(data))return [];

return data

.map(parseFinish)

.filter(x=>x>=1&&x<=6)

.slice(0,10);

}

function calcPastStats(results){

if(!results.length){

return{

count:0,avg:0,firstRate:0,

secondRate:0,thirdRate:0,

trend:0,score:0

};

}

let weighted=0;

let weights=0;

results.forEach((finish,i)=>{

const w=10-i;

weighted+=finish*w;

weights+=w;

});

const avg=weighted/weights;

const firstCount=

results.filter(x=>x===1).length;

const second=

results.filter(x=>x<=2).length;

const third=

results.filter(x=>x<=3).length;

const recent=results.slice(0,5);

const older=results.slice(5);

let trend=0;

if(recent.length&&older.length){

const ra=

recent.reduce((a,b)=>a+b,0)/recent.length;

const oa=

older.reduce((a,b)=>a+b,0)/older.length;

trend=oa-ra;

}

const avgScore=

Math.max(0,Math.min(100,(6-avg)/5*100));

const firstScore=

firstCount/results.length*100;

const secondScore=

second/results.length*100;

const thirdScore=

third/results.length*100;

const trendScore=

Math.max(0,Math.min(100,50+trend*15));

const score=

avgScore*.40+

thirdScore*.25+

secondScore*.15+

firstScore*.10+

trendScore*.10;

return{

count:results.length,

avg,

firstRate:firstCount/results.length*100,

secondRate:second/results.length*100,

thirdRate:third/results.length*100,

trend,

score

};

}

/* ================================

   選手正規化

================================ */

function normalizeRacer(r,i){

const course=Number(first(r,[

"entry_number",

"course",

"courseNumber",

"entry",

"boatNumber",

"waku"

],i+1));

const name=first(r,[

"name",

"racerName",

"playerName",

"fullName"

],`選手${i+1}`);

const rank=first(r,[

"rank",

"class",

"racerClass"

],"B1");

const national=num(first(r,[

"nationalWinRate",

"national_win_rate",

"winRate",

"nationWinRate"

],0));

const local=num(first(r,[

"localWinRate",

"local_win_rate",

"localRate"

],0));

const motor2=num(first(r,[

"motor_top_2_percent",

"motor2Rate",

"motorSecondRate",

"motor2",

"motorWinRate2"

],0));

const motor3=num(first(r,[

"motor_top_3_percent",

"motor3Rate",

"motorThirdRate",

"motor3",

"motorWinRate3"

],0));

const st=num(first(r,[

"average_start_timing",

"ST",

"st",

"startTime",

"averageST"

],0));

const exhibition=num(first(r,[

"exhibition_time",

"exhibitionTime",

"exhibition",

"tenjiTime"

],0));

const motorNo=first(r,[

"motor_number",

"motorNumber",

"motorNo",

"motor"

],"-");

const past10=extractPast10(r);

const pastStats=calcPastStats(past10);

return{

raw:r,

course,

name,

rank,

national,

local,

motor2,

motor3,

st,

exhibition,

motorNo,

past10,

pastStats,

score:0

};

}

/* ================================

   API取得

================================ */

async function fetchRaceData(){

const stadiumNo=String(stadium.value);

const raceNo=String(

document.getElementById("raceNo").value

);

const url=API_BASE+"?t="+Date.now();

const response=await fetch(url,{

cache:"no-store"

});

if(!response.ok){

throw new Error("HTTP "+response.status);

}

const data=await response.json();

const direct=

data?.programs?.stadiums?.[stadiumNo]?.races?.[raceNo];

if(direct){

return{

race:direct,

api:"api/v1/today.json"

};

}

throw new Error(

"対象レースがAPIデータ内にありません。"

);

}

/* ================================

   ★重要★

   racersは配列ではなくオブジェクト

================================ */

function extractRacers(race){

if(!race)return [];

let arr=race.racers;

/*

API V1:

racers:{

 "1":{...},

 "2":{...},

 ...

 "6":{...}

}

*/

if(

arr &&

typeof arr==="object" &&

!Array.isArray(arr)

){

arr=Object.keys(arr)

.sort((a,b)=>Number(a)-Number(b))

.map(key=>arr[key]);

}

/* 念のため配列形式にも対応 */

if(!Array.isArray(arr)){

arr=

race.entries ||

race.players ||

race.boats ||

race.racerList;

}

if(!Array.isArray(arr))return [];

return arr

.slice(0,6)

.map((r,i)=>normalizeRacer(r,i));

}

/* ================================

   出走表取得

================================ */

async function loadRace(){

const btn=document.querySelector(".mainBtn");

btn.disabled=true;

document.getElementById("status").textContent=

"出走表を取得中...\nAPIへ接続しています。";

document.getElementById("resultArea")

.classList.add("hidden");

try{

const result=await fetchRaceData();

raceData=result.race;

racers=extractRacers(raceData);

if(racers.length<6){

throw new Error(

`6艇の選手データを取得できませんでした。取得数：${racers.length}`

);

}

racers.forEach((r,i)=>{

r.course=i+1;

});

entryOrder=[1,2,3,4,5,6];

renderEntryButtons();

renderRace();

document.getElementById("raceArea")

.classList.remove("hidden");

document.getElementById("status").textContent=

"出走表取得成功！\nAI解析開始ボタンを押してください。";

}catch(e){

console.error(e);

document.getElementById("status").textContent=

"❌ 出走表取得失敗\n\n"+e.message;

}finally{

btn.disabled=false;

}

}

/* ================================

   レース表示

================================ */

function renderRace(){

const name=

stadium.options[stadium.selectedIndex].textContent;

const raceNo=

document.getElementById("raceNo").value;

document.getElementById("raceTitle").textContent=

`${name} ${raceNo}R`;

document.getElementById("raceMeta").innerHTML=

`<span class="badge">API V1</span>

<span class="badge">TODAY</span>`;

renderRacers();

document.getElementById("apiInfo").innerHTML=

`使用API：api/v1/today.json<br>

場番号：${stadium.value}<br>

レース：${raceNo}R<br>

選手数：${racers.length}艇`;

}

function renderRacers(){

const area=document.getElementById("racers");

area.innerHTML="";

racers.forEach((r,i)=>{

const p=r.pastStats;

let pastHtml="";

if(p.count){

pastHtml=`

<div class="past10">

<div class="pastTitle">過去${p.count}走</div>

<div class="pastGrid">

${r.past10.map(x=>{

let cls="finish";

if(x===1)cls+=" first";

if(x===2)cls+=" second";

if(x===3)cls+=" third";

return `<div class="${cls}">${x}</div>`;

}).join("")}

</div>

<div class="pastStats">

平均着順 <b>${p.avg.toFixed(2)}</b>

　

1着率 <b>${p.firstRate.toFixed(0)}%</b>

　

2連対率 <b>${p.secondRate.toFixed(0)}%</b>

　

3連対率 <b>${p.thirdRate.toFixed(0)}%</b>

<br>

近況：

${

p.trend>0.15

?'<span class="up">上昇</span>'

:p.trend<-0.15

?'<span class="down">下降</span>'

:'安定'

}

</div>

</div>

`;

}else{

pastHtml=`

<div class="past10">

<div class="pastTitle">過去10走</div>

<div class="pastStats">データ取得なし</div>

</div>

`;

}

const div=document.createElement("div");

div.className="racer";

div.innerHTML=`

<div class="racerTop">

<div class="number n${i+1}">

${i+1}

</div>

<div>

<div class="name">

${escapeHTML(r.name)}

</div>

<div class="rank">

${escapeHTML(String(r.rank))}

</div>

</div>

</div>

<div class="stats">

全国勝率：

<b>${r.national.toFixed(2)}</b><br>

当地勝率：

<b>${r.local.toFixed(2)}</b><br>

モーター2連率：

<b>${r.motor2.toFixed(1)}%</b><br>

モーター3連率：

<b>${r.motor3.toFixed(1)}%</b><br>

ST：

<b>${r.st?r.st.toFixed(2):"-"}</b><br>

展示：

<b>${r.exhibition?r.exhibition.toFixed(2):"-"}</b><br>

モーター：

<b>${escapeHTML(String(r.motorNo))}</b>

</div>

${pastHtml}

<div class="score">

AI評価 ${r.score.toFixed(1)}

</div>

`;

area.appendChild(div);

});

}

/* ================================

   進入

================================ */

function renderEntryButtons(){

const area=document.getElementById("entryButtons");

area.innerHTML="";

entryOrder.forEach((boat,i)=>{

const b=document.createElement("button");

b.className="entryBtn active";

b.textContent=boat+"コース";

b.onclick=()=>{

if(i===0)return;

const temp=entryOrder[0];

entryOrder[0]=entryOrder[i];

entryOrder[i]=temp;

renderEntryButtons();

};

area.appendChild(b);

});

updateEntryText();

}

function updateEntryText(){

const maezuke=entryOrder[0]!==1;

document.getElementById("entryText").innerHTML=

`<b>進入：</b>${entryOrder.join("-")}

<br>

<b>判定：</b>

${

maezuke

?'<span class="warning">前付けあり</span>'

:'<span class="good">枠なり想定</span>'

}`;

}

/* ================================

   AI評価

================================ */

function courseBonus(c){

return{

1:10,

2:6,

3:5,

4:3,

5:1,

6:0

}[c]||0;

}

function rankBonus(rank){

const r=String(rank).toUpperCase();

if(r==="A1")return 5;

if(r==="A2")return 2;

if(r==="B1")return 0;

if(r==="B2")return -2;

return 0;

}

function calcScore(r){

let score=0;

score+=r.national*7;

score+=r.local*4;

score+=r.motor2*.15;

if(r.st>0){

score+=Math.max(0,.30-r.st)*20;

}

score+=courseBonus(r.course);

score+=rankBonus(r.rank);

if(r.exhibition>0){

if(r.exhibition<=6.70){

score+=3;

}else if(r.exhibition<=6.80){

score+=1;

}else if(r.exhibition>=7.00){

score-=2;

}

}

/* 過去10走 */

if(r.pastStats.count>0){

score+=r.pastStats.score*.20;

if(r.pastStats.trend>0.50){

score+=3;

}else if(r.pastStats.trend>0.20){

score+=1.5;

}else if(r.pastStats.trend<-0.50){

score-=3;

}else if(r.pastStats.trend<-0.20){

score-=1.5;

}

}

if(entryOrder[0]!==1){

if(r.course===entryOrder[0]){

score+=3;

}

if(r.course===1){

score-=2;

}

}

return Math.round(score*10)/10;

}

function analyzeRace(){

racers.forEach(r=>{

r.score=calcScore(r);

});

}

function getOrdered(){

return[...racers].sort((a,b)=>{

if(b.score!==a.score){

return b.score-a.score;

}

if(b.pastStats.score!==a.pastStats.score){

return b.pastStats.score-a.pastStats.score;

}

if(b.motor2!==a.motor2){

return b.motor2-a.motor2;

}

return b.national-a.national;

});

}

/* ================================

================================ */

function makeCombinations(){

const s=getOrdered();

const hit=[];

const roi=[];

const hole=[];

if(s[0]&&s[1]&&s[2]){

hit.push(`${s[0].course}-${s[1].course}-${s[2].course}`);

hit.push(`${s[0].course}-${s[2].course}-${s[1].course}`);

}

if(s[0]&&s[1]&&s[3]){

hit.push(`${s[0].course}-${s[1].course}-${s[3].course`);

}

for(let a=0;a<5;a++){

for(let b=0;b<5;b++){

for(let c=0;c<5;c++){

if(a===b||a===c||b===c)continue;

const combo=

`${s[a].course}-${s[b].course}-${s[c].course}`;

if(!roi.includes(combo)){

roi.push(combo);

}

if(roi.length>=8)break;

}

if(roi.length>=8)break;

}

if(roi.length>=8)break;

}

if(s[0]&&s[1]&&s[3]){

hole.push(`${s[0].course}-${s[1].course}-${s[3].course`);

hole.push(`${s[0].course}-${s[3].course}-${s[1].course`);

}

if(s[0]&&s[2]&&s[4]){

hole.push(`${s[0].course}-${s[2].course}-${s[4].course`);

}

return{hit,roi,hole};

}

/* ================================

   HTML安全化

================================ */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
