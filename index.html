tlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}.outlookEscape{border-color:#7b2d2d;background:#241414}.outlookNonEscape{border-color:#285b8c;background:#0e1722}.outlookInactive{border-color:#333!important;background:#151515!important}.outlookLabel{font-size:10px;color:#aaa}.outlookValue{font-size:22px;font-weight:900;margin-top:3px}.outlookEscape .outlookValue{color:#ff5555}.outlookNonEscape .outlookValue{color:#58a6ff}.outlookInactive .outlookValue{color:#777}.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}.decisionPositive{color:#4cd964}.decisionWarning{color:#ffd84d}.decisionDanger{color:#ff5555}.decisionMuted{color:#777!important}.outlookBand-balanced{border-color:#2e8b57!important;background:#102014!important}.outlookBand-balanced .outlookValue{color:#4cd964!important}.outlookCaution{margin-top:8px;padding:11px;border:2px solid #ffd84d;border-radius:8px;background:#211a07;color:#ffd84d;text-align:center;font-weight:900;font-size:15px;letter-spacing:.7px;box-shadow:0 0 0 1px #8a6d1c inset}.outlookLow{border-color:#444!important;background:#151515!important}.outlookLow .outlookLabel,.outlookLow .outlookStatus{color:#777!important}.outlookLow .outlookValue{color:#777!important}.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}.aiDetail strong{color:#d4af37}.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}.patternExcluded{color:#777;text-decoration:line-through}@media(max-width:600px){.grid2{grid-template-columns:1fr}.courseGrid{grid-template-columns:repeat(2,1fr)}.racers{grid-template-columns:1fr}.overviewGrid{grid-template-columns:repeat(2,1fr)}.betHeader,.betRow{grid-template-columns:1fr 1.3fr}.decisionStats{grid-template-columns:repeat(2,1fr)}}</style>

<header>

<div class="container">

</div>

</div>

</div>

<script>

"use strict";

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const HISTORY_RACES=20;

const HISTORY_DAYS=180;

const VENUE_TRAITS={

1:{name:"桐生",trait:"ナイター・イン有利"},

2:{name:"戸田",trait:"イン弱め・差し有利"},

3:{name:"江戸川",trait:"荒水面・波乱"},

4:{name:"平和島",trait:"イン弱め・差し有利"},

5:{name:"多摩川",trait:"イン有利・スピード水面"},

6:{name:"浜名湖",trait:"広い水面・まくり差し"},

7:{name:"蒲郡",trait:"ナイター・イン有利"},

8:{name:"常滑",trait:"イン有利"},

9:{name:"津",trait:"イン有利・まくり"},

10:{name:"三国",trait:"イン有利"},

11:{name:"びわこ",trait:"荒れやすい・差し"},

12:{name:"住之江",trait:"ナイター・イン有利"},

13:{name:"尼崎",trait:"イン有利"},

14:{name:"鳴門",trait:"潮流・まくり差し"},

15:{name:"丸亀",trait:"ナイター・イン有利"},

16:{name:"児島",trait:"まくり差し"},

17:{name:"宮島",trait:"イン有利・差し"},

18:{name:"徳山",trait:"イン鉄板級"},

19:{name:"下関",trait:"ナイター・イン有利"},

20:{name:"若松",trait:"ナイター・イン有利"},

21:{name:"芦屋",trait:"イン有利"},

22:{name:"福岡",trait:"差し・まくり差し"},

23:{name:"唐津",trait:"イン有利"},

24:{name:"大村",trait:"イン鉄板級"}

};

const $=id=>document.getElementById(id);

function num(v){

const n=parseFloat(v);

return Number.isFinite(n)?n:0;

}

function esc(v){

return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

}

function today(){

const d=new Date();

const y=d.getFullYear();

const m=String(d.getMonth()+1).padStart(2,"0");

const day=String(d.getDate()).padStart(2,"0");

return {year:y,month:m,day,ymd:`${y}${m}${day}`};

}

async function json(url){

const r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw new Error("HTTP "+r.status);

return await r.json();

}

function course(b){

return num($("course"+b)?.value)||b;

}

function resetCourses(){

for(let i=1;i<=6;i++){

const s=$("course"+i);

if(s)s.value=String(i);

}

}

function initCourses(){

for(let i=1;i<=6;i++){

const s=$("course"+i);

s.innerHTML="";

for(let c=1;c<=6;c++)s.add(new Option(c+"コース",c));

s.value=String(i);

}

}

function rank(n){

return{1:"A1",2:"A2",3:"B1",4:"B2"}[num(n)]||"-";

}

async function initTodayVenues(){

const v=$("venue");

v.innerHTML='<option value="">開催場を取得中...</option>';

const t=today();

const urls=[

`${API_V1}/today.json`,

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`

];

const found=new Map();

for(const url of urls){

try{

const data=await json(url);

const stadiums=

data?.programs?.stadiums||

data?.stadiums||

data?.programs?.venues||

data?.venues;

if(stadiums){

const list=Array.isArray(stadiums)

?stadiums

:Object.entries(stadiums).map(([k,x])=>({...x,_venueNo:k}));

list.forEach(x=>{

const n=num(

x._venueNo??

x.stadium_number??

x.stadiumNumber??

x.venue_number??

x.venueNumber??

x.number??

x.id

);

const name=

x.name??

x.stadium_name??

x.stadiumName??

x.venue_name??

x.venueName??

VENUE_TRAITS[n]?.name;

if(n>=1&&n<=24&&name)

found.set(n,String(name));

});

}

const races=data?.races;

if(races){

const list=Array.isArray(races)?races:Object.values(races);

list.forEach(x=>{

const n=num(

x.stadium_number??

x.stadiumNumber??

x.venue_number??

x.venueNumber??

x.stadiumNo??

x.venueNo

);

const name=

x.stadium_name??

x.stadiumName??

x.venue_name??

x.venueName??

VENUE_TRAITS[n]?.name;

if(n>=1&&n<=24&&name)

found.set(n,String(name));

});

}

if(found.size)break;

}catch(e){}

}

v.innerHTML="";

[...found.entries()]

.sort((a,b)=>a[0]-b[0])

.forEach(([n,name])=>v.add(new Option(name,n)));

if(!found.size){

Object.entries(VENUE_TRAITS)

.forEach(([n,x])=>v.add(new Option(x.name,n)));

$("message").innerHTML=

'<span class="error">⚠️ 本日の開催場を取得できなかったため、24場を表示しています</span>';

}

if(v.options.length)

v.value=v.options[0].value;

}

let raceData=null;

let raceRows=[];

let historyCache={};

async function loadRaceData(){

$("message").innerHTML='<span class="loading">⏳ 出走表取得中...</span>';

$("raceCard").style.display="none";

$("analysisCard").style.display="none";

$("overviewCard").style.display="none";

$("attackCard").style.display="none";

$("exclusionCard").style.display="none";

$("forecastCard").style.display="none";

try{

const venue=num($("venue").value);

const race=num($("raceNo").value);

const t=today();

if(!venue)throw new Error("開催場を選択してください");

const urls=[

`${API_V1}/${t.year}/${t.ymd}/${venue}/${race}.json`,

`${API_V1}/${t.year}/${t.month}/${t.day}/${venue}/${race}.json`,

`${API_V3}/${t.year}/${t.ymd}/${venue}/${race}.json`,

`${API_V3}/${t.year}/${t.month}/${t.day}/${venue}/${race}.json`,

`${API_V2}/${t.year}/${t.ymd}/${venue}/${race}.json`,

`${API_V2}/${t.year}/${t.month}/${t.day}/${venue}/${race}.json`

];

let data=null;

for(const u of urls){

try{

data=await json(u);

if(data)break;

}catch(e){}

}

if(!data)

throw new Error("出走表データを取得できませんでした");

raceData=data;

raceRows=

data?.races?.[0]?.entries||

data?.race?.entries||

data?.entries||

data?.racers||

data?.program?.entries||

[];

if(!Array.isArray(raceRows))

raceRows=Object.values(raceRows||{});

if(!raceRows.length){

const entries=

data?.programs?.[0]?.entries||

data?.program?.racers||

data?.racer_data||

[];

raceRows=Array.isArray(entries)?entries:Object.values(entries||{});

}

if(!raceRows.length)

throw new Error("出走表の選手データが見つかりませんでした");

renderRace();

$("raceCard").style.display="block";

$("message").innerHTML=

'<span class="success">✅ 出走表取得成功<br>AI解析時に同コース過去15走を取得します</span>';

}catch(e){

$("message").innerHTML=

'<span class="error">❌ 出走表取得失敗<br>'+esc(e.message)+'</span>';

}

}

function racer(b){

return raceRows.find(r=>num(r.entry_number||r.boat_number||r.boat||r.number)===num(b));

}

function getRacerNumber(r){

return r?.registration_number||

r?.racer_number||

r?.player_number||

r?.registrationNo||

r?.racerNo||

"";

}

function preview(b){

const r=racer(b);

if(!r)return{};

return r.preview||

r.pre_race||

r.preRace||

r.latest||

r.recent||

{};

}

function renderRace(){

const venue=num($("venue").value);

const race=num($("raceNo").value);

const name=VENUE_TRAITS[venue]?.name||"";

$("raceInfo").innerHTML=

`<div class="info">

<strong>${esc(

raceData.title||

raceData.race_name||

raceData.name||

`${name} ${race}R`

)}</strong><br>

開催日：${esc(

raceData.date||

raceData.race_date||

raceData.date_string||

today().ymd

)}<br>

距離：${num(

raceData.distance||

raceData.distance_m||

1800

)}m<br>

API：boatraceopenapi

</div>`;

$("racers").innerHTML=

[1,2,3,4,5,6].map(b=>{

const r=racer(b)||{};

const p=preview(b);

const m=num(
