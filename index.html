<!DOCTYPE html>

<head>

<title>BOAT HUNTER</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

header{background:linear-gradient(135deg,#080808,#211a07);border-bottom:1px solid #b8952e;padding:18px;text-align:center}

header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:3px}

header p{margin:5px 0 0;font-size:12px;color:#999}

.container{max-width:1000px;margin:auto;padding:14px}

.card{background:#111;border:1px solid #292929;border-radius:12px;padding:14px;margin-bottom:14px}

h2{margin:0 0 12px;font-size:17px;color:#d4af37}

h3{font-size:14px;color:#d4af37;margin:14px 0 8px}

label{font-size:11px;color:#aaa;display:block;margin-bottom:5px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{width:100%;padding:13px;border:0;border-radius:9px;font-size:14px;font-weight:bold}

.mainBtn{margin-top:12px;background:linear-gradient(135deg,#d4af37,#8b6914);color:#000}

.subBtn{margin-top:8px;background:#222;border:1px solid #555;color:#fff}

.resetBtn{margin-top:8px;background:#171717;border:1px solid #777;color:#fff}

.topBtn{margin-top:14px;background:#171717;border:1px solid #b8952e;color:#d4af37}

.message{margin-top:10px;font-size:12px;line-height:1.6;color:#aaa}

.info{background:#151515;border:1px solid #333;border-radius:8px;padding:10px;font-size:11px;line-height:1.7;margin-bottom:10px}

.courseGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.courseBox{background:#171717;padding:8px;border-radius:8px;border:1px solid #333}

.racers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.racer{background:#171717;border:1px solid #333;border-radius:9px;padding:9px}

.racerTop{display:flex;align-items:center;gap:8px}

.number{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#000}

.n1{background:#fff}.n2{background:#222;color:#fff;border:1px solid #777}.n3{background:#e22;color:#fff}.n4{background:#248cff;color:#fff}.n5{background:#e5d000}.n6{background:#20a747;color:#fff}

.racerName{font-weight:bold}

.small{font-size:10px;color:#aaa;line-height:1.6;margin-top:6px}

.tech{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.tech div{background:#101010;border:1px solid #292929;border-radius:6px;padding:6px;font-size:10px;text-align:center}

.tech span{display:block;color:#888;margin-bottom:2px}

.decisionStats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}

.decisionStat span{display:block;color:#888;margin-bottom:2px}

.decisionStat strong{display:block;color:#d4af37;font-size:12px}

.history{margin-top:8px;background:#0d0d0d;border:1px solid #292929;border-radius:8px;padding:8px}

.historyTitle{color:#d4af37;font-weight:bold;font-size:11px;margin-bottom:6px}

.historyStats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}

.historyStat{background:#151515;border-radius:5px;padding:5px 2px;text-align:center;font-size:9px;color:#aaa}

.historyStat strong{display:block;font-size:12px;color:#d4af37;margin-top:2px}

.historyList{font-size:9px;color:#aaa;line-height:1.6;max-height:180px;overflow-y:auto}

.historyItem{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:3px 0}

.historyItem:last-child{border-bottom:0}

.historyGood{color:#4cd964;font-weight:bold}.historyBad{color:#777}.historyMiddle{color:#ffd84d;font-weight:bold}.historyDecision{color:#d4af37;font-weight:bold}

table{width:100%;border-collapse:collapse;font-size:11px}

th,td{padding:7px 3px;border-bottom:1px solid #292929;text-align:center}

th{color:#d4af37}

.strategy{background:#171717;border-left:3px solid #d4af37;padding:9px;font-size:11px;line-height:1.7;margin-top:8px}

.attackBox{background:#211a07;border:1px solid #8a6d1c;border-radius:9px;padding:10px;font-size:11px;line-height:1.8;margin-top:8px}

.attackMain{font-size:15px;font-weight:bold;color:#ffd84d}.attackSub{color:#aaa;margin-top:4px}

.exclusion{background:#241414;border-left:3px solid #e55;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.exclusionKeep{background:#171707;border-left:3px solid #d4af37;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.revivalBox{background:#211a07;border-left:3px solid #ffd84d;padding:8px;font-size:11px;margin-top:6px;line-height:1.6}

.pickBox{background:#151515;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.pickTitle{color:#d4af37;font-weight:bold;font-size:14px;margin-bottom:6px}

.betHeader{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;background:#0d0d0d;border:1px solid #292929;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px;color:#888;text-align:center}

.betRow:last-child{border-bottom:0}

.bet2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:bold}

.bet2Number{background:#211a07;border:1px solid #8a6d1c;border-radius:6px;padding:5px 8px;color:#ffd84d}

.betPercent{font-size:11px;color:#ffd84d;font-weight:bold}

.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #292929;font-size:12px}

.pick:last-child{border-bottom:0}.pickLeft{display:flex;align-items:center;gap:5px}

.prob{color:#ffd84d;font-weight:bold}

.pick.veryStrong .prob,.pick.veryStrong strong{color:#ff3b30}.pick.veryStrong .prob{font-size:15px;font-weight:900}

.pick.strong .prob,.pick.strong strong{color:#ffd84d}.pick.strong .prob{font-size:14px;font-weight:900}

.pick.weak{opacity:.38}

.total{background:#1c1709;border:1px solid #8a6d1c;border-radius:8px;padding:10px;text-align:center;color:#d4af37;font-weight:bold;margin-bottom:8px}

.budgetInfo{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:11px;line-height:1.6;color:#aaa}

.budgetStrong{color:#d4af37;font-weight:bold}.noPick{font-size:11px;color:#777;padding:8px 0;line-height:1.6}

.overviewGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}

.overviewBox{background:#101010;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}

.overviewBox .label{font-size:10px;color:#888}.overviewBox .value{font-size:16px;font-weight:bold;color:#d4af37;margin-top:3px}

.overviewBox.main{border-color:#8a6d1c;background:#1c1709}

.overviewReason{font-size:11px;color:#aaa;line-height:1.7;margin-top:8px}

.venueBox{background:#101010;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.venueBox strong{color:#d4af37}.formBox{background:#151515;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px;font-size:10px;line-height:1.7}

.footer{text-align:center;color:#555;font-size:10px;padding:20px}

.loading{color:#d4af37}.success{color:#4cd964}.error{color:#ff5555}

.betEscape{color:#ff9500}.betSashi{color:#4cd964}.betMaki{color:#ff5555}.betMakiSashi{color:#58a6ff}

.recommendPick{opacity:.52}.recommendTitle{color:#888!important}

.outlookBox{background:#101010;border:1px solid #333;border-radius:9px;padding:10px;margin-top:9px}

.outlookTitle{font-size:13px;font-weight:bold;color:#d4af37;margin-bottom:8px}

.outlookGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.outlookItem{border-radius:8px;padding:9px;text-align:center;border:1px solid #333;background:#151515}

.outlookEscape{border-color:#8f3030;background:#241414;color:#ff5555}

.outlookNonEscape{border-color:#285b8c;background:#0e1722;color:#58a6ff}

.outlookInactive{border-color:#333!important;background:#151515!important}

.outlookLabel{font-size:10px;color:#aaa}.outlookEscape .outlookLabel{color:#ff5555}.outlookNonEscape .outlookLabel{color:#58a6ff}

.outlookValue{font-size:22px;font-weight:900;margin-top:3px}

.outlookEscape .outlookValue{color:#ff5555}

.outlookNonEscape .outlookValue{color:#58a6ff}

.outlookInactive .outlookLabel,.outlookInactive .outlookValue,.outlookInactive .outlookStatus{color:#777!important}

.outlookStatus{font-size:10px;margin-top:4px;font-weight:bold}.outlookEscape .outlookStatus{color:#ff5555}.outlookNonEscape .outlookStatus{color:#58a6ff}

.decisionPositive{color:#4cd964}

.decisionWarning{color:#ffd84d}

.decisionDanger{color:#ff5555}

.aiDetail{background:#101010;border:1px solid #292929;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;line-height:1.7}

.aiDetail strong{color:#d4af37}

.patternNote{font-size:10px;color:#888;line-height:1.7;margin-top:6px}

.thirdProb{color:#ffd84d;font-weight:bold;font-size:10px}

.patternExcluded{color:#777;text-decoration:line-through}

@media(max-width:600px){

.grid2{grid-template-columns:1fr}

.courseGrid{grid-template-columns:repeat(2,1fr)}

.racers{grid-template-columns:1fr}

.overviewGrid{grid-template-columns:repeat(2,1fr)}

.betHeader,.betRow{grid-template-columns:1fr 1.3fr}

}

</style>

<body>

<script>

const API_V1="https://boatraceopenapi.github.io/api/v1";

const API_V3="https://boatraceopenapi.github.io/programs/v3";

const API_V2="https://boatraceopenapi.github.io/programs/v2";

const API_PREVIEW_V3="https://boatraceopenapi.github.io/previews/v3";

const API_PREVIEW_V2="https://boatraceopenapi.github.io/previews/v2";

let raceData=null,racers=[],previewRacers={},manualCourses={},historyData={},currentBets=null;

const HISTORY_RACES=15;

const HISTORY_DAYS=180;

const $=id=>document.getElementById(id);

const num=v=>{

if(v==null||v==="")return 0;

let x=parseFloat(String(v).replace(/[%,秒,]/g,""));

return Number.isFinite(x)?x:0

};

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function course(b){return Number(manualCourses[b]||b)}

function racer(b){return racers.find(x=>num(x.entry_number)===b)}

function preview(b){return previewRacers[b]||previewRacers[String(b)]||{}}

function today(){

let p=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());

return{

year:p.find(x=>x.type==="year").value,

ymd:p.find(x=>x.type==="year").value+p.find(x=>x.type==="month").value+p.find(x=>x.type==="day").value

}

}

function dateInfo(d){

return{

year:String(d.getFullYear()),

ymd:String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")

}

}

async function json(url){

let r=await fetch(url,{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

return r.json()

}

function normalizeEntry(x,i,key){

if(x==null||typeof x!=="object")return null;

let entry=num(

key??x.entry_number??x.entryNumber??x.boat_number??x.boatNumber??x.boat_no??

x.number_boat??x.boat??x.lane??x.lane_number??x.laneNumber??

x.course_number??x.course??x.entry??x.number

);

if(!entry&&i<6)entry=i+1;

let name=x.name??x.racer_name??x.racerName??x.player_name??x.playerName??

x.racer??x.player??x.racers_name??"";

if(typeof name==="object")name=name.name||name.racer_name||name.player_name||"";

return{...x,entry_number:entry,name:name}

}

function extractRaceEntries(race){

if(!race)return[];

const directCandidates=[

race.racers,race.entries,race.participants,race.program,race.race_entries,

race.racer,race.players,race.boats,race.starting_list,race.startingList,

race.entry_list,race.entryList,race.raceRacers,race.race_entries_list

];

for(const source of directCandidates){

if(!source)continue;

let list=Array.isArray(source)?

source.map((x,i)=>normalizeEntry(x,i)):

Object.entries(source).map(([key,x],i)=>normalizeEntry(x,i,key));

list=list.filter(x=>x&&x.entry_number>=1&&x.entry_number<=6);

let unique=new Map();

list.forEach(x=>{if(!unique.has(x.entry_number))unique.set(x.entry_number,x)});

list=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

if(list.length===6)return list

}

return extractEntriesDeep(race)

}

function extractEntriesDeep(root){

let found=[];

function walk(obj,depth=0,parentKey=null){

if(!obj||depth>12)return;

if(Array.isArray(obj)){

for(const x of obj)walk(x,depth+1,null);

return

}

if(typeof obj!=="object")return;

const looksLikeRacer=obj.name!=null||obj.racer_name!=null||obj.racerName!=null||

obj.player_name!=null||obj.registration_number!=null||obj.racer_number!=null||obj.player_number!=null;

const e=num(parentKey??obj.entry_number??obj.entryNumber??obj.boat_number??obj.boatNumber??

obj.boat_no??obj.lane??obj.course_number??obj.course??obj.entry);

if(looksLikeRacer&&e>=1&&e<=6){

let z=normalizeEntry(obj,0,e);

if(z)found.push(z)

}

for(const k of Object.keys(obj)){

if(k==="result"||k==="results"||k==="history")continue;

walk(obj[k],depth+1,k)

}

}

walk(root);

let unique=new Map();

found.forEach(x=>{if(!unique.has(x.entry_number))unique.set(x.entry_number,x)});

let list=Array.from(unique.values()).sort((a,b)=>a.entry_number-b.entry_number);

return list.length===6?list:[]

}

function findRace(data,venue,raceNo){

let found=null;

function walk(obj){

if(found||obj==null)return;

if(Array.isArray(obj)){

for(const item of obj){walk(item);if(found)break}

return

}

if(typeof obj!=="object")return;

const rn=obj.race_number??obj.raceNumber??obj.race_no??obj.raceNo??obj.raceno;

const vn=obj.stadium_number??obj.stadiumNumber??obj.venue_number??obj.venueNumber??obj.stadiumNo??obj.venueNo;

if(rn!=null&&String(rn)===String(raceNo)&&(vn==null||String(vn)===String(venue))){

let list=extractRaceEntries(obj);

if(list.length===6){found=obj;return}

}

for(const key of Object.keys(obj)){walk(obj[key]);if(found)break}

}

walk(data);

return found

}

function directRace(data,v,r){

const sv=String(v),sr=String(r);

const exact=[

data?.programs?.stadiums?.[sv]?.races?.[sr],

data?.programs?.stadiums?.[sv]?.races?.[Number(r)],

data?.stadiums?.[sv]?.races?.[sr],

data?.stadiums?.[sv]?.races?.[Number(r)],

data?.races?.[sr],data?.races?.[Number(r)]

];

for(const x of exact){

if(x&&extractRaceEntries(x).length===6)return x

}

const raceArrays=[

data?.programs?.stadiums?.[sv]?.races,

data?.stadiums?.[sv]?.races,

data?.races,

data?.programs?.races

];

for(const arr of raceArrays){

if(!arr)continue;

const entries=Array.isArray(arr)?arr.map((z,i)=>[String(i+1),z]):Object.entries(arr);

const x=entries.find(([key,z])=>{

const rn=z?.race_number??z?.raceNumber??z?.race_no??z?.raceNo??key;

const vn=z?.stadium_number??z?.stadiumNumber??z?.venue_number??z?.venueNumber;

return String(rn)===sr&&(vn==null||String(vn)===sv)&&extractRaceEntries(z).length===6

});

if(x)return x[1]

}

return findRace(data,v,r)

}

async function loadPreviewForRace(v,r,t){

if(raceData?.preview)return;

const urls=[

`${API_PREVIEW_V3}/${t.year}/${t.ymd}.json`,

`${API_PREVIEW_V3}/today.json`,

`${API_PREVIEW_V2}/${t.year}/${t.ymd}.json`,

`${API_PREVIEW_V2}/today.json`

];

for(const url of urls){

try{

let data=await json(url);

let p=directRace(data,v,r);

if(!p)continue;

previewRacers=p.preview?.racers||p.racers||p.entries||{};

if(Object.keys(previewRacers).length) {

if(!raceData.preview)raceData.preview=p;

return

}

}catch(e){}

}

}

async function loadDaily(){

let t=today(),v=$("venue").value,r=$("race").value;

const urls=[

/* 現行APIを最優先。v1は出走表・直前情報・結果を同一レスポンスで提供。 */

`${API_V1}/${t.year}/${t.ymd}.json`,

`${API_V1}/today.json`,

/* 旧APIは互換用フォールバック */

`${API_V3}/${t.year}/${t.ymd}.json`,

`${API_V3}/today.json`,

`${API_V2}/${t.year}/${t.ymd}.json`,

`${API_V2}/today.json`

];

let errors=[];

for(const url of urls){

try{

let data=await json(url);

let race=directRace(data,v,r);

/* APIの階層差に備え、directRaceで取れない場合も全体探索する。 */

if(!race)race=findRace(data,v,r);

if(race){

let list=extractRaceEntries(race);

if(list.length===6)return{data,race,base:url};

errors.push(url+" : race found but entries="+list.length)

}else errors.push(url+" : race not found")

}catch(e){errors.push(url+" : "+e.message)}

}

throw Error("APIから6艇の出走表を取得できませんでした.\n"+errors.slice(-6).join("\n"))

}

function initCourses(){

for(let b=1;b<=6;b++){

let e=$("course"+b);

e.innerHTML="";

for(let c=1;c<=6;c++)e.add(new Option(c+"コース",c));

e.value=String(b);

manualCourses[b]=b;

e.onchange=()=>manualCourses[b]=Number(e.value)

}

}

function resetCourses(){

for(let b=1;b<=6;b++){

$("course"+b).value=String(b);

manualCourses[b]=b

}

$("message").innerHTML='<span class="success">🔄 進入入力をリセットしました</span>'

}

async function loadRaceData(){

$("message").innerHTML='<span class="loading">⏳ 出走表を取得中...</span>';

$("raceCard").style.display="none";

$("analysisCard").style.display="none";

historyData={};

currentBets=null;

try{

let api=await loadDaily();

raceData=api.race;

let list=extractRaceEntries(raceData);

if(list.length!==6)throw Error("6艇の選手データを取得できませんでした");

racers=list;

previewRacers=raceData.preview?.racers||raceData.preview?.entries||raceData.preview||{};

if(!Object.keys(previewRacers||{}).length){

await loadPreviewForRace($("venue").value,$("race").value,today());

previewRacers=raceData.preview?.racers||raceData.preview?.entries||previewRacers||{};

}

for(let b=1;b<=6;b++){

let p=preview(b);

let c=num(p.course_number||p.course||p.entry_course||p.entry||p.lane);

if(c>=1&&c<=6){

$("course"+b).value=String(c);

manualCourses[b]=c

}

}

renderRace();

$("raceCard").style.display="block";

$("message").innerHTML='<span class="success">✅ 出走表取得成功<br>AI解析時に同コース過去15走を取得します</span>';

}catch(e){

console.error(e);

$("message").innerHTML='<span class="error">❌ 出走表取得失敗<br>'+esc(e.message).replace(/\n/g,"<br>")+'</span>'

}

}

function getRacerNumber(x){

return num(x?.number||x?.registration_number||x?.racer_number||x?.racer_no||

x?.player_number||x?.registrationNo||x?.racerNumber)

}

function getResultRacerNumber(x){

return num(x?.number||x?.racer_number||x?.registration_number||

x?.player_number||x?.racerNumber||x?.boat_number||x?.boatNumber)

}

function getPlace(x){

return num(x?.place_number||x?.place||x?.finish_position||x?.arrival||x?.rank)

}

function getCourse(x){

return num(x?.course_number||x?.course||x?.entry_course||x?.entry||x?.lane)

}

function decision(n){

if(n==null||n==="")return"-";

if(typeof n==="object"){

n=n.number??n.id??n.code??n.value??n.name??n.label??n.technique??n.technique_name??""

}

let s=String(n).trim();

if(!s)return"-";

const normalized=s.replace(/\s/g,"").replace(/　/g,"").toLowerCase();

if(normalized==="1"||normalized==="逃げ"||normalized==="nige"||normalized==="escape")return"逃げ";

if(normalized==="2"||normalized==="差し"||normalized==="差し切り"||normalized==="sashi")return"差し";

if(normalized==="3"||normalized==="まくり"||normalized==="捲り"||normalized==="maki"||normalized==="makuri")return"まくり";

if(normalized==="4"||normalized==="まくり差し"||normalized==="捲り差し"||normalized==="まくりさし"||normalized==="makisashi"||normalized==="makuri-sashi")return"まくり差し";

if(normalized==="5"||normalized==="抜き"||normalized==="nuki")return"抜き";

if(normalized==="6"||normalized==="恵まれ"||normalized==="megumare")return"恵まれ";

return s

}

function cleanRate(v){

if(v==null||v==="")return 0;

if(typeof v==="object"){

v=v.rate??v.percent??v.percentage??v.value??v.number??v.source??0

}

let s=String(v).replace(/[%％,\s]/g,"");

let x=parseFloat(s);

return Number.isFinite(x)?x:0

}

function classification(b,a){

let x=a.find(z=>z.boat===b);

if(!x)return{type:"normal"};

let avg=scoreAverage(a);

if(x.score<=avg-30)return{type:"cut"};

if(x.score<=avg-15)return{type:"third"};

return{type:"normal"}

}

function scoreAverage(a){

if(!a.length)return 0;

return a.reduce((s,x)=>s+x.score,0)/a.length

}

function hstats(b){

let r=racer(b);

let n=getRacerNumber(r);

let arr=historyData[n]?.boats?.[course(b)]||[];

if(!arr.length)return{count:0,rate:0};

let good=arr.filter(x=>x.place>=1&&x.place<=3).length;

return{count:arr.length,rate:good/arr.length*100}

}

function recentFormValue(b){

let r=racer(b);

let n=getRacerNumber(r);

let arr=historyData[n]?.recent||[];

if(!arr.length)return 0;

let sum=0;

arr.slice(0,15).forEach(x=>{

if(x.place===1)sum+=3;

else if(x.place===2)sum+=2;

else if(x.place===3)sum+=1;

else if(x.place>=4)sum-=.5

});

return Math.max(-5,Math.min(5,sum/5))

}

function recentForm(b){

let v=recentFormValue(b);

if(v>=3)return{score:v,label:"好調"};

if(v<=-2)return{score:v,label:"不調"};

if(v>=1)return{score:v,label:"やや好調"};

if(v<=-.5)return{score:v,label:"やや不調"};

return{score:v,label:"普通"}

}

function windInfo(){

let p=raceData?.preview||raceData?.previews||raceData||{};

let speed=num(

p.wind_speed||

p.windSpeed||

p.wind||

p.wind_velocity

);

let direction=num(

p.wind_direction_number||

p.windDirectionNumber||

p.wind_direction||

p.windDirection

);

let label="風情報なし";

if(speed>0){

if(direction===1)label="北風";

else if(direction===2)label="北東風";

else if(direction===3)label="東風";

else if(direction===4)label="南東風";

else if(direction===5)label="南風";

else if(direction===6)label="南西風";

else if(direction===7)label="西風";

else if(direction===8)label="北西風";

else label="風向不明"

}

let mode="none";

if([1,2,8].includes(direction))mode="head";

if([5,6,4].includes(direction))mode="tail";

return{speed,direction,label,mode}

}

function windCorrection(b,type){

let w=windInfo();

let v=0;

if(w.speed<2)return 0;

if(w.mode==="head"){

if(type==="maki"||type==="makiSashi")v+=w.speed*1.8;

if(course(b)>=4)v+=w.speed*1.2;

if(type==="escape"&&course(b)===1)v-=w.speed*.8

}

if(w.mode==="tail"){

if(type==="escape"&&course(b)===1)v+=w.speed*1.4;

if(type==="sashi"&&(course(b)===2||course(b)===3))v+=w.speed*1.1;

if(type==="maki"&&course(b)>=4)v-=w.speed*.4

}

return v

}

function decisions(r){

r=r||{};

let escape=cleanRate(

r.escape_rate||

r.nige_rate||

r.nige_percent||

r.escape||

r.decision_escape

);

let sashi=cleanRate(

r.sashi_rate||

r.sashi_percent||

r.decision_sashi||

r.sashi

);

let maki=cleanRate(

r.maki_rate||

r.makuri_rate||

r.makuri_percent||

r.decision_maki||

r.maki

);

let makiSashi=cleanRate(

r.maki_sashi_rate||

r.makuri_sashi_rate||

r.makuri_sashi_percent||

r.decision_maki_sashi||

r.maki_sashi

);

let sasareRate=cleanRate(

r.sasare_rate||

r.beaten_by_sashi_rate||

r.lost_to_sashi_rate||

r.sashi_lost_rate

);

let makareRate=cleanRate(

r.makare_rate||

r.beaten_by_makuri_rate||

r.lost_to_makuri_rate||

r.makuri_lost_rate

);

let makiSashiSareRate=cleanRate(

r.maki_sashi_sare_rate||

r.beaten_by_maki_sashi_rate||

r.lost_to_maki_sashi_rate||

r.makuri_sashi_lost_rate

);

if(r.technique_stats){

let t=r.technique_stats;

escape=escape||cleanRate(t.escape);

sashi=sashi||cleanRate(t.sashi);

maki=maki||cleanRate(t.maki);

makiSashi=makiSashi||cleanRate(t.maki_sashi);

}

return{escape,sashi,maki,makiSashi,sasareRate,makareRate,makiSashiSareRate}

}

function decisionEvaluation(b,type){

let r=racer(b)||{};

let d=decisions(r);

let value=0,label="普通";

if(type==="escape"){

value=d.escape;

if(value>=83)label="イン逃げ鉄板激アツ";

else if(value>=65)label="イン逃げ期待大";

else if(value>=50)label="場平均";

else if(value<35)label="イン逃げ不安"

}else if(type==="sashi"){

value=d.sashi;

if(value>=23)label="差し激アツ";

else if(value>=18)label="差し期待大";

else if(value>=10)label="場平均";

else label="差し弱め"

}else if(type==="maki"){

value=d.maki;

if(value>=23)label="まくり激アツ";

else if(value>=18)label="まくり期待大";

else if(value>=10)label="場平均";

else label="まくり弱め"

}else{

value=d.makiSashi;

if(value>=23)label="まくり差し激アツ";

else if(value>=18)label="まくり差し期待大";

else if(value>=10)label="場平均";

else label="まくり差し弱め"

}

return{value,label}

}

function suitability(b,type){

let c=course(b);

let v=0;

if(type==="escape"){

if(c===1)v+=15;

else if(c===2)v+=5;

else v-=c*1.5

}

if(type==="sashi"){

if(c===2)v+=16;

else if(c===3)v+=9;

else if(c===1)v+=5;

else v-=1

}

if(type==="maki"){

if(c===3)v+=15;

else if(c===4)v+=13;

else if(c===5)v+=7;

else if(c===6)v+=3;

else if(c===2)v-=6

}

if(type==="makiSashi"){

if(c===3)v+=14;

else if(c===4)v+=15;

else if(c===5)v+=13;

else if(c===6)v+=7;

else if(c===2)v-=7

}

return v

}

function goodHistory(b){

let n=getRacerNumber(racer(b));

let arr=historyData[n]?.boats?.[course(b)]||[];

if(arr.length<5)return false;

let top=arr.slice(0,15).filter(x=>x.place>=1&&x.place<=3).length;

return top/Math.min(15,arr.length)>=.4

}

function baseAIScore(b){

let r=racer(b)||{};

let win=racerWinRate(b);

let local=localWinRate(b);

let motor=motorRate(b);

let three=racerThreeRate(b);

let st=stValue(b);

let ex=exhibitionValue(b);

let form=recentFormValue(b);

let hs=hstats(b);

let v=0;

v+=win*4;

v+=local*2;

v+=motor*.55;

v+=three*.12;

if(st>0)v+=(.13-st)*35;

if(ex>0)v+=(6.95-ex)*10;

v+=form*5;

v+=hs.rate*.12;

return v

}

function decisionScore(b,type){

let r=racer(b)||{};

let d=decisions(r);

let v=0;

if(type==="escape")v+=d.escape*.35;

if(type==="sashi")v+=d.sashi*1.4;

if(type==="maki")v+=d.maki*1.4;

if(type==="makiSashi")v+=d.makiSashi*1.4;

if(b===1&&type==="escape")v+=15;

if(b!==1&&type!=="escape")v+=5;

return v

}

function aiScoreForType(b,type){

let v=baseAIScore(b);

v+=decisionScore(b,type);

v+=suitability(b,type);

v+=windCorrection(b,type);

let venue=venueTrait();

if(type==="escape"&&course(b)===1)v*=venue.inside;

if(type==="sashi")v*=venue.sashi;

if(type==="maki")v*=venue.maki;

if(type==="makiSashi")v*=venue.makiSashi||1;

return v

}

function ranking(type="all"){

let arr=racers.map(x=>{

let b=num(x.entry_number);

let types=["escape","sashi","maki","makiSashi"];

let scores=types.map(t=>aiScoreForType(b,t));

let score=type==="all"?

scores.reduce((s,x)=>s+x,0)/scores.length:

aiScoreForType(b,type);

return{boat:b,racer:x,score}

});

arr.sort((a,b)=>b.score-a.score);

return arr

}

function overallEscapeProbability(){

let r1=racer(1)||{};

let d=decisions(r1);

let base=d.escape||0;

let others=0;

for(let b=2;b<=6;b++){

let r=racer(b)||{};

let x=decisions(r);

others+=d.sashi+d.maki+d.makiSashi?0:0;

others+=decisions(r).sashi+decisions(r).maki+decisions(r).makiSashi

}

let ability=0;

for(let b=1;b<=6;b++){

ability+=baseAIScore(b)

}

let oneScore=baseAIScore(1);

let relative=ability?oneScore/ability:1/6;

let escape=base*.55+relative*45;

let venue=venueTrait();

escape*=venue.inside;

let w=windInfo();

escape+=windCorrection(1,"escape")*.5;

escape=Math.max(10,Math.min(90,escape));

return{escape,nonEscape:100-escape}

}

function dominant(o){

if(o.escape>=60)return"escape";

let scores={sashi:0,maki:0,makiSashi:0};

for(let b=2;b<=6;b++){

let r=racer(b)||{};

scores.sashi+=decisions(r).sashi*1.2;

scores.maki+=decisions(r).maki*1.2;

scores.makiSashi+=decisions(r).makiSashi*1.2;

scores.sashi+=aiScoreForType(b,"sashi")*.15;

scores.maki+=aiScoreForType(b,"maki")*.15;

scores.makiSashi+=aiScoreForType(b,"makiSashi")*.15

}

return Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0]

}

function patternThirdScore(b,rankings,type){

let x=rankings.find(z=>z.boat===b);

if(!x)return -999;

let v=x.score;

v+=motorRate(b)*.35;

v+=recentFormValue(b)*4;

v+=suitability(b,type)*.35;

let dev=developmentBonus(b,rankings,type);

v+=dev.bonus*.8;

if(goodHistory(b))v+=5;

return v

}

function developmentBonus(b,rankings,type){

let x=rankings.find(z=>z.boat===b);

if(!x)return{bonus:0,reason:""};

let rank=x.rank||rankings.indexOf(x)+1;

let bonus=0,reason="";

if(type==="maki"){

let maki=rankings.filter(z=>z.boat!==1&&course(z.boat)>=3).sort((a,b)=>b.score-a.score)[0];

if(maki&&maki.boat!==b){

let mc=course(maki.boat);

if(course(b)===mc+1){

bonus+=8;

reason="まくり後ろ"

}

}

}

if(type==="makiSashi"){

let attacker=rankings.filter(z=>z.boat!==1).sort((a,b)=>b.score-a.score)[0];

if(attacker&&b!==attacker.boat){

let gap=course(b)-course(attacker.boat);

if(gap>=1&&gap<=2){

bonus+=7;

reason="まくり差し展開"

}

}

}

if(type==="sashi"){

let attacker=rankings.filter(z=>z.boat!==1).sort((a,b)=>b.score-a.score)[0];

if(attacker&&course(b)<course(attacker.boat)){

bonus+=5;

reason="差し先行残り"

}

}

return{bonus,reason}

}

function thirdProbabilityList(excluded,rankings,type){

let list=[];

for(let b=2;b<=6;b++){

if(excluded.includes(b))continue;

let v=patternThirdScore(b,rankings,type);

if(v<=-900)continue;

list.push({

boat:b,

value:v

})

}

list.sort((a,b)=>b.value-a.value);

let min=list.length?Math.min(...list.map(x=>x.value)):0;

let weights=list.map(x=>Math.max(.1,x.value-min+5));

let total=weights.reduce((s,x)=>s+x,0)||1;

list.forEach((x,i)=>{

x.prob=weights[i]/total*100

});

return list

}

function bestSecondNonOne(rankings){

return rankings.find(x=>x.boat!==1)?.boat||null

}

function patternTwoCandidates(rankings){

let avg=scoreAverage(rankings);

let eligible=[];

rankings.forEach((x,i)=>{

if(x.boat===1)return;

let lowAI=x.score<=avg-20;

let weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

eligible.push({

boat:x.boat,

rank:i+1,

score:x.score

})

});

let fourth=rankings[3],

fifth=rankings[4],

picked=[];

[fourth,fifth].forEach(x=>{

if(!x||x.boat===1)return;

let lowAI=x.score<=avg-20;

let weakMotor=motorRate(x.boat)<30;

if(lowAI&&weakMotor)return;

if(!picked.includes(x.boat))picked.push(x.boat)

});

if(!picked.length&&eligible.length){

picked.push(eligible[0].boat)

}

if(picked.length>2)picked=picked.slice(0,2);

return{

picked,

eligible,

avg

}

}

let forced=x.boat===forcedBoat;

let duplicate=secondBoats.includes(x.boat)||x.boat===firstBoat;

if(duplicate&&!forced)return"";

return`

<div class="thirdCandidate ${forced?"revival":"normal"}">

${x.boat}号艇

<span class="thirdProb">${x.prob.toFixed(1)}%</span>

${forced?'<span class="revivalLabel">⭐ AI80以上＋モーター35%以上</span>':""}

</div>`

}).join("")}

</div>`

}

if(forced6&&!p1Third.some(x=>x.boat===forced6.boat)){

p1Third.push({

boat:forced6.boat,

value:patternThirdScore(forced6.boat,rankings,type),

prob:0,

forced:true

})

}

p1Third.sort((a,b)=>{

if(a.boat===forced6?.boat)return -1;

if(b.boat===forced6?.boat)return 1;

return b.value-a.value

});

let p2=patternTwoCandidates(rankings);

/* パターン2の3着はAI評価最上位→次位を基本採用。1号艇と2着候補は重複させない。 */

.filter(x=>x.boat!==1&&!p2.picked.includes(x.boat))

.slice(0,2)

value:patternThirdScore(x.boat,rankings,type),

prob:0

}));

if(forced6&&!p2Third.some(x=>x.boat===forced6.boat)){

p2Third.push({

value:patternThirdScore(forced6.boat,rankings,type),

prob:0,

forced:true

})

}

p2Third.sort((a,b)=>{

if(a.boat===forced6?.boat)return -1;

if(b.boat===forced6?.boat)return 1;

return b.value-a.value

});

if(forced6){

let all1=p1Third.filter(x=>x.boat!==forced6.boat);

let total1=all1.reduce((s,x)=>s+Math.max(.1,x.value),0)||1;

all1.forEach(x=>x.prob=Math.max(.1,x.value)/total1*100);

forced6.prob=0;

p1Third=[forced6,...all1];

let all2=p2Third.filter(x=>x.boat!==forced6.boat);

let total2=all2.reduce((s,x)=>s+Math.max(.1,x.value),0)||1;

all2.forEach(x=>x.prob=Math.max(.1,x.value)/total2*100);

forced6.prob=0;

p2Third=[forced6,...all2];

}else{

let total2=p2Third.reduce((s,x)=>s+Math.max(.1,x.value),0)||1;

p2Third.forEach(x=>x.prob=Math.max(.1,x.value)/total2*100);

}

let secondNames=p2.picked.map(b=>{
