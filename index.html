<script>

"use strict";

const API_URLS=[

"https://boatraceopenapi.github.io/api/v1/today.json",

"https://boatraceopenapi.github.io/programs/v3/today.json",

"https://boatraceopenapi.github.io/programs/v2/today.json"

];

let raceData=null;

let selectedEntry=[];

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function format(v){

 if(v===null||v===undefined||v==="")return "-";

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(2):String(v);

}

function escapeHtml(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(obj,keys){

 if(!obj)return null;

 for(const key of keys){

  if(

   obj[key]!==undefined &&

   obj[key]!==null &&

   obj[key]!==""

  )return obj[key];

 }

 return null;

}

function getRank(v){

 return {

 1:"A1",

 2:"A2",

 3:"B1",

 4:"B2"

 }[num(v)]||"-";

}

async function fetchJson(url){

 const r=await fetch(

  url+"?t="+Date.now(),

  {

   cache:"no-store",

   headers:{Accept:"application/json"}

  }

 );

 if(!r.ok)

  throw new Error("HTTP "+r.status);

 return await r.json();

}

function findRace(data,stadiumNumber,raceNumber){

 if(!data)return null;

 if(data.programs&&data.programs.stadiums){

  const s=

   data.programs.stadiums[String(stadiumNumber)];

  if(s&&s.races){

   const r=s.races[String(raceNumber)];

   if(r)return r;

  }

 }

 let found=null;

 function walk(obj){

  if(found||!obj||typeof obj!=="object")

   return;

  if(

   obj.stadium_number!==undefined &&

   num(obj.stadium_number)===stadiumNumber &&

   obj.race_number!==undefined &&

   num(obj.race_number)===raceNumber &&

   (obj.racers||obj.players)

  ){

   found=obj;

   return;

  }

  Object.keys(obj).forEach(k=>{

   if(!found)walk(obj[k]);

  });

 }

 walk(data);

 return found;

}

function getRacers(race){

 if(!race)return [];

 if(Array.isArray(race.racers))

  return race.racers;

 if(race.racers&&typeof race.racers==="object")

  return Object.values(race.racers);

 if(Array.isArray(race.players))

  return race.players;

 if(race.players&&typeof race.players==="object")

  return Object.values(race.players);

 return [];

}

function getBoatNumber(r){

 return num(

  r.entry_number??

  r.boat_number??

  r.course_number??

  r.number

 );

}

function getName(r){

 return r.name||

 r.racer_name||

 r.player_name||

 "選手名不明";

}

function getOneLapTime(r){

 const v=firstValue(r,[

  "one_lap_time",

  "one_lap",

  "lap_time",

  "first_lap_time",

  "first_lap",

  "turn_time",

  "one_round_time",

  "one_round",

  "one_lap_time_sec",

  "one_round_time_sec",

  "1lap_time",

  "oneLapTime"

 ]);

 return num(v)>0?num(v):0;

}

function getStartTiming(r){

 return num(firstValue(r,[

  "start_timing",

  "st",

  "average_start_timing",

  "start"

 ]));

}

function getCourseST(r,course){

 const keys=[

  `course${course}_start_timing`,

  `course_${course}_start_timing`,

  `course${course}_st`,

  `course_${course}_st`,

  `course${course}_average_start_timing`,

  `course_${course}_average_start_timing`,

  `st_course${course}`,

  `st_course_${course}`

 ];

 for(const k of keys){

  if(

   r[k]!==undefined &&

   r[k]!==null &&

   r[k]!==""

  )return num(r[k]);

 }

 if(Array.isArray(r.course_start_timing))

  return num(r.course_start_timing[course-1]);

 if(

  r.course_start_timing &&

  typeof r.course_start_timing==="object"

 )

  return num(r.course_start_timing[String(course)]);

 return 0;

}

function getStyle(r){

 const v=firstValue(r,[

  "winning_technique",

  "decision_technique",

  "technique",

  "last_decision",

  "winning_decision",

  "kimarite"

 ])||"";

 return String(v).toLowerCase();

}

function attackStyleScore(r,type){

 const t=getStyle(r);

 if(type==="まくり")

  return t.includes("まくり")||t.includes("捲り")?12:0;

 if(type==="差し")

  return t.includes("差し")||t==="差"?10:0;

 if(type==="まくり差し")

  return t.includes("まくり差し")||

         t.includes("捲り差し")?12:0;

 return 0;

}

/* =========================================

   風情報

========================================= */

function getPreview(){

 return raceData?.preview||

        raceData?.before_info||

        raceData?.weather||

        {};

}

function getWindSpeed(){

 const p=getPreview();

 return num(firstValue(p,[

  "wind_speed",

  "wind",

  "windSpeed",

  "windspeed"

 ]));

}

function getWindDirection(){

 const p=getPreview();

 const v=firstValue(p,[

  "wind_direction",

  "wind_dir",

  "windDirection",

  "wind_direction_name",

  "wind_dir_name",

  "wind_direction_text"

 ]);

 if(v!==null)

  return String(v).toLowerCase();

 return "";

}

/*

  APIによって風向の表記が違うため

  できるだけ幅広く判定する

*/

function getWindType(){

 const d=getWindDirection();

 if(!d)

  return "unknown";

 if(

  d.includes("向かい")||

  d.includes("追い")||

  d.includes("向")||

  d.includes("逆風")||

  d.includes("head")

 ){

  if(

   d.includes("追い")||

   d.includes("tail")

  )

   return "tail";

  return "head";

 }

 return "unknown";

}

/* =========================================

   風補正

========================================= */

function getWindCorrection(course){

 const speed=getWindSpeed();

 const type=getWindType();

 if(speed<4)

  return 0;

 const strength=

  speed>=7?1.0:

  speed>=6?.8:

  speed>=5?.6:

  .4;

 if(type==="head"){

  /*

   向かい風が強い場合

   123を少し下げ

   456を上げる

  */

  if(course<=3)

   return -5*strength;

  return 5*strength;

 }

 if(type==="tail"){

  /*

   追い風が強い場合

   123を上げ

   456を少し下げる

  */

  if(course<=3)

   return 5*strength;

  return -5*strength;

 }

 return 0;

}

/* =========================================

   出走表

========================================= */

function displayRace(race){

 const box=document.getElementById("boats");

 box.innerHTML="";

 const racers=getRacers(race)

 .sort((a,b)=>getBoatNumber(a)-getBoatNumber(b));

 if(racers.length<6){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 6艇の選手データを取得できませんでした。

  <br><br>

  取得数：<strong>${racers.length}艇</strong>

  </div>`;

  return false;

 }

 racers.forEach(r=>{

  const d=document.createElement("div");

  d.className="boat";

  d.innerHTML=`

  <div class="boat-number">

  ${getBoatNumber(r)}

  </div>

  <div class="boat-name">

  ${escapeHtml(getName(r))}

  </div>

  <div class="boat-class">

  ${getRank(r.rank_number)}

  </div>

  <div class="metric">

  全国 ${format(r.national_win_rate)}

  </div>

  <div class="metric">

  当地 ${format(r.local_win_rate)}

  </div>

  <div class="metric">

  M${r.motor_number||"-"}

  </div>

  <div class="metric">

  M2連 ${format(r.motor_top_2_percent)}%

  </div>

  <div class="metric">

  M3連 ${format(r.motor_top_3_percent)}%

  </div>

  <div class="metric">

  ST ${format(r.average_start_timing)}

  </div>

  <div class="metric gold">

  一周 ${

   getOneLapTime(r)>0

   ?format(getOneLapTime(r))+"秒"

   :"-"

  }

  </div>

  `;

  box.appendChild(d);

 });

 return true;

}

function displayPreview(race){

 const box=document.getElementById("previewInfo");

 const p=getPreview();

 const wind=getWindSpeed();

 const windType=getWindType();

 let windText="風向データなし";

 if(windType==="head")

  windText="向かい風";

 if(windType==="tail")

  windText="追い風";

 box.innerHTML=`

 <div class="info-grid">

 <div class="info-item">

 <div class="info-label">風速</div>

 <div class="info-value">

 ${wind>0?wind+"m":"-"}

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">風向</div>

 <div class="info-value">

 ${windText}

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">波高</div>

 <div class="info-value">

 ${p.wave_height??"-"}cm

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">気温</div>

 <div class="info-value">

 ${p.air_temperature??"-"}℃

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">水温</div>

 <div class="info-value">

 ${p.water_temperature??"-"}℃

 </div>

 </div>

 </div>

 ${wind>=4?`

 <div class="ai-box">

 <strong>🌬️ 風による補正</strong>

 <div class="note">

 ${

  windType==="head"

  ?"向かい風が強め。123を少し下げ、456の攻め・展開をプラス評価。"

  :

  windType==="tail"

  ?"追い風が強め。123をプラス、456を少し下げて評価。"

  :

  "風速4m以上ですが、風向データを確認できないため風向補正は限定的です。"

 }

 </div>

 </div>

 `:""}

 `;

}

function displayLapTable(race){

 const box=document.getElementById("lapInfo");

 const racers=getRacers(race)

 .sort((a,b)=>getBoatNumber(a)-getBoatNumber(b));

 const valid=racers.filter(

  r=>getOneLapTime(r)>0

 );

 if(!valid.length){

  box.innerHTML=`

  <div class="warning">

  ⚠️ 一周タイムデータなし

  </div>`;

  return;

 }

 const best=Math.min(

  ...valid.map(r=>getOneLapTime(r))

 );

 let html=`

 <table class="lap-table">

 <thead>

 <tr>

 <th>艇</th>

 <th>選手</th>

 <th>一周</th>

 <th>最速差</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  const lap=getOneLapTime(r);

  html+=`

  <tr>

  <td>${getBoatNumber(r)}号艇</td>

  <td>${escapeHtml(getName(r))}</td>

  <td>

  ${lap>0?format(lap)+"秒":"-"}

  </td>

  <td>

  ${lap>0?"+"+format(lap-best)+"秒":"-"}

  </td>

  </tr>

  `;

 });

 html+=`</tbody></table>`;

 box.innerHTML=html;

}

/* =========================================

   出走表取得

========================================= */

async function loadRace(){

 const stadium=num(

  document.getElementById("venue").value

 );

 const raceNumber=num(

  document.getElementById("race").value

 );

 const status=document.getElementById("status");

 const btn=document.getElementById("loadButton");

 btn.disabled=true;

 btn.innerText="⏳ 取得中...";

 document.getElementById("result")

 .classList.add("hidden");

 let lastError=null;

 try{

  for(let i=0;i<API_URLS.length;i++){

   try{

    status.innerHTML=

    `⏳ API ${i+1}/${API_URLS.length} を確認中...`;

    const data=await fetchJson(API_URLS[i]);

    const race=findRace(

     data,

     stadium,

     raceNumber

    );

    if(!race){

     lastError=

      new Error("指定レースがありません");

     continue;

    }

    const racers=getRacers(race);

    if(racers.length<6){

     lastError=

      new Error("6艇のデータがありません");

     continue;

    }

    raceData=race;

    selectedEntry=[];

    displayRace(race);

    displayPreview(race);

    displayLapTable(race);

    createEntryButtons();

    document.getElementById("result")

    .classList.remove("hidden");

    status.innerHTML="✅ 出走表取得成功";

    document.getElementById("apiInfo")

    .innerHTML=`

    取得元：

    <strong>

    ${escapeHtml(API_URLS[i])}

    </strong>

    <br>

    会場番号：${stadium}

    <br>

    レース：${raceNumber}R

    <br>

    選手：${racers.length}名

    `;

    btn.disabled=false;

    btn.innerText="🔥 出走表を取得";

    return;

   }catch(e){

    lastError=e;

   }

  }

  throw lastError||

   new Error("API取得失敗");

 }catch(e){

  status.innerHTML=`

  <span class="red">

  ❌ 出走表取得失敗

  </span>

  <br>

  ${escapeHtml(e.message)}

  `;

  btn.disabled=false;

  btn.innerText="🔥 出走表を取得";

 }

}

/* =========================================

   進入

========================================= */

function createEntryButtons(){

 const box=document.getElementById(

  "entryButtons"

 );

 box.innerHTML="";

 for(let i=1;i<=6;i++){

  const b=document.createElement("button");

  b.type="button";

  b.className="entry-btn";

  b.innerText=i+"号艇";

  b.onclick=()=>selectEntry(i);

  box.appendChild(b);

 }

}

function selectEntry(boat){

 if(selectedEntry.includes(boat))

  return;

 if(selectedEntry.length>=6)

  return;

 selectedEntry.push(boat);

 updateEntryButtons();

 document.getElementById("entryResult")

 .innerText=

 selectedEntry.join("-");

}

function updateEntryButtons(){

 document.querySelectorAll(".entry-btn")

 .forEach((b,i)=>{

  b.classList.toggle(

   "selected",

   selectedEntry.includes(i+1)

  );

 });

}

function clearEntry(){

 selectedEntry=[];

 updateEntryButtons();

 document.getElementById("entryResult")

 .innerText=

 "進入を入力してください";

}

/* =========================================

   選手能力

========================================= */

function abilityScore(r,course){

 let s=0;

 const national=num(r.national_win_rate);

 const local=num(r.local_win_rate);

 const motor2=num(r.motor_top_2_percent);

 const motor3=num(r.motor_top_3_percent);

 const st=num(r.average_start_timing);

 const courseST=getCourseST(r,course);

 const rank=num(r.rank_number);

 const lap=getOneLapTime(r);

 s+=national*6;

 s+=local*3;

 s+=motor2*.22;

 s+=motor3*.08;

 if(st>0)

  s+=Math.max(0,.30-st)*20;

 if(courseST>0)

  s+=Math.max(0,.30-courseST)*18;

 if(lap>0){

  const laps=getRacers(raceData)

  .map(x=>getOneLapTime(x))

  .filter(x=>x>0);

  if(laps.length){

   const best=Math.min(...laps);

   s+=Math.max(

    0,

    5-(lap-best)*25

   );

  }

 }

 const courseBonus={

  1:10,

  2:5,

  3:4,

  4:3,

  5:1,

  6:0

 };

 s+=courseBonus[course]||0;

 if(rank===1)s+=4;

 if(rank===2)s+=2;

 if(rank===4)s-=2;

 /* 風補正 */

 s+=getWindCorrection(course);

 return s;

}

/* =========================================

   攻め手

========================================= */

function getAttackCandidates(){

 const racers=getRacers(raceData);

 return racers.map(r=>{

  const boat=getBoatNumber(r);

  const course=

   selectedEntry.indexOf(boat)+1;

  const st=num(r.average_start_timing);

  const cst=

   getCourseST(r,course);

  const motor2=

   num(r.motor_top_2_percent);

  const motor3=

   num(r.motor_top_3_percent);

  const maekiri=

   attackStyleScore(r,"まくり");

  const sash=

   attackStyleScore(r,"差し");

  const mds=

   attackStyleScore(r,"まくり差し");

  let attack=0;

  let style="";

  const effectiveST=

   cst>0?cst:st;

  if(effectiveST>0){

   attack+=

    Math.max(

     0,

     .20-effectiveST

    )*45;

  }

  attack+=

   Math.max(0,motor2-30)*.12;

  attack+=

   Math.max(0,motor3-50)*.04;

  if(maekiri>0){

   attack+=maekiri;

   style="まくり";

  }

  if(mds>0&&mds>maekiri){

   attack+=mds;

   style="まくり差し";

  }

  if(sash>0&&course<=3){

   attack+=sash*.7;

   if(!style)

    style="差し";

  }

  if(course===2)

   attack+=2;

  if(course>=4)

   attack+=3;

  /* 風補正 */

  attack+=

   Math.max(

    0,

    getWindCorrection(course)

   )*.8;

  return{

   boat,

   course,

   racer:r,

   attack,

   style,

   st:effectiveST,

   motor2,

   motor3

  };

 }).sort(

  (a,b)=>b.attack-a.attack

 );

}

/* =========================================

   イン逃げ期待度

========================================= */

function calculateRaceTrend(){

 const racers=getRacers(raceData);

 const firstBoat=

  selectedEntry[0]||1;

 const one=

  racers.find(

   r=>getBoatNumber(r)===firstBoat

  );

 if(!one){

  return{

   inside:50,

   outside:50,

   reason:"判定材料不足"

  };

 }

 const course1=

  selectedEntry.indexOf(

   getBoatNumber(one)

  )+1;

 let inside=55;

 const national=

  num(one.national_win_rate);

 const local=

  num(one.local_win_rate);

 const motor2=

  num(one.motor_top_2_percent);

 const motor3=

  num(one.motor_top_3_percent);

 const st=

  num(one.average_start_timing);

 const cst=

  getCourseST(one,course1);

 if(national>=6.5)inside+=5;

 else if(national<5.5)inside-=5;

 if(local>=6.5)inside+=4;

 else if(local<5.5)inside-=4;

 if(motor2>=40)inside+=5;

 else if(motor2<30)inside-=5;

 if(motor3>=60)inside+=3;

 else if(motor3<45)inside-=3;

 if(st>0){

  if(st<=.15)inside+=6;

  else if(st>=.20)inside-=7;

 }

 if(cst>0){

  if(cst<=.15)inside+=7;

  else if(cst>=.20)inside-=8;

 }

 const attacks=

  getAttackCandidates();

 const strongestOutside=

  attacks.find(

   x=>x.course>=2

  );

 if(strongestOutside){

  if(strongestOutside.attack>=16)

   inside-=12;

  if(

   strongestOutside.st>0 &&

   strongestOutside.st<=.15

  )

   inside-=6;

 }

 const p=getPreview();

 const wind=

  num(p.wind_speed);

 const wave=

  num(p.wave_height);

 if(wind>=4)

  inside-=2;

 if(wind>=5)

  inside-=2;

 if(wind>=7)

  inside-=2;

 if(wave>=4)

  inside-=3;

 /* 強い向かい風 */

 if(

  wind>=4 &&

  getWindType()==="head"

 )

  inside-=

   wind>=7?6:

   wind>=6?5:

   wind>=5?4:3;

 /* 強い追い風 */

 if(

  wind>=4 &&

  getWindType()==="tail"

 )

  inside+=

   wind>=7?5:

   wind>=6?4:

   wind>=5?3:2;

 inside=Math.max(

  5,

  Math.min(

   95,

   Math.round(inside)

  )

 );

 return{

  inside,

  outside:100-inside,

  reason:

   inside>=70

   ?"イン逃げ中心"

   :

   inside>=50

   ?"ややイン有利"

   :

   inside>=30

   ?"イン以外も十分"

   :"イン逃げしにくい"

 };

}

/* =========================================

   AI展開

========================================= */

function determineDevelopment(){

 const trend=

  calculateRaceTrend();

 const attacks=

  getAttackCandidates();

 const strongest=

  attacks.find(

   x=>x.course>=2

  );

 if(

  !strongest ||

  trend.inside>=70

 ){

  return{

   type:"イン逃げ",

   attacker:selectedEntry[0],

   score:trend.inside,

   reason:

    "1号艇を中心に先マイを評価"

  };

 }

 let type=strongest.style;

 if(!type){

  if(strongest.course>=4)

   type="まくり";

  else

   type="差し";

 }

 return{

  type,

  attacker:strongest.boat,

  attackerCourse:strongest.course,

  score:

   Math.max(

    55,

    100-trend.inside

   ),

  reason:

   `${strongest.boat}号艇の${type}を中心に評価`

 };

}

/* =========================================

   AIランキング

========================================= */

function buildRanking(dev){

 return getRacers(raceData)

 .map(r=>{

  const boat=

   getBoatNumber(r);

  const course=

   selectedEntry.indexOf(boat)+1;

  let score=

   abilityScore(r,course);

  if(dev.type==="イン逃げ"){

   if(boat===selectedEntry[0])

    score+=8;

   if(course===2)

    score+=4;

   if(course===3)

    score+=3;

  }else{

   if(boat===dev.attacker)

    score+=10;

   if(dev.type==="まくり"){

    if(course>dev.attackerCourse)

     score+=3;

   }

   if(dev.type==="差し"){

    if(course===1)

     score+=5;

   }

   if(dev.type==="まくり差し"){

    if(course===1||course===2)

     score+=4;

   }

  }

  return{

   number:boat,

   name:getName(r),

   racer:r,

   score

  };

 })

 .sort(

  (a,b)=>b.score-a.score

 );

}

/* =========================================

   攻めた後のチャンス

========================================= */

function getAfterAttackCandidates(

 dev,

 ranking

){

 if(dev.type==="イン逃げ")

  return [];

 const attacker=

  dev.attacker;

 const attackerCourse=

  selectedEntry.indexOf(attacker)+1;

 return ranking

 .filter(

  x=>x.number!==attacker

 )

 .map(x=>{

  const c=

   selectedEntry.indexOf(x.number)+1;

  let s=x.score;

  if(dev.type==="まくり"){

   if(c>attackerCourse)

    s+=10;

   if(c===attackerCourse+1)

    s+=5;

  }

  if(dev.type==="差し"){

   if(c===1)

    s+=9;

   if(c===3)

    s+=5;

  }

  if(dev.type==="まくり差し"){

   if(c===1)

    s+=7;

   if(c===4)

    s+=6;

   if(c===5)

    s+=4;

  }

  return{

   ...x,

   afterScore:s

  };

 })

 .sort(

  (a,b)=>b.afterScore-a.afterScore

 )

 .slice(0,3);

}

/* =========================================

   大穴候補

========================================= */

function getHoleCandidates(

 ranking,

 dev

){

 /*

  AI評価1・2位は大穴候補から除外

 */

 const excluded=

  new Set([

   ranking[0]?.number,

   ranking[1]?.number

  ]);

 const attacks=

  getAttackCandidates();

 const attackMap=

  new Map(

   attacks.map(x=>[

    x.boat,

    x

   ])

  );

 return ranking

 .filter(

  x=>!excluded.has(x.number)

 )

 .map(x=>{

  const course=

   selectedEntry.indexOf(

    x.number

   )+1;

  const a=

   attackMap.get(x.number);

  let score=0;

  /*

   能力だけではなく

   穴としての期待値を見る

  */

  const motor2=

   num(x.racer.motor_top_2_percent);

  const motor3=

   num(x.racer.motor_top_3_percent);

  const st=

   a?.st||

   getStartTiming(x.racer);

  if(motor2>=35)

   score+=8;

  if(motor2>=40)

   score+=5;

  if(motor3>=55)

   score+=6;

  if(st>0&&st<=.16)

   score+=8;

  if(a)

   score+=Math.min(

    15,

    a.attack*.7

   );

  if(dev.type!=="イン逃げ"){

   if(

    dev.type==="まくり" &&

    course>dev.attackerCourse

   )

    score+=12;

   if(

    dev.type==="差し" &&

    course===1

   )

    score+=8;

   if(

    dev.type==="まくり差し" &&

    course>=4

   )

    score+=10;

  }

  score+=

   Math.max(

    0,

    getWindCorrection(course)

   )*1.5;

  return{

   ...x,

   holeScore:score,

   attack:a

  };

 })

 .sort(

  (a,b)=>b.holeScore-a.holeScore

 );

}

/* =========================================

   買い目

========================================= */

function uniquePush(arr,p){

 const a=p.split("-");

 if(

  a.length===3 &&

  new Set(a).size===3 &&

  a.every(

   x=>Number(x)>=1&&

      Number(x)<=6

  ) &&

  !arr.includes(p)

 )

  arr.push(p);

}

 const picksMain=[];

 const picksRoi=[];

  ranking[0].number;

  dev.attacker;

  getAfterAttackCandidates(

   dev,

 const afterNums=

  after.map(x=>x.number);

 /* =========================

    的中重視

 if(dev.type==="イン逃げ"){

  uniquePush(

   picksMain,

  uniquePush(

   picksMain,

   `${selectedEntry[0]}-${top3}-${top2}`

  );

  uniquePush(

   picksMain,

   `${selectedEntry[0]}-${top2}-${top4}`

  );

  uniquePush(

   picksMain,

   `${selectedEntry[0]}-${top4}-${top2}`

  );

  uniquePush(

   picksMain,

   `${selectedEntry[0]}-${selectedEntry[1]}-${top3}`

  );

  uniquePush(

   picksMain,

   `${selectedEntry[0]}-${selectedEntry[2]}-${top2}`

  );

  uniquePush(

   picksMain,

   `${selectedEntry[0]}-${top3}-${selectedEntry[1]}`

  );

 }else{

  uniquePush(

   picksMain,

   `${attacker}-${selectedEntry[0]}-${top2}`

  );

  uniquePush(

   picksMain,

   `${attacker}-${top2}-${selectedEntry[0]}`

  );

  uniquePush(

   picksMain,

   `${attacker}-${selectedEntry[0]}-${top3}`

  );

  if(afterNums[0]){

   uniquePush(

    picksMain,

    `${attacker}-${afterNums[0]}-${selectedEntry[0]}`

   );

   uniquePush(

    picksMain,

    `${attacker}-${selectedEntry[0]}-${afterNums[0]}`

   );

  if(afterNums[1]){

   uniquePush(

    picksMain,

    `${attacker}-${afterNums[1]}-${selectedEntry[0]}`

   );

  }

  uniquePush(

   picksMain,

   `${top2}-${attacker}-${selectedEntry[0]}`

  );

 }

 /* =========================

    回収重視

 ========================= */

  getHoleCandidates(

   ranking,

   dev

 const hole=

  holeCandidates[0];

 /*

  回収重視は

  的中重視と同じ頭にしない

 */

 if(dev.type!=="イン逃げ"){

  uniquePush(

   picksRoi,

   `${attacker}-${top3}-${top2}`

   picksRoi,

   `${attacker}-${afterNums[0]||top3}-${selectedEntry[0]}`

  uniquePush(

   `${attacker}-${selectedEntry[0]}-${afterNums[0]||top3}`

  );

 }else{

   picksRoi,

   `${top2}-${selectedEntry[0]}-${top3}`

  );

   picksRoi,

   `${top3}-${selectedEntry[0]}-${top2}`

  );

  uniquePush(

   picksRoi,

   `${top2}-${top3}-${selectedEntry[0]}`

  );

 }

 if(hole){

   picksRoi,

   `${hole.number}-${top1}-${top3}`

  );

   picksRoi,

   `${hole.number}-${top2}-${selectedEntry[0]}`

  );

 <div class="pick-title">

 <div class="note">

 AI評価上位＋AI展開との一致を優先。

 </div>

 main7.forEach((p,i)=>{

 html+=`</div>`;

    回収重視

 html+=`

   )[0];

  const thirdCandidates=

      y=>y.number===x.number

   )

   .filter(

    x=>x.number!==hole.number

   )

   .slice(0,3);

   .map(x=>x.number)

  `;

 }else{

  html+=`

 <div class="title">

 🧠 AI最終展開

 </div>

 <div class="attack">

 ${

  dev.type==="イン逃げ"

  ?"1号艇イン逃げ"

  :

  `${dev.attacker}号艇 ${dev.type}`

 }

 </div>

 <div class="note">

 ${dev.reason}

 </div>

 </div>

 <div class="info-grid">

 <div class="info-item">

 <div class="info-label">

 イン逃げ期待度

 </div>

 <div class="big-percent ${insideClass}">

 ${trend.inside}%

 </div>

 </div>

 <div class="info-item">

 <div class="info-label">

 イン以外期待度

 </div>

 <div class="big-percent ${

  trend.outside>=60

  ?"red"

  :"yellow"

 }">

 ${trend.outside}%

 </div>

 </div>

 </div>

 <div class="ai-box">

 <strong>

 📊 AIの判断

 </strong>

 <div class="note">

 ${

  trend.inside>=70

  ?"🟢 イン逃げ中心。"

  :

  trend.inside>=50

  ?"🟡 イン逃げを軸にしつつ外も警戒。"

  :

  trend.inside>=30

  ?"🟠 イン逃げだけに絞るのは危険。"

  :

  "🔴 イン逃げしにくいレース。回収重視を強く警戒。"

 }

 </div>

 </div>

 ${

  windMessage

  ?`

  <div class="ai-box">

  <strong>

  🌬️ 風補正

  </strong>

  <div class="note">

  ${windMessage}

  </div>

  </div>

  `

  :""

 }

 <div class="ai-box">

 <strong>

 ⚡ 攻め手

 </strong>

 <div class="attack">

 ${

  dev.type==="イン逃げ"

  ?"1号艇"

  :

  dev.attacker+"号艇"

 }

 </div>

 <div class="note">

 ${

  dev.type==="イン逃げ"

  ?"先マイを中心に評価。"

  :

  `${dev.attacker}号艇のST・コース適性・モーター・決まり手傾向から攻め手と判断。`

 }

 </div>

 </div>

 ${

  dev.type!=="イン逃げ" &&

  after.length

  ?`

  <div class="ai-box">

  <strong>

  🔥 攻めた後のチャンス

  </strong>

  <div class="note">

  ${dev.attacker}号艇が攻めた場合、

  <strong>

  ${after.map(

   x=>x.number+"号艇"

  ).join("・")}

  </strong>

  に展開が流れる可能性があります。

  <br><br>

  👉 特に

  <strong>

  ${after[0].number}号艇

  </strong>

  は3着候補として注目。

  </div>

  </div>

  `

  :""

 }

 <div class="ai-box">

 <strong>

 🌊 展開の流れ

 </strong>

 <div class="flow">

 ${

  dev.type==="イン逃げ"

  ?`

  1号艇が先マイ

  <br>↓

  2・3号艇が相手

  <br>↓

  外枠は展開待ち

  `

  :

  `

  ${dev.attacker}号艇が攻める

  <br>↓

  1号艇・内側艇が残す可能性

  <br>↓

  ${

   after.length

   ?after[0].number+"号艇が展開を拾う"

   :"後続艇へ展開"

  }

  `

 }

 </div>

 </div>

 `;

 /* =========================

    ランキング

 ========================= */

 let rankHtml="";

 ranking.forEach((r,i)=>{

  rankHtml+=`

  <div class="rank">

  <div class="rank-number">

  ${i+1}位

  </div>

  <strong>

  ${r.number}号艇　

  ${escapeHtml(r.name)}

  </strong>

  <div class="pick">

  ${Math.round(r.score)} pt

  </div>

  <div class="score-bar">

  <div

   class="score-fill"

   style="width:${Math.min(

    100,

    Math.max(

     5,

     r.score

    )

   )}%">

  </div>

  </div>

  </div>

  `;

 });

 document.getElementById(

  "ranking"

 ).innerHTML=rankHtml;

 /* =========================

    最終評価

 ========================= */

 const main=

  ranking[0];

 const second=

  ranking[1];

 const holeCandidates=

  getHoleCandidates(

   ranking,

   dev

  );

 const hole=

  holeCandidates[0];

 document.getElementById(

  "final"

 ).innerHTML=`

 <div class="row">

 <span class="left">

 本命

 </span>

 <span class="right gold">

 ${main.number}号艇

 ${escapeHtml(main.name)}

 </span>

 </div>

 <div class="row">

 <span class="left">

 対抗

 </span>

 <span class="right">

 ${second.number}号艇

 ${escapeHtml(second.name)}

 </span>

 </div>

 <div class="row">

 <span class="left">

 穴・攻め手

 </span>

 <span class="right yellow">

 ${

  hole

  ?hole.number+"号艇 "+escapeHtml(hole.name)

  :"今回は穴候補なし"

 }

 </span>

 </div>

 <div class="row">

 <span class="left">

 AI展開

 </span>

 <span class="right gold">

 ${

  dev.type==="イン逃げ"

  ?"イン逃げ"

  :

  dev.attacker+"号艇 "+dev.type

 }

 </span>

 </div>

 <div class="row">

 <span class="left">

 イン逃げ期待度

 </span>

 <span class="right ${insideClass}">

 ${trend.inside}%

 </span>

 </div>

 <div class="row">

 <span class="left">

 イン以外期待度

 </span>

 <span class="right red">

 ${trend.outside}%

 </span>

 </div>

 `;

 createPicks(

  ranking,

  dev,

  trend

 );

}

/* =========================================

   起動

========================================= */

document.addEventListener(

 "DOMContentLoaded",

 ()=>{

  document.getElementById(

   "loadButton"

  ).onclick=loadRace;

  document.getElementById(

   "clearButton"

  ).onclick=clearEntry;

  document.getElementById(

   "analyzeButton"

  ).onclick=()=>{

   if(!raceData){

    alert(

     "先に出走表を取得してください。"

    );

    return;

   }

   if(selectedEntry.length!==6){

    alert(

     "6艇すべての進入を入力してください。"

    );

    return;

   }

   showAnalysis();

  };

 }

);

</script>

</body>

</html>
