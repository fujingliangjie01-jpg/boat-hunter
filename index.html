<style>

*{box-sizing:border-box}

body{

.note{

}

.bar{

}

.bar-inner{

.big{

}

.pick-box{

.pick-box.roi{

.pick-box.must{

}

.pick-title{

.pick-item{

.money-total{

}

.percent-value{

.clearfix::after{

}

.hole{

.score-badge{

 border-radius:6px;

}

.score-a{

}

.score-b{

 color:#ffd34d

}

footer{

 padding:20px;

@media(max-width:600px){

 .boats{

  grid-template-columns:repeat(3,1fr)

 }

  padding:10px

<script>

"use strict";

/* ==================================================

   API

================================================== */

const API_URL=

"https://boatraceopenapi.github.io/api/v1/today.json";

let raceData=null;

let selectedEntry=[];

/* ==================================================

   基本

================================================== */

function num(v){

 const n=Number(v);

 return Number.isFinite(n)?n:0;

}

function fmt(v,d=2){

 const n=Number(v);

 return Number.isFinite(n)?n.toFixed(d):"-";

}

function esc(v){

 return String(v??"")

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function firstValue(o,keys){

 if(!o)return null;

 for(const k of keys){

  if(

   o[k]!==undefined &&

   o[k]!==null &&

   o[k]!==""

  ){

   return o[k];

  }

 }

 return null;

}

function getRank(v){

 return {

 1:"A1",

 2:"A2",

 3:"B1",

 4:"B2"

 }[num(v)]||"-";

}

/* ==================================================

   API取得

================================================== */

async function fetchJson(url){

 const response=

 await fetch(

  url+"?t="+Date.now(),

  {

   method:"GET",

   cache:"no-store",

   headers:{

    "Accept":"application/json"

   }

  }

 );

 if(!response.ok){

  throw new Error("HTTP "+response.status);

 }

 return await response.json();

}

function findRace(data,stadium,race){

 if(!data)return null;

 try{

  const direct=

   data?.programs

   ?.stadiums

   ?.[String(stadium)]

   ?.races

   ?.[String(race)];

  if(direct)return direct;

 }catch(e){}

 let found=null;

 function walk(o){

  if(found||!o)return;

  if(typeof o!=="object")return;

  if(

   num(o.stadium_number)===stadium &&

   num(o.race_number)===race &&

   o.racers

  ){

   found=o;

   return;

  }

  for(const key of Object.keys(o)){

   walk(o[key]);

   if(found)return;

  }

 }

 walk(data);

 return found;

}

/* ==================================================

   レーサー

================================================== */

function getRacers(race){

 if(!race)return[];

 const racers=race.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function getPreviewRacers(race){

 const preview=race?.preview;

 if(!preview)return[];

 const racers=preview.racers;

 if(Array.isArray(racers))

  return racers;

 if(

  racers &&

  typeof racers==="object"

 ){

  return Object.values(racers);

 }

 return[];

}

function boatNo(r){

 return num(

  r?.entry_number ??

  r?.boat_number ??

  r?.number

 );

}

function racerName(r){

 return(

  r?.name ||

  r?.racer_name ||

  "選手名不明"

 );

}

function previewFor(r){

 return getPreviewRacers(raceData)

 .find(

  x=>boatNo(x)===boatNo(r)

 )||{};

}

function getST(r){

 return num(

  firstValue(r,[

   "start_timing",

   "st",

   "start_time"

  ])

 );

}

function getExhibition(r){

 return num(

  firstValue(r,[

   "exhibition_time",

   "display_time",

   "exhibition"

  ])

 );

}

function getCourse(r){

 return num(

  firstValue(r,[

   "course_number",

   "course",

   "entry_course"

  ])

 );

}

/* ==================================================

   決まり手

   ※APIに存在する場合のみ利用

================================================== */

function getDecision(r){

 return firstValue(r,[

  "decision",

  "decision_name",

  "winning_decision",

  "winning_decision_name",

  "kimarite",

  "kimarite_name",

  "winning_technique",

  "technique"

 ]);

}

function getAttackData(r){

 return{

  makuri:num(firstValue(r,[

   "makuri",

   "makuri_count"

  ])),

  sashi:num(firstValue(r,[

   "sashi",

   "sashi_count"

  ])),

  makurisashi:num(firstValue(r,[

   "makurisashi",

   "makuri_sashi",

   "makurisashi_count"

  ])),

  nige:num(firstValue(r,[

   "nige",

   "nige_count"

  ])),

  nuki:num(firstValue(r,[

   "nuki",

   "nuki_count"

  ])),

  megumare:num(firstValue(r,[

   "megumare",

   "megumare_count"

  ]))

 };

}

function racerDecisionAvailable(r){

 const a=getAttackData(r);

 return Object.values(a).some(v=>v>0);

}

function racerDecisionText(r){

 const a=getAttackData(r);

 const total=

 Object.values(a)

 .reduce((x,y)=>x+y,0);

 if(total<=0){

  return `

   <div class="warning">

    ⚠️ 過去の決まり手データは

    現在のAPIから取得できません。

    <br>

    架空の数字はAI評価に使用していません。

   </div>

  `;

 }

 const data=[

  ["逃げ",a.nige],

  ["まくり",a.makuri],

  ["差し",a.sashi],

  ["まくり差し",a.makurisashi],

  ["抜き",a.nuki],

  ["恵まれ",a.megumare]

 ];

 data.sort((x,y)=>y[1]-x[1]);

 let html="";

 data.forEach(x=>{

  if(x[1]<=0)return;

  html+=`

   <div class="row">

    <span class="left">

     ${x[0]}

    </span>

    <span class="right">

     ${x[1]}件

    </span>

   </div>

  `;

 });

 return html;

}

/* ==================================================

   出走表

================================================== */

function displayRace(){

 const box=document.getElementById("boats");

 box.innerHTML="";

 const racers=

 getRacers(raceData)

 .sort(

  (a,b)=>boatNo(a)-boatNo(b)

 );

 if(racers.length<6){

  box.innerHTML=`

   <div class="warning">

    ⚠️ 6艇の出走表を取得できませんでした。

   </div>

  `;

  return false;

 }

 racers.forEach(r=>{

  const p=previewFor(r);

  const st=getST(p);

  const ex=getExhibition(p);

  const div=document.createElement("div");

  div.className="boat";

  div.innerHTML=`

   <div class="boat-number">

    ${boatNo(r)}

   </div>

   <div class="boat-name">

    ${esc(racerName(r))}

   </div>

   <div class="boat-class">

    ${getRank(r.rank_number)}

   </div>

   <div class="metric">

    全国 ${fmt(r.national_win_rate)}

   </div>

   <div class="metric">

    当地 ${fmt(r.local_win_rate)}

   </div>

   <div class="metric">

    M${esc(r.motor_number||"-")}

   </div>

   <div class="metric">

    M2連 ${fmt(r.motor_top_2_percent)}%

   </div>

   <div class="metric">

    M3連 ${fmt(r.motor_top_3_percent)}%

   </div>

   <div class="metric st">

    ST ${st>0?fmt(st):"-"}

   </div>

   <div class="metric ex">

    展示 ${ex>0?fmt(ex):"-"}

   </div>

  `;

  box.appendChild(div);

 });

 return true;

}

/* ==================================================

   直前情報

================================================== */

function displayPreview(){

 const box=

 document.getElementById("previewInfo");

 const p=raceData?.preview;

 if(!p){

  box.innerHTML=`

   <div class="warning">

    ⚠️ 直前情報なし

   </div>

  `;

  return;

 }

 box.innerHTML=`

 <div class="info-grid">

  <div class="info-item">

   <div class="info-label">風速</div>

   <div class="info-value">

    ${p.wind_speed??"-"}m

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">風向</div>

   <div class="info-value">

    ${p.wind_direction_number??"-"}

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">波高</div>

   <div class="info-value">

    ${p.wave_height??"-"}cm

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">気温</div>

   <div class="info-value">

    ${p.air_temperature??"-"}℃

   </div>

  </div>

  <div class="info-item">

   <div class="info-label">水温</div>

   <div class="info-value">

    ${p.water_temperature??"-"}℃

   </div>

  </div>

 </div>

 `;

}

/* ==================================================

   展示

================================================== */

function displayPreviewRacers(){

 const box=

 document.getElementById("previewRacers");

 const racers=

 getPreviewRacers(raceData)

 .sort(

  (a,b)=>boatNo(a)-boatNo(b)

 );

 if(!racers.length){

  box.innerHTML=`

   <div class="warning">

    ⚠️ 展示・ST・直前進入データなし

   </div>

  `;

  return;

 }

 let html=`

 <table class="table">

 <thead>

 <tr>

  <th>艇</th>

  <th>進入</th>

  <th>ST</th>

  <th>展示</th>

 </tr>

 </thead>

 <tbody>

 `;

 racers.forEach(r=>{

  html+=`

  <tr>

   <td>

    ${boatNo(r)}号艇

   </td>

   <td class="gold">

    ${

     getCourse(r)>0

     ?getCourse(r)+"コース"

     :"－"

    }

   </td>

   <td class="orange">

    ${

     getST(r)>0

     ?fmt(getST(r))

     :"－"

    }

   </td>

   <td class="yellow">

    ${

     getExhibition(r)>0

     ?fmt(getExhibition(r))

     :"－"

    }

   </td>

  </tr>

  `;

 });

 html+=`

 </tbody>

function playerAbility(r,course){

 const national=num(r.national_win_rate);

 const local=num(r.local_win_rate);

 const n2=num(r.national_top_2_percent);

 const n3=num(r.national_top_3_percent);

 const l2=num(r.local_top_2_percent);

 const m2=num(r.motor_top_2_percent);

 const m3=num(r.motor_top_3_percent);

 let score=0;

 score+=national*7;

 score+=local*3;

 score+=n2*.06;

 score+=n3*.03;

 score+=l2*.04;

 score+=m2*.12;

 score+=m3*.05;

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 if(st>0){

  if(st<=.12)score+=15;

  else if(st<=.15)score+=11;

  else if(st<=.18)score+=6;

  else if(st>=.21)score-=5;

 }

 if(ex>0){

  if(ex<=6.70)score+=13;

  else if(ex<=6.80)score+=9;

  else if(ex<=6.90)score+=4;

  else if(ex>=7.00)score-=5;

 }

 score+=({

 1:10,

 2:6,

 3:5,

 4:4,

 5:2,

 6:0

 }[course]||0);

 const rank=num(r.rank_number);

 if(rank===1)score+=6;

 if(rank===2)score+=3;

 if(rank===4)score-=2;

 return score;

}

function attackAbility(r,course){

 const p=previewFor(r);

 const st=getST(p);

 const ex=getExhibition(p);

 const m2=num(r.motor_top_2_percent);

 const m3=num(r.motor_top_3_percent);

 let s=0;

 if(st>0){

  if(st<=.12)s+=20;

  else if(st<=.15)s+=16;

  else if(st<=.18)s+=10;

  else if(st<=.20)s+=4;

 }

 if(ex>0){

  if(ex<=6.70)s+=15;

  else if(ex<=6.80)s+=10;

  else if(ex<=6.90)s+=4;

 }

 if(m2>=45)s+=15;

 else if(m2>=40)s+=11;

 else if(m2>=35)s+=7;

 else if(m2>=30)s+=3;

 if(m3>=65)s+=10;

 else if(m3>=60)s+=7;

 else if(m3>=55)s+=4;

 if(course>=4)s+=7;

 if(course===3)s+=5;

 if(course===2)s+=3;

 const a=getAttackData(r);

 if(a.makuri>0)s+=5;

 if(a.makurisashi>0)s+=6;

 if(a.sashi>0)s+=3;

 return s;

}

function exhibitionComparison(){

 const entry=getEntry();

 const racers=getRacers(raceData);

 const rows=[];

 for(let i=1;i<entry.length;i++){

  const currentBoat=entry[i];

  const prevBoat=entry[i-1];

  const current=

  racers.find(r=>boatNo(r)===currentBoat);

  const prev=

  racers.find(r=>boatNo(r)===prevBoat);

  if(!current||!prev)continue;

  const ex1=getExhibition(previewFor(current));

  const ex2=getExhibition(previewFor(prev));

  if(ex1<=0||ex2<=0)continue;

  const diff=ex2-ex1;

  let bonus=0;

  if(diff>=.15)bonus=10;

  else if(diff>=.10)bonus=7;

  else if(diff>=.08)bonus=4;

  rows.push({

   boat:currentBoat,

   prev:prevBoat,

   current:ex1,

   previous:ex2,

   diff,

   bonus

  });

 }

 return rows;

}

function validCombo(a,b,c){

 return(

  Number.isInteger(a)&&

  Number.isInteger(b)&&

  Number.isInteger(c)&&

  a>=1&&a<=6&&

  b>=1&&b<=6&&

  c>=1&&c<=6&&

  a!==b&&

  a!==c&&

  b!==c

 );

}

function addUnique(arr,a,b,c,reason){

 if(!validCombo(a,b,c))

  return;

 const combo=`${a}-${b}-${c}`;

 if(!arr.some(x=>x.combo===combo)){

  arr.push({

   combo,

   reason

  });

 }

}

/* ==================================================

   回収評価

================================================== */

function roiValue(item,rank,dev){

 const r=item.racer;

 let score=

 playerAbility(r,item.course);

 /*

  AIランキングを必ず反映

 */

 const rankingIndex=

 rank.findIndex(

  x=>x.boat===item.boat

 );

 if(rankingIndex>=0){

  score+=

   Math.max(

    0,

    15-rankingIndex*2

   );

 }

 /*

  展開適性

 */

 if(dev.attacker&&

    item.boat===dev.attacker.boat){

  score+=

   dev.makuri+

   dev.sashi+

   dev.makurisashi;

 }

 /*

  過去決まり手がAPIに存在する場合だけ加点

 */

 const a=getAttackData(r);

 if(item.course>=3){

  if(a.makuri>0)

   score+=Math.min(8,a.makuri*.5);

  if(a.sashi>0)

   score+=Math.min(6,a.sashi*.4);

  if(a.makurisashi>0)

   score+=Math.min(10,a.makurisashi*.6);

 }

 return score;

}

/* ==================================================

   回収重視

   10〜15点

================================================== */

function buildROI(rank,dev,used){

 const entry=getEntry();

 const racers=getRacers(raceData);

 const list=

 racers.map(r=>{

  const boat=boatNo(r);

  return{

   boat,

   course:entry.indexOf(boat)+1,

   racer:r

  };

 });

 const scored=

 list.map(x=>({

  ...x,

  value:

   roiValue(x,rank,dev)

 }))

 .sort((a,b)=>b.value-a.value);

 const arr=[];

 /*

  50%未満なら

  イン逃げしない想定を強くする

 */

 if(dev.nige<50){

  const heads=

   scored

   .filter(x=>x.boat!==1)

   .slice(0,5);

  heads.forEach(head=>{

   const second=

    scored.find(

     x=>x.boat!==head.boat

    );

   const third=

    scored.find(

     x=>

      x.boat!==head.boat&&

      x.boat!==second?.boat

    );

   if(second&&third){

    addUnique(

     arr,

     head.boat,

     second.boat,

     third.boat,

     "イン逃げ50%未満＋回収期待値"

    );

   }

  });

 }

 /*

  50%以上なら

  イン逃げも残す

 */

 if(dev.nige>=50){

  const second=

   scored.find(x=>x.boat!==1);

  const third=

   scored.find(

    x=>x.boat!==1&&

       x.boat!==second?.boat

   );

  if(second&&third){

   addUnique(

    arr,

    1,

    second.boat,

    third.boat,

    "AI評価＋イン残り"

   );

  }

 }

 /*

  AI上位を中心に

  多数の組み合わせを作る

 */

 for(const a of scored){

  for(const b of scored){

   for(const c of scored){

    if(

     a.boat===b.boat||

     a.boat===c.boat||

     b.boat===c.boat

    )

     continue;

    const combo=

     `${a.boat}-${b.boat}-${c.boat}`;

    if(used.includes(combo))

     continue;

    addUnique(

     arr,

     a.boat,

     b.boat,

     c.boat,

     "AI評価＋選手情報＋展示＋ST＋モーター＋展開"

    );

    if(arr.length>=15)

     break;

   }

   if(arr.length>=15)

    break;

  }

  if(arr.length>=15)

   break;

 }

 /*

  10点未満なら追加

 */

 if(arr.length<10){

  for(const a of scored){

   for(const b of scored){

    for(const c of scored){

     if(

      a.boat===b.boat||

      a.boat===c.boat||

      b.boat===c.boat

     )

      continue;

     addUnique(

      arr,

      a.boat,

      b.boat,

      c.boat,

      "回収重視追加候補"

     );

     if(arr.length>=10)

      break;

    }

    if(arr.length>=10)

     break;

   }

   if(arr.length>=10)

    break;

  }

 }

 return arr.slice(0,15);

}

/* ==================================================

   大穴

================================================== */

function buildBigHole(rank,dev,used){

 const entry=getEntry();

 const racers=getRacers(raceData);

 const candidates=

 racers

 .map(r=>{

  const boat=boatNo(r);

  const course=entry.indexOf(boat)+1;

  const value=

   roiValue(

    {

     boat,

     course,

     racer:r

    },

    rank,

    dev

   );

  const p=previewFor(r);

  const st=getST(p);

  const ex=getExhibition(p);

  const m2=num(r.motor_top_2_percent);

  return{

   boat,

   course,

   racer:r,

   value,

   st,

   ex,

   m2

  };

 })

 .sort((a,b)=>b.value-a.value);

 /*

  上位すぎる艇だけでは

  大穴にならないので

  3〜6位あたりを重点

 */

 const pool=

 candidates

 .slice(2,6)

 .filter(x=>{

  const strongST=

   x.st>0&&x.st<=.16;

  const strongEX=

   x.ex>0&&x.ex<=6.80;

  const strongM2=

   x.m2>=35;

  return strongST||strongEX||strongM2;

 });

 const arr=[];

 /*

  イン逃げ低確率なら

  積極的にイン崩れ

 */

 if(dev.nige<50){

  pool.forEach(x=>{

   const second=

    candidates.find(

     y=>y.boat!==x.boat

    );

   const third=

    candidates.find(

     y=>

      y.boat!==x.boat&&

      y.boat!==second?.boat

    );

   if(second&&third){

    const combo=

     `${x.boat}-${second.boat}-${third.boat}`;

    if(!used.includes(combo)){

     addUnique(

      arr,

      x.boat,

      second.boat,

      third.boat,

      "イン逃げ50%未満＋穴頭候補"

     );

    }

   }

  });

 }

 /*

  展開攻め手

 */

 if(dev.attacker){

  const a=dev.attacker.boat;

  const second=

   candidates.find(x=>x.boat!==a);

  const third=

   candidates.find(

    x=>x.boat!==a&&

       x.boat!==second?.boat

   );

  if(second&&third){

   const combo=

    `${a}-${second.boat}-${third.boat}`;

   if(!used.includes(combo)){

    addUnique(

     arr,

     a,

     second.boat,

     third.boat,

     "攻め手候補＋展示・ST・機力"

    );

   }

  }

 }

 /*

  さらに高配当候補

 */

 for(const a of pool){

  for(const b of candidates){

   for(const c of candidates){

    if(

     a.boat===b.boat||

     a.boat===c.boat||

     b.boat===c.boat

    )

     continue;

    const combo=

     `${a.boat}-${b.boat}-${c.boat}`;

    if(used.includes(combo))

     continue;

    addUnique(

     arr,

     a.boat,

     b.boat,

     c.boat,

     "大穴候補：AI評価＋展示＋ST＋モーター"

    );

    if(arr.length>=5)

     return arr;

   }

  }

 }

 return arr.slice(0,5);

}

/* ==================================================

   掛け金

================================================== */

function makeMoney(picks,budget,type){

 if(!picks.length)

  return[];

 let total=

 Math.floor(num(budget)/100)*100;

 if(total<100)

  total=100;

 let weights=[];

 if(type==="hit"){

  weights=

   picks.map((_,i)=>

    i<2?3:

    i<4?2:1

   );

 }else if(type==="hole"){

  weights=

   picks.map((_,i)=>

    i===0?3:

    1

   );

 }else{

  weights=

   picks.map((_,i)=>

    i<3?2:1

   );

 }

 const sum=

 weights.reduce((a,b)=>a+b,0);

 let money=

 weights.map(w=>

  Math.floor(

   total*w/sum/100

  )*100

 );

 money=

 money.map(x=>Math.max(100,x));

 let current=

 money.reduce((a,b)=>a+b,0);

 while(current>total){

  const index=

   money

   .map((x,i)=>({x,i}))

   .filter(x=>x.x>100)

   .sort((a,b)=>b.i-a.i)[0];

  if(!index)break;

  money[index.i]-=100;

  current-=100;

 }

 let i=0;

 while(current+100<=total){

  money[i%money.length]+=100;

  current+=100;

  i++;

 }

 return money;

}

function renderPickBox(

 title,

 subtitle,

 picks,

 cls,

 type,

 budget

 makeMoney(

  picks,

  budget,

  type

 );

 let html=`

 <div class="pick-box ${cls}">

   ${title}（${picks.length}点）

  </div>

  <div class="pick-sub">

 `;

  const amount=money[i]||100;

  html+=`

  <div class="pick-item">

   <div class="pick-line">

    ${i+1}.

     ${amount.toLocaleString()}円

    ${esc(p.reason)}

 });

 html+=`

 <div class="money-total">

  使用金額

  ${total.toLocaleString()}円

  ／

  予算

  ${num(budget).toLocaleString()}円

 </div>

 </div>

 `;

 return html;

}
